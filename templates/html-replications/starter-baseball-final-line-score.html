*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.osb-core-fields{display:none!important}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.teamAName:empty::before{content:"Team A"}.teamBName:empty::before{content:"Team B"}
.nm{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none;text-wrap:balance}
.slab{position:relative;flex:none;overflow:hidden}.slab>.jc{position:absolute;inset:0}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.74)}
.diamond>.base{position:absolute;width:calc(var(--d,3rem)*.25);height:calc(var(--d,3rem)*.25);transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.08rem);overflow:hidden}
.diamond>.base.second{left:37.5%;top:calc(var(--d,3rem)*.06)}.diamond>.base.third{left:7%;top:calc(var(--d,3rem)*.39)}.diamond>.base.first{left:68%;top:calc(var(--d,3rem)*.39)}
.diamond .runner{position:absolute;inset:0;background:var(--base-on,#f5cf52)}
.diamond>.base:has(>.runner[style*="opacity: 1"]){border-color:var(--base-on,#f5cf52);box-shadow:0 0 calc(var(--d,3rem)*.1) var(--base-on,#f5cf52)}
.dots{display:flex;gap:var(--dot-gap,.25rem)}
.dot{position:relative;flex:none;width:var(--dot,.82rem);height:var(--dot,.82rem);border-radius:50%;background:var(--dot-off,rgba(255,255,255,.18))}
.dot>.lit{position:absolute;inset:0;border-radius:50%;background:var(--dot-on,#f5cf52)}
.half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.half-dim{position:absolute;inset:0}
.half-dim::before,.half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.25))}
.half-dim::before,.half-dim::after{position:absolute;left:0;width:100%;height:100%}
.half-dim::before,.inningHalf::after{clip-path:polygon(50% 6%,94% 42%,6% 42%)}
.half-dim::after,.inningHalf::before{clip-path:polygon(6% 58%,94% 58%,50% 94%)}
.half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.st{position:relative;display:inline-grid;align-items:center;white-space:nowrap}
.st>*{grid-area:1/1}
.st-pre{opacity:0}.st:has(>.isMatchStarted[style*="opacity: 0"])>.st-pre{opacity:1}
.st-live-in{display:inline-flex;align-items:center;gap:.45em}.st-live-in>i{flex:none;width:.9rem;height:.9rem;border-radius:50%;background:var(--live,#ff3b30);box-shadow:0 0 .45rem var(--live,#ff3b30);animation:osb-pulse 1.4s ease-in-out infinite}
@keyframes osb-pulse{50%{opacity:.7}}
.board:has(.isComplete[style*="opacity: 1"]) .st-pre,.board:has(.isComplete[style*="opacity: 1"]) .st-live-in{visibility:hidden}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.ls{display:flex}
.ls-col{position:relative}
.ls-extra{display:none!important}.ls-extra:has(>.ls-gate[style*="opacity: 1"]){display:flex!important}
.ls-gate{display:flex;flex-direction:column;position:relative}
.ls-cur{position:absolute;inset:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.board{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:"OSB Barlow Condensed","Avenir Next Condensed","Bahnschrift SemiCondensed","Roboto Condensed","Arial Narrow",sans-serif;color:#f4f6fa;background:transparent;--live:#ff3b30;--gold:#ffc83d;--ink:#0f1a2e;--mute:#a7b3c7}
.sum{width:74rem;display:flex;flex-direction:column;gap:1.2rem;padding:2rem 2.2rem 2.2rem;border-radius:.9rem;background:linear-gradient(180deg,#16243f 0%,#0c1426 100%);box-shadow:0 1.2rem 3rem rgba(0,0,0,.45),inset 0 0 0 .08rem rgba(255,255,255,.07)}
.topr{display:flex;align-items:center;justify-content:space-between;gap:2rem;min-width:0}
.ttl{display:flex;flex-direction:column;gap:.45rem;min-width:0}
.kick{font:700 1.15rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.ev-e{font:700 2.6rem/1.04 "OSB Barlow Condensed","Avenir Next Condensed","Bahnschrift SemiCondensed","Roboto Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:normal;hyphens:none;text-wrap:balance}
.ev-r{font:700 1.6rem/1.1 "OSB Barlow Condensed","Avenir Next Condensed","Bahnschrift SemiCondensed","Roboto Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.ev-e:empty,.ev-r:empty{display:none}
.badge{flex:none;display:grid;align-items:center;justify-items:end;min-width:11rem}
.badge>*{grid-area:1/1}
.badge .st{justify-items:end;font:700 1.5rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.14em}
.badge .st-pre{padding:.55rem 1.1rem;border-radius:.3rem;box-shadow:inset 0 0 0 .12rem rgba(255,255,255,.3);color:var(--mute)}
.badge .st-live{padding:.55rem 1.1rem;border-radius:.3rem;background:rgba(255,59,48,.14);box-shadow:inset 0 0 0 .12rem rgba(255,59,48,.55)}
.badge .isComplete{padding:.6rem 1.5rem;border-radius:.3rem;background:var(--gold);color:var(--ink);font:700 2rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.18em}
/* line score */
.lsw{display:flex;border-radius:.5rem;overflow:hidden;background:#101b31;box-shadow:inset 0 0 0 .08rem rgba(255,255,255,.06)}
.ls-h{display:flex;align-items:center;justify-content:center;height:2.8rem;background:#22324f;color:#f1f4f9;font:700 1.45rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.04em}
.ls-col{display:flex;flex-direction:column;width:3.4rem;flex:none;border-left:.08rem solid rgba(255,255,255,.07)}
.ls-c,.v,.nmc{height:6.8rem}
.ls-c+.ls-c,.v+.v,.nmc+.nmc{border-top:.08rem solid rgba(255,255,255,.07)}
.ls-c{position:relative;display:flex;align-items:center;justify-content:center;font:700 2.3rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums}
.ls-cur{background:rgba(255,200,61,.12)}
.ls-col:has(>.ls-cur[style*="opacity: 1"])>.ls-h{background:var(--gold);color:var(--ink)}
.ls-extra .ls-h{color:var(--gold)}
.names{flex:1;min-width:0;display:flex;flex-direction:column;background:#0d1628}
.nmc{display:flex;align-items:stretch}
.slab{width:1.1rem;background:var(--fb)}.slab-a{--fb:#5e6b80}.slab-b{--fb:#7d8798}
.nmw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.45rem;padding:0 1rem 0 1.2rem}
.krow{display:flex;align-items:center;gap:.8rem;min-height:2.1rem}
.kk{display:grid;font:700 1.3rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}.kk>*{grid-area:1/1}

.kk>.hm{color:var(--gold)}.kk>.kv{opacity:0}
.lsw:has(.isBHome[style*="opacity: 1"]) .nm-a .kv,.lsw:has(.isAHome[style*="opacity: 1"]) .nm-b .kv{opacity:1}
.lsw:not(:has(:is(.isAHome,.isBHome)[style*="opacity: 1"])) .kk{display:none}
.nm{font:700 1.95rem/1.04 "OSB Barlow Condensed","Avenir Next Condensed","Bahnschrift SemiCondensed","Roboto Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em}
.batw{flex:none;display:grid;place-items:center start}.batw>*{grid-area:1/1}
.bat,.wtag{padding:.42rem .7rem;border-radius:.3rem;font:700 1.15rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.bat{display:flex;align-items:center;gap:.45rem;background:var(--gold);color:var(--ink)}.bat::before{content:"";width:.8rem;height:.8rem;border-radius:50%;background:var(--ink)}
.wtag{background:var(--gold);color:var(--ink)}
.tot{display:flex;border-left:.25rem solid #1e2c48}
.tot>span{display:flex;flex-direction:column;width:3.8rem}.tot>.rcol{width:5rem}
.v{position:relative;display:flex;align-items:center;justify-content:center;font:700 2.1rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;color:#b8c3d6}
.tot>span+span{border-left:.08rem solid rgba(255,255,255,.07)}
.rcol .v{color:#fff;font-size:2.9rem;background:#1a2741}
.rcol .win{position:absolute;inset:0;background:var(--gold)}.rcol .runs{position:relative}
.rcol .v:has(>.win[style*="opacity: 1"]){color:var(--ink)}
/* final: the loser's text steps back, its team colour stays */
.lsw:has(.isBWinner[style*="opacity: 1"]) .nm-a :is(.nm,.kk),.lsw:has(.isAWinner[style*="opacity: 1"]) .nm-b :is(.nm,.kk){color:#8592a8}
.lsw:has(.isBWinner[style*="opacity: 1"]) :is(.ls-c:nth-child(1 of .ls-c),.va),.lsw:has(.isAWinner[style*="opacity: 1"]) :is(.ls-c:nth-child(2 of .ls-c),.vb){color:#8592a8}
/* situation bar: four labelled zones, even widths */
.bot{position:relative;height:8.2rem;border-radius:.5rem;background:#101b31;box-shadow:inset 0 0 0 .08rem rgba(255,255,255,.06)}
.sit{display:grid;grid-template-columns:repeat(4,1fr);height:100%}
.z{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;min-width:0}
.z+.z{border-left:.08rem solid rgba(255,255,255,.09)}
.zl{font:700 1.3rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.zv{display:flex;align-items:center;justify-content:center;gap:1.2rem;height:4.4rem}
.inn{display:flex;align-items:center;gap:.3rem;font:700 3.6rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;--half-on:var(--gold);--half-off:rgba(255,255,255,.2);--half-h:3.6rem;--half-size:1.55rem}
.inn-n{min-width:1.1em;text-align:left}
.diamond{--d:5.9rem;--base-edge:rgba(230,235,243,.55);--base-off:rgba(255,255,255,.05);--base-on:var(--gold);--base-line:.18rem}
.count{font:700 3.4rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}.count .dash{opacity:.6;margin:0 .08em}
.bs{display:flex;flex-direction:column;gap:.5rem;--dot:1.5rem;--dot-gap:.35rem;--dot-off:rgba(255,255,255,.18)}
.bs>span{display:flex;align-items:center;gap:.6rem;font:700 1.55rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;color:#e4e9f1}.bs b{width:1.3rem}
.ball-dots{--dot-on:#4fdc8a}.strike-dots{--dot-on:#ff5a52}
.out-dots{--dot:1.9rem;--dot-gap:.6rem;--dot-off:rgba(255,255,255,.18);--dot-on:var(--gold)}
/* covers for the states without a live situation */
.cover{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:1.2rem;border-radius:.5rem;background:#101b31;text-transform:uppercase;white-space:nowrap}
.c-pre{z-index:2;opacity:0;font:700 2.4rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.16em;color:var(--mute)}
.board:has(.st-live[style*="opacity: 0"]):not(:has(.isComplete[style*="opacity: 1"])) .c-pre{opacity:1}
.brk{z-index:3}
.chip{padding:.6rem 1rem;border-radius:.3rem;background:var(--gold);color:var(--ink);font:700 1.6rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.14em}
.brk .pl{font:700 2.8rem/1 "OSB Barlow","DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.06em;color:#fff}
