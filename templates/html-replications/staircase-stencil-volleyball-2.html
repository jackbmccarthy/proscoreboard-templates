<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staircase Stencil Volleyball — Alternating Rows</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #f4eddf; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { box-sizing: content-box; container-type: inline-size; width: min(calc(100% - 8vw), 1100px, calc((100vh - 48px) * 1.02)); padding-inline: 4vw; min-width: 0; display: flex; flex-direction: column; background: transparent; }
.title { font-size: 4.2cqw; font-weight: 700; line-height: 1.2; text-align: center; letter-spacing: .25em; padding-left: .25em; margin-bottom: 3.5cqw; }
.teams { display: flex; flex-direction: column; min-width: 0; gap: 5cqw; }
.team { display: flex; align-items: center; min-width: 0; height: 37cqw; }
.name-color { display: block; flex: 1 1 0; min-width: 0; margin-left: 3cqw; background-color: #d87551; background-clip: text; -webkit-background-clip: text; }
.team-b .name-color { margin-left: 4.5cqw; text-align: right; }
.name { display: block; width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14cqw; font-weight: 800; line-height: 1; color: transparent; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.score-group { display: flex; align-items: flex-end; flex: 0 0 44cqw; min-width: 0; }
.register { display: flex; align-items: center; min-width: 0; flex: 0 0 14cqw; margin-right: -10cqw; gap: 1.3cqw; padding-bottom: .1cqw; font-size: 3.2cqw; font-weight: 700; line-height: 1; }
.match-score { display: block; width: 3.6cqw; min-width: 0; text-align: center; font-variant-numeric: tabular-nums; }
.primary-track { display: flex; flex-direction: column; align-items: center; flex: 0 0 48cqw; min-width: 0; margin-left: -4cqw; margin-right: -4cqw; }
.primary-score { display: flex; align-items: center; justify-content: center; width: 100%; min-width: 0; height: 30cqw; font-family: "Arial Black", Arial, sans-serif; font-size: 35.8cqw; font-weight: 900; line-height: 1; letter-spacing: normal; font-variant-numeric: tabular-nums; mask-image: linear-gradient(to bottom, #000 0 32%, transparent 32% 36%, #000 36% 66%, transparent 66% 70%, #000 70% 100%); -webkit-mask-image: linear-gradient(to bottom, #000 0 32%, transparent 32% 36%, #000 36% 66%, transparent 66% 70%, #000 70% 100%); }
.points-label { display: block; margin-top: .6cqw; text-align: center; font-size: 3.6cqw; font-weight: 700; line-height: 1; }
.set-footer { display: flex; align-items: center; justify-content: center; min-width: 0; gap: 2cqw; margin-top: 5cqw; font-size: 4cqw; font-weight: 700; line-height: 1; letter-spacing: .08em; }
.set-value { display: block; width: 4.5cqw; min-width: 0; text-align: center; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .title { font-size: 23px; margin-bottom: 27px; letter-spacing: .13em; }
  .name-color { margin-left: 5px; }
  .name { font-size: 34px; }
  .register { font-size: 12px; gap: 3px; }
  .match-score { width: 13px; }
  .points-label { font-size: 13px; }
  .teams { gap: 35px; }
  .set-footer { font-size: 22px; gap: 8px; margin-top: 27px; }
  .set-value { width: 24px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-color jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="score-group rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="register rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span>SETS</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="points-label">POINTS</span></div></div></div>
        <div class="team team-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="score-group rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="register rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span>SETS</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="points-label">POINTS</span></div></div><div class="name-color jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div></div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
