<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Ivory Moss Scorefront compact</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#273643}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(74vw,1500px);max-width:100%;min-width:0;overflow:hidden;border:1px solid #aeb8b5;border-radius:4px;background:#f0eee8;container-type:inline-size}
.header{display:flex;align-items:center;justify-content:space-between;flex:none;height:6.3cqw;min-width:0;padding:0 2.3cqw;background:#303f57;color:#fbfbf8}
.sport-tag{display:block;flex:none;color:#fbfbf8;font-size:3.3cqw;font-weight:800;line-height:1;white-space:nowrap}
.stats{display:flex;align-items:stretch;justify-content:flex-end;min-width:0;height:64%}
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;min-width:0;padding:0 1.7cqw;color:#fbfbf8;font-size:1.35cqw;font-weight:700;line-height:1;white-space:nowrap}
.stat+.stat{border-left:1px solid #b8c7c0}.stat strong{font-size:2.3cqw;font-variant-numeric:tabular-nums}
.competitors{display:flex;flex-direction:column;min-width:0}
.competitor{display:flex;align-items:stretch;min-width:0;height:9.15cqw;background:#f0eee8}
.competitor+.competitor{border-top:1px solid #aeb8b5}
.identity{display:block;flex:none;width:2.2%;height:100%;background:#288ce8}
.jerseyColorB{background:#f36b5f}
.score-track{display:flex;align-items:center;justify-content:center;gap:1.3cqw;flex:0 0 18%;min-width:0;background:#f0eee8;color:#273643}
.score{display:block;max-width:68%;overflow:hidden;color:#273643;font-size:6cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.score-label{display:block;color:#566675;font-size:1.7cqw;font-weight:700;line-height:1;white-space:nowrap}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2.8cqw;color:#273643;font-size:5cqw;font-weight:800;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.hits-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 14%;min-width:0;background:#d9e0d3;color:#273643}
.hit-value{display:block;max-width:100%;overflow:hidden;color:#273643;font-size:4.4cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.hits-label{display:block;color:#566675;font-size:1.7cqw;font-weight:700;line-height:1;white-space:nowrap}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%}.header{height:50px;padding:0 6px;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}.sport-tag{font-size:11px}.stats{height:auto;justify-content:space-between}.stat{font-size:8px;gap:1px;padding:0 3px}.stat strong{font-size:10px}.competitor{height:76px}.identity{width:4px}.score-track{flex-basis:25%}.score{font-size:clamp(24px,7vw,34px)}.score-label{font-size:9px}.name{font-size:clamp(18px,5vw,26px);padding:0 7px}.hits-cell{flex-basis:22%}.hit-value{font-size:23px}.hits-label{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Softball scoreboard">
<div class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">SOFTBALL</span><div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static softball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="competitors columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong><span class="score-label" data-osb-component="text">RUNS</span></div><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="hits-cell columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="hit-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong><span class="hits-label" data-osb-component="text">HITS</span></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong><span class="score-label" data-osb-component="text">RUNS</span></div><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="hits-cell columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="hit-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong><span class="hits-label" data-osb-component="text">HITS</span></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
<div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div></article></main></body></html>
