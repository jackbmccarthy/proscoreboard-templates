<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleball — Maroon Frost Matchline Lower Third</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--frost:#e9edef;--maroon:#572f3c;--ink:#26343b;--white:#f8f6f2;--rule:#bec8cb;display:flex;flex-direction:column;width:min(84.4vw,1730px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:4px;background:var(--frost);color:var(--ink);container-type:inline-size}
.matchline{position:relative;display:flex;flex:0 0 auto;height:3.3cqw;align-items:center;padding:0 1.8cqw;background:var(--maroon);color:var(--white);font-size:1.9cqw;line-height:1;font-weight:700;white-space:nowrap}
.sides{display:flex;min-width:0}
.side{display:flex;flex:1 1 50%;min-width:0;min-height:10.7cqw;align-items:stretch}
.side+.side{border-left:1px solid #8ea5ad}
.identity{display:block;flex:0 0 3.5%;width:3.5%;background:#287d9d}
.jerseyColorB{background:#c45f65}
.namefoot{display:flex;flex:1 1 auto;min-width:0;flex-direction:column;justify-content:center;gap:.45cqw;padding:0 1.8cqw}
.name-row{display:flex;min-width:0;align-items:center;gap:.5cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:4.1cqw;line-height:1.05;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .4cqw;width:.4cqw;height:.4cqw;min-width:5px;min-height:5px;border-radius:50%;background:var(--ink)}
.games{display:flex;min-width:0;align-items:baseline;gap:.6cqw;line-height:1}
.games-score{display:block;font-size:2.5cqw;font-weight:700;font-variant-numeric:tabular-nums}.games-label{display:block;font-size:1.75cqw;font-weight:700;white-space:nowrap}
.scorecap{display:flex;flex:0 0 27%;width:27%;min-width:0;flex-direction:column;align-items:center;justify-content:center;background:var(--maroon);color:var(--white)}
.primary-score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:5.8cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.primary-label{display:block;font-size:1.55cqw;line-height:1;font-weight:700}
.point-slot{position:absolute;right:1%;top:0;width:16%;height:100%;font-size:.8cqw;font-weight:700;text-align:center}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--maroon)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.matchline{height:28px;padding:0 7px;font-size:12px}.side{min-height:87px}.identity{flex-basis:5px;width:5px}.namefoot{gap:3px;padding:0 4px}.name-row{gap:2px}.name{font-size:13px}.serve{flex-basis:5px;width:5px;height:5px}.games{gap:2px}.games-score{font-size:14px}.games-label{font-size:8px}.scorecap{flex-basis:32%;width:32%}.primary-score{font-size:31px}.primary-label{font-size:8px}.point-slot{font-size:6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="matchline"><span>PICKLEBALL</span><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div><div class="sides rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="side rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="namefoot"><div class="name-row"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="games"><span class="games-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="games-label">GAMES</span></div></div><div class="scorecap"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-label">POINTS</span></div></div><div class="side rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="namefoot"><div class="name-row"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="games"><span class="games-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="games-label">GAMES</span></div></div><div class="scorecap"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-label">POINTS</span></div></div></div></article></main></body></html>
