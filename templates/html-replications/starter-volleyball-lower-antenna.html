<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volleyball Antenna</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1;position:relative}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.18)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing,.ldot{animation:none!important;transition:none!important}}
.nm{display:block;min-width:0;overflow-wrap:normal;word-break:normal;hyphens:none;line-height:1.02}
.bal{text-wrap:balance}
.st,.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hv{position:relative;display:inline-grid;place-items:center}.hv>*{grid-area:1/1}.hv>.w{display:block;align-self:stretch;justify-self:stretch}.hv>.num{position:relative}
.ev,.rd{white-space:nowrap}
.hc:not([style*="opacity: 1"]),.cell:not([style*="opacity: 1"]){display:none}
.vball{display:block;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 14%,transparent 34%),conic-gradient(from 30deg,#ffd23f 0 120deg,#2a5bd7 0 240deg,#f6f7fb 0);box-shadow:inset 0 0 0 .12rem #0006,0 0 .4rem #0006}
.pball{display:block;border-radius:50%;background:radial-gradient(circle at 30% 34%,#0005 0 8%,transparent 9%),radial-gradient(circle at 64% 30%,#0005 0 8%,transparent 9%),radial-gradient(circle at 52% 64%,#0005 0 8%,transparent 9%),radial-gradient(circle at 24% 72%,#0004 0 6%,transparent 7%),radial-gradient(circle at 78% 70%,#0004 0 6%,transparent 7%),radial-gradient(circle at 36% 30%,#fbffb4,#d8f22c 60%,#a6c214);box-shadow:0 0 0 .15rem #0b1a12,0 0 .4rem #0007}

.stage{position:fixed;left:6.4rem;bottom:4.6rem}
.board{position:relative;display:flex;align-items:stretch;font-family:"DIN Condensed","Bahnschrift SemiBold Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;color:#111;filter:drop-shadow(0 .5rem 1.2rem #0009)}
.teams{width:50rem;display:flex;flex-direction:column;background:#fff}.teams>.r{flex:1}
.r{position:relative;display:flex;align-items:stretch;min-height:6rem}.rB{border-top:.1rem solid #dde1e8}
.chip{width:1rem;flex:none}.chipA{background:#1f5fd6}.chipB{background:#d8262e}
.who{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.5rem;padding:.6rem .8rem .2rem 1.2rem}
.nm{font-size:2.7rem;font-weight:700;text-transform:uppercase}
.pips{display:flex;gap:.4rem}.pip{position:relative;display:block;width:2.4rem;height:.8rem;border-radius:.1rem;box-shadow:inset 0 0 0 .15rem #9aa3b3}.pip>.lit{position:absolute;inset:0;border-radius:inherit;background:#d8262e}
.sv{width:3.4rem;flex:none;place-items:center}.vball{width:2.4rem;height:2.4rem}
.win{display:grid;place-items:center;width:2.7rem;height:2.7rem;border-radius:50%;background:#d8262e;color:#fff;font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:1.8rem;font-weight:900}
.setbox{width:5.4rem;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;background:#eef0f4}
.setbox>i{font-style:normal;font-size:1.6rem;letter-spacing:.08em;color:#6b7383;padding-top:.2rem}
.sets{color:#d8262e;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.9rem;font-weight:700;line-height:1}
.pts{width:7.6rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.35rem;background:#12151c;color:#fff;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4.4rem;font-weight:700}
.rB .pts{border-top:.1rem solid #2a2f3a}
.tob{position:absolute;left:1rem;top:0;bottom:0;right:13rem;display:flex;align-items:center;gap:.8rem;padding:.35rem 1.4rem 0;background:#ffcf33;color:#12151c;font-size:2.1rem;letter-spacing:.06em;white-space:nowrap}.tob em{font-style:normal}.tob b{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.6rem}
.ant{width:1.2rem;flex:none;background:repeating-linear-gradient(180deg,#d8262e 0 1.5rem,#fff 1.5rem 3rem);box-shadow:inset .15rem 0 0 #0002,inset -.15rem 0 0 #0002}
.panel{width:30rem;display:flex;flex-direction:column;background:#12151c;color:#fff}
.sslot{height:6.4rem;flex:none}.sslot>.st{padding:.5rem 1.4rem 0;font-size:3rem;letter-spacing:.06em;justify-content:flex-start;background:#12151c}
.sslot .num{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-weight:700;margin-left:.6rem;color:#ffcf33}
.sslot>.sdec{background:#d8262e}.sslot>.sbrk{background:#2b3140}.sslot>.sfin{background:#fff;color:#12151c}
.sslot>.gp{background:#ffcf33;color:#12151c}.sslot>.mp{background:#d8262e;color:#fff;box-shadow:inset 0 -.5rem 0 #ffcf33}
.hrow{display:flex;align-items:center;min-height:2.8rem;padding:0 .6rem;background:#1b1f29}
.hist{display:flex;align-items:center}
.hc{display:flex;align-items:center;gap:.25rem;padding:.35rem .8rem 0;font-size:1.7rem}.hc+.hc{border-left:.1rem solid #ffffff1c}
.hc .hl{color:#8a93a5;margin-right:.3rem;white-space:nowrap}.hc .num{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:1.9rem}.hc .hd{font-style:normal;color:#8a93a5}
.ctx{display:block;margin-top:auto;padding:.9rem 1.4rem .7rem;font-size:1.6rem;letter-spacing:.07em;text-transform:uppercase;color:#a5adbd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}.ctx .sep{font-style:normal;color:#d8262e;margin:0 .5rem}
.board:not(:has(.isGame2Started[style*="opacity: 1"])) .hrow,.board:not(:has(.isGame2Started[style*="opacity: 1"])) .hrow .hist{height:0!important;min-height:0!important;padding-top:0!important;padding-bottom:0!important;margin-top:0!important;margin-bottom:0!important;border-width:0!important;overflow:hidden!important;align-items:flex-start!important;box-shadow:none!important;background:none!important}

.hist>.hc[style*="opacity: 1"]:not(:has(~.hc[style*="opacity: 1"])){max-width:1px!important;min-width:0!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden;color:transparent!important;background:none!important;box-shadow:none!important}.hist>.hc[style*="opacity: 1"]:not(:has(~.hc[style*="opacity: 1"])) *{color:transparent!important;background:none!important;box-shadow:none!important;border-color:transparent!important}
.board:not(:has(.isGame2Started[style*="opacity: 1"])) .hist,.board:not(:has(.isGame2Started[style*="opacity: 1"])) .hist .hist{height:0!important;min-height:0!important;padding-top:0!important;padding-bottom:0!important;margin-top:0!important;margin-bottom:0!important;border-width:0!important;overflow:hidden!important;align-items:flex-start!important;box-shadow:none!important;background:none!important}
.hc .hv{padding:.15rem .45rem 0;border-radius:.2rem}
.hc .hv>.w{border-radius:.2rem;background:#ffcf33;margin:-.15rem -.45rem 0}
.hc .hv:has(>.w[style*="opacity: 1"])>.num{color:#12151c}
.hc:has(.w[style*="opacity: 1"]) .hv:not(:has(>.w[style*="opacity: 1"]))>.num{color:#8a93a5}
.board:has(.isGame1AWon[style*="opacity: 1"]):not(:has(.isGame2Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame2AWon[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame3AWon[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame4AWon[style*="opacity: 1"]):not(:has(.isGame5Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame5AWon[style*="opacity: 1"]) .ptsA,.board:has(.isGame1BWon[style*="opacity: 1"]):not(:has(.isGame2Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame2BWon[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame3BWon[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame4BWon[style*="opacity: 1"]):not(:has(.isGame5Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame5BWon[style*="opacity: 1"]) .ptsB{color:#ffcf33}
.board:has(.isGame1AWon[style*="opacity: 1"]):not(:has(.isGame2Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame2AWon[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame3AWon[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame4AWon[style*="opacity: 1"]):not(:has(.isGame5Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame5AWon[style*="opacity: 1"]) .ptsA,.board:has(.isGame1BWon[style*="opacity: 1"]):not(:has(.isGame2Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame2BWon[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame3BWon[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame4BWon[style*="opacity: 1"]):not(:has(.isGame5Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame5BWon[style*="opacity: 1"]) .ptsB{background:#d8262e;color:#fff}
.board:has(.isAWinner[style*="opacity: 1"]) .rA .setbox,.board:has(.isBWinner[style*="opacity: 1"]) .rB .setbox{background:#d8262e}
.board:has(.isAWinner[style*="opacity: 1"]) .rA .setbox>*,.board:has(.isBWinner[style*="opacity: 1"]) .rB .setbox>*{color:#fff}
.board:has(.isAWinner[style*="opacity: 1"]) :is(.rB .who,.rB .setbox,.rB .pts),.board:has(.isBWinner[style*="opacity: 1"]) :is(.rA .who,.rA .setbox,.rA .pts){opacity:0.4}
</style>
</head>
<body>
<main class="stage"><section class="board" data-osb-component="layout" data-osb-component-type="osb-row-container">
<div class="teams" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="r rA" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip chipA jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="who"><span class="nm bal combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="pips"><i class="pip"><b class="lit isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity:0"></b></i></span></span><span class="slot sv"><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="vball"></i></span><span class="win winA isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity:0"><b>&#10003;</b></span></span><span class="setbox"><i>SETS</i><span class="sets num setsA setsWonA currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span><span class="pts num ptsA currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="tob tobA isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="num tclock timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</b></span></div><div class="r rB" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip chipB jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="who"><span class="nm bal combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="pips"><i class="pip"><b class="lit isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity:0"></b></i></span></span><span class="slot sv"><span class="srv isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"><i class="vball"></i></span><span class="win winB isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity:0"><b>&#10003;</b></span></span><span class="setbox"><i>SETS</i><span class="sets num setsB setsWonB currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span><span class="pts num ptsB currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="tob tobB isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="num tclock timeOutTimerB" data-osb-component="field" data-osb-field="timeOutTimerB">0</b></span></div></div>
<i class="ant"></i>
<div class="panel" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="slot sslot pslot"><span class="st sset">SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sdec isDecidingSet" data-osb-component="field" data-osb-field="isDecidingSet" style="opacity:0">DECIDING SET</span><span class="st sbrk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">END OF SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sfin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">FINAL</span><span class="st pt gp isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">SET POINT</span><span class="st pt mp isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><div class="hrow" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="hist"><span class="hc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><b class="hl">SET 1</b><span class="hv a"><i class="w isGame1AWon" data-osb-component="field" data-osb-field="isGame1AWon" style="opacity:0"></i><span class="num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span><i class="hd">-</i><span class="hv b"><i class="w isGame1BWon" data-osb-component="field" data-osb-field="isGame1BWon" style="opacity:0"></i><span class="num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></span><span class="hc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><b class="hl">SET 2</b><span class="hv a"><i class="w isGame2AWon" data-osb-component="field" data-osb-field="isGame2AWon" style="opacity:0"></i><span class="num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span><i class="hd">-</i><span class="hv b"><i class="w isGame2BWon" data-osb-component="field" data-osb-field="isGame2BWon" style="opacity:0"></i><span class="num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></span><span class="hc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><b class="hl">SET 3</b><span class="hv a"><i class="w isGame3AWon" data-osb-component="field" data-osb-field="isGame3AWon" style="opacity:0"></i><span class="num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span><i class="hd">-</i><span class="hv b"><i class="w isGame3BWon" data-osb-component="field" data-osb-field="isGame3BWon" style="opacity:0"></i><span class="num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></span><span class="hc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><b class="hl">SET 4</b><span class="hv a"><i class="w isGame4AWon" data-osb-component="field" data-osb-field="isGame4AWon" style="opacity:0"></i><span class="num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span><i class="hd">-</i><span class="hv b"><i class="w isGame4BWon" data-osb-component="field" data-osb-field="isGame4BWon" style="opacity:0"></i><span class="num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></span><span class="hc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><b class="hl">SET 5</b><span class="hv a"><i class="w isGame5AWon" data-osb-component="field" data-osb-field="isGame5AWon" style="opacity:0"></i><span class="num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span><i class="hd">-</i><span class="hv b"><i class="w isGame5BWon" data-osb-component="field" data-osb-field="isGame5BWon" style="opacity:0"></i><span class="num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></span></span></div><span class="ctx"><span class="ev eventName" data-osb-component="field" data-osb-field="eventName"></span><i class="sep">&middot;</i><span class="rd matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span></div>
<span class="osb-core-fields"><span class="num timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA">0</span><span class="num timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB">0</span></span></section></main>
</body>
