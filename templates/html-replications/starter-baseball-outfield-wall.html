<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Outfield Wall</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.osb-core-fields{display:none!important}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.nm{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none;text-wrap:balance}
.slab{position:relative;flex:none;overflow:hidden}.slab>.jc{position:absolute;inset:0}
.slab>.home{position:absolute;left:50%;bottom:.35rem;width:.8rem;height:.82rem;margin-left:-.4rem;background:#fff;clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.72)}
.diamond>.base{position:absolute;width:calc(var(--d,3rem)*.3);height:calc(var(--d,3rem)*.3);transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.08rem);overflow:hidden}
.diamond>.base.second{left:35%;top:calc(var(--d,3rem)*.082)}.diamond>.base.third{left:10%;top:calc(var(--d,3rem)*.332)}.diamond>.base.first{left:60%;top:calc(var(--d,3rem)*.332)}
.diamond .runner{position:absolute;inset:0;background:var(--base-on,#f5cf52)}
.dots{display:flex;gap:var(--dot-gap,.25rem)}
.dot{position:relative;flex:none;width:var(--dot,.82rem);height:var(--dot,.82rem);border-radius:50%;background:var(--dot-off,rgba(255,255,255,.18))}
.dot>.lit{position:absolute;inset:0;border-radius:50%;background:var(--dot-on,#f5cf52)}
.half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.half-dim{position:absolute;inset:0}
.half-dim::before,.half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.25))}
.half-dim::before,.half-dim::after{position:absolute;left:0;width:100%;height:100%}
.half-dim::before,.inningHalf::after{clip-path:polygon(50% 6%,94% 42%,6% 42%)}
.half-dim::after,.inningHalf::before{clip-path:polygon(6% 58%,94% 58%,50% 94%)}
.half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inn-n{min-width:1.1em;text-align:left}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.ev{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.5em;overflow-wrap:normal;word-break:normal;hyphens:none}
.ev-e:empty,.ev-r:empty{display:none}.ev-e:has(+.ev-r:not(:empty))::after{content:"\00b7";margin-left:.5em;opacity:.75}
.st{position:relative;display:inline-grid;align-items:center;justify-items:end;white-space:nowrap}
.st>*{grid-area:1/1}
.st-pre{opacity:0}.st:has(>.isMatchStarted[style*="opacity: 0"])>.st-pre{opacity:1}
.st-live-in{display:inline-flex;align-items:center;gap:.4em}.st-live-in>i{flex:none;width:.8rem;height:.8rem;border-radius:50%;background:var(--live,#ff3b30);box-shadow:0 0 .45rem var(--live,#ff3b30);animation:osb-pulse 1.4s ease-in-out infinite}
@keyframes osb-pulse{50%{opacity:.7}}
.board:has(.isComplete[style*="opacity: 1"]) .st-pre,.board:has(.isComplete[style*="opacity: 1"]) .st-live-in{visibility:hidden}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.ls{display:flex}
.ls-col{position:relative}
.ls-extra{display:none!important}.ls-extra:has(>.ls-gate[style*="opacity: 1"]){display:flex!important}
.ls-gate{display:flex;flex-direction:column;position:relative}
.ls-c{position:relative;display:flex;align-items:center;justify-content:center}

.ls-cur{position:absolute;inset:0;pointer-events:none}
.tick{position:relative}.tick>.tick-on,.tick>.tick-cur{position:absolute;inset:0;border-radius:inherit}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.board{position:fixed;left:2rem;top:1.6rem;color:#f5f3ea;font-family:"DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;--live:#ff5a45}
.wall{width:28rem;padding:.6rem .7rem .55rem;border-radius:.35rem;background:#1f4d33;box-shadow:0 .45rem 1.2rem rgba(0,0,0,.5),inset 0 0 0 .2rem #163a26}
.topr{display:flex;align-items:center;justify-content:space-between;gap:.8rem;min-height:1.6rem;padding:0 .2rem;font:700 1.1rem/1.1 "DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#c9d8c6}
.topr .st{flex:none;color:#f5f3ea}
.grid{display:grid;grid-template-columns:1fr 1.5rem 3.6rem 2.5rem 2.5rem;column-gap:.32rem;align-items:center;margin-top:.3rem}
.colh{height:1.4rem;display:flex;align-items:flex-end;justify-content:center;font:700 1.1rem/1 "DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;letter-spacing:.1em;color:#c9d8c6}
.tm{display:contents}
.nmw{min-width:0;display:flex;align-items:center;gap:.7rem;height:3.2rem}
.slab{align-self:stretch;width:1.1rem;border-radius:.12rem;background:var(--fb)}.slab-a{--fb:#5d7a66}.slab-b{--fb:#87a08d}
.nm{font:700 1.6rem/.98 "DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;letter-spacing:.035em;text-transform:uppercase;padding-top:.15rem}
.sep{grid-column:1/-1;height:.1rem;margin:.28rem 0;background:#163a26}
.batw{display:flex;justify-content:center}.bat{width:.85rem;height:.85rem;border-radius:50%;background:#ffc93c;box-shadow:0 0 .5rem #ffc93c}
.cell{position:relative;display:flex;align-items:center;justify-content:center;height:2.9rem;background:#10291c;border-radius:.14rem;box-shadow:inset 0 .14rem .3rem rgba(0,0,0,.55);font:700 1.6rem/1 "DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.cell>span{padding-top:.18rem}
.cell.rc{height:3.2rem;font-size:2.5rem;color:#ffd34d}
.rc>.win{position:absolute;inset:0;border-radius:.14rem;box-shadow:inset 0 0 0 .2rem #ffc93c,0 0 .6rem #ffc93c}
.wall:has(.isBWinner[style*="opacity: 1"]) .tm-a :is(.nm,.runs,.he,.slab),.wall:has(.isAWinner[style*="opacity: 1"]) .tm-b :is(.nm,.runs,.he,.slab){opacity:.45}
.lamps{position:relative;display:flex;align-items:center;justify-content:space-between;margin-top:.55rem;height:4.1rem;padding:0 .8rem;background:#10291c;border-radius:.15rem;box-shadow:inset 0 .14rem .3rem rgba(0,0,0,.55)}
.lg{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;font:700 1rem/1 "DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;letter-spacing:.12em;color:#c9d8c6}
.lamps .dots{--dot:.85rem;--dot-gap:.3rem;--dot-off:rgba(255,255,255,.12);--dot-on:#ffc93c}
.lamps .ball-dots{--dot-on:#7be08f}.lamps .strike-dots{--dot-on:#ff6a55}
.lamps .dot>.lit{box-shadow:0 0 .45rem var(--dot-on)}

.inn{display:flex;align-items:center;gap:.2rem;font:700 2.3rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;--half-on:#ffc93c;--half-off:rgba(255,255,255,.12);--half-h:2.3rem;--half-size:1.01rem}
.diamond{--d:3.7rem;--base-edge:#f5f3ea;--base-off:transparent;--base-on:#ffc93c;--base-line:.14rem}
.cnt{display:flex;flex-direction:column;align-items:center;gap:.32rem}
.count{font:700 1.6rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}.count .dash{opacity:.6;margin:0 .08em}
.bs{display:flex;gap:.5rem;--dot:0.82rem;--dot-gap:.2rem;--dot-off:undefined}.ball-dots{--dot-on:#7be08f}.strike-dots{--dot-on:#ff6a55}
.outw{display:flex;flex-direction:column;align-items:center;gap:.32rem;--dot:0.9rem;--dot-gap:.3rem;--dot-off:undefined;--dot-on:undefined}
.outs-l{font:700 1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.12em;color:#c9d8c6}
.inn{font-family:"DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;padding-top:.15rem}

.cover{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:.6rem;background:#10291c;text-transform:uppercase;text-align:center;white-space:nowrap}
.cover b{font:700 1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.16em;color:#c9d8c6}
.cover .pl{font:700 1.8rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.05em;color:#f5f3ea}
.cover.fin{font:700 1.98rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.14em;color:#ffc93c}
.cover{border-radius:.15rem}.cover b,.cover .pl,.cover.fin{font-family:"DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif}.cover.fin{color:#ffc93c}
.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:.5rem;font:700 1.05rem/1 "DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;letter-spacing:.16em;color:#ffc93c}
.foot .sp{justify-self:end}
.ticks{grid-column:2;display:flex;gap:.26rem}.tick{width:1.15rem;height:.28rem;border-radius:.14rem;background:rgba(255,255,255,.12)}
.tick>.tick-on{background:rgba(255,255,255,.45)}.tick>.tick-cur{background:#ffc93c}

ic="true" data-sport-stat="hitsB">0</span></span><span class="cell"><span class="he errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></span></span></div>

" data-osb-field="isInBetweenGames" style="opacity: 0"><b>End of</b><span class="pl periodLabel" data-osb-component="field" data-osb-field="periodLabel"></span></span><span class="cover fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0"><span>Final</span></span></div>

ss="tick"><span class="tick-on isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity: 0"></span><span class="tick-cur isInning8Current" data-osb-component="field" data-osb-field="isInning8Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame9Started" data-osb-component="field" data-osb-field="isGame9Started" style="opacity: 0"></span><span class="tick-cur isInning9Current" data-osb-component="field" data-osb-field="isInning9Current" style="opacity: 0"></span></span></span><i></i></div>
