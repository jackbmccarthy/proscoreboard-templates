<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Fenway Outfield Wall</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.bb-retained{display:none}
.bb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.8)}
.diamond>.base{position:absolute;width:30%;height:37.5%;transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.06rem)}
.diamond>.base.second{left:35%;top:10%}.diamond>.base.third{left:8%;top:44%}.diamond>.base.first{left:62%;top:44%}
.diamond::before{content:"";position:absolute;left:calc(var(--d,3rem)*.309);top:calc(var(--d,3rem)*.311);width:calc(var(--d,3rem)*.382);height:calc(var(--d,3rem)*.382);transform:rotate(45deg);border:1px solid var(--base-edge,currentColor);opacity:.28}
.bb-plate{display:none}
.bb-bases{position:absolute;left:0;right:0;bottom:-.1rem;text-align:center;font:700 .42rem/1 var(--mono-ui,Menlo,Consolas,monospace);letter-spacing:.04em;color:var(--base-text,currentColor);opacity:.85}
.bb-half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.bb-half-dim{position:absolute;inset:0}
.bb-half-dim::before,.bb-half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.28))}
.bb-half-dim::before,.bb-half-dim::after{position:absolute;left:0;width:100%;height:100%}
.bb-half-dim::before,.inningHalf::after{clip-path:polygon(50% 4%,96% 40%,4% 40%)}
.bb-half-dim::after,.inningHalf::before{clip-path:polygon(4% 60%,96% 60%,50% 96%)}
.bb-half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.bb-ls-col>.bb-gate{display:flex;flex-direction:column;align-items:stretch}
.bb-tick{position:relative}.bb-tick>.bb-gate{display:block;position:absolute;inset:0;border-radius:inherit;background:var(--tick-on,#fff)}
.bb-ls-extra{display:none!important}.bb-ls-extra:has(>.bb-gate[style*="opacity: 1"]),.bb-ls-extra:has(>.bb-gate[style*="opacity:1"]){display:flex!important}
.bb-live,.bb-break,.bb-final{transition:opacity .25s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.bb-stage{position:fixed;left:2rem;top:1.6rem;font-family:"DIN Condensed","Bahnschrift SemiBold Condensed","Oswald",Impact,"Arial Narrow",sans-serif;color:#eef0e3}
.ow{padding:.45rem .55rem .5rem;border-radius:.2rem;background:#1f4b35;border:.18rem solid #163826;box-shadow:0 .3rem .8rem rgba(0,0,0,.4),inset 0 0 0 .1rem rgba(0,0,0,.25)}
.ow-top{display:flex;justify-content:space-between;gap:.5rem;padding-bottom:.3rem;font:700 .55rem/1 "DIN Condensed","Bahnschrift SemiBold Condensed","Oswald",Impact,"Arial Narrow",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#eef0e3}
.ow-top>span{display:flex;gap:.35rem}.ow-top .bb-round:not(:empty)::before{content:"•";margin-right:.35rem}
.ow-grid{display:grid;grid-template-columns:auto auto;gap:.45rem}
.ow-teams{display:flex;flex-direction:column;gap:.25rem}
.ow-row{display:flex;align-items:center;gap:.35rem}
.ow-row .bb-jersey{width:.55rem;height:1.75rem;background:#eef0e3;border:1px solid rgba(0,0,0,.35)}
.ow-row .bb-name{width:8.4rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:1.15rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ow-tile{display:inline-flex;align-items:center;justify-content:center;min-width:1.75rem;height:1.75rem;padding:0 .15rem;background:#121512;color:#f3f1e4;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 -.12rem 0 rgba(255,255,255,.06);font:700 1.3rem/1 "DIN Condensed","Bahnschrift SemiBold Condensed","Oswald",Impact,"Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.ow-row .bb-runs{min-width:2.2rem;color:#f2c94c}
.ow-he{display:flex;gap:.15rem}.ow-he .ow-tile{min-width:1.3rem;height:1.3rem;font-size:.95rem;align-self:center}
.ow-heads{display:flex;justify-content:flex-end;gap:.15rem;padding-right:0;font:700 .5rem/1 "DIN Condensed","Bahnschrift SemiBold Condensed","Oswald",Impact,"Arial Narrow",sans-serif;letter-spacing:.12em}
.ow-heads>span{width:1.3rem;text-align:center}.ow-heads>span:first-child{width:2.2rem;margin-right:.2rem}
.ow-side{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:.25rem;padding-left:.45rem;border-left:.12rem solid rgba(0,0,0,.25)}
.ow-bso{display:grid;grid-template-columns:repeat(3,auto);gap:.15rem .2rem;text-align:center;font:700 .5rem/1 "DIN Condensed","Bahnschrift SemiBold Condensed","Oswald",Impact,"Arial Narrow",sans-serif;letter-spacing:.12em}
.ow-bso .ow-tile{min-width:1.3rem;height:1.45rem;font-size:1rem}
.ow-bso .bb-count,.ow-bso .bb-outs{display:contents}.bb-dash,.bb-outs-label{display:none}
.ow-low{display:flex;align-items:center;gap:.45rem}
.bb-inning{display:flex;align-items:center;gap:.2rem;--half-on:#f2c94c;--half-off:rgba(255,255,255,.22);--half-h:1.2rem;--half-size:.5rem}
.bb-inning .bb-inning-no{display:inline-flex;align-items:center;justify-content:center;min-width:1.4rem;height:1.45rem;background:#121512;color:#f3f1e4;font:700 1rem/1 "DIN Condensed","Bahnschrift SemiBold Condensed","Oswald",Impact,"Arial Narrow",sans-serif}
.ow-side .diamond{--d:2.5rem;--base-edge:#eef0e3;--base-off:transparent;--base-line:.09rem;--base-text:#eef0e3}
.ow-foot{display:flex;align-items:center;justify-content:space-between;padding-top:.3rem;font:700 .45rem/1 "DIN Condensed","Bahnschrift SemiBold Condensed","Oswald",Impact,"Arial Narrow",sans-serif;letter-spacing:.16em}
.ow-foot .bb-track{display:flex;gap:.12rem}
.bb-tick{width:.42rem;height:.42rem;background:#121512;--tick-on:#f2c94c}
.bb-live{color:#f2c94c}
.bb-break{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#1f4b35;font:700 .7rem/1.2 "DIN Condensed","Bahnschrift SemiBold Condensed","Oswald",Impact,"Arial Narrow",sans-serif;letter-spacing:.14em}
</style></head><body><main class="bb-stage" aria-label="Baseball corner scoreboard">
<article class="ow columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Baseball outfield wall scoreboard">
<div class="ow-top"><span><span class="bb-event eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="bb-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span class="bb-live isMatchStarted" data-osb-component="field" style="opacity: 0">LIVE</span></div>
<div class="ow-grid"><div class="ow-teams"><div class="ow-heads"><span>R</span><span>H</span><span>E</span></div>
<div class="ow-row"><span class="bb-jersey jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="bb-name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="bb-runs ow-tile currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="ow-he"><span class="ow-tile"><span class="bb-h hitsA" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span></span><span class="ow-tile"><span class="bb-e errorsA" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsA">0</span></span></span></div>
<div class="ow-row"><span class="bb-jersey jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="bb-name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="bb-runs ow-tile currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="ow-he"><span class="ow-tile"><span class="bb-h hitsB" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span></span><span class="ow-tile"><span class="bb-e errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></span></span></div></div>
<div class="ow-side"><div class="ow-bso"><span>B</span><span>S</span><span>O</span><span class="bb-count"><span class="bb-b ow-tile balls" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span><span class="bb-dash" aria-hidden="true">-</span><span class="bb-s ow-tile strikes" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span><span class="bb-outs"><span class="bb-o ow-tile outs" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span><span class="bb-outs-label">OUT</span></span></div>
<div class="ow-low"><span class="bb-inning"><span class="bb-half"><span class="bb-half-dim" aria-hidden="true"></span><span class="bb-half-win"><span class="inningHalf" data-osb-component="field"></span></span></span><span class="bb-inning-no inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="diamond" aria-label="Bases"><span class="base second"></span><span class="base third"></span><span class="base first"></span><span class="bb-plate" aria-hidden="true"></span><span class="bb-bases bases" data-osb-component="field"></span></span></div><span class="bb-break isInBetweenGames" data-osb-component="field" style="opacity: 0">INNING<br>BREAK</span></div></div>
<div class="ow-foot"><span>BASEBALL · INNINGS</span><span class="bb-track" aria-label="Innings"><span class="bb-tick"><span class="bb-gate isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame9Started" data-osb-component="field" data-osb-field="isGame9Started" style="opacity: 0"></span></span></span></div>
</article>
<span class="bb-sr battingSide" data-osb-component="field"></span><span class="bb-retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="bb-retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main></body></html>
