<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena LED</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px; font-family: "DIN Alternate", "Arial Narrow", Arial, sans-serif; }
    .board { position: relative; display: grid; grid-template-columns: 1fr 300px 1fr; gap: 8px; width: 1120px; padding: 12px; background-color: #050505; background-image: radial-gradient(circle, #1d1d1d 1px, transparent 1.4px); background-size: 6px 6px; border: 3px solid #2b2b2b; border-radius: 8px; color: #ffc23d; box-shadow: inset 0 0 30px #000, 0 10px 24px #000a; }
    .team { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 120px; grid-template-rows: 30px 62px; column-gap: 10px; }
    .head { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
    .kit { width: 26px; height: 8px; border-radius: 2px; background-color: #444; }
    .nm { flex: 1; min-width: 0; color: #fff; font-size: 26px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 6px #fff6; }
    .stats { display: flex; align-items: center; gap: 14px; font-size: 14px; letter-spacing: 2px; color: #b9b9b9; }
    .fl, .tol-v { display: inline-block; min-width: 30px; margin-left: 6px; padding: 2px 4px; text-align: center; background: #000; border: 1px solid #2b2b2b; color: #ffc23d; font-size: 24px; text-shadow: 0 0 6px #ffc23daa; }
    .tol:has(.tol-v:empty) { display: none; }
    .tol::before { content: "T.O.L."; }
    .lamp { display: flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: 2px; color: #555; }
    .lamp::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #2b2b2b; }
    .lamp:has(.bonus:not(:empty)) { color: #ffc23d; }
    .lamp:has(.bonus:not(:empty))::before { background: #ff4a1c; box-shadow: 0 0 8px #ff4a1c; }
    .bonus { font-size: 0; }
    .pts { display: flex; align-items: center; justify-content: center; background: #000; border: 1px solid #2b2b2b; color: #ff4a1c; font-size: 60px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px #ff4a1cbb; }
    .team.b { grid-template-columns: 120px minmax(0, 1fr); }
    .team.b .pts { grid-column: 1; grid-row: 2; }
    .team.b .stats { grid-column: 2; grid-row: 2; justify-content: flex-end; }
    .team.b .head { flex-direction: row-reverse; text-align: right; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-inline: 1px solid #2b2b2b; }
    .gc { font-size: 50px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px #ffc23daa; }
    .lowc { display: flex; align-items: center; gap: 14px; font-size: 13px; letter-spacing: 2px; color: #b9b9b9; }
    .per { color: #ffc23d; font-size: 24px; text-shadow: 0 0 6px #ffc23daa; }
    .per:empty { display: none; }
    .shot { color: #b9b9b9; }
    .shot::before { content: "SHOT"; margin-right: 6px; }
    .sc-v { color: #ff4a1c; font-size: 24px; text-shadow: 0 0 6px #ff4a1caa; }
    .shot:has(.sc-v:empty) { display: none; }
    .pips { display: flex; gap: 5px; }
    .pip { position: relative; width: 9px; height: 9px; border-radius: 50%; background: #2b2b2b; }
    .pip-on { position: absolute; inset: 0; border-radius: 50%; background: #ffc23d; box-shadow: 0 0 6px #ffc23d; }
    .pip.pip-ot { width: auto; height: auto; border-radius: 2px; padding: 0 3px; background: #ff4a1c; color: #000; font-size: 9px; }
    .poss::before { content: "POSS "; }
    .poss-v { color: #ffc23d; }
    .poss:has(.poss-v:empty) { display: none; }
    .ev { display: flex; gap: 10px; font-size: 11px; letter-spacing: 2px; color: #b9b9b9; text-transform: uppercase; }
    .to-flag { position: absolute; inset: 0; align-items: center; justify-content: center; gap: 12px; background: #050505; color: #ff4a1c; font-size: 34px; letter-spacing: 8px; text-shadow: 0 0 10px #ff4a1c; border: 1px solid #ff4a1c; }
    .brk { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #050505; color: #ffc23d; font-size: 34px; letter-spacing: 10px; text-shadow: 0 0 10px #ffc23d; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="board" aria-label="Basketball arena scoreboard">
  <div class="team a"><div class="head"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="stats"><span>FOULS<span class="fl teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</span></span><span class="tol"><span class="tol-v timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span></span><span class="lamp">BONUS<span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span></span></div><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><div class="to-flag isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
  <div class="center"><span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><div class="lowc"><span>PER <span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span></span><span class="shot"><span class="sc-v" data-osb-static="true" data-sport-stat="shotClock"></span></span></div><div class="lowc"><span class="pips"><span class="pip"><span class="pip-on isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="pip pip-ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span><span class="poss"><span class="poss-v possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span></span></div><span class="brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">BREAK</span></div>
  <div class="team b"><div class="head"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><div class="stats"><span class="lamp">BONUS<span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span></span><span class="tol"><span class="tol-v timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span></span><span>FOULS<span class="fl teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</span></span></div><div class="to-flag isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><span class="possession" data-osb-component="field" data-osb-field="possession"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
