<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena LED</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 50px 28px; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
    .osb { position: relative; display: grid; grid-template-columns: 1fr 280px 1fr; gap: 6px; width: 1180px; padding: 8px; background: #121315; border: 3px solid #2b2d31; border-radius: 6px; color: #fff; box-shadow: 0 10px 24px #000b, inset 0 0 0 1px #000; }
    .side { display: grid; grid-template-rows: 38px 92px; min-width: 0; background: #050506; border-radius: 3px; }
    .hd { display: grid; grid-template-columns: 10px minmax(0, 1fr); align-items: center; background: #1d1f23; border-radius: 3px 3px 0 0; }
    .kit { align-self: stretch; background-color: #59616e; border-radius: 3px 0 0 0; }
    .nm { padding: 0 14px; font-size: 25px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .body { position: relative; display: grid; grid-template-columns: 30px 132px minmax(0, 1fr); align-items: center; padding: 0 12px 0 6px; }
    .side.B .body { grid-template-columns: minmax(0, 1fr) 132px 30px; padding: 0 6px 0 12px; }
    .side.B .lamp { order: 3; } .side.B .digits { order: 2; } .side.B .stats { order: 1; align-items: flex-start; }
    .lamp { display: flex; justify-content: center; }
    .arrow { font-size: 24px; line-height: 1; color: #ff3b2f; text-shadow: 0 0 8px #ff3b2f; }
    .digits { display: flex; justify-content: center; }
    .pts { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 86px; line-height: .8; padding-top: 12px; color: #ff3b2f; text-shadow: 0 0 10px #ff3b2fbb; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
    .stats { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .st { display: flex; align-items: center; gap: 8px; }
    .st i { font-style: normal; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; color: #c9ccd2; }
    .led-s { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 30px; line-height: .8; padding-top: 5px; color: #ffb21e; text-shadow: 0 0 8px #ffb21eaa; }
    .pips { display: flex; gap: 4px; }
    .pip { width: 10px; height: 10px; border-radius: 50%; background: #ffb21e; box-shadow: 0 0 6px #ffb21e; }
    .bonus { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #3cff6a; text-shadow: 0 0 8px #3cff6a; }
    .bonus:empty { display: none; }
    .to { position: absolute; top: 12px; bottom: 12px; left: 176px; right: 10px; align-items: center; justify-content: center; gap: 16px; background: #050506; border: 2px solid #ffb21e; border-radius: 3px; color: #ffb21e; text-shadow: 0 0 8px #ffb21eaa; }
    .side.B .to { left: 10px; right: 176px; }
    .to-l { font-size: 20px; font-weight: 700; letter-spacing: 3px; }
    .to-c { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 36px; line-height: .8; padding-top: 6px; }
    .mid { display: grid; grid-template-rows: 38px 92px; background: #050506; border-radius: 3px; overflow: hidden; }
    .mid > .brk, .mid > .fin { grid-area: 1 / 1 / 3 / 2; }
    .mid > .phd { grid-area: 1 / 1; } .mid > .live { grid-area: 2 / 1; }
    .phd { display: flex; align-items: center; justify-content: center; gap: 12px; background: #1d1f23; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #c9ccd2; }
    .per { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 26px; line-height: .8; padding-top: 5px; color: #ffb21e; text-shadow: 0 0 8px #ffb21eaa; }
    .prog { display: flex; gap: 3px; align-items: center; }
    .q { position: relative; width: 8px; height: 8px; border-radius: 50%; background: #2b2d31; }
    .q > span { position: absolute; inset: 0; border-radius: 50%; background: #ffb21e; box-shadow: 0 0 5px #ffb21e; }
    .ot { font-size: 11px; font-weight: 700; color: #ffb21e; text-shadow: 0 0 6px #ffb21e; }
    .live { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .gc { margin-right: 34px; font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 66px; line-height: .8; padding-top: 10px; color: #ffb21e; text-shadow: 0 0 10px #ffb21ebb; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
    .shot { position: absolute; right: 10px; top: 8px; display: flex; flex-direction: column; align-items: center; }
    .shot i { font-style: normal; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #c9ccd2; }
    .shot-v { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 40px; line-height: .8; padding-top: 4px; color: #ff3b2f; text-shadow: 0 0 8px #ff3b2faa; }
    .run-shot { width: 6px; height: 6px; margin-top: 3px; border-radius: 50%; background: #3cff6a; box-shadow: 0 0 6px #3cff6a; }
    .runbar { position: absolute; left: 10px; top: 10px; width: 9px; height: 9px; border-radius: 50%; background: #3cff6a; box-shadow: 0 0 8px #3cff6a; }
    .state { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; background: #050506; color: #ffb21e; text-shadow: 0 0 10px #ffb21ebb; border: 2px solid #ffb21e; border-radius: 3px; }
    .st-s { font-size: 20px; font-weight: 700; letter-spacing: 4px; }
    .st-b { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 60px; line-height: .8; padding-top: 8px; }
    .brk .half-t { font-size: 50px; }
    .fin { z-index: 2; color: #3cff6a; text-shadow: 0 0 10px #3cff6abb; border-color: #3cff6a; }
    .fin-ot { font-size: 20px; font-weight: 700; letter-spacing: 4px; margin-top: 4px; }
    .ev { grid-column: 1 / -1; display: flex; justify-content: center; gap: 14px; padding: 2px 0 0; font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #8d9098; order: 9; }
    .ev .matchRound { color: #ffb21e; }
    .half-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .end-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .half-t { display: block; }
    .fin-ot { display: none; }
    .osb:has(.isGame5Started[style*="opacity: 1"]) .fin-ot { display: block; }
    .osb:has(.isComplete[style*="opacity: 1"]) .final-dim { opacity: .3; filter: grayscale(1); }
    .pips { gap: 0 !important; }
    .pips > [class*="TimeoutLeft"] { margin-right: 4px; }
    .pips > [style*="opacity: 0"] { width: 0 !important; margin: 0 !important; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="osb" aria-label="Basketball arena scoreboard">
  <div class="side A"><div class="hd"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="body"><span class="lamp final-dim"><span class="arrow isAPossession" data-osb-component="field" data-osb-field="isAPossession" style="opacity: 0;">&#9664;</span></span><span class="digits"><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><div class="stats"><span class="st"><i>FOULS</i><b class="led-s teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</b></span><span class="st"><i>T.O.L.</i><span class="pips final-dim"><span class="pip isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity: 0;"></span><span class="pip isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity: 0;"></span><span class="pip isATimeoutLeft3" data-osb-component="field" data-osb-field="isATimeoutLeft3" style="opacity: 0;"></span><span class="pip isATimeoutLeft4" data-osb-component="field" data-osb-field="isATimeoutLeft4" style="opacity: 0;"></span><span class="pip isATimeoutLeft5" data-osb-component="field" data-osb-field="isATimeoutLeft5" style="opacity: 0;"></span></span></span><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span></div><span class="to isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIME OUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></div></div>
  <div class="mid">
    <div class="phd">PERIOD <span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="prog"><span class="q"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span></div>
    <div class="live"><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="shot isShotClockActive" data-osb-component="field" data-osb-field="isShotClockActive" style="opacity: 0;"><i>SHOT</i><span class="shot-v" data-osb-static="true" data-sport-stat="shotClock"></span><span class="run-shot isShotClockRunning" data-osb-component="field" data-osb-field="isShotClockRunning" style="opacity: 0;"></span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="end-t st-s">END OF</span><span class="end-t st-b"><span class="periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span></span><span class="half-t st-b">HALFTIME</span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FINAL</span><span class="fin-ot">OVERTIME</span></div>
  </div>
  <div class="side B"><div class="hd"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="body"><span class="lamp final-dim"><span class="arrow isBPossession" data-osb-component="field" data-osb-field="isBPossession" style="opacity: 0;">&#9654;</span></span><span class="digits"><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span><div class="stats"><span class="st"><i>FOULS</i><b class="led-s teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</b></span><span class="st"><i>T.O.L.</i><span class="pips final-dim"><span class="pip isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity: 0;"></span><span class="pip isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity: 0;"></span><span class="pip isBTimeoutLeft3" data-osb-component="field" data-osb-field="isBTimeoutLeft3" style="opacity: 0;"></span><span class="pip isBTimeoutLeft4" data-osb-component="field" data-osb-field="isBTimeoutLeft4" style="opacity: 0;"></span><span class="pip isBTimeoutLeft5" data-osb-component="field" data-osb-field="isBTimeoutLeft5" style="opacity: 0;"></span></span></span><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span></div><span class="to isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIME OUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></div></div>
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span><span class="timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span><span class="possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
