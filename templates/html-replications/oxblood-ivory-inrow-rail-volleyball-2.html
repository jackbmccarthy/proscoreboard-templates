<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Oxblood Ivory In-Row Rail 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:"Arial Narrow",Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(96vw,1698px);max-width:100%;aspect-ratio:8.49;overflow:hidden;border:2px solid #7e7671;background:#eee9e2;color:#2b2a2b;container-type:inline-size}
.pair{display:flex;flex:1 1 0;min-height:0;min-width:0}
.side{display:flex;align-items:stretch;flex:1 1 0;min-width:0}
.side+.side{border-left:2px solid #7e7671}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0;padding-left:18px}
.identity{display:block;flex:0 0 18px;height:56px;background:#be6576;border:2px solid #7e7671}
.jerseyColorB{background:#d6808e}
.name-block{display:flex;flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:10px;padding:0 18px}
.sport-tag{display:block;overflow:hidden;color:#81736e;font-size:clamp(12px,1.55cqw,26px);font-weight:750;letter-spacing:.02em;line-height:1;text-overflow:ellipsis;white-space:nowrap}
.name{display:block;min-width:0;overflow:hidden;font-size:clamp(24px,4.5cqw,70px);font-stretch:condensed;font-weight:800;line-height:1;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.side-b .name-block{padding-top:26px}
.set-rail{display:flex;align-items:center;justify-content:center;flex:0 0 21%;min-width:0;gap:27px;color:#81736e;font-size:clamp(16px,2.4cqw,35px);font-stretch:condensed;font-weight:800;white-space:nowrap}
.set-score{display:block;min-width:1.5ch;max-width:40%;overflow:hidden;text-align:right;font-size:1.55em;font-variant-numeric:tabular-nums;line-height:1}
.points{display:flex;align-items:center;justify-content:center;flex:0 0 20.5%;min-width:0;background:#552f39;color:#fff}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(44px,7.3cqw,113px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;text-align:center;white-space:nowrap}
.set-footer{display:flex;align-items:center;justify-content:center;flex:0 0 28%;border-top:2px solid #7e7671;color:#81736e;font-size:clamp(16px,2.5cqw,36px);font-stretch:condensed;font-weight:800;white-space:nowrap}
.current-set{display:inline-block;min-width:1ch;max-width:5ch;overflow:hidden;margin-left:.35em;font-variant-numeric:tabular-nums;text-align:center}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){
 .stage{padding:6px}
 .board{width:100%;height:108px;aspect-ratio:auto;border-width:1px}
 .side+.side,.set-footer{border-width:1px}
 .name-lane{padding-left:5px}
 .identity{flex-basis:5px;height:33px;border-width:1px}
 .name-block{gap:4px;padding:0 5px}
 .sport-tag{font-size:9px}
 .name{font-size:clamp(12px,4cqw,17px)}
 .side-b .name-block{padding-top:13px}
 .set-rail{flex-basis:22%;gap:3px;font-size:clamp(8px,2.2cqw,11px)}
 .set-score{font-size:1.4em}
 .points{flex-basis:23%}
 .score{font-size:clamp(25px,7.7cqw,34px)}
 .set-footer{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Horizontal volleyball scoreboard with generic manual scoring">
  <div class="pair rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <div class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-block" data-osb-component="layout"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div></div><div class="set-rail" data-osb-component="layout"><span data-osb-component="text">SETS</span><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="points" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
   <div class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-block" data-osb-component="layout"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div></div><div class="set-rail" data-osb-component="layout"><span data-osb-component="text">SETS</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="points" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
  </div>
  <div class="set-footer" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
