<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copper Slate Score Rail Volleyball — Horizontal</title>
  <style>
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #1e2b35; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px; }
.board { width: min(100%, 1650px); display: flex; flex-direction: column; overflow: hidden; border: 2px solid #9babb3; border-radius: 3px; background: #dce4e8; }
.header { height: 74px; flex: 0 0 74px; display: flex; align-items: center; justify-content: center; border-bottom: 6px solid #b98262; background: #f4f5f2; font-size: 48px; font-weight: 800; line-height: 1; }
.lanes { display: flex; align-items: stretch; }
.lane { flex: 1 1 0; min-height: 135px; display: flex; align-items: stretch; }
.lane + .lane { border-left: 3px solid #9babb3; }
.point-cell { flex: 0 0 165px; width: 165px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #252c33; color: #fff; }
.point-value { display: block; min-width: 2.5ch; text-align: center; font-size: 75px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.point-label { font-size: 20px; font-weight: 700; line-height: 1; }
.tick { display: block; flex: 0 0 21px; width: 21px; align-self: stretch; background: #b98262; }
.jerseyColorB { background: #7ea6b5; }
.name { flex: 1 1 0; display: block; align-self: center; overflow: hidden; padding: 0 31px; text-overflow: ellipsis; white-space: nowrap; font-size: 52px; font-weight: 700; line-height: 1; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.sets { flex: 0 0 122px; width: 122px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 2px solid #9babb3; }
.sets-label { color: #657b89; font-size: 21px; font-weight: 700; line-height: 1.1; }
.sets-value { display: block; font-size: 57px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.footer { min-height: 84px; display: flex; align-items: center; justify-content: center; gap: 28px; border-top: 2px solid #9babb3; background: #252c33; color: #fff; font-weight: 700; }
.footer-label { color: #9babb3; font-size: 30px; }
.set-value { display: block; min-width: 1.4ch; text-align: center; font-size: 58px; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media (max-width: 900px) {
  .header { height: 50px; flex-basis: 50px; font-size: 30px; border-bottom-width: 4px; }
  .lane { min-height: 91px; }
  .point-cell { flex-basis: 83px; width: 83px; }
  .point-value { font-size: 44px; }
  .point-label { font-size: 11px; }
  .tick { flex-basis: 10px; width: 10px; }
  .name { padding: 0 12px; font-size: clamp(18px, 3.6vw, 34px); }
  .sets { flex-basis: 61px; width: 61px; }
  .sets-label { font-size: 11px; }
  .sets-value { font-size: 35px; }
  .footer { min-height: 54px; gap: 13px; }
  .footer-label { font-size: 20px; }
  .set-value { font-size: 34px; }
}
@media (max-width: 520px) {
  .stage { padding: 7px; }
  .header { height: 37px; flex-basis: 37px; font-size: 20px; border-bottom-width: 3px; }
  .lane { min-height: 72px; }
  .lane + .lane { border-left-width: 2px; }
  .point-cell { flex-basis: 55px; width: 55px; }
  .point-value { font-size: 32px; }
  .point-label { font-size: 8px; }
  .tick { flex-basis: 5px; width: 5px; }
  .name { padding: 0 6px; font-size: 15px; }
  .sets { flex-basis: 34px; width: 34px; border-left-width: 1px; }
  .sets-label { font-size: 8px; }
  .sets-value { font-size: 26px; }
  .footer { min-height: 40px; gap: 9px; }
  .footer-label { font-size: 16px; }
  .set-value { font-size: 28px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="header">VOLLEYBALL</header>
      <div class="lanes rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="lane fixedRowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="point-cell"><span class="point-value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="point-label">POINTS</span></div><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="sets"><span class="sets-label">SETS</span><span class="sets-value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div>
        <div class="lane fixedRowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="point-cell"><span class="point-value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="point-label">POINTS</span></div><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="sets"><span class="sets-label">SETS</span><span class="sets-value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
      </div>
      <div class="footer rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="footer-label">SET</span><span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></div>
    </article>
    <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
  </main>
</body>
</html>
