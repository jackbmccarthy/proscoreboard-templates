<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardwood Tab</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 28px 28px; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
    .osb { position: relative; display: grid; grid-template-columns: 1fr 1fr 210px; width: 800px; color: #fff; filter: drop-shadow(0 6px 14px #0009); }
    .ev { grid-column: 1 / -1; justify-self: start; display: flex; gap: 10px; padding: 5px 14px 4px; background: #d9a55b; color: #13294b; border-radius: 4px 4px 0 0; font-size: 15px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; white-space: nowrap; }
    .ev .matchRound { color: #0b1730; opacity: .75; }
    .team { display: grid; grid-template-rows: 60px 30px; min-width: 0; border-right: 2px solid #d9a55b; }
    .line { position: relative; display: grid; grid-template-columns: 8px 20px minmax(0, 1fr) 70px; align-items: center; background: #13294b; }
    .kitw { align-self: stretch; display: flex; background: #c3c9d2; }
    .team.B .kitw { background: #6b7a90; }
    .kit { flex: 1; background-color: transparent; }
    .poss { display: flex; justify-content: center; }
    .arrow { width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 13px solid #ffd27f; filter: drop-shadow(0 0 4px #ffd27f99); }
    .nm { padding-right: 8px; font-size: 23px; font-weight: 700; line-height: 1.02; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: normal; word-break: normal; hyphens: none; text-wrap: balance; }
    .pts { position: relative; z-index: 1; align-self: stretch; display: flex; align-items: center; justify-content: center; background: #fff; color: #13294b; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .rail { position: relative; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #0b1730; font-size: 15px; font-weight: 700; letter-spacing: 1.2px; color: #c4d0e2; }
    .tor { display: flex; align-items: center; gap: 6px; }
    .cap { font-size: 16px; font-weight: 700; letter-spacing: 1.2px; color: #c4d0e2; }
    .pips { display: flex; gap: 4px; }
    .pip { width: 8px; height: 8px; border-radius: 50%; background: #d9a55b; }
    .fl b { color: #fff; margin-left: 3px; }
    .bonus { margin-left: auto; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; background: #ffd27f; color: #0b1730; padding: 2px 8px 1px; border-radius: 2px; box-shadow: 0 0 0 1px #ffd27f, 0 0 8px #ffd27f66; }
    .bonus:empty { display: none; }
    .to { position: absolute; inset: 0; align-items: center; justify-content: center; gap: 10px; background: #d9a55b; color: #0b1730; }
    .to-l { font-size: 15px; font-weight: 700; letter-spacing: 2.5px; }
    .to-c { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 18px; font-weight: 700; }
    .clk { display: grid; grid-template-rows: 60px 30px; background: #0b1730; }
    .clk > .brk, .clk > .fin { grid-area: 1 / 1 / 3 / 2; }
    .clk > .live { grid-area: 1 / 1; } .clk > .sub { grid-area: 2 / 1; }
    .live { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .per { min-width: 54px; text-align: center; font-size: 20px; font-weight: 800; color: #0b1730; background: #d9a55b; border-radius: 3px; padding: 2px 6px 0; line-height: 22px; letter-spacing: 1px; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .gc b { padding: 0 1px; }
    .runbar { position: absolute; left: 14px; right: 14px; bottom: 6px; height: 2px; background: #d9a55b; }
    .sub { position: relative; display: flex; align-items: center; justify-content: center; padding: 0 12px; background: #13294b; border-top: 1px solid #22406e; }
    .shot { position: relative; display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 3px 0 10px; background: #d22f27; color: #fff; border-radius: 3px; font-size: 14px; font-weight: 800; letter-spacing: 1.5px; }
    .shot-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 20px; font-weight: 700; color: #ffd9d4; background: #0b1730; border-radius: 2px; padding: 0 4px; min-width: 30px; text-align: center; line-height: 20px; }
    .run-shot { position: absolute; right: 0; left: 0; bottom: -3px; height: 2px; background: #ff6a5e; }
    .prog { display: flex; gap: 3px; align-items: center; }
    .pg { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .q { position: relative; width: 12px; height: 4px; background: #2f4c7a; }
    .q > span { position: absolute; inset: 0; background: #d9a55b; }
    .ot { width: 18px; height: 4px; margin-left: 3px; overflow: hidden; font-size: 16px; font-weight: 700; padding: 0; line-height: 4px; background: #ff6a5e; color: transparent; }
    .state { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #d9a55b; color: #0b1730; line-height: 1; }
    .st-s { font-size: 16px; font-weight: 700; letter-spacing: 3px; }
    .st-b { font-size: 40px; font-weight: 700; margin-top: 2px; }
    .brk .half-t { font-size: 34px; }
    .fin { z-index: 2; background: #fff; color: #13294b; }
    .fin-ot { font-size: 20px; font-weight: 800; letter-spacing: 2px; margin-top: 3px; }
    .half-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .end-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .half-t { display: block; }
    .fin-ot { display: none; }
    .osb:has(.isGame5Started[style*="opacity: 1"]) .fin-ot { display: block; }
    .osb:has(.isComplete[style*="opacity: 1"]) .final-dim { opacity: .5; }
    .osb:has(.isComplete[style*="opacity: 1"]) .rail > :not(.to) { visibility: hidden; }
    .tor:not(:has(.pip[style*="opacity: 1"])) { visibility: hidden; }
    .clk:not(:has(.isShotClockActive[style*="opacity: 1"])) > .live { grid-area: 1 / 1 / 3 / 2; }
    .clk:not(:has(.isShotClockActive[style*="opacity: 1"])) > .sub { visibility: hidden; }
    .win { position: absolute; top: 0; right: 0; bottom: 0; width: 70px; background: #d9a55b; }
    .line:has(> .win[style*="opacity: 1"]) .pts { background: transparent; color: #0b1730; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .team.B .nm, .osb:has(.isBWinner[style*="opacity: 1"]) .team.A .nm { color: #9fb0c8; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .team.B .pts, .osb:has(.isBWinner[style*="opacity: 1"]) .team.A .pts { background: #c9d2df; color: #3a4a63; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .team.B .kitw, .osb:has(.isBWinner[style*="opacity: 1"]) .team.A .kitw { opacity: .55; }
    .pips { gap: 0 !important; }
    .pips > [class*="TimeoutLeft"] { margin-right: 4px; }
    .pips > [style*="opacity: 0"] { width: 0 !important; margin: 0 !important; }
    .pips > .pip[style*="opacity: 0"] { display: none !important; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.ev-n.eventName,.ev-r.matchRound,.fl,.teamFoulsA,.to-l,.teamFoulsB,.shot.isShotClockActive,.ot.isGame5Started,.bonus.bonusA,.bonus.bonusB{font-size:16px!important}
.arrow.isAPossession,.arrow.isBPossession{width:12px!important;height:14px!important;min-width:0!important;flex-shrink:0!important}
.pip.isATimeoutLeft1,.pip.isATimeoutLeft2,.pip.isATimeoutLeft3,.pip.isATimeoutLeft4,.pip.isATimeoutLeft5,.pip.isBTimeoutLeft1,.pip.isBTimeoutLeft2,.pip.isBTimeoutLeft3,.pip.isBTimeoutLeft4,.pip.isBTimeoutLeft5{width:12px!important;height:12px!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

  </style>
</head>
<body>
<article class="osb" aria-label="Basketball scorebug">
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="team A"><div class="line"><span class="kitw"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><span class="poss final-dim"><span class="arrow isAPossession" data-osb-component="field" data-osb-field="isAPossession" style="opacity: 0;"></span></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="win isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity: 0;"></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div><div class="rail"><span class="tor final-dim"><span class="cap">TO</span><span class="pips"><span class="pip isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity: 0;"></span><span class="pip isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity: 0;"></span><span class="pip isATimeoutLeft3" data-osb-component="field" data-osb-field="isATimeoutLeft3" style="opacity: 0;"></span><span class="pip isATimeoutLeft4" data-osb-component="field" data-osb-field="isATimeoutLeft4" style="opacity: 0;"></span><span class="pip isATimeoutLeft5" data-osb-component="field" data-osb-field="isATimeoutLeft5" style="opacity: 0;"></span></span></span><span class="fl">FOULS <b class="teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</b></span><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span><span class="to isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIMEOUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></div></div>
  <div class="team B"><div class="line"><span class="kitw"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><span class="poss final-dim"><span class="arrow isBPossession" data-osb-component="field" data-osb-field="isBPossession" style="opacity: 0;"></span></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="win isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity: 0;"></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div><div class="rail"><span class="tor final-dim"><span class="cap">TO</span><span class="pips"><span class="pip isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity: 0;"></span><span class="pip isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity: 0;"></span><span class="pip isBTimeoutLeft3" data-osb-component="field" data-osb-field="isBTimeoutLeft3" style="opacity: 0;"></span><span class="pip isBTimeoutLeft4" data-osb-component="field" data-osb-field="isBTimeoutLeft4" style="opacity: 0;"></span><span class="pip isBTimeoutLeft5" data-osb-component="field" data-osb-field="isBTimeoutLeft5" style="opacity: 0;"></span></span></span><span class="fl">FOULS <b class="teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</b></span><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span><span class="to isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIMEOUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></div></div>
  <div class="clk">
    <div class="live"><span class="pg"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="prog"><span class="q"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span></span><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="sub"><span class="shot isShotClockActive" data-osb-component="field" data-osb-field="isShotClockActive" style="opacity: 0;">SHOT<span class="shot-v" data-osb-static="true" data-sport-stat="shotClock"></span><span class="run-shot isShotClockRunning" data-osb-component="field" data-osb-field="isShotClockRunning" style="opacity: 0;"></span></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="end-t st-s">END OF</span><span class="end-t st-b"><span class="periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span></span><span class="half-t st-b">HALFTIME</span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FINAL</span><span class="fin-ot">OVERTIME</span></div>
  </div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span><span class="timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span><span class="possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
