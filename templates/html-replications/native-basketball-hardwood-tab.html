<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardwood Tab</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px; font-family: "Avenir Next Condensed", "Arial Narrow", Arial, sans-serif; }
    .bug { position: relative; display: inline-flex; flex-direction: column; color: #fff; filter: drop-shadow(0 5px 12px #0009); }
    .ev { display: flex; gap: 10px; align-self: flex-start; padding: 4px 12px 3px; background: linear-gradient(90deg, #c88f45, #e2b46b 40%, #cf9a52 70%, #e6bb75); color: #0b1730; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; border-radius: 4px 4px 0 0; }
    .ev-round { color: #13294b; opacity: .75; }
    .line { display: flex; align-items: stretch; height: 56px; border-top: 4px solid #d9a55b; background: linear-gradient(90deg, #c88f45, #e2b46b 30%, #cf9a52 55%, #e6bb75 80%, #c88f45); padding-top: 0; }
    .team { position: relative; display: flex; align-items: stretch; background: #13294b; margin-right: 3px; }
    .kit { width: 10px; background-color: #6b7a90; }
    .nm { display: flex; align-items: center; width: 170px; padding: 0 12px; font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pts { display: flex; align-items: center; justify-content: center; min-width: 74px; padding: 0 8px; background: #0b1730; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .clock { display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #050b17; }
    .per { min-width: 34px; padding: 3px 7px 1px; text-align: center; border: 2px solid #d9a55b; border-radius: 4px; font-size: 20px; font-weight: 700; color: #d9a55b; }
    .per:empty { display: none; }
    .gc { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .shot { display: flex; align-items: center; justify-content: center; min-width: 40px; height: 34px; border-radius: 4px; background: #d9a55b; color: #0b1730; font-size: 22px; font-weight: 700; }
    .shot:has(.sc-v:empty) { display: none; }
    .sub { display: flex; height: 24px; background: #0b1730; font-size: 13px; font-weight: 600; letter-spacing: 1.2px; color: #b8c3d6; }
    .sub > .s { display: flex; align-items: center; gap: 10px; padding: 0 12px; margin-right: 3px; width: 257px; }
    .sub > .c { display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; }
    .fl { color: #fff; }
    .bonus { background: #d9a55b; color: #0b1730; padding: 1px 6px; border-radius: 2px; font-weight: 700; }
    .bonus:empty { display: none; }
    .tol::before { content: "TO "; }
    .tol-v { color: #fff; }
    .tol:has(.tol-v:empty) { display: none; }
    .poss::before { content: "POSS "; }
    .poss-v { color: #fff; }
    .poss:has(.poss-v:empty) { display: none; }
    .pips { display: flex; gap: 3px; align-items: center; }
    .pip { position: relative; width: 14px; height: 4px; background: #2a3a58; }
    .pip-on { position: absolute; inset: 0; background: #d9a55b; }
    .pip.pip-ot { width: auto; height: auto; padding: 0 3px; font-size: 10px; background: #d9a55b; color: #0b1730; }
    .to-flag { position: absolute; inset: 0; align-items: center; justify-content: center; gap: 8px; background: #d9a55b; color: #0b1730; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    .brk { position: absolute; right: 0; top: 0; padding: 4px 12px 3px; background: #d9a55b; color: #0b1730; font-size: 13px; font-weight: 700; letter-spacing: 2px; border-radius: 4px 4px 0 0; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="bug" aria-label="Basketball scorebug">
  <span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
  <div class="line">
    <div class="team"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><div class="to-flag isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
    <div class="team"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><div class="to-flag isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
    <div class="clock"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="shot"><span class="sc-v" data-osb-static="true" data-sport-stat="shotClock"></span></span></div>
  </div>
  <div class="sub">
    <span class="s">FOULS<span class="fl teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</span><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span><span class="tol"><span class="tol-v timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span></span></span>
    <span class="s">FOULS<span class="fl teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</span><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span><span class="tol"><span class="tol-v timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span></span></span>
    <span class="c"><span class="pips"><span class="pip"><span class="pip-on isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="pip pip-ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span><span class="poss"><span class="poss-v possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span></span></span>
  </div>
  <span class="brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">BREAK</span>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><span class="possession" data-osb-component="field" data-osb-field="possession"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
