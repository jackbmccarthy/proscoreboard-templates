<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Pewter Columnhead 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.shell{width:min(92vw,1030px);max-width:100%;container-type:inline-size;color:#25343a}
.header{display:flex;height:54px;align-items:stretch;min-width:0}
.header-name{display:flex;align-items:stretch;flex:1 1 0;min-width:0}
.sport-tab{display:flex;align-items:center;justify-content:center;width:255px;max-width:58%;background:#25343a;color:#f5f7f4;border-radius:4px 4px 0 0;font-size:clamp(15px,3cqw,30px);font-weight:800;line-height:1;white-space:nowrap}
.columnhead{display:flex;align-items:center;justify-content:center;flex:0 0 21.5%;min-width:0;background:#25343a;color:#f5f7f4;border:1px solid #8da1a5;border-bottom:0;font-size:clamp(11px,2.8cqw,29px);font-weight:800;line-height:1;white-space:nowrap}
.columnhead:first-of-type{border-radius:4px 0 0 0}
.columnhead:last-child{border-radius:0 4px 0 0}
.board{display:flex;flex-direction:column;width:100%;height:232px;overflow:hidden;border-radius:0 0 4px 4px;background:#dfe6e5}
.team{display:flex;align-items:stretch;flex:1 1 0;min-height:0;min-width:0}
.team+.team{border-top:1px solid #314a54}
.name-zone{display:flex;align-items:center;flex:1 1 0;min-width:0;background:#dfe6e5}
.identity{display:block;flex:0 0 16px;align-self:stretch;background:#1368c4}
.jerseyColorB{background:#e11d32}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;padding:0 30px;color:#25343a;font-size:clamp(18px,6.5cqw,67px);font-weight:750;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.sets,.points{display:flex;align-items:center;justify-content:center;flex:0 0 21.5%;min-width:0;border-left:1px solid #8da1a5;font-variant-numeric:tabular-nums;white-space:nowrap}
.sets{background:#cbd8da;color:#25343a;font-size:clamp(28px,8.2cqw,84px);font-weight:750}
.points{background:#bccdd0;color:#25343a;font-size:clamp(29px,8.7cqw,90px);font-weight:800}
.set-score,.point-score{display:block;min-width:0;max-width:100%;overflow:hidden;font-variant-numeric:tabular-nums;line-height:1}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:8px}
 .shell{width:100%}
 .header{height:27px}
 .sport-tab{width:130px;font-size:12px}
 .columnhead{font-size:11px}
 .board{height:150px}
 .identity{flex-basis:6px}
 .name{padding:0 8px;font-size:clamp(15px,5cqw,20px)}
 .sets,.points{font-size:clamp(30px,8cqw,38px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <div class="shell columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <div class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <div class="header-name" data-osb-component="layout"><span class="sport-tab sport-tag" data-osb-component="text">VOLLEYBALL</span></div>
   <span class="columnhead" data-osb-component="text">SETS</span><span class="columnhead" data-osb-component="text">POINTS</span>
  </div>
  <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard, generic manual scoring">
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
    <div class="name-zone rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div>
    <div class="sets" data-osb-component="layout"><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
    <div class="points" data-osb-component="layout"><span class="point-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
   </div>
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
    <div class="name-zone rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div>
    <div class="sets" data-osb-component="layout"><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
    <div class="points" data-osb-component="layout"><span class="point-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
   </div>
  </article>
  <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
 </div>
</main>
</body>
</html>
