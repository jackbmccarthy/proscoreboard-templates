<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Courtside — Table Green</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.flag:not([src]),.tlogo:not([src]){display:none}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isComplete[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isComplete[style*="opacity: 1"])>.isMatchPoint{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.meta{display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.meta>*{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta .sep{flex:0 0 auto;font-style:normal;padding:0 .45em;opacity:.55}
.meta .rd,.meta .bo{flex-shrink:0}
.meta .ev:empty+.s1,.meta .rd:empty+.s2,.meta .s1:has(+.rd:empty),.meta .s2:has(+.bo:empty){display:none}
.meta .ev:empty+.s1+.rd:empty+.s2{display:none}
.won{position:absolute;z-index:0}
.gs{position:relative;z-index:1}
.gtag .nx{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .now{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html,body{height:100%;overflow:hidden}
.osb-core-fields{display:none!important}
.board{position:fixed;inset:0;display:flex;flex-direction:column;font-family:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#fff;background:#0b1f17;-webkit-font-smoothing:antialiased;overflow:hidden}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:2vw;flex:0 0 14vh;padding:0 2.4vw;background:#08140f}
.info{display:flex;flex-direction:column;justify-content:center;gap:.6vh;min-width:0;text-transform:uppercase;white-space:nowrap}
.info>*{overflow:hidden;text-overflow:ellipsis}
.teamlbl{display:none;font-size:4vh;font-weight:800;letter-spacing:.08em}
.info:not(:has(.ev:not(:empty))):not(:has(.rd:not(:empty))) .teamlbl{display:block}
.board:not(:has(.tname:not(:empty))) .teamlbl{display:none!important}
.info:not(:has(.rd:not(:empty))):not(:has(.bo:not(:empty))) .l2{display:none}
.ev{font-size:4vh;font-weight:800;letter-spacing:.06em}
.l2{display:flex;align-items:center;font-size:3vh;font-weight:700;letter-spacing:.08em;color:#9cc9b2}
.l2 .sep{font-style:normal;padding:0 .6em}
.l2 .rd:empty+.sep,.l2 .sep:has(+.bo:empty){display:none}
.center{display:flex;align-items:center;gap:1vw}
.tagslot{width:33vh;height:9vh}
.tagslot>*{border-radius:1vh;font-size:4.4vh;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.gtag{background:#fff;color:#0b3d2a}
.fin{background:#ffd23f;color:#111}
.banner{width:47vh;height:9vh}
.bn{border-radius:1vh;font-size:4.4vh;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.bn-warm,.bn-break{box-shadow:inset 0 0 0 .5vh #fff;color:#fff}
.bn-gp{background:#ff8a1c;color:#111}
.bn-mp{background:#e3262f;color:#fff}
.chips{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:.8vh}
.chip{width:24vh;height:4.8vh}
.fl{border-radius:.6vh;font-size:2.8vh;font-weight:800;letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 0 0 .3vh #9cc9b2;color:#e7f5ee}
.table{display:flex;flex:1 1 auto;min-height:0;margin:2.4vh 2.4vw 3vh;border:1vh solid #f4f4ef;border-radius:.6vh;background:#13623f;box-shadow:0 1vh 3vh rgba(0,0,0,.45)}
.net{flex:0 0 1.2vw;background:repeating-linear-gradient(0deg,#1c1c1c 0 .6vh,#3b3b3b .6vh 1.2vh);box-shadow:inset .25vw 0 0 #f4f4ef,inset -.25vw 0 0 #f4f4ef}
.end{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"gw who" "pts pts" "foot foot";flex:1 1 0;min-width:0;padding:2.6vh 2vw 2vh}
.eB{grid-template-columns:1fr auto;grid-template-areas:"who gw" "pts pts" "foot foot"}
.kit{position:absolute;left:0;right:0;bottom:0;height:1.2vh;background:#7aa08d}
.who{grid-area:who;display:flex;align-items:center;gap:1.2vw;min-width:0;padding-left:1.6vw}
.eB .who{padding:0 1.6vw 0 0}
.eB .who{flex-direction:row-reverse;text-align:right}
.flag{flex:0 0 auto;width:7vh;height:4.7vh;object-fit:cover;border-radius:.4vh;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.nm{display:flex;flex-direction:column;gap:.6vh;min-width:0}
.eB .nm{align-items:flex-end}
.name{font-size:4.8vh;line-height:1.02;font-weight:800;text-transform:uppercase;overflow-wrap:normal;hyphens:none}
.team{display:flex;align-items:center;gap:1vw;font-size:3.2vh;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#bfe0cf}
.eB .team{flex-direction:row-reverse}
.tlogo{width:5vh;height:5vh;object-fit:contain}
.tie{display:inline-flex;align-items:center;gap:.6vw;padding:0 1vw;height:5vh;border-radius:.6vh;background:#0b3d2a;color:#fff;flex:0 0 auto}
.tie i{font-style:normal;color:#9cc9b2}
.team:not(:has(.tname:not(:empty))){display:none}
.nm:has(.name:empty) .team{flex-wrap:wrap;font-size:4.6vh;color:#fff}
.nm:has(.name:empty) .tname{line-height:1.05}
.gw{grid-area:gw;display:flex;flex-direction:column;align-items:center;gap:.4vh;padding:1vh 1.2vw;border:.5vh solid #f4f4ef;border-radius:1vh;font-weight:900;text-transform:uppercase}
.gw i{font-style:normal;font-size:2.8vh;letter-spacing:.18em;color:#d8eee2}
.gn{font-size:9vh;line-height:.9;font-variant-numeric:tabular-nums}
.pts{grid-area:pts;display:flex;align-items:center;justify-content:center;min-height:0}
.big{font-size:44vh;line-height:.8;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 1vh 2.4vh rgba(0,0,0,.25)}
.foot{grid-area:foot;display:flex;align-items:center;gap:1.2vw;min-height:9vh}
.eB .foot{flex-direction:row-reverse}
.hist{position:relative;display:flex;gap:.7vw}
.hg{display:flex;align-items:center;gap:.6vw;height:6.4vh;padding:0 1.1vw;border-radius:.8vh;font-weight:800;font-variant-numeric:tabular-nums}
.hl{font-style:normal;font-size:2.8vh;letter-spacing:.08em;opacity:.8}
.gs{font-size:4.2vh}

.hg:not(:has(.won[style*="opacity: 1"])){position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;padding:0!important;margin:0!important;border:0!important}
.hg .won{display:none}
.hg{background:#0e4a30;color:#8fbfa6}
.end[data-osb-resolved-court-side="A"] .hg:has(.wA[style*="opacity: 1"]),.end[data-osb-resolved-court-side="B"] .hg:has(.wB[style*="opacity: 1"]){background:#f4f4ef;color:#0b3d2a}
.end[data-osb-resolved-court-side="A"] .isBWinner,.end[data-osb-resolved-court-side="B"] .isAWinner,.end:not([data-osb-resolved-court-side]) :is(.isAWinner,.isBWinner){display:none!important}

.to-slot{width:17vh;height:6vh}
.to-on,.to-used{border-radius:.6vh;font-size:3vh;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.to-on{background:#ffd23f;color:#111}
.to-used{box-shadow:inset 0 0 0 .4vh #8fbfa6;color:#d8eee2}
.cs{width:4.2vh;height:6vh}
.card{border-radius:.6vh;box-shadow:0 0 0 .3vh rgba(0,0,0,.3)}
.yc{background:#ffd400}.rc{background:#e3262f}
.ss{width:9vh;height:9vh;margin-left:auto}
.eB .ss{margin-left:0;margin-right:auto}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff8a1c 46%,#d65f00 100%);box-shadow:0 0 0 .5vh rgba(0,0,0,.25),0 0 3vh rgba(255,138,28,.5)}
.win{grid-area:gw;align-self:center;display:flex;align-items:center;height:8vh;padding:0 2vw;border-radius:1vh;background:#ffd23f;color:#111;font-size:3.6vh;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.board:has(.isComplete[style*="opacity: 1"]) .big{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important}
.board:has(.isComplete[style*="opacity: 1"]) .gw{grid-area:pts;align-self:center;justify-self:center;flex-direction:column-reverse;border:0;padding:0;gap:2vh}
.board:has(.isComplete[style*="opacity: 1"]) .gn{font-size:40vh;line-height:.8}
.board:has(.isComplete[style*="opacity: 1"]) .gw i{font-size:4.2vh}
.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"]{box-shadow:inset 0 0 0 .8vh #ffd23f}
.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"]{background:#0d3f29}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"]) :is(.gn,.name,.flag,.hist){opacity:.45}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"]) .gn{color:#ffd23f}

</style>
</head>
