<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Courtside — Table Green</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.flag:not([src]),.tlogo:not([src]){display:none}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isComplete[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isComplete[style*="opacity: 1"])>.isMatchPoint{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.won{position:absolute;z-index:0}
.gs{position:relative;z-index:1}
.gtag .nx{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .now{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{height:100%;overflow:hidden}
.osb-core-fields{display:none!important}
.end[data-osb-resolved-court-side="A"] .isBWinner,.end[data-osb-resolved-court-side="B"] .isAWinner,.end:not([data-osb-resolved-court-side]) :is(.isAWinner,.isBWinner){display:none!important}
.hg:not(:has(.won[style*="opacity: 1"])){position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;padding:0!important;margin:0!important;border:0!important}
.hg .won{display:none}
.name{overflow-wrap:normal;word-break:normal;hyphens:none}
/* status chips flow: an empty chip takes no room, so both ends keep the same packed order */
.to-slot:not(:has(>[style*="opacity: 1"])),.card:not([style*="opacity: 1"]){display:none}
.board:has(.isComplete[style*="opacity: 1"]) .big{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important}

.board{position:fixed;inset:0;display:flex;flex-direction:column;font-family:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#fff;background:transparent;-webkit-font-smoothing:antialiased;overflow:hidden}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:2vw;flex:0 0 14vh;padding:0 2.4vw;background:#08140f}
.info{display:flex;flex-direction:column;justify-content:center;gap:.6vh;min-width:0;text-transform:uppercase;white-space:nowrap}
.info>*{overflow:hidden;text-overflow:ellipsis}
.ev{font-size:4.6vh;font-weight:800;letter-spacing:.06em}
.rd{font-size:3.4vh;font-weight:700;letter-spacing:.08em;color:#bfe0cf}
.rd:empty{display:none}
.teamlbl{display:none;font-size:4vh;font-weight:800;letter-spacing:.08em}
.info:not(:has(.ev:not(:empty))):not(:has(.rd:not(:empty))) .teamlbl{display:block}
.board:not(:has(.tname:not(:empty))) .teamlbl{display:none!important}
.tagslot{width:33vh;height:9vh}
.tagslot>*{border-radius:1vh;font-size:4.4vh;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.gtag{background:#fff;color:#0b3d2a}
.pre{box-shadow:inset 0 0 0 .4vh #2d6b4f;color:#bfe0cf}
.tagslot:has(>.gtag[style*="opacity: 1"]) .pre,.tagslot:has(>.fin[style*="opacity: 1"]) .pre{opacity:0}
.fin{background:#ffd23f;color:#111}
.right{display:flex;align-items:center;justify-content:flex-end;gap:1vw;min-width:0}
.chip{width:21vh;height:6vh}
.fl{border-radius:.7vh;font-size:2.7vh;font-weight:800;letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 0 0 .3vh #9cc9b2;color:#e7f5ee}
.banner{width:40vh;height:9vh}
.bn{border-radius:1vh;font-size:4.4vh;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.bn-warm,.bn-break{box-shadow:inset 0 0 0 .5vh #fff;color:#fff}
.bn-gp{background:#ff8a1c;color:#111}
.bn-mp{background:#e3262f;color:#fff}
.banner>.bo{justify-content:flex-end;font-size:4.2vh;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#bfe0cf}
.board:not(:has(.isMatchStarted[style*="opacity: 1"])) .banner:has(>.isWarmUpStarted[style*="opacity: 1"])>.bo,
.board:not(:has(.isComplete[style*="opacity: 1"])) .banner:has(>:is(.isInBetweenGames,.isGamePoint,.isMatchPoint)[style*="opacity: 1"])>.bo{opacity:0}
.table{display:flex;flex:1 1 auto;min-height:0;margin:2.4vh 2.4vw 3vh;border:1vh solid #f4f4ef;border-radius:.6vh;background:#13623f;box-shadow:0 1vh 3vh rgba(0,0,0,.45)}
.net{flex:0 0 1.2vw;background:repeating-linear-gradient(0deg,#1c1c1c 0 .6vh,#3b3b3b .6vh 1.2vh);box-shadow:inset .25vw 0 0 #f4f4ef,inset -.25vw 0 0 #f4f4ef}
.end{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 17vh minmax(0,1fr) 7vh;grid-template-areas:"band band" "gw who" "pts pts" "hist hist";row-gap:0;flex:1 1 0;min-width:0;padding:2.6vh 2vw 3.4vh}
.eB{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"band band" "who gw" "pts pts" "hist hist"}
.kit{position:absolute;left:0;right:0;bottom:0;height:1.2vh;background:#7aa08d}
.tband{grid-area:band;display:none;align-items:center;gap:1.2vw;margin-bottom:1.6vh;padding:0 1.4vw;min-height:7vh;border-radius:.8vh;background:#0b3d2a;font-size:3.4vh;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.eB .tband{flex-direction:row-reverse;text-align:right}
.board:has(.tname:not(:empty)) .tband{display:flex}
.tband .tlogo{width:5vh;height:5vh;object-fit:contain;flex:0 0 auto}
.tband .tname{flex:1 1 auto;min-width:0;line-height:1.05;overflow-wrap:normal;hyphens:none}
.tband .tie{display:inline-flex;align-items:center;gap:1vw;flex:0 0 auto;height:5.2vh;padding:0 1.2vw;border-radius:.6vh;background:#f4f4ef;color:#0b3d2a}
.tband .tie i{font-style:normal;font-size:2.8vh;letter-spacing:.14em}
.tband .tscore{font-size:4.2vh;font-variant-numeric:tabular-nums}
/* GAMES box at the outer corner */
.gw{grid-area:gw;align-self:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;width:16vh;height:15vh;border:.5vh solid #f4f4ef;border-radius:1vh;font-weight:900;text-transform:uppercase}
.gw i{font-style:normal;font-size:2.6vh;letter-spacing:.18em;line-height:1;color:#d8eee2}
.gn{font-size:9vh;line-height:.9;font-variant-numeric:tabular-nums}
/* identity: flag + name on top, the player's own status line under it, serve ball on the inner side */
.who{grid-area:who;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) 5.8vh;grid-template-areas:"flag name" "marks marks";column-gap:1.2vw;row-gap:1vh;align-items:center;min-width:0;height:15vh;padding:0 0 0 1.6vw}
.eB .who{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name flag" "marks marks";padding:0 1.6vw 0 0}
.flag{grid-area:flag;width:7vh;height:4.7vh;object-fit:cover;border-radius:.4vh;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.nm{grid-area:name;min-width:0}
.eB .nm{text-align:right}
.name{display:block;font-size:4.8vh;line-height:1.02;font-weight:800;text-transform:uppercase}
.pts{position:relative}
.ss{position:absolute;top:50%;width:8vh;height:8vh;margin-top:-4vh}
.eA .ss{right:0}
.eB .ss{left:0}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff8a1c 46%,#d65f00 100%);box-shadow:0 0 0 .5vh rgba(0,0,0,.25),0 0 3vh rgba(255,138,28,.5)}
.marks{grid-area:marks;display:flex;align-items:center;gap:.8vw;min-width:0;height:5.8vh}
.eB .marks{justify-content:flex-end}
.to-slot{width:14vh;height:5.4vh}
.to-on,.to-used{border-radius:.6vh;font-size:2.6vh;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.to-on{background:#ffd23f;color:#111}
.to-used{background:#0b3d2a;color:#e7f5ee}
.card{display:inline-flex;align-items:center;gap:.7vw;height:5.4vh;padding:0 1.3vw 0 .9vw;border-radius:.6vh;font-size:2.6vh;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:#0b3d2a;color:#fff;white-space:nowrap}
.card b{flex:0 0 auto;width:2.6vh;height:3.6vh;border-radius:.4vh;box-shadow:0 0 0 .25vh rgba(0,0,0,.35)}
.yc b{background:#ffd400}.rc b{background:#e3262f}
.win{display:none;align-items:center;height:5.4vh;padding:0 1.4vw;border-radius:.6vh;background:#ffd23f;color:#111;font-size:2.8vh;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.win[style*="opacity: 1"]{display:inline-flex}
.pts{grid-area:pts;display:flex;align-items:center;justify-content:center;min-height:0}
.big{font-size:46vh;line-height:.78;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 1vh 2.4vh rgba(0,0,0,.25)}
/* finished games along the outer baseline, mirrored */
.hist{grid-area:hist;position:relative;display:flex;align-items:center;gap:.6vw}
.eB .hist{justify-content:flex-end}
.hg{display:flex;align-items:center;gap:.5vw;height:6.4vh;padding:0 .9vw;border-radius:.8vh;font-weight:800;font-variant-numeric:tabular-nums;background:#0b3d2a;color:#cfe6da}
.hl{font-style:normal;font-size:2.8vh;letter-spacing:.08em}
.gs{font-size:4.2vh}
.end[data-osb-resolved-court-side="A"] .hg:has(.wA[style*="opacity: 1"]),.end[data-osb-resolved-court-side="B"] .hg:has(.wB[style*="opacity: 1"]){background:#f4f4ef;color:#0b3d2a}
/* team tie */
.board:has(.tname:not(:empty)) .big{font-size:38vh}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) :is(.who,.gw,.pts,.hist,.bar){display:none}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband,.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .eB .tband{grid-row:1 / -1;grid-column:1 / -1;flex-direction:column;justify-content:center;gap:5vh;margin:4vh 2vw;background:none;font-size:7vh;text-align:center}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tlogo{width:14vh;height:14vh}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tname{flex:0 0 auto}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tie{height:auto;padding:2vh 4vw;border-radius:1.6vh}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tscore{font-size:22vh;line-height:.9}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tie i{font-size:4vh}
/* final: games won is the big number, .board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"]NER opens the winner's status line */
.board:has(.isComplete[style*="opacity: 1"]) .end{grid-template-areas:"band band" "who who" "pts pts" "hist hist"}
.board:has(.isComplete[style*="opacity: 1"]) .eA .who{padding-left:0}
.board:has(.isComplete[style*="opacity: 1"]) .eB .who{padding-right:0}
.board:has(.isComplete[style*="opacity: 1"]) .gw{grid-area:pts;align-self:center;justify-self:center;flex-direction:column-reverse;width:auto;height:auto;border:0;gap:2vh}
.board:has(.isComplete[style*="opacity: 1"]) .gn{font-size:40vh;line-height:.8}
.board:has(.isComplete[style*="opacity: 1"]) .gw i{font-size:4.2vh}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"]){box-shadow:inset 0 0 0 .8vh #ffd23f}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"]) .gn{color:#ffd23f}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"]){background:#0d3f29}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"]) :is(.gn,.name,.gw i){color:#a9cbb9}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"]) .flag{opacity:.55}
</style>
</head>
