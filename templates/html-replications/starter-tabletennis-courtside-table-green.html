<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Courtside — Table Green</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.flag:not([src]),.tlogo:not([src]){display:none}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.won{position:absolute;z-index:0}
.gs{position:relative;z-index:1}
.gtag .nx{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .now{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{height:100%;overflow:hidden}
.osb-core-fields{display:none!important}
.end[data-osb-resolved-court-side="A"] .isBWinner,.end[data-osb-resolved-court-side="B"] .isAWinner,.end:not([data-osb-resolved-court-side]) :is(.isAWinner,.isBWinner){display:none!important}
.hg:not(:has(.won[style*="opacity: 1"])){position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;padding:0!important;margin:0!important;border:0!important}
.hg .won{display:none}
.name{overflow-wrap:normal;word-break:normal;hyphens:none}
/* status chips flow: an empty chip takes no room, so both ends keep the same packed order */
.to-slot:not(:has(>[style*="opacity: 1"])),.card:not([style*="opacity: 1"]){display:none}
.end:has(.to-on[style*="opacity: 1"]) .to-used{opacity:0!important}
.board:has(.isComplete[style*="opacity: 1"]) .big{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important}

.board{position:fixed;inset:0;display:flex;flex-direction:column;font-family:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#fff;background:transparent;-webkit-font-smoothing:antialiased;overflow:hidden;--paper:#f4f4ef;--felt:#13623f;--deep:#0b3d2a;--gold:#ffd23f;--mint:#cfe6da}
/* header bar: event and round, the match state tag, best-of or a match-level banner */
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:2vw;flex:0 0 14vh;padding:0 2.4vw;background:#08140f}
.info{display:flex;flex-direction:column;justify-content:center;gap:.6vh;min-width:0;text-transform:uppercase;white-space:nowrap}
.info>*{overflow:hidden;text-overflow:ellipsis}
.ev{font-size:4.8vh;font-weight:800;letter-spacing:.06em}
.rd{font-size:3.6vh;font-weight:700;letter-spacing:.08em;color:#bfe0cf}
.rd:empty{display:none}
.teamlbl{display:none;font-size:4.4vh;font-weight:800;letter-spacing:.08em}
.info:not(:has(.ev:not(:empty))):not(:has(.rd:not(:empty))) .teamlbl{display:block}
.board:not(:has(.tname:not(:empty))) .teamlbl{display:none!important}
.tagslot{width:36vh;height:9vh}
.tagslot>*{border-radius:1vh;font-size:4.6vh;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.gtag{background:#fff;color:var(--deep)}
.pre{box-shadow:inset 0 0 0 .4vh #2d6b4f;color:#bfe0cf}
.tagslot:has(>.gtag[style*="opacity: 1"]) .pre,.tagslot:has(>.fin[style*="opacity: 1"]) .pre,.board:has(.isWarmUpStarted[style*="opacity: 1"]) .pre{opacity:0}
.fin{background:var(--gold);color:#111}
.right{display:flex;align-items:center;justify-content:flex-end;gap:1vw;min-width:0}
.chip{width:24vh;height:6.6vh}
.fl{border-radius:.7vh;font-size:3.2vh;font-weight:800;letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 0 0 .3vh #9cc9b2;color:#e7f5ee}
.banner{width:44vh;height:9vh}
.bn{border-radius:1vh;font-size:4.6vh;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.bn-warm{background:#fff;color:var(--deep)}
.bn-break{box-shadow:inset 0 0 0 .5vh #fff;color:#fff}
.banner>.bo{justify-content:flex-end;font-size:4.4vh;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#bfe0cf}
.board:not(:has(.isMatchStarted[style*="opacity: 1"])) .banner:has(>.isWarmUpStarted[style*="opacity: 1"])>.bo,
.board:not(:has(.isComplete[style*="opacity: 1"])) .banner:has(>.isInBetweenGames[style*="opacity: 1"])>.bo{opacity:0}
/* the table: one half per court end, the net between them */
.table{display:flex;flex:1 1 auto;min-height:0;margin:2.4vh 2.4vw 3vh;border:1vh solid var(--paper);border-radius:.6vh;background:var(--felt);box-shadow:0 1vh 3vh rgba(0,0,0,.45)}
.net{flex:0 0 1.2vw;background:repeating-linear-gradient(0deg,#1c1c1c 0 .6vh,#3b3b3b .6vh 1.2vh);box-shadow:inset .25vw 0 0 var(--paper),inset -.25vw 0 0 var(--paper)}
.end{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 17vh minmax(0,1fr) 9vh;grid-template-areas:"band band" "gw who" "pts pts" "hist hist";row-gap:0;flex:1 1 0;min-width:0;padding:2.6vh 2vw 3vh}
.eB{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"band band" "who gw" "pts pts" "hist hist"}
.kit{position:absolute;left:0;right:0;bottom:0;height:1.2vh;background:#7aa08d}
/* team tie strip */
.tband{grid-area:band;display:none;align-items:center;gap:1.2vw;margin-bottom:1.6vh;padding:0 1.4vw;min-height:8vh;border-radius:.8vh;background:var(--deep);font-size:4.2vh;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.eB .tband{flex-direction:row-reverse;text-align:right}
.board:has(.tname:not(:empty)) .tband{display:flex}
.tband .tlogo{width:6vh;height:6vh;object-fit:contain;flex:0 0 auto}
.tband .tname{flex:1 1 auto;min-width:0;line-height:1.05;overflow-wrap:normal;hyphens:none}
.tband .tie{display:inline-flex;align-items:center;gap:1vw;flex:0 0 auto;height:6.2vh;padding:0 1.3vw;border-radius:.6vh;background:var(--paper);color:var(--deep)}
.tband .tie i{font-style:normal;font-size:3.4vh;letter-spacing:.12em}
.tband .tscore{font-size:5vh;font-variant-numeric:tabular-nums}
/* GAMES box at the outer corner */
.gw{grid-area:gw;align-self:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;width:17vh;height:15vh;border:.5vh solid var(--paper);border-radius:1vh;font-weight:900;text-transform:uppercase}
.gw i{font-style:normal;font-size:3.2vh;letter-spacing:.12em;line-height:1;color:#e3f3ea}
.gn{font-size:8.6vh;line-height:.9;font-variant-numeric:tabular-nums}
/* identity: flag + name on top, the player's own status line under it */
.who{grid-area:who;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) 6.6vh;grid-template-areas:"flag name" "marks marks";column-gap:1.2vw;row-gap:1vh;align-items:center;min-width:0;height:15vh;padding:0 0 0 1.6vw}
.eB .who{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name flag" "marks marks";padding:0 1.6vw 0 0}
.flag{grid-area:flag;width:7vh;height:4.7vh;object-fit:cover;border-radius:.4vh;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.nm{grid-area:name;min-width:0}
.eB .nm{text-align:right}
.name{display:block;font-size:4.8vh;line-height:1.02;font-weight:800;text-transform:uppercase}
.marks{grid-area:marks;display:flex;align-items:center;gap:.8vw;min-width:0;height:6.6vh}
.eB .marks{justify-content:flex-end}
.to-slot{width:17vh;height:6vh}
.to-used{border-radius:.6vh;font-size:3.2vh;font-weight:900;letter-spacing:.04em;text-transform:uppercase;background:var(--deep);color:#e7f5ee}
.card{display:inline-flex;align-items:center;gap:.7vw;height:6vh;padding:0 1.3vw 0 .9vw;border-radius:.6vh;font-size:3.2vh;font-weight:900;letter-spacing:.05em;text-transform:uppercase;background:var(--deep);color:#fff;white-space:nowrap}
.card b{flex:0 0 auto;width:3vh;height:4.2vh;border-radius:.4vh;box-shadow:0 0 0 .25vh rgba(0,0,0,.35)}
.yc b{background:#ffd400}.rc b{background:#e3262f}
.win{display:none;align-items:center;height:6vh;padding:0 1.4vw;border-radius:.6vh;background:var(--gold);color:#111;font-size:3.4vh;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.win[style*="opacity: 1"]{display:inline-flex}
/* game point / match point: in the leading player's own panel (the neutral label, shown at the end whose side has the point) */
.ptslot{display:none;width:30vh;height:6vh}
.end[data-osb-resolved-court-side="A"]:has(:is(.isAGamePoint,.isAMatchPoint)[style*="opacity: 1"]) .ptslot,.end[data-osb-resolved-court-side="B"]:has(:is(.isBGamePoint,.isBMatchPoint)[style*="opacity: 1"]) .ptslot{display:inline-block}
.pt{border-radius:.6vh;background:var(--paper);color:var(--deep);font-size:3.6vh;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.pside{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.end[data-osb-resolved-court-side="A"]:has(:is(.isAGamePoint,.isAMatchPoint)[style*="opacity: 1"]),.end[data-osb-resolved-court-side="B"]:has(:is(.isBGamePoint,.isBMatchPoint)[style*="opacity: 1"]){box-shadow:inset 0 0 0 .7vh var(--paper)}
/* points, and the serve marker inside the server's own half */
.pts{grid-area:pts;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.big{font-size:41vh;line-height:.78;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 1vh 2.4vh rgba(0,0,0,.25)}
.ss{position:absolute;top:.4vh;width:23vh;height:8.4vh}
.eA .ss{right:1.4vw}
.eB .ss{left:1.4vw}
.srv{gap:1.2vh;border-radius:4.2vh;background:rgba(0,0,0,.3);padding:0 2vh 0 1vh;font-size:4vh;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.eB .srv{flex-direction:row-reverse;padding:0 1vh 0 1.8vh}
.ball{flex:0 0 auto;width:6.6vh;height:6.6vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff8a1c 46%,#d65f00 100%);box-shadow:0 0 0 .4vh rgba(0,0,0,.25),0 0 2.4vh rgba(255,138,28,.55)}
/* finished games along the outer baseline, mirrored */
.hist{grid-area:hist;position:relative;display:flex;align-items:center;gap:.8vw}
.eB .hist{justify-content:flex-end}
.hg{display:flex;align-items:center;gap:.7vw;height:8vh;padding:0 1.2vw;border-radius:.8vh;font-weight:800;font-variant-numeric:tabular-nums;background:var(--deep);color:var(--mint)}
.hl{font-style:normal;font-size:3.2vh;letter-spacing:.06em}
.gs{font-size:5.4vh}
.end[data-osb-resolved-court-side="A"] .hg:has(.wA[style*="opacity: 1"]),.end[data-osb-resolved-court-side="B"] .hg:has(.wB[style*="opacity: 1"]){background:var(--paper);color:var(--deep)}
/* active time-out: a banner with its countdown over the history row of that player's half */
.tob{grid-area:hist;z-index:2;align-self:center;justify-self:start;display:flex;align-items:center;gap:1.4vw;height:8vh;padding:0 1.6vw;border-radius:.8vh;background:var(--gold);color:#111;font-size:4.2vh;font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.eB .tob{justify-self:end}
.tclock{display:inline-flex;align-items:center;justify-content:center;min-width:9vh;height:6vh;padding:0 1vh;border-radius:.6vh;background:#111;color:var(--gold);font-size:4.8vh;font-variant-numeric:tabular-nums}
.end:has(.tob[style*="opacity: 1"]) .hist{visibility:hidden}
/* between games: the finished game is the story, the 0-0 of the next one steps back */
.board:has(.isInBetweenGames[style*="opacity: 1"]):not(:has(.isComplete[style*="opacity: 1"])) .big{font-size:30vh;opacity:.4}
.board:has(.isInBetweenGames[style*="opacity: 1"]):not(:has(.isComplete[style*="opacity: 1"])) .end{grid-template-rows:auto 17vh minmax(0,1fr) 13vh}
.board:has(.isInBetweenGames[style*="opacity: 1"]):not(:has(.isComplete[style*="opacity: 1"])) .hg{height:12vh;padding:0 1.8vw;gap:1.2vw}
.board:has(.isInBetweenGames[style*="opacity: 1"]):not(:has(.isComplete[style*="opacity: 1"])) .hl{font-size:4.2vh}
.board:has(.isInBetweenGames[style*="opacity: 1"]):not(:has(.isComplete[style*="opacity: 1"])) .gs{font-size:8.4vh}
/* team tie */
.board:has(.tname:not(:empty)) .big{font-size:36vh}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) :is(.who,.gw,.pts,.hist){display:none}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband,.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .eB .tband{grid-row:1 / -1;grid-column:1 / -1;flex-direction:column;justify-content:center;gap:5vh;margin:4vh 2vw;background:none;font-size:7vh;text-align:center}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tlogo{width:14vh;height:14vh}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tname{flex:0 0 auto}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tie{height:auto;gap:2vw;padding:2vh 4vw;border-radius:1.6vh}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tscore{font-size:22vh;line-height:.9}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tie i{font-size:5vh}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .bar .pre{opacity:0}
/* final: games won is the big number; the winner's half is framed in gold, the loser's in white, both readable */
.board:has(.isComplete[style*="opacity: 1"]) .end{grid-template-areas:"band band" "who who" "pts pts" "hist hist"}
.board:has(.isComplete[style*="opacity: 1"]) .eA .who{padding-left:0}
.board:has(.isComplete[style*="opacity: 1"]) .eB .who{padding-right:0}
.board:has(.isComplete[style*="opacity: 1"]) .gw{grid-area:pts;align-self:center;justify-self:center;flex-direction:column-reverse;width:auto;height:auto;border:0;gap:2vh}
.board:has(.isComplete[style*="opacity: 1"]) .gn{font-size:40vh;line-height:.8}
.board:has(.isComplete[style*="opacity: 1"]) .gw i{font-size:4.4vh}
.board:has(.isComplete[style*="opacity: 1"]) .end{box-shadow:inset 0 0 0 .6vh rgba(244,244,239,.7)}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"]){box-shadow:inset 0 0 0 .9vh var(--gold)}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"]) .gn{color:var(--gold)}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"]){background:#0f4a31}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"]) :is(.gn,.name){color:#e3efe8}
</style>
</head>
<body>
<main class="board t-green" data-osb-component="layout"><div class="bar" data-osb-component="layout"><span class="info"><span class="eventName ev" data-osb-component="field" data-osb-field="eventName"></span><span class="matchRound rd" data-osb-component="field" data-osb-field="matchRound"></span><span class="teamlbl">Team match</span></span><span class="slot tagslot"><span class="isMatchStarted gtag" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0"><span class="now">Game <span class="currentGame cg" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="nx">Game <span class="nextGame ng" data-osb-component="field" data-osb-field="nextGame"></span> next</span></span><span class="isComplete fin" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">Final</span><span class="pre">Pre-match</span></span><span class="right"><span class="slot chip"><span class="isCourtSideScoreboardFlipped fl" data-osb-component="field" data-osb-field="isCourtSideScoreboardFlipped" style="opacity:0">View flipped</span></span><span class="slot banner"><span class="matchFormatLabel bestOf bo" data-osb-component="field" data-osb-field="matchFormatLabel"></span><span class="isWarmUpStarted bn bn-warm" data-osb-component="field" data-osb-field="isWarmUpStarted" style="opacity:0">Warm-up</span><span class="isInBetweenGames bn bn-break" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">Change ends</span></span></span></div><div class="table" data-osb-component="layout"><div class="courtSideAView end eA" data-osb-component="layout"><span class="jerseyColorA kit" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="tband" data-osb-component="layout"><img class="teamLogoURLA tlogo" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><span class="teamAName tname" data-osb-component="field" data-osb-field="teamAName"></span><span class="tie"><i>Tie</i><span class=
