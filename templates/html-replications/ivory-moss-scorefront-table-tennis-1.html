<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Tennis — Ivory Moss Scorefront Scorebug</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--ivory:#f0eee8;--indigo:#303f57;--moss:#d9e0d3;--ink:#273643;--white:#fbfbf8;--rule:#aeb9b7;display:flex;flex-direction:column;width:min(59.3vw,1155px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:3px;background:var(--ivory);color:var(--ink);container-type:inline-size}
.topline{position:relative;display:flex;flex:0 0 auto;height:7.1cqw;align-items:center;padding:0 3cqw;background:var(--indigo);color:var(--white);font-size:4.4cqw;line-height:1;font-weight:700;white-space:nowrap}
.rows{display:flex;flex:1 1 auto;min-width:0;flex-direction:column}
.row{display:flex;flex:1 1 50%;min-width:0;min-height:12.6cqw;align-items:stretch}
.row+.row{border-top:1px solid var(--rule)}
.identity{display:block;flex:0 0 3.2%;width:3.2%;background:#2584a0}
.jerseyColorB{background:#c46a61}
.primary-track,.support-cell{display:flex;min-width:0;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap}
.primary-track{flex:0 0 20%;width:20%;background:var(--ivory)}
.support-cell{flex:0 0 18%;width:18%;background:var(--moss)}
.primary-score,.support-score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.primary-score{font-size:7.4cqw}.support-score{font-size:6.7cqw}
.primary-label,.support-label{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:1.8cqw;line-height:1;font-weight:700}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.7cqw;padding:0 2.2cqw 0 5.7cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:6cqw;line-height:1.04;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .55cqw;width:.55cqw;height:.55cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--ink)}
.point-slot{position:absolute;right:2%;top:0;width:20%;height:100%;font-size:1.1cqw;font-weight:700;text-align:center}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--indigo)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.topline{height:35px;padding:0 9px;font-size:15px}.row{min-height:82px}.identity{flex-basis:5px;width:5px}.primary-track{flex-basis:24%;width:24%}.support-cell{flex-basis:24%;width:24%}.primary-score{font-size:37px}.support-score{font-size:30px}.primary-label,.support-label{font-size:8px}.name-lane{gap:2px;padding:0 6px}.name{font-size:18px}.serve{flex-basis:5px;width:5px;height:5px}.point-slot{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="topline"><span>TABLE TENNIS</span><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div><div class="rows columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="primary-track"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-label">POINTS</span></div><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="support-cell"><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-label">GAMES</span></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="primary-track"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-label">POINTS</span></div><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="support-cell"><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-label">GAMES</span></div></div></div></article></main></body></html>
