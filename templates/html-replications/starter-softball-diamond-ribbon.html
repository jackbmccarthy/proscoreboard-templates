<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Diamond Ribbon</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.osb-core-fields{display:none!important}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.nm{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;text-wrap:balance}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.72)}
.diamond>.base{position:absolute;width:calc(var(--d,3rem)*.3);height:calc(var(--d,3rem)*.3);transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.08rem);overflow:hidden}
.diamond>.base.second{left:35%;top:calc(var(--d,3rem)*.082)}.diamond>.base.third{left:10%;top:calc(var(--d,3rem)*.332)}.diamond>.base.first{left:60%;top:calc(var(--d,3rem)*.332)}
.diamond .runner{position:absolute;inset:0;background:var(--base-on,#f5cf52)}
.dots{display:flex;gap:var(--dot-gap,.22rem)}
.dot{position:relative;flex:none;width:var(--dot,.62rem);height:var(--dot,.62rem);border-radius:50%;background:var(--dot-off,rgba(255,255,255,.18));box-shadow:inset 0 0 0 .08rem var(--dot-edge,transparent)}
.dot>.lit{position:absolute;inset:0;border-radius:50%;background:var(--dot-on,#f5cf52)}
.half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.half-dim{position:absolute;inset:0}
.half-dim::before,.half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.25))}
.half-dim::before,.half-dim::after{position:absolute;left:0;width:100%;height:100%}
.half-dim::before,.inningHalf::after{clip-path:polygon(50% 6%,94% 42%,6% 42%)}
.half-dim::after,.inningHalf::before{clip-path:polygon(6% 58%,94% 58%,50% 94%)}
.half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.ev-e:empty,.ev-r:empty{display:none}.ev-e:not(:empty)+.ev-r:not(:empty)::before{content:"\00b7";margin:0 .4em;opacity:.7}
.st{position:relative;display:inline-grid;align-items:center;justify-items:end}
.st>*{grid-area:1/1}
.st-pre{opacity:0}.st:has(>.isMatchStarted[style*="opacity: 0"])>.st-pre{opacity:1}
.st-live-in{display:inline-flex;align-items:center;gap:.3em}.st-live-in>i{width:max(.5em,12px);height:max(.5em,12px);border-radius:50%;background:currentColor;animation:osb-pulse 1.6s ease-in-out infinite}
@keyframes osb-pulse{50%{opacity:.35}}
.board:has(.isComplete[style*="opacity: 1"]) .st-live-in{visibility:hidden}
.ls{display:flex}
.ls-extra{display:none!important}.ls-extra:has(>.ls-gate[style*="opacity: 1"]){display:flex!important}
.tick{position:relative}.tick>.tick-on{position:absolute;inset:0;border-radius:inherit;background:var(--tick-on,#fff)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.board{position:fixed;left:50%;bottom:2.4rem;transform:translateX(-50%);font-family:"Avenir Next Condensed","Bahnschrift SemiCondensed","Roboto Condensed","Arial Narrow",sans-serif;color:#fbf6f2}
.rib{display:grid;grid-template-columns:18rem 3.8rem 15rem 3.8rem 18rem;align-items:stretch;filter:drop-shadow(0 .35rem .8rem rgba(0,0,0,.4))}
.side{position:relative;display:flex;flex-direction:column;justify-content:center;gap:.3rem;height:4.4rem;margin-top:1.4rem;background:#5b1a2e;padding:0 1rem}
.side.a{align-items:flex-end;text-align:right;border-radius:.4rem 0 0 .4rem;padding-left:1.4rem}.side.b{align-items:flex-start;border-radius:0 .4rem .4rem 0;padding-right:1.4rem}
.chip{position:absolute;top:0;bottom:0;width:.55rem}.side.a .chip{left:0;border-radius:.4rem 0 0 .4rem}.side.b .chip{right:0;border-radius:0 .4rem .4rem 0}
.home{position:absolute;top:.5rem;width:.48rem;height:.5rem;background:#d4adb8;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}.side.a .home{left:.8rem}.side.b .home{right:.8rem}
.nm{font-weight:700;font-size:1.4rem;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.sub{display:flex;align-items:center;gap:.8rem;font:700 .95rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.08em;color:#d4adb8}
.sub .he{color:#fbf6f2;margin-left:.25rem}.side.a .sub .he{margin:0 .25rem 0 0}
.bat{width:.6rem;height:.6rem;border-radius:50%;background:#ffb547}
.batl{display:flex;align-items:center;gap:.35rem;color:#ffb547}
.runs{display:flex;align-items:center;justify-content:center;height:4.4rem;margin-top:1.4rem;background:#77243d;font:700 2.5rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums}
.med{position:relative;display:flex;flex-direction:column;align-items:center;background:#2c0c17;border-radius:.5rem .5rem .3rem .3rem;box-shadow:inset 0 0 0 .1rem rgba(255,255,255,.12)}
.tab{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;height:1.4rem;background:#ffb547;color:#2c0c17;border-radius:.5rem .5rem 0 0;font:700 .76rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.sit{position:relative;flex:1;width:100%;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;align-content:center;justify-content:center;column-gap:.9rem;row-gap:.25rem;padding:.2rem .6rem}

.inn{display:flex;align-items:center;gap:.15rem;font:700 1.85rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;--half-on:#ffb547;--half-off:rgba(255,255,255,.2);--half-h:1.85rem;--half-size:0.80rem}
.sit .diamond{--d:3.6rem;--base-edge:#f4e8ec;--base-off:rgba(255,255,255,.05);--base-on:#ffb547;--base-line:.13rem}
.cnt{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.count{font:700 1.65rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums}.count .dash{opacity:.55;margin:0 .06em}
.bs{display:flex;gap:.45rem;--dot:0.56rem;--dot-gap:.17rem;--dot-off:rgba(255,255,255,.16);--dot-edge:transparent}.ball-dots{--dot-on:#6be09a}.strike-dots{--dot-on:#ff6b6b}
.outw{display:flex;flex-direction:column;align-items:center;gap:.3rem;--dot:0.7rem;--dot-gap:.3rem;--dot-off:rgba(255,255,255,.16);--dot-edge:transparent;--dot-on:#ffb547}
.outs-l{font:700 .74rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.14em;color:#d4adb8}
.sit .diamond{grid-row:1;grid-column:2}.inn{grid-row:1;grid-column:1;justify-self:end}.cnt{grid-row:2;grid-column:1}.outw{grid-row:2;grid-column:2;flex-direction:row}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;background:#2c0c17;text-transform:uppercase;text-align:center;z-index:2}
.cover b{font:700 .78rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.16em;color:#d4adb8}
.cover .periodLabel{font:700 1.45rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.04em}
.cover.fin{font:700 1.6674999999999998rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.1em;color:#ffb547}
.cover{border-radius:0 0 .3rem .3rem}
.evw{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:0 .4rem;height:1.4rem;align-items:center;font:700 .8rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#fbf6f2}
.ticks{display:flex;gap:.2rem}.tick{width:.7rem;height:.26rem;border-radius:.13rem;background:rgba(255,255,255,.22);--tick-on:#fbf6f2}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.sub>span,.he.hitsA,.he.errorsA,.outs-l,.cover.isInBetweenGames>b,.he.hitsB,.he.errorsB,.ev-e.eventName,.ev-r.matchRound::before,.ev-r.matchRound,.st-live-in,.st-pre{font-size:1.25vw!important}
.home.isAHome,.home.isBHome{width:1.016vw!important;height:0.938vw!important;min-width:0!important;flex-shrink:0!important}
.bat.isABatting,.dot,.lit.isBall1,.lit.isBall2,.lit.isBall3,.lit.isStrike1,.lit.isStrike2,.bat.isBBatting{width:1.016vw!important;height:1.016vw!important;min-width:0!important;flex-shrink:0!important}
.lit.isOut1,.lit.isOut2,.st-live-in>i{width:0.938vw!important;height:0.938vw!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

</style></head><body><main class="board" aria-label="Softball lower-third scoreboard">
<div class="rib rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="softball score ribbon">
<div class="side a"><span class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"><span class="home isAHome" data-osb-component="field" data-osb-field="isAHome" style="opacity: 0"></span></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="sub"><span>H<span class="he hitsA" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span></span><span>E<span class="he errorsA" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsA">0</span></span><span class="batl"><span class="bat isABatting" data-osb-component="field" data-osb-field="isABatting" style="opacity: 0"></span></span></span></div><span class="runs currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span>
<div class="med"><div class="tab"><span class="st"><span class="st-pre">PREGAME</span><span class="st-live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0"><span class="st-live-in"><i></i>LIVE</span></span></span></div><div class="sit"><span class="inn"><span class="half" aria-hidden="true"><span class="half-dim"></span><span class="half-win"><span class="inningHalf" data-osb-component="field"></span></span></span><span class="inn-n inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="diamond" aria-label="Bases"><span class="base second"><span class="runner isRunnerOnSecond" data-osb-component="field" data-osb-field="isRunnerOnSecond" style="opacity: 0"></span></span><span class="base third"><span class="runner isRunnerOnThird" data-osb-component="field" data-osb-field="isRunnerOnThird" style="opacity: 0"></span></span><span class="base first"><span class="runner isRunnerOnFirst" data-osb-component="field" data-osb-field="isRunnerOnFirst" style="opacity: 0"></span></span></span><span class="cnt"><span class="count"><span class="cb balls" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span><span class="dash" aria-hidden="true">-</span><span class="cs strikes" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span><span class="bs"><span class="dots ball-dots"><span class="dot"><span class="lit isBall1" data-osb-component="field" data-osb-field="isBall1" style="opacity: 0"></span></span><span class="dot"><span class="lit isBall2" data-osb-component="field" data-osb-field="isBall2" style="opacity: 0"></span></span><span class="dot"><span class="lit isBall3" data-osb-component="field" data-osb-field="isBall3" style="opacity: 0"></span></span></span><span class="dots strike-dots"><span class="dot"><span class="lit isStrike1" data-osb-component="field" data-osb-field="isStrike1" style="opacity: 0"></span></span><span class="dot"><span class="lit isStrike2" data-osb-component="field" data-osb-field="isStrike2" style="opacity: 0"></span></span></span></span></span><span class="outw"><span class="dots out-dots"><span class="dot"><span class="lit isOut1" data-osb-component="field" data-osb-field="isOut1" style="opacity: 0"></span></span><span class="dot"><span class="lit isOut2" data-osb-component="field" data-osb-field="isOut2" style="opacity: 0"></span></span></span><span class="outs-l">OUT</span></span><span class="cover isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0"><b>End of</b><span class="periodLabel" data-osb-component="field" data-osb-field="periodLabel"></span></span><span class="cover fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0">Final</span></div></div>
<span class="runs currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><div class="side b"><span class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"><span class="home isBHome" data-osb-component="field" data-osb-field="isBHome" style="opacity: 0"></span></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="sub"><span>H<span class="he hitsB" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span></span><span>E<span class="he errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></span><span class="batl"><span class="bat isBBatting" data-osb-component="field" data-osb-field="isBBatting" style="opacity: 0"></span></span></span></div>
</div>
<div class="evw"><span class="ev"><span class="ev-e eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span class="ticks" aria-label="Innings"><span class="tick"><span class="tick-on isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity: 0"></span></span></span></div>
<span class="sr"><span class="battingSide" data-osb-component="field" data-osb-field="battingSide"></span><span class="bases" data-osb-component="field" data-osb-field="bases"></span><span class="outs" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span></span><span class="osb-core-fields" aria-hidden="true"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></span></span>
</main></body></html>
