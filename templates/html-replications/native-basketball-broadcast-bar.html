<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broadcast Bar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 30px 24px 24px; font-family: "Helvetica Neue", Arial, sans-serif; }
    .bar { position: relative; display: grid; grid-template-columns: 1fr 250px 1fr; width: 1180px; color: #fff; filter: drop-shadow(0 8px 16px #0009); }
    .plate { position: relative; display: flex; align-items: stretch; height: 70px; background: linear-gradient(#262c35, #12151a); }
    .plate.b { flex-direction: row-reverse; }
    .kit { width: 16px; background-color: #59616e; }
    .nm { flex: 1; min-width: 0; display: flex; align-items: center; padding: 0 22px; font-size: 34px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plate.b .nm { justify-content: flex-end; }
    .pts { display: flex; align-items: center; justify-content: center; width: 110px; background: #fff; color: #0c0e12; font-size: 50px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .rail { display: flex; align-items: center; gap: 16px; height: 26px; padding: 0 22px; background: #0c0e12; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color: #8e97a5; }
    .rail.b { justify-content: flex-end; }
    .fl, .tol-v { color: #fff; margin-left: 5px; }
    .bonus { background: #e43d30; color: #fff; padding: 2px 7px; border-radius: 2px; }
    .bonus:empty { display: none; }
    .tol::before { content: "TIMEOUTS"; }
    .tol:has(.tol-v:empty) { display: none; }
    .mid { position: relative; display: flex; flex-direction: column; background: #0c0e12; border-inline: 3px solid #e43d30; }
    .clockrow { display: flex; align-items: center; justify-content: center; gap: 12px; height: 70px; }
    .per { min-width: 40px; padding: 2px 6px; text-align: center; border: 2px solid #e43d30; border-radius: 3px; font-size: 22px; font-weight: 800; color: #fff; }
    .per:empty { display: none; }
    .gc { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .shot { display: flex; align-items: center; justify-content: center; min-width: 42px; height: 36px; background: #e43d30; font-size: 24px; font-weight: 800; border-radius: 3px; }
    .shot:has(.sc-v:empty) { display: none; }
    .under { display: flex; align-items: center; justify-content: center; gap: 12px; height: 26px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #8e97a5; }
    .pips { display: flex; gap: 4px; align-items: center; }
    .pip { position: relative; width: 22px; height: 5px; background: #2b313a; }
    .pip-on { position: absolute; inset: 0; background: #fff; }
    .pip.pip-ot { width: auto; height: auto; padding: 1px 4px; background: #e43d30; color: #fff; font-size: 10px; }
    .poss::before { content: "POSS "; }
    .poss-v { color: #fff; }
    .poss:has(.poss-v:empty) { display: none; }
    .to-flag { position: absolute; inset: 0; align-items: center; justify-content: center; gap: 12px; background: #e43d30; font-size: 28px; font-weight: 800; letter-spacing: 5px; }
    .ev { position: absolute; left: -3px; right: -3px; top: -26px; display: flex; justify-content: center; gap: 10px; padding: 5px 0 3px; background: #e43d30; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .ev:has(.eventName:empty):has(.matchRound:empty) { display: none; }
    .ev-round { opacity: .8; }
    .brk { position: absolute; inset: 0 0 26px; display: flex; align-items: center; justify-content: center; background: #e43d30; font-size: 26px; font-weight: 800; letter-spacing: 6px; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="bar" aria-label="Basketball lower third">
  <div class="side">
    <div class="plate a"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><div class="to-flag isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
    <div class="rail a"><span>FOULS<span class="fl teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</span></span><span class="tol"><span class="tol-v timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span></span><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span></div>
  </div>
  <div class="mid">
    <span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
    <div class="clockrow"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="shot"><span class="sc-v" data-osb-static="true" data-sport-stat="shotClock"></span></span></div>
    <div class="under"><span class="pips"><span class="pip"><span class="pip-on isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="pip pip-ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span><span class="poss"><span class="poss-v possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span></span></div>
    <span class="brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">BREAK</span>
  </div>
  <div class="side">
    <div class="plate b"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><div class="to-flag isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
    <div class="rail b"><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span><span class="tol"><span class="tol-v timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span></span><span>FOULS<span class="fl teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</span></span></div>
  </div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><span class="possession" data-osb-component="field" data-osb-field="possession"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
