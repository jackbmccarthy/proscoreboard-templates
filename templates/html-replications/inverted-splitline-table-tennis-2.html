<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inverted Splitline TABLE TENNIS 2</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{font-family:Arial,Helvetica,sans-serif;font-weight:700;color:#f2eee3}.stage{display:flex;align-items:center;justify-content:center;min-height:100vh}.board{width:min(var(--view-width),1500px,var(--height-width));container-type:inline-size;position:relative;display:flex;flex-direction:column;background:transparent;padding-bottom:3.5cqw}.header{text-align:center;margin:0 0 var(--header-gap);font-size:var(--header-size);line-height:1;white-space:nowrap}.cap{position:relative;display:flex;align-items:center;gap:1.6cqw;min-width:0;padding:0 var(--cap-pad);height:var(--cap-height);background:#eab743;color:#121316}.name{flex:1;min-width:0;display:block;font-size:var(--name-font);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.025em}.combinedAName:empty:before{content:"Player A"}.combinedBName:empty:before{content:"Player B"}.secondary{display:flex;align-items:center;justify-content:center;font-size:var(--games-font);gap:.8cqw;flex-shrink:0;white-space:nowrap}.match-score{display:block;min-width:2ch;font-variant-numeric:tabular-nums;text-align:center}.serve{position:absolute;top:.25cqw;right:.3cqw;width:1.2cqw;height:1.2cqw;font-size:1.2cqw}.panel{height:var(--panel-height);position:relative;isolation:isolate;background:#121316;display:flex}.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:#f2eee3;z-index:0}.score-track{position:relative;min-width:0;flex:1;height:100%}.score{position:absolute;top:46%;left:0;display:block;width:100%;font-family:"Arial Black",Arial,Helvetica,sans-serif;font-weight:900;font-size:var(--score-font);line-height:.7;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.07em;white-space:nowrap;color:#fff;mix-blend-mode:difference;transform:translateY(-50%) scaleY(var(--score-stretch));padding:0 1cqw}.label{position:absolute;bottom:var(--label-bottom);left:0;width:100%;font .score{top:39%}

/* Reserved conditional match states: all score and name tracks remain fixed. */
.osb-conditional-rail{--osb-rail-bg:#15161a;--osb-rail-fg:#f9fbfa;box-sizing:border-box!important;position:relative!important;inset:auto!important;transform:none!important;grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:28px!important;height:28px!important;margin:0!important;padding:2px 7px!important;gap:5px!important;overflow:hidden!important;background:var(--osb-rail-bg)!important;color:var(--osb-rail-fg)!important;border:0!important;font:700 11px/1 Arial,Helvetica,sans-serif!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap!important;animation:none!important;transition:none!important}

.osb-conditional-rail .osb-timeout-icon::before{content:""!important;display:block!important;width:11px!important;height:11px!important;border:1.5px solid currentColor!important;border-radius:50%!important;background:transparent!important}

.osb-conditional-rail .point-slot.osb-shared-point{all:unset!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30%!important;width:30%!important;min-width:78px!important;max-width:130px!important;height:22px!important;min-height:22px!important;inset:auto!important;margin:0!important;padding:0!important;transform:none!important;overflow:hidden!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important}
.osb-conditional-rail .point-slot.osb-shared-point>.isGamePoint,.osb-conditional-rail .point-slot.osb-shared-point>.isMatchPoint{box-sizing:border-box!important;position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;transform:none!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:390px){.osb-conditional-rail{padding:2px 4px!important;gap:3px!important}.osb-conditional-rail .osb-condition-side{gap:1px!important}.osb-conditional-rail .osb-condition-slot{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-timeoutused{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:15px!important;width:15px!important}.osb-conditional-rail .point-slot.osb-shared-point{min-width:76px!important}}
@media(max-width:600px){.board:has(>.osb-conditional-rail){--view-width:90vw!important}}@media(min-width:701px){.board:has(>.osb-conditional-rail){transform:scale(.92)!important}}
