<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Tennis — Charcoal Outline Sidecar Lower Third</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-right:5.2vw}
.board{--ink:#20272c;--pale:#f2f3ee;--line:#b7c4c7;position:relative;width:min(88vw,1910px);min-width:0;container-type:inline-size}
.sport-tag{position:absolute;left:0;bottom:100%;display:flex;align-items:center;justify-content:center;min-width:14.5%;height:2.3cqw;min-height:30px;padding:0 1.2cqw;background:var(--pale);color:#263239;font-size:1.8cqw;line-height:1;font-weight:700;white-space:nowrap}
.surface{display:flex;align-items:stretch;min-width:0;height:clamp(76px,7.8vw,160px);border:1px solid var(--line);border-radius:2px;background:var(--ink);overflow:hidden}
.side{display:flex;align-items:center;flex:1 1 50%;min-width:0;gap:1.3cqw;padding:0 1.1cqw;color:#fff}
.identity{display:block;flex:0 0 1cqw;width:1cqw;height:66%;background:#168fdb}
.jerseyColorB{background:#e12b47}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.7cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:3.65cqw;line-height:1.08;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .48cqw;width:.48cqw;height:.48cqw;min-width:6px;min-height:6px;border-radius:50%;background:#f2f3ee}
.divider{display:block;flex:0 0 2px;width:2px;height:68%;align-self:center;background:#c8d0d0}
.score-window{position:relative;display:flex;flex:0 0 11.2cqw;width:11.2cqw;height:91%;align-items:center;justify-content:center;border:1px solid #d1dbdc;background:var(--ink);color:#fff}
.score-label{position:absolute;left:0;right:0;top:10%;text-align:center;font-size:1.25cqw;line-height:1;font-weight:700;letter-spacing:.02em}
.score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;text-align:center;font-size:5.05cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
.dock{display:flex;flex:0 0 16%;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:.7cqw;background:var(--pale);color:#304047}
.dock-title{display:block;line-height:1;font-size:1.55cqw;font-weight:700}
.match-track{display:flex;width:100%;min-width:0;align-items:center;justify-content:space-around}
.match-score{display:block;flex:1 1 50%;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;font-size:4.1cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.match-rule{display:block;flex:0 0 1px;width:1px;height:3.2cqw;background:#536366}
.point-slot{position:absolute;right:0;bottom:100%;width:150px;height:19px;color:#fff;text-align:center;font-size:10px;font-weight:700}
.point-state{position:absolute;inset:0;display:block;background:var(--ink);padding:3px 4px}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.stage{padding-right:0}.board{width:94vw}.sport-tag{min-width:115px;height:28px;font-size:12px;padding:0 5px}.surface{height:78px}.side{gap:3px;padding:0 3px}.identity{flex-basis:4px;width:4px}.name-lane{gap:2px}.name{font-size:14px}.serve{flex-basis:5px;width:5px;height:5px;min-width:5px;min-height:5px}.score-window{flex-basis:49px;width:49px;height:59px;margin-bottom:0;align-self:center}.score-label{top:4px;bottom:auto;padding:0;font-size:7px}.score{font-size:30px;padding-top:5px}.dock{flex-basis:60px;gap:4px}.dock-title{font-size:9px}.match-score{font-size:19px}.match-rule{height:22px}.point-slot{height:16px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sport-tag">TABLE TENNIS</div><div class="surface rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="score-window"><span class="score-label">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div><span class="divider"></span><div class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="score-window"><span class="score-label">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div><aside class="dock columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="dock-title">GAMES</span><div class="match-track"><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="match-rule"></span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></aside></div><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body></html>
