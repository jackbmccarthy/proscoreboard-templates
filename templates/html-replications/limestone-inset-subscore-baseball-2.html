<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Limestone Inset Subscore horizontal</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#243941}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(95vw,1900px);max-width:100%;min-width:0;overflow:hidden;border:1px solid #aeb9b5;border-radius:5px;background:#ebe9e2;container-type:inline-size}
.competitors{display:flex;align-items:stretch;min-width:0}
.competitor{display:flex;align-items:center;flex:1 1 50%;min-width:0;height:8.6cqw;background:#ebe9e2}
.competitor+.competitor{border-left:1px solid #aeb9b5}
.identity{display:block;flex:none;width:1.25cqw;height:67%;margin:0 2.1cqw 0 1.4cqw;background:#365d67}
.jerseyColorB{background:#365d67}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#243941;font-size:3.6cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.hits-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;width:13%;height:77%;min-width:0;background:#365d67;color:#fff;border-radius:2px}
.cell-label{display:block;color:#fff;font-size:1.55cqw;font-weight:700;line-height:1;white-space:nowrap}
.hit-value{display:block;max-width:100%;overflow:hidden;color:#fff;font-size:4.7cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.score-track{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 22%;min-width:0;align-self:stretch;background:#ebe9e2;color:#243941}
.score-label{display:block;color:#243941;font-size:1.6cqw;font-weight:700;line-height:1;white-space:nowrap}
.score{display:block;max-width:100%;overflow:hidden;color:#243941;font-size:5.7cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.baseline{display:flex;align-items:center;min-width:0;height:3.8cqw;border-top:1px solid #aeb9b5;background:#ebe9e2}
.sport-tag{display:block;align-content:center;flex:1 1 auto;min-width:0;height:100%;padding:0 1.5cqw;color:#243941;font-size:1.8cqw;font-weight:800;line-height:1;white-space:nowrap}
.stats{display:flex;align-items:stretch;justify-content:flex-end;flex:none;min-width:0;height:100%}
.stat{display:flex;align-items:center;justify-content:center;gap:.7cqw;min-width:0;padding:0 1.6cqw;color:#243941;font-size:1.4cqw;font-weight:700;line-height:1;white-space:nowrap}
.stat:first-child{border-left:1px solid #aeb9b5}.stat+.stat{border-left:1px solid #aeb9b5}
.stat strong{color:#243941;font-size:1.75cqw;font-variant-numeric:tabular-nums}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%}.competitor{height:72px}.identity{width:3px;height:65%;margin:0 4px}.name{font-size:clamp(13px,3.5vw,20px)}.hits-cell{width:23%;height:78%}.cell-label{font-size:8px}.hit-value{font-size:clamp(18px,5.5vw,26px)}.score-track{flex-basis:27%}.score-label{font-size:8px}.score{font-size:clamp(19px,5.8vw,29px)}.baseline{height:46px;flex-direction:column;align-items:stretch;justify-content:center;gap:3px}.sport-tag{flex:none;height:auto;padding:0 6px;font-size:10px}.stats{height:auto;justify-content:space-between}.stat{font-size:9px;gap:2px;padding:0 4px}.stat strong{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Baseball scoreboard">
<div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="hits-cell columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="cell-label" data-osb-component="text">HITS</span><strong class="hit-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong></div><div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score-label" data-osb-component="text">RUNS</span><strong class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="hits-cell columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="cell-label" data-osb-component="text">HITS</span><strong class="hit-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong></div><div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score-label" data-osb-component="text">RUNS</span><strong class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
<div class="baseline rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">BASEBALL</span><div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static baseball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div></article></main></body></html>
