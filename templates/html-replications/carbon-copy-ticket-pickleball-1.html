<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Carbon Copy Ticket PICKLEBALL 1</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{color:#080807;font-family:"Courier New",monospace;font-weight:700}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}.ticket{width:min(80vw,1400px);position:relative;container-type:inline-size;background:#f1ede2;padding:1.25% 3.1%;display:flex;flex-direction:column;mask-image:radial-gradient(circle at 0 0,transparent 0 2.3%,#000 2.4%),radial-gradient(circle at 100% 0,transparent 0 2.3%,#000 2.4%),radial-gradient(circle at 0 100%,transparent 0 2.3%,#000 2.4%),radial-gradient(circle at 100% 100%,transparent 0 2.3%,#000 2.4%),radial-gradient(circle at 0 50%,transparent 0 2.7%,#000 2.8%),radial-gradient(circle at 100% 50%,transparent 0 2.7%,#000 2.8%);mask-composite:intersect}.frame{border:2px solid #080807;display:flex;flex:1;flex-direction:column;min-height:0;position:relative}.header{display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:4.8cqw;line-height:1;font-weight:900;letter-spacing:.03em;white-space:nowrap}.name-wrap{flex:1;min-width:0;display:flex;align-items:center;position:relative}.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.combinedAName:empty:before{content:"Player A"}.combinedBName:empty:before{content:"Player B"}.identity{width:0;height:0;flex:0 0 0}.serve{flex:0 0 2cqw;font-size:1.8cqw;width:2cqw;text-align:center}.score{font-family:Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;line-height:1;white-space:nowrap;overflow:hidden}.label{font-size:1.85cqw;line-height:1.1;white-space:nowrap;text-align:center}.point-slot{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:28cqw;height:1.6cqw;font-size:1.25cqw;line-height:1.3;text-align:center}.point-slot>div{position:absolute;inset:0}.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint{opacity:0!important}@media(max-width:600px){.ticket{width:94vw;padding:8px 12px}.frame{border-width:1px}.label{font-size:2.5cqw}.header{font-size:5cqw}.point-slot{font-size:1.9cqw;height:2.2cqw}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.ticket{aspect-ratio:3.16}.header{height:27%}.row{display:flex;flex:1;min-height:0;align-items:stretch;border-top:2px solid #080807}.row .name-wrap{padding:0 3.9cqw}.name{font-size:5.4cqw}.score-lane{display:flex;flex:0 0 31%;border-left:2px dashed #080807}.cell{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7cqw}.score{font-size:6.3cqw}.row .cell+.cell{}@media(max-width:600px){.row,.header{border-width:1px}.score-lane,.competitor+.competitor{border-left-width:1px}.row .cell+.cell,.cell+.cell{border-left-width:1px}.head-scores{border-left-width:1px}.head-scores .label+.label{border-left-width:1px}}
.header{font-size:6.9cqw}.name{font-size:6cqw}

/* Reserved conditional match states: all score and name tracks remain fixed. */
.osb-conditional-rail{--osb-rail-bg:#181818;--osb-rail-fg:#f9fbfa;box-sizing:border-box!important;position:relative!important;inset:auto!important;transform:none!important;grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:28px!important;height:28px!important;margin:0!important;padding:2px 7px!important;gap:5px!important;overflow:hidden!important;background:var(--osb-rail-bg)!important;color:var(--osb-rail-fg)!important;border:0!important;font:700 11px/1 Arial,Helvetica,sans-serif!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-condition-side{all:unset!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;flex:1 1 35%!important;width:35%!important;min-width:0!important;height:22px!important;gap:2px!important;position:relative!important;overflow:hidden!important}
.osb-conditional-rail .osb-condition-side-b{justify-content:flex-end!important}
.osb-conditional-rail .osb-condition-side-label{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 13px!important;width:13px!important;height:18px!important;color:var(--osb-rail-fg)!important;font:800 10px/1 Arial,Helvetica,sans-serif!important}
.osb-conditional-rail .osb-condition-slot{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 21px!important;width:21px!important;height:18px!important;position:relative!important}
.osb-conditional-rail .osb-condition-timeoutused{flex-basis:21px!important;width:21px!important}
.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:17px!important;width:17px!important}
.osb-conditional-rail .osb-condition-badge{box-sizing:border-box!important;align-items:center!important;justify-content:center!important;width:100%!important;height:18px!important;min-width:0!important;margin:0!important;padding:0 2px!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:2px!important;background:rgba(255,255,255,.12)!important;color:var(--osb-rail-fg)!important;font:800 9px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-timeout-icon{position:relative!important;display:flex;align-items:center!important;justify-content:center!important;padding:0!important;color:var(--osb-rail-fg)!important}
.osb-conditional-rail .osb-timeout-icon::before{content:""!important;display:block!important;width:11px!important;height:11px!important;border:1.5px solid currentColor!important;border-radius:50%!important;background:transparent!important}
.osb-conditional-rail .osb-timeout-icon::after{content:""!important;position:absolute!important;left:50%!important;top:3px!important;width:3px!important;height:6px!important;border-left:1.5px solid currentColor!important;border-bottom:1.5px solid currentColor!important;transform:translateX(-25%) rotate(-35deg)!important;transform-origin:bottom left!important}
.osb-conditional-rail .isATimeOutActive,.osb-conditional-rail .isBTimeOutActive{background:#f3d27a!important;color:#253641!important;border-color:#f3d27a!important}
.osb-conditional-rail .isATimeOutUsed,.osb-conditional-rail .isBTimeOutUsed{background:transparent!important;color:#b8c7ca!important;border-color:#b8c7ca!important}
.osb-conditional-rail .isAYellowCarded,.osb-conditional-rail .isBYellowCarded{background:#e5c94e!important;color:#253641!important;border-color:#e5c94e!important}
.osb-conditional-rail .isARedCarded,.osb-conditional-rail .isBRedCarded{background:#c94747!important;color:#fff!important;border-color:#c94747!important}
.osb-conditional-rail .point-slot.osb-shared-point{all:unset!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30%!important;width:30%!important;min-width:78px!important;max-width:130px!important;height:22px!important;min-height:22px!important;inset:auto!important;margin:0!important;padding:0!important;transform:none!important;overflow:hidden!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important}
.osb-conditional-rail .point-slot.osb-shared-point>.isGamePoint,.osb-conditional-rail .point-slot.osb-shared-point>.isMatchPoint{box-sizing:border-box!important;position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;transform:none!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:390px){.osb-conditional-rail{padding:2px 4px!important;gap:3px!important}.osb-conditional-rail .osb-condition-side{gap:1px!important}.osb-conditional-rail .osb-condition-slot{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-timeoutused{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:15px!important;width:15px!important}.osb-conditional-rail .point-slot.osb-shared-point{min-width:76px!important}}

</style></head>
<body><main class="stage"><article class="ticket columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="frame columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><header class="header">PICKLEBALL</header><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-wrap"><div class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></div><div class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></div><div class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true">●</div></div><div class="score-lane"><div class="cell"><div class="label">GAMES</div><div class="score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</div></div><div class="cell"><div class="label">POINTS</div><div class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</div></div></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-wrap"><div class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></div><div class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></div><div class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;">●</div></div><div class="score-lane"><div class="cell"><div class="label">GAMES</div><div class="score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</div></div><div class="cell"><div class="label">POINTS</div><div class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</div></div></div></div></div><div class="osb-conditional-rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Conditional match states"><div class="osb-condition-side osb-condition-side-a" data-osb-component="layout"><span class="osb-condition-side-label">A</span><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div><span class="point-slot osb-shared-point" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><div class="osb-condition-side osb-condition-side-b" data-osb-component="layout"><span class="osb-condition-side-label">B</span><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div></div></article></main></body>
</html>
