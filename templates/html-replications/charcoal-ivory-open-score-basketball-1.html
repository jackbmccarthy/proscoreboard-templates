<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Charcoal Ivory Open Score — Basketball 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.board{display:flex;flex-direction:column;max-width:100%;min-width:0;container-type:inline-size}
.surface{display:flex;flex-direction:column;overflow:hidden;min-width:0;background:#232c2b;border:1px solid #53615c;border-radius:3px}
.header{display:flex;align-items:center;min-width:0;background:#e9e6da;color:#232c2b;border-bottom:2px solid #718779}
.sport{font-weight:700;line-height:1;white-space:nowrap}
.heading{font-weight:700;line-height:1;white-space:nowrap}
.competitors{display:flex;min-width:0;background:#232c2b}
.competitor{display:flex;align-items:center;min-width:0}
.identity{display:block;flex:none;background:#718779}
.jerseyColorB{background:#ab9470}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f6f7f2;font-weight:700;line-height:1.08}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.score-track{display:flex;align-items:center;justify-content:center;flex:none;min-width:0}
.score{display:block;width:100%;color:#f6f7f2;text-align:center;white-space:nowrap;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:flex;align-items:stretch;min-width:0;background:#e9e6da;color:#232c2b}
.stat{display:flex;align-items:center;justify-content:center;flex:1 1 0;min-width:0;white-space:nowrap}
.stat+.stat{border-left:2px solid #718779}
.stat-label,.stat-value{font-weight:700;line-height:1}
.stat-value{font-variant-numeric:tabular-nums}
.retained,.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.board{width:min(55vw,1100px,calc((100vh - 24px)*2.2))}
.header{height:7.6cqw;min-height:34px;justify-content:space-between;padding:0 3cqw}
.sport{font-size:4.65cqw}
.heading{font-size:2.8cqw}
.competitors{flex-direction:column}
.competitor{height:14.4cqw;min-height:65px}
.competitor+.competitor{border-top:1px solid #718779}
.score-track{flex:0 0 17%;height:100%;padding:0 .5cqw}
.score{font-size:9.4cqw}
.identity{width:1.25cqw;height:9.5cqw;margin-right:5.2cqw}
.name{font-size:7.1cqw}
.stats{height:8.1cqw;min-height:40px}
.stat{gap:2.6cqw}
.stat-label{font-size:2.7cqw}
.stat-value{font-size:5cqw}
@media(max-width:600px){.board{width:100%}.header{height:39px;padding:0 13px}.sport{font-size:20px}.heading{font-size:11px}.competitor{height:76px}.score-track{flex-basis:82px;padding:0 2px}.score{font-size:39px}.identity{width:5px;height:46px;margin-right:12px}.name{font-size:24px}.stats{height:48px}.stat{gap:3px}.stat+.stat{border-left-width:1px}.stat-label{font-size:9px}.stat-value{font-size:19px}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Basketball scoreboard"><div class="surface columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><header class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport" data-osb-component="text">BASKETBALL</span><span class="heading" data-osb-component="text">POINTS</span></header>
<div class="competitors columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="score-track"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="score-track"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
</div>
<footer class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">CLOCK</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="game-clock">00:00</span></div><div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">PERIOD</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="period">0</span></div><div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">SHOT</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="shot-clock">00</span></div></footer>
</div><div class="point-slot" data-osb-component="layout"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body></html>
