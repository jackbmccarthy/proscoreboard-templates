<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleball — Indigo Open Data Lane Lower Third</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--surface:#1b2d3b;--ink:#f0f2ed;--muted:#92b3b1;--line:#89acad;position:relative;display:flex;flex-direction:column;width:min(86vw,1870px);height:min(8.5vw,185px);min-width:0;min-height:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);container-type:inline-size;overflow:visible}
.headline{display:flex;flex:0 0 29%;min-height:0;align-items:center;justify-content:space-between;padding:0 2.2cqw;border-bottom:1px solid var(--line)}
.sport-tag{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.8cqw;line-height:1;font-weight:700;letter-spacing:.015em}
.headline-data{display:flex;flex:0 0 auto;align-items:center;color:var(--muted);font-size:1.2cqw;font-weight:700;letter-spacing:.04em}
.competitors{display:flex;flex:1 1 auto;flex-direction:row;min-width:0;min-height:0}
.side{display:flex;flex:1 1 50%;align-items:stretch;min-width:0;min-height:0}
.side+.side{border-left:1px solid var(--line)}
.identity-name{display:flex;flex:1 1 auto;min-width:0;align-items:center}
.identity{display:block;flex:0 0 .48cqw;width:.48cqw;height:48%;margin-left:2.0cqw;background:#92b3b1}
.jerseyColorB{background:#92b3b1}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.55cqw;padding:0 1.2cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;font-size:2.25cqw;line-height:1;font-weight:600;letter-spacing:.01em}
.combinedAName:empty::before{content:'Player A'}.combinedBName:empty::before{content:'Player B'}
.serve{display:block;flex:0 0 .6cqw;width:.6cqw;height:.6cqw;min-width:5px;min-height:5px;border-radius:50%;background:var(--muted)}
.game-track{display:flex;flex:0 0 15%;min-width:0;align-items:center;justify-content:center;gap:.7cqw;color:var(--muted);}
.game-label,.point-label{display:block;flex:0 0 auto;font-size:1.32cqw;line-height:1;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.match-score{display:block;min-width:1.8ch;text-align:center;font-size:2.3cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.score-track{display:flex;flex:0 0 19%;min-width:0;align-items:center;justify-content:center;gap:.25cqw;border-left:2px solid var(--line);flex-direction:column;gap:0;}
.point-label{color:var(--muted);font-size:1.3cqw;}
.primary-score{display:block;flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;white-space:nowrap;color:#fff;text-align:center;font-size:4.8cqw;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.point-slot{position:absolute;left:0;bottom:100%;width:150px;height:18px;color:#fff;text-align:center;font-size:10px;font-weight:700}
.point-state{position:absolute;inset:0;display:block;padding:3px 4px;background:var(--surface);border:1px solid var(--line)}
.point-slot:has(>.isMatchPoint[style*='opacity: 1'])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*='opacity:1'])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:96vw;height:94px;max-height:none}.headline{flex-basis:28px;padding:0 7px}.sport-tag{font-size:10px}.headline-data{font-size:9px}.identity{flex-basis:4px;width:4px;height:55%;margin-left:5px}.name-lane{gap:2px;padding:0 4px}.name{font-size:13px;letter-spacing:-.03em}.serve{flex-basis:5px;width:5px;height:5px}.game-track{flex-basis:37px;gap:2px;flex-direction:column}.game-label,.point-label{font-size:7px}.match-score{font-size:13px}.score-track{flex-basis:46px;gap:0;flex-direction:column}.primary-score{font-size:25px}.point-slot{height:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><header class="headline rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag">PICKLEBALL</span><span class="headline-data">GAMES</span></header><div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><section class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity-name"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div></div><div class="game-track"><span class="game-label">GAMES</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="score-track"><span class="point-label">POINTS</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></section><section class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity-name"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div></div><div class="game-track"><span class="game-label">GAMES</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="score-track"><span class="point-label">POINTS</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></section></div><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body></html>
