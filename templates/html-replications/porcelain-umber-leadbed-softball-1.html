<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOFTBALL · Porcelain Umber Leadbed</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#403938}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px;background:transparent}
.board{width:min(66vw,1300px);min-width:0;overflow:hidden;border:1px solid #aeb9b3;border-radius:5px;background:#e7e9e5;container-type:inline-size;font-variant-numeric:tabular-nums}
.board.horizontal{width:min(84vw,1700px)}
.utility{display:flex;align-items:center;min-width:0;height:6.4cqw;padding:0 2.4cqw;border-bottom:1px solid #aeb9b3;background:#e7e9e5}
.sport-tab{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:3.2cqw;font-weight:700;line-height:1;color:#403938}
.status{display:flex;align-items:center;justify-content:flex-end;flex:0 0 auto;min-width:0}
.status-item{display:flex;align-items:baseline;justify-content:center;gap:.7cqw;min-width:0;padding:0 1.4cqw;border-left:1px solid #aeb9b3;font-size:1.7cqw;font-weight:700;line-height:1;white-space:nowrap}
.status-value{font-size:1.15em;font-weight:700;font-variant-numeric:tabular-nums}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{display:flex;align-items:stretch;min-width:0;height:11.4cqw;background:#e7e9e5}
.lane+.lane{border-top:1px solid #aeb9b3}
.identity{display:block;flex:0 0 2.2cqw;min-width:6px;background:#3186a8}
.jerseyColorB{background:#c96b71}
.primary-track{display:flex;flex:0 0 18%;width:18%;min-width:0;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#403938;color:#f8f6f2;text-align:center}
.primary-number{display:block;max-width:100%;font-size:6.3cqw;font-weight:700;line-height:.95;white-space:nowrap;font-variant-numeric:tabular-nums}
.primary-caption{display:block;margin-top:.5cqw;font-size:2.2cqw;font-weight:700;line-height:1;white-space:nowrap}
.namebed{display:flex;flex:1 1 0;min-width:0;flex-direction:column;align-items:flex-start;justify-content:center;overflow:hidden;padding:0 2.7cqw}
.name{display:block;width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:4.8cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support-line{display:flex;align-items:baseline;gap:.7cqw;width:100%;min-width:0;margin-top:.5cqw;color:#403938;white-space:nowrap}
.support-caption{font-size:2.2cqw;font-weight:700;line-height:1}
.support-number{font-size:2.7cqw;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.horizontal .utility{height:4.4cqw;padding:0 1.9cqw}
.horizontal .sport-tab{font-size:2.4cqw}
.horizontal .status-item{font-size:1.3cqw;gap:.4cqw;padding:0 1.2cqw}
.horizontal .lanes{flex-direction:row}
.horizontal .lane{flex:1 1 50%;height:9.4cqw}
.horizontal .lane+.lane{border-top:0;border-left:1px solid #aeb9b3}
.horizontal .identity{flex-basis:1.8cqw}
.horizontal .primary-track{flex-basis:22%;width:22%}
.horizontal .primary-number{font-size:5.3cqw}
.horizontal .primary-caption{font-size:1.8cqw;margin-top:.3cqw}
.horizontal .namebed{padding:0 1.7cqw}
.horizontal .name{font-size:3.8cqw}
.horizontal .support-line{gap:.5cqw;margin-top:.3cqw}
.horizontal .support-caption{font-size:1.6cqw}
.horizontal .support-number{font-size:1.9cqw}
@media(max-width:650px){
 .board,.board.horizontal{width:94vw;container-type:normal}
 .utility,.horizontal .utility{height:66px;flex-direction:column;align-items:stretch;justify-content:center;gap:8px;padding:6px 9px}
 .sport-tab,.horizontal .sport-tab{flex:none;font-size:16px;line-height:1}
 .status{flex:none;justify-content:space-between}
 .status-item,.horizontal .status-item{flex:1 1 auto;gap:3px;padding:0 4px;font-size:11px}
 .status-item:first-child{border-left:0;padding-left:0}
 .status-item:last-child{padding-right:0}
 .status-value{font-size:12px}
 .lanes,.horizontal .lanes{flex-direction:column}
 .lane,.horizontal .lane{flex:0 0 auto;height:94px}
 .lane+.lane,.horizontal .lane+.lane{border-left:0;border-top:1px solid #aeb9b3}
 .identity,.horizontal .identity{flex-basis:7px}
 .primary-track,.horizontal .primary-track{flex-basis:25%;width:25%}
 .primary-number,.horizontal .primary-number{font-size:40px}
 .primary-caption,.horizontal .primary-caption{font-size:12px;margin-top:3px}
 .namebed,.horizontal .namebed{padding:0 11px}
 .name,.horizontal .name{font-size:clamp(21px,6.6vw,27px)}
 .support-line,.horizontal .support-line{gap:5px;margin-top:5px}
 .support-caption,.horizontal .support-caption{font-size:13px}
 .support-number,.horizontal .support-number{font-size:16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="softball scoreboard">
 <header class="utility" data-osb-component="layout"><span class="sport-tab" data-osb-component="text">SOFTBALL</span><div class="status" data-osb-component="layout"><span class="status-item" data-osb-component="layout"><span data-osb-component="text">INNING</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="status-item" data-osb-component="layout"><span data-osb-component="text">BALLS</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span></span><span class="status-item" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span><span class="status-item" data-osb-component="layout"><span data-osb-component="text">OUTS</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span></span></div></header>
 <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <div class="lane rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA" aria-hidden="true"></span>
   <div class="primary-track" data-osb-component="layout"><span class="primary-number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption" data-osb-component="text">RUNS</span></div>
   <div class="namebed" data-osb-component="layout"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="support-line" data-osb-component="layout"><span class="support-caption" data-osb-component="text">HITS</span><span class="support-number" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span></div></div>
   <span class="hidden-match currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore" hidden>0</span>
  </div>
  <div class="lane rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB" aria-hidden="true"></span>
   <div class="primary-track" data-osb-component="layout"><span class="primary-number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption" data-osb-component="text">RUNS</span></div>
   <div class="namebed" data-osb-component="layout"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="support-line" data-osb-component="layout"><span class="support-caption" data-osb-component="text">HITS</span><span class="support-number" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span></div></div>
   <span class="hidden-match currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore" hidden>0</span>
  </div>
 </div>
 <div class="point-slot" data-osb-component="layout" hidden><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
</article></main></body></html>
