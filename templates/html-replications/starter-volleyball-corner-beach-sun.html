omponent="field" data-osb-field="isGamePoint" style="opacity:0">SET POINT</span><span class="st pt mp isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span></span></div><div class="r rA" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip chipA jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="who"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="sub"><span class="pips"><i class="pip"><b class="lit isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity:0"></b></i></span><span class="tob tobA isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="num tclock timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</b></span></span></span><span class="slot sv"><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="vball"></i></span><span class="win winA isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity:0"><b>&#10003;</b></span></span><span class="setc"><i class="ml">SETS</i><span class="sets num setsA setsWonA currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span><span class="pts ptsA"><span class="num pv currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span></div><div class="r rB" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip chipB jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="who"><span class="nm combinedBName" data-osb-component="field" data-osb-f
