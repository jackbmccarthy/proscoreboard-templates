<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volleyball Beach Sun</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing{animation:none!important;transition:none!important}}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.02}
.vball{display:block;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 14%,transparent 34%),conic-gradient(from 30deg,#ffd23f 0 120deg,#2a5bd7 0 240deg,#f6f7fb 0);box-shadow:inset 0 0 0 .12rem #0006,0 0 .4rem #0006}
.sslot{align-items:center}.sslot>.st{display:flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap;height:100%}
.pslot>.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hist:not(:has(>[style*="opacity: 1"])){display:none}
.board:has(.isComplete[style*="opacity: 1"]) .srv[style*="opacity: 1"]{opacity:.3!important;filter:grayscale(1)}
.pip{position:relative;display:block}.pip>.lit{position:absolute;inset:0;border-radius:inherit}

.stage{position:fixed;left:3.2rem;top:3.2rem}
.board{position:relative;width:43rem;font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;color:#fff}
.top{display:flex;align-items:stretch;gap:.5rem;height:3rem;margin-bottom:.5rem;font-size:1.45rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sslot{min-width:12rem}.sslot>.st{border-radius:1.5rem;padding:0 1.1rem;background:linear-gradient(90deg,#ff8a3d,#ffb347);color:#3a1a00}.sslot>.sdec{background:#ff4f6d;color:#fff}.sslot>.sbrk{background:#0b4f5c;color:#fff}.sslot>.sfin{background:#fff;color:#0b4f5c}
.ctx{flex:1;min-width:0;display:flex;align-items:center;gap:.5rem;padding:0 1.1rem;border-radius:1.5rem;background:#0b3d47d9;color:#bfeff2;white-space:nowrap;overflow:hidden}.ctx .sep{font-style:normal;color:#ffb347}
.rows{border-radius:1.1rem;overflow:hidden;box-shadow:0 .5rem 1.2rem #0007}
.row{position:relative;display:flex;align-items:stretch;height:5.4rem;background:linear-gradient(90deg,#0c6f7c,#0a5865)}
.rB{border-top:.15rem solid #ffffff2a}
.chip{width:.8rem;flex:none}
.nm{flex:1;min-width:0;align-self:center;padding:0 .4rem 0 1.1rem;font-size:2.15rem;font-weight:700;letter-spacing:-.005em}
.srv{width:3rem;flex:none;display:flex;align-items:center;justify-content:center}.vball{width:2.1rem;height:2.1rem}
.pips{display:flex;flex-direction:column;gap:.4rem;justify-content:center;width:2rem;flex:none;align-items:center}.pip{width:.8rem;height:.8rem;border-radius:50%;background:#ffffff33}.pip>.lit{background:#ffd27a}
.sets{width:4rem;flex:none;display:flex;align-items:center;justify-content:center;color:#ffd27a;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.7rem;font-weight:700;background:#07444e}
.pts{width:6.2rem;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#ff9a4a,#ff6a3d);color:#fff;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:3.7rem;font-weight:700;text-shadow:0 .1rem .2rem #0004}
.tob{position:absolute;left:100%;top:.6rem;bottom:.6rem;margin-left:.6rem;display:flex;align-items:center;gap:.6rem;padding:0 1.1rem;border-radius:2rem;background:#ffb347;color:#3a1a00;font-size:1.55rem;font-weight:700;letter-spacing:.06em;white-space:nowrap}.tob em{font-style:normal}.tob b{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2rem}
.hist{display:flex;align-items:center;gap:.4rem;margin-top:.5rem;font-size:1.5rem}
.hc{display:flex;align-items:center;gap:.3rem;padding:.35rem .9rem;border-radius:1.4rem;background:#0b3d47e6;color:#bfeff2}.hc .hl{font-weight:600;color:#7fc7cf;margin-right:.3rem;font-size:1.3rem}.hc .num{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:1.8rem;color:#fff}.hc .hd{font-style:normal;color:#7fc7cf}
.hist>.hc[style*="opacity: 1"]:not(:has(~.hc[style*="opacity: 1"])){background:#ff8a3d}.hist>.hc[style*="opacity: 1"]:not(:has(~.hc[style*="opacity: 1"])) .hl,.hist>.hc[style*="opacity: 1"]:not(:has(~.hc[style*="opacity: 1"])) .hd{color:#ffe2c4}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .hist>.hc,.board:has(.isComplete[style*="opacity: 1"]) .hist>.hc{background:#0b3d47e6!important}
.pslot{position:absolute;left:100%;top:3.5rem;margin-left:.6rem}.pt{height:3rem;padding:0 1.2rem;border-radius:1.5rem;font-size:1.5rem;font-weight:800;letter-spacing:.08em;background:#fff;color:#0b4f5c}.pt.mp{background:#ff4f6d;color:#fff}
.board:has(.isATimeOutActive[style*="opacity: 1"]) .pslot,.board:has(.isBTimeOutActive[style*="opacity: 1"]) .pslot{top:auto;bottom:100%;margin-bottom:-2.6rem}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.st.sset,.num.currentGame,.st.sdec.isDecidingSet,.st.sbrk.isInBetweenGames,.st.sfin.isComplete,.eventName,.sep,.matchRound,.tob.isATimeOutActive>em,.tob.isBTimeOutActive>em,.hl,.hd,.pt.mp.isMatchPoint,.pt.gp.isGamePoint{font-size:1.25vw!important}
.pip,.lit.isATimeoutLeft1,.lit.isATimeoutLeft2,.lit.isBTimeoutLeft1,.lit.isBTimeoutLeft2{width:0.938vw!important;height:0.938vw!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

</style>
</head>
<body>
<main class="stage"><section class="board" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="top" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="slot sslot"><span class="st sset">SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sdec isDecidingSet" data-osb-component="field" data-osb-field="isDecidingSet" style="opacity:0">DECIDING SET</span><span class="st sbrk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">END OF SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sfin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">FINAL</span></span><span class="ctx"><span class="eventName" data-osb-component="field" data-osb-field="eventName"></span><i class="sep">&middot;</i><span class="matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span></div>
<div class="rows" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="row rA" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="nm clamp2 combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="vball"></i></span><span class="pips"><i class="pip"><b class="lit isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity:0"></b></i></span><span class="sets num setsWonA currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="pts num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="tob isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="tclock num timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</b></span></div><div class="row rB" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="nm clamp2 combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="srv isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"><i class="vball"></i></span><span class="pips"><i class="pip"><b class="lit isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity:0"></b></i></span><span class="sets num setsWonB currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="pts num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="tob isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="tclock num timeOutTimerB" data-osb-component="field" data-osb-field="timeOutTimerB">0</b></span></div></div>
<div class="hist" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="hc  isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><b class="hl">S1</b><span class="ha num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span><i class="hd">-</i><span class="hb num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="hc  isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><b class="hl">S2</b><span class="ha num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span><i class="hd">-</i><span class="hb num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="hc  isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><b class="hl">S3</b><span class="ha num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span><i class="hd">-</i><span class="hb num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="hc  isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><b class="hl">S4</b><span class="ha num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span><i class="hd">-</i><span class="hb num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="hc  isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><b class="hl">S5</b><span class="ha num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span><i class="hd">-</i><span class="hb num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></div>
<span class="slot pslot"><span class="pt gp isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">SET POINT</span><span class="pt mp isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><span class="osb-core-fields"><span class="num timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA">0</span><span class="num timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB">0</span></span></section></main>
</body>
</html>
