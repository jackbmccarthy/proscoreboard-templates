<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volleyball Beach Sun</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1;position:relative}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.18)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing,.ldot{animation:none!important;transition:none!important}}
.nm{display:block;min-width:0;overflow-wrap:normal;word-break:normal;hyphens:none;line-height:1.02}
.bal{text-wrap:balance}
.st,.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hv{position:relative;display:inline-grid;place-items:center}.hv>*{grid-area:1/1}.hv>.w{display:block;align-self:stretch;justify-self:stretch}.hv>.num{position:relative}
.ev,.rd{white-space:nowrap}
.hc:not([style*="opacity: 1"]),.cell:not([style*="opacity: 1"]){display:none}
.vball{display:block;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 14%,transparent 34%),conic-gradient(from 30deg,#ffd23f 0 120deg,#2a5bd7 0 240deg,#f6f7fb 0);box-shadow:inset 0 0 0 .12rem #0006,0 0 .4rem #0006}
.pball{display:block;border-radius:50%;background:radial-gradient(circle at 30% 34%,#0005 0 8%,transparent 9%),radial-gradient(circle at 64% 30%,#0005 0 8%,transparent 9%),radial-gradient(circle at 52% 64%,#0005 0 8%,transparent 9%),radial-gradient(circle at 24% 72%,#0004 0 6%,transparent 7%),radial-gradient(circle at 78% 70%,#0004 0 6%,transparent 7%),radial-gradient(circle at 36% 30%,#fbffb4,#d8f22c 60%,#a6c214);box-shadow:0 0 0 .15rem #0b1a12,0 0 .4rem #0007}

.stage{position:fixed;left:3.2rem;top:3.2rem}
.board{position:relative;width:46rem;font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",sans-serif;color:#0f3b45;filter:drop-shadow(0 .5rem 1.1rem #0008)}
.top{display:flex;align-items:stretch;height:3.6rem;border-radius:1.2rem 1.2rem 0 0;overflow:hidden;background:#0f5e6b}
.sslot{width:15rem;flex:none}.sslot>.st{padding:0 1rem;font-size:1.8rem;font-weight:700;letter-spacing:.06em;background:#ff8a3d;color:#fff;text-transform:uppercase}
.sslot .num{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;margin-left:.4rem}
.sslot>.sdec{background:#ff4f6d}.sslot>.sbrk{background:#0b4650}.sslot>.sfin{background:#fff;color:#0f3b45}
.sslot>.gp{background:#ffd65a;color:#0f3b45}.sslot>.mp{background:#ff4f6d;color:#fff}
.ctx{flex:1;min-width:0;display:block;padding:.95rem 1rem 0;font-size:1.6rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#d4f1f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}.ctx .sep{font-style:normal;color:#ffd65a;margin:0 .5rem}
.teams{display:flex;background:#fdf3df}
.t{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
.tB{border-left:.2rem solid #f0dcb6}
.chip{display:block;height:.7rem}.chipA{background:#1b7ad6}.chipB{background:#e34b3a}
.nm{display:flex;align-items:center;min-height:5.4rem;padding:.6rem 1.2rem .2rem;font-size:2.3rem;font-weight:700;text-transform:uppercase;line-height:1.05}
.tB .nm{justify-content:flex-end;text-align:right}
.sc{display:flex;align-items:center;gap:.6rem;padding:0 1.2rem .9rem}.tB .sc{flex-direction:row-reverse}
.pts{min-width:6.8rem;height:5.8rem;display:flex;align-items:center;justify-content:center;padding:.3rem .6rem 0;border-radius:.9rem;background:#ff8a3d;color:#fff;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4.4rem;font-weight:700}
.setpill{display:flex;flex-direction:column;align-items:center;justify-content:center;width:5rem;height:5.8rem;border-radius:.9rem;background:#0f5e6b;color:#fff}
.setpill>i{font-style:normal;font-size:1.6rem;font-weight:700;letter-spacing:.06em;color:#9fd8dc}
.sets{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.8rem;font-weight:700;line-height:1}
.sv{width:3rem;place-items:center;margin:0 auto 0 .2rem}.tB .sv{margin:0 .2rem 0 auto}.vball{width:2.6rem;height:2.6rem}
.win{display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:50%;background:#0f5e6b;color:#fff;font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:1.8rem;font-weight:900}
.pips{display:flex;gap:.4rem}.pip{position:relative;display:block;width:1.4rem;height:1.4rem;border-radius:50%;box-shadow:inset 0 0 0 .2rem #0f5e6b}.pip>.lit{position:absolute;inset:0;border-radius:inherit;background:#0f5e6b}
.tob{position:absolute;left:0;right:0;top:0;height:5.4rem;display:flex;align-items:center;justify-content:center;gap:.8rem;padding-top:.2rem;background:#ffd65a;color:#0f3b45;font-size:2.1rem;font-weight:700;letter-spacing:.06em;white-space:nowrap}.tob em{font-style:normal}.tob b{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.6rem}
.foot{display:flex;justify-content:center;min-height:3.4rem;padding:0 .8rem;border-radius:0 0 1.2rem 1.2rem;background:#0f5e6b}
.hist{display:flex;align-items:stretch}
.hc{display:flex;align-items:center;gap:.25rem;padding:.1rem .9rem 0;font-size:1.6rem;font-weight:700;color:#fff}
.hc+.hc{border-left:.1rem solid #ffffff2a}
.hc .hl{color:#9fd8dc;margin-right:.35rem}.hc .num{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:1.9rem}.hc .hd{font-style:normal;color:#9fd8dc}
.board:not(:has(.isGame2Started[style*="opacity: 1"])) .foot .hist,.board:not(:has(.isGame2Started[style*="opacity: 1"])) .foot .hist .hist{height:0!important;min-height:0!important;padding-top:0!important;padding-bottom:0!important;margin-top:0!important;margin-bottom:0!important;border-width:0!important;overflow:hidden!important;align-items:flex-start!important;box-shadow:none!important;background:none!important}
.board:not(:has(.isGame2Started[style*="opacity: 1"])) .foot{min-height:1.2rem}

.hist>.hc[style*="opacity: 1"]:not(:has(~.hc[style*="opacity: 1"])){max-width:1px!important;min-width:0!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden;color:transparent!important;background:none!important;box-shadow:none!important}.hist>.hc[style*="opacity: 1"]:not(:has(~.hc[style*="opacity: 1"])) *{color:transparent!important;background:none!important;box-shadow:none!important;border-color:transparent!important}
.board:not(:has(.isGame2Started[style*="opacity: 1"])) .hist,.board:not(:has(.isGame2Started[style*="opacity: 1"])) .hist .hist{height:0!important;min-height:0!important;padding-top:0!important;padding-bottom:0!important;margin-top:0!important;margin-bottom:0!important;border-width:0!important;overflow:hidden!important;align-items:flex-start!important;box-shadow:none!important;background:none!important}
.hc .hv{padding:.15rem .45rem 0;border-radius:.2rem}
.hc .hv>.w{border-radius:.2rem;background:#ffd65a;margin:-.15rem -.45rem 0}
.hc .hv:has(>.w[style*="opacity: 1"])>.num{color:#0f3b45}
.hc:has(.w[style*="opacity: 1"]) .hv:not(:has(>.w[style*="opacity: 1"]))>.num{color:#9fd8dc}
.board:has(.isGame1AWon[style*="opacity: 1"]):not(:has(.isGame2Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame2AWon[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame3AWon[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame4AWon[style*="opacity: 1"]):not(:has(.isGame5Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame5AWon[style*="opacity: 1"]) .ptsA,.board:has(.isGame1BWon[style*="opacity: 1"]):not(:has(.isGame2Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame2BWon[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame3BWon[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame4BWon[style*="opacity: 1"]):not(:has(.isGame5Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame5BWon[style*="opacity: 1"]) .ptsB{color:#ffd65a}
.board:has(.isGame1AWon[style*="opacity: 1"]):not(:has(.isGame2Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame2AWon[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame3AWon[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame4AWon[style*="opacity: 1"]):not(:has(.isGame5Started[style*="opacity: 1"])) .ptsA,.board:has(.isGame5AWon[style*="opacity: 1"]) .ptsA,.board:has(.isGame1BWon[style*="opacity: 1"]):not(:has(.isGame2Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame2BWon[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame3BWon[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame4BWon[style*="opacity: 1"]):not(:has(.isGame5Started[style*="opacity: 1"])) .ptsB,.board:has(.isGame5BWon[style*="opacity: 1"]) .ptsB{color:#0f3b45;background:#ffd65a}
.board:has(.isAWinner[style*="opacity: 1"]) .tA .setpill,.board:has(.isBWinner[style*="opacity: 1"]) .tB .setpill{background:#ffd65a;color:#0f3b45}
.board:has(.isAWinner[style*="opacity: 1"]) .tA .setpill>i,.board:has(.isBWinner[style*="opacity: 1"]) .tB .setpill>i{color:#0f3b45}
.board:has(.isAWinner[style*="opacity: 1"]) :is(.tB .nm,.tB .sc),.board:has(.isBWinner[style*="opacity: 1"]) :is(.tA .nm,.tA .sc){opacity:0.45}
</style>
</head>
<body>
<main class="stage"><section class="board" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="top" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="slot sslot pslot"><span class="st sset">SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sdec isDecidingSet" data-osb-component="field" data-osb-field="isDecidingSet" style="opacity:0">DECIDING SET</span><span class="st sbrk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">END OF SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sfin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">FINAL</span><span class="st pt gp isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">SET POINT</span><span class="st pt mp isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><span class="ctx"><span class="ev eventName" data-osb-component="field" data-osb-field="eventName"></span><i class="sep">&middot;</i><span class="rd matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span></div>
<div class="teams" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="t tA" data-osb-component="layout" data-osb-component-type="osb-column-container"><i class="chip chipA jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="nm bal combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="sc"><span class="pts num ptsA currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="setpill"><i>SETS</i><span class="sets num setsA setsWonA currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span><span class="slot sv"><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="vball"></i></span><span class="win winA isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity:0"><b>&#10003;</b></span></span><span class="pips"><i class="pip"><b class="lit isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity:0"></b></i></span></span><span class="tob tobA isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="num tclock timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</b></span></div><div class="t tB" data-osb-component="layout" data-osb-component-type="osb-column-container"><i class="chip chipB jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="nm bal combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="sc"><span class="pts num ptsB currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="setpill"><i>SETS</i><span class="sets num setsB setsWonB currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span><span class="slot sv"><span class="srv isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"><i class="vball"></i></span><span class="win winB isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity:0"><b>&#10003;</b></span></span><span class="pips"><i class="pip"><b class="lit isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity:0"></b></i></span></span><span class="tob tobB isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="num tclock timeOutTimerB" data-osb-component="field" data-osb-field="timeOutTimerB">0</b></span></div></div>
<div class="foot" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="hist"><span class="hc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><b class="hl">S1</b><span class="hv a"><i class="w isGame1AWon" data-osb-component="field" data-osb-field="isGame1AWon" style="opacity:0"></i><span class="num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span><i class="hd">-</i><span class="hv b"><i class="w isGame1BWon" data-osb-component="field" data-osb-field="isGame1BWon" style="opacity:0"></i><span class="num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></span><span class="hc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><b class="hl">S2</b><span class="hv a"><i class="w isGame2AWon" data-osb-component="field" data-osb-field="isGame2AWon" style="opacity:0"></i><span class="num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span><i class="hd">-</i><span class="hv b"><i class="w isGame2BWon" data-osb-component="field" data-osb-field="isGame2BWon" style="opacity:0"></i><span class="num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></span><span class="hc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><b class="hl">S3</b><span class="hv a"><i class="w isGame3AWon" data-osb-component="field" data-osb-field="isGame3AWon" style="opacity:0"></i><span class="num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span><i class="hd">-</i><span class="hv b"><i class="w isGame3BWon" data-osb-component="field" data-osb-field="isGame3BWon" style="opacity:0"></i><span class="num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></span><span class="hc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><b class="hl">S4</b><span class="hv a"><i class="w isGame4AWon" data-osb-component="field" data-osb-field="isGame4AWon" style="opacity:0"></i><span class="num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span><i class="hd">-</i><span class="hv b"><i class="w isGame4BWon" data-osb-component="field" data-osb-field="isGame4BWon" style="opacity:0"></i><span class="num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></span><span class="hc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><b class="hl">S5</b><span class="hv a"><i class="w isGame5AWon" data-osb-component="field" data-osb-field="isGame5AWon" style="opacity:0"></i><span class="num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span><i class="hd">-</i><span class="hv b"><i class="w isGame5BWon" data-osb-component="field" data-osb-field="isGame5BWon" style="opacity:0"></i><span class="num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></span></span></div>
<span class="osb-core-fields"><span class="num timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA">0</span><span class="num timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB">0</span></span></section></main>
</body>
</html>
