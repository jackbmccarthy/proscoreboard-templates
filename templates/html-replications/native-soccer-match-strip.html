<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Strip</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 50px 28px; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    .osb { position: relative; display: grid; grid-template-columns: 170px 1fr 1fr 300px; width: 1180px; height: 64px; color: #fff; background: #0e1116; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 20px #000a; }
    .clk { display: grid; background: #ff5a1f; color: #0e1116; }
    .clk > * { grid-area: 1 / 1; }
    .live { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .lc { display: flex; flex-direction: column; align-items: center; line-height: 1; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .per { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; margin-top: 2px; }
    .add { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 18px; font-weight: 700; color: #fff; background: #0e1116; padding: 2px 5px 1px; border-radius: 3px; }
    .dot { position: absolute; left: 9px; top: 9px; width: 12px; height: 12px; color: #0e1116; }
    .runbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #0e1116; }
    .mp { position: absolute; right: 8px; top: 8px; display: flex; gap: 2px; }
    .h { position: relative; width: 8px; height: 3px; background: #ffb08f; }
    .h > span { position: absolute; inset: 0; background: #0e1116; }
    .et { width: 4px; height: 3px; background: #fff; }
    .state { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; background: #fff; color: #0e1116; }
    .st-b { font-size: 26px; font-weight: 800; letter-spacing: 2px; }
    .pens { z-index: 2; background: #0e1116; color: #fff; box-shadow: inset 0 0 0 3px #ff5a1f; }
    .st-s { font-size: 12px; font-weight: 800; letter-spacing: 3px; color: #ff5a1f; }
    .st-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 28px; font-weight: 700; margin-top: 2px; }
    .st-v b { padding: 0 3px; }
    .fin { z-index: 3; background: #0e1116; color: #ff5a1f; }
    .tm { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto 76px; align-items: center; min-width: 0; }
    .tm.A .nm { text-align: right; }
    .tm.B { grid-template-columns: 76px auto minmax(0, 1fr) 8px; }
    .tm.B > .pts { order: 1; border-left: 2px solid #0e1116; } .tm.B > .cards { order: 2; padding: 0 0 0 12px; } .tm.B > .nm { order: 3; padding: 0 16px 0 12px; } .tm.B > .kit { order: 4; }
    .tm.A > .pts { background: #1a1f28; }
    .kit { align-self: stretch; background-color: #59616e; }
    .nm { padding: 0 12px 0 16px; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 26px; font-weight: 700; line-height: 1.02; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
    .cards { padding-right: 12px; }
    .pts { align-self: stretch; display: flex; align-items: center; justify-content: center; background: #1a1f28; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ev { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 18px; background: #161a21; border-left: 3px solid #ff5a1f; text-transform: uppercase; min-width: 0; }
    .ev .eventName { font-size: 18px; font-weight: 800; letter-spacing: 1.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ev .matchRound { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #ff5a1f; }
    .osb:not(:has(.ev .eventName:not(:empty))):not(:has(.ev .matchRound:not(:empty))) { grid-template-columns: 170px 1fr 1fr; width: 880px; }
    .cards { display: flex; gap: 4px; flex: 0 0 auto; }
    .yc, .rc { display: flex; align-items: center; justify-content: center; width: 18px; height: 24px; border-radius: 2px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 12px; font-weight: 700; line-height: 1; box-shadow: 0 1px 2px #0006; }
    .yc { background: #ffd21f; color: #2a2300; }
    .rc { background: #e3262e; color: #fff; }
    .yc[style*="opacity: 0"], .rc[style*="opacity: 0"] { width: 0; margin-left: -4px; }
    .brk .b-ft, .brk .b-eh, .brk .b-aet { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]) .brk .b-ht { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .b-ft { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .brk .b-eh { display: inline; }
    .osb:has(.isGame4Started[style*="opacity: 1"]) .brk .b-aet { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]) .brk .b-ft { display: none; }
    .add-v:empty::before { content: "+0"; }
    .dot i { display: block; width: 100%; height: 100%; border-radius: 50%; background: currentColor; animation: osb-pulse 1.6s ease-in-out infinite; }
    @keyframes osb-pulse { 50% { opacity: .35; } }
    .osb:has(.isComplete[style*="opacity: 1"]) .dot i { animation: none; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.fpens{white-space:nowrap}
.fpens:not([style*="opacity: 1"]){display:none}
.fin:has(.isDecidedOnPenalties[style*="opacity: 1"]) .st-b::after{content:none}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.per.periodLabel,.st-s,.ev-r.matchRound,.cn.yellowCardsA,.cn.redCardsA,.cn.yellowCardsB,.cn.redCardsB{font-size:16px!important}
.dot.isMatchStarted>i,.et.isGame3Started,.et.isGame4Started{width:12px!important;height:12px!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

  </style>
</head>
<body>
<article class="osb" aria-label="Soccer lower third">
  <div class="clk">
    <div class="live"><span class="dot isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"><i></i></span><span class="lc"><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span></span><span class="add addedTimeVisible" data-osb-component="field" data-osb-field="addedTimeVisible" style="opacity: 0;"><span class="add-v addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="mp"><span class="h"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="h"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="et isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span><span class="et isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="st-b b-ht">HT</span><span class="st-b b-ft">FT</span><span class="st-b b-eh">ET HT</span><span class="st-b b-aet">AET</span></div>
    <div class="state pens isShootoutActive" data-osb-component="field" data-osb-field="isShootoutActive" style="opacity: 0;"><span class="st-s">PENS</span><span class="st-v"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span><b>-</b><span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span></span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FT<span class="isDecidedOnPenalties fpens" data-osb-component="field" data-osb-field="isDecidedOnPenalties" style="opacity:0"> (<span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span>-<span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span> PENS)</span></span></div>
  </div>
  <div class="tm A"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="cards"><span class="yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
  <div class="tm B"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="cards"><span class="yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="homeSide" data-osb-component="field" data-osb-field="homeSide"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
