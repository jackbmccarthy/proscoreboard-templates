<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Strip</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 30px 24px 24px; font-family: "Helvetica Neue", Arial, sans-serif; }
    .wrap { position: relative; display: inline-flex; flex-direction: column; align-items: center; filter: drop-shadow(0 8px 18px #0008); }
    .ev { display: flex; gap: 12px; margin-bottom: 0; padding: 4px 16px; background: #111; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border-radius: 4px 4px 0 0; }
    .ev-round { color: #3ee09c; }
    .ev:has(.eventName:empty):has(.matchRound:empty) { display: none; }
    .strip { display: flex; align-items: stretch; height: 62px; background: #fff; border-radius: 4px; overflow: hidden; }
    .team { display: flex; align-items: center; gap: 14px; width: 360px; padding: 0 20px; color: #111; }
    .team.a { justify-content: flex-end; }
    .shield { position: relative; flex: 0 0 auto; width: 30px; height: 36px; background: #c9ced6; clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%); }
    .kit { position: absolute; inset: 0; }
    .nm { min-width: 0; font-size: 28px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 14px; height: 20px; border-radius: 2px; font-size: 10px; font-weight: 800; }
    .card.red { background: #e5262b; color: #fff; }
    .card.yellow { background: #f7d117; color: #111; }
    .score { position: relative; display: flex; align-items: center; gap: 14px; padding: 0 22px; background: #111; color: #fff; font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .score .dash { font-size: 26px; color: #888; }
    .clock { position: relative; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #00a86b; color: #fff; }
    .gc { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .added { padding: 2px 6px; background: #fff; color: #00a86b; font-size: 16px; font-weight: 800; border-radius: 2px; }
    .added:has(.at:empty) { display: none; }
    .half { min-width: 30px; padding: 2px 6px; text-align: center; border: 2px solid #fff; border-radius: 3px; font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .half:empty { display: none; }
    .live { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .ht { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #111; color: #3ee09c; font-size: 24px; font-weight: 800; letter-spacing: 3px; }
    .pens { display: none; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="wrap" aria-label="Soccer lower third">
  <span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
  <div class="strip">
    <span class="team a"><span class="card yellow isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="card red isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="shield"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span></span>
    <span class="score"><span class="sa currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b class="dash">-</b><span class="sb currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span>
    <span class="team b"><span class="shield"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="card yellow isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="card red isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span></span>
    <span class="clock"><span class="live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="added addedTimeVisible"><span class="at addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="half periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="ht isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">HT</span></span>
  </div>
  <span class="pens shootoutAttempts"><b class="pens-l">PENS</b><span class="pen-a shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore"></span><b class="pens-d">-</b><span class="pen-b shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore"></span></span>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
