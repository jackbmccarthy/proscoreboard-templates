<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burgundy Sand Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #273537; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { width: 100%; max-width: 520px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #b6b4ad; background: #e8e4db; }
.heading { display: flex; align-items: stretch; min-height: 37px; border-bottom: 1px solid #b6b4ad; font-size: 18px; font-weight: 700; line-height: 1; }
.sport-tab { display: flex; align-items: center; justify-content: center; flex: 0 0 42%; padding: 5px 10px; background: #893d4d; color: #fff; font-size: 22px; white-space: nowrap; }
.heading-spacer { flex: 1 1 0; }
.sets-heading, .points-heading { display: flex; align-items: center; justify-content: center; text-align: center; }
.sets-heading, .match-score { flex: 0 0 15%; }
.points-heading, .primary-score { flex: 0 0 23%; }
.team { display: flex; align-items: stretch; min-height: 52px; }
.team + .team { border-top: 1px solid #b6b4ad; }
.identity { display: flex; align-items: center; flex: 1 1 0; gap: 22px; padding: 7px 12px; }
.tick { display: block; width: 3px; flex: 0 0 3px; height: 37px; background: #893d4d; }
.name { display: block; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 32px; font-weight: 700; line-height: 1; color: #273537; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.match-score { display: flex; align-items: center; justify-content: center; border-left: 1px solid #b6b4ad; font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.primary-score { display: flex; align-items: center; justify-content: center; border-left: 1px solid #b6b4ad; background: #183336; color: #fff; font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.set-footer { display: flex; align-items: center; justify-content: center; min-height: 41px; gap: 13px; border-top: 1px solid #b6b4ad; background: #183336; color: #fff; font-size: 17px; font-weight: 700; line-height: 1; }
.footer-label { color: #d3828d; }
.set-value { display: block; width: 28px; text-align: center; font-size: 24px; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 600px) { .stage { padding: 14px; } .sport-tab { font-size: 18px; } .heading { font-size: 15px; } .identity { gap: 13px; padding-left: 8px; padding-right: 7px; } .name { font-size: 26px; } .match-score { font-size: 24px; } .primary-score { font-size: 34px; } }
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="heading rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tab">VOLLEYBALL</span><span class="heading-spacer"></span><span class="sets-heading">SETS</span><span class="points-heading">POINTS</span></header>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
      <footer class="set-footer"><span class="footer-label">SET</span><span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
