<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linen Navy Sideconsole — Basketball compact</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6px}.board{width:min(72vw,1360px);aspect-ratio:3.7;display:grid;grid-template-columns:20% minmax(0,1fr);overflow:hidden;border-radius:3px;background:#1f3242;color:#f8fafb;container-type:inline-size;font-variant-numeric:tabular-nums}.console{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:1.5% 3%;background:#e7dfd0;color:#1f3242}.sport-tag{font-size:2.15cqw;font-weight:800;letter-spacing:-.03em;white-space:nowrap}.stat{display:flex;flex-direction:column;align-items:center;gap:.2cqw}.stat-label{font-size:1.2cqw;font-weight:750}.stat-value{font-size:3.1cqw;font-weight:800;line-height:1}.lanes{min-width:0;display:flex;flex-direction:column}.lane{min-height:0;flex:1 1 0;display:grid;grid-template-columns:1.8% minmax(0,1fr) 16% 17%;align-items:center;column-gap:2.3%;padding:1.7% 2%}.lane+.lane{border-top:2px solid #516470}.identity{height:82%;min-height:0;background:#2685a5;border-radius:2px}.jerseyColorB{background:#c96a60}.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5cqw;font-weight:700;line-height:1.05}.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}.support{height:81%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#aebfc2;color:#1f3242;border-radius:2px}.support-value{font-size:5.5cqw;font-weight:800;line-height:1}.support-label{font-size:1.6cqw;font-weight:800;line-height:1.1}.primary{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:7cqw;font-weight:800;line-height:1}.primary-label{font-size:1.7cqw;font-weight:700;line-height:1.1}.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}@media(max-width:700px){.board{width:100%;height:168px;aspect-ratio:auto;grid-template-columns:27% minmax(0,1fr)}.console{padding:4% 1%}.sport-tag{font-size:3cqw}.stat-label{font-size:2.1cqw}.stat-value{font-size:4.5cqw}.lane{grid-template-columns:5px minmax(0,1fr) 51px 48px;column-gap:5px;padding:5px}.lane+.lane{border-top-width:1px}.name{font-size:5cqw}.support-value{font-size:6cqw}.support-label{font-size:2cqw}.score{font-size:6cqw}.primary-label{font-size:2cqw}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Basketball scoreboard"><aside class="console" data-osb-component="layout"><span class="sport-tag" data-osb-component="text">BASKETBALL</span><div class="stat" data-osb-component="layout"><span class="stat-label" data-osb-component="text">CLOCK</span><span class="stat-value" data-osb-component="text" data-sport-stat="clock" data-osb-static="true">00:00</span></div><div class="stat" data-osb-component="layout"><span class="stat-label" data-osb-component="text">PERIOD</span><span class="stat-value" data-osb-component="text" data-sport-stat="period" data-osb-static="true">0</span></div><div class="stat" data-osb-component="layout"><span class="stat-label" data-osb-component="text">SHOT</span><span class="stat-value" data-osb-component="text" data-sport-stat="shot" data-osb-static="true">00</span></div></aside><div class="lanes" data-osb-component="layout">
