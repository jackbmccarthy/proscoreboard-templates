<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Corner — Tour Bug</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.flag:not([src]),.tlogo:not([src]){display:none}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isComplete[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isComplete[style*="opacity: 1"])>.isMatchPoint{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.meta{display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.meta>*{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta .sep{flex:0 0 auto;font-style:normal;padding:0 .45em;opacity:.55}
.meta .rd,.meta .bo{flex-shrink:0}
.meta .ev:empty+.s1,.meta .rd:empty+.s2,.meta .s1:has(+.rd:empty),.meta .s2:has(+.bo:empty){display:none}
.meta .ev:empty+.s1+.rd:empty+.s2{display:none}
.won{position:absolute;z-index:0}
.gs{position:relative;z-index:1}
.gtag .nx{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .now{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stage{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:flex-start;padding:2.6vw 0 0 2.6vw;pointer-events:none}
.board{font-size:1.25vw;width:33em;font-family:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#fff;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.grid{display:flex;align-items:stretch;background:#1b1e26;border-radius:.35em .35em 0 .35em;overflow:hidden;box-shadow:0 .4em 1.4em rgba(0,0,0,.5)}
.hd{display:flex;align-items:center;justify-content:center;height:1.9em;background:#0c0d12;color:#aab1bf;font-size:1em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.grid{width:33em}
.players{display:flex;flex-direction:column;flex:1 1 auto;min-width:15em}
.mh{justify-content:flex-start;padding:0 .8em;color:#d5d9e2}
.row{display:flex;align-items:center;gap:.5em;height:3.1em;padding-right:.5em;min-width:0}
.row+.row,.cell+.cell,.hc+.hc{border-top:1px solid #2e333e}
.kit{flex:0 0 .4em;align-self:stretch;background:#5b6472}
.flag{flex:0 0 auto;width:1.75em;height:1.17em;object-fit:cover;border-radius:.12em;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.who{display:flex;flex-direction:column;justify-content:center;flex:1 1 auto;min-width:0}
.name{font-size:1.22em;line-height:1.02;font-weight:800;text-transform:uppercase;overflow-wrap:normal;word-break:normal;hyphens:none}
/* team tie: its own strip on top of the bug, the player match stays below it */
.tiebar{display:none;align-items:center;gap:.6em;min-height:2.5em;padding-block:.2em;padding:0 .7em;margin-bottom:.25em;border-radius:.35em;background:#0c0d12;box-shadow:0 .3em 1em rgba(0,0,0,.45);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.board:has(.tname:not(:empty)) .tiebar{display:flex}
.tside{display:flex;align-items:center;gap:.4em;flex:1 1 0;min-width:0;color:#e8eaf0}
.tb{justify-content:flex-end;text-align:right}
.tlogo{width:1.35em;height:1.35em;object-fit:contain;flex:0 0 auto}
.tname{min-width:0;overflow:hidden;white-space:normal;overflow-wrap:normal;hyphens:none;line-height:1.05;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.tbox{display:flex;align-items:center;gap:.3em;flex:0 0 auto;height:1.6em;padding:0 .5em;border-radius:.25em;background:#ff3d6e;color:#fff;font-variant-numeric:tabular-nums}
.tbox i{font-style:normal;font-size:1em;letter-spacing:.1em;margin-right:.2em}
.tbox .tscore{font-size:1.2em}
.tbox b{font-weight:800}
/* the tie page without a player match: the tie strip is the board */
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .grid,.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tabs{display:none}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tiebar{font-size:1.3em;width:25.4em;min-height:3em}
.s2slot{width:1.15em;height:1.3em}
.ss2{border-radius:.2em;background:#e8eaf0;color:#111;font-size:1em;font-weight:900}
.marks{display:flex;align-items:center;gap:.25em;flex:0 0 auto}
.to-slot{width:2.1em;height:1.35em}
.to-on,.to-used{border-radius:.2em;font-size:1em;font-weight:900;letter-spacing:.02em}
.to-on{background:#ffd23f;color:#111}
.to-used{background:#3d4452;color:#e8eaf0}
.card-slot{width:.85em;height:1.2em}
.card{border-radius:.12em;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.yc{background:#ffd400}.rc{background:#e3262f}
.srv{width:1.3em;height:1.3em}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff9a3c 45%,#d65f00 100%);box-shadow:0 0 0 .12em rgba(0,0,0,.3)}
.win{border-radius:50%;background:#ff3d6e}
.win::after{content:"";width:.34em;height:.62em;margin-top:-.14em;border:solid #fff;border-width:0 .16em .16em 0;transform:rotate(45deg)}
.hist{position:relative;display:flex}
.hcol{display:flex;flex-direction:column;flex:0 0 2.3em;width:2.3em;border-left:1px solid #262a33;background:#15171d}
.hl{color:#7d8595}
.hc{position:relative;display:flex;align-items:center;justify-content:center;height:3.1em;font-size:1.15em;font-weight:800;font-variant-numeric:tabular-nums;color:#7d8595}
.hc .won{inset:.35em .3em;border-radius:.2em;background:#323846}
.hc:has(.won[style*="opacity: 1"]){color:#fff}
.hcol .hc{height:calc(3.1em / 1.15)}
.hcol:not(:has(.won[style*="opacity: 1"])){position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap;padding:0!important;margin:0!important;border:0!important}
.col{display:flex;flex-direction:column}
.cell{display:flex;align-items:center;justify-content:center;height:3.1em;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.gcol{flex:0 0 4.1em;width:4.1em;background:#353b48;border-left:.3em solid #0c0d12}
.gcol .hd{background:#0c0d12;color:#e8eaf0}
.gcol .cell{font-size:1.5em;height:calc(3.1em / 1.5)}
.pcol{flex:0 0 4em;width:4em;background:#ff3d6e}
.pcol .hd{width:100%;background:#d81f52;color:#fff}
.pcol .cell{font-size:1.95em;height:calc(3.1em / 1.95)}
.pcol .cell+.cell{border-top:1px solid #ff7396}
.ph,.gh{display:block;position:relative;width:100%}
.gh:has(>.fin[style*="opacity: 1"]) .glbl{opacity:0}
.board:has(.isComplete[style*="opacity: 1"]) .pcol{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important}
.board:has(.isComplete[style*="opacity: 1"]) .grid{position:relative}
.board:has(.isComplete[style*="opacity: 1"]) .gcol{background:#ff3d6e;flex-basis:4.1em}
.board:has(.isComplete[style*="opacity: 1"]) .gcol .cell{font-size:1.95em;height:calc(3.1em / 1.95)}
.board:has(.isComplete[style*="opacity: 1"]) .gcol .cell+.cell{border-top:1px solid #ff7396}
.ph>*{font-weight:800;letter-spacing:.06em}
.ph:has(>.gtag[style*="opacity: 1"]) .plbl,.ph:has(>.fin[style*="opacity: 1"]) .plbl{opacity:0}
.fin{background:#d81f52;color:#fff;font-weight:800;letter-spacing:.08em}
/* winner: the loser's row steps back, the winner keeps the coral cell and a check */
.board:has(.isAWinner[style*="opacity: 1"]) .b,.board:has(.isBWinner[style*="opacity: 1"]) .a{color:#8b92a1}
.board:has(.isAWinner[style*="opacity: 1"]) .row.b .name,.board:has(.isBWinner[style*="opacity: 1"]) .row.a .name{color:#8b92a1}
.board:has(.isAWinner[style*="opacity: 1"]) .gcol .b,.board:has(.isBWinner[style*="opacity: 1"]) .gcol .a{background:#353b48;color:#b9bfcb}
.board:has(.isAWinner[style*="opacity: 1"]) .row.b .flag,.board:has(.isBWinner[style*="opacity: 1"]) .row.a .flag{opacity:.55}
.tabs{display:flex;height:2.1em}
.state{width:11em;height:2.1em}
.st{border-radius:0 0 .3em .3em;font-size:1em;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.st-warm,.st-break{background:#0c0d12;color:#e8eaf0}
.st-gp{background:#ff9a3c;color:#111}
.st-mp{background:#ff3d6e;color:#fff}

</style>
</head>
<body>
<main class="stage"><article class="board t-tour" data-osb-component="layout"><div class="tiebar" data-osb-component="layout"><span class="tside ta"><img class="teamLogoURLA tlogo" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><span class="teamAName tname" data-osb-component="field" data-osb-field="teamAName"></span></span><span class="tbox"><i>Tie</i><span class="teamAScore tscore" data-osb-component="field" data-osb-field="teamAScore">0</span><b>–</b><span class="teamBScore tscore" data-osb-component="field" data-osb-field="teamBScore">0</span></span><span class="tside tb"><span class="teamBName tname" data-osb-component="field" data-osb-field="teamBName"></span><img class="teamLogoURLB tlogo" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""></span></div><div class="grid" data-osb-component="layout"><div class="players" data-osb-component="layout"><span class="hd mh"><span class="meta"><span class="eventName ev" data-osb-component="field" data-osb-field="eventName"></span><i class="sep s1">·</i><span class="matchRound rd" data-osb-component="field" data-osb-field="matchRound"></span><i class="sep s2">·</i><span class="matchFormatLabel bestOf bo" data-osb-component="field" data-osb-field="matchFormatLabel"></span></span></span><div class="row rA a" data-osb-component="layout"><span class="jerseyColorA kit" data-osb-component="field" data-osb-field="jerseyColorA"></span><img class="countryA flag" data-osb-component="field" data-osb-field="countryA" alt=""><span class="who"><span class="combinedAName name" data-osb-component="field" data-osb-field="combinedAName"></span></span><span class="marks"><span class="slot to-slot"><span class="isATimeOutActive to-on" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0">T/O</span><span class="isATimeOutUsed to-used" data-osb-component="field" data-osb-field="isATimeOutUsed" style="opacity:0">T</span></span><span class="slot card-slot"><span class="isAYellowCarded card yc" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0"></span></span><span class="slot card-slot"><span class="isARedCarded card rc" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0"></span></span></span><span class="slot s2slot isDoubles" data-osb-component="field" data-osb-field="isDoubles" style="opacity:0"><span class="isSecondServer ss2" data-osb-component="field" data-osb-field="isSecondServer" style="opacity:0" isa="true">2</span></span><span class="slot srv"><span class="isACurrentlyServing servingA ball" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity:0" isa="true"></span><span class="isAWinner win" data-osb-component="field" data-osb-field="isAWinner" style="opacity:0"></span></span></div><div class="row rB b" data-osb-component="layout"><span class="jerseyColorB kit" data-osb-component="field" data-osb-field="jerseyColorB"></span><img class="countryB flag" data-osb-component="field" data-osb-field="countryB" alt=""><span class="who"><span class="combinedBName name" data-osb-component="field" data-osb-field="combinedBName"></span></span><span class="marks"><span class="slot to-slot"><span class="isBTimeOutActive to-on" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0">T/O</span><span class="isBTimeOutUsed to-used" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="opacity:0">T</span></span><span class="slot card-slot"><span class="isBYellowCarded card yc" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0"></span></span><span class="slot card-slot"><span class="isBRedCarded card rc" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0"></span></span></span><span class="slot s2slot isDoubles" data-osb-component="field" data-osb-field="isDoubles" style="opacity:0"><span class="isSecondServer ss2" data-osb-component="field" data-osb-field="isSecondServer" style="opacity:0">2</span></span col isGame7Started" data-osb-component="layout" data-osb-field="isGame7Started" style="display:none"><span class="hd hl">G7</span><span class="hc a"><span class="isGame7AWon won" data-osb-component="field" data-osb-field="isGame7AWon" style="opacity:0"></span><span class="game7AScore gs" data-osb-component="field" data-osb-field="game7AScore">0</span></span><span class="hc b"><span class="isGame7BWon won" data-osb-component="field" data-osb-field="isGame7BWon" style="opacity:0"></span><span class="game7BScore gs" data-osb-component="field" data-osb-field="game7BScore">0</span></span></div></div><div class="col gcol" data-osb-component="layout"><span class="hd slot gh"><span class="glbl">Games</span><span class="isComplete fin" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">Final</span></span><span class="cell a"><span class="currentAMatchScore AScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span><span class="cell b"><span class="currentBMatchScore BScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span></div><div class="col pcol" data-osb-component="layout"><span class="hd slot ph"><span class="plbl">Points</span><span class="isMatchStarted gtag" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0"><span class="now">Game <span class="currentGame cg" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="nx">Game <span class="nextGame ng" data-osb-component="field" data-osb-field="nextGame"></span></span></span></span><span class="cell a"><span class="currentAGameScore pts" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><span class="cell b"><span class="currentBGameScore pts" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span></div></div><div class="tabs" data-osb-component="layout"><span class="slot state"><span class="isWarmUpStarted st st-warm" data-osb-component="field"
