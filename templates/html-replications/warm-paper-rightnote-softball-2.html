<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>softball — Warm Paper Rightnote</title><style>*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#293a44}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{--paper:#f2efe9;--ink:#293a44;display:flex;width:min(70vw,1100px);max-width:100%;min-width:0;overflow:hidden;border-radius:6px;background:var(--paper);container-type:inline-size;position:relative}
.lanes{display:flex;flex:1 1 auto;min-width:0}
.lane{display:flex;align-items:stretch;min-width:0;background:var(--paper)}
.identity{display:block;flex:0 0 2.3%;min-width:6px;background:#2f86a7}
.jerseyColorB{background:#c77469}
.name-lane{display:flex;flex:1 1 auto;min-width:0;flex-direction:column;justify-content:center;overflow:hidden;padding:0 2.4cqw}
.name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.7cqw;font-weight:700;line-height:1.02}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support-track{display:flex;align-items:baseline;gap:.45cqw;margin-top:.45cqw;white-space:nowrap;color:var(--ink)}
.support-track .value{font-size:3.1cqw;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.support-track .caption{font-size:1.65cqw;font-weight:700;line-height:1;letter-spacing:.01em}
.primary-track{display:flex;flex:0 0 16%;min-width:0;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);background:var(--paper);font-variant-numeric:tabular-nums}
.primary-track .value{display:block;width:100%;overflow:hidden;text-align:center;white-space:nowrap;font-size:7.2cqw;font-weight:700;line-height:.9;letter-spacing:-.055em}
.primary-track .caption{display:block;margin-top:.6cqw;font-size:2.15cqw;font-weight:700;line-height:1}
.dock{display:flex;flex:0 0 25%;min-width:0;flex-direction:column;justify-content:center;padding:1.8cqw 2.4cqw;background:var(--ink);color:#faf9f5}
.dock-title{display:block;font-size:3cqw;font-weight:700;line-height:1.1;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr auto;column-gap:1cqw;row-gap:1.15cqw;margin-top:2.8cqw;font-size:1.9cqw;line-height:1.1;white-space:nowrap}
.stat-value{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.retained,.neutral-point-slot{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.neutral-point-slot:has(.isMatchPoint[style*="opacity: 1"]) .isGamePoint,.neutral-point-slot:has(.isMatchPoint[style*="opacity:1"]) .isGamePoint{opacity:0!important}
.compact .lanes{flex-direction:column}
.compact .lane{height:13.8cqw;flex:none}
.compact .lane+.lane{border-top:1px solid #b9c2bf}
.horizontal{width:min(92vw,1660px)}
.horizontal .lanes{flex-direction:row}
.horizontal .lane{height:11.8cqw;flex:1 1 0}
.horizontal .lane+.lane{border-left:1px solid #b9c2bf}
.horizontal .identity{flex-basis:2.5%}
.horizontal .name-lane{padding:0 2cqw}
.horizontal .name{font-size:4cqw}
.horizontal .support-track{margin-top:.65cqw;gap:.3cqw}
.horizontal .support-track .value{font-size:2.8cqw}
.horizontal .support-track .caption{font-size:1.8cqw}
.horizontal .primary-track{flex-basis:18%}
.horizontal .primary-track .value{font-size:4.2cqw}
.horizontal .primary-track .caption{font-size:1.8cqw}
.horizontal .dock{flex-basis:16%;padding:1cqw 1.7cqw}
.horizontal .dock-title{font-size:2cqw}
.horizontal .stats{font-size:1.25cqw;row-gap:.65cqw;margin-top:1cqw}
@media(max-width:650px){
.stage{padding:4px}
.board,.horizontal{width:100%}
.horizontal .lanes{flex-direction:column}
.horizontal .lane{flex:none}
.horizontal .lane+.lane{border-left:0;border-top:1px solid #b9c2bf}
.compact .lane,.horizontal .lane{height:66px}
.identity,.horizontal .identity{flex:0 0 5px}
.name-lane,.horizontal .name-lane{padding:0 9px}
.name,.horizontal .name{font-size:clamp(16px,4.8vw,24px)}
.support-track,.horizontal .support-track{margin-top:3px;gap:3px}
.support-track .value,.horizontal .support-track .value{font-size:15px}
.support-track .caption,.horizontal .support-track .caption{font-size:10px}
.primary-track,.horizontal .primary-track{flex:0 0 59px}
.primary-track .value,.horizontal .primary-track .value{font-size:30px}
.primary-track .caption,.horizontal .primary-track .caption{font-size:10px;margin-top:4px}
.dock,.horizontal .dock{flex:0 0 110px;padding:7px}
.dock-title,.horizontal .dock-title{font-size:12px}
.stats,.horizontal .stats{font-size:9px;row-gap:6px;margin-top:10px;column-gap:3px}
}
@media(max-width:390px){
.dock,.horizontal .dock{flex-basis:92px}
.dock-title,.horizontal .dock-title{font-size:10px}
.stats,.horizontal .stats{font-size:8px}
.primary-track,.horizontal .primary-track{flex-basis:52px}
}</style></head><body><main class="stage"><article class="board horizontal sport-softball columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="softball scoreboard"><div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="support-track"><strong class="value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong><span class="caption" data-osb-component="text">HITS</span></span></span><span class="primary-track"><strong class="value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong><span class="caption" data-osb-component="text">RUNS</span></span><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="support-track"><strong class="value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong><span class="caption" data-osb-component="text">HITS</span></span></span><span class="primary-track"><strong class="value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong><span class="caption" data-osb-component="text">RUNS</span></span><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div><aside class="dock"><span class="dock-title" data-osb-component="text">SOFTBALL</span><div class="stats" aria-label="Editable static softball counters"><span data-osb-component="text">INNING</span><strong class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong><span data-osb-component="text">BALLS</span><strong class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong><span data-osb-component="text">STRIKES</span><strong class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong><span data-osb-component="text">OUTS</span><strong class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></div></aside><span class="neutral-point-slot" aria-hidden="true"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;"></span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;"></span></span></article></main></body></html>
