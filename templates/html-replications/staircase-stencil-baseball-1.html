<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>baseball staircase stencil 1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent;color:#f3eee2}body{font-family:Arial,sans-serif;font-weight:700}.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;padding:16px}.board{width:min(55vw,calc((100vh - 48px) * .88),1050px);container-type:inline-size;display:flex;flex-direction:column;position:relative}.sport{font-size:4.5cqw;line-height:1;letter-spacing:1.25cqw;text-align:center}.competitors{display:flex;flex-direction:column;margin-top:5cqw;}.competitor{display:flex;min-width:0;width:47%;flex-direction:column;align-items:center;}.side-b{align-self:flex-end;margin-top:-2.5cqw}.identity{display:block;min-width:0;background-color:#d56841;background-clip:text;-webkit-background-clip:text;width:100%;margin-bottom:1.4cqw;}.name{display:block;min-width:0;width:100%;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:7cqw;line-height:1.05;font-weight:800;text-align:center;}.combinedAName:empty:before{content:"Team A"}.combinedBName:empty:before{content:"Team B"}.runs{display:flex;flex-direction:column;align-items:center;width:100%;}.score-track{display:flex;align-items:center;justify-content:center;width:100%;height:32.7cqw;flex:none}.score{display:block;width:100%;text-align:center;font-family:"Arial Black",Arial,sans-serif;font-size:39.3cqw;font-weight:900;line-height:.8;letter-spacing:-.085em;transform-origin:center;mask-image:linear-gradient(to bottom,#000 0%,#000 31%,transparent 31%,transparent 36%,#000 36%,#000 64%,transparent 64%,transparent 69%,#000 69%,#000 100%);font-variant-numeric:tabular-nums}.run-label{font-size:4.8cqw;line-height:1;margin-top:1.2cqw}.stats{display:flex;align-items:center;justify-content:center;margin-top:8cqw;gap:0}.stat{display:flex;align-items:center;justify-content:center;flex:1 1 0;min-width:0;gap:1cqw}.stat-label,.stat-number,.comma{font-size:3.7cqw;line-height:1;white-space:nowrap;letter-spacing:.1cqw}.stat-number{font-variant-numeric:tabular-nums}.comma{margin-left:-.8cqw}.hidden{display:none}.point-slot{position:absolute;width:0;height:0;overflow:hidden}.point-slot>span{position:absolute;inset:0}.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint{opacity:0!important}@media(max-width:600px){.board{width:min(100%,calc((100vh - 48px) * .88))}.stat{gap:.8cqw}.stat-label,.stat-number,.comma{font-size:3.55cqw;letter-spacing:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
