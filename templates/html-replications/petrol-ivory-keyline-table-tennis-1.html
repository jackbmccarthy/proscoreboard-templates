<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Petrol Ivory Keyline — Table Tennis 1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#fff;font-weight:700}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}.board{--w:50vw;position:relative;width:min(var(--w),1060px);container-type:inline-size;padding-bottom:23px}.surface{overflow:hidden;border:2px solid #b7c6c4;border-top:5px solid #bd8d5a;border-radius:9px;background:#203b45}.header{display:flex;align-items:stretch;height:6.7cqw;border-bottom:2px solid #b7c6c4}.sport{flex:1;min-width:0;display:flex;align-items:center;padding:0 3.4cqw;font-size:2.45cqw;white-space:nowrap}.header-label{display:flex;align-items:center;justify-content:center;flex:0 0 var(--match-width);font-size:2cqw;white-space:nowrap}.header-label.points{flex-basis:var(--point-width)}.row{display:flex;align-items:stretch;height:11.7cqw;min-width:0}.row+.row{border-top:2px solid #b7c6c4}.identity-lane{flex:1 1 0;display:flex;align-items:center;gap:3.9cqw;min-width:0;padding:0 1.9cqw}.identity{display:block;flex:0 0 1.5cqw;width:1.5cqw;height:9.8cqw;background:#bd8d5a}.jerseyColorB{background:#5e9a9d}.name-wrap{display:flex;align-items:center;gap:5px;min-width:0;flex:1}.name{flex:1;min-width:0;display:block;font-size:5.7cqw;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}.serve{display:block;flex:0 0 12px;width:12px;height:12px;color:#f3f1e9;font-size:9px;line-height:12px;text-align:center}.match-cell,.point-cell{display:flex;align-items:center;justify-content:center;flex:0 0 var(--match-width);border-left:2px solid #b7c6c4}.point-cell{flex-basis:var(--point-width);background:#f3f1e9;color:#152c33}.match-score,.score{display:block;width:100%;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1}.match-score{font-size:5.6cqw}.score{font-size:7.5cqw}.point-slot{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:170px;max-width:90%;height:19px;text-align:center;font-size:11px}.point{position:absolute;inset:0;display:block;background:#203b45;color:#fff}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}.board{--match-width:17.9%;--point-width:20.9%}@media(max-width:600px){.board{--w:94vw;padding-bottom:18px}.surface{border-width:1px;border-top-width:3px;border-radius:5px}.header{height:39px;border-bottom-width:1px}.sport{padding:0 10px;font-size:14px}.header-label{font-size:10px}.row{height:68px}.row+.row,.match-cell,.point-cell{border-width:1px}.identity-lane{gap:10px;padding:0 8px}.identity{flex-basis:4px;width:4px;height:48px}.name{font-size:18px}.match-score{font-size:26px}.score{font-size:34px}.point-slot{height:16px;font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="surface columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><header class="header"><div class="sport">TABLE TENNIS</div><div class="header-label">GAMES</div><div class="header-label points">POINTS</div></header>
<div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity-lane"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-wrap"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true">●</span></div></div><div class="match-cell"><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="point-cell"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
<div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity-lane"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-wrap"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;">●</span></div></div><div class="match-cell"><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="point-cell"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></div><div class="point-slot"><span class="point isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body></html>
