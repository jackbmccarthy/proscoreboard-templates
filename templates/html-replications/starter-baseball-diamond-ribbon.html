<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Crimson Diamond Ribbon</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.bb-retained{display:none}
.bb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.8)}
.diamond>.base{position:absolute;width:30%;height:37.5%;transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.06rem)}
.diamond>.base.second{left:35%;top:10%}.diamond>.base.third{left:8%;top:44%}.diamond>.base.first{left:62%;top:44%}
.diamond::before{content:"";position:absolute;left:calc(var(--d,3rem)*.309);top:calc(var(--d,3rem)*.311);width:calc(var(--d,3rem)*.382);height:calc(var(--d,3rem)*.382);transform:rotate(45deg);border:1px solid var(--base-edge,currentColor);opacity:.28}
.bb-plate{display:none}
.bb-bases{position:absolute;left:0;right:0;bottom:-.1rem;text-align:center;font:700 .42rem/1 var(--mono-ui,Menlo,Consolas,monospace);letter-spacing:.04em;color:var(--base-text,currentColor);opacity:.85}
.bb-half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.bb-half-dim{position:absolute;inset:0}
.bb-half-dim::before,.bb-half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.28))}
.bb-half-dim::before,.bb-half-dim::after{position:absolute;left:0;width:100%;height:100%}
.bb-half-dim::before,.inningHalf::after{clip-path:polygon(50% 4%,96% 40%,4% 40%)}
.bb-half-dim::after,.inningHalf::before{clip-path:polygon(4% 60%,96% 60%,50% 96%)}
.bb-half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.bb-ls-col>.bb-gate{display:flex;flex-direction:column;align-items:stretch}
.bb-tick{position:relative}.bb-tick>.bb-gate{display:block;position:absolute;inset:0;border-radius:inherit;background:var(--tick-on,#fff)}
.bb-ls-extra{display:none!important}.bb-ls-extra:has(>.bb-gate[style*="opacity: 1"]),.bb-ls-extra:has(>.bb-gate[style*="opacity:1"]){display:flex!important}
.bb-live,.bb-break,.bb-final{transition:opacity .25s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.bb-stage{position:fixed;left:50%;bottom:2.2rem;transform:translateX(-50%);font-family:"Avenir Next Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;color:#fff}
.rb{position:relative;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 .3rem .6rem rgba(0,0,0,.45))}
.rb-meta{display:flex;gap:.5rem;padding:.25rem .9rem;margin-bottom:.25rem;background:#14161c;transform:skewX(-14deg);font:700 .58rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#a4abb8}
.rb-meta>*{transform:skewX(14deg);display:flex;gap:.5rem}.rb-meta .bb-round:not(:empty)::before{content:"/";margin-right:.5rem}
.rb-row{display:flex;align-items:center}
.rb-team{position:relative;display:flex;align-items:center;gap:.6rem;width:15rem;height:2.7rem;padding:0 1.2rem;transform:skewX(-14deg);isolation:isolate;overflow:hidden}
.rb-team>*{transform:skewX(14deg)}
.rb-team .bb-jersey{position:absolute;inset:0;z-index:-2;transform:none;background:#3c4250}
.rb-team::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(0,0,0,.35))}
.rb-team .bb-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:1.3rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.rb-team .bb-runs{font:800 1.9rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;font-variant-numeric:tabular-nums}
.rb-a{margin-right:-.6rem;text-align:left}.rb-b{margin-left:-.6rem}.rb-b .bb-name{text-align:right;order:2}.rb-b .bb-runs{order:1}
.rb-medal{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05rem;width:4.8rem;height:4.8rem;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ffe08a,#f0c43a);border:.2rem solid #fff3c4;color:#2a1d00}
.rb-medal .diamond{--d:2.8rem;--base-edge:#2a1d00;--base-off:rgba(255,255,255,.35);--base-line:.1rem;--base-text:#2a1d00}
.bb-inning{display:flex;align-items:center;gap:.15rem;font:800 .95rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;--half-on:#2a1d00;--half-off:rgba(0,0,0,.22);--half-h:.95rem;--half-size:.4rem}
.rb-chip{display:flex;align-items:center;gap:.8rem;margin-top:-.35rem;padding:.4rem 1rem .25rem;border-radius:0 0 .4rem .4rem;background:#14161c;font:700 1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif}
.rb-chip i{font-style:normal;font:700 .48rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.14em;color:#a4abb8;margin-right:.25rem}
.bb-count{font-variant-numeric:tabular-nums}
.bb-outs{display:flex;align-items:baseline;gap:.2rem}.bb-outs-label{font-size:.5rem;letter-spacing:.14em;color:#a4abb8}
.rb-he{font-size:.75rem;color:#a4abb8}
.rb-chip .bb-track{display:flex;gap:.12rem}
.bb-tick{width:.38rem;height:.38rem;transform:rotate(45deg);background:rgba(255,255,255,.18);--tick-on:#f0c43a}
.bb-live{color:#f0c43a}
.bb-break{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:50%;background:#14161c;color:#fff;font:800 .55rem/1.2 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.12em}
</style></head><body><main class="bb-stage" aria-label="Baseball lower-third scoreboard">
<article class="rb columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Baseball ribbon">
<div class="rb-meta"><span><span class="bb-event eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="bb-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span class="bb-live isMatchStarted" data-osb-component="field" style="opacity: 0">LIVE</span></div>
<div class="rb-row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="rb-team rb-a"><span class="bb-jersey jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="bb-name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="bb-runs currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
<div class="rb-medal"><span class="diamond" aria-label="Bases"><span class="base second"></span><span class="base third"></span><span class="base first"></span><span class="bb-plate" aria-hidden="true"></span><span class="bb-bases bases" data-osb-component="field"></span></span><span class="bb-inning"><span class="bb-half"><span class="bb-half-dim" aria-hidden="true"></span><span class="bb-half-win"><span class="inningHalf" data-osb-component="field"></span></span></span><span class="bb-inning-no inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="bb-break isInBetweenGames" data-osb-component="field" style="opacity: 0">INNING<br>BREAK</span></div>
<div class="rb-team rb-b"><span class="bb-jersey jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="bb-name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="bb-runs currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
<div class="rb-chip"><span><i>COUNT</i><span class="bb-count"><span class="bb-b balls" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span><span class="bb-dash" aria-hidden="true">-</span><span class="bb-s strikes" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span></span><span class="bb-outs"><span class="bb-o outs" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span><span class="bb-outs-label">OUT</span></span><span class="rb-he">H <span class="bb-h hitsA" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span>-<span class="bb-h hitsB" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span> · E <span class="bb-e errorsA" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsA">0</span>-<span class="bb-e errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></span><span class="bb-track" aria-label="Innings"><span class="bb-tick"><span class="bb-gate isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame9Started" data-osb-component="field" data-osb-field="isGame9Started" style="opacity: 0"></span></span></span></div>
</article>
<span class="bb-sr battingSide" data-osb-component="field"></span><span class="bb-retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="bb-retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main></body></html>
