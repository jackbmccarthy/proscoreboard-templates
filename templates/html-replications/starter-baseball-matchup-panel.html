<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Matchup Panel</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.osb-core-fields{display:none!important}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.nm{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none;text-wrap:balance}
.slab{position:relative;flex:none;overflow:hidden}.slab>.jc{position:absolute;inset:0}
.slab>.home{position:absolute;left:50%;bottom:.35rem;width:.8rem;height:.82rem;margin-left:-.4rem;background:#fff;clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.72)}
.diamond>.base{position:absolute;width:calc(var(--d,3rem)*.3);height:calc(var(--d,3rem)*.3);transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.08rem);overflow:hidden}
.diamond>.base.second{left:35%;top:calc(var(--d,3rem)*.082)}.diamond>.base.third{left:10%;top:calc(var(--d,3rem)*.332)}.diamond>.base.first{left:60%;top:calc(var(--d,3rem)*.332)}
.diamond .runner{position:absolute;inset:0;background:var(--base-on,#f5cf52)}
.dots{display:flex;gap:var(--dot-gap,.25rem)}
.dot{position:relative;flex:none;width:var(--dot,.82rem);height:var(--dot,.82rem);border-radius:50%;background:var(--dot-off,rgba(255,255,255,.18))}
.dot>.lit{position:absolute;inset:0;border-radius:50%;background:var(--dot-on,#f5cf52)}
.half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.half-dim{position:absolute;inset:0}
.half-dim::before,.half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.25))}
.half-dim::before,.half-dim::after{position:absolute;left:0;width:100%;height:100%}
.half-dim::before,.inningHalf::after{clip-path:polygon(50% 6%,94% 42%,6% 42%)}
.half-dim::after,.inningHalf::before{clip-path:polygon(6% 58%,94% 58%,50% 94%)}
.half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inn-n{min-width:1.1em;text-align:left}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.ev{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.5em;overflow-wrap:normal;word-break:normal;hyphens:none}
.ev-e:empty,.ev-r:empty{display:none}.ev-e:has(+.ev-r:not(:empty))::after{content:"\00b7";margin-left:.5em;opacity:.75}
.st{position:relative;display:inline-grid;align-items:center;justify-items:end;white-space:nowrap}
.st>*{grid-area:1/1}
.st-pre{opacity:0}.st:has(>.isMatchStarted[style*="opacity: 0"])>.st-pre{opacity:1}
.st-live-in{display:inline-flex;align-items:center;gap:.4em}.st-live-in>i{flex:none;width:.8rem;height:.8rem;border-radius:50%;background:var(--live,#ff3b30);box-shadow:0 0 .45rem var(--live,#ff3b30);animation:osb-pulse 1.4s ease-in-out infinite}
@keyframes osb-pulse{50%{opacity:.7}}
.board:has(.isComplete[style*="opacity: 1"]) .st-pre,.board:has(.isComplete[style*="opacity: 1"]) .st-live-in{visibility:hidden}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.ls{display:flex}
.ls-col{position:relative}
.ls-extra{display:none!important}.ls-extra:has(>.ls-gate[style*="opacity: 1"]){display:flex!important}
.ls-gate{display:flex;flex-direction:column;position:relative}
.ls-c{position:relative;display:flex;align-items:center;justify-content:center}

.ls-cur{position:absolute;inset:0;pointer-events:none}
.tick{position:relative}.tick>.tick-on,.tick>.tick-cur{position:absolute;inset:0;border-radius:inherit}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.board{position:fixed;left:2.4rem;bottom:2.4rem;font-family:"Avenir Next Condensed","Bahnschrift SemiCondensed","Roboto Condensed","Arial Narrow",sans-serif;color:#16202e;--live:#ff3b30}
.pan{display:grid;grid-template-columns:33rem 20.5rem;border-radius:.5rem;overflow:hidden;box-shadow:0 .45rem 1.2rem rgba(0,0,0,.45)}
.hdr{grid-column:1/3;display:grid;grid-template-columns:1fr 3.8rem 2.6rem 2.6rem 20.5rem;align-items:center;min-height:2.05rem;background:#16202e;color:#f2f4f7;font:700 1rem/1.2 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.07em;text-transform:uppercase}
.hdr .ev{padding:.3rem 0 .3rem 1rem}.hdr>.c{text-align:center;color:#9aa6b8;letter-spacing:.1em}
.hdr .hr{display:flex;align-items:center;justify-content:space-between;padding:0 1rem}
.hdr .sp{color:#ff7a1a;letter-spacing:.14em}
.teams{background:#ffffff}
.row{display:grid;grid-template-columns:1.2rem 1fr 1.7rem 3.8rem 2.6rem 2.6rem;align-items:center;height:3.3rem}
.row+.row{border-top:.08rem solid rgba(22,32,46,.12)}
.slab{align-self:stretch;background:var(--fb)}.slab-a{--fb:#8590a0}.slab-b{--fb:#b2b9c4}
.nmw{min-width:0;padding:0 .4rem 0 1rem}
.nm{font-weight:700;font-size:1.55rem;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.batw{display:flex;justify-content:center}.bat{width:.9rem;height:.9rem;border-radius:50%;background:#ff7a1a}
.rc{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#16202e}
.rc>.win{position:absolute;inset:0;background:#ff7a1a}
.runs{position:relative;font:700 2.4rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;color:#fff}
.rc:has(>.win[style*="opacity: 1"])>.runs{color:#fff}
.he{text-align:center;font:700 1.35rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;color:#5d6878;font-variant-numeric:tabular-nums}
.pan:has(.isBWinner[style*="opacity: 1"]) .row-a :is(.nm,.runs,.he,.slab),.pan:has(.isAWinner[style*="opacity: 1"]) .row-b :is(.nm,.runs,.he,.slab){opacity:.45}
.sit{position:relative;display:grid;grid-template-columns:auto auto 1fr;align-items:center;column-gap:1rem;padding:0 1.2rem 0 1.1rem;background:#222e40;color:#f4f6f9}
.lc{display:flex;flex-direction:column;align-items:flex-start;gap:.45rem}

.inn{display:flex;align-items:center;gap:.2rem;font:700 2rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;--half-on:#ff7a1a;--half-off:rgba(255,255,255,.2);--half-h:2rem;--half-size:0.88rem}
.diamond{--d:4.2rem;--base-edge:#f4f6f9;--base-off:transparent;--base-on:#ff7a1a;--base-line:.14rem}
.cnt{display:flex;flex-direction:column;align-items:center;gap:.32rem}
.count{font:700 1.75rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}.count .dash{opacity:.6;margin:0 .08em}
.bs{display:flex;gap:.5rem;--dot:0.82rem;--dot-gap:.2rem;--dot-off:rgba(255,255,255,.17)}.ball-dots{--dot-on:#4fdc8a}.strike-dots{--dot-on:#ff5a52}
.outw{display:flex;flex-direction:column;align-items:center;gap:.32rem;--dot:0.9rem;--dot-gap:.3rem;--dot-off:rgba(255,255,255,.17);--dot-on:#ff7a1a}
.outs-l{font:700 1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.12em;color:#aab4c3}
.bso{justify-self:end;display:grid;grid-template-columns:auto auto;align-items:center;column-gap:.6rem;row-gap:.3rem;font:700 1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.08em;color:#aab4c3;--dot:.85rem;--dot-gap:.28rem;--dot-off:rgba(255,255,255,.17)}
.bso>b{text-align:right}
.ball-dots{--dot-on:#4fdc8a}.strike-dots{--dot-on:#ff5a52}.out-dots{--dot-on:#ff7a1a}

.cover{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:.6rem;background:#222e40;text-transform:uppercase;text-align:center;white-space:nowrap}
.cover b{font:700 1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.16em;color:#aab4c3}
.cover .pl{font:700 1.7rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.05em;color:#f4f6f9}
.cover.fin{font:700 1.87rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.14em;color:#ff7a1a}
.ticks{display:flex;gap:.26rem}
.foot{grid-column:1/3;display:flex;justify-content:flex-end;padding:.4rem 1rem;background:#16202e}
.tick{width:1.15rem;height:.26rem;border-radius:.13rem;background:rgba(255,255,255,.14)}
.tick>.tick-on{background:rgba(255,255,255,.45)}.tick>.tick-cur{background:#ff7a1a}
</style></head><body><main class="board" aria-label="Baseball lower-third scoreboard">
<div class="pan columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="baseball matchup panel">
<div class="hdr"><span class="ev"><span class="ev-e eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span class="c">R</span><span class="c">H</span><span class="c">E</span><span class="hr"><span class="st"><span class="st-pre">PREGAME</span><span class="st-live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0"><span class="st-live-in"><i></i>LIVE</span></span></span></span></div>
<div class="teams"><div class="row row-a"><span class="slab slab-a"><span class="jc jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="home isAHome" data-osb-component="field" data-osb-field="isAHome" style="opacity: 0"></span></span><span class="nmw"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></span><span class="batw"><span class="bat isABatting" data-osb-component="field" data-osb-field="isABatting" style="opacity: 0"></span></span><span class="rc"><span class="win isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity: 0"></span><span class="runs currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><span class="he hitsA" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span><span class="he errorsA" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsA">0</span></div><div class="row row-b"><span class="slab slab-b"><span class="jc jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="home isBHome" data-osb-component="field" data-osb-field="isBHome" style="opacity: 0"></span></span><span class="nmw"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></span><span class="batw"><span class="bat isBBatting" data-osb-component="field" data-osb-field="isBBatting" style="opacity: 0"></span></span><span class="rc"><span class="win isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity: 0"></span><span class="runs currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span><span class="he hitsB" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span><span class="he errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></div></div>
<div class="sit"><span class="lc"><span class="inn"><span class="half" aria-hidden="true"><span class="half-dim"></span><span class="half-win"><span class="inningHalf" data-osb-component="field"></span></span></span><span class="inn-n inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="count"><span class="cb balls" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span><span class="dash" aria-hidden="true">-</span><span class="cs strikes" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span></span><span class="diamond" aria-label="Bases"><span class="base second"><span class="runner isRunnerOnSecond" data-osb-component="field" data-osb-field="isRunnerOnSecond" style="opacity: 0"></span></span><span class="base third"><span class="runner isRunnerOnThird" data-osb-component="field" data-osb-field="isRunnerOnThird" style="opacity: 0"></span></span><span class="base first"><span class="runner isRunnerOnFirst" data-osb-component="field" data-osb-field="isRunnerOnFirst" style="opacity: 0"></span></span></span><span class="bso"><b>BALL</b><span class="dots ball-dots"><span class="dot"><span class="lit isBall1" data-osb-component="field" data-osb-field="isBall1" style="opacity: 0"></span></span><span class="dot"><span class="lit isBall2" data-osb-component="field" data-osb-field="isBall2" style="opacity: 0"></span></span><span class="dot"><span class="lit isBall3" data-osb-component="field" data-osb-field="isBall3" style="opacity: 0"></span></span></span><b>STRIKE</b><span class="dots strike-dots"><span class="dot"><span class="lit isStrike1" data-osb-component="field" data-osb-field="isStrike1" style="opacity: 0"></span></span><span class="dot"><span class="lit isStrike2" data-osb-component="field" data-osb-field="isStrike2" style="opacity: 0"></span></span></span><b>OUT</b><span class="dots out-dots"><span class="dot"><span class="lit isOut1" data-osb-component="field" data-osb-field="isOut1" style="opacity: 0"></span></span><span class="dot"><span class="lit isOut2" data-osb-component="field" data-osb-field="isOut2" style="opacity: 0"></span></span></span></span><span class="cover brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0"><b>End of</b><span class="pl periodLabel" data-osb-component="field" data-osb-field="periodLabel"></span></span><span class="cover fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0"><span>Final</span></span></div>
<div class="foot"><span class="ticks" aria-label="Innings"><span class="tick"><span class="tick-on isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity: 0"></span><span class="tick-cur isInning1Current" data-osb-component="field" data-osb-field="isInning1Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity: 0"></span><span class="tick-cur isInning2Current" data-osb-component="field" data-osb-field="isInning2Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity: 0"></span><span class="tick-cur isInning3Current" data-osb-component="field" data-osb-field="isInning3Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity: 0"></span><span class="tick-cur isInning4Current" data-osb-component="field" data-osb-field="isInning4Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity: 0"></span><span class="tick-cur isInning5Current" data-osb-component="field" data-osb-field="isInning5Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity: 0"></span><span class="tick-cur isInning6Current" data-osb-component="field" data-osb-field="isInning6Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity: 0"></span><span class="tick-cur isInning7Current" data-osb-component="field" data-osb-field="isInning7Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity: 0"></span><span class="tick-cur isInning8Current" data-osb-component="field" data-osb-field="isInning8Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame9Started" data-osb-component="field" data-osb-field="isGame9Started" style="opacity: 0"></span><span class="tick-cur isInning9Current" data-osb-component="field" data-osb-field="isInning9Current" style="opacity: 0"></span></span></span></div>
</div>
<span class="sr"><span class="battingSide" data-osb-component="field" data-osb-field="battingSide"></span><span class="bases" data-osb-component="field" data-osb-field="bases"></span><span class="outs" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span></span><span class="osb-core-fields" aria-hidden="true"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></span></span>
</main></body></html>
