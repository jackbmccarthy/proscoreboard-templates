<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Neon Night Glass</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.bb-retained{display:none}
.bb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.8)}
.diamond>.base{position:absolute;width:30%;height:37.5%;transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.06rem)}
.diamond>.base.second{left:35%;top:10%}.diamond>.base.third{left:8%;top:44%}.diamond>.base.first{left:62%;top:44%}
.diamond::before{content:"";position:absolute;left:calc(var(--d,3rem)*.309);top:calc(var(--d,3rem)*.311);width:calc(var(--d,3rem)*.382);height:calc(var(--d,3rem)*.382);transform:rotate(45deg);border:1px solid var(--base-edge,currentColor);opacity:.28}
.bb-plate{display:none}
.bb-bases{position:absolute;left:0;right:0;bottom:-.1rem;text-align:center;font:700 .42rem/1 var(--mono-ui,Menlo,Consolas,monospace);letter-spacing:.04em;color:var(--base-text,currentColor);opacity:.85}
.bb-half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.bb-half-dim{position:absolute;inset:0}
.bb-half-dim::before,.bb-half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.28))}
.bb-half-dim::before,.bb-half-dim::after{position:absolute;left:0;width:100%;height:100%}
.bb-half-dim::before,.inningHalf::after{clip-path:polygon(50% 4%,96% 40%,4% 40%)}
.bb-half-dim::after,.inningHalf::before{clip-path:polygon(4% 60%,96% 60%,50% 96%)}
.bb-half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.bb-ls-col>.bb-gate{display:flex;flex-direction:column;align-items:stretch}
.bb-tick{position:relative}.bb-tick>.bb-gate{display:block;position:absolute;inset:0;border-radius:inherit;background:var(--tick-on,#fff)}
.bb-ls-extra{display:none!important}.bb-ls-extra:has(>.bb-gate[style*="opacity: 1"]),.bb-ls-extra:has(>.bb-gate[style*="opacity:1"]){display:flex!important}
.bb-live,.bb-break,.bb-final{transition:opacity .25s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.bb-stage{position:fixed;right:2rem;top:1.6rem;font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;color:#fbf6ff}
.ng{display:flex;border-radius:.6rem;overflow:hidden;background:linear-gradient(160deg,#22163a,#0b0715);border:1px solid rgba(255,95,162,.3);box-shadow:0 .4rem 1.2rem rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.ng-teams{display:flex;flex-direction:column;justify-content:center;gap:.25rem;padding:.55rem .2rem .45rem .7rem;width:14rem}
.ng-meta{display:flex;gap:.4rem;font:600 .52rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#a79bbd;padding-bottom:.15rem}
.ng-meta .bb-round:not(:empty)::before{content:"—";margin-right:.4rem}
.ng-row{display:flex;align-items:center;gap:.5rem;height:2.1rem}
.ng-row .bb-jersey{width:.3rem;height:1.6rem;border-radius:.15rem;background:#ff5fa2}
.ng-row .bb-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:1.02rem;font-weight:600}
.ng-row .bb-runs{min-width:2.2rem;text-align:right;font:800 1.9rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ng-he{display:flex;gap:.6rem;padding:.1rem 0 0 .8rem;font:600 .5rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.12em;color:#a79bbd}
.ng-he .bb-h,.ng-he .bb-e{color:#fbf6ff}
.ng-tower{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;width:6.4rem;padding:.45rem .3rem;background:rgba(255,255,255,.05);border-left:1px solid rgba(255,95,162,.3)}
.bb-inning{display:flex;align-items:center;gap:.25rem;font:700 .95rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;--half-on:#ff5fa2;--half-off:rgba(255,255,255,.2);--half-h:1rem;--half-size:.44rem}
.ng-tower .diamond{--d:3.7rem;--base-edge:#ff5fa2;--base-off:rgba(255,255,255,.06);--base-line:.09rem;--base-text:#ff5fa2}
.bb-count{font:800 1.3rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bb-outs{display:flex;align-items:baseline;gap:.2rem;font:800 .8rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;color:#ff5fa2}.bb-outs-label{font-size:.5rem;letter-spacing:.14em}
.ng .bb-track{display:flex;gap:.14rem;padding:.25rem 0 0 .8rem}
.bb-tick{width:.55rem;height:.16rem;border-radius:.1rem;background:rgba(255,255,255,.16);--tick-on:#ff5fa2}
.bb-live{position:absolute;top:.3rem;right:.35rem;width:.36rem;height:.36rem;border-radius:50%;background:#e8f13a;font-size:0;box-shadow:0 0 .4rem #e8f13a;animation:ng-blink 1.4s ease-in-out infinite}
@keyframes ng-blink{50%{opacity:.4}}
.bb-break{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#0b0715;font:800 .7rem/1.2 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;color:#ff5fa2}
</style></head><body><main class="bb-stage" aria-label="Softball corner scoreboard">
<article class="ng rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Softball glass score bug">
<div class="ng-teams"><div class="ng-meta"><span class="bb-event eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="bb-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
<div class="ng-row"><span class="bb-jersey jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="bb-name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="bb-runs currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
<div class="ng-row"><span class="bb-jersey jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="bb-name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="bb-runs currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
<div class="ng-he"><span>H <span class="bb-h hitsA" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span>–<span class="bb-h hitsB" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span></span><span>E <span class="bb-e errorsA" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsA">0</span>–<span class="bb-e errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></span></div><span class="bb-track" aria-label="Innings"><span class="bb-tick"><span class="bb-gate isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity: 0"></span></span></span></div>
<div class="ng-tower"><span class="bb-inning"><span class="bb-half"><span class="bb-half-dim" aria-hidden="true"></span><span class="bb-half-win"><span class="inningHalf" data-osb-component="field"></span></span></span><span class="bb-inning-no inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="diamond" aria-label="Bases"><span class="base second"></span><span class="base third"></span><span class="base first"></span><span class="bb-plate" aria-hidden="true"></span><span class="bb-bases bases" data-osb-component="field"></span></span><span class="bb-count"><span class="bb-b balls" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span><span class="bb-dash" aria-hidden="true">-</span><span class="bb-s strikes" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span><span class="bb-outs"><span class="bb-o outs" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span><span class="bb-outs-label">OUT</span></span><span class="bb-live isMatchStarted" data-osb-component="field" style="opacity: 0">LIVE</span><span class="bb-break isInBetweenGames" data-osb-component="field" style="opacity: 0">INNING<br>BREAK</span></div>
</article>
<span class="bb-sr battingSide" data-osb-component="field"></span><span class="bb-retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="bb-retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main></body></html>
