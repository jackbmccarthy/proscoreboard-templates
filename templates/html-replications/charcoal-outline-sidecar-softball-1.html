<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Softball — Charcoal Outline Sidecar 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.shell{position:relative;max-width:100%;padding-top:0;container-type:inline-size}
.board{display:flex;position:relative;width:100%;min-width:0;overflow:hidden;background:#20272c;color:#fff;border:1px solid #a8b8bc;border-radius:2px}
.competitors{display:flex;position:relative;flex:1 1 75%;min-width:0;flex-direction:column;padding-top:3.8cqw}
.competitor{display:flex;align-items:center;position:relative;flex:1 1 auto;min-width:0;background:#20272c}
.competitor+.competitor{border-top:1px solid #a8b8bc}
.identity{flex:none;width:15px;height:72%;margin-left:8px;background:#0e87eb}
.jerseyColorB{background:#f22e39}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:28px;padding-right:10px;font-weight:700;line-height:1.05;color:#fff;font-size:5.8cqw}
.combinedAName:empty:before{content:"Team A"}
.combinedBName:empty:before{content:"Team B"}
.score-track{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;width:22%;min-width:0;height:84%;margin-right:10px;background:#20272c;border:1px solid #dce3e2}
.score{display:block;width:100%;min-width:0;color:#fff;text-align:center;font-size:6.1cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.inside-runs{color:#dce3e2;font-size:1.25cqw;font-weight:700;line-height:1;white-space:nowrap;margin-bottom:4px}
.sport-tag{position:absolute;z-index:2;left:0;top:0;display:flex;align-items:center;justify-content:center;min-width:15.5cqw;height:3.8cqw;padding:0 1.8cqw;background:#dce3e2;color:#20272c;font-size:2.1cqw;font-weight:800;line-height:1;white-space:nowrap}
.runs-heading{position:absolute;top:8px;right:calc(16% + 12px);color:#fff;font-size:2cqw;font-weight:700;line-height:1}
.dock{display:flex;flex-direction:column;flex:0 0 25%;min-width:0;padding:12px 18px;background:#dce3e2;color:#20272c}
.stat{display:flex;align-items:center;justify-content:space-between;gap:7px;flex:1 1 0;min-height:0;white-space:nowrap}
.stat+.stat{border-top:1px solid #7e958f}
.stat-label{font-size:2.2cqw;font-weight:700;line-height:1}
.stat-value{font-size:3.15cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.retained,.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.shell{width:min(60vw,1100px,calc((100vh - 32px)*3.65))}
.board{height:min(16.6vw,305px,calc((100vh - 32px)*.85))}
@media(max-width:700px){
.stage{padding:10px}
.shell{width:100%;padding-top:0}
.board{height:auto;min-height:159px}
.competitors{flex-direction:column;padding-top:29px}
.competitor{height:65px;flex:none}
.competitor+.competitor{border-left:0;border-top:1px solid #a8b8bc}
.identity{width:5px;margin-left:5px;height:72%}
.name{font-size:clamp(14px,5cqw,20px);margin-left:9px;padding-right:2px}
.score-track{width:53px;height:78%;margin-right:5px}
.score{font-size:clamp(23px,7cqw,30px)}
.inside-runs{font-size:8px;margin-bottom:2px}
.sport-tag{height:29px;min-width:95px;padding:0 7px;top:0;font-size:12px}
.runs-heading{top:6px;right:60px;font-size:10px}
.dock{flex:0 0 33%;padding:6px}
.stat{gap:2px}
.stat-label{font-size:clamp(7px,2.3cqw,10px)}
.stat-value{font-size:clamp(13px,4cqw,17px)}
}
@media(max-width:390px){.dock{flex-basis:34%}.score-track{width:48px}.name{font-size:17px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
  <div class="shell">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="softball scoreboard">
      <div class="competitors columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="competitor rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container">
  <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
  <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
  <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
  <span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span>
</div>
<div class="competitor rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
  <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
  <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
  <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
  <span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span>
</div>
        <span class="runs-heading" data-osb-component="text">RUNS</span>
      </div>
      <aside class="dock columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Editable static game counters">
<div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">INNING</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></div>
<div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">BALLS</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span></div>
<div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">STRIKES</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></div>
<div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">OUTS</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span></div>
      </aside>
      <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
    </article>
    <span class="sport-tag" data-osb-component="text">SOFTBALL</span>
  </div>
</main>
</body>
</html>
