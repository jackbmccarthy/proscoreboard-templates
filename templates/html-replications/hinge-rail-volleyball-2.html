<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hinge Rail Volleyball — Duel</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #f4efdf; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { --rail: #222d2e; --ivory: #f0eade; --copper: #b67b51; width: 100%; max-width: 1328px; display: flex; flex-direction: column; gap: 2px; }
.rail { background: var(--rail); border-radius: 4px; }
.title { display: flex; align-items: center; justify-content: center; min-height: 100px; font-size: 64px; font-weight: 700; letter-spacing: .22em; padding-left: .22em; }
.duel { display: flex; min-height: 368px; }
.team { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: stretch; padding: 15px 34px 28px; }
.team + .team { border-left: 4px solid var(--copper); }
.name { display: block; width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: 64px; line-height: 1.35; letter-spacing: .09em; font-weight: 700; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.scores { display: flex; flex: 1 1 auto; align-items: flex-end; justify-content: space-between; gap: 34px; padding: 20px 40px 0; }
.score-track { flex: 0 1 194px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.label { font-size: 27px; font-weight: 700; letter-spacing: .19em; line-height: 1; }
.module { position: relative; display: flex; align-items: center; width: 100%; height: 181px; background: var(--ivory); border-radius: 5px; color: #070c0c; }
.value { display: block; width: 100%; font-family: "Arial Black", Arial, sans-serif; font-feature-settings: "zero" 0; font-variant-numeric: tabular-nums; text-align: center; font-size: 132px; font-weight: 900; line-height: 1; letter-spacing: -.07em; padding-right: .07em; }
.module::before, .module::after { content: ""; position: absolute; z-index: 2; top: calc(50% - 13px); width: 13px; height: 26px; background: var(--copper); }
.module::before { left: -7px; }
.module::after { right: -7px; }
.seam { position: absolute; z-index: 1; width: 100%; top: 50%; height: 1px; background: #777b73; pointer-events: none; }
.set-rail { min-height: 90px; display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 700; letter-spacing: .2em; gap: 27px; }
.set-value { width: 55px; text-align: center; font-family: "Liberation Mono", "Courier New", monospace; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.runtime-reserve, .point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 1350px) {
  .title { font-size: clamp(27px, 4.8vw, 64px); }
  .name { font-size: clamp(25px, 4.7vw, 64px); }
  .scores { padding-right: 20px; padding-left: 20px; }
  .score-track { flex-basis: 40%; }
  .value { font-size: clamp(44px, 9vw, 120px); }
}
@media (max-width: 700px) {
  .stage { padding: 14px; }
  .title { min-height: 60px; font-size: 27px; letter-spacing: .15em; }
  .duel { min-height: 200px; }
  .team { padding: 14px 12px 20px; }
  .team + .team { border-left-width: 2px; }
  .name { font-size: 24px; letter-spacing: .04em; }
  .scores { padding: 20px 2px 0; gap: 17px; }
  .score-track { flex: 1 1 0; gap: 13px; }
  .label { font-size: 12px; letter-spacing: .1em; }
  .module { height: 88px; border-radius: 3px; }
  .value { font-size: 38px; }
  .module::before, .module::after { width: 6px; height: 16px; top: calc(50% - 8px); }
  .module::before { left: -3px; }
  .module::after { right: -3px; }
  .set-rail { min-height: 52px; font-size: 25px; gap: 12px; }
  .set-value { width: 35px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title rail">VOLLEYBALL</header>
      <div class="duel rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="team columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
          <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
          <div class="scores rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
            <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">SETS</span><div class="module"><span class="value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><i class="seam" aria-hidden="true"></i></div></div>
            <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">POINTS</span><div class="module"><span class="value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><i class="seam" aria-hidden="true"></i></div></div>
          </div>
        </div>
        <div class="team columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
          <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
          <div class="scores rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
            <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">SETS</span><div class="module"><span class="value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><i class="seam" aria-hidden="true"></i></div></div>
            <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">POINTS</span><div class="module"><span class="value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><i class="seam" aria-hidden="true"></i></div></div>
          </div>
        </div>
      </div>
      <footer class="set-rail rail">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="runtime-reserve"><span class="jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></div>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
