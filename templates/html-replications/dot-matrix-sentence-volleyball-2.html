<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot Matrix Sentence Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { color: white; font-family: Arial, Helvetica, sans-serif; }
.stage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.board { width: 100%; max-width: 1000px; display: flex; flex-direction: column; background: transparent; }
.title { font-size: 90px; font-weight: 800; line-height: 1; text-align: center; margin-bottom: 54px; }
.teams { display: flex; flex-direction: column; gap: 52px; }
.team { display: flex; align-items: center; height: 300px; }
.details { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; }
.name-color { width: 100%; min-width: 0; display: block; background-color: #fff; background-clip: text; -webkit-background-clip: text; }
.name { display: block; width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 132px; font-weight: 800; line-height: 1; color: transparent; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.sets-line { display: flex; align-items: center; gap: 20px; margin-top: 12px; }
.label { font-size: 52px; font-weight: 700; line-height: 1; }
.match-score { display: block; width: 100px; height: 60px; font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.primary-track { flex: 0 0 360px; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.primary-score { display: block; width: 100%; height: 250px; font-family: "Arial Black", Arial, sans-serif; font-size: 260px; font-weight: 900; line-height: .84; text-align: center; letter-spacing: -.07em; font-variant-numeric: tabular-nums; color: transparent; background-image: radial-gradient(ellipse 6px 4.8px at center, #ffc13a 98%, transparent 100%); background-size: 17px 13.6px; background-clip: text; -webkit-background-clip: text; transform: scaleY(1.25); transform-origin: center; }
.points-label { font-size: 46px; margin-top: 7px; }
.set-footer { display: flex; justify-content: center; align-items: center; gap: 17px; font-size: 58px; font-weight: 700; line-height: 1; margin-top: 32px; }
.set-value { display: block; width: 66px; text-align: center; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 1040px) {
  .title { font-size: clamp(28px, 8.5vw, 90px); }
  .name { font-size: clamp(35px, 12vw, 125px); }
  .primary-track { flex-basis: 36%; }
  .primary-score { font-size: clamp(95px, 24vw, 260px); }
}
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .title { font-size: 30px; margin-bottom: 33px; }
  .teams { gap: 33px; }
  .team { height: 162px; }
  .name { font-size: 39px; }
  .sets-line { gap: 8px; margin-top: 13px; }
  .label { font-size: 24px; }
  .match-score { width: 55px; height: 28px; font-size: 27px; }
  .primary-track { flex-basis: 42%; }
  .primary-score { height: 122px; font-size: 112px; background-image: radial-gradient(ellipse 2.6px 2.08px at center, #ffc13a 98%, transparent 100%); background-size: 7px 5.6px; }
  .points-label { font-size: 18px; margin-top: 4px; }
  .set-footer { font-size: 29px; margin-top: 30px; gap: 8px; }
  .set-value { width: 33px; }
}
@media(min-width:601px) and (max-height:900px){.stage{height:100vh;min-height:0;overflow:hidden}.board{transform:scale(.74);transform-origin:center}}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="details columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="name-color jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="sets-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="label">SETS</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div><div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="label points-label">POINTS</span></div></div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="details columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="name-color jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="sets-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="label">SETS</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div><div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="label points-label">POINTS</span></div></div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
