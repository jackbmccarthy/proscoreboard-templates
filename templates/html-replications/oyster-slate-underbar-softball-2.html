<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Softball Oyster Slate Underbar 2</title>
  <style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#283844}.stage{min-height:100vh;display:grid;place-items:center;padding:16px}.board{width:100%;max-width:1710px;overflow:hidden;border-radius:3px;background:#ece8df}.lanes{display:flex;}.lane{display:flex;min-width:0;min-height:126px;flex:1 1 0;background:#ece8df}.lane+ .lane{border-left:2px solid #546670;}.tick{flex:0 0 26px;background:#2684a3}.jerseyColorB{background:#c86a61}.name{display:flex;align-items:center;min-width:0;flex:1 1 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 28px;font-size:clamp(27px,3.35vw,66px);font-weight:700;letter-spacing:-.025em}.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}.primary,.support{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex-shrink:0;font-variant-numeric:tabular-nums}.primary{width:196px;background:#283844;color:#fff}.support{width:158px;background:#ece8df;color:#283844}.score{display:block;max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap;font-size:clamp(43px,4.15vw,80px);font-weight:700;line-height:.95}.caption{font-size:clamp(12px,1.3vw,24px);font-weight:700;line-height:1.25}.support .count{font-size:clamp(28px,3.2vw,64px);font-weight:700;line-height:1}.underbar{display:flex;align-items:center;min-height:64px;padding:0 36px;background:#283844;color:#fff}.sport-tag{flex:1 1 auto;font-size:clamp(19px,2vw,40px);font-weight:700;white-space:nowrap}.status{display:flex;align-items:center;justify-content:flex-end;gap:0}.status-item{display:flex;align-items:baseline;gap:12px;padding:0 35px;border-left:1px solid #b8c1be;white-space:nowrap;font-weight:700}.status-label{font-size:clamp(12px,1.3vw,25px)}.status-value{font-size:clamp(18px,1.65vw,32px);font-variant-numeric:tabular-nums}.status-item:last-child{padding-right:0}.runtime-reserve,.point-slot{display:none}.point-slot{position:relative}.point-slot>span{position:absolute;inset:0}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}@media(max-width:1300px){.board{max-width:1160px}.lane{min-height:88px}.tick{flex-basis:14px}.name{padding:0 22px;font-size:clamp(25px,3vw,42px)}.primary{width:125px}.support{width:95px}.score{font-size:55px}.support .count{font-size:42px}.caption{font-size:16px}.underbar{min-height:55px;padding:0 22px}.sport-tag{font-size:25px}.status-item{gap:7px;padding:0 15px}.status-label{font-size:15px}.status-value{font-size:21px}}@media(max-width:700px){.stage{padding:10px}.lanes{flex-direction:column}.lane{min-height:68px}.lane+.lane{border-left:0;border-top:1px solid #546670}.tick{flex-basis:8px}.name{padding:0 12px;font-size:clamp(20px,6vw,28px)}.primary{width:76px}.support{width:58px}.score{font-size:38px}.support .count{font-size:29px}.caption{font-size:10px}.underbar{min-height:72px;padding:9px 12px;display:block}.sport-tag{display:block;font-size:16px;margin-bottom:8px}.status{justify-content:space-between}.status-item{gap:3px;padding:0 5px}.status-item:first-child{padding-left:0;border-left:0}.status-label{font-size:9px}.status-value{font-size:13px}}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" aria-label="Softball scoreboard" data-osb-component="layout" data-osb-component-type="osb-column-container">
      <div class="lanes rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
        <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
        <div class="primary"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="caption">RUNS</span></div>
        <div class="support"><span class="count" data-osb-static="true" data-sport-stat="hitsA">0</span><span class="caption">HITS</span></div>
      </div>
      <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
        <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
        <div class="primary"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="caption">RUNS</span></div>
        <div class="support"><span class="count" data-osb-static="true" data-sport-stat="hitsB">0</span><span class="caption">HITS</span></div>
      </div>
      </div>
      <div class="underbar rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="sport-tag">SOFTBALL</span>
        <div class="status"><div class="status-item"><span class="status-label">INNING</span><span class="status-value" data-osb-static="true" data-sport-stat="inning">0</span></div><div class="status-item"><span class="status-label">BALLS</span><span class="status-value" data-osb-static="true" data-sport-stat="balls">0</span></div><div class="status-item"><span class="status-label">STRIKES</span><span class="status-value" data-osb-static="true" data-sport-stat="strikes">0</span></div><div class="status-item"><span class="status-label">OUTS</span><span class="status-value" data-osb-static="true" data-sport-stat="outs">0</span></div></div>
      </div>
      <div class="runtime-reserve"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
