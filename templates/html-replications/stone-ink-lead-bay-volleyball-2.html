<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Stone Ink Lead Bay 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(96vw,1501px);max-width:100%;aspect-ratio:6;overflow:hidden;border:2px solid #b4bfbb;border-radius:9px;background:#e9e7e1;color:#263741;container-type:inline-size}
.pair{display:flex;flex:1 1 0;min-width:0;min-height:0}
.side{display:flex;align-items:stretch;flex:1 1 0;min-width:0}
.side+.side{border-left:2px solid #b4bfbb}
.bay{display:flex;align-items:stretch;flex:0 0 27.6%;min-width:0;flex-direction:column;background:#263741;color:#f7f7f4;font-variant-numeric:tabular-nums}
.primary,.secondary{display:flex;align-items:center;justify-content:center;min-height:0;flex-direction:column;white-space:nowrap}
.primary{flex:0 0 63%}
.secondary{flex:1 1 0}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(43px,5cqw,78px);font-weight:800;line-height:1;text-align:center}
.set-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(23px,2.6cqw,42px);font-weight:700;line-height:1;text-align:center}
.label{display:block;max-width:100%;overflow:hidden;font-size:clamp(11px,1.3cqw,21px);font-weight:750;line-height:1}
.identity{display:block;flex:0 0 18px;align-self:stretch;background:#3989ee}
.jerseyColorB{background:#f26168}
.name{display:block;align-self:center;flex:1 1 0;min-width:0;overflow:hidden;padding:0 28px;color:#263741;font-size:clamp(29px,4.6cqw,71px);font-weight:700;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.utility{display:flex;align-items:center;justify-content:space-between;flex:0 0 28.8%;min-width:0;padding:0 32px;border-top:2px solid #b4bfbb;font-size:clamp(18px,2cqw,33px);font-weight:700;line-height:1;white-space:nowrap}
.sport-tag{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-status{display:flex;align-items:center;gap:.3em}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){
 .stage{padding:6px}
 .board{width:100%;height:145px;aspect-ratio:auto;border-width:1px;border-radius:3px}
 .side+.side,.utility{border-width:1px}
 .bay{flex-basis:28%}
 .score{font-size:clamp(24px,6.8cqw,33px)}
 .set-score{font-size:clamp(15px,4.4cqw,21px)}
 .label{font-size:clamp(7px,2.2cqw,10px)}
 .identity{flex-basis:5px}
 .name{padding:0 5px;font-size:clamp(13px,3.7cqw,17px)}
 .utility{padding:0 8px;font-size:clamp(10px,3cqw,14px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Horizontal volleyball scoreboard with generic manual scoring">
  <div class="pair rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <div class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="bay columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="primary" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="label" data-osb-component="text">POINTS</span></div><div class="secondary" data-osb-component="layout"><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="label" data-osb-component="text">SETS</span></div></div><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div>
   <div class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="bay columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="primary" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="label" data-osb-component="text">POINTS</span></div><div class="secondary" data-osb-component="layout"><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="label" data-osb-component="text">SETS</span></div></div><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div>
  </div>
  <div class="utility rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
