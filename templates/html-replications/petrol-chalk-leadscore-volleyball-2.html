<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petrol Chalk Leadscore Volleyball 2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f7f9f5}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.board{width:min(80vw,1740px);min-width:0;background:#18353f;border:1px solid #4d6970;border-radius:3px;overflow:hidden}
.header{height:57px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 36px;border-bottom:1px solid #4d6970;background:#18353f;color:#f7f9f5;font-size:34px;font-weight:700;letter-spacing:.035em;line-height:1}
.sport-tag,.status{white-space:nowrap}.status [data-sport-stat]{font-variant-numeric:tabular-nums}
.lanes{display:flex;min-width:0}.lane{height:161px;display:flex;align-items:stretch;min-width:0;flex:1;background:#18353f}.lane+.lane{border-left:1px solid #4d6970}
.tick{width:24px;flex:none;margin:12px 18px}
.jerseyColorA{background-color:#2786a5}.jerseyColorB{background-color:#c76a61}
.primary{width:199px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#e9eee8;color:#18353f}
.primary .value{font-size:90px;font-weight:700;line-height:.94;font-variant-numeric:tabular-nums}.primary .caption{margin-top:5px;font-size:23px;font-weight:700;line-height:1;letter-spacing:.02em}
.name{flex:1;min-width:0;display:flex;align-items:center;padding:0 30px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#f7f9f5;font-size:68px;font-weight:700;line-height:1.1}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.support{width:126px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#18353f;color:#f7f9f5}
.support .value{font-size:66px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}.support .caption{margin-top:5px;font-size:22px;font-weight:700;line-height:1}
.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
@media(max-width:2100px){.header{height:clamp(34px,2.62vw,57px);font-size:clamp(13px,1.57vw,34px);padding-inline:2.1%}.lane{height:clamp(68px,7.41vw,161px)}.tick{width:2.8%;margin:8px 2.1%}.primary{width:22.9%}.primary .value{font-size:clamp(35px,4.14vw,90px)}.primary .caption{font-size:clamp(9px,1.06vw,23px)}.name{font-size:clamp(16px,3.13vw,68px);padding-inline:3.4%}.support{width:14.5%}.support .value{font-size:clamp(25px,3.04vw,66px)}.support .caption{font-size:clamp(9px,1.01vw,22px)}}
@media(max-width:700px){.stage{padding:8px}.board{width:100%}.header{height:31px;font-size:11px;padding-inline:11px}.lane{height:68px}.tick{width:5px;margin:5px 3px}.primary{width:49px}.primary .value{font-size:30px}.primary .caption{font-size:8px;margin-top:2px}.name{font-size:clamp(12px,3.5vw,18px);padding-inline:7px}.support{width:34px}.support .value{font-size:23px}.support .caption{font-size:8px;margin-top:2px}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout" data-osb-component-type="osb-column-container">
<article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<header class="header"><span class="sport-tag">VOLLEYBALL</span><span class="status">SET <span data-osb-static="true" data-sport-stat="set">0</span></span></header>
<div class="lanes rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
<div class="lane" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="primary"><span class="value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="caption">POINTS</span></div><div class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></div><div class="support"><span class="value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="caption">SETS</span></div></div>
<div class="lane" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="primary"><span class="value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="caption">POINTS</span></div><div class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></div><div class="support"><span class="value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="caption">SETS</span></div></div>
</div>
<div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></div>
</article>
</main>
</body>
</html>
