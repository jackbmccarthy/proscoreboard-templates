<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stone Gold Broadcast Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #f4f4f0; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { width: 100%; max-width: 545px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #75818c; background: #273745; }
.heading { display: flex; align-items: stretch; min-height: 40px; border-bottom: 1px solid #75818c; background: #ddc79f; color: #101d2b; font-size: 17px; font-weight: 700; line-height: 1; }
.sport-title { display: flex; align-items: center; flex: 1 1 0; padding: 5px 14px; font-size: 28px; white-space: nowrap; }
.sets-heading, .points-heading { display: flex; align-items: center; justify-content: center; text-align: center; border-left: 1px solid #75818c; }
.sets-heading, .match-score { flex: 0 0 17%; }
.points-heading, .primary-score { flex: 0 0 23%; }
.team { display: flex; align-items: stretch; min-height: 62px; }
.team + .team { border-top: 1px solid #75818c; }
.identity { display: flex; align-items: center; flex: 1 1 0; gap: 14px; padding: 9px 16px; }
.tick { display: block; width: 3px; flex: 0 0 3px; height: 41px; background: #ddc79f; }
.name { display: block; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 30px; font-weight: 700; line-height: 1; color: #f4f4f0; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.match-score { display: flex; align-items: center; justify-content: center; border-left: 1px solid #75818c; font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.primary-score { display: flex; align-items: center; justify-content: center; border-left: 1px solid #75818c; background: #101d2b; color: #fff; font-size: 42px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.set-footer { display: flex; align-items: center; justify-content: center; min-height: 33px; gap: 14px; border-top: 1px solid #75818c; background: #ddc79f; color: #101d2b; font-size: 18px; font-weight: 700; line-height: 1; }
.footer-separator { display: block; width: 1px; height: 19px; background: #75818c; }
.set-value { display: block; width: 26px; text-align: center; font-size: 23px; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 600px) { .stage { padding: 14px; } .sport-title { font-size: 23px; padding-left: 10px; padding-right: 8px; } .heading { font-size: 13px; } .identity { padding-left: 9px; padding-right: 7px; gap: 9px; } .name { font-size: 24px; } .match-score { font-size: 23px; } .primary-score { font-size: 36px; } }
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="heading rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-title">VOLLEYBALL</span><span class="sets-heading">SETS</span><span class="points-heading">POINTS</span></header>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
      <footer class="set-footer"><span>SET</span><span class="footer-separator" aria-hidden="true"></span><span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
