<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ground LED</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 50px 28px; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
    .osb { position: relative; display: grid; grid-template-columns: 1fr 300px 1fr; gap: 6px; width: 1180px; padding: 8px; background: #111214; border: 3px solid #2c2e33; border-radius: 6px; color: #fff; box-shadow: 0 10px 24px #000b; }
    .sd { display: grid; grid-template-rows: 40px 90px; background: #040405; border-radius: 3px; min-width: 0; }
    .hd { display: grid; grid-template-columns: 10px minmax(0, 1fr); align-items: center; background: #1c1e22; border-radius: 3px 3px 0 0; }
    .kit { align-self: stretch; background-color: #59616e; }
    .nm { padding: 0 14px; font-size: 25px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bd { position: relative; display: flex; align-items: center; justify-content: center; }
    .bd .cards { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); }
    .sd.B .bd .cards { right: auto; left: 18px; }
    .led { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 86px; line-height: .8; padding-top: 12px; color: #ffb21e; text-shadow: 0 0 12px #ffb21ebb; font-variant-numeric: tabular-nums; }
    .mid { display: grid; grid-template-rows: 40px 90px; background: #040405; border-radius: 3px; overflow: hidden; }
    .mid > .state { grid-area: 1 / 1 / 3 / 2; }
    .mid > .phd { grid-area: 1 / 1; } .mid > .live { grid-area: 2 / 1; }
    .phd { display: flex; align-items: center; justify-content: center; gap: 12px; background: #1c1e22; font-size: 15px; font-weight: 700; letter-spacing: 3px; color: #c9ccd2; }
    .per { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 26px; line-height: .8; padding-top: 5px; color: #3cff6a; text-shadow: 0 0 8px #3cff6aaa; letter-spacing: 1px; }
    .dot { width: 9px; height: 9px; color: #ff3b2f; filter: drop-shadow(0 0 4px #ff3b2f); }
    .live { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .gc { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 70px; line-height: .8; padding-top: 10px; color: #fff; text-shadow: 0 0 10px #ffffff99; font-variant-numeric: tabular-nums; }
    .add { align-self: flex-start; margin-top: 12px; font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 34px; line-height: .8; padding-top: 4px; color: #3cff6a; text-shadow: 0 0 8px #3cff6aaa; }
    .runbar { position: absolute; left: 10px; top: 10px; width: 9px; height: 9px; border-radius: 50%; background: #3cff6a; box-shadow: 0 0 8px #3cff6a; }
    .mp { display: flex; gap: 3px; }
    .h { position: relative; width: 9px; height: 9px; border-radius: 50%; background: #2c2e33; }
    .h > span { position: absolute; inset: 0; border-radius: 50%; background: #3cff6a; box-shadow: 0 0 5px #3cff6a; }
    .et { width: 9px; height: 9px; border-radius: 50%; background: #ffb21e; box-shadow: 0 0 5px #ffb21e; }
    .state { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; background: #040405; border: 2px solid #ffb21e; border-radius: 3px; color: #ffb21e; text-shadow: 0 0 10px #ffb21ebb; }
    .st-b { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 66px; line-height: .8; padding-top: 8px; letter-spacing: 2px; }
    .pens { z-index: 2; border-color: #3cff6a; color: #3cff6a; text-shadow: 0 0 10px #3cff6abb; }
    .st-s { font-size: 20px; font-weight: 700; letter-spacing: 5px; }
    .st-v { font-family: "DIN Condensed", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 60px; line-height: .8; padding-top: 8px; }
    .st-v b { padding: 0 8px; }
    .fin { z-index: 3; color: #fff; border-color: #fff; text-shadow: 0 0 10px #ffffffaa; }
    .ev { grid-column: 1 / -1; display: flex; justify-content: center; gap: 14px; font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #8d9098; }
    .ev .matchRound { color: #ffb21e; }
    .cards { display: flex; gap: 4px; flex: 0 0 auto; }
    .yc, .rc { display: flex; align-items: center; justify-content: center; width: 22px; height: 30px; border-radius: 2px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 19px; font-weight: 700; line-height: 1; box-shadow: 0 1px 2px #0006; }
    .yc { background: #ffd21f; color: #2a2300; }
    .rc { background: #e3262e; color: #fff; }
    .yc[style*="opacity: 0"], .rc[style*="opacity: 0"] { width: 0; margin-left: -4px; }
    .brk .b-ft, .brk .b-eh, .brk .b-aet { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]) .brk .b-ht { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .b-ft { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .brk .b-eh { display: inline; }
    .osb:has(.isGame4Started[style*="opacity: 1"]) .brk .b-aet { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]) .brk .b-ft { display: none; }
    .add-v:empty::before { content: "+0"; }
    .dot i { display: block; width: 100%; height: 100%; border-radius: 50%; background: currentColor; animation: osb-pulse 1.6s ease-in-out infinite; }
    @keyframes osb-pulse { 50% { transform: scale(.55); } }
    .osb:has(.isComplete[style*="opacity: 1"]) .dot i { animation: none; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="osb" aria-label="Soccer stadium board">
  <div class="sd A"><div class="hd"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="bd"><span class="led"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><span class="cards"><span class="yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span></span></div></div>
  <div class="mid">
    <div class="phd"><span class="dot isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"><i></i></span><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="mp"><span class="h"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="h"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="et isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span><span class="et isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span></div>
    <div class="live"><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="add addedTimeVisible" data-osb-component="field" data-osb-field="addedTimeVisible" style="opacity: 0;"><span class="add-v addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="st-b b-ht">HT</span><span class="st-b b-ft">FT</span><span class="st-b b-eh">ET HT</span><span class="st-b b-aet">AET</span></div>
    <div class="state pens isShootoutActive" data-osb-component="field" data-osb-field="isShootoutActive" style="opacity: 0;"><span class="st-s">PENS</span><span class="st-v"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span><b>-</b><span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span></span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FT</span></div>
  </div>
  <div class="sd B"><div class="hd"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="bd"><span class="led"><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span><span class="cards"><span class="yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span></span></div></div>
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="homeSide" data-osb-component="field" data-osb-field="homeSide"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
