<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASEBALL — Marine Parchment Terminal compact</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f7f9f6}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{position:relative;display:flex;flex-direction:column;width:min(70vw,1450px);max-width:100%;min-width:0;overflow:hidden;border-radius:5px;background:#173947;container-type:inline-size}
.header{display:flex;align-items:center;min-width:0;height:6.2cqw;padding:0 2.4cqw;background:#ece5d7;color:#173947}
.sport-tag{flex:0 0 28%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:4.15cqw;font-weight:800;line-height:1}
.stats{display:flex;align-items:center;justify-content:space-between;flex:1 1 auto;min-width:0;height:60%}
.stat{display:flex;align-items:center;justify-content:center;gap:.6cqw;flex:1 1 0;min-width:0;height:100%;white-space:nowrap;font-size:2.1cqw;font-weight:700;line-height:1}
.stat:first-child{border-left:1px solid #89999b}.stat+.stat{border-left:1px solid #89999b}
.stat strong{font-size:1.3em;font-weight:800;font-variant-numeric:tabular-nums}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{display:flex;align-items:stretch;flex:none;min-width:0;height:8.9cqw;background:#173947}
.lane+.lane{border-top:1px solid #aec1c2}
.identity{flex:0 0 2.1cqw;align-self:stretch;margin:0;background:#2f8eaa}
.jerseyColorB{background:#cb746a}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2.1cqw;font-size:4.4cqw;font-weight:700;line-height:1.05;color:#f7f9f6}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.support-track{display:flex;flex:0 0 10.6cqw;flex-direction:row;align-items:center;justify-content:center;gap:1.1cqw;min-width:0;overflow:hidden;background:#173947;color:#f7f9f6}
.support-value{display:block;max-width:100%;overflow:hidden;font-size:4.2cqw;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.support-label{font-size:2.05cqw;font-weight:700;line-height:1;white-space:nowrap}
.primary-track{display:flex;flex:0 0 18.4cqw;flex-direction:row;align-items:center;justify-content:center;gap:1.3cqw;min-width:0;margin:.4cqw .5cqw .4cqw .8cqw;overflow:hidden;border-radius:4px;background:#ece5d7;color:#173947}
.primary-value{display:block;max-width:100%;overflow:hidden;font-size:6.7cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.primary-label{font-size:2.05cqw;font-weight:700;line-height:1;white-space:nowrap}
.retained,.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%}.header{height:52px;padding:0 9px;flex-direction:column;align-items:stretch;justify-content:center;gap:5px}.sport-tag{flex:none;font-size:15px}.stats{flex:none;height:auto}.stat{gap:3px;font-size:9px}.stat strong{font-size:12px}.lanes{flex-direction:column}.lane{flex:none;height:70px}.lane+.lane{border-left:0;border-top:1px solid #aec1c2}.identity{flex-basis:6px}.name{padding:0 9px;font-size:clamp(16px,5vw,24px)}.support-track{flex:0 0 52px;flex-direction:column;gap:2px}.support-value{font-size:20px}.support-label{font-size:9px}.primary-track{flex:0 0 68px;flex-direction:column;gap:0;margin:4px 4px 4px 2px}.primary-value{font-size:30px}.primary-label{font-size:9px}}
@media(max-width:380px){.stat{font-size:8px}.name{padding:0 5px;font-size:15px}.support-track{flex-basis:43px}.primary-track{flex-basis:60px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
<article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="BASEBALL scoreboard">
  <header class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
    <span class="sport-tag" data-osb-component="text">BASEBALL</span>
    <div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static baseball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div>
  </header>
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
    <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
      <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
      <div class="support-track" data-osb-component="layout"><strong class="support-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong><span class="support-label" data-osb-component="text">HITS</span></div>
      <div class="primary-track" data-osb-component="layout"><strong class="primary-value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong><span class="primary-label" data-osb-component="text">RUNS</span></div>
      <span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span>
    </div>
    <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
      <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
      <div class="support-track" data-osb-component="layout"><strong class="support-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong><span class="support-label" data-osb-component="text">HITS</span></div>
      <div class="primary-track" data-osb-component="layout"><strong class="primary-value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong><span class="primary-label" data-osb-component="text">RUNS</span></div>
      <span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span>
    </div>
  </div>
  <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</article>
</main>
</body>
</html>
