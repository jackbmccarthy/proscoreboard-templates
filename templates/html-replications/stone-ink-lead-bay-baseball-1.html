<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Stone Ink Lead Bay compact</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#263741}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}

.score{font-size:6.3cqw}.hit-value{font-size:3cqw}

.primary-label{font-size:2cqw}.support-label{font-size:1.9cqw}
.identity{display:block;flex:none;width:2.2%;height:100%;background:#2791ec}
.jerseyColorB{background:#ef6765}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3.4cqw;color:#263741;font-size:7.1cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}

.stats{display:flex;align-items:center;justify-content:flex-end;flex:none;min-width:0}
.stat{display:flex;align-items:baseline;gap:.55cqw;min-width:0;padding:0 1.4cqw;color:#263741;font-size:1.8cqw;font-weight:700;line-height:1;white-space:nowrap}
.stat:first-child,.stat+.stat{border-left:2px solid #b4bfbb}.stat strong{font-variant-numeric:tabular-nums}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%;border-width:1px}.competitor{height:74px}.competitor+.competitor{border-top-width:1px}.score-bay{flex-basis:35%;padding:0 6px}.primary-line,.support-line{gap:2px}.score{font-size:clamp(23px,7vw,33px)}.hit-value{font-size:14px}.primary-label,.support-label{font-size:9px}.identity{width:4px}.name{font-size:clamp(18px,5.5vw,26px);padding:0 9px}.baseline{height:48px;border-top-width:1px;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}.sport-tag{flex:none;padding:0 6px;font-size:11px}.stats{justify-content:space-between}.stat{font-size:9px;gap:2px;padding:0 4px}.stat:first-child{border-left:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
