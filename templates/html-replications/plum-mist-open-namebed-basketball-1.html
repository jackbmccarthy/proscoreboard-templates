<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plum Mist Open Namebed basketball 1</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f9f7f7}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.board{width:min(60vw,1040px);max-width:100%;overflow:hidden;border-radius:3px;background:#403943;font-variant-numeric:tabular-nums}
.header{height:56px;min-width:0;display:flex;align-items:center;gap:24px;padding:0 16px;background:#403943;border-bottom:1px solid #867d89}
.sport-tab{flex:none;display:flex;align-items:center;justify-content:center;min-width:156px;height:40px;margin:0;padding:0 13px;border-radius:3px;background:#e7e5e6;color:#403943;font-size:20px;font-weight:800;letter-spacing:.01em;line-height:1;white-space:nowrap}
.utility{display:flex;align-items:center;gap:16px;min-width:0;white-space:nowrap}
.compact.basketball .utility{margin-left:auto}
.status{display:flex;align-items:baseline;gap:8px;color:#f9f7f7;font-size:15px;line-height:1;font-weight:600}
.status+.status{border-left:1px solid #aba3ad;padding-left:16px}
.status strong{font-size:20px;font-weight:800}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{height:124px;min-width:0;display:flex;align-items:stretch;background:#403943}
.lane+.lane{border-top:1px solid #867d89}
.identity-tick{flex:0 0 10px;margin:10px 0 10px 14px;background:#3186a8}
.side-b .identity-tick{background:#c96b71}
.namebed{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:7px 22px}
.name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f9f7f7;font-size:52px;line-height:1.05;font-weight:700}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support{display:flex;align-items:baseline;gap:12px;min-width:0;color:#f9f7f7;font-size:22px;line-height:1;font-weight:600;white-space:nowrap}
.support-value{font-size:23px;font-weight:800}
.primary-track{flex:0 0 132px;width:132px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 4px 5px;background:#403943;color:#f9f7f7}
.primary-number{display:block;width:100%;min-width:0;text-align:center;white-space:nowrap;font-size:64px;line-height:1;font-weight:800;letter-spacing:-.035em}
.primary-caption{display:block;text-align:center;font-size:18px;line-height:1;font-weight:700;white-space:nowrap}
.horizontal{width:min(88vw,1600px)}
.horizontal .header{height:55px;gap:24px}
.horizontal .lanes{flex-direction:row}
.horizontal .lane{flex:1 1 0;height:142px;border-top:0}
.horizontal .lane+.lane{border-left:1px solid #867d89}
.horizontal .identity-tick{margin-left:15px}
.horizontal .namebed{padding-left:24px;padding-right:8px}
.horizontal .primary-track{flex-basis:138px;width:138px}
.horizontal .primary-track{border-left:1px solid #867d89}
.hidden-match,.point-slot{display:none!important}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:1300px){
.board{width:min(65vw,1040px)}
.horizontal{width:min(94vw,1600px)}
.header{height:44px;gap:14px;padding:0 12px}
.sport-tab{min-width:118px;height:31px;font-size:15px}
.utility{gap:9px}
.status{font-size:11px;gap:5px}
.status+.status{padding-left:9px}
.status strong{font-size:15px}
.lane{height:96px}
.horizontal .lane{height:110px}
.namebed{padding:5px 16px;gap:5px}
.name{font-size:38px}
.support{font-size:16px;gap:8px}
.support-value{font-size:17px}
.primary-track{flex-basis:104px;width:104px}
.primary-number{font-size:48px}
.primary-caption{font-size:13px}
.horizontal .header{height:44px;gap:14px}
.horizontal .namebed{padding-left:16px}
.horizontal .primary-track{flex-basis:108px;width:108px}
}
@media(max-width:600px){
.stage{padding:5px}
.board,.horizontal{width:100%}
.header,.horizontal .header{height:55px;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;padding:3px 7px}
.sport-tab{min-width:75px;height:20px;padding:0 6px;font-size:11px}
.utility{width:100%;gap:8px;margin-left:0!important}
.status{font-size:11px;gap:3px}
.status+.status{padding-left:8px}
.status strong{font-size:13px}
.horizontal .lanes{flex-direction:column}
.lane,.horizontal .lane{height:72px}
.horizontal .lane+.lane{border-left:0;border-top:1px solid #867d89}
.identity-tick,.horizontal .identity-tick{flex-basis:5px;margin:7px 0 7px 7px}
.namebed,.horizontal .namebed{padding:4px 8px;gap:3px}
.name{font-size:23px}
.support{font-size:11px;gap:5px}
.support-value{font-size:13px}
.primary-track,.horizontal .primary-track{flex-basis:68px;width:68px;padding:2px 2px 3px}
.primary-number{font-size:31px}
.primary-caption{font-size:9px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer compact basketball" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="basketball scoreboard">
 <header class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><h1 class="sport-tab" data-osb-component="text">BASKETBALL</h1><div class="utility rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="status" data-osb-component="layout"><span data-osb-component="text">CLOCK</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="game-clock">00:00</strong></span><span class="status" data-osb-component="layout"><span data-osb-component="text">PERIOD</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="period">0</strong></span><span class="status" data-osb-component="layout"><span data-osb-component="text">SHOT</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="shot-clock">00</strong></span></div></header>
 <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><section class="lane side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">

 </div>

 </div>

</section></div>
 <div class="point-slot" data-osb-component="layout" hidden><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
</article></main></body></html>
