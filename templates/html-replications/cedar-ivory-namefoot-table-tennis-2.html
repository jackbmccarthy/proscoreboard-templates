<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Tennis — Cedar Ivory Namefoot Lower Third</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--cedar:#253b37;--ivory:#e8e3d8;--white:#f3f0e8;--muted:#b8c7c0;--rule:#627973;display:flex;flex-direction:column;width:min(82vw,1775px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:3px;background:var(--cedar);color:var(--white);container-type:inline-size}
.sides{display:flex;min-width:0}
.side{display:flex;flex:1 1 50%;min-width:0;min-height:8.1cqw;align-items:stretch}
.side+.side{border-left:1px solid var(--rule)}
.identity-wrap{display:flex;flex:0 0 5%;align-items:center;justify-content:center;padding:1.1cqw 0}
.identity{display:block;flex:0 0 .85cqw;width:.85cqw;height:100%;min-width:5px;background:#2378a9}
.jerseyColorB{background:#ca6060}
.namefoot{display:flex;flex:1 1 auto;min-width:0;flex-direction:column;justify-content:center;gap:.4cqw;padding:0 1.25cqw}
.name-row{display:flex;min-width:0;align-items:center;gap:.5cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:3.35cqw;line-height:1.04;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .42cqw;width:.42cqw;height:.42cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--white)}
.support{display:flex;min-width:0;align-items:baseline;gap:.4cqw;color:var(--muted);line-height:1}
.support-label{font-size:2cqw;font-weight:700;letter-spacing:.02em}.support-score{font-size:2.05cqw;font-weight:700;font-variant-numeric:tabular-nums}
.scorecap{display:flex;flex:0 0 25.5%;width:25.5%;min-width:0;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--rule);background:var(--ivory);color:var(--cedar)}
.score-label{display:block;max-width:100%;overflow:hidden;font-size:1.5cqw;line-height:1;font-weight:700}
.score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:4.9cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.sport-line{position:relative;display:flex;flex:0 0 auto;height:3.6cqw;align-items:center;padding:0 1.3cqw;border-top:1px solid var(--rule);font-size:1.85cqw;line-height:1;font-weight:700;white-space:nowrap}
.point-slot{position:absolute;right:1%;top:0;width:16%;height:100%;font-size:.9cqw;color:var(--white);font-weight:700;text-align:center}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--cedar)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.side{min-height:86px}.identity-wrap{flex-basis:5px;padding:8px 0}.identity{flex-basis:4px;width:4px}.namefoot{gap:3px;padding:0 4px}.name-row{gap:2px}.name{font-size:14px}.serve{flex-basis:5px;width:5px;height:5px;min-width:5px;min-height:5px}.support{gap:2px}.support-label{font-size:9px}.support-score{font-size:10px}.scorecap{flex-basis:31%;width:31%}.score-label{font-size:8px}.score{font-size:30px}.sport-line{height:29px;padding:0 7px;font-size:12px}.point-slot{font-size:7px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sides rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="side rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><div class="namefoot"><div class="name-row"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="support"><span class="support-label">GAMES</span><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div><div class="scorecap"><span class="score-label">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div><div class="side rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><div class="namefoot"><div class="name-row"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="support"><span class="support-label">GAMES</span><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div><div class="scorecap"><span class="score-label">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></div><div class="sport-line"><span>TABLE TENNIS</span><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div></article></main></body></html>
