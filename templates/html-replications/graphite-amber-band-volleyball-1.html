<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphite Amber Band Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #f3f0e9; }
.stage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.board { width: 100%; max-width: 440px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #937c54; border-radius: 4px; background: #252322; }
.heading { display: flex; align-items: stretch; height: 24px; border-bottom: 1px solid #937c54; font-size: 13px; font-weight: 700; line-height: 1; }
.sport-tab { flex: 0 0 24%; display: flex; align-items: center; justify-content: center; padding: 3px 6px; border-radius: 3px; background: #e9b64d; color: #252322; }
.heading-spacer { flex: 1 1 0; }
.sets-heading, .points-heading { display: flex; align-items: center; justify-content: center; text-align: center; }
.sets-heading, .match-score { flex: 0 0 17%; }
.points-heading, .primary-score { flex: 0 0 21%; border-left: 1px solid #937c54; }
.team { display: flex; align-items: stretch; min-height: 48px; }
.team + .team { border-top: 1px solid #937c54; }
.identity { display: flex; align-items: center; flex: 1 1 0; gap: 12px; padding: 8px; }
.tick { display: block; flex: 0 0 3px; width: 3px; height: 27px; background: #e9b64d; }
.name { display: block; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 24px; line-height: 1; font-weight: 700; color: #f3f0e9; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.match-score { display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.primary-score { display: flex; align-items: center; justify-content: center; background: #e9b64d; color: #252322; font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.set-footer { min-height: 26px; display: flex; align-items: center; justify-content: center; gap: 9px; border-top: 1px solid #937c54; background: #fefaf0; color: #252322; font-size: 16px; font-weight: 700; line-height: 1; }
.set-value { display: block; width: 22px; font-size: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 600px) { .stage { padding: 14px; } .sport-tab { font-size: 11px; } }
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="heading rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tab">VOLLEYBALL</span><span class="heading-spacer"></span><span class="sets-heading">SETS</span><span class="points-heading">POINTS</span></header>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
