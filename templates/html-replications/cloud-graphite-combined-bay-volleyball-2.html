<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Cloud Graphite Combined Bay 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(96vw,1494px);max-width:100%;aspect-ratio:5.37;overflow:hidden;border:2px solid #aebbb8;border-radius:9px;background:#e8edeb;color:#293b44;container-type:inline-size}
.head{display:flex;align-items:center;justify-content:space-between;flex:0 0 24.5%;min-width:0;padding:0 35px;border-bottom:2px solid #aebbb8}
.sport-tag,.set-status{display:block;overflow:hidden;font-size:clamp(21px,2.7cqw,41px);font-weight:800;line-height:1;text-overflow:ellipsis;white-space:nowrap}
.set-status{display:flex;align-items:center;gap:.35em}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.pair{display:flex;flex:1 1 0;min-width:0;min-height:0}
.side{display:flex;align-items:stretch;flex:1 1 0;min-width:0}
.side+.side{border-left:3px solid #aebbb8}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;align-self:stretch;flex:0 0 19px;margin:20px 0 20px 20px;background:#368ff0}
.jerseyColorB{background:#f16661}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;padding:0 27px;color:#1b2e3a;font-size:clamp(29px,5.1cqw,81px);font-weight:750;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.bay{display:flex;align-items:stretch;flex:0 0 26.8%;min-width:0;flex-direction:column;padding:13px 21px 8px;background:#293b44;color:#fff;font-variant-numeric:tabular-nums}
.sets{display:flex;align-items:center;justify-content:center;flex:0 0 41%;min-height:0;flex-direction:column;gap:2px;border-bottom:2px solid #8ca3a7;white-space:nowrap}
.sets-label,.points-label{display:block;max-width:100%;overflow:hidden;font-size:clamp(15px,1.55cqw,25px);font-weight:700;line-height:1}
.set-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(22px,2.3cqw,38px);font-weight:800;line-height:1;text-align:center}
.points{display:flex;align-items:center;justify-content:center;flex:1 1 0;min-height:0;flex-direction:column;gap:1px}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(49px,5.2cqw,83px);font-weight:800;line-height:1;text-align:center;white-space:nowrap}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){
 .stage{padding:6px}
 .board{width:100%;height:160px;aspect-ratio:auto;border-width:1px;border-radius:4px}
 .head{flex-basis:20%;padding:0 8px;border-width:1px}
 .sport-tag,.set-status{font-size:clamp(11px,3.2cqw,16px)}
 .side+.side{border-width:1px}
 .identity{flex-basis:5px;margin:16px 0 16px 5px}
 .name{padding:0 5px;font-size:clamp(15px,4.6cqw,21px)}
 .bay{flex-basis:30%;padding:5px 4px 4px}
 .sets{border-width:1px}
 .sets-label,.points-label{font-size:clamp(8px,2.4cqw,11px)}
 .set-score{font-size:clamp(15px,4.5cqw,21px)}
 .score{font-size:clamp(24px,7.2cqw,34px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Horizontal volleyball scoreboard with generic manual scoring">
  <div class="head rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
  <div class="pair rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <div class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="bay columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sets" data-osb-component="layout"><span class="sets-label" data-osb-component="text">SETS</span><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="points" data-osb-component="layout"><span class="points-label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div></div>
   <div class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="bay columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sets" data-osb-component="layout"><span class="sets-label" data-osb-component="text">SETS</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="points" data-osb-component="layout"><span class="points-label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
