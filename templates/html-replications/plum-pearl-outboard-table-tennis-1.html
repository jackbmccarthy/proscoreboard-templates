<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Tennis — Plum Pearl Outboard Compact</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{position:relative;width:min(59vw,1160px);min-width:0;container-type:inline-size}
.surface{overflow:hidden;border:2px solid #8f8792;border-radius:4px;background:#302b38}
.header{height:5.7cqw;min-height:32px;display:flex;align-items:center;gap:1cqw;padding:0 2.1cqw;background:#ece7e9;color:#272331;border-bottom:2px solid #8f8792}
.sport{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:3.1cqw;line-height:1;font-weight:700;letter-spacing:.01em}
.header-games{flex:0 0 11cqw;text-align:center;white-space:nowrap;font-size:2.1cqw;font-weight:700}
.row{height:12.8cqw;min-height:64px;display:flex;align-items:center;min-width:0;background:#302b38;color:#faf8f7}
.row+.row{border-top:2px solid #8f8792}
.point-track{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 19cqw;height:100%;min-width:0;background:#ece7e9;color:#272331}
.point-label{position:absolute;top:.8cqw;left:0;right:0;text-align:center;color:#272331;font-size:2cqw;line-height:1;font-weight:700}
.score{display:block;width:100%;text-align:center;white-space:nowrap;font-size:8cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.identity{display:block;flex:0 0 3.7cqw;width:3.7cqw;height:100%;background:#836a87}
.jerseyColorB{background:#9c807f}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0;gap:1cqw;padding:0 3.8cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.6cqw;line-height:1.1;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .8cqw;width:.8cqw;height:.8cqw;border-radius:50%;background:#ece7e9}
.match-score{display:block;flex:0 0 13.5cqw;width:13.5cqw;text-align:center;font-size:5.3cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.point-slot{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:170px;height:18px;text-align:center;color:#faf8f7;font-size:11px;font-weight:700}
.point-state{position:absolute;inset:0;display:block;background:#302b38;border-top:2px solid #ece7e9}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.header{height:37px;padding:0 10px}.sport{font-size:14px}.header-games{flex-basis:47px;font-size:10px}.row{height:75px}.point-track{flex-basis:60px}.point-label{top:5px;font-size:9px}.score{font-size:38px}.identity{flex-basis:6px;width:6px}.name-lane{padding:0 9px;gap:5px}.name{font-size:20px}.serve{flex-basis:6px;width:6px;height:6px}.match-score{flex-basis:36px;width:36px;font-size:24px}.point-slot{height:16px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="surface columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><header class="header"><span class="sport">TABLE TENNIS</span><span class="header-games">GAMES</span></header>
<div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="point-track"><span class="point-label">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="point-track"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
<div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body></html>
