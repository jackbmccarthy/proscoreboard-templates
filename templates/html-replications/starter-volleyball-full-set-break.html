<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volleyball Set Break</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing{animation:none!important;transition:none!important}}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere;line-height:1;text-wrap:balance}

.sslot{align-items:center}.sslot>.st{display:flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap;height:100%}
.pslot>.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hist:not(:has(>[style*="opacity: 1"])){display:none}
.board:has(.isComplete[style*="opacity: 1"]) .srv[style*="opacity: 1"]{opacity:.3!important;filter:grayscale(1)}
.pip{position:relative;display:block}.pip>.lit{position:absolute;inset:0;border-radius:inherit}

.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1f4f9a 0,#0b1d3a 55%,#060f20 100%)}
.board{position:relative;width:104rem;font-family:"DIN Condensed","Bahnschrift SemiBold Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;color:#fff}
.head{display:flex;flex-direction:column;align-items:center;gap:1.2rem;margin-bottom:3.4rem}
.ctx{display:flex;align-items:center;gap:1rem;font-size:2.6rem;letter-spacing:.16em;text-transform:uppercase;color:#b9cdf0}.ctx .sep{font-style:normal;color:#ffc629}
.hrow{display:flex;align-items:stretch;height:6.4rem}
.live{display:flex;align-items:center;gap:1.2rem;padding:.6rem 2.6rem 0;background:#ffffff14;border:.2rem solid #ffffff26;border-left:0;font-size:4rem}.live .ll{font-weight:400;font-size:2.6rem;letter-spacing:.12em;color:#b9cdf0}.live .lv{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-weight:700}.live .ld{font-style:normal;color:#8fa6cf}
.sslot{min-width:30rem;height:6.4rem}
.hrow{position:relative}.hrow .pslot{position:absolute;left:100%;top:0;bottom:0;margin-left:1.2rem}.hrow .pt{padding:.6rem 2.4rem 0;font-size:3.4rem;letter-spacing:.1em;background:#ffc629;color:#0b1d3a}.hrow .pt.mp{background:#e8202a;color:#fff}.sslot>.st{padding:.6rem 3rem 0;font-size:4rem;letter-spacing:.12em;background:#ffc629;color:#0b1d3a}.sslot>.sdec{background:#ff6b1a;color:#fff}.sslot>.sbrk{background:#fff;color:#0b1d3a}.sslot>.sfin{background:#e8202a;color:#fff}
.table{background:#0b1d3acc;border:.2rem solid #ffffff1f;box-shadow:0 1.4rem 3rem #0009}
.fhead,.frow{display:flex;align-items:stretch}
.fhead{height:4rem;background:#ffffff10;color:#8fa6cf;font-size:2rem;letter-spacing:.14em}
.fh{display:flex;align-items:center;justify-content:center;padding-top:.4rem}.fh.lead{flex:1}
.fc{width:11rem;flex:none;display:flex;align-items:center;justify-content:center}.fsets{width:14rem;flex:none}
.frow{height:11rem;border-top:.2rem solid #ffffff14}
.chip{width:1.6rem;flex:none}
.fname{flex:1;min-width:0;display:flex;align-items:center;padding:0 2.4rem}
.nm{font-size:5rem;font-weight:700;text-transform:uppercase;padding-top:.6rem}
.frow .fc{padding-top:.6rem;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4.6rem;font-weight:700;color:#d6e2f7;border-left:.15rem solid #ffffff12}
.sets{width:14rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.8rem;background:#ffc629;color:#0b1d3a;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:8rem;font-weight:700}
.rB .sets{border-top:.2rem solid #0b1d3a33}
</style>
</head>
<body>
<main class="stage"><section class="board" data-osb-component="layout" data-osb-component-type="osb-column-container">
<header class="head" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="ctx"><span class="eventName" data-osb-component="field" data-osb-field="eventName"></span><i class="sep">&middot;</i><span class="matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><div class="hrow" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="slot sslot"><span class="st sset">SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sdec isDecidingSet" data-osb-component="field" data-osb-field="isDecidingSet" style="opacity:0">DECIDING SET</span><span class="st sbrk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">END OF SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sfin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">FINAL</span></span><span class="live"><b class="ll">SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></b><span class="lv num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><i class="ld">&ndash;</i><span class="lv num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span><span class="slot pslot"><span class="pt gp isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">SET POINT</span><span class="pt mp isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span></div></header>
<div class="table" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="fhead" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="fh lead"></span><span class="fh fc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0">SET 1</span><span class="fh fc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0">SET 2</span><span class="fh fc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0">SET 3</span><span class="fh fc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0">SET 4</span><span class="fh fc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0">SET 5</span><span class="fh fsets">SETS</span></div><div class="frow rA" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="fname"><span class="nm clamp2 combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></span><span class="fc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><span class="num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span><span class="fc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><span class="num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span><span class="fc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><span class="num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span><span class="fc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><span class="num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span><span class="fc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><span class="num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span><span class="sets num setsWonA currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="frow rB" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="fname"><span class="nm clamp2 combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></span><span class="fc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><span class="num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="fc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><span class="num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="fc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><span class="num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="fc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><span class="num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="fc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><span class="num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span><span class="sets num setsWonB currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div></section></main>
</body>
</html>
