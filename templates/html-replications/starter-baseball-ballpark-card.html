<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Ballpark Ballpark Card</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.bb-retained{display:none}
.bb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.8)}
.diamond>.base{position:absolute;width:30%;height:37.5%;transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.06rem)}
.diamond>.base.second{left:35%;top:10%}.diamond>.base.third{left:8%;top:44%}.diamond>.base.first{left:62%;top:44%}
.diamond::before{content:"";position:absolute;left:calc(var(--d,3rem)*.309);top:calc(var(--d,3rem)*.311);width:calc(var(--d,3rem)*.382);height:calc(var(--d,3rem)*.382);transform:rotate(45deg);border:1px solid var(--base-edge,currentColor);opacity:.28}
.bb-plate{display:none}
.bb-bases{position:absolute;left:0;right:0;bottom:-.1rem;text-align:center;font:700 .42rem/1 var(--mono-ui,Menlo,Consolas,monospace);letter-spacing:.04em;color:var(--base-text,currentColor);opacity:.85}
.bb-half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.bb-half-dim{position:absolute;inset:0}
.bb-half-dim::before,.bb-half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.28))}
.bb-half-dim::before,.bb-half-dim::after{position:absolute;left:0;width:100%;height:100%}
.bb-half-dim::before,.inningHalf::after{clip-path:polygon(50% 4%,96% 40%,4% 40%)}
.bb-half-dim::after,.inningHalf::before{clip-path:polygon(4% 60%,96% 60%,50% 96%)}
.bb-half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.bb-ls-col>.bb-gate{display:flex;flex-direction:column;align-items:stretch}
.bb-tick{position:relative}.bb-tick>.bb-gate{display:block;position:absolute;inset:0;border-radius:inherit;background:var(--tick-on,#fff)}
.bb-ls-extra{display:none!important}.bb-ls-extra:has(>.bb-gate[style*="opacity: 1"]),.bb-ls-extra:has(>.bb-gate[style*="opacity:1"]){display:flex!important}
.bb-live,.bb-break,.bb-final{transition:opacity .25s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.bb-stage{position:fixed;left:2rem;top:1.6rem;color:#1d2a44;font-family:Rockwell,"Roboto Slab","Rockwell Nova",Georgia,serif}
.ic{width:17rem;border:.14rem solid #1d2a44;border-radius:.35rem;overflow:hidden;background:#f4ecd8;box-shadow:0 .3rem .9rem rgba(0,0,0,.28)}
.ic-head{display:grid;grid-template-columns:1fr 2.4rem 1.6rem 1.6rem;align-items:center;height:1.15rem;padding-left:.55rem;background:#1d2a44;color:#f4ecd8;font:700 .55rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.1em;text-transform:uppercase}
.ic-head>span{text-align:center}.ic-head>.ic-ev{text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;gap:.3rem}
.ic-ev .bb-round:not(:empty)::before{content:"/ ";opacity:.6}
.ic-row{display:grid;grid-template-columns:.35rem 1fr 2.4rem 1.6rem 1.6rem;align-items:center;height:2.05rem;border-bottom:1px solid rgba(29,42,68,.18)}
.ic-row .bb-jersey{align-self:stretch;background:#b3202e}
.ic-row .bb-name{padding:0 .5rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:1.02rem;font-weight:700}
.ic-row .bb-runs{align-self:stretch;display:flex;align-items:center;justify-content:center;background:#b3202e;color:#f4ecd8;font:700 1.35rem/1 Rockwell,"Roboto Slab","Rockwell Nova",Georgia,serif;font-variant-numeric:tabular-nums}
.ic-row .bb-h,.ic-row .bb-e{text-align:center;font:700 .85rem/1 Rockwell,"Roboto Slab","Rockwell Nova",Georgia,serif;color:#6d6a5f;font-variant-numeric:tabular-nums}
.ic-sit{position:relative;display:flex;align-items:center;justify-content:space-between;height:2.6rem;padding:0 .7rem;background:#e9dec2}
.bb-inning{display:flex;align-items:center;gap:.25rem;font:700 1.15rem/1 Rockwell,"Roboto Slab","Rockwell Nova",Georgia,serif;--half-on:#b3202e;--half-off:rgba(29,42,68,.22);--half-h:1.1rem;--half-size:.48rem}
.ic-sit .diamond{--d:2.75rem;--base-edge:#1d2a44;--base-off:#f4ecd8;--base-line:.1rem;--base-text:#1d2a44}
.ic-count{display:flex;flex-direction:column;align-items:center;gap:.12rem}
.ic-count .bb-count{font:700 1.05rem/1 Rockwell,"Roboto Slab","Rockwell Nova",Georgia,serif;font-variant-numeric:tabular-nums}
.ic-cap{font:700 .42rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.14em;color:#6d6a5f}
.bb-outs{display:flex;align-items:baseline;gap:.2rem;font:700 1.05rem/1 Rockwell,"Roboto Slab","Rockwell Nova",Georgia,serif}.bb-outs-label{font:700 .5rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.12em;color:#6d6a5f}
.ic-foot{display:flex;align-items:center;justify-content:space-between;height:.9rem;padding:0 .7rem;background:#e9dec2;border-top:1px dashed rgba(29,42,68,.18);font:700 .45rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.14em;color:#6d6a5f}
.ic-foot .bb-track{display:flex;gap:.16rem}
.bb-tick{width:.42rem;height:.42rem;border-radius:50%;border:1px solid rgba(29,42,68,.22);--tick-on:#b3202e}
.bb-live{color:#b3202e}
.bb-break{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1d2a44;color:#f4ecd8;font:700 .75rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.16em}
</style></head><body><main class="bb-stage" aria-label="Baseball corner scoreboard">
<article class="ic columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Baseball score card">
<div class="ic-head"><span class="ic-ev"><span class="bb-event eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="bb-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span>R</span><span>H</span><span>E</span></div>
<div class="ic-row"><span class="bb-jersey jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="bb-name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="bb-runs currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="bb-h hitsA" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span><span class="bb-e errorsA" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsA">0</span></div>
<div class="ic-row"><span class="bb-jersey jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="bb-name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="bb-runs currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="bb-h hitsB" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span><span class="bb-e errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></div>
<div class="ic-sit"><span class="bb-inning"><span class="bb-half"><span class="bb-half-dim" aria-hidden="true"></span><span class="bb-half-win"><span class="inningHalf" data-osb-component="field"></span></span></span><span class="bb-inning-no inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="diamond" aria-label="Bases"><span class="base second"></span><span class="base third"></span><span class="base first"></span><span class="bb-plate" aria-hidden="true"></span><span class="bb-bases bases" data-osb-component="field"></span></span><span class="ic-count"><span class="bb-count"><span class="bb-b balls" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span><span class="bb-dash" aria-hidden="true">-</span><span class="bb-s strikes" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span><span class="ic-cap">COUNT</span></span><span class="bb-outs"><span class="bb-o outs" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span><span class="bb-outs-label">OUT</span></span><span class="bb-break isInBetweenGames" data-osb-component="field" style="opacity: 0">INNING BREAK</span></div>
<div class="ic-foot"><span>BASEBALL</span><span class="bb-track" aria-label="Innings"><span class="bb-tick"><span class="bb-gate isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame9Started" data-osb-component="field" data-osb-field="isGame9Started" style="opacity: 0"></span></span></span><span class="bb-live isMatchStarted" data-osb-component="field" style="opacity: 0">LIVE</span></div>
</article>
<span class="bb-sr battingSide" data-osb-component="field"></span><span class="bb-retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="bb-retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main></body></html>
