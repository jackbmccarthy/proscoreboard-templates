<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Indigo Open Data Lane compact</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:"Arial Narrow",Arial,Helvetica,sans-serif;color:#f0f2ed}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(62vw,1200px);max-width:100%;min-width:0;overflow:hidden;border:2px solid #7eaaae;background:#1b2d3b;container-type:inline-size}
.meta{display:flex;align-items:center;justify-content:space-between;gap:2cqw;flex:none;height:5.7cqw;padding:0 2.5cqw;border-bottom:1px solid #7eaaae;background:#1b2d3b}
.sport-tag{display:block;flex:none;color:#f0f2ed;font-size:2.5cqw;font-weight:800;letter-spacing:.045em;line-height:1;white-space:nowrap}
.stats{display:flex;align-items:center;justify-content:flex-end;gap:2.5cqw;flex:1 1 auto;min-width:0}
.stat{display:flex;align-items:baseline;gap:.55cqw;min-width:0;color:#a8d3d6;font-size:1.75cqw;font-weight:700;white-space:nowrap}
.stat strong{color:#f0f2ed;font-size:1.85cqw;font-variant-numeric:tabular-nums}
.competitors{display:flex;flex-direction:column;min-width:0}
.competitor{display:flex;align-items:stretch;min-width:0;height:10.9cqw;background:#1b2d3b}
.competitor+.competitor{border-top:1px solid #7eaaae}
.identity{display:block;align-self:center;flex:0 0 1.5%;height:78%;margin-left:1.2%;background:#ff244a}
.jerseyColorB{background:#13a9e4}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3.5cqw;color:#f0f2ed;font-size:5.4cqw;font-weight:700;letter-spacing:.025em;line-height:1.08;text-transform:uppercase}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.score-track{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 22%;min-width:0;border-left:2px solid #8eb8b9;background:#1b2d3b}
.score-label{display:block;height:2.5cqw;color:#a8d3d6;font-size:1.9cqw;font-weight:700;line-height:1;white-space:nowrap}
.score-label.blank{visibility:hidden}
.score{display:block;max-width:100%;overflow:hidden;color:#f0f2ed;font-size:7.8cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%;border-width:1px}.meta{height:48px;padding:0 7px;gap:3px;flex-direction:column;align-items:stretch;justify-content:center}.sport-tag{font-size:10px}.stats{flex:none;justify-content:space-between;gap:2px}.stat{font-size:9px;gap:2px}.stat strong{font-size:10px}.competitor{height:70px}.name{font-size:clamp(20px,6vw,31px);padding:0 10px}.score-track{border-left-width:1px}.score-label{height:17px;font-size:10px}.score{font-size:clamp(29px,9vw,40px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Softball scoreboard">
<div class="meta rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">SOFTBALL</span><div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static softball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="competitors columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score-label" data-osb-component="text">RUNS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score-label" data-osb-component="text">RUNS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
</div><div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div></article></main></body></html>
