<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evergreen Sand PICKLEBALL 1</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{font-family:Arial,Helvetica,sans-serif;font-weight:700;color:#174b40}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}.board{width:min(var(--view-width),var(--max-width),var(--height-width));position:relative;container-type:inline-size;background:transparent;padding-bottom:20px}.desk{width:100%;min-width:0;background:#f4f0e8;border:1px solid #c7c2b7;border-bottom:2px solid #e8decc;border-radius:6px;overflow:hidden}.header{background:#174b40;color:#fff;min-width:0}.sport-caption{white-space:nowrap;line-height:1.1}.row,.lane,.name-cell,.name-wrap{min-width:0}.name-cell{display:flex;align-items:center;flex:1 1 0}.name-wrap{display:flex;align-items:center;flex:1 1 0;gap:5px;min-width:0}.name{display:block;flex:1 1 0;min-width:0;max-width:100%;font-size:var(--name-font);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.combinedAName:empty:before{content:"Player A"}.combinedBName:empty:before{content:"Player B"}.identity{display:block;flex-shrink:0;background:#174b40}.serve{display:block;flex:0 0 12px;width:12px;height:12px;font-size:8px;line-height:12px;text-align:center}.score,.match-score{display:block;width:100%;font-size:var(--score-font);line-height:1.1;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}.match-score{font-size:var(--match-font)}.label{font-size:var(--label-font);line-height:1.1;text-align:center;white-space:nowrap}.point-cell{background:#174b40;color:#fff}.point-slot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:200px;max-width:90%;height:16px;font-size:12px;text-align:center}.point{position:absolute;inset:0;background:#e8decc;color:#174b40}.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint{opacity:0!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.board{--view-width:70.5vw;--max-width:1450px;--height-width:250vh;--name-font:4.7cqw;--score-font:5.9cqw;--match-font:5.25cqw;--label-font:3.25cqw;--games-width:18%;--points-width:19.5%}.header{display:flex;align-items:center;min-height:6.2cqw;border-bottom:1px solid #c7c2b7}.title-lane{flex:1;min-width:0;padding:0 2.8cqw}.sport-caption{font-size:4.2cqw}.header .games,.game-cell{flex:0 0 var(--games-width)}.header .points,.point-cell{flex:0 0 var(--points-width)}.header>.label{display:flex;align-items:center;justify-content:center}.header .points{border-left:1px solid #c7c2b7}.row{display:flex;align-items:stretch;min-height:8.7cqw}.row+.row{border-top:1px solid #c7c2b7}.name-cell{gap:3cqw;padding:1cqw 2cqw}.identity{width:1.2cqw;height:6cqw}.game-cell,.point-cell{display:flex;align-items:center;justify-content:center;border-left:1px solid #c7c2b7}@media(max-width:600px){.board{--view-width:94vw}.sport-caption{font-size:3.9cqw}.name{font-size:5.7cqw}.label{font-size:2.8cqw}}
</style></head>
<body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="desk columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><header class="header"><div class="title-lane"><div class="sport-caption">PICKLEBALL</div></div><div class="label games">GAMES</div><div class="label points">POINTS</div></header><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-cell"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-wrap"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true">●</span></div></div><div class="game-cell"><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="point-cell"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-cell"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-wrap"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;">●</span></div></div><div class="game-cell"><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="point-cell"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></div><div class="point-slot"><span class="point isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body>
</html>
