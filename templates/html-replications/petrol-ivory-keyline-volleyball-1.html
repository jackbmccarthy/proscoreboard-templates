<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petrol Ivory Keyline Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #fff; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px; }
.group { width: min(100%, 780px); display: flex; flex-direction: column; gap: 15px; }
.board { width: 100%; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #b7c6c4; border-top: 3px solid #bd8d5a; border-radius: 6px; background: #203b45; }
.header { min-height: 54px; display: flex; align-items: stretch; border-bottom: 1px solid #b7c6c4; font-size: 18px; font-weight: 700; letter-spacing: .015em; }
.sport { display: flex; align-items: center; flex: 1 1 0; padding: 0 18px; font-size: 27px; }
.sets-head, .points-head { display: flex; align-items: center; justify-content: center; text-align: center; }
.sets-head, .sets-score { flex: 0 0 15%; border-left: 1px solid #b7c6c4; }
.points-head, .points-score { flex: 0 0 23%; border-left: 1px solid #b7c6c4; }
.team { min-height: 99px; display: flex; align-items: stretch; }
.team + .team { border-top: 1px solid #b7c6c4; }
.identity { flex: 1 1 0; display: flex; align-items: center; gap: 27px; padding-right: 13px; }
.tick { flex: 0 0 17px; width: 17px; align-self: stretch; background: #bd8d5a; }
.jerseyColorB { background: #5e9a9d; }
.name { flex: 1 1 0; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; font-size: 46px; font-weight: 700; line-height: 1.05; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.sets-score { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 41px; font-weight: 700; font-variant-numeric: tabular-nums; }
.points-score { display: flex; align-items: center; justify-content: center; background: #f3f1e9; color: #152c33; font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.set-dock { min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 14px; border: 1px solid #b7c6c4; border-radius: 6px; background: #dbe2de; color: #152c33; font-size: 29px; font-weight: 700; line-height: 1; }
.set-value { display: block; min-width: 1.4ch; text-align: center; font-size: 37px; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 600px) {
  .stage { padding: 12px; }
  .group { gap: 8px; }
  .header { min-height: 38px; font-size: 12px; }
  .sport { padding: 0 9px; font-size: 16px; }
  .team { min-height: 63px; }
  .identity { gap: 10px; padding-right: 5px; }
  .tick { flex-basis: 7px; width: 7px; }
  .name { font-size: clamp(19px, 5.7vw, 27px); }
  .sets-score { font-size: 23px; }
  .points-score { font-size: 35px; }
  .set-dock { min-height: 38px; font-size: 19px; }
  .set-value { font-size: 24px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <div class="group columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
      <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
        <header class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport">VOLLEYBALL</span><span class="sets-head">SETS</span><span class="points-head">POINTS</span></header>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><span class="sets-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="points-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><span class="sets-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="points-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
      </article>
      <div class="set-dock rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span>SET</span><span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></div>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </div>
  </main>
</body>
</html>
