<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Champagne Graphite Columnrail Volleyball — Balanced Lanes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { font-family: Arial, Helvetica, sans-serif; color: #f7f5f0; }
    .stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .board { width: min(100%, 1600px); background: #2b3036; }
    .header { height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 28px; background: #d8c9ae; color: #2b3036; font-weight: 700; text-transform: uppercase; }
    .sport { font-size: 32px; line-height: 1; letter-spacing: .015em; }
    .status { font-size: 28px; white-space: nowrap; }
    .set-number { font-variant-numeric: tabular-nums; }
    .lanes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lane { min-height: 148px; display: grid; grid-template-columns: 24px minmax(0, 1fr) minmax(92px, 19%) minmax(124px, 25%); align-items: stretch; }
    .tick { min-width: 0; }
    .tick-a { background: #2b8aa8; }
    .tick-b { background: #d06461; }
    .name { min-width: 0; display: block; align-self: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 34px; font-size: clamp(25px, 4vw, 64px); font-weight: 700; line-height: 1.1; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .stat { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px solid #67737b; font-variant-numeric: tabular-nums; }
    .value { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: .95; font-weight: 700; }
    .sets .value { font-size: clamp(30px, 3.8vw, 56px); }
    .points .value { font-size: clamp(44px, 5.5vw, 82px); }
    .caption { margin-top: 9px; color: #c9c0b0; font-size: 16px; font-weight: 700; line-height: 1; text-transform: uppercase; }
    .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    @media (max-width: 800px) {
      .stage { padding: 12px; }
      .header { height: 44px; padding: 0 14px; }
      .sport { font-size: clamp(16px, 5vw, 24px); }
      .status { font-size: 16px; }
      .lanes { grid-template-columns: 1fr; }
      .lane { min-height: 78px; grid-template-columns: 8px minmax(0, 1fr) 57px 69px; }
      .lane + .lane { border-top: 1px solid #67737b; }
      .name { padding: 0 9px; font-size: clamp(15px, 5vw, 21px); }
      .sets .value { font-size: 25px; }
      .points .value { font-size: 38px; }
      .caption { margin-top: 6px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport sport-tag">VOLLEYBALL</span><span class="status">SET <span class="set-number" data-osb-static="true" data-sport-stat="set">0</span></span></header>
      <div class="lanes rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick tick-a jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="stat sets support"><span class="value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="caption">SETS</span></span><span class="stat points primary"><span class="value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="caption">POINTS</span></span></div>
        <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick tick-b jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="stat sets support"><span class="value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="caption">SETS</span></span><span class="stat points primary"><span class="value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="caption">POINTS</span></span></div>
      </div>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
