<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Ballpark Card</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.osb-core-fields{display:none!important}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.nm{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;text-wrap:balance}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.72)}
.diamond>.base{position:absolute;width:calc(var(--d,3rem)*.3);height:calc(var(--d,3rem)*.3);transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.08rem);overflow:hidden}
.diamond>.base.second{left:35%;top:calc(var(--d,3rem)*.082)}.diamond>.base.third{left:10%;top:calc(var(--d,3rem)*.332)}.diamond>.base.first{left:60%;top:calc(var(--d,3rem)*.332)}
.diamond .runner{position:absolute;inset:0;background:var(--base-on,#f5cf52)}
.dots{display:flex;gap:var(--dot-gap,.22rem)}
.dot{position:relative;flex:none;width:var(--dot,.62rem);height:var(--dot,.62rem);border-radius:50%;background:var(--dot-off,rgba(255,255,255,.18));box-shadow:inset 0 0 0 .08rem var(--dot-edge,transparent)}
.dot>.lit{position:absolute;inset:0;border-radius:50%;background:var(--dot-on,#f5cf52)}
.half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.half-dim{position:absolute;inset:0}
.half-dim::before,.half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.25))}
.half-dim::before,.half-dim::after{position:absolute;left:0;width:100%;height:100%}
.half-dim::before,.inningHalf::after{clip-path:polygon(50% 6%,94% 42%,6% 42%)}
.half-dim::after,.inningHalf::before{clip-path:polygon(6% 58%,94% 58%,50% 94%)}
.half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.ev-e:empty,.ev-r:empty{display:none}.ev-e:not(:empty)+.ev-r:not(:empty)::before{content:"\00b7";margin:0 .4em;opacity:.7}
.st{position:relative;display:inline-grid;align-items:center;justify-items:end}
.st>*{grid-area:1/1}
.st-pre{opacity:0}.st:has(>.isMatchStarted[style*="opacity: 0"])>.st-pre{opacity:1}
.st-live-in{display:inline-flex;align-items:center;gap:.3em}.st-live-in>i{width:max(.5em,12px);height:max(.5em,12px);border-radius:50%;background:currentColor;animation:osb-pulse 1.6s ease-in-out infinite}
@keyframes osb-pulse{50%{opacity:.35}}
.board:has(.isComplete[style*="opacity: 1"]) .st-live-in{visibility:hidden}
.ls{display:flex}
.ls-extra{display:none!important}.ls-extra:has(>.ls-gate[style*="opacity: 1"]){display:flex!important}
.tick{position:relative}.tick>.tick-on{position:absolute;inset:0;border-radius:inherit;background:var(--tick-on,#fff)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.board{position:fixed;left:2rem;top:1.6rem;color:#14324a}
.card{width:24rem;border-radius:.45rem;overflow:hidden;background:#fbfaf3;box-shadow:0 .35rem 1rem rgba(0,0,0,.35)}
.hdr{display:grid;grid-template-columns:1fr 3rem 1.9rem 1.9rem;align-items:center;height:1.55rem;padding-right:.5rem;background:#0f6a73;color:#fbfaf3;font:700 .8rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.hdr .ev{padding-left:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hdr>span:not(.ev){text-align:center}
.row{display:grid;grid-template-columns:.6rem 1fr 1.1rem 3rem 1.9rem 1.9rem;align-items:center;height:2.75rem;padding-right:.5rem}
.row+.row{border-top:.06rem solid rgba(20,50,74,.15)}
.chip{align-self:stretch;position:relative}
.home{position:absolute;left:.9rem;top:50%;width:.5rem;height:.52rem;transform:translateY(-50%);background:#e8590c;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.nmw{min-width:0;padding:0 .3rem 0 1.7rem}
.nm{font:700 1.18rem/1.02 Rockwell,"Roboto Slab","Roboto Serif",Georgia,serif;letter-spacing:0}
.batw{display:flex;justify-content:center}.bat{width:.6rem;height:.6rem;border-radius:50%;background:#fff;box-shadow:0 0 0 .1rem #e8590c;background-image:radial-gradient(circle at 0 50%,transparent 45%,#e8590c 46% 52%,transparent 53%),radial-gradient(circle at 100% 50%,transparent 45%,#e8590c 46% 52%,transparent 53%)}
.runs{display:flex;align-items:center;justify-content:center;align-self:stretch;background:#0f6a73;color:#fff;font:700 1.9rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums}
.he{text-align:center;font:700 1.1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;color:#55687a;font-variant-numeric:tabular-nums}
.bay{position:relative;display:grid;grid-template-columns:auto auto auto 1fr;align-items:center;column-gap:.9rem;height:4.1rem;padding:0 .9rem;background:#eef2e4;border-top:.12rem solid #0f6a73}
.inn{display:flex;align-items:center;gap:.15rem;font:700 1.75rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;--half-on:#e8590c;--half-off:rgba(20,50,74,.2);--half-h:1.75rem;--half-size:.74rem}
.bay .diamond{--d:3.8rem;--base-edge:#14324a;--base-off:transparent;--base-on:#e8590c;--base-line:.12rem}
.count{font:700 1.6rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums}.count .dash{opacity:.5;margin:0 .05em}
.bso{display:grid;grid-template-columns:auto auto;align-items:center;justify-self:end;column-gap:.45rem;row-gap:.22rem;font:700 .9rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.06em;color:#55687a;--dot:.72rem;--dot-gap:.24rem;--dot-off:rgba(20,50,74,.16);--dot-edge:transparent}
.ball-dots{--dot-on:#2f8a4c}.strike-dots{--dot-on:#d6336c}.out-dots{--dot-on:#14324a}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;background:#eef2e4;text-transform:uppercase;text-align:center;z-index:2}
.cover b{font:700 .78rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.16em;color:#55687a}
.cover .periodLabel{font:700 1.5rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.04em}
.cover.fin{font:700 1.7249999999999999rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.1em;color:#e8590c}
.cover{flex-direction:row;gap:.7rem;color:#14324a}
.foot{display:flex;align-items:center;justify-content:space-between;height:1.35rem;padding:0 .8rem;background:#0f6a73;color:#fbfaf3;font:700 .76rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.ticks{display:flex;gap:.22rem}.tick{width:.85rem;height:.3rem;border-radius:.15rem;background:rgba(251,250,243,.28);--tick-on:#fbfaf3}
.st2{position:relative;display:inline-grid;align-items:center}.st2>*{grid-area:1/1}.st2 .st-pre{opacity:0}.st2:has(>.isMatchStarted[style*="opacity: 0"])>.st-pre{opacity:1}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.ev-e.eventName,.ev-r.matchRound::before,.ev-r.matchRound,.hdr>span,.bso>span,.cover.isInBetweenGames>b,.st-live-in,.st-pre{font-size:1.25vw!important}
.home.isAHome,.home.isBHome,.st-live-in>i{width:0.938vw!important;height:0.938vw!important;min-width:0!important;flex-shrink:0!important}
.bat.isABatting,.bat.isBBatting,.dot,.lit.isBall1,.lit.isBall2,.lit.isBall3,.lit.isStrike1,.lit.isStrike2,.lit.isOut1,.lit.isOut2{width:1.016vw!important;height:1.016vw!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

</style></head><body><main class="board" aria-label="Softball corner scoreboard">
<article class="card columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="softball score card">
<div class="hdr"><span class="ev"><span class="ev-e eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span>R</span><span>H</span><span>E</span></div>
<div class="row"><span class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"><span class="home isAHome" data-osb-component="field" data-osb-field="isAHome" style="opacity: 0"></span></span><span class="nmw"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></span><span class="batw"><span class="bat isABatting" data-osb-component="field" data-osb-field="isABatting" style="opacity: 0"></span></span><span class="runs currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="he hitsA" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span><span class="he errorsA" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsA">0</span></div><div class="row"><span class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"><span class="home isBHome" data-osb-component="field" data-osb-field="isBHome" style="opacity: 0"></span></span><span class="nmw"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></span><span class="batw"><span class="bat isBBatting" data-osb-component="field" data-osb-field="isBBatting" style="opacity: 0"></span></span><span class="runs currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="he hitsB" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span><span class="he errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></div>
<div class="bay"><span class="inn"><span class="half" aria-hidden="true"><span class="half-dim"></span><span class="half-win"><span class="inningHalf" data-osb-component="field"></span></span></span><span class="inn-n inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="diamond" aria-label="Bases"><span class="base second"><span class="runner isRunnerOnSecond" data-osb-component="field" data-osb-field="isRunnerOnSecond" style="opacity: 0"></span></span><span class="base third"><span class="runner isRunnerOnThird" data-osb-component="field" data-osb-field="isRunnerOnThird" style="opacity: 0"></span></span><span class="base first"><span class="runner isRunnerOnFirst" data-osb-component="field" data-osb-field="isRunnerOnFirst" style="opacity: 0"></span></span></span><span class="count"><span class="cb balls" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span><span class="dash" aria-hidden="true">-</span><span class="cs strikes" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span><span class="bso"><span>B</span><span class="dots ball-dots"><span class="dot"><span class="lit isBall1" data-osb-component="field" data-osb-field="isBall1" style="opacity: 0"></span></span><span class="dot"><span class="lit isBall2" data-osb-component="field" data-osb-field="isBall2" style="opacity: 0"></span></span><span class="dot"><span class="lit isBall3" data-osb-component="field" data-osb-field="isBall3" style="opacity: 0"></span></span></span><span>S</span><span class="dots strike-dots"><span class="dot"><span class="lit isStrike1" data-osb-component="field" data-osb-field="isStrike1" style="opacity: 0"></span></span><span class="dot"><span class="lit isStrike2" data-osb-component="field" data-osb-field="isStrike2" style="opacity: 0"></span></span></span><span>O</span><span class="dots out-dots"><span class="dot"><span class="lit isOut1" data-osb-component="field" data-osb-field="isOut1" style="opacity: 0"></span></span><span class="dot"><span class="lit isOut2" data-osb-component="field" data-osb-field="isOut2" style="opacity: 0"></span></span></span></span><span class="cover isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0"><b>End of</b><span class="periodLabel" data-osb-component="field" data-osb-field="periodLabel"></span></span><span class="cover fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0">Final</span></div>
<div class="foot"><span class="st2"><span class="st-pre">PREGAME</span><span class="st-live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0"><span class="st-live-in"><i></i>LIVE</span></span></span><span class="ticks" aria-label="Innings"><span class="tick"><span class="tick-on isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity: 0"></span></span></span></div>
</article>
<span class="sr"><span class="battingSide" data-osb-component="field" data-osb-field="battingSide"></span><span class="bases" data-osb-component="field" data-osb-field="bases"></span><span class="outs" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span></span><span class="osb-core-fields" aria-hidden="true"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></span></span>
</main></body></html>
