<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Marine Pearl Centerbank, horizontal</title><style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#23343b}
.stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.board{--navy:#152f3c;--pearl:#edf0ed;--marine:#284e5d;--ink:#23343b;--rule:#90a8a7;position:relative;display:flex;flex-direction:row;min-width:0;max-width:100%;overflow:hidden;border:1px solid var(--rule);border-radius:2px;background:var(--pearl);container-type:inline-size}
.board.compact{width:min(77vw,1460px,calc((100vh - 24px)*4))}
.board.horizontal{width:min(92vw,1760px,calc((100vh - 24px)*8))}
.sport-band{display:flex;align-items:center;justify-content:center;flex:0 0 17%;min-width:0;padding:0 1cqw;background:var(--navy);border-right:2px solid var(--rule);color:#fff;font-size:2.7cqw;font-weight:800;line-height:1.07;text-align:center;overflow-wrap:anywhere}
.compact .sport-band{padding:0 .2cqw;font-size:2.45cqw}
.data-area{display:flex;flex-direction:column;flex:1 1 0;min-width:0}
.competitors{display:flex;flex-direction:row;min-width:0}
.competitor{display:flex;align-items:stretch;min-width:0;flex:1 1 0;background:var(--pearl)}
.compact .competitor{flex:0 0 auto;height:10cqw}
.compact .competitor+.competitor{border-top:2px solid var(--rule)}
.horizontal .competitor{height:6.6cqw}
.horizontal.softball .competitor{height:7.8cqw}
.identity{display:block;flex:0 0 2.8%;min-width:8px;background:#5d9387}
.jerseyColorB{background:#6086a0}
.name{display:block;align-content:center;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2.3cqw;font-size:3.25cqw;font-weight:700;line-height:1.08;color:var(--ink)}
.compact.softball .name{font-size:5.5cqw}
.combinedAName:empty:before{content:"Team A"}
.combinedBName:empty:before{content:"Team B"}
.score-track{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;min-width:0;background:var(--marine);border-left:2px solid var(--rule)}
.compact .score-track{width:19%;border-right:0}
.horizontal .score-track{width:14cqw}
.horizontal .side-a .score-track{border-right:2px solid var(--rule)}
.horizontal .side-b .score-track{border-left:0;border-right:2px solid var(--rule)}
.score{display:block;width:100%;text-align:center;color:#fff;font-size:5.2cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.score-caption{display:block;margin-bottom:.15cqw;color:#fff;font-size:2.1cqw;font-weight:700;line-height:1}
.stats{display:flex;align-items:stretch;min-width:0;background:var(--pearl);border-top:2px solid var(--rule)}
.compact .stats{height:4.3cqw}
.horizontal .stats{height:3.25cqw}
.stat{display:flex;align-items:center;justify-content:center;flex:1 1 0;min-width:0;padding:0 .35cqw;white-space:nowrap}
.stat+.stat{border-left:2px solid var(--rule)}
.compact:not(.softball) .stat{flex-direction:column;gap:.3cqw}
.compact.softball .stat,.horizontal .stat{gap:1.2cqw}
.stat-label{color:var(--ink);font-size:1.75cqw;font-weight:700;line-height:1}
.stat-value{color:var(--ink);font-size:2.6cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.retained,.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){
 .board.compact,.board.horizontal{width:100%}
 .sport-band{font-size:10px;padding:0 2px;border-right-width:1px}
 .compact .sport-band{font-size:10px;padding:0 2px}
 .compact .competitor{height:58px}
 .horizontal .competitor,.horizontal.softball .competitor{height:74px}
 .identity{min-width:5px}
 .name{padding:0 4px;font-size:17px}
 .horizontal .name,.compact.softball .name{font-size:17px}
 .score-track,.horizontal .side-a .score-track,.horizontal .side-b .score-track{border-width:1px}
 .compact .score-track{width:54px}
 .horizontal .score-track{width:44px}
 .score{font-size:31px}
 .score-caption{font-size:10px;margin-bottom:1px}
 .compact .stats,.horizontal .stats{height:43px}
 .stat{padding:0 1px}
 .stat+.stat,.stats{border-width:1px}
 .compact.softball .stat,.horizontal .stat{flex-direction:column;gap:3px}
 .compact:not(.softball) .stat{gap:3px}
 .stat-label{font-size:8px}
 .stat-value{font-size:17px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body><main class="stage" data-osb-component="layout"><article class="board horizontal softball columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Softball scoreboard">
  <div class="sport-band" data-osb-component="text">SOFTBALL</div>
  <div class="data-area columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
    <div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="competitor side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="score-track" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="competitor side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="score-track" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
    <footer class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">INNING</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></div><div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">BALLS</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span></div><div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">STRIKES</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></div><div class="stat rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="stat-label" data-osb-component="text">OUTS</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span></div></footer>
  </div><div class="point-slot" data-osb-component="layout"><span class="isGamePoint isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</article></main></body></html>
