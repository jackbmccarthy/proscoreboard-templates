<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Tennis — Cloud Graphite Combined Bay Lower Third</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--cloud:#e8edeb;--graphite:#293b44;--light:#f7faf8;--rule:#aebbb8;position:relative;display:flex;flex-direction:column;width:min(75vw,1640px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:3px;background:var(--cloud);container-type:inline-size}
.sport-line{position:relative;display:flex;flex:0 0 auto;min-width:0;height:3.6cqw;align-items:center;padding:0 1.55cqw;border-bottom:1px solid var(--rule);color:var(--graphite);font-size:2.35cqw;line-height:1;font-weight:700;letter-spacing:.015em;white-space:nowrap}
.surface{display:flex;min-width:0}
.side{display:flex;flex:1 1 50%;min-width:0;min-height:12.5cqw;align-items:stretch}
.side+.side{border-left:2px solid var(--rule)}
.identity-wrap{display:flex;flex:0 0 3%;align-items:center;justify-content:flex-start;padding:2px 0}
.identity{display:block;width:84%;height:100%;border-radius:2px;background:#2178a8}
.jerseyColorB{background:#c95c5b}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.7cqw;padding:0 1.55cqw;color:#1d3038}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:4.55cqw;line-height:1.05;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .42cqw;width:.42cqw;height:.42cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--graphite)}
.numeric-bay{display:flex;flex:0 0 28%;min-width:0;flex-direction:column;align-items:center;justify-content:center;padding:.7cqw 1cqw;background:var(--graphite);color:var(--light)}
.support{display:flex;flex:0 0 auto;min-width:0;width:100%;flex-direction:column;align-items:center;justify-content:center;gap:.3cqw;line-height:1}
.support-label{font-size:1.3cqw;font-weight:700;white-space:nowrap}.support-score{font-size:2.2cqw;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bay-rule{display:block;flex:0 0 1px;width:91%;margin:.45cqw 0;background:#aebbb8}
.primary{display:flex;flex:1 1 auto;min-width:0;min-height:0;width:100%;flex-direction:column;align-items:center;justify-content:center}
.primary-label{display:block;font-size:1.3cqw;line-height:1;font-weight:700;white-space:nowrap}
.primary-score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:5.2cqw;line-height:1.02;font-weight:700;font-variant-numeric:tabular-nums}
.point-slot{position:absolute;right:1%;top:0;width:17%;height:3.6cqw;color:var(--graphite);text-align:center;font-size:1cqw;font-weight:700}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--cloud)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.sport-line{height:28px;padding:0 8px;font-size:14px}.side{min-height:94px}.identity-wrap{flex-basis:5px;padding:2px 0}.identity{width:4px}.name-lane{gap:2px;padding:0 4px}.name{font-size:14px}.serve{flex-basis:5px;width:5px;height:5px;min-width:5px;min-height:5px}.numeric-bay{flex-basis:31%;padding:4px 2px}.support{gap:2px}.support-label{font-size:8px}.support-score{font-size:15px}.bay-rule{margin:3px 0}.primary-label{font-size:8px}.primary-score{font-size:30px}.point-slot{height:28px;font-size:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sport-line"><span>TABLE TENNIS</span></div><div class="surface rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="numeric-bay columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="support"><span class="support-label">GAMES</span><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="bay-rule"></span><div class="primary"><span class="primary-label">POINTS</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div></div><div class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="numeric-bay columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="support"><span class="support-label">GAMES</span><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><span class="bay-rule"></span><div class="primary"><span class="primary-label">POINTS</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></div></div><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body></html>
