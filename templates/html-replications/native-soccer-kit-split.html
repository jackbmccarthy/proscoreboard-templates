<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kit Split</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 50px 28px; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
    .osb { position: relative; width: 1180px; color: #fff; filter: drop-shadow(0 8px 18px #000a); }
    .top { display: flex; justify-content: center; }
    .tab { display: grid; width: 300px; height: 46px; background: #fff; color: #0b0d12; border-radius: 8px 8px 0 0; overflow: hidden; }
    .tab > * { grid-area: 1 / 1; }
    .live { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .dot { width: 12px; height: 12px; color: #e3262e; }
    .per { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #5a6270; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .add { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 19px; font-weight: 700; color: #fff; background: #0b0d12; padding: 2px 6px 1px; border-radius: 3px; }
    .runbar { position: absolute; left: 40px; right: 40px; bottom: 0; height: 3px; background: #0b0d12; }
    .mp { display: flex; gap: 2px; }
    .h { position: relative; width: 12px; height: 4px; background: #d2d6dd; }
    .h > span { position: absolute; inset: 0; background: #0b0d12; }
    .et { width: 6px; height: 4px; background: #e3262e; }
    .state { z-index: 1; display: flex; align-items: center; justify-content: center; gap: 10px; line-height: 1; background: #0b0d12; color: #fff; }
    .st-b { font-size: 28px; font-weight: 700; letter-spacing: 2px; }
    .pens { z-index: 2; background: #ffd21f; color: #0b0d12; }
    .st-s { font-size: 17px; font-weight: 700; letter-spacing: 3px; }
    .st-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 30px; font-weight: 700; }
    .st-v b { padding: 0 4px; }
    .fin { z-index: 3; background: #e3262e; }
    .bar { display: grid; grid-template-columns: minmax(0, 1fr) 210px minmax(0, 1fr); height: 80px; }
    .pl { position: relative; display: grid; min-width: 0; overflow: hidden; }
    .pl > * { grid-area: 1 / 1; }
    .pl.A { border-radius: 8px 0 0 8px; } .pl.B { border-radius: 0 8px 8px 0; }
    .wash { background-color: #59616e; }
    .wash::after { content: ""; display: block; height: 100%; background: linear-gradient(90deg, #0000, #0007); }
    .pl.B .wash::after { background: linear-gradient(270deg, #0000, #0007); }
    .nmw { position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 26px; min-width: 0; }
    .pl.B .nmw { flex-direction: row-reverse; }
    .nm { min-width: 0; font-size: 36px; font-weight: 700; line-height: 1; letter-spacing: .5px; text-transform: uppercase; text-align: right; text-shadow: 0 2px 6px #0009; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
    .pl.B .nm { text-align: left; }
    .sc { display: flex; align-items: center; justify-content: center; gap: 14px; background: #0b0d12; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 54px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sc b { font-size: 30px; color: #6b7280; }
    .ev { display: flex; justify-content: center; gap: 14px; margin-top: 6px; font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #fff; text-shadow: 0 1px 4px #000; }
    .ev .matchRound { color: #ffd21f; }
    .cards { display: flex; gap: 4px; flex: 0 0 auto; }
    .yc, .rc { display: flex; align-items: center; justify-content: center; width: 17px; height: 24px; border-radius: 2px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 15px; font-weight: 700; line-height: 1; box-shadow: 0 1px 2px #0006; }
    .yc { background: #ffd21f; color: #2a2300; }
    .rc { background: #e3262e; color: #fff; }
    .yc[style*="opacity: 0"], .rc[style*="opacity: 0"] { width: 0; margin-left: -4px; }
    .brk .b-ft, .brk .b-eh, .brk .b-aet { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]) .brk .b-ht { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .b-ft { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .brk .b-eh { display: inline; }
    .osb:has(.isGame4Started[style*="opacity: 1"]) .brk .b-aet { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]) .brk .b-ft { display: none; }
    .add-v:empty::before { content: "+0"; }
    .dot i { display: block; width: 100%; height: 100%; border-radius: 50%; background: currentColor; animation: osb-pulse 1.6s ease-in-out infinite; }
    @keyframes osb-pulse { 50% { opacity: .35; } }
    .osb:has(.isComplete[style*="opacity: 1"]) .dot i { animation: none; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.fpens{white-space:nowrap}
.fpens:not([style*="opacity: 1"]){display:none}
.fin:has(.isDecidedOnPenalties[style*="opacity: 1"]) .st-b::after{content:none}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.dot.isMatchStarted>i,.et.isGame3Started,.et.isGame4Started{width:12px!important;height:12px!important;min-width:0!important;flex-shrink:0!important}
.cn.yellowCardsA,.cn.redCardsA,.cn.yellowCardsB,.cn.redCardsB{font-size:16px!important}
/* end stream-size floor */

  </style>
</head>
<body>
<article class="osb" aria-label="Soccer lower third">
  <div class="top"><div class="tab">
    <div class="live"><span class="dot isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"><i></i></span><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="add addedTimeVisible" data-osb-component="field" data-osb-field="addedTimeVisible" style="opacity: 0;"><span class="add-v addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="mp"><span class="h"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="h"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="et isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span><span class="et isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="st-b b-ht">HT</span><span class="st-b b-ft">FT</span><span class="st-b b-eh">ET HT</span><span class="st-b b-aet">AET</span></div>
    <div class="state pens isShootoutActive" data-osb-component="field" data-osb-field="isShootoutActive" style="opacity: 0;"><span class="st-s">PENS</span><span class="st-v"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span><b>-</b><span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span></span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FT<span class="isDecidedOnPenalties fpens" data-osb-component="field" data-osb-field="isDecidedOnPenalties" style="opacity:0"> (<span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span>-<span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span> PENS)</span></span></div>
  </div></div>
  <div class="bar">
    <div class="pl A"><span class="wash jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nmw"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="cards"><span class="yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span></span></span></div>
    <div class="sc"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b>-</b><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
    <div class="pl B"><span class="wash jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nmw"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="cards"><span class="yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span></span></span></div>
  </div>
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="homeSide" data-osb-component="field" data-osb-field="homeSide"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
