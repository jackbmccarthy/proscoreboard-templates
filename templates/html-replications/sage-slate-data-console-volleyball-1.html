<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Sage Slate Data Console 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;width:min(92vw,1060px);height:232px;max-width:100%;overflow:hidden;border:2px solid #a8bfbd;border-radius:3px;background:#e7edea;color:#1c3035;container-type:inline-size}
.console{display:flex;flex:0 0 22.2%;min-width:0;flex-direction:column;padding:20px 25px 16px;background:#263b3e;color:#e8efed}
.sport-tag{display:block;overflow:hidden;font-size:clamp(13px,2.4cqw,25px);font-weight:800;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.rule{height:2px;margin:17px 0 19px;background:#b3c7c4}
.stat-labels,.stat-values{display:flex;align-items:center;justify-content:space-between;gap:5px;font-variant-numeric:tabular-nums}
.stat-labels{color:#b9cbca;font-size:clamp(10px,2.1cqw,21px);font-weight:750}
.stat-values{margin-top:10px;color:#fff;font-size:clamp(22px,4.1cqw,42px);font-weight:800;line-height:1}
.sets-label,.sets-values{display:flex;justify-content:space-between;gap:5px;flex:1 1 65%;min-width:0}
.set-label,.current-set{display:flex;justify-content:center;flex:0 0 31%;min-width:0;border-left:2px solid #acc2bf}
.set-label{border-left:0}
.set-score,.current-set-value{display:block;min-width:0;text-align:center;font-variant-numeric:tabular-nums}
.set-score{flex:1 1 0}
.teams{display:flex;flex:1 1 0;min-width:0;flex-direction:column}
.team{display:flex;flex:1 1 0;min-height:0;min-width:0}
.team+.team{border-top:2px solid #b9cbca}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0;background:#e7edea}
.identity{display:block;flex:0 0 14px;align-self:stretch;margin:7px 0 7px 9px;background:#176dbb}
.jerseyColorB{background:#d92437}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;padding:0 27px;color:#203338;font-size:clamp(22px,5.8cqw,62px);font-weight:750;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.score-terminal{display:flex;align-items:center;justify-content:center;flex:0 0 16%;min-width:0;background:#5b7d74;color:#fff}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(36px,8.2cqw,82px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:8px}
 .board{width:100%;height:126px}
 .console{padding:11px 8px 8px;flex-basis:27%}
 .sport-tag{font-size:clamp(10px,2.5vw,13px)}
 .rule{height:1px;margin:9px 0 8px}
 .stat-labels{font-size:10px}
 .stat-values{margin-top:5px;font-size:19px}
 .set-label,.current-set{flex-basis:33%}
 .identity{flex-basis:5px;margin:5px 0 5px 4px}
 .name{padding:0 7px;font-size:clamp(15px,4.4vw,21px)}
 .score-terminal{flex-basis:18%}
 .score{font-size:clamp(29px,8.5vw,42px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <aside class="console columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <span class="sport-tag" data-osb-component="text">VOLLEYBALL</span>
   <span class="rule" data-osb-component="layout"></span>
   <div class="stat-labels" data-osb-component="layout"><span class="sets-label" data-osb-component="text">SETS</span><span class="set-label" data-osb-component="text">SET</span></div>
   <div class="stat-values" data-osb-component="layout"><div class="sets-values" data-osb-component="layout"><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="current-set" data-osb-component="layout"><span class="current-set-value" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
  </aside>
  <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="score-terminal" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="score-terminal" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
