<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Lakeside Inning Break</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.bb-retained{display:none}
.bb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.8)}
.diamond>.base{position:absolute;width:30%;height:37.5%;transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.06rem)}
.diamond>.base.second{left:35%;top:10%}.diamond>.base.third{left:8%;top:44%}.diamond>.base.first{left:62%;top:44%}
.diamond::before{content:"";position:absolute;left:calc(var(--d,3rem)*.309);top:calc(var(--d,3rem)*.311);width:calc(var(--d,3rem)*.382);height:calc(var(--d,3rem)*.382);transform:rotate(45deg);border:1px solid var(--base-edge,currentColor);opacity:.28}
.bb-plate{display:none}
.bb-bases{position:absolute;left:0;right:0;bottom:-.1rem;text-align:center;font:700 .42rem/1 var(--mono-ui,Menlo,Consolas,monospace);letter-spacing:.04em;color:var(--base-text,currentColor);opacity:.85}
.bb-half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.bb-half-dim{position:absolute;inset:0}
.bb-half-dim::before,.bb-half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.28))}
.bb-half-dim::before,.bb-half-dim::after{position:absolute;left:0;width:100%;height:100%}
.bb-half-dim::before,.inningHalf::after{clip-path:polygon(50% 4%,96% 40%,4% 40%)}
.bb-half-dim::after,.inningHalf::before{clip-path:polygon(4% 60%,96% 60%,50% 96%)}
.bb-half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.bb-ls-col>.bb-gate{display:flex;flex-direction:column;align-items:stretch}
.bb-tick{position:relative}.bb-tick>.bb-gate{display:block;position:absolute;inset:0;border-radius:inherit;background:var(--tick-on,#fff)}
.bb-ls-extra{display:none!important}.bb-ls-extra:has(>.bb-gate[style*="opacity: 1"]),.bb-ls-extra:has(>.bb-gate[style*="opacity:1"]){display:flex!important}
.bb-live,.bb-break,.bb-final{transition:opacity .25s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.bb-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;color:#eef6fd}
.fb{display:flex;flex-direction:column;align-items:center;gap:1rem;width:56rem;padding:1.6rem 2rem 1.4rem;border-radius:.8rem;background:radial-gradient(120% 90% at 50% 0%,#173052,#0b1626);box-shadow:0 .8rem 2.4rem rgba(0,0,0,.55)}
.fb-top{display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center}
.fb-top .bb-event{font:800 1.1rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#8fa8c2}
.fb-top .bb-round{font:600 .75rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8fa8c2}
.fb-title{display:grid;place-items:center;font:800 1.6rem/1 "Avenir Next Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;letter-spacing:.2em}
.fb-title>*{grid-area:1/1}
.fb-title .bb-break{background:#173052;padding:0 .6rem;color:#4fc3f7}
.fb-main{display:flex;align-items:center;gap:1.4rem;width:100%}
.fb-team{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1.2rem 1rem 1rem;border-radius:.6rem;background:#11223a;overflow:hidden;isolation:isolate}
.fb-team .bb-jersey{position:absolute;left:0;right:0;top:0;height:.45rem;background:#4fc3f7}
.fb-team .bb-name{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:800 1.7rem/1.1 "Avenir Next Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.04em}
.fb-team .bb-runs{font:800 5.2rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.fb-he{display:flex;gap:1rem;font:700 .75rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.16em;color:#8fa8c2}.fb-he span span{color:#eef6fd;margin-left:.3rem}
.fb-mid{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.fb-medal{display:flex;flex-direction:column;align-items:center;justify-content:center;width:6.4rem;height:6.4rem;border-radius:50%;border:.22rem solid #4fc3f7;background:#11223a}
.fb-medal i{font:700 .55rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.22em;color:#8fa8c2;font-style:normal}
.bb-inning{display:flex;align-items:center;gap:.3rem;font:800 2.2rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;--half-on:#4fc3f7;--half-off:rgba(255,255,255,.2);--half-h:2rem;--half-size:.9rem}
.fb-sit{display:flex;align-items:center;gap:.6rem;font:700 .9rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif}
.fb-sit .diamond{--d:3.4rem;--base-edge:#eef6fd;--base-off:rgba(255,255,255,.08);--base-line:.1rem;--base-text:#8fa8c2}
.fb-sit .bb-outs-label{font-size:.55rem;letter-spacing:.14em;color:#8fa8c2;margin-left:.2rem}
.fb-sit>span{display:flex;flex-direction:column;gap:.3rem}
.bb-ls{display:flex;align-items:stretch;width:100%;border-radius:.4rem;overflow:hidden;background:#11223a}
.bb-ls-teams,.bb-ls-col{display:flex;flex-direction:column}
.bb-ls-h{display:flex;align-items:center;justify-content:center;height:1.3rem;color:#8fa8c2;font:700 .6rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.08em;background:rgba(255,255,255,.04)}
.bb-ls-teams{flex:1}.bb-ls-teams .bb-ls-h{justify-content:flex-start;padding-left:.8rem}
.bb-ls-team{display:flex;align-items:center;gap:.6rem;height:1.9rem;padding-right:.4rem}
.bb-ls-chip{align-self:stretch;width:.35rem;background:#4fc3f7}
.bb-ls-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:700 .95rem/1 "Avenir Next Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;text-transform:uppercase}
.bb-ls-innings{display:flex}
.bb-ls-col{width:2rem}.bb-ls-col>.bb-gate{flex:1}
.bb-ls-v{display:flex;align-items:center;justify-content:center;height:1.9rem;font:600 .95rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.bb-ls-r{width:2.6rem;background:#4fc3f7;color:#06121f}.bb-ls-r .bb-ls-v{font-weight:800;font-size:1.15rem}
.bb-ls-he{width:2.2rem}.bb-ls-he .bb-ls-v{color:#8fa8c2}
.fb-foot{display:flex;align-items:center;gap:.8rem;color:#8fa8c2;font:700 .6rem/1 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.2em}
.fb-foot .bb-track{display:flex;gap:.2rem}
.bb-tick{width:.8rem;height:.25rem;border-radius:.12rem;background:rgba(255,255,255,.15);--tick-on:#4fc3f7}
.bb-live{color:#4fc3f7}
</style></head><body><main class="bb-stage" aria-label="Softball full-screen scoreboard">
<article class="fb columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Softball between-innings card">
<div class="fb-top"><span class="bb-event eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="fb-title"><span>SCORE UPDATE</span><span class="bb-break isInBetweenGames" data-osb-component="field" style="opacity: 0">INNING BREAK</span></span><span class="bb-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
<div class="fb-main rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="fb-team"><span class="bb-jersey jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="bb-name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="bb-runs currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="fb-he"><span>H<span class="bb-h hitsA" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span></span><span>E<span class="bb-e errorsA" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsA">0</span></span></span></div>
<div class="fb-mid"><div class="fb-medal"><i>INNING</i><span class="bb-inning"><span class="bb-half"><span class="bb-half-dim" aria-hidden="true"></span><span class="bb-half-win"><span class="inningHalf" data-osb-component="field"></span></span></span><span class="bb-inning-no inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span></div><div class="fb-sit"><span class="diamond" aria-label="Bases"><span class="base second"></span><span class="base third"></span><span class="base first"></span><span class="bb-plate" aria-hidden="true"></span><span class="bb-bases bases" data-osb-component="field"></span></span><span><span><span class="bb-count"><span class="bb-b balls" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span><span class="bb-dash" aria-hidden="true">-</span><span class="bb-s strikes" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span></span><span class="bb-outs"><span class="bb-o outs" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span><span class="bb-outs-label">OUT</span></span></span></div></div>
<div class="fb-team"><span class="bb-jersey jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="bb-name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="bb-runs currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="fb-he"><span>H<span class="bb-h hitsB" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span></span><span>E<span class="bb-e errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></span></span></div></div>
<div class="fb-foot"><span>SOFTBALL</span><span class="bb-track" aria-label="Innings"><span class="bb-tick"><span class="bb-gate isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity: 0"></span></span><span class="bb-tick"><span class="bb-gate isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity: 0"></span></span></span><span class="bb-live isMatchStarted" data-osb-component="field" style="opacity: 0">LIVE</span></div>
</article>
<span class="bb-sr battingSide" data-osb-component="field"></span><span class="bb-retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="bb-retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main></body></html>
