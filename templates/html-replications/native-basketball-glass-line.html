<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Line</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 30px 24px 24px; font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
    .line { position: relative; display: flex; align-items: stretch; width: 1040px; height: 64px; background: #f6f8fbe8; border: 1px solid #ffffff; border-radius: 12px; color: #0f1724; box-shadow: 0 10px 30px #0f172455; overflow: hidden; }
    .team { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding-left: 18px; }
    .team + .team { border-left: 1px solid #d5dbe5; }
    .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .nm { font-size: 24px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { display: flex; gap: 10px; font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: #64748b; text-transform: uppercase; }
    .fl, .tol-v { color: #0f1724; margin-left: 3px; }
    .tol::before { content: "TO"; }
    .tol:has(.tol-v:empty) { display: none; }
    .bonus { color: #3b82f6; }
    .bonus:empty { display: none; }
    .tile { position: relative; align-self: stretch; display: flex; align-items: center; justify-content: center; width: 92px; background: #0f1724; }
    .kit { position: absolute; inset: 0; }
    .pts { position: relative; color: #fff; font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #0006; }
    .clk { display: flex; align-items: center; gap: 12px; padding: 0 18px; border-left: 1px solid #d5dbe5; }
    .per { min-width: 32px; padding: 2px 6px; text-align: center; border-radius: 6px; background: #0f1724; color: #fff; font-size: 16px; font-weight: 700; }
    .per:empty { display: none; }
    .gc { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .shot { align-self: flex-start; margin-top: 10px; margin-left: -8px; font-size: 13px; font-weight: 700; color: #fff; background: #3b82f6; border-radius: 9px; padding: 1px 7px; }
    .shot:has(.sc-v:empty) { display: none; }
    .under { position: absolute; right: 12px; bottom: -22px; display: flex; gap: 10px; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: #f6f8fb; text-shadow: 0 1px 3px #000; }
    .pips { display: flex; gap: 3px; }
    .pip { position: relative; width: 16px; height: 4px; border-radius: 2px; background: #f6f8fb55; }
    .pip-on { position: absolute; inset: 0; border-radius: 2px; background: #f6f8fb; }
    .pip.pip-ot { width: auto; height: auto; padding: 0 4px; background: #3b82f6; font-size: 9px; }
    .poss::before { content: "POSS "; }
    .poss:has(.poss-v:empty) { display: none; }
    .ev { position: absolute; left: 12px; bottom: -22px; display: flex; gap: 10px; font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: #f6f8fb; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
    .to-flag { position: absolute; inset: 0; align-items: center; justify-content: center; gap: 10px; background: #3b82f6; color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 4px; }
    .brk { position: absolute; right: 0; top: -24px; padding: 3px 12px; background: #3b82f6; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 2px; border-radius: 8px; }
    .wrap { position: relative; display: inline-block; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="wrap" aria-label="Basketball lower third">
  <div class="line">
    <div class="team"><span class="who"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="meta"><span>Fouls<span class="fl teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</span></span><span class="tol"><span class="tol-v timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span></span><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span></span></span><span class="tile"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><div class="to-flag isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
    <div class="team"><span class="who"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="meta"><span>Fouls<span class="fl teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</span></span><span class="tol"><span class="tol-v timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span></span><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span></span></span><span class="tile"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span><div class="to-flag isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
    <div class="clk"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="shot"><span class="sc-v" data-osb-static="true" data-sport-stat="shotClock"></span></span></div>
  </div>
  <span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
  <div class="under"><span class="pips"><span class="pip"><span class="pip-on isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="pip pip-ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span><span class="poss"><span class="poss-v possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span></span></div>
  <span class="brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">BREAK</span>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><span class="possession" data-osb-component="field" data-osb-field="possession"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
