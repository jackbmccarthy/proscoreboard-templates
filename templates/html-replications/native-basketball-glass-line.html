<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Line</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 50px 28px; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    .osb { position: relative; width: 1180px; padding: 8px; border-radius: 16px; background: #ffffffd9; box-shadow: 0 10px 30px #0007, inset 0 1px 0 #fff; color: #141a24; }
    .ev { display: flex; justify-content: center; gap: 12px; margin: 0 0 6px; font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #5b6576; }
    .ev .matchRound { color: #2251d6; }
    .line { display: grid; grid-template-columns: 1fr 250px 1fr; gap: 8px; align-items: stretch; }
    .team { display: grid; grid-template-columns: 8px minmax(0, 1fr) 28px 96px; align-items: center; height: 76px; border-radius: 10px; background: #fff; box-shadow: 0 1px 3px #0002; overflow: hidden; }
    .team.B { grid-template-columns: 96px 28px minmax(0, 1fr) 8px; }
    .team.B > .kit { order: 4; } .team.B > .who { order: 3; align-items: flex-end; text-align: right; } .team.B > .poss { order: 2; } .team.B > .pts { order: 1; }
    .kit { align-self: stretch; background-color: #59616e; }
    .who { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 5px; min-width: 0; padding: 0 16px; align-self: stretch; }
    .nm { font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 28px; font-weight: 700; line-height: 1; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; max-width: 100%; }
    .meta { display: flex; align-items: center; gap: 12px; height: 20px; font-size: 14px; font-weight: 700; letter-spacing: 1.2px; color: #6a7486; }
    .team.B .meta { flex-direction: row-reverse; }
    .pips { display: flex; gap: 4px; }
    .pip { width: 9px; height: 9px; border-radius: 50%; background: #2251d6; }
    .fl b { font-size: 17px; color: #141a24; margin-left: 4px; }
    .bonus { font-size: 11px; letter-spacing: 1.2px; color: #fff; background: #e0482f; padding: 2px 6px 1px; border-radius: 3px; }
    .bonus:empty { display: none; }
    .to { position: absolute; left: 12px; right: 12px; bottom: 7px; height: 26px; align-items: center; justify-content: center; gap: 10px; border-radius: 5px; background: #2251d6; color: #fff; }
    .to-l { font-size: 14px; font-weight: 800; letter-spacing: 2.5px; }
    .to-c { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 18px; font-weight: 700; }
    .poss { display: flex; justify-content: center; }
    .arrow { width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid #2251d6; }
    .team.A .arrow { border-left: 0; border-right: 12px solid #2251d6; }
    .pts { align-self: stretch; display: flex; align-items: center; justify-content: center; background: #141a24; color: #fff; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .mid { display: grid; border-radius: 10px; background: #eef1f6; overflow: hidden; box-shadow: inset 0 0 0 1px #d5dbe5; }
    .mid > * { grid-area: 1 / 1; }
    .live { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .top { display: flex; align-items: center; gap: 10px; }
    .per { font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #fff; background: #2251d6; padding: 2px 9px 1px; border-radius: 4px; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 42px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .gc b { color: #2251d6; padding: 0 1px; }
    .shot { position: relative; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #6a7486; }
    .shot-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 19px; font-weight: 700; color: #e0482f; min-width: 22px; text-align: right; }
    .run-shot { position: absolute; left: 0; right: 0; bottom: -3px; height: 2px; background: #e0482f; }
    .runbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #2251d6; }
    .prog { display: flex; gap: 3px; align-items: center; }
    .q { position: relative; width: 12px; height: 4px; border-radius: 2px; background: #cdd4df; }
    .q > span { position: absolute; inset: 0; border-radius: 2px; background: #2251d6; }
    .ot { font-size: 10px; font-weight: 800; padding: 1px 3px; line-height: 1; border-radius: 2px; background: #e0482f; color: #fff; }
    .state { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; background: #2251d6; color: #fff; }
    .st-s { font-size: 15px; font-weight: 800; letter-spacing: 3px; }
    .st-b { font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 40px; font-weight: 700; margin-top: 2px; }
    .brk .half-t { font-size: 36px; }
    .fin { z-index: 2; background: #141a24; }
    .fin-ot { font-size: 15px; font-weight: 800; letter-spacing: 2.5px; margin-top: 3px; color: #9fb4ff; }
    .half-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .end-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .half-t { display: block; }
    .fin-ot { display: none; }
    .osb:has(.isGame5Started[style*="opacity: 1"]) .fin-ot { display: block; }
    .osb:has(.isComplete[style*="opacity: 1"]) .final-dim { opacity: .3; filter: grayscale(1); }
    .pips { gap: 0 !important; }
    .pips > [class*="TimeoutLeft"] { margin-right: 4px; }
    .pips > [style*="opacity: 0"] { width: 0 !important; margin: 0 !important; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="osb" aria-label="Basketball lower third">
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="line">
    <div class="team A"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="who"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="meta"><span class="pips final-dim"><span class="pip isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity: 0;"></span><span class="pip isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity: 0;"></span><span class="pip isATimeoutLeft3" data-osb-component="field" data-osb-field="isATimeoutLeft3" style="opacity: 0;"></span><span class="pip isATimeoutLeft4" data-osb-component="field" data-osb-field="isATimeoutLeft4" style="opacity: 0;"></span><span class="pip isATimeoutLeft5" data-osb-component="field" data-osb-field="isATimeoutLeft5" style="opacity: 0;"></span></span><span class="fl">FOULS <b class="teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</b></span><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span><span class="to isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIMEOUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></div></div><span class="poss final-dim"><span class="arrow isAPossession" data-osb-component="field" data-osb-field="isAPossession" style="opacity: 0;"></span></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
    <div class="mid">
      <div class="live"><div class="top"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="prog"><span class="q"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span><span class="shot isShotClockActive" data-osb-component="field" data-osb-field="isShotClockActive" style="opacity: 0;">SHOT<span class="shot-v" data-osb-static="true" data-sport-stat="shotClock"></span><span class="run-shot isShotClockRunning" data-osb-component="field" data-osb-field="isShotClockRunning" style="opacity: 0;"></span></span></div><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
      <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="end-t st-s">END OF</span><span class="end-t st-b"><span class="periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span></span><span class="half-t st-b">HALFTIME</span></div>
      <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FINAL</span><span class="fin-ot">OVERTIME</span></div>
    </div>
    <div class="team B"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="who"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="meta"><span class="pips final-dim"><span class="pip isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity: 0;"></span><span class="pip isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity: 0;"></span><span class="pip isBTimeoutLeft3" data-osb-component="field" data-osb-field="isBTimeoutLeft3" style="opacity: 0;"></span><span class="pip isBTimeoutLeft4" data-osb-component="field" data-osb-field="isBTimeoutLeft4" style="opacity: 0;"></span><span class="pip isBTimeoutLeft5" data-osb-component="field" data-osb-field="isBTimeoutLeft5" style="opacity: 0;"></span></span><span class="fl">FOULS <b class="teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</b></span><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span><span class="to isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIMEOUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></div></div><span class="poss final-dim"><span class="arrow isBPossession" data-osb-component="field" data-osb-field="isBPossession" style="opacity: 0;"></span></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
  </div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span><span class="timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span><span class="possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
