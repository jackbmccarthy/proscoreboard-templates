<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Time Poster</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; font-family: "Futura", "Century Gothic", "Trebuchet MS", Arial, sans-serif; }
    .osb { position: relative; width: 1120px; padding: 30px 50px 34px; border-radius: 16px; background: radial-gradient(ellipse at 50% 0, #1f4d33, #0c1d14 70%); color: #fff; box-shadow: 0 20px 50px #000c; text-align: center; }
    .ev { display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .ev .eventName { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
    .ev .matchRound { font-size: 17px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #9be3b4; }
    .status { display: grid; width: 330px; height: 58px; margin: 20px auto 0; border-radius: 999px; overflow: hidden; background: #0a140e; border: 2px solid #3d7a55; }
    .status > * { grid-area: 1 / 1; }
    .live { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .lvw { display: flex; align-items: center; gap: 8px; }
    .dot { width: 11px; height: 11px; color: #ff4b4b; }
    .lv { font-size: 16px; font-weight: 700; letter-spacing: 3px; color: #ff8080; }
    .per { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #9be3b4; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .add { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 20px; font-weight: 700; color: #0a140e; background: #9be3b4; padding: 1px 7px; border-radius: 4px; }
    .runbar { position: absolute; left: 60px; right: 60px; bottom: 0; height: 3px; background: #9be3b4; }
    .state { z-index: 1; display: flex; align-items: center; justify-content: center; gap: 12px; line-height: 1; background: #9be3b4; color: #0a140e; }
    .st-b { font-size: 26px; font-weight: 700; letter-spacing: 4px; }
    .b-ht::after { content: " HALF TIME"; } .b-ht { font-size: 0; } .b-ht::after { font-size: 24px; }
    .pens { z-index: 2; background: #ffd21f; }
    .st-s { font-size: 18px; font-weight: 700; letter-spacing: 3px; }
    .st-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 32px; font-weight: 700; }
    .st-v b { padding: 0 6px; }
    .fin { z-index: 3; background: #fff; }
    .fin .st-b { font-size: 26px; letter-spacing: 6px; }
    .main { display: grid; grid-template-columns: 1fr 360px 1fr; align-items: start; margin-top: 26px; }
    .main .score { margin-top: 30px; }
    .side { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
    .crest { width: 86px; height: 100px; border-radius: 10px 10px 43px 43px; background-color: #59616e; box-shadow: inset 0 0 0 4px #fff3, 0 8px 20px #0007; }
    .nm { max-width: 100%; font-size: 36px; font-weight: 700; line-height: 1.05; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
    .cardline { display: flex; align-items: center; gap: 8px; min-height: 30px; }
    .cardline i { font-style: normal; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #b9d6c4; }
    .yl, .rl { display: none; }
    .cardline:has(.yc[style*="opacity: 1"]) .yl, .cardline:has(.rc[style*="opacity: 1"]) .rl { display: inline; }
    .score { display: flex; align-items: center; justify-content: center; gap: 22px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 150px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 8px 24px #0008; }
    .score b { font-size: 80px; color: #6aa384; }
    .halves { display: flex; justify-content: center; gap: 16px; margin-top: 24px; }
    .hrow { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 120px; padding: 10px 0; border-radius: 8px; background: #ffffff10; }
    .hl { font-size: 14px; font-weight: 700; letter-spacing: 3px; color: #9be3b4; }
    .hv { gap: 8px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 30px; font-weight: 700; }
    .hv b { color: #6aa384; }
    .nd { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 30px; color: #4d7a60; }
    .hrow:has(.hv[style*="opacity: 1"]) .nd { display: none; }
    .hrow.h3:not(:has(.hv[style*="opacity: 1"])), .hrow.h4:not(:has(.hv[style*="opacity: 1"])) { display: none; }
    .cards { display: flex; gap: 4px; flex: 0 0 auto; }
    .yc, .rc { display: flex; align-items: center; justify-content: center; width: 19px; height: 26px; border-radius: 2px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 16px; font-weight: 700; line-height: 1; box-shadow: 0 1px 2px #0006; }
    .yc { background: #ffd21f; color: #2a2300; }
    .rc { background: #e3262e; color: #fff; }
    .yc[style*="opacity: 0"], .rc[style*="opacity: 0"] { width: 0; margin-left: -4px; }
    .brk .b-ft, .brk .b-eh, .brk .b-aet { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]) .brk .b-ht { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .b-ft { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .brk .b-eh { display: inline; }
    .osb:has(.isGame4Started[style*="opacity: 1"]) .brk .b-aet { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]) .brk .b-ft { display: none; }
    .add-v:empty::before { content: "+0"; }
    .dot i { display: block; width: 100%; height: 100%; border-radius: 50%; background: currentColor; animation: osb-pulse 1.6s ease-in-out infinite; }
    @keyframes osb-pulse { 50% { transform: scale(.55); } }
    .osb:has(.isComplete[style*="opacity: 1"]) .dot i { animation: none; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="osb" aria-label="Soccer result card">
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="status">
    <div class="live"><span class="lvw isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"><span class="dot"><i></i></span><span class="lv">LIVE</span></span><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="add addedTimeVisible" data-osb-component="field" data-osb-field="addedTimeVisible" style="opacity: 0;"><span class="add-v addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="st-b b-ht">HT</span><span class="st-b b-ft">FT</span><span class="st-b b-eh">ET HT</span><span class="st-b b-aet">AET</span></div>
    <div class="state pens isShootoutActive" data-osb-component="field" data-osb-field="isShootoutActive" style="opacity: 0;"><span class="st-s">PENS</span><span class="st-v"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span><b>-</b><span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span></span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FULL TIME</span></div>
  </div>
  <div class="main">
    <div class="side A"><span class="crest jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="cardline"><span class="yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><i class="yl">YELLOW</i><span class="rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span><i class="rl">RED</i></span></div>
    <div class="score"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b>-</b><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
    <div class="side B"><span class="crest jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="cardline"><span class="yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><i class="yl">YELLOW</i><span class="rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span><i class="rl">RED</i></span></div>
  </div>
  <div class="halves"><div class="hrow h1"><span class="hl">1ST HALF</span><span class="hv isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"><span class="game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span><b>-</b><span class="game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="nd">&ndash;</span></div><div class="hrow h2"><span class="hl">2ND HALF</span><span class="hv isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"><span class="game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span><b>-</b><span class="game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="nd">&ndash;</span></div><div class="hrow h3"><span class="hl">EXTRA TIME 1</span><span class="hv isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"><span class="game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span><b>-</b><span class="game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="nd">&ndash;</span></div><div class="hrow h4"><span class="hl">EXTRA TIME 2</span><span class="hv isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"><span class="game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span><b>-</b><span class="game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="nd">&ndash;</span></div></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="homeSide" data-osb-component="field" data-osb-field="homeSide"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
