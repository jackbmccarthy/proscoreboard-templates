<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Time Poster</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
    .osb { position: relative; width: 1160px; border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, #0f2219, #08130d); color: #fff; box-shadow: 0 20px 50px #000c; }
    .hd { display: flex; align-items: center; justify-content: center; gap: 18px; height: 64px; padding: 0 32px; background: #06100a; border-bottom: 1px solid #23402f; white-space: nowrap; }
    .ev-n { font-size: 30px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .ev-r { font-size: 20px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #8fe0ab; }
    .ev-sep { width: 12px; height: 12px; border-radius: 50%; background: #2f5a41; }
    .stw { position: relative; display: flex; justify-content: center; padding-top: 22px; }
    .status { position: relative; display: grid; width: 470px; height: 72px; border-radius: 10px; overflow: hidden; background: #13261b; border: 1px solid #2f5a41; }
    .status > * { grid-area: 1 / 1; }
    .live { position: relative; display: flex; align-items: center; justify-content: center; gap: 18px; }
    .lvw { display: flex; align-items: center; gap: 9px; }
    .dot { width: 16px; height: 16px; color: #ff3346; border-radius: 50%; box-shadow: 0 0 0 3px #ff334633, 0 0 10px #ff3346; }
    .lv { font-size: 20px; font-weight: 700; letter-spacing: 3px; }
    .per { font-size: 24px; font-weight: 700; letter-spacing: 1px; color: #0b1a12; background: #8fe0ab; padding: 2px 9px 0; border-radius: 4px; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .add { position: absolute; top: 22px; left: calc(50% + 235px); display: flex; align-items: center; height: 72px; margin-left: -6px; padding: 0 16px 0 20px; background: #8fe0ab; color: #08110c; border-radius: 0 10px 10px 0; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 32px; font-weight: 700; }
    .add-v:empty::before { content: "+0"; }
    .runbar { position: absolute; left: 24px; right: 24px; bottom: 0; height: 4px; background: #8fe0ab; }
    .state { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1; background: #8fe0ab; color: #08110c; }
    .st-b { font-size: 42px; font-weight: 700; letter-spacing: 6px; white-space: nowrap; }
    .b-ht { font-size: 0; } .b-ht::after { content: "HALF TIME"; font-size: 42px; }
    .b-ft::after { content: " \00B7  EXTRA TIME NEXT"; font-size: 20px; letter-spacing: 2px; }
    .pens { z-index: 2; flex-direction: row; gap: 18px; background: #ffd21f; }
    .st-s { font-size: 26px; font-weight: 700; letter-spacing: 4px; }
    .st-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 44px; font-weight: 700; }
    .st-v b { padding: 0 6px; }
    .fin { z-index: 3; background: #fff; }
    .fin .st-b { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 40px; }
    .fpens { display: block; font-size: 20px; letter-spacing: 2px; color: #1f6b40; }
    .fpens:not([style*="opacity: 1"]) { display: none; }
    .band { display: grid; grid-template-columns: minmax(0, 1fr) 340px minmax(0, 1fr); height: 318px; }
    .pl { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-width: 0; padding: 0 22px; }
    .glow { position: absolute; left: 15%; right: 15%; top: 18%; bottom: 18%; border-radius: 50%; background-color: transparent; filter: blur(60px); opacity: .45; }
    .crest { position: relative; display: flex; width: 92px; height: 108px; padding: 5px; border-radius: 8px 8px 46px 46px; background: #fff; box-shadow: 0 8px 20px #0009; }
    .kit { flex: 1; border-radius: 5px 5px 42px 42px; background-color: #3a4a62; box-shadow: inset 0 -18px 30px #0000004d; }
    .pl.B .kit { background-color: #5e4b58; }
    .nm { position: relative; max-width: 100%; font-size: 38px; font-weight: 700; line-height: 1.02; letter-spacing: .5px; text-align: center; text-transform: uppercase; text-shadow: 0 2px 10px #0009; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: normal; word-break: normal; hyphens: none; text-wrap: balance; }
    .cards { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; height: 32px; }
    .ci { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; letter-spacing: 2px; color: #d3e6da; }
    .ci:not(:has([style*="opacity: 1"])) { display: none; }
    .yc, .rc { display: flex; align-items: center; justify-content: center; width: 22px; height: 30px; border-radius: 3px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 18px; font-weight: 700; line-height: 1; box-shadow: 0 1px 3px #0008; }
    .yc { background: #ffd21f; color: #2a2300; }
    .rc { background: #e3262e; color: #fff; }
    .win { position: relative; height: 28px; padding: 4px 16px 0; border-radius: 4px; background: #8fe0ab; color: #08110c; font-size: 20px; font-weight: 700; letter-spacing: 5px; }
    .score { display: flex; align-items: center; justify-content: center; gap: 22px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 172px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 6px 24px #000a; }
    .score b { font-size: 80px; color: #4f8a66; }
    .halves { display: flex; justify-content: center; gap: 16px; padding: 4px 28px 30px; }
    .hrow { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 210px; padding: 12px 0 10px; border-radius: 10px; background: #ffffff0d; border: 1px solid #ffffff1a; }
    .hl { font-size: 18px; font-weight: 700; letter-spacing: 3px; color: #8fe0ab; }
    .hv { gap: 12px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 38px; font-weight: 700; }
    .hv b { color: #4f8a66; }
    .nd { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 38px; color: #3f6b52; }
    .hrow:has(.hv[style*="opacity: 1"]) .nd { display: none; }
    .hrow.h3:not(:has(.hv[style*="opacity: 1"])), .hrow.h4:not(:has(.hv[style*="opacity: 1"])) { display: none; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .pl.B :is(.crest, .glow), .osb:has(.isBWinner[style*="opacity: 1"]) .pl.A :is(.crest, .glow) { filter: grayscale(.9) brightness(.6); }
    .osb:has(.isAWinner[style*="opacity: 1"]) .pl.B .glow, .osb:has(.isBWinner[style*="opacity: 1"]) .pl.A .glow { opacity: 0; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .pl.B .nm, .osb:has(.isBWinner[style*="opacity: 1"]) .pl.A .nm { color: #b9c6bf; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .score .currentBGameScore, .osb:has(.isBWinner[style*="opacity: 1"]) .score .currentAGameScore { color: #9fb0a6; }
    .brk .b-ft, .brk .b-eh, .brk .b-aet { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]) .brk .b-ht { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .b-ft { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .brk .b-eh { display: inline; }
    .osb:has(.isGame4Started[style*="opacity: 1"]) .brk .b-aet { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]) .brk .b-ft { display: none; }
    .brk .b-ft, .brk .b-eh, .brk .b-aet { font-size: 34px; }
    .dot i { display: block; width: 100%; height: 100%; border-radius: 50%; background: currentColor; animation: osb-pulse 1.6s ease-in-out infinite; }
    @keyframes osb-pulse { 50% { opacity: .4; } }
    .osb:has(.isComplete[style*="opacity: 1"]) .dot i { animation: none; }
    body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted { opacity: 0 !important; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev-sep { display: none; }
    .hd:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: block; }
    .hd:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { visibility: hidden; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="osb" aria-label="Soccer result card">
  <div class="hd"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-sep"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="stw"><div class="status">
    <div class="live"><span class="lvw isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"><span class="dot"><i></i></span><span class="lv">LIVE</span></span><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="st-b b-ht">HT</span><span class="st-b b-ft">FULL TIME</span><span class="st-b b-eh">EXTRA TIME HT</span><span class="st-b b-aet">AFTER EXTRA TIME</span></div>
    <div class="state pens isShootoutActive" data-osb-component="field" data-osb-field="isShootoutActive" style="opacity: 0;"><span class="st-s">PENALTIES</span><span class="st-v"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span><b>-</b><span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span></span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FULL TIME<span class="isDecidedOnPenalties fpens" data-osb-component="field" data-osb-field="isDecidedOnPenalties" style="opacity:0"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span>-<span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span> ON PENALTIES</span></span></div>
  </div><span class="add addedTimeVisible" data-osb-component="field" data-osb-field="addedTimeVisible" style="opacity: 0;"><span class="add-v addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span></div>
  <div class="band"><div class="pl A"><span class="glow jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="win isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity: 0;">WINNER</span><span class="crest"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="cards"><span class="ci"><span class="yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span>YELLOW</span><span class="ci"><span class="rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span>RED</span></span></div><div class="score"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b>-</b><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div><div class="pl B"><span class="glow jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="win isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity: 0;">WINNER</span><span class="crest"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="cards"><span class="ci"><span class="yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span>YELLOW</span><span class="ci"><span class="rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span>RED</span></span></div></div>
  <div class="halves"><div class="hrow h1"><span class="hl">1ST HALF</span><span class="hv isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"><span class="game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span><b>-</b><span class="game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="nd">&ndash;</span></div><div class="hrow h2"><span class="hl">2ND HALF</span><span class="hv isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"><span class="game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span><b>-</b><span class="game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="nd">&ndash;</span></div><div class="hrow h3"><span class="hl">EXTRA TIME 1</span><span class="hv isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"><span class="game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span><b>-</b><span class="game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="nd">&ndash;</span></div><div class="hrow h4"><span class="hl">EXTRA TIME 2</span><span class="hv isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"><span class="game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span><b>-</b><span class="game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="nd">&ndash;</span></div></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="homeSide" data-osb-component="field" data-osb-field="homeSide"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
