<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Time Poster</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    .osb { position: relative; width: 1120px; border-radius: 14px; overflow: hidden; background: #0d1a13; color: #fff; box-shadow: 0 20px 50px #000c; }
    .hd { display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 76px; padding: 0 28px; background: #08110c; border-bottom: 1px solid #23402f; }
    .ev { display: flex; align-items: baseline; gap: 16px; min-width: 0; white-space: nowrap; }
    .ev .eventName { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
    .ev .matchRound { flex: none; font-size: 17px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #8fe0ab; }
    .stw { position: relative; flex: none; }
    .stw:has(.add[style*="opacity: 1"]) .status { border-radius: 0 8px 8px 0; }
    .status { display: grid; min-width: 250px; height: 50px; border-radius: 8px; overflow: hidden; background: #13261b; border: 1px solid #2f5a41; }
    .status > * { grid-area: 1 / 1; }
    .live { position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 18px; }
    .lvw { display: flex; align-items: center; gap: 8px; }
    .dot { width: 13px; height: 13px; color: #ff3346; filter: drop-shadow(0 0 4px #ff3346); }
    .lv { font-size: 16px; font-weight: 800; letter-spacing: 2px; color: #fff; }
    .per { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #8fe0ab; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .add { position: absolute; top: 0; bottom: 0; right: 100%; margin-right: -1px; display: flex; align-items: center; padding: 0 12px; background: #8fe0ab; color: #08110c; border-radius: 8px 0 0 8px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 22px; font-weight: 700; }
    .add-v:empty::before { content: "+0"; }
    .runbar { position: absolute; left: 18px; right: 18px; bottom: 0; height: 3px; background: #8fe0ab; }
    .state { z-index: 1; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 18px; line-height: 1; background: #8fe0ab; color: #08110c; }
    .st-b { font-size: 22px; font-weight: 800; letter-spacing: 3px; white-space: nowrap; }
    .b-ht::after { content: "HALF TIME"; } .b-ht { font-size: 0; } .b-ht::after { font-size: 22px; }
    .b-ft::after { content: " · EXTRA TIME NEXT"; font-size: 16px; letter-spacing: 2px; }
    .pens { z-index: 2; background: #ffd21f; }
    .st-s { font-size: 18px; font-weight: 800; letter-spacing: 3px; }
    .st-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 30px; font-weight: 700; }
    .st-v b { padding: 0 6px; }
    .fin { z-index: 3; background: #fff; }
    .fin .st-b { display: flex; flex-direction: column; align-items: center; gap: 3px; letter-spacing: 4px; }
    .fpens { display: block; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 17px; letter-spacing: 1px; color: #2f6d47; }
    .fpens:not([style*="opacity: 1"]) { display: none; }
    .band { display: grid; grid-template-columns: minmax(0, 1fr) 300px minmax(0, 1fr); height: 250px; }
    .pl { position: relative; display: grid; min-width: 0; overflow: hidden; }
    .pl > * { grid-area: 1 / 1; }
    .pl.A { background: #3a4a62; } .pl.B { background: #5e4b58; }
    .wash { position: relative; background-color: transparent; }
    .wash::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0000 30%, #0008); }
    .pl.B .wash::after { background: linear-gradient(270deg, #0000 30%, #0008); }
    .nm { position: relative; align-self: center; padding: 0 26px; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 38px; font-weight: 700; line-height: 1.02; letter-spacing: .5px; text-transform: uppercase; text-shadow: 0 2px 10px #0009; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: normal; word-break: normal; hyphens: none; text-wrap: balance; }
    .pl.A .nm { text-align: right; }
    .win { position: relative; align-self: end; height: 10px; background: #ffd21f; }
    .score { display: flex; align-items: center; justify-content: center; gap: 18px; background: #08110c; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 150px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .score b { font-size: 70px; color: #4f8a66; }
    .disc { display: grid; grid-template-columns: minmax(0, 1fr) 300px minmax(0, 1fr); height: 54px; background: #102118; border-bottom: 1px solid #23402f; }
    .cardline { display: flex; align-items: center; gap: 10px; padding: 0 34px; }
    .cardline.A { justify-content: flex-end; }
    .cardline i { font-style: normal; font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #b9d6c4; }
    .yl, .rl { display: none; }
    .cardline:has(.yc[style*="opacity: 1"]) .yl, .cardline:has(.rc[style*="opacity: 1"]) .rl { display: inline; }
    .rc { margin-left: 10px; }
    .yc, .rc { display: flex; align-items: center; justify-content: center; width: 20px; height: 28px; border-radius: 2px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 17px; font-weight: 700; line-height: 1; box-shadow: 0 1px 2px #0006; }
    .yc { background: #ffd21f; color: #2a2300; }
    .rc { background: #e3262e; color: #fff; }
    .yc[style*="opacity: 0"], .rc[style*="opacity: 0"] { display: none; }
    .dl { display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; letter-spacing: 3px; color: #8fe0ab; }
    .halves { display: flex; justify-content: center; gap: 14px; padding: 22px 28px 26px; }
    .hrow { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 180px; padding: 12px 0 10px; border-radius: 8px; background: #ffffff0d; border: 1px solid #ffffff14; }
    .hl { font-size: 16px; font-weight: 700; letter-spacing: 3px; color: #8fe0ab; }
    .hv { gap: 10px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 32px; font-weight: 700; }
    .hv b { color: #4f8a66; }
    .nd { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 32px; color: #3f6b52; }
    .hrow:has(.hv[style*="opacity: 1"]) .nd { display: none; }
    .hrow.h3:not(:has(.hv[style*="opacity: 1"])), .hrow.h4:not(:has(.hv[style*="opacity: 1"])) { display: none; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .pl.B :is(.wash, .nm), .osb:has(.isBWinner[style*="opacity: 1"]) .pl.A :is(.wash, .nm) { opacity: .45; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .cardline.B, .osb:has(.isBWinner[style*="opacity: 1"]) .cardline.A { opacity: .6; }
    .brk .b-ft, .brk .b-eh, .brk .b-aet { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]) .brk .b-ht { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .b-ft { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .brk .b-eh { display: inline; }
    .osb:has(.isGame4Started[style*="opacity: 1"]) .brk .b-aet { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]) .brk .b-ft { display: none; }
    .dot i { display: block; width: 100%; height: 100%; border-radius: 50%; background: currentColor; animation: osb-pulse 1.6s ease-in-out infinite; }
    @keyframes osb-pulse { 50% { opacity: .4; } }
    .osb:has(.isComplete[style*="opacity: 1"]) .dot i { animation: none; }
    body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted { opacity: 0 !important; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="osb" aria-label="Soccer result card">
  <div class="hd">
    <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
    <div class="stw"><div class="status">
      <div class="live"><span class="lvw isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"><span class="dot"><i></i></span><span class="lv">LIVE</span></span><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
      <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="st-b b-ht">HT</span><span class="st-b b-ft">FULL TIME</span><span class="st-b b-eh">EXTRA TIME HT</span><span class="st-b b-aet">AFTER EXTRA TIME</span></div>
      <div class="state pens isShootoutActive" data-osb-component="field" data-osb-field="isShootoutActive" style="opacity: 0;"><span class="st-s">PENALTIES</span><span class="st-v"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span><b>-</b><span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span></span></div>
      <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FULL TIME<span class="isDecidedOnPenalties fpens" data-osb-component="field" data-osb-field="isDecidedOnPenalties" style="opacity:0"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span>-<span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span> ON PENALTIES</span></span></div>
    </div><span class="add addedTimeVisible" data-osb-component="field" data-osb-field="addedTimeVisible" style="opacity: 0;"><span class="add-v addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span></div>
  </div>
  <div class="band">
    <div class="pl A"><span class="wash jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="win isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity: 0;"></span></div>
    <div class="score"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b>-</b><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
    <div class="pl B"><span class="wash jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="win isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity: 0;"></span></div>
  </div>
  <div class="disc">
    <div class="cardline A"><span class="yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><i class="yl">YELLOW</i><span class="rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span><i class="rl">RED</i></div>
    <div class="dl">DISCIPLINE</div>
    <div class="cardline B"><span class="yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><i class="yl">YELLOW</i><span class="rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span><i class="rl">RED</i></div>
  </div>
  <div class="halves"><div class="hrow h1"><span class="hl">1ST HALF</span><span class="hv isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"><span class="game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span><b>-</b><span class="game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="nd">&ndash;</span></div><div class="hrow h2"><span class="hl">2ND HALF</span><span class="hv isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"><span class="game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span><b>-</b><span class="game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="nd">&ndash;</span></div><div class="hrow h3"><span class="hl">EXTRA TIME 1</span><span class="hv isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"><span class="game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span><b>-</b><span class="game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="nd">&ndash;</span></div><div class="hrow h4"><span class="hl">EXTRA TIME 2</span><span class="hv isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"><span class="game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span><b>-</b><span class="game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="nd">&ndash;</span></div></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="homeSide" data-osb-component="field" data-osb-field="homeSide"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
