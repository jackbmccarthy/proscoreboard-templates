<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full-time Poster</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { font-family: "Didot", "Bodoni 72", Georgia, serif; }
    .screen { position: relative; display: grid; grid-template-columns: 70px 1fr 70px; width: 100vw; height: 100vh; background: #101010; color: #f4efe6; }
    .col { position: relative; background: #2b2b2b; }
    .kit { position: absolute; inset: 0; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 4vh 4vw; }
    .ev { display: flex; gap: 18px; font-family: "Avenir Next", Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; }
    .ev-round { color: #d94a2b; }
    .flagslot { display: grid; justify-items: center; min-height: 34px; }
    .flagslot > * { grid-area: 1 / 1; }
    .flag { padding: 4px 18px; border: 2px solid #d94a2b; color: #d94a2b; font-family: "Avenir Next", Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 6px; }
    .names { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 30px; width: 100%; }
    .nm { min-width: 0; font-size: 64px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .a .nm { text-align: right; }
    .side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .a.side { align-items: flex-end; }
    .cards { display: flex; gap: 6px; min-height: 22px; }
    .card { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 22px; border-radius: 2px; font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; }
    .card.red { background: #e5262b; }
    .card.yellow { background: #f7d117; color: #101010; }
    .score { display: flex; align-items: center; gap: 26px; font-size: 200px; line-height: .9; font-variant-numeric: lining-nums tabular-nums; }
    .score .dash { width: 40px; height: 6px; background: #d94a2b; }
    .ht { font-family: "Avenir Next", Arial, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 4px; color: #bdb6aa; }
    .ht b { color: #f4efe6; }
    .ledger { display: flex; gap: 0; border-top: 1px solid #f4efe633; border-bottom: 1px solid #f4efe633; font-family: "Avenir Next", Arial, sans-serif; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 150px; padding: 12px 18px; }
    .cell + .cell, .otwrap { border-left: 1px solid #f4efe633; }
    .cell i { font-style: normal; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #d94a2b; }
    .cell span.pair { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .clockline { display: flex; align-items: center; gap: 12px; font-family: "Avenir Next", Arial, sans-serif; font-size: 18px; letter-spacing: 2px; color: #bdb6aa; }
    .gc { color: #f4efe6; font-variant-numeric: tabular-nums; }
    .added { color: #d94a2b; }
    .added:has(.at:empty) { display: none; }
    .half:empty { display: none; }
    .pens { display: none; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<main class="screen" aria-label="Soccer full-time poster">
  <div class="col"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></div>
  <section class="center">
    <span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
    <span class="flagslot"><span class="flag isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">HALF-TIME</span><span class="flag isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;">FULL TIME</span></span>
    <div class="names">
      <div class="side a"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="cards"><span class="card yellow isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="card red isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span></span></div>
      <span class="score"><span class="sa currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b class="dash"></b><span class="sb currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span>
      <div class="side b"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="cards"><span class="card yellow isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="card red isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span></span></div>
    </div>
    <div class="ht">HT <b><span class="ga game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span>-<span class="gb game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></b></div>
    <div class="ledger">
      <span class="cell"><i>1ST HALF</i><span class="pair"><span class="ga game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span> - <span class="gb game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></span>
      <span class="cell"><i>2ND HALF</i><span class="pair"><span class="ga game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span> - <span class="gb game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></span>
      <span class="otwrap isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"><span class="cell"><i>ET 1</i><span class="pair"><span class="ga game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span> - <span class="gb game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></span></span>
      <span class="otwrap isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"><span class="cell"><i>ET 2</i><span class="pair"><span class="ga game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span> - <span class="gb game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></span></span>
    </div>
    <div class="clockline"><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="added addedTimeVisible"><span class="at addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="half periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"></span></div>
    <span class="pens shootoutAttempts"><b class="pens-l">PENS</b><span class="pen-a shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore"></span><b class="pens-d">-</b><span class="pen-b shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore"></span></span>
  </section>
  <div class="col"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</main>
</body>
</html>
