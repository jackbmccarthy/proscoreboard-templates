<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wire Numeral Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { color: #fff; font-family: Arial, Helvetica, sans-serif; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { display: flex; flex-direction: column; width: 100%; max-width: 740px; background: transparent; }
.title { text-align: center; font-size: 70px; font-weight: 700; letter-spacing: .15em; padding-left: .15em; line-height: 1; margin-bottom: 56px; }
.teams { display: flex; flex-direction: column; gap: 50px; }
.team { display: flex; align-items: center; height: 275px; }
.primary-track { display: flex; flex-direction: column; align-items: center; flex: 0 0 320px; min-width: 0; }
.primary-score { display: block; width: 100%; height: 242px; text-align: center; font-family: "Arial Black", Arial, sans-serif; font-size: 250px; font-weight: 900; line-height: .84; letter-spacing: -.07em; color: transparent; -webkit-text-stroke: 5px #86f4f3; font-variant-numeric: tabular-nums; transform: scaleY(1.2); transform-origin: center; }
.label { font-size: 32px; line-height: 1; font-weight: 600; letter-spacing: .17em; }
.points-label { margin-top: 12px; }
.details { display: flex; flex-direction: column; align-items: flex-start; flex: 1 1 0; min-width: 0; padding-left: 8px; }
.name { display: block; width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 96px; font-weight: 700; line-height: 1.12; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.identity-rule { display: block; width: 225px; max-width: 80%; height: 7px; flex: 0 0 7px; background: #86f4f3; margin-top: 14px; margin-bottom: 16px; }
.match-score { display: block; width: 115px; height: 75px; text-align: left; font-size: 72px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; padding-left: 12px; }
.sets-label { padding-left: 13px; }
.set-footer { display: flex; justify-content: center; align-items: center; gap: 24px; margin-top: 52px; font-size: 44px; font-weight: 700; letter-spacing: .13em; line-height: 1; }
.set-value { display: block; width: 55px; text-align: center; font-size: 58px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 780px) {
  .title { font-size: clamp(30px, 8vw, 70px); }
  .primary-track { flex-basis: 43%; }
  .primary-score { font-size: clamp(85px, 29vw, 225px); }
  .name { font-size: clamp(34px, 10vw, 80px); }
}
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .title { font-size: 29px; margin-bottom: 32px; letter-spacing: .1em; }
  .teams { gap: 35px; }
  .team { height: 168px; }
  .primary-track { flex-basis: 43%; }
  .primary-score { height: 133px; font-size: 120px; -webkit-text-stroke-width: 2.5px; transform: scaleY(1.25); }
  .label { font-size: 15px; letter-spacing: .12em; }
  .points-label { margin-top: 10px; }
  .details { padding-left: 10px; }
  .name { font-size: 37px; }
  .identity-rule { width: 115px; height: 4px; flex-basis: 4px; margin-top: 12px; margin-bottom: 12px; }
  .match-score { font-size: 35px; width: 75px; height: 39px; padding-left: 4px; }
  .sets-label { padding-left: 4px; }
  .set-footer { margin-top: 32px; font-size: 25px; gap: 12px; }
  .set-value { width: 35px; font-size: 34px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="label points-label">POINTS</span></div>
          <div class="details columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="identity-rule jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="label sets-label">SETS</span></div>
        </div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="label points-label">POINTS</span></div>
          <div class="details columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="identity-rule jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="label sets-label">SETS</span></div>
        </div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
