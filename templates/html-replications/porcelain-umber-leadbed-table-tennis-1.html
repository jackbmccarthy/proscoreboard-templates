<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TABLE TENNIS · Porcelain Umber Leadbed</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#403938}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent}
.board{width:58vw;max-width:1120px;min-width:0;overflow:hidden;border:1px solid #aeb9b3;border-radius:5px;background:#e7e9e5;container-type:inline-size}
.board.horizontal{width:84vw;max-width:1720px}
.utility{position:relative;height:6.6cqw;min-height:38px;display:flex;align-items:center;min-width:0;padding:0 2.2cqw;background:#e7e9e5;border-bottom:1px solid #aeb9b3}
.sport-tab{font-size:3.4cqw;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:0}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{height:14cqw;min-height:82px;display:flex;align-items:stretch;flex:0 0 auto;min-width:0;background:#e7e9e5}
.lane+.lane{border-top:1px solid #aeb9b3}
.identity{display:block;flex:0 0 2.65cqw;min-width:7px;background:#3186a8}
.jerseyColorB{background:#c96b71}
.primary-track{display:flex;flex:0 0 20.5%;width:20.5%;min-width:0;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#403938;color:#f8f6f2;font-variant-numeric:tabular-nums}
.primary-number{display:block;max-width:100%;font-size:8.3cqw;font-weight:700;line-height:.9;white-space:nowrap;font-variant-numeric:tabular-nums}
.primary-caption{display:block;margin-top:.5cqw;font-size:2.2cqw;font-weight:700;line-height:1;white-space:nowrap}
.namebed{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.55cqw;overflow:hidden;padding:0 3.2cqw;background:#e7e9e5}
.name-line{display:flex;align-items:center;gap:1cqw;min-width:0}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.55cqw;font-weight:700;line-height:1.08;color:#403938}
.combinedAName:empty::before{content:"Player A"}
.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 1.8cqw;width:1.8cqw;text-align:center;font-size:1.45cqw;line-height:1;color:#566862}
.support-line{display:flex;align-items:baseline;gap:.9cqw;min-width:0;white-space:nowrap;line-height:1.12;color:#403938;font-variant-numeric:tabular-nums}
.support-caption{font-size:2.25cqw;font-weight:700}
.support-number{font-size:2.45cqw;font-weight:700;font-variant-numeric:tabular-nums}
.point-slot{position:absolute;right:2cqw;top:50%;transform:translateY(-50%);width:20cqw;height:2em;text-align:right;pointer-events:none}
.point-state{position:absolute;inset:0;background:#e7e9e5;color:#403938;font-size:1.5cqw;font-weight:700;line-height:2em;white-space:nowrap}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.horizontal .utility{height:3.8cqw;min-height:38px}
.horizontal .sport-tab{font-size:2.2cqw}
.horizontal .lanes{flex-direction:row}
.horizontal .lane{height:9.6cqw;flex:1 1 50%}
.horizontal .lane+.lane{border-top:0;border-left:1px solid #aeb9b3}
.horizontal .identity{flex-basis:1.75cqw}
.horizontal .primary-track{flex-basis:23%;width:23%}
.horizontal .primary-number{font-size:5.6cqw}
.horizontal .primary-caption{font-size:1.5cqw;margin-top:.2cqw}
.horizontal .namebed{padding:0 1.7cqw;gap:.3cqw}
.horizontal .name{font-size:3.5cqw}
.horizontal .support-caption{font-size:1.7cqw}
.horizontal .support-number{font-size:1.9cqw}
.horizontal .serve{flex-basis:1.25cqw;width:1.25cqw;font-size:1.1cqw}
.horizontal .point-state{font-size:1.1cqw}
@media(max-width:650px){
 .board,.board.horizontal{width:94vw}
 .utility,.horizontal .utility{height:10.8cqw;min-height:39px;padding:0 3cqw}
 .sport-tab,.horizontal .sport-tab{font-size:4.2cqw}
 .lanes,.horizontal .lanes{flex-direction:column}
 .lane,.horizontal .lane{height:23.5cqw;min-height:85px;flex:0 0 auto}
 .lane+.lane,.horizontal .lane+.lane{border-left:0;border-top:1px solid #aeb9b3}
 .identity,.horizontal .identity{flex-basis:2.2cqw}
 .primary-track,.horizontal .primary-track{flex-basis:24%;width:24%}
 .primary-number,.horizontal .primary-number{font-size:9.6cqw}
 .primary-caption,.horizontal .primary-caption{font-size:2.6cqw;margin-top:.2cqw}
 .namebed,.horizontal .namebed{padding:0 3cqw;gap:.4cqw}
 .name,.horizontal .name{font-size:6.1cqw}
 .support-caption,.horizontal .support-caption{font-size:3cqw}
 .support-number,.horizontal .support-number{font-size:3.3cqw}
 .serve,.horizontal .serve{flex-basis:2.2cqw;width:2.2cqw;font-size:1.9cqw}
 .point-slot{right:3cqw;width:30cqw}
 .point-state,.horizontal .point-state{font-size:2.1cqw}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage"><article class="board columnContainer paired" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <header class="utility rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tab">TABLE TENNIS</span><span class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></span></header>
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
    <div class="lane rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA" aria-hidden="true"></span>
      <div class="primary-track"><span class="primary-number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption">POINTS</span></div>
      <div class="namebed"><div class="name-line"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true" aria-label="Serving">●</span></div><div class="support-line"><span class="support-caption">GAMES:</span><span class="support-number currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div>
    </div>
    <div class="lane rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB" aria-hidden="true"></span>
      <div class="primary-track"><span class="primary-number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption">POINTS</span></div>
      <div class="namebed"><div class="name-line"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;" aria-label="Serving">●</span></div><div class="support-line"><span class="support-caption">GAMES:</span><span class="support-number currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
    </div>
  </div>
</article></main>
</body>
</html>
