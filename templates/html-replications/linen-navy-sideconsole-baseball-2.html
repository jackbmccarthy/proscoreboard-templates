<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baseball — Linen Navy Sideconsole 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.board{--ink:#1f3242;--linen:#e7dfd0;--steel:#aebfc2;display:flex;width:min(84vw,1610px);height:min(16vw,258px);max-width:100%;min-width:0;overflow:hidden;border-radius:3px;background:var(--ink);color:#f8fafb;container-type:inline-size}
.console{flex:0 0 15.2%;min-width:0;display:flex;flex-direction:column;background:var(--linen);color:#193247;padding:1.7cqw 1.55cqw}
.sport-tag{display:block;white-space:nowrap;font-size:1.7cqw;font-weight:800;line-height:1;letter-spacing:-.035em}
.counter-list{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-height:0;margin-top:1.35cqw}
.counter-line{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:1.55cqw;font-weight:700;line-height:1}
.counter-value{font-variant-numeric:tabular-nums}
.competitors{display:flex;flex:1 1 auto;min-width:0;flex-direction:row}
.lane{display:flex;align-items:center;flex:1 1 0;min-width:0;background:var(--ink)}
.lane+.lane{border-left:2px solid #7898a9}
.identity{display:block;flex:0 0 1.35cqw;height:52%;margin-left:1.9cqw;border-radius:1px}
.jerseyColorA{background:#3288ee}.jerseyColorB{background:#ef6c65}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1.8cqw;font-size:3.8cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support{display:flex;flex:0 0 6.3cqw;height:54%;min-width:0;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;background:var(--steel);color:#173248}
.support-value{display:block;max-width:100%;overflow:hidden;font-size:5.5cqw;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
.support-caption{font-size:1.5cqw;font-weight:800;line-height:1.1}
.primary{display:flex;flex:0 0 11.5cqw;min-width:0;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.primary-value{display:block;max-width:100%;overflow:hidden;text-align:center;font-size:6cqw;font-weight:800;line-height:.96;font-variant-numeric:tabular-nums}
.primary-caption{font-size:1.85cqw;font-weight:700;line-height:1.15}
.retained,.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){
.stage{padding:6px}
.board{width:100%;height:168px}
.console{flex-basis:27%;padding:11px 6px}
.sport-tag{font-size:13px;letter-spacing:-.05em}
.counter-list{margin-top:10px}
.counter-line{font-size:9px}
.competitors{flex-direction:column}
.lane+.lane{border-left:0;border-top:2px solid #7898a9}
.identity{flex-basis:5px;margin-left:5px}
.name{padding:0 8px;font-size:clamp(16px,5vw,25px)}
.support{flex-basis:28px;height:51%}
.support-value{font-size:24px}
.support-caption{font-size:7px}
.primary{flex-basis:54px}
.primary-value{font-size:26px}
.primary-caption{font-size:7px}
}
@media(max-width:390px){.console{flex-basis:27%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
  <article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="baseball scoreboard">
    <aside class="console columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Editable static game counters">
      <span class="sport-tag" data-osb-component="text">BASEBALL</span>
      <div class="counter-list columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="counter-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">INNING</span><strong class="counter-value" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></div>
        <div class="counter-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">BALLS</span><strong class="counter-value" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></div>
        <div class="counter-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">STRIKES</span><strong class="counter-value" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></div>
        <div class="counter-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">OUTS</span><strong class="counter-value" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></div>
      </div>
    </aside>
    <div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <div class="lane rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
        <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
        <div class="support columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="support-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hits-a">0</strong><span class="support-caption" data-osb-component="text">HITS</span></div>
        <div class="primary columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption" data-osb-component="text">RUNS</span></div>
        <span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span>
      </div>
      <div class="lane rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
        <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
        <div class="support columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="support-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hits-b">0</strong><span class="support-caption" data-osb-component="text">HITS</span></div>
        <div class="primary columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption" data-osb-component="text">RUNS</span></div>
        <span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span>
      </div>
    </div>
    <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
  </article>
</main>
</body>
</html>
