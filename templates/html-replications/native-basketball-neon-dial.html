<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Dial</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 28px 24px 24px; font-family: "Futura", "Century Gothic", "Trebuchet MS", sans-serif; }
    .bug { position: relative; display: flex; align-items: center; gap: 10px; width: 470px; padding: 10px; background: linear-gradient(135deg, #22123f, #120a24); border: 1px solid #3a2768; border-radius: 22px; color: #f5f3ff; box-shadow: 0 0 0 1px #27e1ff22, 0 10px 24px #0009; }
    .teams { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .row { position: relative; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 4px 0 14px; background: #ffffff0d; border-radius: 23px; }
    .nm { flex: 1; min-width: 0; font-size: 21px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bonus { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #ff3d9a; border: 1px solid #ff3d9a; border-radius: 9px; padding: 2px 6px; }
    .bonus:empty { display: none; }
    .chip { position: relative; display: flex; align-items: center; justify-content: center; width: 70px; height: 38px; border-radius: 19px; overflow: hidden; background: #2b1d4f; }
    .kit { position: absolute; inset: 0; opacity: .9; }
    .pts { position: relative; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px #0008; }
    .dial { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 118px; }
    .ring { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; border: 3px solid #27e1ff; box-shadow: 0 0 12px #27e1ff88, inset 0 0 10px #27e1ff44; font-size: 28px; font-weight: 700; color: #27e1ff; }
    .ring:has(.sc-v:empty) { border-color: #3a2768; box-shadow: none; }
    .gc { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .colon { color: #ff3d9a; }
    .per { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #120a24; background: #27e1ff; border-radius: 8px; padding: 1px 8px; }
    .per:empty { display: none; }
    .rail { position: absolute; left: 18px; right: 18px; bottom: -22px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #b9b2d9; }
    .rail .s { display: flex; gap: 8px; }
    .fl, .tol-v { color: #fff; }
    .tol::before { content: "TO "; }
    .tol:has(.tol-v:empty) { display: none; }
    .pips { display: flex; gap: 4px; align-items: center; }
    .pip { position: relative; width: 8px; height: 8px; border-radius: 50%; background: #3a2768; }
    .pip-on { position: absolute; inset: 0; border-radius: 50%; background: #27e1ff; box-shadow: 0 0 6px #27e1ff; }
    .pip.pip-ot { width: auto; height: auto; border-radius: 6px; padding: 0 4px; background: #ff3d9a; color: #fff; font-size: 9px; }
    .poss { color: #27e1ff; }
    .poss::before { content: "POSS "; color: #b9b2d9; }
    .poss:has(.poss-v:empty) { display: none; }
    .to-flag { position: absolute; inset: 0; align-items: center; justify-content: center; gap: 8px; border-radius: 23px; background: #ff3d9a; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 3px; }
    .brk { position: absolute; right: 22px; top: -18px; background: #27e1ff; color: #120a24; font-size: 11px; font-weight: 700; letter-spacing: 2px; padding: 3px 10px; border-radius: 9px; }
    .ev { position: absolute; left: 22px; top: -18px; display: flex; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #f5f3ff; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
    .ev-round { color: #27e1ff; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="bug" aria-label="Basketball scorebug">
  <span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
  <div class="teams">
    <div class="row"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span><span class="chip"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><div class="to-flag isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
    <div class="row"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span><span class="chip"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span><div class="to-flag isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
  </div>
  <div class="dial"><span class="ring"><span class="sc-v" data-osb-static="true" data-sport-stat="shotClock"></span></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span></div>
  <div class="rail"><span class="s">FOULS <span class="fl teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</span><span class="tol"><span class="tol-v timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span></span></span><span class="s"><span class="pips"><span class="pip"><span class="pip-on isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="pip pip-ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span><span class="poss"><span class="poss-v possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span></span></span><span class="s">FOULS <span class="fl teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</span><span class="tol"><span class="tol-v timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span></span></span></div>
  <span class="brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">BREAK</span>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><span class="possession" data-osb-component="field" data-osb-field="possession"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
