<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Dial</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 28px 28px; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
    .osb { position: relative; width: 500px; padding: 10px; border-radius: 18px; background: linear-gradient(160deg, #23124a, #120a26); border: 2px solid #3b2a6e; color: #f5f3ff; box-shadow: 0 0 0 1px #000, 0 10px 24px #000b, 0 0 22px #27e1ff33; }
    .ev { display: flex; gap: 10px; justify-content: center; margin: -2px 0 8px; font-size: 15px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #b9b2d9; }
    .ev .matchRound { color: #27e1ff; }
    .head { display: grid; height: 74px; margin-bottom: 8px; border-radius: 12px; background: #0b0619; border: 1px solid #3b2a6e; overflow: hidden; }
    .head > * { grid-area: 1 / 1; }
    .live { position: relative; display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; justify-items: center; }
    .per { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #0b0619; background: #27e1ff; padding: 3px 10px 2px; border-radius: 999px; box-shadow: 0 0 10px #27e1ff88; }
    .per:empty { visibility: hidden; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 52px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 14px #27e1ff66; }
    .gc b { color: #27e1ff; padding: 0 2px; }
    .dial { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 58px; height: 58px; border-radius: 50%; border: 3px solid #ff3d9a; box-shadow: 0 0 12px #ff3d9a88, inset 0 0 8px #ff3d9a55; line-height: 1; }
    .dial i { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #ff9cc9; }
    .shot-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 24px; font-weight: 700; color: #fff; }
    .run-shot { position: absolute; inset: -7px; border-radius: 50%; border: 2px dashed #ff3d9a; }
    .runbar { position: absolute; left: 30%; right: 30%; bottom: 5px; height: 3px; border-radius: 2px; background: #27e1ff; box-shadow: 0 0 8px #27e1ff; }
    .prog { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; }
    .q { position: relative; width: 16px; height: 3px; border-radius: 2px; background: #3b2a6e; }
    .q > span { position: absolute; inset: 0; border-radius: 2px; background: #27e1ff; }
    .ot { font-size: 9px; font-weight: 700; padding: 1px 3px 0; line-height: 1; border-radius: 2px; background: #ff3d9a; color: #fff; }
    .state { z-index: 1; display: flex; align-items: center; justify-content: center; gap: 12px; line-height: 1; background: linear-gradient(90deg, #27e1ff, #8a6bff); color: #0b0619; }
    .st-s { font-size: 18px; font-weight: 700; letter-spacing: 3px; }
    .st-b { font-size: 40px; font-weight: 700; }
    .fin { z-index: 2; background: linear-gradient(90deg, #ff3d9a, #8a6bff); color: #fff; }
    .fin-ot { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
    .cap { position: relative; display: grid; grid-template-columns: 14px 22px minmax(0, 1fr) 92px 70px; align-items: center; height: 58px; padding-left: 10px; border-radius: 999px; background: #1c0f3a; border: 1px solid #3b2a6e; }
    .cap + .cap { margin-top: 6px; }
    .kit { width: 14px; height: 14px; border-radius: 50%; background-color: #59616e; box-shadow: 0 0 10px #fff6; }
    .poss { display: flex; justify-content: center; }
    .arrow { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 10px solid #27e1ff; filter: drop-shadow(0 0 4px #27e1ff); }
    .nm { padding-right: 6px; font-size: 23px; font-weight: 700; line-height: 1.02; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
    .info { position: relative; align-self: stretch; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 6px; padding-right: 10px; }
    .pips { display: flex; gap: 4px; height: 7px; }
    .pip { width: 7px; height: 7px; border-radius: 50%; background: #27e1ff; box-shadow: 0 0 6px #27e1ff; }
    .fl { display: flex; align-items: center; gap: 5px; font-size: 16px; font-weight: 600; color: #b9b2d9; }
    .fl i { font-style: normal; letter-spacing: 1px; }
    .fl b { color: #fff; }
    .bonus { font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 2px 6px 1px; border-radius: 999px; background: #ff3d9a; color: #fff; }
    .bonus:empty { display: none; }
    .to { position: absolute; inset: 7px 6px 7px -4px; align-items: center; justify-content: center; flex-direction: column; border-radius: 999px; background: #27e1ff; color: #0b0619; line-height: 1; }
    .to-l { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
    .to-c { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 18px; font-weight: 700; }
    .pts { display: flex; align-items: center; justify-content: center; height: 46px; margin-right: 6px; border-radius: 999px; background: #0b0619; border: 2px solid #ff3d9a; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: 0 0 10px #ff3d9a55; }
    .half-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .end-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .half-t { display: block; }
    .fin-ot { display: none; }
    .osb:has(.isGame5Started[style*="opacity: 1"]) .fin-ot { display: block; }
    .osb:has(.isComplete[style*="opacity: 1"]) .final-dim { opacity: .3; filter: grayscale(1); }
    .pips { gap: 0 !important; }
    .pips > [class*="TimeoutLeft"] { margin-right: 4px; }
    .pips > [style*="opacity: 0"] { width: 0 !important; margin: 0 !important; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.ev-n.eventName,.ev-r.matchRound,.dial.isShotClockActive>i,.ot.isGame5Started,.to-l,.bonus.bonusA,.bonus.bonusB{font-size:16px!important}
.arrow.isAPossession,.arrow.isBPossession{width:12px!important;height:14px!important;min-width:0!important;flex-shrink:0!important}
.pip.isATimeoutLeft1,.pip.isATimeoutLeft2,.pip.isATimeoutLeft3,.pip.isATimeoutLeft4,.pip.isATimeoutLeft5,.pip.isBTimeoutLeft1,.pip.isBTimeoutLeft2,.pip.isBTimeoutLeft3,.pip.isBTimeoutLeft4,.pip.isBTimeoutLeft5{width:12px!important;height:12px!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

  </style>
</head>
<body>
<article class="osb" aria-label="Basketball scorebug">
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="head">
    <div class="live"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="dial isShotClockActive" data-osb-component="field" data-osb-field="isShotClockActive" style="opacity: 0;"><i>SHOT</i><span class="shot-v" data-osb-static="true" data-sport-stat="shotClock"></span><span class="run-shot isShotClockRunning" data-osb-component="field" data-osb-field="isShotClockRunning" style="opacity: 0;"></span></span><span class="prog"><span class="q"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="end-t st-s">END OF</span><span class="end-t st-b"><span class="periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span></span><span class="half-t st-b">HALFTIME</span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FINAL</span><span class="fin-ot">OVERTIME</span></div>
  </div>
  <div class="cap"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="poss final-dim"><span class="arrow isAPossession" data-osb-component="field" data-osb-field="isAPossession" style="opacity: 0;"></span></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="info"><span class="pips final-dim"><span class="pip isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity: 0;"></span><span class="pip isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity: 0;"></span><span class="pip isATimeoutLeft3" data-osb-component="field" data-osb-field="isATimeoutLeft3" style="opacity: 0;"></span><span class="pip isATimeoutLeft4" data-osb-component="field" data-osb-field="isATimeoutLeft4" style="opacity: 0;"></span><span class="pip isATimeoutLeft5" data-osb-component="field" data-osb-field="isATimeoutLeft5" style="opacity: 0;"></span></span><span class="fl"><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span><i>FOULS</i><b class="teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</b></span><span class="to isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIMEOUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
  <div class="cap"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="poss final-dim"><span class="arrow isBPossession" data-osb-component="field" data-osb-field="isBPossession" style="opacity: 0;"></span></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="info"><span class="pips final-dim"><span class="pip isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity: 0;"></span><span class="pip isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity: 0;"></span><span class="pip isBTimeoutLeft3" data-osb-component="field" data-osb-field="isBTimeoutLeft3" style="opacity: 0;"></span><span class="pip isBTimeoutLeft4" data-osb-component="field" data-osb-field="isBTimeoutLeft4" style="opacity: 0;"></span><span class="pip isBTimeoutLeft5" data-osb-component="field" data-osb-field="isBTimeoutLeft5" style="opacity: 0;"></span></span><span class="fl"><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span><i>FOULS</i><b class="teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</b></span><span class="to isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIMEOUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span><span class="timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span><span class="possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
