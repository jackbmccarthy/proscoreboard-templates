<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Slate Lime Desk PICKLEBALL 1</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{font-family:Arial,Helvetica,sans-serif;font-weight:700;color:#f1f4f6}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}.board{width:min(var(--view-width),var(--max-width),var(--height-width));position:relative;container-type:inline-size;background:transparent;padding-bottom:3cqw}.desk{background:#20262e;border:1px solid #485766;border-radius:3px;overflow:hidden;min-width:0;width:100%}.row,.lane,.name-cell,.name-wrap{min-width:0}.identity{display:block;background:#b6cf61;flex-shrink:0}.name-wrap{display:flex;align-items:center;flex:1 1 0;gap:1cqw}.name{display:block;flex:1 1 0;min-width:0;max-width:100%;font-size:var(--name-font);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.combinedAName:empty:before{content:"Player A"}.combinedBName:empty:before{content:"Player B"}.serve{display:block;flex:0 0 1.2cqw;width:1.2cqw;font-size:1.2cqw;line-height:1;text-align:center}.score,.match-score{display:block;width:100%;font-size:var(--score-font);line-height:1.1;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}.match-score{font-size:var(--match-font)}.label{color:#a8bbca;font-size:var(--label-font);line-height:1.1;text-align:center;white-space:nowrap}.point-slot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:36cqw;height:2cqw;font-size:1.5cqw;text-align:center;color:#f1f4f6}.point{position:absolute;inset:0}.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint{opacity:0!important}.pictogram{position:relative;width:5.2cqw;height:4.2cqw}.paddle{position:absolute;left:.3cqw;top:0;width:2.8cqw;height:3cqw;border-radius:50%;background:#a8bbca;transform:rotate(35deg)}.paddle:after{content:"";position:absolute;bottom:-1cqw;left:.8cqw;width:.65cqw;height:1.3cqw;background:#a8bbca;border-radius:.15cqw}.paddle.second{left:3.1cqw;top:.35cqw;width:2cqw;height:2.3cqw;transform:rotate(35deg)}.paddle.second:after{left:.55cqw}.ball{position:absolute;left:2cqw;bottom:0;width:.6cqw;height:.6cqw;border-radius:50%;background:#a8bbca}.ball.second{left:4.1cqw}.pickleball{border-radius:50%;width:4.2cqw;height:4.2cqw;background:#b6cf61}.hole{position:absolute;width:.58cqw;height:.72cqw;border-radius:50%;background:#20262e}.h0{left:1.8cqw;top:.25cqw}.h1{left:.5cqw;top:.9cqw;transform:rotate(30deg)}.h2{right:.5cqw;top:.9cqw;transform:rotate(-30deg)}.h3{left:1.8cqw;top:1.75cqw}.h4{left:.6cqw;bottom:.6cqw;transform:rotate(-30deg)}.h5{right:.6cqw;bottom:.6cqw;transform:rotate(30deg)}.h6{left:1.8cqw;bottom:.2cqw}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.board{--view-width:62vw;--max-width:1200px;--height-width:250vh;--name-font:5.6cqw;--score-font:6.6cqw;--match-font:5.25cqw;--label-font:2.5cqw;--match-width:16.5%;--point-width:24%}.header{display:flex;align-items:center;min-height:6.4cqw;border-bottom:2px solid #b6cf61}.title{flex:1;min-width:0;padding-left:2.7cqw;font-size:3.7cqw;color:#a8bbca}.header .games,.game-cell{flex:0 0 var(--match-width)}.header .points,.point-cell{flex:0 0 var(--point-width)}.row{display:flex;align-items:stretch;min-height:11.6cqw;background:#2a3440}.row+.row{border-top:1px solid #52616f}.name-cell{display:flex;align-items:center;flex:1 1 0;padding:0 1.5cqw;gap:2.7cqw}.identity{width:1cqw;height:7.3cqw;border-radius:2px}.game-cell,.point-cell{display:flex;align-items:center;justify-content:center;border-left:1px solid #44525e}.point-cell{background:#374451}.row .name-wrap{gap:.6cqw}@media(max-width:600px){.board{--view-width:94vw;--label-font:2.5cqw;--name-font:5.8cqw}.point-slot{height:2.3cqw;font-size:2cqw}}

/* Reserved conditional match states: all score and name tracks remain fixed. */
.osb-conditional-rail{--osb-rail-bg:#20262e;--osb-rail-fg:#f9fbfa;box-sizing:border-box!important;position:relative!important;inset:auto!important;transform:none!important;grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:28px!important;height:28px!important;margin:0!important;padding:2px 7px!important;gap:5px!important;overflow:hidden!important;background:var(--osb-rail-bg)!important;color:var(--osb-rail-fg)!important;border:0!important;font:700 11px/1 Arial,Helvetica,sans-serif!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-condition-side{all:unset!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;flex:1 1 35%!important;width:35%!important;min-width:0!important;height:22px!important;gap:2px!important;position:relative!important;overflow:hidden!important}
.osb-conditional-rail .osb-condition-side-b{justify-content:flex-end!important}
.osb-conditional-rail .osb-condition-side-label{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 13px!important;width:13px!important;height:18px!important;color:var(--osb-rail-fg)!important;font:800 10px/1 Arial,Helvetica,sans-serif!important}
.osb-conditional-rail .osb-condition-slot{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 21px!important;width:21px!important;height:18px!important;position:relative!important}
.osb-conditional-rail .osb-condition-timeoutused{flex-basis:21px!important;width:21px!important}
.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:17px!important;width:17px!important}
.osb-conditional-rail .osb-condition-badge{box-sizing:border-box!important;align-items:center!important;justify-content:center!important;width:100%!important;height:18px!important;min-width:0!important;margin:0!important;padding:0 2px!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:2px!important;background:rgba(255,255,255,.12)!important;color:var(--osb-rail-fg)!important;font:800 9px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-timeout-icon{position:relative!important;display:flex;align-items:center!important;justify-content:center!important;padding:0!important;color:var(--osb-rail-fg)!important}
.osb-conditional-rail .osb-timeout-icon::before{content:""!important;display:block!important;width:11px!important;height:11px!important;border:1.5px solid currentColor!important;border-radius:50%!important;background:transparent!important}
.osb-conditional-rail .osb-timeout-icon::after{content:""!important;position:absolute!important;left:50%!important;top:3px!important;width:3px!important;height:6px!important;border-left:1.5px solid currentColor!important;border-bottom:1.5px solid currentColor!important;transform:translateX(-25%) rotate(-35deg)!important;transform-origin:bottom left!important}
.osb-conditional-rail .isATimeOutActive,.osb-conditional-rail .isBTimeOutActive{background:#f3d27a!important;color:#253641!important;border-color:#f3d27a!important}
.osb-conditional-rail .isATimeOutUsed,.osb-conditional-rail .isBTimeOutUsed{background:transparent!important;color:#b8c7ca!important;border-color:#b8c7ca!important}
.osb-conditional-rail .isAYellowCarded,.osb-conditional-rail .isBYellowCarded{background:#e5c94e!important;color:#253641!important;border-color:#e5c94e!important}
.osb-conditional-rail .isARedCarded,.osb-conditional-rail .isBRedCarded{background:#c94747!important;color:#fff!important;border-color:#c94747!important}
.osb-conditional-rail .point-slot.osb-shared-point{all:unset!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30%!important;width:30%!important;min-width:78px!important;max-width:130px!important;height:22px!important;min-height:22px!important;inset:auto!important;margin:0!important;padding:0!important;transform:none!important;overflow:hidden!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important}
.osb-conditional-rail .point-slot.osb-shared-point>.isGamePoint,.osb-conditional-rail .point-slot.osb-shared-point>.isMatchPoint{box-sizing:border-box!important;position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;transform:none!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:390px){.osb-conditional-rail{padding:2px 4px!important;gap:3px!important}.osb-conditional-rail .osb-condition-side{gap:1px!important}.osb-conditional-rail .osb-condition-slot{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-timeoutused{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:15px!important;width:15px!important}.osb-conditional-rail .point-slot.osb-shared-point{min-width:76px!important}}

</style></head>
<body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="desk columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><header class="header"><div class="title">PICKLEBALL</div><div class="label games">GAMES</div><div class="label points">POINTS</div></header><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-cell"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-wrap"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true">●</span></div></div><div class="game-cell"><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="point-cell"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-cell"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-wrap"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;">●</span></div></div><div class="game-cell"><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="point-cell"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></div><div class="osb-conditional-rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Conditional match states"><div class="osb-condition-side osb-condition-side-a" data-osb-component="layout"><span class="osb-condition-side-label">A</span><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div><span class="point-slot osb-shared-point" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><div class="osb-condition-side osb-condition-side-b" data-osb-component="layout"><span class="osb-condition-side-label">B</span><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div></div></article></main></body>
</html>
