<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baseball — Sage Slate Data Console 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.board{display:flex;max-width:100%;min-width:0;overflow:hidden;border:2px solid #b7c7c2;background:#e7ece8;color:#172428;container-type:inline-size}
.console{display:flex;flex-direction:column;flex:0 0 23%;min-width:0;background:#243439;color:#f5f7f3;padding:2.4cqw 2.6cqw}
.sport-tag{display:block;white-space:nowrap;color:#f5f7f3;font-size:3cqw;line-height:1;font-weight:800;letter-spacing:.005em}
.counter-list{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-height:0;margin-top:2.2cqw}
.counter-line{display:flex;align-items:center;justify-content:space-between;gap:4px;color:#b8c9c5;font-size:1.9cqw;font-weight:700;line-height:1}
.counter-line .counter-value{color:#f6f8f5;font-size:2.3cqw}
.counter-head{display:flex;flex-direction:column;gap:.25cqw;margin-top:1.6cqw;padding-top:1.1cqw;border-top:1px solid #9aacaa;color:#bdcbc8;font-size:1.9cqw}
.counter-head .counter-value{color:#f6f8f5;font-size:3cqw}
.counter-triplet{display:flex;align-items:flex-end;justify-content:space-between;gap:1cqw;flex:1;margin-top:1.5cqw}
.counter-matrix{display:flex;align-items:flex-end;justify-content:space-between;gap:.4cqw;flex:1;margin-top:1.35cqw}
.counter-item{display:flex;flex-direction:column;align-items:center;gap:.3cqw;min-width:0;color:#becdc8;font-size:1.4cqw;font-weight:700;white-space:nowrap}
.counter-item+.counter-item{border-left:0;padding-left:0}
.counter-item .counter-value{color:#fff;font-size:2.6cqw;line-height:1}
.counter-value{font-variant-numeric:tabular-nums}
.competitors{display:flex;flex:1 1 auto;min-width:0;flex-direction:column}
.competitor{display:flex;flex:1 1 0;min-width:0;background:#e7ece8}
.competitor+.competitor{border-top:2px solid #bbcac4}
.name-lane{display:flex;align-items:center;flex:1 1 auto;min-width:0;overflow:hidden}
.identity{display:block;flex:none;width:1.5cqw;height:100%;margin-left:0;background:#508277}
.jerseyColorA{background:#2378bd}.jerseyColorB{background:#e92f38}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3cqw;font-size:5cqw;font-weight:750;line-height:1.08;color:#172428}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.score-terminal{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;width:19%;min-width:0;overflow:hidden;background:#557a70;color:#fff;border-left:2px solid #b7c7c2}
.runs-label{font-size:1.9cqw;font-weight:700;line-height:1;color:#e9f0ed;white-space:nowrap}
.score{display:block;min-width:0;max-width:100%;overflow:hidden;text-align:center;color:#fff;font-size:7.2cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.retained,.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.board{width:min(70vw,1390px,calc((100vh - 24px)*4.2));height:min(16vw,310px,calc((100vh - 24px)*.85))}
@media(max-width:700px){
.stage{padding:8px}
.board{width:100%;height:150px}
.console{flex-basis:32%;padding:9px 7px}
.sport-tag{font-size:12px}
.counter-list{margin-top:14px}
.counter-line{font-size:8px}.counter-line .counter-value{font-size:11px}
.counter-head{font-size:9px;margin-top:8px;padding-top:7px}
.counter-head .counter-value{font-size:14px}
.counter-triplet{gap:2px;margin-top:7px}
.counter-matrix{gap:1px;margin-top:5px}
.counter-item{font-size:6px;gap:3px}
.counter-item+.counter-item{padding-left:3px}
.counter-item .counter-value{font-size:13px}
.identity{width:5px;margin-left:0}
.name{font-size:clamp(12px,4.5vw,20px);padding:0 8px}
.score-terminal{width:25%}
.runs-label{font-size:8px}
.score{font-size:clamp(26px,7vw,38px)}
}
@media(max-width:390px){.console{flex-basis:35%}.score-terminal{width:26%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
  <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="baseball scoreboard">
    <aside class="console columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Editable static game counters">
      <span class="sport-tag" data-osb-component="text">BASEBALL</span>
      <div class="counter-list columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="counter-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">INNING</span><strong class="counter-value" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></div>
<div class="counter-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">BALLS</span><strong class="counter-value" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></div>
<div class="counter-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">STRIKES</span><strong class="counter-value" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></div>
<div class="counter-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">OUTS</span><strong class="counter-value" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></div>
</div>
    </aside>
    <div class="competitors columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
      <div class="competitor rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container">
  <div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div>
  <div class="score-terminal columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
  <span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span>
</div>
      <div class="competitor rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
  <div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div>
  <div class="score-terminal columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
  <span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span>
</div>
    </div>
    <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
  </article>
</main>
</body>
</html>
