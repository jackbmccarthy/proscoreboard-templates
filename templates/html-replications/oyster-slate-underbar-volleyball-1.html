<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Oyster Slate Underbar 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(94vw,1120px);max-width:100%;height:400px;overflow:hidden;border-radius:3px;background:#ece8df;color:#283844;container-type:inline-size}
.lanes{display:flex;flex:1 1 0;min-height:0;flex-direction:column}
.lane{display:flex;flex:1 1 0;min-width:0;min-height:0;background:#ece8df}
.lane+.lane{border-top:2px solid #283844}
.identity{flex:0 0 3.1%;align-self:stretch;background:#2684a3}
.jerseyColorB{background:#c86a61}
.name{display:block;align-self:center;flex:1 1 0;min-width:0;overflow:hidden;padding:0 3.7%;font-size:clamp(28px,6.4cqw,72px);font-weight:700;line-height:1.08;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.primary,.support{display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.primary{flex:0 0 22.3%;background:#283844;color:#f8f7f2}
.lane+.lane .primary{border-top:2px solid #b8c1be}
.support{flex:0 0 17.5%;background:#ece8df;color:#283844}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(42px,8.6cqw,94px);font-weight:800;line-height:.98;text-align:center}
.set-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(32px,6.3cqw,70px);font-weight:800;line-height:1;text-align:center}
.caption{display:block;max-width:100%;overflow:hidden;font-size:clamp(11px,2.1cqw,28px);font-weight:700;line-height:1.1}
.support .caption{font-size:clamp(10px,1.9cqw,25px)}
.underbar{display:flex;align-items:center;justify-content:space-between;flex:0 0 21%;min-width:0;padding:0 3.1%;background:#283844;color:#f8f7f2;font-size:clamp(17px,3.7cqw,43px);font-weight:700;line-height:1;white-space:nowrap}
.sport-tag{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis}
.set-status{display:flex;align-items:center;gap:.35em;align-self:stretch;padding-left:3.5%;border-left:2px solid #b8c1be}
.current-set{display:inline-block;min-width:1ch;font-variant-numeric:tabular-nums;text-align:center}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:6px}
 .board{width:100%;height:168px}
 .lane+.lane{border-top-width:1px}
 .identity{flex-basis:4%}
 .name{padding:0 7px;font-size:clamp(15px,5cqw,21px)}
 .primary{flex-basis:21%}
 .support{flex-basis:17%}
 .score{font-size:clamp(27px,8.4cqw,38px)}
 .set-score{font-size:clamp(21px,6.6cqw,29px)}
 .caption,.support .caption{font-size:clamp(8px,2.3cqw,10px)}
 .underbar{flex-basis:20%;padding:0 12px;font-size:clamp(12px,3.3cqw,16px)}
 .set-status{padding-left:12px;border-left-width:1px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="primary" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="caption" data-osb-component="text">POINTS</span></div><div class="support" data-osb-component="layout"><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="caption" data-osb-component="text">SETS</span></div></div>
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="primary" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="caption" data-osb-component="text">POINTS</span></div><div class="support" data-osb-component="layout"><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="caption" data-osb-component="text">SETS</span></div></div>
  </div>
  <div class="underbar rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
