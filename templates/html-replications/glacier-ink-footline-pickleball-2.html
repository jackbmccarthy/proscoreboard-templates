<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glacier Ink Footline PICKLEBALL 2</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; }
.stage { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; }
.board { --glacier: #e2eaeb; --ink: #253c49; width: min(100%, 1800px); overflow: hidden; border-radius: 6px; color: var(--ink); background: var(--glacier); }
.lanes { display: flex; flex-direction: row; min-width: 0; }
.lane { display: flex; flex: 1 1 50%; min-width: 0; height: clamp(108px, 8.6vw, 158px); background: var(--glacier); }
.lane + .lane { border-left: 1px solid #a8b9bf; }
.identity { flex: 0 0 clamp(19px, 1.67vw, 30px); background: #2b88a9; }
.jerseyColorB { background: #c66d68; }
.name-cell { display: flex; align-items: center; flex: 1 1 0; min-width: 0; gap: 8px; padding: 0 clamp(16px, 2.11vw, 38px); }
.name { display: block; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-size: clamp(38px, 3.22vw, 58px); line-height: 1.1; font-weight: 700; }
.combinedAName:empty::before { content: "Player A"; }
.combinedBName:empty::before { content: "Player B"; }
.serve { flex: 0 0 13px; width: 13px; height: 13px; font-size: 13px; line-height: 13px; text-align: center; color: var(--ink); }
.support-track, .primary-track { display: flex; flex-direction: column; justify-content: center; align-items: center; flex-shrink: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.support-track { flex-basis: clamp(122px, 9.44vw, 170px); background: var(--glacier); border-left: 1px solid #a8b9bf; }
.primary-track { flex-basis: clamp(135px, 10.56vw, 190px); background: var(--ink); color: #fff; }
.value { display: block; width: 100%; text-align: center; white-space: nowrap; font-weight: 700; line-height: 1; }
.support-track .value { font-size: clamp(36px, 3.11vw, 56px); }
.primary-track .value { font-size: clamp(50px, 4.22vw, 76px); }
.caption { display: block; width: 100%; margin-top: 5px; text-align: center; white-space: nowrap; font-size: clamp(13px, 1.17vw, 21px); line-height: 1; font-weight: 700; }
.footline { position: relative; display: flex; align-items: center; width: 100%; height: clamp(46px, 3.4vw, 62px); padding: 0 clamp(16px, 1.78vw, 32px); background: var(--ink); color: #fff; border-top: 1px solid #a8b9bf; }
.sport-tag { font-size: clamp(23px, 1.89vw, 34px); line-height: 1; font-weight: 700; letter-spacing: .025em; white-space: nowrap; }
.point-slot { position: relative; width: 120px; height: 18px; margin-left: auto; font-size: 11px; line-height: 18px; font-weight: 700; text-align: right; }
.point-label { position: absolute; inset: 0; white-space: nowrap; }
.point-slot:has(.isMatchPoint[style*="opacity: 1"]) .isGamePoint { opacity: 0 !important; }
@media (max-width: 980px) {
  .board { width: min(100%, 540px); }
  .lanes { flex-direction: column; }
  .lane { flex: 0 0 82px; height: 82px; }
  .lane + .lane { border-left: 0; border-top: 1px solid #a8b9bf; }
  .identity { flex-basis: 6px; }
  .name-cell { padding: 0 14px; }
  .name { font-size: clamp(20px, 5vw, 32px); }
  .support-track { flex-basis: 72px; }
  .primary-track { flex-basis: 88px; }
  .support-track .value { font-size: 30px; }
  .primary-track .value { font-size: 40px; }
  .caption { margin-top: 3px; font-size: 10px; }
  .footline { height: 42px; padding: 0 14px; }
  .sport-tag { font-size: 16px; }
  .point-slot { width: 94px; font-size: 9px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Reserved conditional match states: all score and name tracks remain fixed. */
.osb-conditional-rail{--osb-rail-bg:#253c49;--osb-rail-fg:#f9fbfa;box-sizing:border-box!important;position:relative!important;inset:auto!important;transform:none!important;grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:28px!important;height:28px!important;margin:0!important;padding:2px 7px!important;gap:5px!important;overflow:hidden!important;background:var(--osb-rail-bg)!important;color:var(--osb-rail-fg)!important;border:0!important;font:700 11px/1 Arial,Helvetica,sans-serif!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-condition-side{all:unset!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;flex:1 1 35%!important;width:35%!important;min-width:0!important;height:22px!important;gap:2px!important;position:relative!important;overflow:hidden!important}
.osb-conditional-rail .osb-condition-side-b{justify-content:flex-end!important}
.osb-conditional-rail .osb-condition-slot{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 21px!important;width:21px!important;height:18px!important;position:relative!important}
.osb-conditional-rail .osb-condition-timeoutused{flex-basis:21px!important;width:21px!important}
.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:17px!important;width:17px!important}
.osb-conditional-rail .osb-condition-badge{box-sizing:border-box!important;align-items:center!important;justify-content:center!important;width:100%!important;height:18px!important;min-width:0!important;margin:0!important;padding:0 2px!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:2px!important;background:rgba(255,255,255,.12)!important;color:var(--osb-rail-fg)!important;font:800 9px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-timeout-icon{position:relative!important;display:flex;align-items:center!important;justify-content:center!important;padding:0!important;color:var(--osb-rail-fg)!important}
.osb-conditional-rail .osb-timeout-icon::before{content:""!important;display:block!important;width:11px!important;height:11px!important;border:1.5px solid currentColor!important;border-radius:50%!important;background:transparent!important}
.osb-conditional-rail .osb-timeout-icon::after{content:""!important;position:absolute!important;left:50%!important;top:3px!important;width:3px!important;height:6px!important;border-left:1.5px solid currentColor!important;border-bottom:1.5px solid currentColor!important;transform:translateX(-25%) rotate(-35deg)!important;transform-origin:bottom left!important}
.osb-conditional-rail .isATimeOutActive,.osb-conditional-rail .isBTimeOutActive{background:#f3d27a!important;color:#253641!important;border-color:#f3d27a!important}
.osb-conditional-rail .isATimeOutUsed,.osb-conditional-rail .isBTimeOutUsed{background:transparent!important;color:#b8c7ca!important;border-color:#b8c7ca!important}
.osb-conditional-rail .isAYellowCarded,.osb-conditional-rail .isBYellowCarded{background:#e5c94e!important;color:#253641!important;border-color:#e5c94e!important}
.osb-conditional-rail .isARedCarded,.osb-conditional-rail .isBRedCarded{background:#c94747!important;color:#fff!important;border-color:#c94747!important}
.osb-conditional-rail .point-slot.osb-shared-point{all:unset!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30%!important;width:30%!important;min-width:78px!important;max-width:130px!important;height:22px!important;min-height:22px!important;inset:auto!important;margin:0!important;padding:0!important;transform:none!important;overflow:hidden!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important}
.osb-conditional-rail .point-slot.osb-shared-point>.isGamePoint,.osb-conditional-rail .point-slot.osb-shared-point>.isMatchPoint{box-sizing:border-box!important;position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;transform:none!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:390px){.osb-conditional-rail{padding:2px 4px!important;gap:3px!important}.osb-conditional-rail .osb-condition-side{gap:1px!important}.osb-conditional-rail .osb-condition-slot{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-timeoutused{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:15px!important;width:15px!important}.osb-conditional-rail .point-slot.osb-shared-point{min-width:76px!important}}

</style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
      <div class="lanes rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
        <div class="name-cell">
          <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
          <span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true">●</span>
        </div>
        <div class="support-track"><span class="value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="caption">GAMES</span></div>
        <div class="primary-track"><span class="value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="caption">POINTS</span></div>
      </div>
      <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
        <div class="name-cell">
          <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
          <span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;">●</span>
        </div>
        <div class="support-track"><span class="value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="caption">GAMES</span></div>
        <div class="primary-track"><span class="value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="caption">POINTS</span></div>
      </div>
      </div>
      <div class="footline">
        <span class="sport-tag">PICKLEBALL</span>

      </div>
    <div class="osb-conditional-rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Conditional match states"><div class="osb-condition-side osb-condition-side-a" data-osb-component="layout"><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div><span class="point-slot osb-shared-point" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><div class="osb-condition-side osb-condition-side-b" data-osb-component="layout"><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div></div></article>
  </main>
</body>
</html>
