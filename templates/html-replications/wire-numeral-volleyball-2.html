<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wire Numeral Volleyball — Duel</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { color: #fff; font-family: Arial, Helvetica, sans-serif; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { width: 100%; max-width: 1000px; display: flex; flex-direction: column; background: transparent; }
.title { text-align: center; font-size: 70px; font-weight: 700; letter-spacing: .15em; padding-left: .15em; line-height: 1; margin-bottom: 47px; }
.duel { display: flex; gap: 200px; }
.team { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.primary-score { display: block; width: 100%; height: 315px; color: transparent; -webkit-text-stroke: 6px #86f4f3; font-family: "Arial Black", Arial, sans-serif; font-size: 320px; font-weight: 900; line-height: .84; text-align: center; letter-spacing: -.07em; font-variant-numeric: tabular-nums; transform: scaleY(1.25); transform-origin: center; }
.label { font-size: 34px; font-weight: 600; letter-spacing: .17em; line-height: 1; }
.points-label { margin-top: 16px; }
.name { display: block; width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: 74px; font-weight: 700; line-height: 1; margin-top: 19px; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.identity-rule { width: 163px; max-width: 70%; height: 9px; flex: 0 0 9px; background: #86f4f3; margin-top: 22px; margin-bottom: 24px; }
.match-score { display: block; width: 100%; height: 60px; text-align: center; font-size: 58px; line-height: 1; font-weight: 700; margin-top: 7px; font-variant-numeric: tabular-nums; }
.set-footer { display: flex; flex-direction: column; align-items: center; margin-top: 30px; gap: 5px; font-size: 34px; font-weight: 600; line-height: 1; letter-spacing: .13em; }
.set-value { display: block; width: 80px; font-size: 70px; line-height: 1; text-align: center; font-weight: 700; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 1050px) {
  .title { font-size: clamp(30px, 6.8vw, 70px); }
  .duel { gap: 15vw; }
  .primary-score { font-size: clamp(90px, 30vw, 320px); }
  .name { font-size: clamp(26px, 6.9vw, 74px); }
}
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .title { font-size: 29px; letter-spacing: .1em; margin-bottom: 30px; }
  .duel { gap: 28px; }
  .primary-score { height: 138px; font-size: 128px; -webkit-text-stroke-width: 2.5px; }
  .label { font-size: 15px; letter-spacing: .1em; }
  .points-label { margin-top: 13px; }
  .name { font-size: 29px; margin-top: 16px; }
  .identity-rule { width: 85px; height: 4px; flex-basis: 4px; margin-top: 13px; margin-bottom: 17px; }
  .match-score { height: 34px; font-size: 33px; margin-top: 7px; }
  .set-footer { margin-top: 27px; font-size: 19px; gap: 6px; }
  .set-value { width: 42px; font-size: 40px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="duel rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="team columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="label points-label">POINTS</span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="identity-rule jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="label">SETS</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
        <div class="team columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="label points-label">POINTS</span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="identity-rule jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="label">SETS</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
