<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Charcoal Outline Sidecar — Basketball compact</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}.shell{position:relative;width:min(88vw,1100px,calc((100vh - 32px)*3.6));max-width:100%;padding-top:45px;container-type:inline-size}.sport-tag{position:absolute;top:0;left:0;display:flex;align-items:center;height:45px;min-width:230px;padding:0 23px;background:#dce3e2;color:#20272c;font-size:2.8cqw;font-weight:800;line-height:1;white-space:nowrap}.board{display:flex;width:100%;height:274px;min-width:0;overflow:hidden;background:#20272c;color:#f2f3ee;border:1px solid #a8b8bc;border-radius:2px;font-variant-numeric:tabular-nums}.competitors{display:flex;flex:1 1 70%;min-width:0;flex-direction:column}.competitor{display:flex;align-items:center;flex:1 1 0;min-width:0}.competitor+.competitor{border-top:1px solid #7e958f}.identity{display:block;flex:none;width:17px;height:88%;margin-left:10px;background:#087bf0}.jerseyColorB{background:#ef2535}.name{display:block;flex:1 1 0;min-width:0;margin-left:38px;padding-right:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.8cqw;font-weight:700;line-height:1.05}.combinedAName:empty:before{content:"Team A"}.combinedBName:empty:before{content:"Team B"}.score-track{display:flex;align-items:center;justify-content:center;flex:none;width:25%;height:87%;margin-right:11px;border:1px solid #a8b8bc;background:#20272c}.score{display:block;width:100%;text-align:center;font-size:8.4cqw;font-weight:800;line-height:1;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}.dock{display:flex;flex:0 0 30%;min-width:0;flex-direction:column;background:#dce3e2;color:#20272c}.stat{display:flex;align-items:center;justify-content:space-between;flex:1 1 0;min-height:0;gap:5px;padding:0 22px;white-space:nowrap}.stat+.stat{border-top:1px solid #a8b8bc}.stat-label{font-size:2.4cqw;font-weight:700}.stat
