<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Between Games</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing{animation:none!important;transition:none!important}}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.02}

.sslot{align-items:center}.sslot>.st{display:flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap;height:100%}
.board:has(.isMatchStarted[style*="opacity: 1"]) .swarm{opacity:0!important}
.board:has(.isGamePoint[style*="opacity: 1"]) .sbrk,.board:has(.isMatchPoint[style*="opacity: 1"]) .sbrk{opacity:0!important}
.pslot>.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hist:not(:has(>[style*="opacity: 1"])){display:none}
.srv{display:flex;align-items:center;gap:.35rem}
.sn{position:relative;display:inline-grid;place-items:center}.sn>i{grid-area:1/1;font-style:normal}
.sn:has(>.isSecondServer[style*="opacity: 1"])>.one,.cn:has(>.isSecondServer[style*="opacity: 1"])>.one{opacity:0}
.cn{display:inline-grid}.cn>i{grid-area:1/1;font-style:normal;text-align:center}
.call{display:inline-flex;align-items:baseline}.call>i,.dbl>i{font-style:normal}.call .ca{order:1}.call .d1{order:2}.call .cb{order:3}.call .dbl{order:4;display:inline-flex;align-items:baseline}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .ca{order:3}.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .cb{order:1}
.call .dbl:not([style*="opacity: 1"]){display:none}
.cards{display:flex;gap:.3rem;align-items:center}.card{display:block;border-radius:.15rem;box-shadow:0 0 0 .1rem #0004}.yc{background:#ffd200}.rc{background:#e3262f}
.cards:not(:has(>[style*="opacity: 1"])){display:none}
.tie{display:flex;align-items:center}.tie:has(>.teamAName[style*="display: none"]){display:none}
.tlogo{display:block;object-fit:contain}.tlogo:not([src]),.tlogo[src=""]{visibility:hidden}
.tie>.tdash{font-style:normal}
.tname{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.05}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>:not(.tie){display:none}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>.tie{height:auto;min-height:5.2rem;padding-top:.6rem;padding-bottom:.4rem;margin:0}

.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#2f8f5b 0,#14532d 55%,#0a2e19 100%)}
.board{position:relative;width:106rem;font-family:"DIN Condensed","Bahnschrift SemiBold Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;color:#fff}
.head{display:flex;flex-direction:column;align-items:center;gap:1.2rem;margin-bottom:3.4rem}
.ctx{display:flex;align-items:center;gap:1rem;font-size:2.6rem;letter-spacing:.16em;text-transform:uppercase;color:#c9ecd6}.ctx .sep{font-style:normal;color:#e4f54a}
.hrow{position:relative;display:flex;height:6.4rem}.hrow .pslot{position:absolute;left:100%;top:0;bottom:0;margin-left:1.2rem}.hrow .pt{padding:.6rem 2.4rem 0;font-size:3.4rem;letter-spacing:.1em;background:#e4f54a;color:#0a2e19}.hrow .pt.mp{background:#e8202a;color:#fff}
.sslot{min-width:34rem;height:6.4rem}.sslot>.st{padding:.6rem 3rem 0;font-size:4rem;letter-spacing:.12em;background:#ffffff1f;color:#fff}.sslot>.sgame{background:#e4f54a;color:#0a2e19}.sslot>.sbrk{background:#fff;color:#0a2e19}
.table{background:#0a2e19cc;border:.2rem solid #ffffff1f;box-shadow:0 1.4rem 3rem #0009}
.fhead,.frow{display:flex;align-items:stretch}
.fhead{height:4rem;background:#ffffff10;color:#9fd2b3;font-size:2rem;letter-spacing:.14em}
.fh{display:flex;align-items:center;justify-content:center;padding-top:.4rem}.fh.lead{flex:1}
.fc{flex:0 1 10.4rem;min-width:5.6rem;display:flex;align-items:center;justify-content:center}.fg{width:14rem;flex:none}
.frow{height:11rem;border-top:.2rem solid #ffffff14}
.chip{width:1.6rem;flex:none}
.fname{flex:1;min-width:26rem;display:flex;align-items:center;padding:0 2.4rem}
.nm{font-size:4.8rem;font-weight:700;text-transform:uppercase;padding-top:.6rem}
.frow .fc{padding-top:.6rem;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4.6rem;font-weight:700;color:#dff3e6;border-left:.15rem solid #ffffff12}
.games{width:14rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.8rem;background:#e4f54a;color:#0a2e19;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:8rem;font-weight:700}
.rB .games{border-top:.2rem solid #0a2e1933}
.tie{justify-content:center;gap:1.6rem;width:80rem;margin:0 auto 2.4rem;min-height:6rem;padding:.6rem 2rem .3rem;background:#0a2e19cc;border:.2rem solid #ffffff1f;font-size:2.8rem;font-weight:700;text-transform:uppercase}.tlogo{width:4.4rem;height:4.4rem}.tchip{width:.8rem;height:4rem}.tname:last-of-type{text-align:right}.tscore{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4.4rem;color:#e4f54a}.tie>.tdash{color:#9fd2b3;font-size:3rem}
</style>
</head>
<body>

<span class="tie"><img class="tlogo teamLogoURLA" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><i class="tchip teamJerseyColorA" data-osb-component="field" data-osb-field="teamJerseyColorA"></i><span class="tname teamAName" data-osb-component="field" data-osb-field="teamAName"></span><span class="tscore num teamAScore" data-osb-component="field" data-osb-field="teamAScore">0</span><i class="tdash">-</i><span class="tscore num teamBScore" data-osb-component="field" data-osb-field="teamBScore">0</span><span class="tname teamBName" data-osb-component="field" data-osb-field="teamBName"></span><i class="tchip teamJerseyColorB" data-osb-component="field" data-osb-field="teamJerseyColorB"></i><img class="tlogo teamLogoURLB" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""></span>
<header class="head" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="ctx"><span class="eventName" data-osb-component="field" data-osb-field="eventName"></span><i class="sep">&middot;</i><span class="matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span class="hrow"><span class="slot sslot"><span class="st sfmt"><span class="matchFormatLabel" data-osb-component="field" data-osb-field="matchFormatLabel"></span></span><span class="st sgame isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0">GAME <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sbrk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">END OF GAME <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span></span><span class="slot pslot"><span class="pt gp isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="pt mp isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span></span></header>
<div class="table" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="fhead" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="fh lead"></span><span class="fh fc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0">GAME 1</span><span class="fh fc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0">GAME 2</span><span class="fh fc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0">GAME 3</span><span class="fh fc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0">GAME 4</span><span class="fh fc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0">GAME 5</span><span class="fh fc isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity:0">GAME 6</span><span class="fh fc isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity:0">GAME 7</span><span class="fh fc isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity:0">GAME 8</span><span class="fh fc isGame9Started" data-osb-component="field" data-osb-field="isGame9Started" style="opacity:0">GAME 9</span><span class="fh fg">GAMES</span></div><div class="frow rA" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="fname"><span class="nm clamp2 combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></span><span class="fc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><span class="num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span><span class="fc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><span class="num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span><span class="fc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><span class="num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span><span class="fc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><span class="num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span><span class="fc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><span class="num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span><span class="fc isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity:0"><span class="num game6AScore" data-osb-component="field" data-osb-field="game6AScore">0</span></span><span class="fc isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity:0"><span class="num game7AScore" data-osb-component="field" data-osb-field="game7AScore">0</span></span><span class="fc isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity:0"><span class="num game8AScore" data-osb-component="field" data-osb-field="game8AScore">0</span></span><span class="fc isGame9Started" data-osb-component="field" data-osb-field="isGame9Started" style="opacity:0"><span class="num game9AScore" data-osb-component="field" data-osb-field="game9AScore">0</span></span><span class="games num currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="frow rB" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="fname"><span class="nm clamp2 combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></span><span class="fc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><span class="num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="fc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><span class="num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="fc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><span class="num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="fc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><span class="num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="fc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><span class="num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span><span class="fc isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity:0"><span class="num game6BScore" data-osb-component="field" data-osb-field="game6BScore">0</span></span><span class="fc isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity:0"><span class="num game7BScore" data-osb-component="field" data-osb-field="game7BScore">0</span></span><span class="fc isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity:0"><span class="num game8BScore" data-osb-component="field" data-osb-field="game8BScore">0</span></span><span class="fc isGame9Started" data-osb-component="field" data-osb-field="isGame9Started" style="opacity:0"><span class="num game9BScore" data-osb-component="field" data-osb-field="game9BScore">0</span></span><span class="games num currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div><span class="osb-core-fields"><span class="num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="playerA2" data-osb-component="field" data-osb-field="playerA2"></span></span></section></main>
</body>
</html>
