<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volleyball Box Score</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing{animation:none!important;transition:none!important}}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.02}
.vball{display:block;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 14%,transparent 34%),conic-gradient(from 30deg,#ffd23f 0 120deg,#2a5bd7 0 240deg,#f6f7fb 0);box-shadow:inset 0 0 0 .12rem #0006,0 0 .4rem #0006}
.sslot{align-items:center}.sslot>.st{display:flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap;height:100%}
.pslot>.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hist:not(:has(>[style*="opacity: 1"])){display:none}
.board:has(.isComplete[style*="opacity: 1"]) .srv[style*="opacity: 1"]{opacity:.3!important;filter:grayscale(1)}
.pip{position:relative;display:block}.pip>.lit{position:absolute;inset:0;border-radius:inherit}

.stage{position:fixed;left:4rem;bottom:4rem}
.board{position:relative;width:78rem;font-family:"DIN Condensed","Bahnschrift SemiBold Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;color:#fff;filter:drop-shadow(0 .5rem 1.2rem #0009)}
.top{display:flex;align-items:stretch;height:3.2rem;font-size:1.8rem;letter-spacing:.08em;text-transform:uppercase}
.sslot{min-width:13rem}.sslot>.st{padding:.35rem 1.2rem 0;background:#19c37d;color:#04261a}.sslot>.sdec{background:#ffb020;color:#2a1a00}.sslot>.sbrk{background:#2d3a4f;color:#fff}.sslot>.sfin{background:#fff;color:#0d1520}
.ctx{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;padding:.35rem 1.2rem 0;background:#0d1520;color:#aab6c8;white-space:nowrap;overflow:hidden}.ctx .sep{font-style:normal;color:#19c37d}
.lhead,.lrow{display:flex;align-items:stretch}
.lhead{height:2.6rem;background:#151f2e;color:#8391a7;font-size:1.5rem;letter-spacing:.1em}
.lh{display:flex;align-items:center;justify-content:center;padding-top:.3rem}.lh.lead{flex:1;justify-content:flex-start;padding-left:1.9rem}
.lc{width:5rem;flex:none;display:flex;align-items:center;justify-content:center}.lsets{width:5.6rem;flex:none}.lpts{width:7.4rem;flex:none}
.lrow{position:relative;height:5.6rem;background:#1c2738;border-top:.15rem solid #0d1520}
.chip{width:.9rem;flex:none}
.lname{flex:1;min-width:0;display:flex;align-items:center;gap:.8rem;padding:0 1rem}
.nm{flex:1;min-width:0;padding-top:.4rem;font-size:2.6rem;font-weight:700;text-transform:uppercase}
.srv{width:2.4rem;flex:none;display:flex;align-items:center;justify-content:center}.vball{width:2.1rem;height:2.1rem}
.pips{display:flex;flex-direction:column;gap:.45rem;flex:none}.pip{width:1.5rem;height:.65rem;border-radius:.12rem;background:#ffffff26}.pip>.lit{background:#19c37d}
.lrow .lc{padding-top:.4rem;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.4rem;font-weight:700;color:#c3cddb;border-left:.1rem solid #ffffff12}
.lrow>.lc[style*="opacity: 1"]:not(:has(~.lc[style*="opacity: 1"])){color:#19c37d;background:#19c37d14}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .lrow>.lc,.board:has(.isComplete[style*="opacity: 1"]) .lrow>.lc{color:#c3cddb!important;background:none!important}
.sets{width:5.6rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.4rem;background:#151f2e;color:#19c37d;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:3rem;font-weight:700}
.pts{width:7.4rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.4rem;background:#fff;color:#0d1520;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4rem;font-weight:700}
.tob{position:absolute;left:100%;top:0;bottom:0;display:flex;align-items:center;gap:.6rem;padding:.35rem 1.1rem 0;background:#19c37d;color:#04261a;font-size:1.8rem;letter-spacing:.06em;white-space:nowrap}.tob em{font-style:normal}.tob b{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.2rem}
.pslot{position:absolute;right:0;bottom:100%;margin-bottom:.5rem}.pt{height:3.2rem;padding:.35rem 1.4rem 0;font-size:2rem;letter-spacing:.1em;background:#19c37d;color:#04261a}.pt.mp{background:#e8202a;color:#fff}
</style>
</head>
<body>
<main class="stage"><section class="board" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="top" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="slot sslot"><span class="st sset">SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sdec isDecidingSet" data-osb-component="field" data-osb-field="isDecidingSet" style="opacity:0">DECIDING SET</span><span class="st sbrk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">END OF SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sfin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">FINAL</span></span><span class="ctx"><span class="eventName" data-osb-component="field" data-osb-field="eventName"></span><i class="sep">&middot;</i><span class="matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span></div>
<div class="lhead" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="lh lead">TEAM</span><span class="lh lc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0">1</span><span class="lh lc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0">2</span><span class="lh lc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0">3</span><span class="lh lc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0">4</span><span class="lh lc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0">5</span><span class="lh lsets">SETS</span><span class="lh lpts">PTS</span></div>
<div class="lrow rA" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="lname"><span class="nm clamp2 combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="vball"></i></span><span class="pips"><i class="pip"><b class="lit isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity:0"></b></i></span></span><span class="lc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><span class="num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span><span class="lc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><span class="num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span><span class="lc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><span class="num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span><span class="lc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><span class="num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span><span class="lc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><span class="num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span><span class="sets num setsWonA currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="pts num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="tob isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="tclock num timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</b></span></div>
<div class="lrow rB" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="lname"><span class="nm clamp2 combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="srv isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"><i class="vball"></i></span><span class="pips"><i class="pip"><b class="lit isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity:0"></b></i></span></span><span class="lc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><span class="num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="lc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><span class="num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="lc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><span class="num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="lc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><span class="num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="lc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><span class="num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span><span class="sets num setsWonB currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="pts num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="tob isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="tclock num timeOutTimerB" data-osb-component="field" data-osb-field="timeOutTimerB">0</b></span></div>
<span class="slot pslot"><span class="pt gp isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">SET POINT</span><span class="pt mp isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><span class="osb-core-fields"><span class="num timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA">0</span><span class="num timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB">0</span></span></section></main>
</body>
</html>
