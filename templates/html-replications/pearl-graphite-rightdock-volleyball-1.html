<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pearl Graphite Rightdock — Volleyball 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.board{display:flex;width:min(96vw,1300px);max-width:100%;aspect-ratio:1300/282;overflow:hidden;border:1px solid #aebdbb;border-radius:3px;background:#e8ebe7;color:#26363e;container-type:inline-size}
.teams{display:flex;flex:1 1 0;min-width:0;flex-direction:column}
.team{display:flex;flex:1 1 0;min-height:0;min-width:0;align-items:stretch}
.team+.team{border-top:1px solid #aebdbb}
.identity{display:block;flex:0 0 3.7%;background:#2b85a3}
.jerseyColorB{background:#c76b64}
.name{display:flex;align-items:center;flex:1 1 0;min-width:0;overflow:hidden;padding:0 3.5%;font-size:clamp(17px,5.2cqw,70px);font-weight:700;line-height:1.05;white-space:nowrap;text-overflow:ellipsis}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support,.primary{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.support{flex:0 0 16%;background:#e8ebe7;color:#26363e}
.primary{flex:0 0 21.5%;background:#26363e;color:#f8faf8}
.number{display:block;max-width:100%;overflow:hidden;font-weight:700;line-height:1;text-align:center}
.support .number{font-size:clamp(19px,4.7cqw,62px)}
.primary .number{font-size:clamp(25px,6.3cqw,82px)}
.caption{display:block;max-width:100%;overflow:hidden;font-size:clamp(9px,2.15cqw,27px);font-weight:700;line-height:1.15}
.dock{display:flex;flex:0 0 25.2%;min-width:0;flex-direction:column;align-items:center;justify-content:flex-start;border-left:1px solid #aebdbb;background:#26363e;color:#f8faf8;text-align:center}
.sport{display:flex;align-items:center;justify-content:center;flex:0 0 36%;max-width:100%;padding:0 5%;overflow:hidden;font-size:clamp(12px,3.05cqw,40px);font-weight:700;line-height:1;white-space:nowrap}
.rule{display:block;width:82%;height:1px;background:#aebdbb}
.status{display:flex;flex:1 1 0;min-height:0;flex-direction:column;align-items:center;justify-content:center;gap:3%;font-variant-numeric:tabular-nums}
.status-label{font-size:clamp(10px,2.5cqw,31px);font-weight:700;line-height:1}
.current-set{font-size:clamp(22px,5.7cqw,78px);font-weight:700;line-height:1}
@media(max-width:650px){.stage{padding:5px}.board{width:100%;height:126px;aspect-ratio:auto}.name{padding:0 3%;font-size:clamp(13px,4.5cqw,29px)}.support{flex-basis:14%}.primary{flex-basis:18%}.dock{flex-basis:25%}.support .number{font-size:clamp(15px,5cqw,31px)}.primary .number{font-size:clamp(21px,7cqw,44px)}.caption{font-size:clamp(8px,2.3cqw,14px)}.sport{font-size:clamp(9px,2.7cqw,17px)}.status-label{font-size:clamp(8px,2.4cqw,15px)}.current-set{font-size:clamp(20px,6cqw,38px)}}
.board{position:relative}.neutral-point-slot{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}.neutral-point-slot:has(.isMatchPoint[style*="opacity: 1"]) .isGamePoint,.neutral-point-slot:has(.isMatchPoint[style*="opacity:1"]) .isGamePoint{opacity:0!important}</style>
</head>
<body>
<main class="stage">
<article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Volleyball scoreboard">
  <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
    <div class="team competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
      <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
      <div class="support support-track"><span class="number currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="caption">SETS</span></div>
      <div class="primary primary-track"><span class="number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="caption">POINTS</span></div>
    </div>
    <div class="team competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
      <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
      <div class="support support-track"><span class="number currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="caption">SETS</span></div>
      <div class="primary primary-track"><span class="number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="caption">POINTS</span></div>
    </div>
  </div>
  <aside class="dock columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="sport dock-title">VOLLEYBALL</span><span class="rule"></span><div class="status"><span class="status-label">SET</span><span class="current-set" data-osb-static="true" data-sport-stat="current-set">0</span></div></aside>
<span class="neutral-point-slot" aria-hidden="true"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;"></span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;"></span></span></article>
</main>
</body>
</html>
