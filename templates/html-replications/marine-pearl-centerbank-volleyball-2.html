<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marine Pearl Centerbank Volleyball — Horizontal Score Bank</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: transparent; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .stage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
    .board { display: flex; flex-direction: column; width: min(91vw, 1280px); max-width: 100%; color: #23343b; container-type: inline-size; }
    .main { display: flex; min-width: 0; height: 7.1cqw; min-height: 74px; border: 2px solid #90a8a7; background: #edf0ed; }
    .sport { display: flex; align-items: center; justify-content: center; flex: 0 0 16.5%; min-width: 0; border-right: 2px solid #90a8a7; background: #152f3c; color: #fff; font-size: 2cqw; font-weight: 800; line-height: 1; white-space: nowrap; }
    .team { display: flex; align-items: stretch; flex: 1 1 0; min-width: 0; }
    .team-a { flex-direction: row; }
    .team-b { flex-direction: row; }
    .tick { display: block; flex: 0 0 3.2%; align-self: stretch; background: #6bb89c; }
    .jerseyColorB { background: #789dbf; }
    .name { display: block; align-content: center; flex: 1 1 0; min-width: 0; overflow: hidden; padding: 0 2.25cqw; color: #23343b; font-size: 3.7cqw; font-weight: 700; line-height: 1.05; text-overflow: ellipsis; white-space: nowrap; }
    .combinedBName { text-align: right; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .sets { display: flex; align-items: center; justify-content: center; flex: 0 0 17%; flex-direction: column; min-width: 0; gap: .2cqw; white-space: nowrap; }
    .sets-label { font-size: 1.9cqw; font-weight: 700; line-height: 1; }
    .sets-score { font-size: 2.65cqw; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .points-score { display: flex; align-items: center; justify-content: center; flex: 0 0 18%; min-width: 0; border-left: 2px solid #90a8a7; background: #284e5d; color: #fff; font-size: 5.15cqw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .team-b .points-score { border-right: 2px solid #90a8a7; border-left: 2px solid #90a8a7; }
    .footer-row { display: flex; min-width: 0; }
    .footer-spacer { display: block; flex: 0 0 16.5%; }
    .set-strip { display: flex; align-items: center; justify-content: center; flex: 1 1 0; height: 3.2cqw; min-height: 31px; gap: 1.1cqw; border: 2px solid #90a8a7; border-top: 0; background: #edf0ed; color: #23343b; font-size: 2.25cqw; font-weight: 800; line-height: 1; white-space: nowrap; }
    .set-strip::before, .set-strip::after { content: ""; display: block; flex: 1 1 0; height: 1px; margin: 0 1.4cqw; background: #90a8a7; }
    .set-value { font-variant-numeric: tabular-nums; }
    .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint,
    .point-slot:has(> .isMatchPoint[style*="opacity:1"]) > .isGamePoint { opacity: 0 !important; }
    @media (max-width: 600px) {
      .board { width: 100%; }
      .main { height: 76px; }
      .sport { flex-basis: 20%; font-size: clamp(8px, 2.3vw, 11px); }
      .team { flex-basis: 0; }
      .tick { flex-basis: 4px; }
      .name { padding: 0 4px; font-size: clamp(10px, 2.8vw, 14px); }
      .sets { flex-basis: 17%; }
      .sets-label { font-size: 8px; }
      .sets-score { font-size: 16px; }
      .points-score { flex-basis: 25%; font-size: clamp(22px, 6vw, 29px); }
      .footer-spacer { flex-basis: 20%; }
      .set-strip { height: 31px; gap: 5px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="stage" data-osb-component="layout">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <div class="main rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="sport" data-osb-component="text">VOLLEYBALL</div>
        <div class="team team-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
          <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
          <div class="sets columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="sets-label" data-osb-component="text">SETS</span><span class="sets-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
          <span class="points-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span>
        </div>
        <div class="team team-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <span class="points-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span>
          <div class="sets columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="sets-label" data-osb-component="text">SETS</span><span class="sets-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
          <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
          <span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
        </div>
      </div>
      <div class="footer-row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="footer-spacer" data-osb-component="decoration"></span><footer class="set-strip rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">SET</span><span class="set-value" data-osb-component="text" data-osb-static="true" data-sport-stat="set">0</span></footer></div>
      <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
