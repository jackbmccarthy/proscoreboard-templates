<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Half Time Report</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    .osb { position: relative; width: 1100px; border-radius: 14px; overflow: hidden; background: #f4f1ea; color: #15181d; box-shadow: 0 20px 50px #000c; }
    .top { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; padding: 24px 40px; background: #15181d; color: #fff; }
    .ev { display: flex; flex-direction: column; gap: 4px; }
    .ev .eventName { font-size: 30px; font-weight: 700; }
    .ev .matchRound { font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #f5b82e; }
    .status { display: grid; min-width: 280px; height: 60px; border-radius: 8px; overflow: hidden; background: #262a31; }
    .status > * { grid-area: 1 / 1; }
    .live { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 16px; }
    .dot { width: 12px; height: 12px; color: #ff4b4b; }
    .per { font-size: 17px; font-weight: 800; letter-spacing: 1px; color: #f5b82e; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .add { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 20px; font-weight: 700; color: #15181d; background: #f5b82e; padding: 1px 7px; border-radius: 4px; }
    .runbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #f5b82e; }
    .mp { display: flex; gap: 3px; }
    .h { position: relative; width: 14px; height: 4px; background: #4a505b; }
    .h > span { position: absolute; inset: 0; background: #f5b82e; }
    .et { width: 7px; height: 4px; background: #fff; }
    .state { z-index: 1; display: flex; align-items: center; justify-content: center; gap: 12px; line-height: 1; background: #f5b82e; color: #15181d; }
    .st-b { font-size: 26px; font-weight: 800; letter-spacing: 3px; }
    .b-ht { font-size: 0; } .b-ht::after { content: "HALF TIME"; font-size: 24px; }
    .pens { z-index: 2; background: #fff; }
    .st-s { font-size: 17px; font-weight: 800; letter-spacing: 3px; }
    .st-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 32px; font-weight: 700; }
    .st-v b { padding: 0 5px; }
    .fin { z-index: 3; background: #e5322d; color: #fff; }
    .fin .st-b { font-size: 0; } .fin .st-b::after { content: "FULL TIME"; font-size: 24px; letter-spacing: 4px; }
    .head { display: grid; grid-template-columns: 1fr 220px 1fr; align-items: center; padding: 26px 40px 20px; border-bottom: 2px solid #ddd6c8; }
    .tm { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .tm.B { flex-direction: row-reverse; text-align: right; }
    .kit { flex: 0 0 auto; width: 14px; height: 64px; border-radius: 3px; background-color: #59616e; }
    .nm { min-width: 0; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 40px; font-weight: 700; line-height: 1; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
    .score { display: flex; align-items: center; justify-content: center; gap: 16px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 92px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .score b { font-size: 50px; color: #b5ad9c; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 20px 40px 30px; }
    h3 { margin: 0 0 10px; font-size: 14px; font-weight: 800; letter-spacing: 3px; color: #8a8270; }
    table { width: 100%; border-collapse: collapse; }
    th, td { height: 48px; border-bottom: 1px solid #e3ddd0; }
    th { text-align: left; font-size: 18px; font-weight: 700; color: #3d4048; }
    td { width: 110px; text-align: center; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
    td .v { justify-content: center; }
    .nd { color: #c2baa8; }
    td:has(.v[style*="opacity: 1"]) .nd { display: none; }
    .pr.p3:not(:has(.v[style*="opacity: 1"])), .pr.p4:not(:has(.v[style*="opacity: 1"])) { display: none; }
    thead th { height: 32px; font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #8a8270; text-align: center; }
    thead th:first-child { text-align: left; }
    .sw { display: inline-block; width: 44px; height: 8px; border-radius: 2px; background-color: #59616e; }
    .disc td .cell { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .disc td b { font-size: 30px; }
    .yc, .rc { width: 22px !important; margin: 0 !important; }
    
    .cards { display: flex; gap: 4px; flex: 0 0 auto; }
    .yc, .rc { display: flex; align-items: center; justify-content: center; width: 22px; height: 30px; border-radius: 2px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 19px; font-weight: 700; line-height: 1; box-shadow: 0 1px 2px #0006; }
    .yc { background: #ffd21f; color: #2a2300; }
    .rc { background: #e3262e; color: #fff; }
    .yc[style*="opacity: 0"], .rc[style*="opacity: 0"] { width: 0; margin-left: -4px; }
    .brk .b-ft, .brk .b-eh, .brk .b-aet { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]) .brk .b-ht { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .b-ft { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .brk .b-eh { display: inline; }
    .osb:has(.isGame4Started[style*="opacity: 1"]) .brk .b-aet { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]) .brk .b-ft { display: none; }
    .add-v:empty::before { content: "+0"; }
    .dot i { display: block; width: 100%; height: 100%; border-radius: 50%; background: currentColor; animation: osb-pulse 1.6s ease-in-out infinite; }
    @keyframes osb-pulse { 50% { opacity: .35; } }
    .osb:has(.isComplete[style*="opacity: 1"]) .dot i { animation: none; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.fpens{white-space:nowrap}
.fpens:not([style*="opacity: 1"]){display:none}
.fin:has(.isDecidedOnPenalties[style*="opacity: 1"]) .st-b::after{content:none}
.cell>b:empty::before{content:"0";opacity:.55}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.st-b,.grid>div>h3,.grid>div>table>thead>tr>th{font-size:16px!important}
.dot.isMatchStarted>i,.et.isGame3Started,.et.isGame4Started{width:12px!important;height:12px!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

  </style>
</head>
<body>
<article class="osb" aria-label="Soccer match report">
  <div class="top">
    <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
    <div class="status">
      <div class="live"><span class="dot isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"><i></i></span><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="add addedTimeVisible" data-osb-component="field" data-osb-field="addedTimeVisible" style="opacity: 0;"><span class="add-v addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="mp"><span class="h"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="h"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="et isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span><span class="et isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
      <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="st-b b-ht">HT</span><span class="st-b b-ft">FT</span><span class="st-b b-eh">ET HT</span><span class="st-b b-aet">AET</span></div>
      <div class="state pens isShootoutActive" data-osb-component="field" data-osb-field="isShootoutActive" style="opacity: 0;"><span class="st-s">PENS</span><span class="st-v"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span><b>-</b><span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span></span></div>
      <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FT<span class="isDecidedOnPenalties fpens" data-osb-component="field" data-osb-field="isDecidedOnPenalties" style="opacity:0"> (<span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span>-<span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span> PENS)</span></span></div>
    </div>
  </div>
  <div class="head">
    <div class="tm A"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div>
    <div class="score"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b>-</b><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
    <div class="tm B"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div>
  </div>
  <div class="grid">
    <div><h3>GOALS BY PERIOD</h3><table><thead><tr><th>PERIOD</th><th><span class="sw jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></th><th><span class="sw jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></th></tr></thead><tbody><tr class="pr p1"><th>1st half</th><td><span class="nd">&ndash;</span><span class="v isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"><span class="game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span></td><td><span class="nd">&ndash;</span><span class="v isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"><span class="game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></td></tr><tr class="pr p2"><th>2nd half</th><td><span class="nd">&ndash;</span><span class="v isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"><span class="game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span></td><td><span class="nd">&ndash;</span><span class="v isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"><span class="game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></td></tr><tr class="pr p3"><th>Extra time 1</th><td><span class="nd">&ndash;</span><span class="v isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"><span class="game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span></td><td><span class="nd">&ndash;</span><span class="v isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"><span class="game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></td></tr><tr class="pr p4"><th>Extra time 2</th><td><span class="nd">&ndash;</span><span class="v isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"><span class="game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span></td><td><span class="nd">&ndash;</span><span class="v isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"><span class="game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></td></tr></tbody></table></div>
    <div><h3>DISCIPLINE &amp; FOULS</h3><table class="disc"><thead><tr><th>&nbsp;</th><th><span class="sw jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></th><th><span class="sw jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></th></tr></thead><tbody>
      <tr><th>Yellow cards</th><td><span class="cell"><span class="yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"></span><b class="yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></b></span></td><td><span class="cell"><span class="yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"></span><b class="yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></b></span></td></tr>
      <tr><th>Red cards</th><td><span class="cell"><span class="rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"></span><b class="redCardsA" data-osb-component="field" data-osb-field="redCardsA"></b></span></td><td><span class="cell"><span class="rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"></span><b class="redCardsB" data-osb-component="field" data-osb-field="redCardsB"></b></span></td></tr>
      <tr><th>Fouls</th><td><b class="teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA">0</b></td><td><b class="teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB">0</b></td></tr>
    </tbody></table></div>
  </div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="homeSide" data-osb-component="field" data-osb-field="homeSide"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
