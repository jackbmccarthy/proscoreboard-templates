<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Half-time Report</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    .screen { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; width: 100vw; height: 100vh; background: linear-gradient(90deg, #0c2a17 0 10%, #0f311b 10% 20%, #0c2a17 20% 30%, #0f311b 30% 40%, #0c2a17 40% 50%, #0f311b 50% 60%, #0c2a17 60% 70%, #0f311b 70% 80%, #0c2a17 80% 90%, #0f311b 90%); color: #fff; }
    .head { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ev { display: flex; gap: 16px; font-size: 18px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; }
    .ev-round { color: #facc15; }
    .flag { padding: 6px 22px; background: #facc15; color: #0c2a17; font-size: 22px; font-weight: 800; letter-spacing: 6px; border-radius: 3px; }
    .flagslot { display: grid; justify-items: center; min-height: 40px; }
    .flagslot > * { grid-area: 1 / 1; }
    .scoreline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 36px; width: 82vw; }
    .team { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .team.a { justify-content: flex-end; }
    .kit { flex: 0 0 auto; width: 16px; height: 70px; background-color: #2f6b45; }
    .nm { min-width: 0; font-size: 50px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score { display: flex; align-items: center; gap: 22px; padding: 6px 34px; background: #fff; color: #0c2a17; border-radius: 10px; font-size: 104px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .score .dash { width: 26px; height: 8px; background: #0c2a17; }
    .clockline { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: #d1fae5; }
    .gc { font-variant-numeric: tabular-nums; }
    .added { color: #facc15; }
    .added:has(.at:empty) { display: none; }
    .half { padding: 2px 10px; border: 2px solid #d1fae5; border-radius: 4px; font-size: 18px; }
    .half:empty { display: none; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 82vw; }
    .panel { display: flex; flex-direction: column; background: #00000055; border: 1px solid #ffffff22; border-radius: 10px; overflow: hidden; }
    .panel h2 { margin: 0; padding: 10px 20px; background: #14532d; font-size: 15px; font-weight: 700; letter-spacing: 4px; }
    .line { display: grid; grid-template-columns: 1fr 70px 70px; align-items: center; padding: 10px 20px; border-top: 1px solid #ffffff1a; font-size: 22px; font-weight: 600; }
    .line > span:not(:first-child) { text-align: center; font-variant-numeric: tabular-nums; }
    .line .lbl { font-size: 15px; letter-spacing: 3px; color: #d1fae5; }
    .yc:empty::before, .rc:empty::before, .tf:empty::before { content: "-"; opacity: .5; }
    .card { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 20px; height: 28px; border-radius: 3px; font-size: 13px; font-weight: 800; }
    .card.red { background: #e5262b; } .card.yellow { background: #f7d117; color: #0c2a17; }
    .cardi { display: inline-block; width: 12px; height: 17px; margin-right: 10px; border-radius: 2px; vertical-align: -2px; }
    .cardi.y { background: #f7d117; } .cardi.r { background: #e5262b; }
    .pens { display: none; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<main class="screen" aria-label="Soccer half-time report">
  <header class="head"><span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span class="flagslot"><span class="flag isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">HALF-TIME</span><span class="flag isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;">FULL TIME</span></span></header>
  <section class="scoreline">
    <span class="team a"><span class="card yellow isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="card red isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span>
    <span class="score"><span class="sa currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b class="dash"></b><span class="sb currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span>
    <span class="team b"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="card yellow isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="card red isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span></span>
  </section>
  <div class="clockline"><span class="live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="added addedTimeVisible"><span class="at addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="half periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span></div>
  <section class="panels">
    <div class="panel"><h2>GOALS BY PERIOD</h2>
      <div class="line"><span class="lbl">1ST HALF</span><span class="ga game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span><span class="gb game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></div>
      <div class="line"><span class="lbl">2ND HALF</span><span class="ga game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span><span class="gb game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></div>
      <div class="otwrap isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"><div class="line"><span class="lbl">EXTRA TIME 1</span><span class="ga game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span><span class="gb game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></div></div>
      <div class="otwrap isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"><div class="line"><span class="lbl">EXTRA TIME 2</span><span class="ga game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span><span class="gb game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></div></div>
      <span class="pens shootoutAttempts"><b class="pens-l">PENS</b><span class="pen-a shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore"></span><b class="pens-d">-</b><span class="pen-b shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore"></span></span>
    </div>
    <div class="panel"><h2>DISCIPLINE</h2>
      <div class="line"><span class="lbl"><i class="cardi y"></i>YELLOW CARDS</span><span class="yc yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span><span class="yc yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></div>
      <div class="line"><span class="lbl"><i class="cardi r"></i>RED CARDS</span><span class="rc redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span><span class="rc redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></div>
      <div class="line"><span class="lbl">FOULS</span><span class="tf teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA"></span><span class="tf teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB"></span></div>
    </div>
  </section>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</main>
</body>
</html>
