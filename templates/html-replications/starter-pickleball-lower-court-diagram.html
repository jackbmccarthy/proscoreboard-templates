<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Court Diagram</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.rowContainer{display:flex;flex-direction:row}.columnContainer{display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
img.logo:not([src]),img.logo[src=""]{display:none}
.pt-slot{position:relative;display:block}.pt-slot>.pt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.pt-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint,.pt-slot:has(> .isMatchPoint[style*="opacity:1"]) > .isGamePoint{opacity:0!important}
.pt-slot .isMatchPoint{animation:osbPulse 1.8s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.3)}}
@media (prefers-reduced-motion: reduce) {
.pt-slot .isGamePoint,.pt-slot .isMatchPoint{animation:none!important;transition:none!important}
}
.pips{display:inline-flex;gap:.35rem;align-items:center}.pip{position:relative;display:block;width:.7rem;height:.7rem;border-radius:50%;background:currentColor}
.pip-used{position:absolute;inset:-1px;border-radius:50%;background:var(--pip-off,#0009)}
.to-left:empty{display:none}
.isACurrentlyServing,.isBCurrentlyServing{transition:opacity .2s}
.dbl-probe{display:none}
.vball{display:block;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9 0 18%,transparent 40%),conic-gradient(from 20deg,#ffd23f 0 120deg,#1d4fbf 0 240deg,#f4f6fb 0);box-shadow:inset 0 0 0 .12rem #0005}
.pball{display:block;border-radius:50%;background:radial-gradient(circle at 30% 32%,#0003 0 9%,transparent 10%),radial-gradient(circle at 66% 30%,#0003 0 9%,transparent 10%),radial-gradient(circle at 50% 62%,#0003 0 9%,transparent 10%),radial-gradient(circle at 24% 70%,#0002 0 7%,transparent 8%),radial-gradient(circle at 78% 70%,#0002 0 7%,transparent 8%),radial-gradient(circle at 38% 30%,#fbffb0,#d4f02b 60%,#a9c414)}
.sn{position:relative;display:inline-grid}.sn>i,.cn>i{grid-area:1/1;font-style:normal}
.sn:has(> .isSecondServer[style*="opacity: 1"]) > .one,.sn:has(> .isSecondServer[style*="opacity:1"]) > .one{opacity:0}
.cn{position:relative;display:inline-grid}.cn:has(> .isSecondServer[style*="opacity: 1"]) > .one,.cn:has(> .isSecondServer[style*="opacity:1"]) > .one{opacity:0}
.call{display:inline-flex;align-items:baseline}.call>i{font-style:normal}.call .ca{order:1}.call .cd1{order:2}.call .cb{order:3}.call .cd2{order:4}.call .cn{order:5}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .ca,.board:has(.isBCurrentlyServing[style*="opacity:1"]) .call .ca{order:3}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .cb,.board:has(.isBCurrentlyServing[style*="opacity:1"]) .call .cb{order:1}
.board:has(.playerA2:empty) .sn,.board:has(.playerA2:empty) .cn,.board:has(.playerA2:empty) .cd2{display:none}
.gstack{display:inline-grid}.gstack>.gs{grid-area:1/1;white-space:nowrap}.gstack>.gs:has(~ .gs[style*="opacity: 1"]),.gstack>.gs:has(~ .gs[style*="opacity:1"]){visibility:hidden}
.tie{display:none}
.cards{display:inline-flex;gap:.25rem}.card{display:block;width:.8rem;height:1.1rem;border-radius:.15rem;box-shadow:0 0 0 1px #0003}.yc{background:#ffd200}.rc{background:#e3262f}
.live{display:inline-flex;align-items:center;gap:.35rem}.live::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:#ff3b30}
.stage{position:fixed;left:50%;bottom:4rem;transform:translateX(-50%)}
.board{position:relative;width:96rem;color:#fff;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;font-weight:700;filter:drop-shadow(0 .4rem 1rem #0008)}
.tab{align-self:center;gap:1rem;align-items:center;padding:.4rem 2rem;border-radius:.6rem .6rem 0 0;background:#0b2238;font-size:1.15rem;letter-spacing:.14em;color:#9fd3b8}
.main{height:8rem;align-items:stretch}
.end{flex:1;min-width:0;align-items:center;gap:1rem;padding:0 1.4rem;background:#123a5c}.end.a{border-radius:.6rem 0 0 .6rem}.end.b{flex-direction:row-reverse;border-radius:0 .6rem .6rem 0}
.chip{width:.8rem;height:5rem;border-radius:.4rem;background:#3d7bff}.end.b .chip{background:#ff6b5a}
.who{flex:1;min-width:0;gap:.2rem}.end.b .who{align-items:flex-end}
.nm{max-width:100%;font-size:2.6rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:.6rem;font-size:1rem;letter-spacing:.12em;color:#9fb6d3}
.won{display:inline-flex;align-items:center;justify-content:center;min-width:2rem;height:2rem;border-radius:.3rem;background:#0b2238;color:#d4f02b;font-size:1.3rem}
.srv{display:flex;align-items:center;gap:.3rem}.pball{width:1.8rem;height:1.8rem}.sn{min-width:1.7rem;height:1.7rem;place-items:center;border-radius:.3rem;background:#d4f02b;color:#123a5c;font-size:1.1rem}
.pts{width:7rem;display:flex;align-items:center;justify-content:center;font-size:5rem;background:#0b2238}
.court{position:relative;width:26rem;align-items:center;justify-content:center;background:#2f6fb8;border:.25rem solid #fff;margin:0 .3rem}
.court::before,.court::after{content:"";position:absolute;top:0;bottom:0;width:20%;background:#2fa36b;border:solid #fff;border-width:0 .2rem}
.court::before{left:30%}.court::after{right:30%}
.court .netl{position:absolute;left:50%;top:-.6rem;bottom:-.6rem;width:.3rem;margin-left:-.15rem;background:#fff;z-index:1}
.court .mid{position:relative;z-index:2;align-items:center;gap:.3rem;padding:.4rem 1.2rem;background:#0b2238e6;border-radius:.5rem}
.call{font-size:2.6rem;gap:.2rem;color:#d4f02b}.call>i{opacity:.7}
.mid .gstack{font-size:1rem;letter-spacing:.16em;color:#fff}
.rail{justify-content:center;gap:.5rem;margin-top:.4rem;align-items:center}
.rail .pt-slot{width:14rem;height:2.2rem}.rail .pt{border-radius:.4rem;background:#d4f02b;color:#123a5c;font-size:1.1rem}
.st{display:flex;align-items:center;gap:.3rem}.to-used{font-size:.85rem;color:#d4f02b}
.tolive{position:absolute;left:0;right:0;bottom:100%;margin-bottom:3rem;display:flex;justify-content:space-between}.to-live,.to-any{gap:.4rem;padding:.4rem 1rem;border-radius:.4rem;background:#d4f02b;color:#123a5c;font-size:1.3rem}.to-any{display:none!important}
</style>
</head>
<body>
<main class="stage"><section class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<header class="tab rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0">LIVE</span><span class="ev eventName" data-osb-component="field" data-osb-field="eventName"></span><span>&middot;</span><span class="rd matchRound" data-osb-component="field" data-osb-field="matchRound"></span></header>
<div class="main rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="end a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><div class="who columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="meta">GAMES <span class="won num currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="pball"></i><b class="sn"><i class="one">1</i><i class="two isSecondServer" isA="true" data-osb-component="field" style="opacity:0">2</i></b></span><span class="st"><span class="to-used isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0">T/O USED</span><span class="cards"><span class="card yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0"></span><span class="card rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0"></span></span></span></span></div><span class="pts num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div><div class="court rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="netl"></i><div class="mid columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="gstack"><span class="gs isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display:none;opacity:0">GAME 1</span><span class="gs isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display:none;opacity:0">GAME 2</span><span class="gs isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display:none;opacity:0">GAME 3</span><span class="gs isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display:none;opacity:0">GAME 4</span><span class="gs isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display:none;opacity:0">GAME 5</span></span><span class="call"><span class="ca num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><i class="cd1">-</i><span class="cb num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><i class="cd2">-</i><b class="cn"><i class="one">1</i><i class="two isSecondServer" isA="true" data-osb-component="field" style="opacity:0">2</i><i class="two isSecondServer" data-osb-component="field" style="opacity:0">2</i></b></span></div></div><div class="end b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><div class="who columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="meta"><span class="st"><span class="to-used isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none;opacity:0">T/O USED</span><span class="cards"><span class="card yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0"></span><span class="card rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0"></span></span></span><span class="srv isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"><i class="pball"></i><b class="sn"><i class="one">1</i><i class="two isSecondServer" data-osb-component="field" style="opacity:0">2</i></b></span><span class="won num currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span> GAMES</span></div><span class="pts num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
<footer class="rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="pt-slot"><span class="pt isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="pt isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span></footer>
<div class="tolive"><span class="to-live isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0">TIMEOUT <span class="to-clock num timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</span></span><span class="to-any isTimeOutActive" data-osb-component="field" data-osb-field="isTimeOutActive" style="display:none;opacity:0">TIMEOUT</span><span class="to-live isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0">TIMEOUT <span class="to-clock num timeOutTimerB" data-osb-component="field" data-osb-field="timeOutTimerB">0</span></span></div><span class="dbl-probe playerA2" data-osb-component="field" data-osb-field="playerA2"></span><span class="tie"><img class="logo teamLogoURLA" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><i class="tchip teamJerseyColorA" data-osb-component="field" data-osb-field="teamJerseyColorA"></i><span class="tn teamAName" data-osb-component="field" data-osb-field="teamAName"></span><span class="ts num teamAScore" data-osb-component="field" data-osb-field="teamAScore">0</span><i class="tdash">-</i><span class="ts num teamBScore" data-osb-component="field" data-osb-field="teamBScore">0</span><span class="tn teamBName" data-osb-component="field" data-osb-field="teamBName"></span><i class="tchip teamJerseyColorB" data-osb-component="field" data-osb-field="teamJerseyColorB"></i><img class="logo teamLogoURLB" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""></span></section></main>
</body>
</html>
