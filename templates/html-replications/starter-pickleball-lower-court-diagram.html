<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Court Diagram</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing{animation:none!important;transition:none!important}}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.02}
.pball{display:block;border-radius:50%;background:radial-gradient(circle at 30% 34%,#0004 0 8%,transparent 9%),radial-gradient(circle at 64% 30%,#0004 0 8%,transparent 9%),radial-gradient(circle at 52% 64%,#0004 0 8%,transparent 9%),radial-gradient(circle at 24% 72%,#0003 0 6%,transparent 7%),radial-gradient(circle at 78% 70%,#0003 0 6%,transparent 7%),radial-gradient(circle at 36% 30%,#fbffb4,#d8f22c 60%,#a6c214);box-shadow:0 0 .4rem #0007}
.sslot{align-items:center}.sslot>.st{display:flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap;height:100%}
.board:has(.isMatchStarted[style*="opacity: 1"]) .swarm{opacity:0!important}
.board:has(.isGamePoint[style*="opacity: 1"]) .sbrk,.board:has(.isMatchPoint[style*="opacity: 1"]) .sbrk{opacity:0!important}
.pslot>.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hist:not(:has(>[style*="opacity: 1"])){display:none}
.srv{display:flex;align-items:center;gap:.35rem}
.sn{position:relative;display:inline-grid;place-items:center}.sn>i{grid-area:1/1;font-style:normal}
.sn:has(>.isSecondServer[style*="opacity: 1"])>.one,.cn:has(>.isSecondServer[style*="opacity: 1"])>.one{opacity:0}
.cn{display:inline-grid}.cn>i{grid-area:1/1;font-style:normal;text-align:center}
.call{display:inline-flex;align-items:baseline}.call>i,.dbl>i{font-style:normal}.call .ca{order:1}.call .d1{order:2}.call .cb{order:3}.call .dbl{order:4;display:inline-flex;align-items:baseline}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .ca{order:3}.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .cb{order:1}
.call .dbl:not([style*="opacity: 1"]){display:none}
.cards{display:flex;gap:.3rem;align-items:center}.card{display:block;border-radius:.15rem;box-shadow:0 0 0 .1rem #0004}.yc{background:#ffd200}.rc{background:#e3262f}
.cards:not(:has(>[style*="opacity: 1"])){display:none}
.tie{display:flex;align-items:center}.tie:has(>.teamAName[style*="display: none"]){display:none}
.tlogo{display:block;object-fit:contain}.tlogo:not([src]),.tlogo[src=""]{visibility:hidden}
.tie>.tdash{font-style:normal}
.tname{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.05}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>:not(.tie){display:none}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>.tie{height:auto;min-height:5.2rem;padding-top:.6rem;padding-bottom:.4rem;margin:0}

.stage{position:fixed;left:0;right:0;bottom:4rem;display:flex;justify-content:center}
.board{position:relative;width:92rem;font-family:"DIN Condensed","Bahnschrift SemiBold Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;color:#fff}
.tie{justify-content:center;gap:1rem;width:62rem;margin:0 auto .4rem;height:3.8rem;padding:.3rem 1.4rem 0;background:#0e2f4f;color:#fff;font-size:1.9rem;font-weight:700;text-transform:uppercase;border-radius:.4rem}.tlogo{width:2.8rem;height:2.8rem}.tchip{width:.6rem;height:2.4rem}.tname:last-of-type{text-align:right}.tscore{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.6rem;color:#ffd84d}.tie>.tdash{color:#7fa3c7}
.evt{display:flex;justify-content:center}
.ctx{display:flex;align-items:center;gap:.7rem;height:3rem;padding:.35rem 2rem 0;background:#0e2f4f;color:#cfe3f7;font-size:1.7rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;border-radius:.4rem .4rem 0 0}.ctx .sep{font-style:normal;color:#ffd84d}
.band{display:flex;align-items:stretch;height:7rem;background:#174a7a;border-radius:.4rem;box-shadow:0 .6rem 1.4rem #0008}
.side{position:relative;flex:1;min-width:0;display:flex;align-items:stretch}
.sB{flex-direction:row-reverse}
.chip{width:1.1rem;flex:none}.sA .chip{border-radius:.4rem 0 0 .4rem}.sB .chip{border-radius:0 .4rem .4rem 0}
.who{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.3rem;padding:.4rem 1.2rem 0}.sB .who{align-items:flex-end;text-align:right}
.nm{font-size:2.8rem;font-weight:700;text-transform:uppercase}
.meta{display:flex;height:2rem;align-items:center}
.stat{display:flex;align-items:center;gap:.5rem}.sB .stat{flex-direction:row-reverse}.card{width:1.2rem;height:1.7rem}
.tou{display:flex;align-items:center;height:2rem;padding:.25rem .6rem 0;border-radius:.25rem;background:#ffffff22;color:#ffd84d;font-size:1.5rem;letter-spacing:.06em}
.srv{flex:none;padding:0 .7rem}.pball{width:2.3rem;height:2.3rem}
.sn{min-width:2.2rem;height:2.2rem;border-radius:.3rem;background:#ffd84d;color:#0e2f4f;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:1.7rem;font-weight:700}
.games{width:4.8rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.4rem;background:#0e2f4f;color:#ffd84d;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:3.2rem;font-weight:700}
.pts{width:7.6rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.4rem;background:#fff;color:#0e2f4f;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4.8rem;font-weight:700}
.court{position:relative;width:15rem;flex:none;display:flex;flex-direction:column;background:#2e8b57;border-left:.25rem solid #fff;border-right:.25rem solid #fff}
.court::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:.25rem solid #ffffffd9}
.court::after{content:"";position:absolute;left:30%;right:30%;top:0;bottom:0;border-left:.15rem solid #ffffff66;border-right:.15rem solid #ffffff66}
.sslot{position:relative;z-index:1;height:2.8rem}.sslot>.st{font-size:1.6rem;letter-spacing:.08em;background:#0e2f4f;color:#cfe3f7;padding-top:.3rem}.sslot>.sgame{background:#ffd84d;color:#0e2f4f}.sslot>.swarm{background:#ff9b2f;color:#0e2f4f}.sslot>.sbrk{background:#fff;color:#0e2f4f}
.cbox{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.cbox .call{padding:.4rem 1rem 0;border-radius:.4rem;background:#0e2f4f;box-shadow:0 .2rem .5rem #0006}
.call{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.8rem;color:#ffd84d;font-weight:700;text-shadow:0 .1rem .3rem #0007;gap:.2rem}
.tob{position:absolute;bottom:100%;display:flex;align-items:center;gap:.7rem;height:3rem;padding:.35rem 1.2rem 0;background:#ffd84d;color:#0e2f4f;font-size:1.8rem;letter-spacing:.06em;white-space:nowrap;border-radius:.4rem .4rem 0 0}.sA .tob{left:1.1rem}.sB .tob{right:1.1rem}.tob em{font-style:normal}.tob b{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.2rem}
.foot{display:flex;justify-content:center;height:3rem}
.hist{display:flex;align-items:center;background:#0e2f4f;border-radius:0 0 .4rem .4rem;padding:0 .6rem;font-size:1.6rem}
.hc{display:flex;align-items:center;gap:.35rem;padding:.35rem 1rem 0;color:#cfe3f7}.hc+.hc{border-left:.1rem solid #ffffff22}.hc .hl{font-weight:400;color:#7fa3c7;margin-right:.3rem}.hc .num{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:1.9rem}.hc .hd{font-style:normal;color:#7fa3c7}
.pslot{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;margin-bottom:3.4rem}.pt{height:3.2rem;padding:.4rem 1.6rem 0;border-radius:.4rem;font-size:2rem;letter-spacing:.1em;background:#ffd84d;color:#0e2f4f;box-shadow:0 .3rem .8rem #0007}.pt.mp{background:#e8202a;color:#fff}
.board:has(.tie>.teamAName:not([style*="display: none"])) .pslot{margin-bottom:7.6rem}
.sslot>.sfin{background:#ffd84d;color:#0e2f4f}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.tou.isATimeOutUsed,.tou.isBTimeOutUsed{font-size:1.25vw!important}
/* end stream-size floor */

</style>
</head>
<body>
<main class="stage"><section class="board" data-osb-component="layout" data-osb-component-type="osb-column-container">
<span class="tie"><img class="tlogo teamLogoURLA" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><i class="tchip teamJerseyColorA" data-osb-component="field" data-osb-field="teamJerseyColorA"></i><span class="tname teamAName" data-osb-component="field" data-osb-field="teamAName"></span><span class="tscore num teamAScore" data-osb-component="field" data-osb-field="teamAScore">0</span><i class="tdash">-</i><span class="tscore num teamBScore" data-osb-component="field" data-osb-field="teamBScore">0</span><span class="tname teamBName" data-osb-component="field" data-osb-field="teamBName"></span><i class="tchip teamJerseyColorB" data-osb-component="field" data-osb-field="teamJerseyColorB"></i><img class="tlogo teamLogoURLB" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""></span>
<div class="evt" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="ctx"><span class="eventName" data-osb-component="field" data-osb-field="eventName"></span><i class="sep">&middot;</i><span class="matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span></div>
<div class="band" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="side sA" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="who"><span class="nm clamp2 combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="meta"><span class="stat"><span class="cards"><i class="card yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0"></i><i class="card rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0"></i></span><span class="tou isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="opacity:0">T/O</span></span></span></span><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="pball"></i><b class="sn isDoubles" data-osb-component="field" data-osb-field="isDoubles" style="opacity:0"><i class="one">1</i><i class="two isSecondServer" data-osb-component="field" data-osb-field="isSecondServer" isA="true" style="opacity:0">2</i></b></span><span class="games num currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="pts num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="tob isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="tclock num timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</b></span></div><span class="court"><span class="slot sslot"><span class="st sfmt"><span class="matchFormatLabel" data-osb-component="field" data-osb-field="matchFormatLabel"></span></span><span class="st sgame isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0">GAME <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st swarm isWarmUpStarted" data-osb-component="field" data-osb-field="isWarmUpStarted" style="opacity:0">WARM-UP</span><span class="st sbrk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">END OF GAME <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sfin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">FINAL</span></span><span class="cbox"><span class="call"><span class="ca num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><i class="d1">-</i><span class="cb num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="dbl isDoubles" data-osb-component="field" data-osb-field="isDoubles" style="opacity:0"><i class="d2">-</i><b class="cn"><i class="one">1</i><i class="two isSecondServer" data-osb-component="field" data-osb-field="isSecondServer" isA="true" style="opacity:0">2</i><i class="two isSecondServer" data-osb-component="field" data-osb-field="isSecondServer" style="opacity:0">2</i></b></span></span></span></span><div class="side sB" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="who"><span class="nm clamp2 combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="meta"><span class="stat"><span class="cards"><i class="card yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0"></i><i class="card rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0"></i></span><span class="tou isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="opacity:0">T/O</span></span></span></span><span class="srv isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"><i class="pball"></i><b class="sn isDoubles" data-osb-component="field" data-osb-field="isDoubles" style="opacity:0"><i class="one">1</i><i class="two isSecondServer" data-osb-component="field" data-osb-field="isSecondServer" style="opacity:0">2</i></b></span><span class="games num currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="pts num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="tob isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="tclock num timeOutTimerB" data-osb-component="field" data-osb-field="timeOutTimerB">0</b></span></div></div>
<div class="foot" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="hist" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="hc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><b class="hl">G1</b><span class="ha num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span><i class="hd">-</i><span class="hb num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="hc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><b class="hl">G2</b><span class="ha num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span><i class="hd">-</i><span class="hb num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="hc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><b class="hl">G3</b><span class="ha num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span><i class="hd">-</i><span class="hb num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="hc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><b class="hl">G4</b><span class="ha num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span><i class="hd">-</i><span class="hb num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="hc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><b class="hl">G5</b><span class="ha num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span><i class="hd">-</i><span class="hb num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></div></div>
<span class="slot pslot"><span class="pt gp isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="pt mp isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><span class="osb-core-fields"><span class="playerA2" data-osb-component="field" data-osb-field="playerA2"></span></span></section></main>
</body>
</html>
