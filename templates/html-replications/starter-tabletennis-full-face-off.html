<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Full Screen — Face-off</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.flag:not([src]),.tlogo:not([src]){display:none}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isComplete[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isComplete[style*="opacity: 1"])>.isMatchPoint{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.meta{display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.meta>*{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta .sep{flex:0 0 auto;font-style:normal;padding:0 .45em;opacity:.55}
.meta .rd,.meta .bo{flex-shrink:0}
.meta .ev:empty+.s1,.meta .rd:empty+.s2,.meta .s1:has(+.rd:empty),.meta .s2:has(+.bo:empty){display:none}
.meta .ev:empty+.s1+.rd:empty+.s2{display:none}
.won{position:absolute;z-index:0}
.gs{position:relative;z-index:1}
.gtag .nx{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .now{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html,body{height:100%;overflow:hidden}
.board{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;font-size:1.75vw;font-family:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#fff;background:linear-gradient(180deg,#151a22 0%,#0b0e13 100%);-webkit-font-smoothing:antialiased}
.title{display:flex;flex-direction:column;align-items:center;gap:.2em;text-transform:uppercase;text-align:center}
.ev{font-size:2em;font-weight:800;letter-spacing:.05em;line-height:1;max-width:30em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:flex;align-items:center;font-size:1.05em;font-weight:700;letter-spacing:.16em;color:#aeb6c4}
.sub .sep{font-style:normal;padding:0 .6em}
.sub .rd:empty+.sep,.sub .sep:has(+.bo:empty){display:none}
.title:not(:has(.ev:not(:empty))):not(:has(.rd:not(:empty))) .sub{display:none}
.teamlbl{display:none;font-size:1.8em;font-weight:800;letter-spacing:.08em}
.title:not(:has(.ev:not(:empty))):not(:has(.rd:not(:empty))) .teamlbl{display:block}
.board:not(:has(.tname:not(:empty))) .teamlbl{display:none!important}
.stagebox{display:flex;align-items:stretch;gap:1em}
.panel{position:relative;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr auto;grid-template-areas:"who who" "hero hero" "gw foot";width:22em;height:26em;padding:1.4em 1.4em 1.2em;border-radius:.45em;background:linear-gradient(180deg,#232a36 0%,#1a1f28 100%);box-shadow:0 .8em 2em rgba(0,0,0,.5);overflow:hidden}
.kit{position:absolute;left:0;right:0;top:0;height:.45em;background:#6b7688}
.who{grid-area:who;display:flex;flex-direction:column;align-items:center;gap:.5em;text-align:center;min-width:0}
.flag{width:3em;height:2em;object-fit:cover;border-radius:.15em;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.nm{display:flex;flex-direction:column;align-items:center;gap:.3em;min-width:0;max-width:100%}
.name{font-size:1.75em;line-height:1.02;font-weight:800;text-transform:uppercase;overflow-wrap:normal;hyphens:none}
.team{display:flex;align-items:center;gap:.4em;font-size:1em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#aeb6c4}
.tlogo{width:1.5em;height:1.5em;object-fit:contain}
.tie{display:inline-flex;align-items:center;gap:.3em;padding:0 .45em;height:1.4em;border-radius:.2em;background:#323a48;color:#fff}
.tie i{font-style:normal;color:#aeb6c4;letter-spacing:.08em}
.team:not(:has(.tname:not(:empty))){display:none}
.nm:has(.name:empty) .team{flex-direction:column;font-size:1.5em;color:#fff;text-align:center}
.hero{grid-area:hero;display:flex;align-items:center;justify-content:center;min-height:0}
.pts{font-size:9em;line-height:.8;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.gw{grid-area:gw;display:flex;align-items:center;gap:.5em;font-weight:800;text-transform:uppercase}
.gw i{font-style:normal;font-size:1em;letter-spacing:.14em;color:#aeb6c4}
.gn{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.6em;border-radius:.2em;background:#ffc93c;color:#14161b;font-size:1.6em;font-variant-numeric:tabular-nums}
.foot{grid-area:foot;display:flex;align-items:center;gap:.35em}
.to-slot{width:5em;height:1.5em}
.to-on,.to-used{border-radius:.2em;font-size:1em;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.to-on{background:#ffd23f;color:#111}
.to-used{box-shadow:inset 0 0 0 .1em #566174;color:#aeb6c4}
.card-slot{width:1em;height:1.45em}
.card{border-radius:.14em;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.yc{background:#ffd400}.rc{background:#e3262f}
.srv{width:2em;height:2em;margin-left:.3em}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff9a3c 45%,#d65f00 100%);box-shadow:0 0 0 .14em rgba(0,0,0,.3),0 0 1em rgba(255,154,60,.55)}
.win{position:absolute;top:.45em;right:0;display:flex;align-items:center;height:1.7em;padding:0 .9em;border-radius:0 0 0 .3em;background:#ffc93c;color:#14161b;font-size:1em;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.spine{display:flex;flex-direction:column;align-items:stretch;justify-content:center;align-self:center;gap:.6em;width:12em}
.tagslot{width:100%;height:2.4em}
.tagslot>*{border-radius:.3em;font-size:1.1em;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.vs{color:#566174;font-size:1.8em!important}
.tagslot:has(>.gtag[style*="opacity: 1"]) .vs,.tagslot:has(>.fin[style*="opacity: 1"]) .vs{opacity:0}
.gtag{background:#2b3341;color:#fff}
.fin{background:#ffc93c;color:#14161b}
.ledger{position:relative;display:flex;flex-direction:column;gap:.3em}
.hcol{display:flex;align-items:center;gap:.1em;height:2.3em;padding:0 .4em 0 .8em;border-radius:.3em;background:#1d232d}
.hd{flex:1 1 auto;font-size:1em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#aeb6c4}
.hc{position:relative;flex:0 0 1.8em;display:flex;align-items:center;justify-content:center;height:1.8em;font-size:1.3em;font-weight:800;font-variant-numeric:tabular-nums;color:#6f7a8c}
.hc .won{inset:0 .15em;border-radius:.2em;background:#3a4354}
.hc:has(.won[style*="opacity: 1"]){color:#fff}
.hcol:not(:has(.won[style*="opacity: 1"])){position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;padding:0!important}
.banner{width:100%;height:2.4em}
.bn{border-radius:.3em;font-size:1.05em;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.bn-warm,.bn-break{background:#2b3341;color:#fff}
.bn-gp{background:#ff9a3c;color:#111}
.bn-mp{background:#e3262f;color:#fff}
/* final: games won become the hero, the winner's panel is lit and the loser's steps back */
.board:has(.isComplete[style*="opacity: 1"]) .pts{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important}
.board:has(.isComplete[style*="opacity: 1"]) .panel{grid-template-areas:"who who" "gw gw" "foot foot"}
.board:has(.isComplete[style*="opacity: 1"]) .gw{flex-direction:column;justify-content:center;gap:.2em}
.board:has(.isComplete[style*="opacity: 1"]) .gn{background:none;color:inherit;font-size:7em;height:auto;line-height:.9}
.board:has(.isComplete[style*="opacity: 1"]) .gw i{order:2;font-size:1.2em}
.board:has(.isAWinner[style*="opacity: 1"]) .pA,.board:has(.isBWinner[style*="opacity: 1"]) .pB{box-shadow:0 0 0 .18em #ffc93c,0 .8em 2em rgba(0,0,0,.5)}
.board:has(.isAWinner[style*="opacity: 1"]) .pA .gn,.board:has(.isBWinner[style*="opacity: 1"]) .pB .gn{color:#ffc93c}
.board:has(.isAWinner[style*="opacity: 1"]) .pB,.board:has(.isBWinner[style*="opacity: 1"]) .pA{opacity:.55}

</style>
</head>
<body>
<main class="board t-face" data-osb-component="layout"><header class="title"><span class="eventName ev" data-osb-component="field" data-osb-field="eventName"></span><span class="sub"><span class="matchRound rd" data-osb-component="field" data-osb-field="matchRound"></span><i class="sep">·</i><span class="matchFormatLabel bestOf bo" data-osb-component="field" data-osb-field="matchFormatLabel"></span></span><span class="teamlbl">Team match</span></header><div class="stagebox" data-osb-component="layout"><div class="panel pA a" data-osb-component="layout"><span class="jerseyColorA kit" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="who"><img class="countryA flag" data-osb-component="field" data-osb-field="countryA" alt=""><span class="nm"><span class="combinedAName name" data-osb-component="field" data-osb-field="combinedAName"></span><span class="team"><img class="teamLogoURLA tlogo" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><span class="teamAName tname" data-osb-component="field" data-osb-field="teamAName"></span><span class="tie"><i>Tie</i><span class="teamAScore tscore" data-osb-component="field" data-osb-field="teamAScore">0</span></span></span></span></div><span class="hero"><span class="currentAGameScore pts" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><span class="gw"><i>Games</i><span class="currentAMatchScore AScore gn" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span><span class="foot"><span class="slot to-slot"><span class="isATimeOutActive to-on" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0">Time-out</span><span class="isATimeOutUsed to-used" data-osb-component="field" data-osb-field="isATimeOutUsed" style="opacity:0">T/O used</span></span><span class="slot card-slot"><span class="isAYellowCarded card yc" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0"></span></span><span class="slot card-slot"><span class="isARedCarded card rc" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0"></span></span><span class="slot srv"><span class="isACurrentlyServing servingA ball" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity:0" isa="true"></span></span></span><span class="isAWinner win" data-osb-component="field" data-osb-field="isAWinner" style="opacity:0">Winner</span></div><div class="spine" data-osb-component="layout"><span class="slot tagslot"><span class="vs">VS</span><span class="isMatchStarted gtag" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0"><span class="now">Game <span class="currentGame cg" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="nx">Game <span class="nextGame ng" data-osb-component="field" data-osb-field="nextGame"></span> next</span></span><span class="isComplete fin" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">Final</span></span><div class="ledger" data-osb-component="layout"><div class="hcol isGame1Started" data-osb-component="layout" data-osb-field="isGame1Started" style="display:none"><span class="hd hl">Game 1</span><span class="hc a"><span class="isGame1AWon won" data-osb-component="field" data-osb-field="isGame1AWon" style="opacity:0"></span><span class="game1AScore gs" data-osb-component="field" data-osb-field="game1AScore">0</span></span><span class="hc b"><span class="isGame1BWon won" data-osb-component="field" data-osb-field="isGame1BWon" style="opacity:0"></span><span class="game1BScore gs" data-osb-component="field" data-osb-field="game1BScore">0</span></span></div><div class="hcol isGame2Started" data-osb-component="layout" data-osb-field="isGame2Started" style="display:none"><span class="hd hl">Game 2</span><span class="hc a"><span class="isGame2AWon won" data-osb-component="field" data-osb-field="isGame2AWon" style="opacity:0"></span><span class="game2AScore gs" data-osb-component="field" data-osb-field="game2AScore">0</span></span><span class="hc b"><span class="isGame2BWon won" data-osb-component="field" data-osb-field="isGame2BWon" style="opacity:0"></span><span class="game2BScore gs" data-osb-component="field" data-osb-field="game2BScore">0</span></span></div><div class="hcol isGame3Started" data-osb-component="layout" data-osb-field="isGame3Started" style="display:none"><span class="hd hl">Game 3</span><span class="hc a"><span class="isGame3AWon won" data-osb-component="field" data-osb-field="isGame3AWon" style="opacity:0"></span><span class="game3AScore gs" data-osb-component="field" data-osb-field="game3AScore">0</span></span><span class="hc b"><span class="isGame3BWon won" data-osb-component="field" data-osb-field="isGame3BWon" style="opacity:0"></span><span class="game3BScore gs" data-osb-component="field" data-osb-field="game3BScore">0</span></span></div><div class="hcol isGame4Started" data-osb-component="layout" data-osb-field="isGame4Started" style="display:none"><span class="hd hl">Game 4</span><span class="hc a"><span class="isGame4AWon won" data-osb-component="field" data-osb-field="isGame4AWon" style="opacity:0"></span><span class="game4AScore gs" data-osb-component="field" data-osb-field="game4AScore">0</span></span><span class="hc b"><span class="isGame4BWon won" data-osb-component="field" data-osb-field="isGame4BWon" style="opacity:0"></span><span class="game4BScore gs" data-osb-component="field" data-osb-field="game4BScore">0</span></span></div><div class="hcol isGame5Started" data-osb-component="layout" data-osb-field="isGame5Started" style="display:none"><span class="hd hl">Game 5</span><span class="hc a"><span class="isGame5AWon won" data-osb-component="field" data-osb-field="isGame5AWon" style="opacity:0"></span><span class="game5AScore gs" data-osb-component="field" data-osb-field="game5AScore">0</span></span><span class="hc b"><span class="isGame5BWon won" data-osb-component="field" data-osb-field="isGame5BWon" style="opacity:0"></span><span class="game5BScore gs" data-osb-component="field" data-osb-field="game5BScore">0</span></span></div><div class="hcol isGame6Started" data-osb-component="layout" data-osb-field="isGame6Started" style="display:none"><span class="hd hl">Game 6</span><span class="hc a"><span class="isGame6AWon won" data-osb-component="field" data-osb-field="isGame6AWon" style="opacity:0"></span><span class="game6AScore gs" data-osb-component="field" data-osb-field="game6AScore">0</span></span><span class="hc b"><span class="isGame6BWon won" data-osb-component="field" data-osb-field="isGame6BWon" style="opacity:0"></span><span class="game6BScore gs" data-osb-component="field" data-osb-field="game6BScore">0</span></span></div><div class="hcol isGame7Started" data-osb-component="layout" data-osb-field="isGame7Started" style="display:none"><span class="hd hl">Game 7</span><span class="hc a"><span class="isGame7AWon won" data-osb-component="field" data-osb-field="isGame7AWon" style="opacity:0"></span><span class="game7AScore gs" data-osb-component="field" data-osb-field="game7AScore">0</span></span><span class="hc b"><span class="isGame7BWon won" data-osb-component="field" data-osb-field="isGame7BWon" style="opacity:0"></span><span class="game7BScore gs" data-osb-component="field" data-osb-field="game7BScore">0</span></span></div><div class="hcol isGame8Started" data-osb-component="layout" data-osb-field="isGame8Started" style="display:none"><span class="hd hl">Game 8</span><span class="hc a"><span class="isGame8AWon won" data-osb-component="field" data-osb-field="isGame8AWon" style="opacity:0"></span><span class="game8AScore gs" data-osb-component="field" data-osb-field="game8AScore">0</span></span><span class="hc b"><span class="isGame8BWon won" data-osb-component="field" data-osb-field="isGame8BWon" style="opacity:0"></span><span class="game8BScore gs" data-osb-component="field" data-osb-field="game8BScore">0</span></span></div><div class="hcol isGame9Started" data-osb-component="layout" data-osb-field="isGame9Started" style="display:none"><span class="hd hl">Game 9</span><span class="hc a"><span class="isGame9AWon won" data-osb-component="field" data-osb-field="isGame9AWon" style="opacity:0"></span><span class="game9AScore gs" data-osb-component="field" data-osb-field="game9AScore">0</span></span><span class="hc b"><span class="isGame9BWon won" data-osb-component="field" data-osb-field="isGame9BWon" style="opacity:0"></span><span class="game9BScore gs" data-osb-component="field" data-osb-field="game9BScore">0</span></span></div></div><span class="slot banner"><span class="isWarmUpStarted bn bn-warm" data-osb-component="field" data-osb-field="isWarmUpStarted" style="opacity:0">Warm-up</span><span class="isInBetweenGames bn bn-break" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">Between games</span><span class="isGamePoint bn bn-gp" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">Game point</span><span class="isMatchPoint bn bn-mp" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">Match point</span></span></div><div class="panel pB b" data-osb-component="layout"><span class="jerseyColorB kit" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="who"><img class="countryB flag" data-osb-component="field" data-osb-field="countryB" alt=""><span class="nm"><span class="combinedBName name" data-osb-component="field" data-osb-field="combinedBName"></span><span class="team"><img class="teamLogoURLB tlogo" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""><span class="teamBName tname" data-osb-component="field" data-osb-field="teamBName"></span><span class="tie"><i>Tie</i><span class="teamBScore tscore" data-osb-component="field" data-osb-field="teamBScore">0</span></span></span></span></div><span class="hero"><span class="currentBGameScore pts" data-osb-component="field" data-osb-field="currentBGameScore"> </body>
</html>
