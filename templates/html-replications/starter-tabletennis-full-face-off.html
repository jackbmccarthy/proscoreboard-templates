<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Full Screen — Face Off</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.board{font-size:calc(100vw / 80);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
.flag{flex:0 0 auto;object-fit:cover;border-radius:.12em;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.chip{background:var(--chip-default,#8a96a3)}
.name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-weight:800;text-transform:uppercase;overflow-wrap:break-word;line-height:1.04}
.team{display:flex;align-items:center;gap:.4em;min-width:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.tlogo{width:1.3em;height:1.3em;object-fit:contain}
.tname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:has(>.name:empty)>.team .tname{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.05}
.tscore{padding:0 .4em;border-radius:.2em;background:rgba(127,127,127,.28);font-variant-numeric:tabular-nums}
.gtag{display:inline-flex;align-items:center;gap:.3em;height:1.8em;padding:0 .8em;border-radius:.2em;font-size:1em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.state{width:10.5em;height:1.8em}
.st{border-radius:.2em;font-size:1em;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.srv-ball{display:block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ff8a1c 46%,#d65f00 100%);box-shadow:0 0 0 .14em rgba(0,0,0,.25)}
.meta{display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.meta>*{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta .sep{flex:0 0 auto;font-style:normal;padding:0 .5em;opacity:.55}
.meta .rd,.meta .bo{flex-shrink:0}
.meta .ev:empty+.s1,.meta .rd:empty+.s2,.meta .s1:has(+.rd:empty),.meta .s2:has(+.bo:empty){display:none}
.meta .ev:empty+.s1+.rd:empty+.s2{display:none}
.head:not(:has(.meta>:not(.sep):not(:empty))),.band:not(:has(.meta>:not(.sep):not(:empty))),.top:not(:has(.meta>:not(.sep):not(:empty))){display:none}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
.flag:not([src]),.tlogo:not([src]){display:none}
.team:not(:has(.tname:not(:empty))){display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.osb-core-fields{display:none!important}
.title:has(.big-ev:empty):has(.rd:empty):has(.bo:empty){display:none}
.board{display:flex;flex-direction:column;align-items:center;width:70em;max-width:96vw}
.title{display:flex;flex-direction:column;align-items:center;gap:.35em;margin-bottom:1.2em;text-align:center;max-width:100%}
.big-ev{font-size:2.4em;font-weight:800;letter-spacing:.05em;text-transform:uppercase;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:flex;align-items:center;gap:.6em;font-size:1.25em;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sub .dot{width:.35em;height:.35em;border-radius:50%;background:currentColor;opacity:.6}
.sub .rd:empty+.dot,.sub .dot:has(+.bo:empty){display:none}
.face{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:1.2em;width:100%}
.side{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.5em;padding:1.6em 1.2em 1.4em;border-radius:.5em;overflow:hidden;min-width:0;text-align:center}
.side .kit{position:absolute;left:0;right:0;top:0;height:.45em}
.side .flag{width:4.2em;height:2.8em}
.side .name{font-size:2.5em;max-width:100%}
.side .team{font-size:1.1em;justify-content:center}
.side:has(.name:empty) .team{font-size:1.8em;opacity:1}
.gw{display:flex;align-items:center;justify-content:center;margin-top:auto;padding-top:.3em}
.gw>*{font-size:7.5em;line-height:.9;font-weight:900;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;justify-content:center;gap:.35em;min-width:15em}
/* the runtime shows a started game with display:flex, so the row is a flex row */
.gr{display:flex;align-items:center;height:2.6em;border-radius:.3em}
.gr>.ga,.gr>.gb{flex:none;width:3.4em}
.gr>.gl{flex:1 1 auto}
.ga,.gb{display:flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums}
.ga>*,.gb>*{font-size:1.7em}
.gr .gl{text-align:center;font-size:.95em;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.foot{display:flex;align-items:center;justify-content:center;gap:.6em;height:3.6em}
.board:not(:has(.isInBetweenGames[style*="opacity: 1"])) .gr:not([style*="display: none"]):not([style*="display:none"]):not(:has(~ .gr:not([style*="display: none"]):not([style*="display:none"])))>.ga,.gr>.gb{opacity:.4}
.t-face{--font:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;--ink:#fff}
.t-face .title{padding:.7em 2.4em .8em;border-radius:.5em;background:rgba(26,15,20,.94);box-shadow:0 .6em 2em rgba(0,0,0,.45);color:#fff}
.t-face .sub{color:#ffc9cf}
.t-face .side{background:linear-gradient(180deg,#2a1820,#1a0f14);box-shadow:0 1em 3em rgba(0,0,0,.5)}
.t-face .gw{color:#fff}
.t-face .sA .gw>*{color:#ff4f5e}
.t-face .sB .gw>*{color:#ffb648}
.t-face .gr{background:rgba(26,15,20,.92);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.t-face .gr .gl{color:#d8b6bd}
.t-face .gtag{background:#1a0f14;color:#fff;box-shadow:inset 0 0 0 .1em #ff4f5e}
.t-face .st-warm,.t-face .st-break{background:#1a0f14;color:#fff;box-shadow:inset 0 0 0 .12em #6b4752}
.t-face .st-gp{background:#ffb648;color:#111}
.t-face .st-mp{background:#ff4f5e;color:#fff}
.t-face .st-final{background:#fff;color:#1a0f14}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.gl{font-size:1.25vw!important}
.dot{width:0.938vw!important;height:0.938vw!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

</style>
</head>
<body>
<main class="stage"><article class="board t-face" data-osb-component="layout"><div class="title" data-osb-component="layout"><span class="eventName big-ev" data-osb-component="field" data-osb-field="eventName"></span><span class="sub"><span class="matchRound rd" data-osb-component="field" data-osb-field="matchRound"></span><i class="dot"></i><span class="matchFormatLabel bestOf bo" data-osb-component="field" data-osb-field="matchFormatLabel"></span></span></div><div class="face" data-osb-component="layout"><div class="side sA" data-osb-component="layout"><span class="jerseyColorA kit" data-osb-component="field" data-osb-field="jerseyColorA"></span><img class="countryA flag" data-osb-component="field" data-osb-field="countryA" alt=""><span class="combinedAName name" data-osb-component="field" data-osb-field="combinedAName"></span><span class="team"><img class="teamLogoURLA tlogo" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><span class="teamAName tname" data-osb-component="field" data-osb-field="teamAName"></span><span class="teamAScore tscore" data-osb-component="field" data-osb-field="teamAScore">0</span></span><span class="gw"><span class="currentAMatchScore AScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span></div><div class="list" data-osb-component="layout"><div class="gr isGame1Started" data-osb-component="layout" data-osb-field="isGame1Started" style="display:none"><span class="ga"><span class="game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span><span class="gl">Game 1</span><span class="gb"><span class="game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></div><div class="gr isGame2Started" data-osb-component="layout" data-osb-field="isGame2Started" style="display:none"><span class="ga"><span class="game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span><span class="gl">Game 2</span><span class="gb"><span class="game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></div><div class="gr isGame3Started" data-osb-component="layout" data-osb-field="isGame3Started" style="display:none"><span class="ga"><span class="game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span><span class="gl">Game 3</span><span class="gb"><span class="game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></div><div class="gr isGame4Started" data-osb-component="layout" data-osb-field="isGame4Started" style="display:none"><span class="ga"><span class="game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span><span class="gl">Game 4</span><span class="gb"><span class="game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></div><div class="gr isGame5Started" data-osb-component="layout" data-osb-field="isGame5Started" style="display:none"><span class="ga"><span class="game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span><span class="gl">Game 5</span><span class="gb"><span class="game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></div><div class="gr isGame6Started" data-osb-component="layout" data-osb-field="isGame6Started" style="display:none"><span class="ga"><span class="game6AScore" data-osb-component="field" data-osb-field="game6AScore">0</span></span><span class="gl">Game 6</span><span class="gb"><span class="game6BScore" data-osb-component="field" data-osb-field="game6BScore">0</span></span></div><div class="gr isGame7Started" data-osb-component="layout" data-osb-field="isGame7Started" style="display:none"><span class="ga"><span class="game7AScore" data-osb-component="field" data-osb-field="game7AScore">0</span></span><span class="gl">Game 7</span><span class="gb"><span class="game7BScore" data-osb-component="field" data-osb-field="game7BScore">0</span></span></div><div class="gr isGame8Started" data-osb-component="layout" data-osb-field="isGame8Started" style="display:none"><span class="ga"><span class="game8AScore" data-osb-component="field" data-osb-field="game8AScore">0</span></span><span class="gl">Game 8</span><span class="gb"><span class="game8BScore" data-osb-component="field" data-osb-field="game8BScore">0</span></span></div><div class="gr isGame9Started" data-osb-component="layout" data-osb-field="isGame9Started" style="display:none"><span class="ga"><span class="game9AScore" data-osb-component="field" data-osb-field="game9AScore">0</span></span><span class="gl">Game 9</span><span class="gb"><span class="game9BScore" data-osb-component="field" data-osb-field="game9BScore">0</span></span></div></div><div class="side sB" data-osb-component="layout"><span class="jerseyColorB kit" data-osb-component="field" data-osb-field="jerseyColorB"></span><img class="countryB flag" data-osb-component="field" data-osb-field="countryB" alt=""><span class="combinedBName name" data-osb-component="field" data-osb-field="combinedBName"></span><span class="team"><img class="teamLogoURLB tlogo" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""><span class="teamBName tname" data-osb-component="field" data-osb-field="teamBName"></span><span class="teamBScore tscore" data-osb-component="field" data-osb-field="teamBScore">0</span></span><span class="gw"><span class="currentBMatchScore BScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span></div></div><div class="foot" data-osb-component="layout"><span class="isMatchStarted gtag" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0">Game <span class="currentGame cg" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="slot state"><span class="isWarmUpStarted st st-warm" data-osb-component="field" data-osb-field="isWarmUpStarted" style="opacity:0">Warm-up</span><span class="isInBetweenGames st st-break" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">Between games</span><span class="isComplete st st-final" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">Final</span><span class="isGamePoint st st-gp" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">Game point</span><span class="isMatchPoint st st-mp" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">Match point</span></span></div></article><div class="osb-core-fields" aria-hidden="true"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></main>
</body>
</html>
