<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linen Navy Sideconsole TABLE TENNIS 1</title>
  <style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f8fafb}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.board{width:min(92vw,1680px);display:flex;overflow:hidden;background:#1f3242;border-radius:3px;container-type:inline-size}
.console{position:relative;flex:0 0 21%;min-width:0;display:flex;align-items:center;justify-content:center;padding:1.5cqw;background:#e7dfd0;color:#1f3242}
.sport-tag{font-size:clamp(13px,2.45cqw,37px);font-weight:800;line-height:1.08;white-space:nowrap;text-align:center}
.lanes{flex:1;min-width:0;display:flex;flex-direction:column}
.lane{flex:1;min-width:0;min-height:0;display:flex;align-items:center;gap:2.1cqw;padding:.8cqw 1.7cqw;background:#1f3242}
.lane+.lane{border-top:1px solid #688293}
.tick{display:block;flex:0 0 1.1cqw;width:1.1cqw;height:65%;min-height:15px;border-radius:1px;background:#2685a5}
.jerseyColorB{background:#c96a60}
.name-wrap{flex:1 1 auto;min-width:0;position:relative}
.name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(16px,4.7cqw,72px);font-weight:700;line-height:1.06}
.combinedAName:empty::before{content:"Player A"}
.combinedBName:empty::before{content:"Player B"}
.serve{position:absolute;right:0;top:calc(100% + .35cqw);font-size:1.25cqw;line-height:1;color:#aebfc2}
.support{flex:0 0 8.2cqw;width:8.2cqw;height:7.6cqw;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#aebfc2;border-radius:3px;color:#1f3242}
.support-value{display:block;font-size:4.2cqw;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
.support-caption,.primary-caption{display:block;font-size:1.55cqw;font-weight:700;letter-spacing:.04em;line-height:1.1;white-space:nowrap}
.primary{flex:0 0 10.5cqw;width:10.5cqw;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f8fafb}
.primary-value{display:block;font-size:7.5cqw;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
.primary-caption{margin-top:.7cqw;color:#e8eef1}
.point-slot{position:absolute;left:2%;right:2%;bottom:1.2cqw;height:1.5cqw;text-align:center;font-size:1.05cqw;font-weight:700;letter-spacing:.04em}
.point-slot span{position:absolute;inset:0;white-space:nowrap}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.stage{padding:6px}.board{width:calc(100vw - 12px)}.console{flex-basis:20%}.sport-tag{font-size:clamp(9px,2.5cqw,15px)}.lane{gap:1.35cqw;padding:1.4cqw}.name{font-size:clamp(12px,4.1cqw,18px)}.support{flex-basis:9.2cqw;width:9.2cqw;height:10.2cqw}.support-value{font-size:5cqw}.support-caption,.primary-caption{font-size:1.45cqw}.primary{flex-basis:11cqw;width:11cqw}.primary-value{font-size:7.5cqw}.point-slot{font-size:1.35cqw}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.board{min-height:20cqw}.lane{min-height:10cqw}@media(max-width:600px){.board{min-height:38cqw}.lane{min-height:19cqw}}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="TABLE TENNIS scoreboard">
      <div class="console"><span class="sport-tag">TABLE TENNIS</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
      <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-wrap"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true">●</span></div><div class="support"><span class="support-value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-caption">GAMES</span></div><div class="primary"><span class="primary-value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption">POINTS</span></div></div>
        <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-wrap"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;">●</span></div><div class="support"><span class="support-value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-caption">GAMES</span></div><div class="primary"><span class="primary-value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption">POINTS</span></div></div>
      </div>
    </article>
  </main>
</body>
</html>
