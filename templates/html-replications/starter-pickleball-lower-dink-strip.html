<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Dink Strip</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing{animation:none!important;transition:none!important}}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere;line-height:1;text-wrap:balance}
.pball{display:block;border-radius:50%;background:radial-gradient(circle at 30% 34%,#0004 0 8%,transparent 9%),radial-gradient(circle at 64% 30%,#0004 0 8%,transparent 9%),radial-gradient(circle at 52% 64%,#0004 0 8%,transparent 9%),radial-gradient(circle at 24% 72%,#0003 0 6%,transparent 7%),radial-gradient(circle at 78% 70%,#0003 0 6%,transparent 7%),radial-gradient(circle at 36% 30%,#fbffb4,#d8f22c 60%,#a6c214);box-shadow:0 0 .4rem #0007}
.sslot{align-items:center}.sslot>.st{display:flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap;height:100%}
.board:has(.isMatchStarted[style*="opacity: 1"]) .swarm{opacity:0!important}
.board:has(.isGamePoint[style*="opacity: 1"]) .sbrk,.board:has(.isMatchPoint[style*="opacity: 1"]) .sbrk{opacity:0!important}
.pslot>.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hist:not(:has(>[style*="opacity: 1"])){display:none}
.srv{display:flex;align-items:center;gap:.35rem}
.sn{position:relative;display:inline-grid;place-items:center}.sn>i{grid-area:1/1;font-style:normal}
.sn:has(>.isSecondServer[style*="opacity: 1"])>.one,.cn:has(>.isSecondServer[style*="opacity: 1"])>.one{opacity:0}
.cn{display:inline-grid}.cn>i{grid-area:1/1;font-style:normal;text-align:center}
.call{display:inline-flex;align-items:baseline}.call>i,.dbl>i{font-style:normal}.call .ca{order:1}.call .d1{order:2}.call .cb{order:3}.call .dbl{order:4;display:inline-flex;align-items:baseline}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .ca{order:3}.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .cb{order:1}
.call .dbl:not([style*="opacity: 1"]){display:none}
.cards{display:flex;gap:.3rem;align-items:center}.card{display:block;border-radius:.15rem;box-shadow:0 0 0 .1rem #0004}.yc{background:#ffd200}.rc{background:#e3262f}
.cards:not(:has(>[style*="opacity: 1"])){display:none}
.tie{display:flex;align-items:center}.tie:has(>.teamAName[style*="display: none"]){display:none}
.tlogo{display:block;object-fit:contain}.tlogo:not([src]),.tlogo[src=""]{visibility:hidden}
.tie>.tdash{font-style:normal}
.tname{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.05}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>:not(.tie){display:none}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>.tie{height:auto;min-height:5.2rem;padding-top:.6rem;padding-bottom:.4rem;margin:0}

.stage{position:fixed;left:0;right:0;bottom:4rem;display:flex;justify-content:center}
.board{position:relative;width:96rem;font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;color:#1d2433}
.tie{justify-content:center;gap:1rem;width:60rem;margin:0 auto .4rem;height:3.8rem;padding:0 1.4rem;border-radius:1.9rem;background:#1d2433;color:#fff;font-size:1.6rem;font-weight:800}.tlogo{width:2.8rem;height:2.8rem}.tchip{width:.6rem;height:2.2rem;border-radius:.2rem}.tname:last-of-type{text-align:right}.tscore{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.4rem;color:#c8e650}.tie>.tdash{color:#8792a8}
.top{display:flex;justify-content:center;gap:.5rem;margin-bottom:.4rem;height:3rem}
.ctx{display:flex;align-items:center;gap:.6rem;padding:0 1.6rem;border-radius:1.5rem;background:#1d2433e6;color:#dfe5ef;font-size:1.4rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}.ctx .sep{font-style:normal;color:#c8e650}
.hist{display:flex;gap:.4rem}
.hc{display:flex;align-items:center;gap:.3rem;padding:0 1rem;border-radius:1.5rem;background:#1d2433e6;color:#fff;font-size:1.4rem}.hc .hl{font-weight:700;color:#97a2b8;margin-right:.3rem}.hc .num{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:1.8rem}.hc .hd{font-style:normal;color:#97a2b8}
.band{display:flex;align-items:stretch;height:6.4rem;border-radius:.8rem;background:#fff;box-shadow:0 .6rem 1.4rem #0007;overflow:visible}
.side{position:relative;flex:1;min-width:0;display:flex;align-items:stretch}
.sB{flex-direction:row-reverse}
.chip{width:1rem;flex:none}.sA .chip{border-radius:.8rem 0 0 .8rem}.sB .chip{border-radius:0 .8rem .8rem 0}
.who{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;padding:0 1rem 0 1.4rem;text-align:right}.sB .who{justify-content:flex-start;text-align:left;padding:0 1.4rem 0 1rem}
.nm{font-size:2.3rem;font-weight:800;letter-spacing:-.01em}
.stat{display:flex;align-items:center;gap:.4rem;flex:none;padding:0 .4rem}.card{width:1.1rem;height:1.6rem}
.tou{display:flex;align-items:center;height:2rem;padding:0 .5rem;border-radius:.3rem;background:#eef2f7;color:#5a6b86;font-size:1.2rem;font-weight:800;letter-spacing:.06em}
.srv{flex:none;padding:0 .5rem}.pball{width:2.1rem;height:2.1rem}
.sn{min-width:2rem;height:2rem;border-radius:.3rem;background:#1d2433;color:#c8e650;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:1.6rem;font-weight:700}
.games{width:4.2rem;flex:none;display:flex;align-items:center;justify-content:center;background:#eef2f7;color:#5a6b86;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.6rem;font-weight:700}
.pts{width:7rem;flex:none;display:flex;align-items:center;justify-content:center;background:#1d2433;color:#fff;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4.2rem;font-weight:700}
.mid{width:12.4rem;flex:none;display:flex;flex-direction:column;background:#c8e650;color:#1d2433}
.sslot{height:2.6rem}.sslot>.st{font-size:1.3rem;font-weight:800;letter-spacing:.1em;background:#b3d13a}.sslot>.sgame{background:#c8e650}.sslot>.swarm{background:#ff9b2f}.sslot>.sbrk{background:#1d2433;color:#fff}
.cbox{flex:1;display:flex;align-items:center;justify-content:center}.call{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:3rem;font-weight:700;gap:.15rem}
.tob{position:absolute;bottom:100%;margin-bottom:.4rem;display:flex;align-items:center;gap:.6rem;height:3rem;padding:0 1.2rem;border-radius:1.5rem;background:#c8e650;color:#1d2433;font-size:1.4rem;font-weight:800;letter-spacing:.08em;white-space:nowrap}.sA .tob{left:1rem}.sB .tob{right:1rem}.tob em{font-style:normal}.tob b{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2rem}
.board:has(.isATimeOutActive[style*="opacity: 1"]) .top,.board:has(.isBTimeOutActive[style*="opacity: 1"]) .top{justify-content:center}
.pslot{position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:.5rem}.pt{height:3rem;padding:0 1.6rem;border-radius:1.5rem;font-size:1.5rem;font-weight:800;letter-spacing:.1em;background:#1d2433;color:#c8e650}.pt.mp{background:#e8202a;color:#fff}
.stage{bottom:7.6rem}
.sslot>.sfin{background:#c8e650}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.eventName,.sep,.matchRound,.hl,.hd,.tou.isATimeOutUsed,.tob.isATimeOutActive>em,.matchFormatLabel,.st.sgame.isMatchStarted,.num.currentGame,.tou.isBTimeOutUsed,.tob.isBTimeOutActive>em,.pt.mp.isMatchPoint,.pt.gp.isGamePoint,.st.sfin.isComplete,.st.swarm.isWarmUpStarted,.st.sbrk.isInBetweenGames{font-size:1.25vw!important}
.card.yc.isAYellowCarded,.card.rc.isARedCarded,.card.yc.isBYellowCarded,.card.rc.isBRedCarded{width:0.938vw!important;height:1.25vw!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

</style>
