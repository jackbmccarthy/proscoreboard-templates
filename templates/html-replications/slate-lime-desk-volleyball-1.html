<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slate Lime Desk Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #fff; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { width: 100%; max-width: 640px; display: flex; flex-direction: column; overflow: hidden; border-radius: 6px; background: #20282f; }
.title { padding: 8px 18px 7px; font-size: 23px; font-weight: 700; line-height: 1; color: #bdcedb; border-bottom: 3px solid #c0ed46; }
.heading { display: flex; align-items: center; padding: 9px 6px 6px; color: #b9cbd8; font-size: 15px; font-weight: 700; line-height: 1; }
.name-spacer { flex: 1 1 0; }
.sets-heading, .match-score { flex: 0 0 14%; text-align: center; }
.points-heading, .primary-score { flex: 0 0 22.8%; text-align: center; }
.teams { display: flex; flex-direction: column; padding: 0 6px; }
.team { display: flex; align-items: stretch; height: 70px; background: #2b3741; }
.team + .team { margin-top: 6px; position: relative; }
.team + .team::before { content: ""; position: absolute; left: -6px; right: -6px; top: -4px; height: 1px; background: #526471; }
.identity { display: flex; align-items: center; gap: 18px; flex: 1 1 0; padding: 10px; }
.tick { display: block; flex: 0 0 9px; height: 43px; background: #c0ed46; }
.name { display: block; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 36px; font-weight: 700; line-height: 1; color: #fff; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.match-score { display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; line-height: 1; border-left: 1px solid #202a32; font-variant-numeric: tabular-nums; }
.primary-score { display: flex; align-items: center; justify-content: center; margin: 2px 2px 2px 0; background: #374752; border: 1px solid #40515c; border-radius: 4px; font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.set-footer { min-height: 37px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700; line-height: 1; color: #bacddb; }
.set-value { display: block; width: 26px; font-size: 24px; text-align: center; color: #fff; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .title { font-size: 19px; padding-left: 14px; }
  .heading { font-size: 12px; }
  .team { height: 62px; }
  .identity { gap: 12px; padding: 8px; }
  .tick { flex-basis: 7px; height: 36px; }
  .name { font-size: 27px; }
  .match-score { font-size: 24px; }
  .primary-score { font-size: 36px; }
  .set-footer { font-size: 16px; }
  .set-value { font-size: 22px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="heading rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="name-spacer"></span><span class="sets-heading">SETS</span><span class="points-heading">POINTS</span></div>
      <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
