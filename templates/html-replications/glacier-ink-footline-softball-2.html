<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Glacier Ink Footline horizontal</title><style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(92vw,1900px);max-width:100%;min-width:0;overflow:hidden;border-radius:6px;background:#253c49;container-type:inline-size}
.lanes{display:flex;flex-direction:row;min-width:0}
.lane{display:flex;align-items:stretch;min-width:0;flex:1 1 50%;height:7.1cqw;background:#e2eaeb}
.lane+.lane{border-left:1px solid #a8b9bf}
.identity{display:block;align-self:stretch;flex:none;width:.34cqw;min-width:4px;background:#2b88a9}
.jerseyColorB{background:#c66d68}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1.45cqw;color:#253c49;font-size:3.45cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support-track,.primary-track{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;min-width:0;font-variant-numeric:tabular-nums}
.support-track{width:10.4%;border-left:1px solid #a8b9bf;background:#e2eaeb;color:#253c49}
.primary-track{width:19%;background:#253c49;color:#f7faf9}
.value{display:block;max-width:100%;overflow:hidden;text-align:center;white-space:nowrap;font-weight:800;line-height:1}
.support-track .value{font-size:3.1cqw}
.primary-track .value{font-size:4.5cqw}
.caption{display:block;max-width:100%;white-space:nowrap;text-align:center;font-size:1.2cqw;font-weight:700;line-height:1.1}
.footline{display:flex;align-items:center;min-width:0;height:4.45cqw;border-top:1px solid #a8b9bf;background:#253c49;color:#f7faf9}
.sport-tag{display:block;flex:1 1 auto;min-width:0;padding:0 2.2cqw;overflow:hidden;white-space:nowrap;font-size:2.5cqw;font-weight:800;line-height:1}
.stats{display:flex;align-items:center;justify-content:flex-end;flex:0 0 auto;min-width:0}
.stat{display:flex;align-items:baseline;justify-content:center;gap:.55cqw;min-width:0;padding:0 1.9cqw;border-left:1px solid #a8b9bf;white-space:nowrap;font-size:1.45cqw;font-weight:600;line-height:1}
.stat strong{font-size:1.25em;font-weight:800;font-variant-numeric:tabular-nums}
.retained,.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:760px){.board{width:100%}.lanes{flex-direction:column}.lane{flex:none;height:74px}.lane+.lane{border-left:0;border-top:1px solid #a8b9bf}.identity{width:5px}.name{padding:0 12px;font-size:clamp(18px,5.3vw,27px)}.support-track{width:17%}.primary-track{width:24%}.support-track .value{font-size:clamp(20px,6vw,28px)}.primary-track .value{font-size:clamp(25px,7.7vw,38px)}.caption{font-size:10px}.footline{height:auto;min-height:60px;display:block;padding:8px 10px}.sport-tag{padding:0 0 6px;font-size:13px}.stats{justify-content:space-between}.stat{padding:0 5px;gap:3px;font-size:clamp(8px,2.2vw,11px)}.stat:first-child{border-left:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Softball scoreboard">
<div class="lanes rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
<div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="support-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong><span class="caption" data-osb-component="text">HITS</span></div><div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong><span class="caption" data-osb-component="text">RUNS</span></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="support-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong><span class="caption" data-osb-component="text">HITS</span></div><div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong><span class="caption" data-osb-component="text">RUNS</span></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
<div class="footline rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">SOFTBALL</span><div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static softball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div></article></main></body></html>
