<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editorial Quotient Volleyball — Duel</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #231b17; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { width: 100%; max-width: 1366px; display: flex; flex-direction: column; padding: 28px 48px 25px; background: #fbf5ed; }
.title { text-align: center; font-size: 44px; font-weight: 600; letter-spacing: .25em; padding-left: .25em; line-height: 1.25; margin-bottom: 22px; }
.duel { display: flex; }
.team { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; padding-right: 34px; }
.team + .team { border-left: 2px solid #231b17; padding-right: 0; padding-left: 36px; }
.name { display: block; width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-family: "Times New Roman", Times, serif; font-style: italic; font-weight: 700; font-size: 116px; line-height: 1.12; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.sets-band { display: flex; flex-direction: column; align-items: center; margin-top: 9px; margin-bottom: 9px; gap: 8px; }
.label { display: block; text-align: center; font-size: 32px; line-height: 1; letter-spacing: .1em; font-weight: 600; }
.match-score { display: block; width: 100%; height: 48px; font-size: 48px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.rule { display: block; width: 100%; height: 2px; flex: 0 0 2px; background: #231b17; }
.score { display: block; width: 100%; height: 238px; margin-top: 17px; color: #a74620; font-family: "Times New Roman", Times, serif; font-size: 280px; font-weight: 700; line-height: .9; text-align: center; font-variant-numeric: tabular-nums; }
.points-label { margin-top: 7px; }
.set-footer { display: flex; align-items: center; justify-content: center; padding-top: 20px; gap: 15px; font-size: 34px; font-weight: 600; line-height: 1; letter-spacing: .08em; }
.set-value { display: block; width: 36px; text-align: center; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 1400px) {
  .name { font-size: clamp(32px, 8.2vw, 116px); }
}
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .board { padding: 22px 16px 18px; }
  .title { font-size: 22px; letter-spacing: .13em; margin-bottom: 22px; }
  .team { padding-right: 12px; }
  .team + .team { padding-left: 12px; }
  .name { font-size: 29px; }
  .sets-band { margin-top: 15px; margin-bottom: 9px; gap: 6px; }
  .label { font-size: 14px; letter-spacing: .08em; }
  .match-score { height: 27px; font-size: 27px; }
  .score { font-size: 95px; height: 86px; margin-top: 16px; }
  .points-label { margin-top: 6px; }
  .set-footer { padding-top: 20px; font-size: 21px; gap: 8px; }
  .set-value { width: 24px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="duel rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="team columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
          <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
          <div class="sets-band columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">SETS</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
          <span class="rule jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
          <span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="label points-label">POINTS</span>
        </div>
        <div class="team columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
          <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
          <div class="sets-band columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">SETS</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
          <span class="rule jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
          <span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="label points-label">POINTS</span>
        </div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
