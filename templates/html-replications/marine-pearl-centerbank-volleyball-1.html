<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marine Pearl Centerbank Volleyball — Paired Rows</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: transparent; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .stage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
    .board { display: flex; width: min(88vw, 1050px); max-width: 100%; overflow: hidden; border: 2px solid #90a8a7; background: #edf0ed; color: #23343b; container-type: inline-size; }
    .sport { display: flex; align-items: center; justify-content: center; flex: 0 0 20%; min-width: 0; border-right: 2px solid #90a8a7; background: #152f3c; color: #fff; font-size: 2.4cqw; font-weight: 800; line-height: 1; letter-spacing: .02em; white-space: nowrap; }
    .data { display: flex; flex: 1 1 0; flex-direction: column; min-width: 0; }
    .team { display: flex; align-items: stretch; flex: none; height: 10.6cqw; min-height: 62px; background: #edf0ed; }
    .team + .team { border-top: 2px solid #90a8a7; }
    .tick { display: block; flex: 0 0 3.5%; align-self: stretch; margin: .5cqw 0 .5cqw .55cqw; background: #6bb89c; }
    .jerseyColorB { background: #789dbf; }
    .name { display: block; align-content: center; flex: 1 1 0; min-width: 0; overflow: hidden; padding: 0 2.4cqw; color: #23343b; font-size: 4.65cqw; font-weight: 700; line-height: 1.05; text-overflow: ellipsis; white-space: nowrap; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .sets { display: flex; align-items: center; justify-content: center; flex: 0 0 12%; flex-direction: column; min-width: 0; gap: .4cqw; white-space: nowrap; }
    .sets-label { font-size: 2.3cqw; font-weight: 700; line-height: 1; }
    .sets-score { font-size: 3.6cqw; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .points-score { display: flex; align-items: center; justify-content: center; flex: 0 0 22%; min-width: 0; border-left: 2px solid #90a8a7; background: #284e5d; color: #fff; font-size: 7.4cqw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .set-strip { display: flex; align-items: center; justify-content: center; flex: none; height: 4.1cqw; min-height: 31px; gap: .7cqw; border-top: 2px solid #90a8a7; background: #edf0ed; color: #23343b; font-size: 2.6cqw; font-weight: 800; line-height: 1; white-space: nowrap; }
    .set-value { font-variant-numeric: tabular-nums; }
    .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint,
    .point-slot:has(> .isMatchPoint[style*="opacity:1"]) > .isGamePoint { opacity: 0 !important; }
    @media (max-width: 600px) {
      .board { width: 100%; }
      .sport { font-size: clamp(8px, 2.45vw, 11px); letter-spacing: 0; }
      .team { height: 62px; }
      .tick { margin: 4px 0 4px 3px; }
      .name { padding: 0 6px; font-size: clamp(13px, 4.1vw, 19px); }
      .sets { flex-basis: 15%; gap: 3px; }
      .sets-label { font-size: 9px; }
      .sets-score { font-size: 19px; }
      .points-score { flex-basis: 22%; font-size: clamp(28px, 8vw, 39px); }
      .set-strip { height: 31px; gap: 4px; font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="stage" data-osb-component="layout">
    <article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Volleyball scoreboard">
      <div class="sport" data-osb-component="text">VOLLEYBALL</div>
      <div class="data columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
          <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
          <div class="sets columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="sets-label" data-osb-component="text">SETS</span><span class="sets-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
          <span class="points-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span>
        </div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
          <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
          <div class="sets columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="sets-label" data-osb-component="text">SETS</span><span class="sets-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
          <span class="points-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span>
        </div>
        <div class="set-strip rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">SET</span><span class="set-value" data-osb-component="text" data-osb-static="true" data-sport-stat="set">0</span></div>
      </div>
      <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
