<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SOFTBALL · Spruce Pearl Leadnote</title><style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f9fbf8}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px;background:transparent}
.board{width:min(59vw,1180px);min-width:0;overflow:hidden;border:1px solid #a7bcb4;border-radius:4px;background:#28443f;container-type:inline-size;font-variant-numeric:tabular-nums}
.board.horizontal{width:min(82vw,1660px)}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{display:flex;align-items:stretch;min-width:0;height:13.8cqw;background:#28443f}
.lane+.lane{border-top:1px solid #a7bcb4}
.identity{display:block;flex:0 0 2.2cqw;min-width:6px;background:#3185aa}
.jerseyColorB{background:#c96d70}
.primary-track{flex:0 0 19%;width:19%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#e4e9e3;color:#28443f;white-space:nowrap}
.primary-number{display:block;max-width:100%;font-size:8cqw;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.primary-caption{display:block;margin-top:.4cqw;font-size:2.3cqw;font-weight:700;line-height:1;white-space:nowrap}
.namebed{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.6cqw;padding:0 2.6cqw;overflow:hidden}
.support-line{display:flex;align-items:baseline;gap:1.2cqw;min-width:0;white-space:nowrap;line-height:1.1}
.support-caption{font-size:2.3cqw;font-weight:700;letter-spacing:.012em}
.support-number{font-size:3cqw;font-weight:700;font-variant-numeric:tabular-nums}
.name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:6cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.utility{min-height:5.8cqw;display:flex;align-items:center;min-width:0;padding:0 2.1cqw;background:#e4e9e3;color:#28443f;border-top:1px solid #a7bcb4;white-space:nowrap}
.sport-tag{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:3.2cqw;font-weight:700;line-height:1;letter-spacing:.005em}
.status{display:flex;align-items:center;justify-content:flex-end;min-width:0;flex:0 0 auto}
.status-item{display:flex;align-items:baseline;justify-content:center;gap:.7cqw;min-width:0;padding:0 1.2cqw;border-left:1px solid #60776e;font-size:2cqw;font-weight:700;line-height:1}
.status-value{font-size:1.25em;font-weight:700;font-variant-numeric:tabular-nums}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.horizontal .lanes{flex-direction:row}
.horizontal .lane{height:9.8cqw;flex:1 1 50%}
.horizontal .lane+.lane{border-top:0;border-left:1px solid #a7bcb4}
.horizontal .identity{flex-basis:1.7cqw}
.horizontal .primary-track{flex-basis:20%;width:20%}
.horizontal .primary-number{font-size:5.5cqw}
.horizontal .primary-caption{font-size:1.4cqw;margin-top:.2cqw}
.horizontal .namebed{padding:0 1.8cqw;gap:.25cqw}
.horizontal .support-caption{font-size:1.6cqw}
.horizontal .support-number{font-size:2.1cqw}
.horizontal .name{font-size:3.9cqw}
.horizontal .utility{min-height:4cqw}
.horizontal .sport-tag{font-size:2.4cqw}
.horizontal .status-item{font-size:1.5cqw}
@media(max-width:650px){
 .board,.board.horizontal{width:94vw;container-type:normal}
 .lanes,.horizontal .lanes{flex-direction:column}
 .lane,.horizontal .lane{height:82px;flex:0 0 auto}
 .lane+.lane,.horizontal .lane+.lane{border-left:0;border-top:1px solid #a7bcb4}
 .identity,.horizontal .identity{flex-basis:7px}
 .primary-track,.horizontal .primary-track{flex-basis:23%;width:23%}
 .primary-number,.horizontal .primary-number{font-size:38px}
 .primary-caption,.horizontal .primary-caption{font-size:10px;margin-top:2px}
 .namebed,.horizontal .namebed{padding:0 12px;gap:3px}
 .support-line{gap:5px}
 .support-caption,.horizontal .support-caption{font-size:11px}
 .support-number,.horizontal .support-number{font-size:14px}
 .name,.horizontal .name{font-size:clamp(20px,6.6vw,27px)}
 .utility,.horizontal .utility{min-height:57px;flex-direction:column;align-items:stretch;justify-content:center;gap:4px;padding:5px 8px}
 .sport-tag,.horizontal .sport-tag{flex:none;font-size:12px}
 .status{flex:none;justify-content:space-between}
 .status-item,.horizontal .status-item{flex:1 1 auto;gap:3px;padding:0 5px;font-size:10px}
 .status-item:first-child{border-left:0;padding-left:0}
 .status-item:last-child{padding-right:0}
 .status-value{font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body><main class="stage"><article class="board columnContainer horizontal" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="softball scoreboard">
 <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="lane rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container">
    <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA" aria-hidden="true"></span>
    <div class="primary-track" data-osb-component="layout"><span class="primary-number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption" data-osb-component="text">RUNS</span></div>
    <div class="namebed" data-osb-component="layout"><div class="support-line" data-osb-component="layout"><span class="support-caption" data-osb-component="text">HITS</span><span class="support-number" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span></div><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div>
    <span class="hidden-match currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore" hidden>0</span>
  </div><div class="lane rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
    <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB" aria-hidden="true"></span>
    <div class="primary-track" data-osb-component="layout"><span class="primary-number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption" data-osb-component="text">RUNS</span></div>
    <div class="namebed" data-osb-component="layout"><div class="support-line" data-osb-component="layout"><span class="support-caption" data-osb-component="text">HITS</span><span class="support-number" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span></div><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div>
    <span class="hidden-match currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore" hidden>0</span>
  </div></div>
 <footer class="utility" data-osb-component="layout"><span class="sport-tag" data-osb-component="text">SOFTBALL</span><div class="status" data-osb-component="layout"><span class="status-item" data-osb-component="layout"><span data-osb-component="text">INNING</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="status-item" data-osb-component="layout"><span data-osb-component="text">BALLS</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span></span><span class="status-item" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span><span class="status-item" data-osb-component="layout"><span data-osb-component="text">OUTS</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span></span></div></footer>
 <div class="point-slot" data-osb-component="layout" hidden><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
</article></main></body></html>
