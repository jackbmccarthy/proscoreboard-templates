<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Basalt Copper Dual Track 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.package{width:min(96vw,1880px);max-width:100%;container-type:inline-size}
.sport-tag{display:block;margin:0 0 13px 10px;color:#fff;font-size:clamp(18px,1.7cqw,32px);font-weight:800;line-height:1.1;letter-spacing:.01em}
.board{display:flex;flex-direction:column;width:100%;aspect-ratio:12.3;overflow:hidden;border:2px solid #8fa5a4;border-radius:8px;background:#26333a;color:#fff}
.pair{display:flex;flex:1 1 0;min-width:0;min-height:0}
.side{display:flex;align-items:stretch;flex:1 1 0;min-width:0}
.side+.side{border-left:2px solid #8fa5a4}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;align-self:stretch;flex:0 0 14px;margin:20px 0 20px 28px;background:#a45a47}
.jerseyColorB{background:#a45a47}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;padding:0 26px;color:#fff;font-size:clamp(25px,3.3cqw,60px);font-weight:700;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.sets,.points{display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sets{flex:0 0 13.5%;background:#dce2df;color:#23343a}
.points{flex:0 0 21.5%;background:#87473a;color:#fff}
.label{display:block;max-width:100%;overflow:hidden;font-size:clamp(12px,1.2cqw,23px);font-weight:800;line-height:1}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(35px,3.5cqw,66px);font-weight:800;line-height:1;text-align:center}
.utility{display:flex;align-items:center;justify-content:center;flex:0 0 28%;border-top:2px solid #8fa5a4;color:#aab6b1;font-size:clamp(14px,1.5cqw,27px);font-weight:750;line-height:1;white-space:nowrap}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;margin-left:.35em;font-variant-numeric:tabular-nums;text-align:center}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){
 .stage{padding:6px}
 .package{width:100%}
 .sport-tag{margin:0 0 5px 4px;font-size:12px}
 .board{height:112px;aspect-ratio:auto;border-width:1px;border-radius:3px}
 .side+.side,.utility{border-width:1px}
 .identity{flex-basis:4px;margin:14px 0 14px 6px}
 .name{padding:0 5px;font-size:clamp(11px,3.5cqw,17px)}
 .sets{flex-basis:17%;gap:2px}
 .points{flex-basis:23%;gap:2px}
 .label{font-size:clamp(7px,2cqw,10px)}
 .score{font-size:clamp(22px,7cqw,35px)}
 .utility{font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <div class="package columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <span class="sport-tag" data-osb-component="text">VOLLEYBALL</span>
  <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Horizontal volleyball scoreboard with generic manual scoring">
   <div class="pair rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
    <div class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="sets" data-osb-component="layout"><span class="label" data-osb-component="text">SETS</span><span class="score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="points" data-osb-component="layout"><span class="label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
    <div class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="sets" data-osb-component="layout"><span class="label" data-osb-component="text">SETS</span><span class="score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="points" data-osb-component="layout"><span class="label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
   </div>
   <div class="utility" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div>
  </article>
 </div>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
