<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plum Mist Open Namebed Volleyball 2</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f9f7f7}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.board{width:min(49vw,1060px);max-width:100%;overflow:hidden;border-radius:3px;background:#403943;font-variant-numeric:tabular-nums}
.header{height:70px;min-width:0;display:flex;align-items:center;gap:30px;padding:0 10px;background:#403943;border-bottom:1px solid #867d89}
.sport-tab{flex:none;display:flex;align-items:center;justify-content:center;min-width:300px;height:60px;margin:0;padding:0 18px;border-radius:3px;background:#e7e5e6;color:#403943;font-size:32px;font-weight:800;letter-spacing:.01em;line-height:1;white-space:nowrap}
.utility{display:flex;align-items:center;gap:16px;min-width:0;white-space:nowrap}
.status{display:flex;align-items:baseline;gap:8px;color:#f9f7f7;font-size:26px;line-height:1;font-weight:600}
.status+.status{border-left:1px solid #aba3ad;padding-left:16px}
.status strong{font-size:29px;font-weight:800}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{height:144px;min-width:0;display:flex;align-items:stretch;background:#403943}
.lane+.lane{border-top:1px solid #867d89}
.identity-tick{flex:0 0 26px;margin:8px 0 8px 14px;background:#3186a8}
.side-b .identity-tick{background:#c96b71}
.namebed{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:7px 34px}
.name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f9f7f7;font-size:66px;line-height:1.05;font-weight:700}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support{display:flex;align-items:baseline;gap:12px;min-width:0;color:#f9f7f7;font-size:27px;line-height:1;font-weight:600;white-space:nowrap}
.support-value{font-size:30px;font-weight:800}
.primary-track{flex:0 0 165px;width:165px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 4px 5px;background:#403943;color:#f9f7f7}
.primary-number{display:block;width:100%;min-width:0;text-align:center;white-space:nowrap;font-size:88px;line-height:1;font-weight:800;letter-spacing:-.035em}
.primary-caption{display:block;text-align:center;font-size:23px;line-height:1;font-weight:700;white-space:nowrap}
.horizontal{width:min(85vw,1850px)}
.horizontal .header{height:62px;gap:30px}
.horizontal .lanes{flex-direction:row}
.horizontal .lane{flex:1 1 0;height:175px;border-top:0}
.horizontal .lane+.lane{border-left:1px solid #867d89}
.horizontal .identity-tick{margin-left:15px}
.horizontal .namebed{padding-left:24px;padding-right:8px}
.horizontal .primary-track{flex-basis:150px;width:150px}
.horizontal .primary-track{border-left:0}
.point-slot{display:none!important}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:1300px){
.board{width:min(54vw,1060px)}
.horizontal{width:min(94vw,1850px)}
.header{height:44px;gap:14px;padding:0 12px}
.sport-tab{min-width:175px;height:31px;font-size:19px}
.utility{gap:9px}
.status{font-size:16px;gap:5px}
.status+.status{padding-left:9px}
.status strong{font-size:17px}
.lane{height:96px}
.horizontal .lane{height:110px}
.namebed{padding:5px 16px;gap:5px}
.name{font-size:38px}
.support{font-size:16px;gap:8px}
.support-value{font-size:17px}
.primary-track{flex-basis:104px;width:104px}
.primary-number{font-size:48px}
.primary-caption{font-size:13px}
.horizontal .header{height:44px;gap:14px}
.horizontal .namebed{padding-left:16px}
.horizontal .primary-track{flex-basis:108px;width:108px}
}
@media(max-width:600px){
.stage{padding:5px}
.board,.horizontal{width:100%}
.header,.horizontal .header{height:30px;gap:5px;padding:0 6px}
.sport-tab{min-width:75px;height:22px;padding:0 5px;font-size:9px}
.utility{gap:4px}
.status{font-size:10px;gap:3px}
.status+.status{padding-left:4px}
.status strong{font-size:12px}
.horizontal .lanes{flex-direction:column}
.lane,.horizontal .lane{height:72px}
.horizontal .lane{flex:0 0 72px}
.horizontal .lane+.lane{border-left:0;border-top:1px solid #867d89}
.identity-tick,.horizontal .identity-tick{flex-basis:5px;margin:7px 0 7px 7px}
.namebed,.horizontal .namebed{padding:4px 8px;gap:3px}
.name{font-size:23px}
.support{font-size:10px;gap:5px}
.support-value{font-size:12px}
.primary-track,.horizontal .primary-track{flex-basis:68px;width:68px;padding:2px 2px 3px}
.primary-number{font-size:31px}
.primary-caption{font-size:9px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer horizontal volleyball" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="volleyball scoreboard with generic manual scoring">
 <header class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><h1 class="sport-tab" data-osb-component="text">VOLLEYBALL</h1><div class="utility rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="status" data-osb-component="layout"><span data-osb-component="text">SET</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</strong></span></div></header>
 <div class="lanes rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><section class="lane side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
 <span class="identity-tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA" aria-hidden="true"></span>
 <div class="namebed columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
  <div class="support rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">SETS</span><span class="support-value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
 </div>
 <div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <span class="primary-number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption" data-osb-component="text">POINTS</span>
 </div>
</section><section class="lane side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
 <span class="identity-tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB" aria-hidden="true"></span>
 <div class="namebed columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
  <div class="support rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">SETS</span><span class="support-value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
 </div>
 <div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <span class="primary-number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption" data-osb-component="text">POINTS</span>
 </div>
</section></div>
 <div class="point-slot" data-osb-component="layout" hidden><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
</article></main></body></html>
