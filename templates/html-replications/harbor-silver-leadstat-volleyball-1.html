<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Harbor Silver Leadstat 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(94vw,1250px);max-width:100%;aspect-ratio:3.62;overflow:hidden;border:1px solid #9fb5bc;border-radius:3px;background:#1e3949;color:#f7faf8;container-type:inline-size}
.header{display:flex;align-items:center;justify-content:space-between;flex:0 0 22%;min-width:0;padding:0 3.4%;border-bottom:1px solid #9fb5bc;background:#1e3949;white-space:nowrap}
.sport-tag{font-size:clamp(16px,3.3cqw,42px);font-weight:700;letter-spacing:.035em}
.set-status{display:flex;align-items:center;justify-content:flex-end;gap:.28em;min-width:0;padding-left:5.5%;border-left:1px solid #9fb5bc;font-size:clamp(14px,2.8cqw,35px);font-weight:700;line-height:1}
.current-set{min-width:1ch;font-variant-numeric:tabular-nums}
.lanes{display:flex;flex:1 1 0;min-height:0;flex-direction:column}
.lane{display:flex;align-items:stretch;flex:1 1 0;min-width:0;min-height:0;background:#1e3949}
.lane+.lane{border-top:1px solid #9fb5bc}
.identity{flex:0 0 1.5%;min-width:5px;background:#338ba6}
.jerseyColorB{background:#c86e69}
.support-track{display:flex;align-items:center;justify-content:center;flex:0 0 14%;min-width:0;flex-direction:column;color:#d9e3e4;font-variant-numeric:tabular-nums;white-space:nowrap}
.support-track .value{display:block;font-size:clamp(23px,4.9cqw,59px);font-weight:700;line-height:1}
.support-track .caption{display:block;margin-top:2px;font-size:clamp(10px,1.8cqw,22px);font-weight:700;line-height:1.1}
.name{display:block;align-self:center;flex:1 1 0;min-width:0;overflow:hidden;padding:0 2.3%;color:#f7faf8;font-size:clamp(24px,5.1cqw,66px);font-weight:700;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.primary-track{display:flex;align-items:center;justify-content:center;flex:0 0 16%;min-width:0;flex-direction:column;background:#d9e3e4;color:#1e3949;font-variant-numeric:tabular-nums;white-space:nowrap}
.primary-track .value{display:block;font-size:clamp(32px,5.6cqw,70px);font-weight:800;line-height:1}
.primary-track .caption{display:block;margin-top:2px;font-size:clamp(10px,1.8cqw,22px);font-weight:700;line-height:1.1}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){.stage{padding:7px}.board{width:100%;height:190px;aspect-ratio:auto}.header{flex-basis:20%}.sport-tag{font-size:clamp(12px,3.6cqw,18px)}.set-status{font-size:clamp(11px,3cqw,15px)}.identity{flex-basis:5px}.support-track{flex-basis:18%}.support-track .value{font-size:clamp(21px,6cqw,30px)}.support-track .caption,.primary-track .caption{font-size:clamp(8px,2.2cqw,11px)}.name{font-size:clamp(16px,5cqw,25px);padding:0 3%}.primary-track{flex-basis:22%}.primary-track .value{font-size:clamp(28px,8cqw,39px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="support-track" data-osb-component="layout"><span class="value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="caption" data-osb-component="text">SETS</span></div><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="primary-track" data-osb-component="layout"><span class="value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="caption" data-osb-component="text">POINTS</span></div></div>
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="support-track" data-osb-component="layout"><span class="value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="caption" data-osb-component="text">SETS</span></div><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="primary-track" data-osb-component="layout"><span class="value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="caption" data-osb-component="text">POINTS</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
