<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stand Stack</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px; font-family: "Helvetica Neue", Arial, sans-serif; }
    .bug { position: relative; width: 340px; color: #fff; filter: drop-shadow(0 5px 12px #0009); }
    .top { position: relative; display: flex; align-items: center; gap: 10px; width: max-content; padding: 5px 12px; background: #d7263d; border-radius: 4px 4px 0 0; }
    .gc { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .half { font-size: 13px; font-weight: 700; letter-spacing: 1px; padding: 1px 6px; background: #fff; color: #d7263d; border-radius: 2px; }
    .half:empty { display: none; }
    .added { font-size: 15px; font-weight: 800; color: #fff; }
    .added:has(.at:empty) { display: none; }
    .live { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .ht { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; color: #d7263d; font-size: 18px; font-weight: 800; letter-spacing: 3px; border-radius: 4px 4px 0 0; }
    .rows { background: #0b1d3a; border-radius: 0 4px 0 0; overflow: hidden; }
    .row { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto 54px; align-items: center; gap: 0; height: 44px; }
    .row + .row { border-top: 1px solid #1e3561; }
    .kit { align-self: stretch; background-color: #44587d; }
    .nm { padding: 0 12px; font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cards { display: flex; gap: 4px; padding-right: 10px; }
    .card { display: inline-flex; align-items: center; justify-content: center; width: 13px; height: 18px; border-radius: 2px; font-size: 10px; font-weight: 800; transform: rotate(8deg); }
    .card.red { background: #e5262b; }
    .card.yellow { background: #f7d117; color: #0b1d3a; }
    .pts { align-self: stretch; display: flex; align-items: center; justify-content: center; background: #fff; color: #0b1d3a; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .row + .row .pts { border-top: 1px solid #d5dbe6; }
    .foot { display: flex; justify-content: space-between; padding: 4px 12px; background: #132a52; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 0 0 4px 4px; }
    .foot:has(.eventName:empty):has(.matchRound:empty) { display: none; }
    .ev-round { color: #ff8090; }
    .pens { display: none; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="bug" aria-label="Soccer scorebug">
  <div class="top"><span class="live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="added addedTimeVisible"><span class="at addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="half periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="ht isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">HT</span></div>
  <div class="rows">
    <div class="row"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="cards"><span class="card yellow isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="card red isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
    <div class="row"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="cards"><span class="card yellow isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="card red isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
  </div>
  <span class="foot"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
  <span class="pens shootoutAttempts"><b class="pens-l">PENS</b><span class="pen-a shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore"></span><b class="pens-d">-</b><span class="pen-b shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore"></span></span>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
