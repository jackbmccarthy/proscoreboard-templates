<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Matchup Panel</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.osb-core-fields{display:none!important}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.nm{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none;text-wrap:balance}
.slab{position:relative;flex:none;overflow:hidden}.slab>.jc{position:absolute;inset:0}
.slab>.home{position:absolute;left:50%;bottom:.35rem;width:.8rem;height:.82rem;margin-left:-.4rem;background:#fff;clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.72)}
.diamond>.base{position:absolute;width:calc(var(--d,3rem)*.3);height:calc(var(--d,3rem)*.3);transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.08rem);overflow:hidden}
.diamond>.base.second{left:35%;top:calc(var(--d,3rem)*.082)}.diamond>.base.third{left:10%;top:calc(var(--d,3rem)*.332)}.diamond>.base.first{left:60%;top:calc(var(--d,3rem)*.332)}
.diamond .runner{position:absolute;inset:0;background:var(--base-on,#f5cf52)}
.dots{display:flex;gap:var(--dot-gap,.25rem)}
.dot{position:relative;flex:none;width:var(--dot,.82rem);height:var(--dot,.82rem);border-radius:50%;background:var(--dot-off,rgba(255,255,255,.18))}
.dot>.lit{position:absolute;inset:0;border-radius:50%;background:var(--dot-on,#f5cf52)}
.half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.half-dim{position:absolute;inset:0}
.half-dim::before,.half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.25))}
.half-dim::before,.half-dim::after{position:absolute;left:0;width:100%;height:100%}
.half-dim::before,.inningHalf::after{clip-path:polygon(50% 6%,94% 42%,6% 42%)}
.half-dim::after,.inningHalf::before{clip-path:polygon(6% 58%,94% 58%,50% 94%)}
.half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inn-n{min-width:1.15em;text-align:left}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.ev{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.5em;overflow-wrap:normal;word-break:normal;hyphens:none}
.ev-e:empty,.ev-r:empty{display:none}.ev-e:has(+.ev-r:not(:empty))::after{content:"\00b7";margin-left:.5em;opacity:.75}
.st{position:relative;display:inline-grid;align-items:center;justify-items:end;white-space:nowrap}
.st>*{grid-area:1/1}
.st-pre{opacity:0}.st:has(>.isMatchStarted[style*="opacity: 0"])>.st-pre{opacity:1}
.st-live-in{display:inline-flex;align-items:center;gap:.4em}.st-live-in>i{flex:none;width:.8rem;height:.8rem;border-radius:50%;background:var(--live,#ff3b30);box-shadow:0 0 .45rem var(--live,#ff3b30);animation:osb-pulse 1.4s ease-in-out infinite}
@keyframes osb-pulse{50%{opacity:.7}}
.board:has(.isComplete[style*="opacity: 1"]) .st-pre,.board:has(.isComplete[style*="opacity: 1"]) .st-live-in{visibility:hidden}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.ls{display:flex}
.ls-col{position:relative}
.ls-extra{display:none!important}.ls-extra:has(>.ls-gate[style*="opacity: 1"]){display:flex!important}
.ls-gate{display:flex;flex-direction:column;position:relative}
.ls-c{position:relative;display:flex;align-items:center;justify-content:center}

.ls-cur{position:absolute;inset:0;pointer-events:none}
.tick{position:relative}.tick>.tick-on,.tick>.tick-cur{position:absolute;inset:0;border-radius:inherit}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.board{position:fixed;left:2.4rem;bottom:2.4rem;font-family:"Avenir Next Condensed","Bahnschrift SemiCondensed","Roboto Condensed","Arial Narrow",sans-serif;color:#2a1640;--live:#ff3b30}
.pan{display:grid;grid-template-columns:39rem 25rem;grid-template-rows:auto auto auto;border-radius:.5rem;overflow:hidden;box-shadow:0 .45rem 1.2rem rgba(0,0,0,.45)}
.hdr{grid-column:1;grid-row:1;display:grid;grid-template-columns:1fr 3.8rem 2.6rem 2.6rem;align-items:end;min-height:2.2rem;padding:.42rem 0 .32rem;background:#2a1640;color:#f4f0fa;font:700 1rem/1.25 "DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;letter-spacing:.08em;text-transform:uppercase;--evlh:1.25}

.ev{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:1em;overflow:hidden;min-width:0;--evg:1em}
.ev>span{min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev>.ev-e::after{content:none!important}
.ev>.ev-r{margin-left:calc(-1 * var(--evg));padding-left:var(--evg);background:radial-gradient(circle closest-side,currentColor 62%,transparent 76%) calc((var(--evg) - .36em) / 2) 46%/.36em .36em no-repeat}
.hdr .ev{margin:0 .6rem 0 1rem;flex-wrap:nowrap}.hdr .ev>.ev-e{flex:0 1 auto}.hdr .ev>.ev-r{flex:0 0 auto;max-width:62%}.hdr>.c{font-family:"DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;text-align:center;color:#b3a3c6;letter-spacing:.1em}
.hdr .ev>.st{flex:none;overflow:visible;justify-items:start;padding-right:.85rem;margin-right:-.15rem;border-right:.1rem solid rgba(255,255,255,.24);font-family:"DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.1em}

.st-pre{color:#b3a3c6}
.st-fin{padding:.2rem .5rem .14rem;border-radius:.2rem;background:#ffd43b;color:#2a1640;letter-spacing:.14em}
.teams{grid-column:1;grid-row:2;background:#fdfcff}
.row{display:grid;grid-template-columns:1.2rem 1fr 1.7rem 3.8rem 2.6rem 2.6rem;align-items:center;height:3.4rem}
.row+.row{border-top:.08rem solid rgba(42,22,64,.12)}
.slab{align-self:stretch;background:var(--fb)}.slab-a{--fb:#4f8a8a}.slab-b{--fb:#a3634f}
.nmw{display:flex;align-items:center;gap:.6rem;min-width:0;padding:0 .4rem 0 1rem}.nmw>.nm{flex:0 1 auto;min-width:0}.hm{flex:none;padding:.2rem .4rem .12rem;border:.1rem solid currentColor;border-radius:.2rem;color:#6b5d7d;font:700 1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.nm{font-weight:700;font-size:1.55rem;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.batw{display:flex;justify-content:center}.bat{width:.9rem;height:.9rem;border-radius:50%;background:#ffd43b;box-shadow:0 0 0 .16rem #2a1640}
.rc{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#2a1640}
.rc>.win{position:absolute;inset:0;background:#ffd43b}
.runs{position:relative;font:700 2.4rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;color:#fff}
.rc:has(>.win[style*="opacity: 1"])>.runs{color:#2a1640}
.he{text-align:center;font:700 1.35rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;color:#6b5d7d;font-variant-numeric:tabular-nums}

.pan:has(.isBWinner[style*="opacity: 1"]) .row-a :is(.nm,.he,.hm),.pan:has(.isAWinner[style*="opacity: 1"]) .row-b :is(.nm,.he,.hm){color:#76698a}
.pan:has(.isBWinner[style*="opacity: 1"]) .row-a :is(.slab),.pan:has(.isAWinner[style*="opacity: 1"]) .row-b :is(.slab){opacity:.5}
.pan:has(.isBWinner[style*="opacity: 1"]) .row-a .runs,.pan:has(.isAWinner[style*="opacity: 1"]) .row-b .runs{color:#b3a6c6}
.sit{grid-column:2;grid-row:1/4;position:relative;display:flex;align-items:center;justify-content:center;gap:1.2rem;padding:0 1rem;background:#2a1640;border-left:.08rem solid rgba(255,255,255,.1);color:#f7f3fb}

.inn{display:flex;align-items:center;gap:.2rem;height:4.8rem;padding-right:1.2rem;border-right:.08rem solid rgba(255,255,255,.14);font:700 2.6rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;--half-on:#ffd43b;--half-off:rgba(255,255,255,.2);--half-h:2.6rem;--half-size:1.15rem}
.diamond{--d:5.3rem;--base-edge:#f7f3fb;--base-off:transparent;--base-on:#ffd43b;--base-line:.15rem}
.cc{display:flex;flex-direction:column;align-items:flex-start;gap:.42rem}
.count{font:700 2.9rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}.count .dash{opacity:.6;margin:0 .08em}
.lamps{display:flex;align-items:center;gap:.36rem;font:700 1.1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.08em;color:#c7b8d8;--dot:1.05rem;--dot-gap:.24rem;--dot-off:rgba(255,255,255,.17)}
.lamps>.s{margin-left:.5rem}
.ball-dots{--dot-on:#4fdc8a}.strike-dots{--dot-on:#ff5a52}.out-dots{--dot-on:#ffd43b}

.cover{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;background:#2a1640;text-transform:uppercase;text-align:center;white-space:nowrap}
.cover b{font:700 1.2rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.16em;color:#c7b8d8}
.cover .pl{font:700 3.1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.06em;color:#f7f3fb}
.cover.pre{opacity:0}.pan:has(.st-live[style*="opacity: 0"]):not(:has(.isComplete[style*="opacity: 1"])) .cover.pre{opacity:1}
.foot{grid-column:1;grid-row:3;display:flex;align-items:center;gap:.9rem;height:1.9rem;padding:0 1rem 0 2.2rem;background:#2a1640;font:700 1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.14em;color:#b3a3c6}

.prog{flex:1;display:flex;align-items:center;gap:.6rem;min-width:0}
.ticks{flex:1;display:flex;gap:0.3rem}.tick{flex:1;height:0.3rem;border-radius:0.15rem;background:rgba(255,255,255,.14)}
.tick>.tick-on{background:rgba(255,255,255,.45)}.tick>.tick-cur{background:#ffd43b}
.xs{flex:none;display:flex;justify-content:flex-end;width:3.2rem}
.xchip{padding:.16rem .38rem .1rem;border-radius:.2rem;background:#ffd43b;color:#2a1640;font:700 1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.04em;white-space:nowrap}
</style></head><body><main class="board" aria-label="Softball lower-third scoreboard">
<div class="pan columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="softball matchup panel">
<div class="hdr"><span class="ev"><span class="st"><span class="st-pre">PREGAME</span><span class="st-live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0"><span class="st-live-in"><i></i>LIVE</span></span><span class="st-fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0">FINAL</span></span><span class="ev-e eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span class="c">R</span><span class="c">H</span><span class="c">E</span></div>
<div class="teams"><div class="row row-a"><span class="slab slab-a"><span class="jc jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><span class="nmw"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="hm isAHome" data-osb-component="field" data-osb-field="isAHome" style="opacity: 0">Home</span></span><span class="batw"><span class="bat isABatting" data-osb-component="field" data-osb-field="isABatting" style="opacity: 0"></span></span><span class="rc"><span class="win isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity: 0"></span><span class="runs currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><span class="he hitsA" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span><span class="he errorsA" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsA">0</span></div><div class="row row-b"><span class="slab slab-b"><span class="jc jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><span class="nmw"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="hm isBHome" data-osb-component="field" data-osb-field="isBHome" style="opacity: 0">Home</span></span><span class="batw"><span class="bat isBBatting" data-osb-component="field" data-osb-field="isBBatting" style="opacity: 0"></span></span><span class="rc"><span class="win isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity: 0"></span><span class="runs currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span><span class="he hitsB" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span><span class="he errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></div></div>
<div class="sit"><span class="inn"><span class="half" aria-hidden="true"><span class="half-dim"></span><span class="half-win"><span class="inningHalf" data-osb-component="field"></span></span></span><span class="inn-n inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="diamond" aria-label="Bases"><span class="base second"><span class="runner isRunnerOnSecond" data-osb-component="field" data-osb-field="isRunnerOnSecond" style="opacity: 0"></span></span><span class="base third"><span class="runner isRunnerOnThird" data-osb-component="field" data-osb-field="isRunnerOnThird" style="opacity: 0"></span></span><span class="base first"><span class="runner isRunnerOnFirst" data-osb-component="field" data-osb-field="isRunnerOnFirst" style="opacity: 0"></span></span></span><span class="cc"><span class="count"><span class="cb balls" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span><span class="dash" aria-hidden="true">-</span><span class="cs strikes" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span><span class="lamps"><b>B</b><span class="dots ball-dots"><span class="dot"><span class="lit isBall1" data-osb-component="field" data-osb-field="isBall1" style="opacity: 0"></span></span><span class="dot"><span class="lit isBall2" data-osb-component="field" data-osb-field="isBall2" style="opacity: 0"></span></span><span class="dot"><span class="lit isBall3" data-osb-component="field" data-osb-field="isBall3" style="opacity: 0"></span></span></span><b class="s">S</b><span class="dots strike-dots"><span class="dot"><span class="lit isStrike1" data-osb-component="field" data-osb-field="isStrike1" style="opacity: 0"></span></span><span class="dot"><span class="lit isStrike2" data-osb-component="field" data-osb-field="isStrike2" style="opacity: 0"></span></span></span></span><span class="lamps"><b>OUT</b><span class="dots out-dots"><span class="dot"><span class="lit isOut1" data-osb-component="field" data-osb-field="isOut1" style="opacity: 0"></span></span><span class="dot"><span class="lit isOut2" data-osb-component="field" data-osb-field="isOut2" style="opacity: 0"></span></span></span></span></span><span class="cover pre"><b>Coming up</b><span class="pl">First pitch</span></span><span class="cover brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0"><b>End of</b><span class="pl periodLabel" data-osb-component="field" data-osb-field="periodLabel"></span></span><span class="cover fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0"><b>After</b><span class="pl"><span class="fi inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span> innings</span></span></div>
<div class="foot"><span>INNINGS</span><span class="prog"><span class="ticks" aria-label="Innings"><span class="tick"><span class="tick-on isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity: 0"></span><span class="tick-cur isInning1Current" data-osb-component="field" data-osb-field="isInning1Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity: 0"></span><span class="tick-cur isInning2Current" data-osb-component="field" data-osb-field="isInning2Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity: 0"></span><span class="tick-cur isInning3Current" data-osb-component="field" data-osb-field="isInning3Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity: 0"></span><span class="tick-cur isInning4Current" data-osb-component="field" data-osb-field="isInning4Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity: 0"></span><span class="tick-cur isInning5Current" data-osb-component="field" data-osb-field="isInning5Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity: 0"></span><span class="tick-cur isInning6Current" data-osb-component="field" data-osb-field="isInning6Current" style="opacity: 0"></span></span><span class="tick"><span class="tick-on isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity: 0"></span><span class="tick-cur isInning7Current" data-osb-component="field" data-osb-field="isInning7Current" style="opacity: 0"></span></span></span><span class="xs"><span class="xchip isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity: 0"><span class="inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span>TH</span></span></span></div>
</div>
<span class="sr"><span class="battingSide" data-osb-component="field" data-osb-field="battingSide"></span><span class="bases" data-osb-component="field" data-osb-field="bases"></span><span class="outs" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span></span><span class="osb-core-fields" aria-hidden="true"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></span></span>
</main></body></html>
