<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coral Slate Header Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #f4f5f3; }
.stage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.board { width: 100%; max-width: 480px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #59656a; border-radius: 6px; background: #1d2226; }
.heading { display: flex; align-items: stretch; min-height: 33px; background: #e68a72; color: #1d2226; font-size: 12px; font-weight: 700; line-height: 1; }
.sport-title { display: flex; align-items: center; flex: 1 1 0; padding: 4px 11px; font-size: 20px; white-space: nowrap; }
.sets-heading, .points-heading { display: flex; align-items: center; justify-content: center; text-align: center; }
.sets-heading, .match-score { flex: 0 0 16%; }
.points-heading, .primary-score { flex: 0 0 19%; }
.team { display: flex; align-items: stretch; min-height: 52px; }
.team + .team { border-top: 1px solid #59656a; }
.identity { display: flex; align-items: center; flex: 1 1 0; gap: 10px; padding: 8px 10px; }
.tick { display: block; width: 24px; flex: 0 0 24px; height: 32px; background: #e68a72; clip-path: path("M0 0H4V32H0Z M10 0H14V32H10Z M20 0H24V32H20Z"); }
.name { display: block; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 23px; font-weight: 700; line-height: 1; color: #f4f5f3; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.match-score { display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.primary-score { display: flex; align-items: center; justify-content: center; border-left: 1px solid #59656a; background: #30383d; color: #fff; font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.set-footer { display: flex; align-items: center; justify-content: center; min-height: 26px; gap: 14px; border-top: 1px solid #59656a; font-size: 14px; line-height: 1; font-weight: 700; }
.footer-label { color: #e68a72; }
.footer-separator { display: block; width: 1px; height: 17px; background: #59656a; }
.set-value { display: block; width: 22px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 600px) { .stage { padding: 14px; } .sport-title { font-size: 17px; } }
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="heading rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-title">VOLLEYBALL</span><span class="sets-heading">SETS</span><span class="points-heading">POINTS</span></header>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
      <footer class="set-footer"><span class="footer-label">SET</span><span class="footer-separator" aria-hidden="true"></span><span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
