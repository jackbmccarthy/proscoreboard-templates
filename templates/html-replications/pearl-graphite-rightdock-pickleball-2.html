<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PICKLEBALL — Pearl Graphite Rightdock</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--pearl:#e8ebe7;--graphite:#26363e;--white:#f8faf8;--rule:#aeb9b7;display:flex;min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:3px;background:var(--pearl);color:var(--graphite);container-type:inline-size}
.board.compact.tt{width:min(69vw,1410px)}
.board.compact.pb{width:min(55vw,1110px)}
.board.horizontal{width:min(93vw,1900px)}
.lanes{display:flex;min-width:0;flex:1 1 auto}
.compact .lanes{flex-direction:column}
.horizontal .lanes{flex-direction:row}
.competitor{display:flex;min-width:0;flex:1 1 0;align-items:stretch;background:var(--pearl)}
.compact.tt .competitor{flex:0 0 85px;height:85px}
.compact.pb .competitor{flex:0 0 92px;height:92px}
.horizontal.tt .competitor{height:104px}
.horizontal.pb .competitor{height:93px}
.compact .competitor+.competitor{border-top:1px solid var(--rule)}
.identity{display:block;flex:0 0 2.2%;background:#2b85a3}
.jerseyColorB{background:#c76b64}
.horizontal .identity{flex-basis:2.8%}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:8px;padding:0 3.1%}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(18px,3.2cqw,56px);line-height:1.1;font-weight:700}
.horizontal .name{font-size:clamp(18px,2.3cqw,48px)}
.combinedAName:empty::before{content:"Player A"}
.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:var(--graphite)}
.support-track,.primary-track{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;text-align:center}
.support-track{flex:0 0 13.5%;background:var(--pearl)}
.primary-track{flex:0 0 16%;background:var(--graphite);color:var(--white)}
.pb.compact .support-track{flex-basis:17%}
.pb.compact .primary-track{flex-basis:19%}
.horizontal .support-track{flex-basis:13%}
.horizontal .primary-track{flex-basis:21%}
.support-score,.primary-score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;line-height:.98}
.support-score{font-size:clamp(26px,3.2cqw,61px)}
.primary-score{font-size:clamp(39px,5.2cqw,96px)}
.horizontal .support-score{font-size:clamp(25px,3cqw,59px)}
.horizontal .primary-score{font-size:clamp(39px,4.8cqw,91px)}
.support-label,.primary-label{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:clamp(9px,1.25cqw,23px);line-height:1.15;font-weight:700}
.dock{position:relative;display:flex;flex:0 0 24.5%;min-width:0;align-items:center;justify-content:center;border-left:1px solid var(--rule);background:var(--graphite);color:var(--white)}
.pb.compact .dock{flex-basis:22%}
.horizontal .dock{flex-basis:17.5%}
.dock-title{max-width:100%;overflow:hidden;white-space:nowrap;padding:0 5%;font-size:clamp(15px,2.3cqw,38px);line-height:1.1;font-weight:700;text-align:center}
.horizontal .dock-title{font-size:clamp(14px,2.1cqw,37px)}
.point-slot{position:absolute;right:0;bottom:3px;left:0;height:14px;font-size:10px;line-height:14px;font-weight:700;text-align:center;pointer-events:none}
.point-state{position:absolute;inset:0;display:block;white-space:nowrap}
.point-slot:has(.isMatchPoint[style*="opacity: 1"]) .isGamePoint,.point-slot:has(.isMatchPoint[style*="opacity:1"]) .isGamePoint{opacity:0!important}
@media(max-width:700px){
  .board.compact.tt,.board.compact.pb,.board.horizontal{width:94vw}
  .horizontal .lanes{flex-direction:column}
  .compact.tt .competitor,.compact.pb .competitor,.horizontal.tt .competitor,.horizontal.pb .competitor{flex:0 0 82px;height:82px}
  .horizontal .competitor+.competitor{border-top:1px solid var(--rule)}
  .identity,.horizontal .identity{flex:0 0 5px}
  .name-lane{padding:0 8px;gap:3px}
  .name,.horizontal .name{font-size:clamp(12px,4vw,23px)}
  .serve{flex-basis:5px;width:5px;height:5px}
  .support-track,.pb.compact .support-track,.horizontal .support-track{flex:0 0 17%}
  .primary-track,.pb.compact .primary-track,.horizontal .primary-track{flex:0 0 23%}
  .support-score,.horizontal .support-score{font-size:clamp(20px,6vw,30px)}
  .primary-score,.horizontal .primary-score{font-size:clamp(27px,8.5vw,42px)}
  .support-label,.primary-label{font-size:8px}
  .dock,.pb.compact .dock,.horizontal .dock{flex:0 0 24%}
  .dock-title,.horizontal .dock-title{font-size:clamp(10px,2.8vw,19px);white-space:normal;overflow-wrap:anywhere}
  .point-slot{font-size:7px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage">
  <article class="board columnContainer horizontal pb" data-osb-component="layout" data-osb-component-type="osb-column-container">
    <div class="lanes"><div class="competitor rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
      <div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div>
      <div class="support-track"><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-label">GAMES</span></div>
      <div class="primary-track"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-label">POINTS</span></div>
    </div><div class="competitor rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
      <div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div>
      <div class="support-track"><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-label">GAMES</span></div>
      <div class="primary-track"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-label">POINTS</span></div>
    </div></div>
    <div class="dock"><span class="dock-title">PICKLEBALL</span><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
  </article>
</main>
</body>
</html>
