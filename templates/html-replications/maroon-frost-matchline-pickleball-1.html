<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleball — Maroon Frost Matchline Scorebug</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--frost:#e9edef;--maroon:#572f3c;--ink:#26343b;--white:#f8f6f2;--rule:#bec8cb;display:flex;flex-direction:column;width:min(46.5vw,925px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:4px;background:var(--frost);color:var(--ink);container-type:inline-size}
.matchline{position:relative;display:flex;flex:0 0 auto;height:6.5cqw;align-items:center;padding:0 3cqw;background:var(--maroon);color:var(--white);font-size:3.3cqw;line-height:1;font-weight:700;white-space:nowrap}
.rows{display:flex;flex:1 1 auto;min-width:0;flex-direction:column}
.row{display:flex;flex:1 1 50%;min-width:0;min-height:17cqw;align-items:stretch}
.row+.row{border-top:1px solid #8ea5ad}
.identity{display:block;flex:0 0 2.5%;width:2.5%;background:#287d9d}
.jerseyColorB{background:#c45f65}
.namefoot{display:flex;flex:1 1 auto;min-width:0;flex-direction:column;justify-content:center;gap:.45cqw;padding:0 4.5cqw}
.name-row{display:flex;min-width:0;align-items:center;gap:.8cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:6.4cqw;line-height:1.05;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .6cqw;width:.6cqw;height:.6cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--ink)}
.games{display:flex;min-width:0;align-items:baseline;gap:1.4cqw;line-height:1}
.games-score{display:block;font-size:5cqw;font-weight:700;font-variant-numeric:tabular-nums}.games-label{display:block;font-size:3cqw;font-weight:700;white-space:nowrap}
.scorecap{display:flex;flex:0 0 23%;width:23%;min-width:0;flex-direction:column;align-items:center;justify-content:center;background:var(--maroon);color:var(--white)}
.primary-score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:11.8cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.primary-label{display:block;font-size:2.4cqw;line-height:1;font-weight:700}
.point-slot{position:absolute;right:2%;top:0;width:20%;height:100%;font-size:1.1cqw;font-weight:700;text-align:center}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--maroon)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.matchline{height:34px;padding:0 10px;font-size:15px}.row{min-height:84px}.identity{flex-basis:5px;width:5px}.namefoot{gap:3px;padding:0 8px}.name-row{gap:3px}.name{font-size:20px}.serve{flex-basis:6px;width:6px;height:6px}.games{gap:4px}.games-score{font-size:18px}.games-label{font-size:11px}.scorecap{flex-basis:27%;width:27%}.primary-score{font-size:43px}.primary-label{font-size:10px}.point-slot{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="matchline"><span>PICKLEBALL</span><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div><div class="rows columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="namefoot"><div class="name-row"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="games"><span class="games-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="games-label">GAMES</span></div></div><div class="scorecap"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-label">POINTS</span></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="namefoot"><div class="name-row"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="games"><span class="games-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="games-label">GAMES</span></div></div><div class="scorecap"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-label">POINTS</span></div></div></div></article></main></body></html>
