<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slate Lime Desk Volleyball — Horizontal Lanes</title>
  <style>
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #fff; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { width: 100%; max-width: 900px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #42535d; border-top: 4px solid #c0ed46; border-radius: 8px; background: #202a31; }
.main { display: flex; min-height: 100px; }
.sport { flex: 0 0 12.3%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border-right: 1px solid #51636f; }
.sport-label { display: block; font-size: 14px; font-weight: 700; color: #b5c9d8; line-height: 1; }
.ball { position: relative; width: 44px; height: 44px; overflow: hidden; border-radius: 50%; background: #eef1f2; }
.ball::before, .ball::after, .ball-seam { position: absolute; content: ""; width: 35px; height: 43px; border: 2px solid #29353d; border-radius: 50%; }
.ball::before { left: -18px; top: -10px; transform: rotate(20deg); }
.ball::after { left: 20px; top: 6px; transform: rotate(-20deg); }
.ball-seam { left: -3px; top: 20px; width: 38px; height: 26px; transform: rotate(12deg); }
.team { flex: 1 1 0; display: flex; align-items: center; padding: 6px 6px 6px 15px; background: #28343e; }
.team + .team { border-left: 1px solid #536570; }
.tick { display: block; flex: 0 0 8px; height: 40px; background: #c0ed46; margin-right: 15px; }
.name { display: block; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 30px; line-height: 1; font-weight: 700; color: #fff; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.sets-track { flex: 0 0 15%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; }
.points-track { flex: 0 0 24%; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; margin-left: 6px; border-radius: 4px; background: #374853; }
.label { display: block; font-size: 13px; font-weight: 700; line-height: 1; color: #b7cbd9; }
.match-score, .primary-score { display: block; width: 100%; text-align: center; font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.primary-score { font-size: 44px; }
.set-footer { min-height: 34px; display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 1px solid #4b5e69; font-size: 16px; line-height: 1; font-weight: 700; color: #b7cbd9; }
.set-value { display: block; width: 28px; font-size: 24px; text-align: center; color: #fff; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 700px) {
  .stage { padding: 14px; }
  .main { flex-direction: column; }
  .sport { flex-basis: auto; min-height: 46px; flex-direction: row; gap: 11px; border-right: 0; border-bottom: 1px solid #4b5e69; }
  .ball { width: 26px; height: 26px; }
  .ball::before, .ball::after { width: 21px; height: 26px; border-width: 1.5px; }
  .ball::before { left: -11px; top: -6px; }
  .ball::after { left: 12px; top: 4px; }
  .ball-seam { left: -2px; top: 12px; width: 23px; height: 16px; border-width: 1.5px; }
  .team { flex-basis: auto; min-height: 70px; padding: 6px 6px 6px 12px; }
  .team + .team { border-left: 0; border-top: 1px solid #536570; }
  .tick { flex-basis: 7px; height: 36px; margin-right: 12px; }
  .name { font-size: 27px; }
  .sets-track { flex-basis: 58px; gap: 6px; }
  .points-track { flex-basis: 86px; margin-left: 4px; gap: 5px; }
  .label { font-size: 12px; }
  .match-score { font-size: 24px; }
  .primary-score { font-size: 36px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <div class="main rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="sport"><div class="ball" aria-hidden="true"><i class="ball-seam"></i></div><span class="sport-label">VOLLEYBALL</span></div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="sets-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">SETS</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="points-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">POINTS</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="sets-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">SETS</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="points-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">POINTS</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
