<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Lower Third — World Tour</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.flag:not([src]),.tlogo:not([src]){display:none}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isComplete[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isComplete[style*="opacity: 1"])>.isMatchPoint{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.meta{display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.meta>*{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta .sep{flex:0 0 auto;font-style:normal;padding:0 .45em;opacity:.55}
.meta .rd,.meta .bo{flex-shrink:0}
.meta .ev:empty+.s1,.meta .rd:empty+.s2,.meta .s1:has(+.rd:empty),.meta .s2:has(+.bo:empty){display:none}
.meta .ev:empty+.s1+.rd:empty+.s2{display:none}
.won{position:absolute;z-index:0}
.gs{position:relative;z-index:1}
.gtag .nx{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .now{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 6vh 6vw;pointer-events:none}
.board{position:relative;font-size:1.36vw;font-family:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#0d1b33;width:max-content;-webkit-font-smoothing:antialiased}
.grid{display:flex;align-items:stretch;border-radius:.3em;overflow:hidden;box-shadow:0 .45em 1.6em rgba(0,0,0,.45)}
.hd{display:flex;align-items:center;justify-content:center;height:1.8em;background:#e6ebf3;color:#4a5a78;font-size:1em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.gblock{display:block;width:6.4em;background:#0b3d91;color:#fff}
.gblock>*{flex-direction:column;gap:.1em;text-transform:uppercase;font-weight:800}
.gblock b{font-size:1em;letter-spacing:.14em;color:#a9c3ef;font-weight:800}
.now,.nx{display:flex;flex-direction:column;align-items:center;line-height:1}
.cg,.ng{font-size:3.3em;line-height:.95;font-variant-numeric:tabular-nums}
.vs{font-size:2.1em;letter-spacing:.06em;color:#a9c3ef}
.gblock:has(>.gtag[style*="opacity: 1"]) .vs,.gblock:has(>.fin[style*="opacity: 1"]) .vs{opacity:0}
.fin{background:#c8102e;line-height:1}
.fin span{font-size:2em;letter-spacing:.04em}
.fin b{color:#ffd0d8}
.players{display:flex;flex-direction:column;flex:0 0 25em;width:25em;background:#fff}
.mh{justify-content:flex-start;padding:0 .9em;color:#0d1b33}
.mh .meta{font-weight:800}
.teamlbl{display:none}
.mh:not(:has(.meta>:not(.sep):not(:empty))) .teamlbl{display:inline}
.board:not(:has(.tname:not(:empty))) .teamlbl{display:none!important}
.row{display:flex;align-items:center;gap:.6em;height:3.25em;padding-right:.6em;min-width:0}
.row+.row,.cell+.cell,.hc+.hc{border-top:1px solid #dfe4ec}
.kit{flex:0 0 .45em;align-self:stretch;background:#9aa3b2}
.flag{flex:0 0 auto;width:1.9em;height:1.27em;object-fit:cover;border-radius:.12em;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.who{display:flex;flex-direction:column;justify-content:center;flex:1 1 auto;min-width:0}
.name{font-size:1.3em;line-height:1.02;font-weight:800;text-transform:uppercase;overflow-wrap:normal;hyphens:none}
.team{display:flex;align-items:center;gap:.4em;min-width:0;font-size:1em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#4a5a78}
.tlogo{width:1.3em;height:1.3em;object-fit:contain;flex:0 0 auto}
.tname{min-width:0;line-height:1.05}
.tie{margin-left:auto;display:inline-flex;align-items:center;gap:.3em;flex:0 0 auto;padding:0 .45em;height:1.35em;border-radius:.2em;background:#0b3d91;color:#fff}
.tie i{font-style:normal;color:#a9c3ef;letter-spacing:.08em}
.team:not(:has(.tname:not(:empty))){display:none}
.who:has(.name:empty) .team{font-size:1.2em;color:#0d1b33}
.marks{display:flex;align-items:center;gap:.25em;flex:0 0 auto}
.to-slot{width:4.6em;height:1.45em}
.to-on,.to-used{border-radius:.2em;font-size:1em;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.to-on{background:#ffd23f;color:#111}
.to-used{box-shadow:inset 0 0 0 .1em #b4bfd0;color:#4a5a78}
.card-slot{width:.9em;height:1.3em}
.card{border-radius:.12em;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.yc{background:#ffd400}.rc{background:#e3262f}
.srv{width:1.45em;height:1.45em}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff9a3c 45%,#d65f00 100%);box-shadow:0 0 0 .1em rgba(0,0,0,.18)}
.win{border-radius:50%;background:#c8102e}
.win::after{content:"";width:.36em;height:.66em;margin-top:-.14em;border:solid #fff;border-width:0 .17em .17em 0;transform:rotate(45deg)}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:flex}
.hist{position:relative;display:flex;background:#f4f6fa}
.hcol{display:flex;flex-direction:column;width:2.6em;border-left:1px solid #dfe4ec}
.hc{position:relative;display:flex;align-items:center;justify-content:center;height:calc(3.25em / 1.2);font-size:1.2em;font-weight:800;font-variant-numeric:tabular-nums;color:#93a0b6}
.hc .won{inset:.3em .3em;border-radius:.2em;background:#dbe5f6}
.hc:has(.won[style*="opacity: 1"]){color:#0b3d91}
.hcol:not(:has(.won[style*="opacity: 1"])){position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap;padding:0!important;margin:0!important;border:0!important}
.col{display:flex;flex-direction:column}
.cell{display:flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.gcol{width:3.8em;background:#eef1f6;border-left:1px solid #dfe4ec}
.gcol .cell{font-size:1.6em;height:calc(3.25em / 1.6)}
.pcol{width:4.4em;background:#0b3d91;color:#fff}
.pcol .hd{background:#082d6c;color:#fff}
.pcol .cell{font-size:2.1em;height:calc(3.25em / 2.1)}
.pcol .cell+.cell{border-top:1px solid #2a5bb0}
.state{position:absolute;right:0;bottom:100%;width:11em;height:1.9em}
.st{border-radius:.3em .3em 0 0;font-size:1em;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.st-warm,.st-break{background:#0d1b33;color:#fff}
.st-gp{background:#ff9a3c;color:#111}
.st-mp{background:#c8102e;color:#fff}
/* final: games won becomes the result column; the last game's points fold into the ledger */
.board:has(.isComplete[style*="opacity: 1"]) .pcol{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important}
.board:has(.isComplete[style*="opacity: 1"]) .gcol{width:4.4em;background:#0b3d91;color:#fff}
.board:has(.isComplete[style*="opacity: 1"]) .gcol .hd{background:#082d6c;color:#fff}
.board:has(.isComplete[style*="opacity: 1"]) .gcol .cell{font-size:2.1em;height:calc(3.25em / 2.1)}
.board:has(.isAWinner[style*="opacity: 1"]) .gcol .b,.board:has(.isBWinner[style*="opacity: 1"]) .gcol .a{background:#e6ebf3;color:#7d8aa3}
.board:has(.isAWinner[style*="opacity: 1"]) .row.b,.board:has(.isBWinner[style*="opacity: 1"]) .row.a{color:#7d8aa3}
.board:has(.isAWinner[style*="opacity: 1"]) .row.b .flag,.board:has(.isBWinner[style*="opacity: 1"]) .row.a .flag{opacity:.5}

</style>
</head>
<body>
<main class="stage"><article class="board t-world" data-osb-component="layout"><span class="slot state"><span class="isWarmUpStarted st st-warm" data-osb-component="field" data-osb-field="isWarmUpStarted" style="opacity:0">Warm-up</span><span class="isInBetweenGames st st-break" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">Between games</span><span class="isGamePoint st st-gp" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">Game point</span><span class="isMatchPoint st st-mp" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">Match point</span></span><div class="grid" data-osb-component="layout"><div class="gblock slot" data-osb-component="layout"><span class="vs">VS</span><span class="isMatchStarted gtag" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0"><span class="now"><b>Game</b><span class="currentGame cg" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="nx"><b>Next</b><span class="nextGame ng" data-osb-component="field" data-osb-field="nextGame"></span></span></span><span class="isComplete fin" data-osb-component="field" data-osb-field="isComplete" style="opacity:0"><b>Match</b><span>Final</span></span></div><div class="players" data-osb-component="layout"><span class="hd mh"><span class="meta"><span class="eventName ev" data-osb-component="field" data-osb-field="eventName"></span><i class="sep s1">·</i><span class="matchRound rd" data-osb-component="field" data-osb-field="matchRound"></span><i class="sep s2">·</i><span class="matchFormatLabel bestOf bo" data-osb-component="field" data-osb-field="matchFormatLabel"></span></span><span class="teamlbl">Team match</span></span><div class="row rA a" data-osb-component="layout"><span class="jerseyColorA kit" data-osb-component="field" data-osb-field="jerseyColorA"></span><img class="countryA flag" data-osb-component="field" data-osb-field="countryA" alt=""><span class="who"><span class="combinedAName name" data-osb-component="field" data-osb-field="combinedAName"></span><span class="team"><img class="teamLogoURLA tlogo" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><span class="teamAName tname" data-osb-component="field" data-osb-field="teamAName"></span><span class="tie"><i>Tie</i><span class="teamAScore tscore" data-osb-component="field" data-osb-field="teamAScore">0</span></span></span></span><span class="marks"><span class="slot to-slot"><span class="isATimeOutActive to-on" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0">Time-out</span><span class="isATimeOutUsed to-used" data-osb-component="field" data-osb-field="isATimeOutUsed" style="opacity:0">T/O</span></span><span class="slot card-slot"><span class="isAYellowCarded card yc" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0"></span></span><span class="slot card-slot"><span class="isARedCarded card rc" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0"></span></span></span><span class="slot srv"><span class="isACurrentlyServing servingA ball" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity:0" isa="true"></span><span class="isAWinner win" data-osb-component="field" data-osb-field="isAWinner" style="opacity:0"></span></span></div><div class="row rB b" data-osb-component="layout"><span class="jerseyColorB kit" data-osb-component="field" data-osb-field="jerseyColorB"></span><img class="countryB flag" data-osb-component="field" data-osb-field="countryB" alt=""><span class="who"><span class="combinedBName name" data-osb-component="field" data-osb-field="combinedBName"></span><span class="team"><img class="teamLogoURLB tlogo" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""><span class="teamBName tname" data-osb-component="field" data-osb-field="teamBName"></span><span class="tie"><i>Tie</i><span class="teamBScore tscore" data-osb-component="field" data-osb-field="teamBScore">0</span></span></span></span><span class="marks"><span class="slot to-slot"><span class="isBTimeOutActive to-on" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0">Time-out</span><span class="isBTimeOutUsed to-used" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="opacity:0">T/O</span></span><span class="slot card-slot"><span class="isBYellowCarded card yc" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0"></span></span><span class="slot card-slot"><span class="isBRedCarded card rc" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0"></span></span></span><span class="slot srv"><span class="isBCurrentlyServing servingB ball" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"></span><span class="isBWinner win" data-osb-component="field" data-osb-field="isBWinner" style="opacity:0"></span></span></div></div><div class="hist" data-osb-component="layout"><div class="hcol isGame1Started" data-osb-component="layout" data-osb-field="isGame1Started" style="display:none"><span class="hd hl">G1</span><span class="hc a"><span class="isGame1AWon won" data-osb-component="field" data-osb-field="isGame1AWon" style="opacity:0"></span><span class="game1AScore gs" data-osb-component="field" data-osb-field="game1AScore">0</span></span><span class="hc b"><span class="isGame1BWon won" data-osb-component="field" data-osb-field="isGame1BWon" style="opacity:0"></span><span class="game1BScore gs" data-osb-component="field" data-osb-field="game1BScore">0</span></span></div><div class="hcol isGame2Started" data-osb-component="layout" data-osb-field="isGame2Started" style="display:none"><span class="hd hl">G2</span><span class="hc a"><span class="isGame2AWon won" data-osb-component="field" data-osb-field="isGame2AWon" style="opacity:0"></span><span class="game2AScore gs" data-osb-component="field" data-osb-field="game2AScore">0</spa osb-component="field" data-osb-field="game5BScore">0</span></span></div><div class="hcol isGame6Started" data-osb-component="layout" data-osb-field="isGame6Started" style="display:none"><span class="hd hl">G6</span><span class="hc a"><span class="isGame6AWon won" data-osb-component="field" data-osb-field="isGame6AWon" style="opacity:0"></span><span class="game6AScore gs" data-osb-component="field" data-osb-field="game6AScore">0</span></span><span class="hc b"><span class="isGame6BWon won" data-osb-component="field" data-osb-field="isGame6BWon" style="opacity:0"></span><span class="game6BScore gs" data-osb-component="field" data-osb-field="game6BScore">0</span></span></div><div class="hcol isGame7Started" data-osb-component="layout" data-osb-field="isGame7Started" style="display:none"><span class="hd hl">G7</span><span class="hc a"><span class="isGame7AWon won" data-osb-component="field" data-osb-field="isGame7AWon" style="opacity:0"></span><span class="game7AScore gs" data-osb-component="field" data-osb-field="game7AScore">0</span></span><span class="hc b"><span class="isGame7BWon won" data-osb-component="field" data-osb-field="isGame7BWon" style="opacity:0"></span><span class="game7BScore gs" data-osb-component="field" data-osb-field="game7BScore">0</span></span></div></div><div class="col gcol" data-osb-component="layout"><span class="hd">Games</span><span class="cell a"><span class="currentAMatchScore AScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span><span class="cell b"><span class="currentBMatchScore BScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span></div><div class="col pcol" data-osb-component="layout"><span class="hd">Points</span><span class="cell a"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><span class="cell b"><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span></div></div></article></main>
