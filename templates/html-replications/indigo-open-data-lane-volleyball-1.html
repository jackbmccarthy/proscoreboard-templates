<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Indigo Open Data Lane 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:"Arial Narrow",Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(92vw,1212px);max-width:100%;height:360px;overflow:hidden;border:2px solid #718f95;background:#1b2d3b;color:#f0f2ed;container-type:inline-size}
.head{display:flex;align-items:center;justify-content:space-between;flex:0 0 20%;min-width:0;padding:0 32px;border-bottom:2px solid #92b3b1}
.sport-tag,.set-status{display:block;overflow:hidden;font-size:clamp(17px,3.1cqw,42px);font-weight:500;letter-spacing:.05em;line-height:1;text-overflow:ellipsis;white-space:nowrap}
.set-status{display:flex;align-items:center;gap:.3em;letter-spacing:0}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.teams{display:flex;flex:1 1 0;min-height:0;flex-direction:column}
.team{display:flex;align-items:stretch;flex:1 1 0;min-height:0;min-width:0}
.team+.team{border-top:2px solid #92b3b1}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;flex:0 0 20px;align-self:stretch;margin:20px 0 20px 22px;background:#2eaff6}
.jerseyColorB{background:#ef3340}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;padding:0 30px;color:#f0f2ed;font-size:clamp(28px,5.5cqw,72px);font-stretch:condensed;font-weight:750;line-height:1.06;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.sets{display:flex;align-items:center;justify-content:center;flex:0 0 12%;min-width:0;flex-direction:column;gap:10px;color:#92b3b1;font-size:clamp(17px,2.1cqw,29px);font-weight:650;white-space:nowrap}
.set-score{display:block;max-width:100%;overflow:hidden;font-size:1.5em;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.numeric-rule{display:block;flex:0 0 2px;align-self:stretch;margin:16px 0;background:#92b3b1}
.points{display:flex;align-items:center;justify-content:center;flex:0 0 19%;min-width:0;flex-direction:column;gap:2px;color:#92b3b1;font-size:clamp(17px,2.1cqw,29px);font-weight:650;white-space:nowrap}
.score{display:block;max-width:100%;overflow:hidden;color:#fff;font-size:clamp(44px,7cqw,92px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;text-align:center;white-space:nowrap}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:8px}
 .board{width:100%;height:153px;border-width:1px}
 .head{flex-basis:23%;padding:0 10px;border-width:1px}
 .sport-tag,.set-status{font-size:clamp(11px,3cqw,16px)}
 .team+.team{border-width:1px}
 .identity{flex-basis:5px;margin:11px 0 11px 6px}
 .name{padding:0 8px;font-size:clamp(16px,5.5cqw,24px)}
 .sets{flex-basis:15%;gap:2px;font-size:clamp(9px,2.8cqw,13px)}
 .numeric-rule{flex-basis:1px;margin:8px 0}
 .points{flex-basis:20%;gap:1px;font-size:clamp(9px,2.8cqw,13px)}
 .score{font-size:clamp(24px,8.5cqw,38px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="head rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
  <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="sets" data-osb-component="layout"><span data-osb-component="text">SETS</span><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="numeric-rule" data-osb-component="layout"></span><div class="points" data-osb-component="layout"><span data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="sets" data-osb-component="layout"><span data-osb-component="text">SETS</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><span class="numeric-rule" data-osb-component="layout"></span><div class="points" data-osb-component="layout"><span data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
