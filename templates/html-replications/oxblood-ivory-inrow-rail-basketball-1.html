<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Oxblood Ivory In-Row Rail — Basketball compact</title>
<style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}.board{width:min(74vw,1420px);aspect-ratio:2.28;display:flex;flex-direction:column;overflow:hidden;border:3px solid #292a2b;border-radius:8px;background:#ece8e1;color:#1c1c1d;container-type:inline-size;font-variant-numeric:tabular-nums}.sport-tag{height:17%;min-height:0;display:flex;align-items:center;justify-content:center;border-bottom:3px solid #292a2b;font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:5.2cqw;font-weight:700;letter-spacing:.012em;white-space:nowrap}.teams{height:64%;min-height:0;display:flex;flex-direction:column}.team{flex:1 1 0;min-height:0;display:flex;align-items:stretch}.team+.team{border-top:3px solid #292a2b}.name-lane{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:5%;padding:0 2.3%;overflow:hidden}.identity{flex:none;align-self:center;width:1.6%;height:65%;background:#1e2021}.name{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:10.5cqw;line-height:1;font-weight:700;text-transform:uppercase;letter-spacing:.006em}.combinedAName:empty:before{content:"Team A"}.combinedBName:empty:before{content:"Team B"}.score-cell{flex:0 0 22.6%;display:flex;align-items:center;justify-content:center;min-width:0;border-left:3px solid #292a2b;background:#5a2b3a;color:#fff}.score{display:block;width:100%;overflow:hidden;white-space:nowrap;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:11.1cqw;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}.status{height:19%;min-height:0;display:flex;align-items:center;justify-content:space-evenly;border-top:3px solid #292a2b;font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:4.2cqw;white-space:nowrap}.stat{display:flex;align-items:baseline;gap:.5em;min-width:0}.stat-value{font-size:1.24em;font-variant-numeric:tabular-nums}.divider{height:65%;width:3px;background:#292a2b}.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}@media(max-width:520px){.stage{padding:5px}.board{width:100%;border-width:1px;border-radius:3px}.sport-tag,.team+.team,.score-cell,.status{border-width:1px}.divider{width:1px}.name-lane{gap:4%}.status{font-size:4.1cqw}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Basketball scoreboard">
<div class="sport-tag" data-osb-component="text">BASKETBALL</div>
<div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane" data-osb-component="layout"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="score-cell" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane" data-osb-component="layout"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="score-cell" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
</div>
<div class="status rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="stat" data-osb-component="layout"><span data-osb-component="text">CLOCK</span><span class="stat-value" data-osb-component="text" data-sport-stat="clock" data-osb-static="true">00:00</span></div><span class="divider" data-osb-component="layout"></span><div class="stat" data-osb-component="layout"><span data-osb-component="text">PERIOD</span><span class="stat-value" data-osb-component="text" data-sport-stat="period" data-osb-static="true">0</span></div><span class="divider" data-osb-component="layout"></span><div class="stat" data-osb-component="layout"><span data-osb-component="text">SHOT</span><span class="stat-value" data-osb-component="text" data-sport-stat="shot" data-osb-static="true">00</span></div></div>
<div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</article></main></body></html>
