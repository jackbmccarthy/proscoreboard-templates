<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Linen Navy Sideconsole 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.board{display:flex;width:min(96vw,1900px);aspect-ratio:1900/222;max-width:100%;overflow:hidden;border-radius:4px;background:#1f3242;color:#f8fafb;container-type:inline-size}
.console{flex:0 0 16%;min-width:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;padding:12px;background:#e7dfd0;color:#1f3242;text-align:center}
.sport-tag{display:block;max-width:100%;overflow:hidden;font-size:clamp(14px,1.7cqw,32px);font-weight:800;line-height:1.1;white-space:nowrap;text-overflow:ellipsis}
.console-rule{width:78%;height:2px;background:#99acb2}
.console-status{display:flex;align-items:center;flex-direction:column;gap:2px;font-size:clamp(12px,1.4cqw,27px);font-weight:800;line-height:1}
.current-set{font-size:clamp(28px,3.8cqw,72px);font-variant-numeric:tabular-nums}
.lanes{flex:1 1 0;min-width:0;display:flex}
.lane{flex:1 1 0;min-width:0;display:flex;align-items:stretch}
.lane+.lane{border-left:2px solid #526a79}
.identity{flex:0 0 18px;align-self:center;height:75%;background:#2685a5}
.jerseyColorB{background:#c96a60}
.name{flex:1 1 0;min-width:0;display:flex;align-items:center;overflow:hidden;padding:0 26px;font-size:clamp(23px,3.55cqw,68px);font-weight:700;white-space:nowrap;text-overflow:ellipsis}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support,.primary{align-self:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.support{width:14%;height:64%;background:#aebfc2;color:#1f3242}
.support-number{font-size:clamp(25px,3.65cqw,70px);font-weight:800;line-height:1}
.support-label{font-size:clamp(10px,1.3cqw,24px);font-weight:800;line-height:1}
.primary{width:25%;color:#f8fafb}
.primary-number{font-size:clamp(48px,5.6cqw,106px);font-weight:800;line-height:1}
.primary-label{font-size:clamp(11px,1.5cqw,28px);font-weight:800;letter-spacing:.03em;line-height:1}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.stage{padding:5px}.board{width:100%;height:95px;aspect-ratio:auto;border-radius:2px}.console{flex-basis:20%;gap:4px;padding:2px}.sport-tag{font-size:clamp(7px,1.9cqw,9px)}.console-rule{height:1px}.console-status{gap:0;font-size:clamp(7px,2.2cqw,10px)}.current-set{font-size:clamp(16px,5cqw,24px)}.lane+.lane{border-left-width:1px}.identity{flex-basis:4px}.name{padding:0 3px;font-size:clamp(9px,3.2cqw,14px)}.support{width:17%;height:67%}.support-number{font-size:clamp(14px,4.5cqw,20px)}.support-label{font-size:clamp(6px,1.7cqw,8px)}.primary{width:26%}.primary-number{font-size:clamp(23px,6.5cqw,31px)}.primary-label{font-size:clamp(6px,1.7cqw,8px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Horizontal volleyball scoreboard with manual scoring">
  <aside class="console columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><span class="console-rule" data-osb-component="layout"></span><div class="console-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></aside>
  <div class="lanes rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="support" data-osb-component="layout"><span class="support-number currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-label" data-osb-component="text">SETS</span></div><div class="primary" data-osb-component="layout"><span class="primary-number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-label" data-osb-component="text">POINTS</span></div></div>
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="support" data-osb-component="layout"><span class="support-number currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-label" data-osb-component="text">SETS</span></div><div class="primary" data-osb-component="layout"><span class="primary-number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-label" data-osb-component="text">POINTS</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
