<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Lower Third — Slant Rail</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 4.4vw 4.2vw;pointer-events:none}
.board{font-size:calc(100vw / 80);font-family:var(--font);color:var(--ink);display:flex;flex-direction:column;width:max-content;max-width:91vw;-webkit-font-smoothing:antialiased}
.head{display:flex;align-items:center;justify-content:space-between;gap:1.4em;height:2em;padding:0 .9em;font-size:.95em;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.status{display:flex;align-items:center;gap:.5em;flex:0 0 auto}
.gtag{display:inline-flex;align-items:center;gap:.3em;height:1.5em;padding:0 .6em;border-radius:.2em;font-size:.9em;font-weight:800;letter-spacing:.1em;white-space:nowrap}
.state{width:8.6em;height:1.5em}
.st{border-radius:.2em;font-size:.9em;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.main{display:flex;align-items:stretch}
.players{display:flex;flex-direction:column;flex:1 1 auto;min-width:22em}
.row{display:flex;align-items:center;gap:.6em;height:3.25em;padding:0 .7em 0 0;min-width:0}
.chip{flex:0 0 .45em;align-self:stretch;background:var(--chip-default,#8a96a3)}
.flag{flex:0 0 auto;width:2.1em;height:1.4em;object-fit:cover;border-radius:.12em;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.who{display:flex;flex-direction:column;justify-content:center;flex:1 1 auto;min-width:0}
.name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:1.4em;line-height:1.06;font-weight:800;letter-spacing:.01em;text-transform:uppercase;overflow-wrap:break-word}
.team{display:flex;align-items:center;gap:.4em;min-width:0;font-size:.9em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.tlogo{width:1.3em;height:1.3em;object-fit:contain}
.tname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tscore{padding:0 .4em;border-radius:.2em;background:rgba(255,255,255,.18);font-variant-numeric:tabular-nums}
.who:has(.name:empty) .team{font-size:1.2em;opacity:1}
.who:has(.name:empty) .tname{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.05}
.marks{display:flex;align-items:center;gap:.25em;flex:0 0 auto}
.to-slot{width:2.3em;height:1.35em}
.to-on,.to-used{border-radius:.2em;font-size:.82em;font-weight:900;letter-spacing:.04em}
.to-on{background:var(--to,#ffd23f);color:#111}
.to-used{border:.12em solid currentColor;opacity:.75}
.card-slot{width:.95em;height:1.35em}
.card{border-radius:.12em;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.yc{background:#ffd400}.rc{background:#e3262f}
.srv{flex:0 0 1.15em;display:flex;align-items:center;justify-content:center}
.srv-ball{display:block;width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--ball,#ff8a1c) 46%,var(--ball-edge,#d65f00) 100%);box-shadow:0 0 0 .14em rgba(0,0,0,.25)}
.scores{display:flex;align-items:stretch}
.col,.hcol{display:flex;flex-direction:column}
.cell,.hc{display:flex;align-items:center;justify-content:center;height:3.25em;font-variant-numeric:tabular-nums;font-weight:800;line-height:1}
.hcol{width:2.3em}
.hc>*{font-size:1.15em}
.gcol{width:3em}.gcol .cell>*{font-size:1.7em}
.pcol{width:3.7em}.pcol .cell>*{font-size:2.2em}
.meta{display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.meta>*{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta .sep{flex:0 0 auto;font-style:normal;padding:0 .5em;opacity:.55}
.meta .rd,.meta .bo{flex-shrink:0}
.meta .ev:empty+.s1,.meta .rd:empty+.s2,.meta .s1:has(+.rd:empty),.meta .s2:has(+.bo:empty){display:none}
.meta .ev:empty+.s1+.rd:empty+.s2{display:none}
.head:not(:has(.meta>:not(.sep):not(:empty))),.band:not(:has(.meta>:not(.sep):not(:empty))),.top:not(:has(.meta>:not(.sep):not(:empty))){display:none}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
.flag:not([src]),.tlogo:not([src]){display:none}
.team:not(:has(.tname:not(:empty))){display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.board:not(:has(.isInBetweenGames[style*="opacity: 1"])) .hcol:not([style*="display: none"]):not([style*="display:none"]):not(:has(~ .hcol:not([style*="display: none"]):not([style*="display:none"])))>*>*{opacity:.4}
.t-slant{--font:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;--ink:#fff;filter:drop-shadow(0 .35em .9em rgba(0,0,0,.45))}
.t-slant .main{background:#0b0b0d;clip-path:polygon(0 0,100% 0,calc(100% - 1.4em) 100%,0 100%);padding-right:1.4em}
.t-slant .row+.row,.t-slant .hc+.hc,.t-slant .cell+.cell{border-top:1px solid #26262b}
.t-slant .scores{transform:skewX(-12deg);margin-left:.6em}
.t-slant .scores .cell>*,.t-slant .scores .hc>*{display:inline-block;transform:skewX(12deg)}
.t-slant .hcol{color:#9b9ba6;border-left:1px solid #26262b}
.t-slant .gcol{background:#26262b;color:#fff;margin-left:.3em}
.t-slant .pcol{background:#ffcc00;color:#0b0b0d;margin-left:.3em}
.t-slant .pcol .cell+.cell{border-top:1px solid #d9ad00}
.t-slant .head{align-self:flex-start;margin-top:.3em;background:#ffcc00;color:#0b0b0d;clip-path:polygon(0 0,100% 0,calc(100% - .9em) 100%,0 100%);padding-right:1.6em}
.t-slant .head .meta .sep{opacity:.7}
.t-slant .gtag{background:#0b0b0d;color:#ffcc00}
.t-slant .st-warm,.t-slant .st-break{background:transparent;color:#0b0b0d;box-shadow:inset 0 0 0 .12em #0b0b0d}
.t-slant .st-gp{background:#0b0b0d;color:#ff9d3a}
.t-slant .st-mp{background:#e3262f;color:#fff}
.t-slant .st-final{background:#0b0b0d;color:#fff}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.isATimeOutActive.to-on,.isBTimeOutActive.to-on,.eventName.ev,.sep.s1,.matchRound.rd,.sep.s2,.matchFormatLabel.bestOf.bo,.isMatchStarted.gtag,.currentGame.cg,.isComplete.st.st-final,.isMatchPoint.st.st-mp,.isATimeOutUsed.to-used,.isBTimeOutUsed.to-used,.isGamePoint.st.st-gp,.isWarmUpStarted.st.st-warm,.isInBetweenGames.st.st-break{font-size:1.25vw!important}
/* end stream-size floor */

</style>
</head>
<body>
<main class="stage"><article class="board t-slant" data-osb-component="layout"><div class="main" data-osb-component="layout"><div class="players" data-osb-component="layout"><div class="row rA" data-osb-component="layout"><span class="jerseyColorA chip" data-osb-component="field" data-osb-field="jerseyColorA"></span><img class="countryA flag" data-osb-component="field" data-osb-field="countryA" alt=""><span class="who"><span class="combinedAName name" data-osb-component="field" data-osb-field="combinedAName"></span><span class="team"><img class="teamLogoURLA tlogo" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><span class="teamAName tname" data-osb-component="field" data-osb-field="teamAName"></span><span class="teamAScore tscore" data-osb-component="field" data-osb-field="teamAScore">0</span></span></span><span class="marks"><span class="slot to-slot"><span class="isATimeOutActive to-on" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0">T/O</span><span class="isATimeOutUsed to-used" data-osb-component="field" data-osb-field="isATimeOutUsed" style="opacity:0">T</span></span><span class="slot card-slot"><span class="isAYellowCarded card yc" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0"></span></span><span class="slot card-slot"><span class="isARedCarded card rc" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0"></span></span></span><span class="srv"><span class="isACurrentlyServing servingA srv-ball" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity:0" isa="true"></span></span></div><div class="row rB" data-osb-component="layout"><span class="jerseyColorB chip" data-osb-component="field" data-osb-field="jerseyColorB"></span><img class="countryB flag" data-osb-component="field" data-osb-field="countryB" alt=""><span class="who"><span class="combinedBName name" data-osb-component="field" data-osb-field="combinedBName"></span><span class="
