<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Cobalt Fog Leadchip 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(96vw,1260px);max-width:100%;aspect-ratio:4.1;overflow:hidden;border-radius:4px;background:#23394b;color:#f7faf9;container-type:inline-size}
.header{display:flex;align-items:center;flex:0 0 24%;min-width:0;padding:0 2%;border-bottom:1px solid #94a9b2}
.sport-tag{flex:0 1 auto;min-width:0;overflow:hidden;font-size:clamp(14px,3.3cqw,42px);font-weight:750;line-height:1;text-overflow:ellipsis;white-space:nowrap}
.status{display:flex;align-items:center;gap:.5em;flex:none;margin-left:6%;padding-left:3%;border-left:1px solid #94a9b2;color:#c9d7d7;font-size:clamp(12px,2.65cqw,34px);font-weight:700;line-height:1;white-space:nowrap}
.current-set{color:#f7faf9;font-variant-numeric:tabular-nums}
.lanes{display:flex;flex:1 1 0;min-height:0;flex-direction:column}
.lane{display:flex;align-items:stretch;flex:1 1 0;min-width:0;min-height:0}
.lane+.lane{border-top:1px solid #94a9b2}
.identity{display:block;flex:0 0 2.2%;align-self:stretch;background:#3186a8}
.jerseyColorB{background:#c76c69}
.support-track{display:flex;align-items:center;justify-content:center;flex:0 0 9.5%;min-width:0;flex-direction:column;align-self:stretch;gap:1px;margin:6px 0 6px 2%;border-radius:4px;background:#c9d7d7;color:#23394b;font-variant-numeric:tabular-nums}
.support-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(20px,4cqw,50px);font-weight:800;line-height:1}
.support-caption{display:block;max-width:100%;overflow:hidden;font-size:clamp(10px,1.8cqw,22px);font-weight:700;line-height:1;white-space:nowrap}
.name{display:block;align-self:center;flex:1 1 0;min-width:0;overflow:hidden;padding:0 3.3%;font-size:clamp(23px,4.6cqw,58px);font-weight:700;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.primary-track{display:flex;align-items:center;justify-content:center;flex:0 0 22.5%;min-width:0;gap:12%;align-self:stretch;margin:12px 0;border-left:1px solid #94a9b2;background:#23394b;color:#f7faf9;font-variant-numeric:tabular-nums;white-space:nowrap}
.primary-score{display:block;max-width:45%;overflow:hidden;font-size:clamp(36px,6.2cqw,78px);font-weight:800;line-height:1}
.primary-caption{display:block;max-width:50%;overflow:hidden;font-size:clamp(11px,2.1cqw,27px);font-weight:700;line-height:1}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:6px}
 .board{width:100%;height:176px;aspect-ratio:auto}
 .header{flex-basis:23%;padding:0 10px}
 .sport-tag{font-size:clamp(13px,4vw,20px)}
 .status{margin-left:12px;padding-left:12px;font-size:clamp(11px,3.2vw,16px)}
 .identity{flex-basis:6px}
 .support-track{flex-basis:17%;margin:4px 0 4px 6px;gap:0}
 .support-score{font-size:clamp(22px,6vw,32px)}
 .support-caption{font-size:clamp(9px,2.5vw,12px)}
 .name{padding:0 8px;font-size:clamp(16px,5vw,25px)}
 .primary-track{flex-basis:25%;gap:4px;margin:8px 0}
 .primary-score{font-size:clamp(25px,8vw,40px)}
 .primary-caption{font-size:clamp(8px,2.3vw,12px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="support-track" data-osb-component="layout"><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-caption" data-osb-component="text">SETS</span></div><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="primary-track" data-osb-component="layout"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption" data-osb-component="text">POINTS</span></div></div>
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="support-track" data-osb-component="layout"><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-caption" data-osb-component="text">SETS</span></div><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="primary-track" data-osb-component="layout"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption" data-osb-component="text">POINTS</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
