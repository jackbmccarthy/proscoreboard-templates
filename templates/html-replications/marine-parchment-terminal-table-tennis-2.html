<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Tennis Marine Parchment Terminal</title><style>*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{min-height:100vh;display:grid;place-items:center;padding:18px;font-family:Arial,Helvetica,sans-serif}
.board{--marine:#173947;--parchment:#ece5d7;--ink:#173947;width:min(924px,100%);display:flex;flex-direction:column;overflow:hidden;border-radius:5px;background:var(--marine);color:#f7f9f6}
.header{height:33px;flex:none;display:flex;align-items:center;justify-content:space-between;background:var(--parchment);color:var(--ink);padding:0 15px}
.sport-tag{font-size:21px;line-height:1;font-weight:800;letter-spacing:.015em;white-space:nowrap}
.point-slot{height:18px;min-width:0;display:flex;align-items:center;justify-content:flex-end;font-size:10px;font-weight:700;letter-spacing:.045em;color:#546b72}
.point-slot .point-state{white-space:nowrap;opacity:0}
.point-slot .isMatchPoint{position:absolute}
.point-slot:has(.isMatchPoint[style*="opacity: 1"]) .isGamePoint,.point-slot:has(.isMatchPoint[style*="opacity:1"]) .isGamePoint{opacity:0!important}
.lanes{display:flex;flex-direction:row;min-width:0}
.lane{height:74px;min-width:0;display:flex;align-items:center;flex:1 1 0;background:var(--marine)}
.lane+.lane{border-left:1px solid #a7b9bd}
.identity{display:block;align-self:stretch;flex:0 0 10px;background-color:#2f8eaa}
.side-b .identity{background-color:#cb746a}
.lane-name{min-width:0;flex:1 1 auto;display:flex;align-items:center;padding:0 18px;gap:10px}
.name{display:block;min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f7f9f6;font-size:31px;line-height:1.1;font-weight:700}
.side-a .name:empty::before{content:"Player A"}
.side-b .name:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:#ece5d7;opacity:0}
.support-track{height:100%;width:77px;flex:0 0 77px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--marine);color:#ece5d7}
.support-value{font-size:25px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.support-caption{margin-top:2px;font-size:11px;line-height:1;font-weight:700}
.divider{width:1px;height:62%;flex:0 0 1px;background:#8ba4aa;margin:0 9px}
.primary-track{height:calc(100% - 10px);width:90px;flex:0 0 90px;margin-right:5px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--parchment);color:var(--ink)}
.primary-value{max-width:100%;font-size:40px;line-height:.96;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.055em;white-space:nowrap}
.primary-caption{margin-top:3px;font-size:11px;line-height:1;font-weight:700}
@media(max-width:700px){body{padding:8px}.board{width:min(100%,590px)}.header{height:35px}.sport-tag{font-size:18px}.lanes{flex-direction:column}.lane{height:69px;flex:0 0 69px}.lane+.lane{border-left:0;border-top:1px solid #8ba4aa}.name{font-size:clamp(18px,5vw,29px)}.lane-name{padding:0 10px}.support-track{width:58px;flex-basis:58px}.support-value{font-size:24px}.support-caption,.primary-caption{font-size:9px}.divider{margin:0 5px}.primary-track{width:76px;flex-basis:76px}.primary-value{font-size:36px}}
@media(max-width:360px){.identity{flex-basis:7px}.lane-name{padding:0 7px;gap:5px}.support-track{width:49px;flex-basis:49px}.primary-track{width:68px;flex-basis:68px}.primary-value{font-size:32px}}
</style></head><body><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><header class="header"><span class="sport-tag">TABLE TENNIS</span><span class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span></header><div class="lanes rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><section class="lane side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA" style="background-color:#2f8eaa"></span><div class="lane-name"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity:0" isA="true"></span></div><div class="support-track"><span class="support-value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-caption">GAMES</span></div><span class="divider" aria-hidden="true"></span><div class="primary-track"><span class="primary-value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption">POINTS</span></div></section><section class="lane side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB" style="background-color:#cb746a"></span><div class="lane-name"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0" ></span></div><div class="support-track"><span class="support-value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-caption">GAMES</span></div><span class="divider" aria-hidden="true"></span><div class="primary-track"><span class="primary-value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption">POINTS</span></div></section></div></article></body></html>
