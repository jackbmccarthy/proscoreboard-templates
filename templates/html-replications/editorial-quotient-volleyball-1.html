<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editorial Quotient Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #231b17; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { display: flex; flex-direction: column; width: 100%; max-width: 1304px; padding: 18px 30px 27px; background: #fbf5ed; }
.title { font-size: 46px; font-weight: 500; letter-spacing: .13em; text-align: center; line-height: 1.3; padding-bottom: 13px; border-bottom: 2px solid #231b17; }
.team { display: flex; align-items: center; gap: 40px; height: 284px; padding: 18px 68px 20px 44px; }
.team + .team { border-top: 2px solid #231b17; }
.name { flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: "Times New Roman", Times, serif; font-size: 140px; font-weight: 700; font-style: italic; line-height: 1.1; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.score-track { flex: 0 0 276px; min-width: 0; display: flex; flex-direction: column; align-items: stretch; }
.sets-band { display: flex; align-items: center; justify-content: space-around; min-height: 53px; padding-bottom: 8px; }
.label { font-size: 28px; line-height: 1; font-weight: 600; letter-spacing: .11em; }
.match-score { width: 70px; flex: 0 0 70px; text-align: center; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.rule { display: block; width: 100%; height: 2px; flex: 0 0 2px; background: #231b17; }
.score { width: 100%; display: block; height: 143px; line-height: .9; text-align: center; font-family: "Times New Roman", Times, serif; font-size: 170px; font-weight: 700; font-variant-numeric: tabular-nums; color: #a74620; margin-top: 8px; }
.points-label { display: block; text-align: center; margin-top: 8px; }
.set-footer { display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 36px; line-height: 1; letter-spacing: .08em; font-weight: 600; padding-top: 17px; }
.set-value { display: block; width: 37px; text-align: center; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 1100px) {
  .name { font-size: clamp(40px, 10.5vw, 140px); }
  .team { padding-left: 24px; padding-right: 32px; }
}
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .board { padding: 16px; }
  .title { font-size: 23px; letter-spacing: .09em; padding-bottom: 12px; }
  .team { height: 180px; gap: 12px; padding: 12px 0; }
  .name { font-size: 38px; }
  .score-track { flex-basis: 110px; }
  .sets-band { min-height: 32px; padding-bottom: 7px; }
  .label { font-size: 13px; letter-spacing: .06em; }
  .match-score { width: 38px; flex-basis: 38px; font-size: 24px; }
  .score { height: 77px; font-size: 82px; margin-top: 8px; }
  .points-label { margin-top: 6px; }
  .set-footer { font-size: 22px; gap: 9px; padding-top: 10px; }
  .set-value { width: 24px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
        <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
          <div class="sets-band rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="label">SETS</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
          <span class="rule jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
          <span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="label points-label">POINTS</span>
        </div>
      </div>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
        <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
          <div class="sets-band rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="label">SETS</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
          <span class="rule jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
          <span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="label points-label">POINTS</span>
        </div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
