<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena Stack</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 28px 28px; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
    .osb { position: relative; display: grid; grid-template-columns: 1fr 172px; width: 740px; color: #f4f5f7; filter: drop-shadow(0 6px 16px #000a); }
    .ev { grid-column: 1 / -1; justify-self: start; display: flex; align-items: center; gap: 10px; padding: 5px 12px 4px; background: #12161c; border-radius: 5px 5px 0 0; font-size: 15px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: #cfd5dd; white-space: nowrap; }
    .ev .matchRound { color: #ffb020; }
    .teams { background: #12161c; border-radius: 0 0 0 6px; overflow: hidden; }
    .osb:not(:has(.ev .eventName:not(:empty))):not(:has(.ev .matchRound:not(:empty))) .teams { border-radius: 6px 0 0 6px; }
    .row { position: relative; display: grid; grid-template-columns: 10px 26px minmax(0, 1fr) 168px 96px; align-items: center; height: 62px; background: linear-gradient(90deg, #20262f, #151a21); }
    .row + .row { border-top: 1px solid #2c333e; }
    .kitw { align-self: stretch; display: flex; background: #c3c9d2; }
    .row.b .kitw { background: #5b6472; }
    .kit { flex: 1; background-color: transparent; }
    .poss { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; }
    .arrow { width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 11px solid #ffb020; }
    .nm { padding-right: 8px; font-size: 22px; font-weight: 700; line-height: 1.02; letter-spacing: .3px; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: normal; word-break: normal; hyphens: none; text-wrap: balance; }
    .info { position: relative; align-self: stretch; display: grid; grid-template-columns: 68px 1fr; grid-template-rows: 1fr 1fr; align-items: center; column-gap: 8px; padding: 6px 14px 6px 0; }
    .info > .bslot { grid-column: 1; grid-row: 1 / span 2; display: flex; align-items: center; justify-content: center; }
    .info > .tor, .info > .fl { grid-column: 2; justify-self: end; }
    .tor { display: flex; align-items: center; gap: 6px; }
    .cap { font-size: 16px; font-weight: 700; letter-spacing: 1px; color: #d3d9e1; }
    .pips { display: flex; gap: 4px; height: 7px; }
    .pip { width: 14px; height: 6px; border-radius: 1px; background: #ffb020; }
    .fl { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; letter-spacing: 1px; color: #d3d9e1; }
    .fl b { color: #fff; font-weight: 700; min-width: 9px; text-align: right; }
    .bonus { display: block; width: 68px; text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 1px; background: #ffb020; color: #12161c; padding: 5px 0 4px; border-radius: 3px; line-height: 1; }
    .bonus:empty { visibility: hidden; }
    .to { position: absolute; z-index: 2; top: 0; bottom: 0; left: 0; right: 0; flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px 0 14px; background: linear-gradient(90deg, #ffb020, #ffc247); color: #12161c; line-height: 1; }
    .row:has(.to[style*="opacity: 1"]) .nm { color: #ffc247; }
        .to-l { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    .to-c { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 24px; font-weight: 700; background: #12161c; color: #ffb020; padding: 4px 8px 2px; border-radius: 3px; font-variant-numeric: tabular-nums; }
    .pts { position: relative; z-index: 1; align-self: stretch; display: flex; align-items: center; justify-content: center; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 48px; font-weight: 700; background: #0a0c10; font-variant-numeric: tabular-nums; }
    .tower { position: relative; display: grid; background: #000; border-left: 3px solid #ffb020; border-radius: 0 6px 6px 0; overflow: hidden; }
    .tower > * { grid-area: 1 / 1; }
    .live { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding-top: 4px; }
    .top { display: flex; align-items: center; gap: 8px; }
    .per { font-size: 21px; font-weight: 700; letter-spacing: 1px; background: #f4f5f7; color: #111; padding: 2px 8px 1px; border-radius: 2px; }
    .per:empty { display: none; }
    .shot { position: relative; display: flex; align-items: center; gap: 6px; background: #d7263d; color: #fff; border-radius: 3px; padding: 2px 7px 1px; box-shadow: inset 0 0 0 1px #ff6b7a; }
    .shot[style*="opacity: 0"] { visibility: hidden; }
    .shot-l { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .shot-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 25px; font-weight: 700; min-width: 24px; text-align: right; font-variant-numeric: tabular-nums; }
    .run-shot { position: absolute; left: 4px; right: 4px; bottom: -5px; height: 2px; background: #ff6b7a; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 48px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .gc b { color: #ffb020; padding: 0 1px; }
    .prog { display: flex; gap: 4px; align-items: center; height: 9px; }
    .q { position: relative; width: 20px; height: 4px; background: #39404b; border-radius: 1px; }
    .q > span { position: absolute; inset: 0; background: #ffb020; border-radius: 1px; }
    .ot { width: 28px; height: 4px; margin-left: 2px; padding: 0; overflow: hidden; font-size: 16px; line-height: 4px; border-radius: 1px; background: #ff5a3d; color: transparent; }
    .runbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #ffb020; }
    .state { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; background: #ffb020; color: #111; }
    .st-s { font-size: 16px; font-weight: 700; letter-spacing: 3px; }
    .st-b { font-size: 40px; font-weight: 700; letter-spacing: 1px; margin-top: 3px; }
    .brk .half-t { font-size: 30px; }
    .fin { z-index: 2; background: #f4f5f7; }
    .fin .st-b { font-size: 44px; }
    .fin-ot { font-size: 16px; font-weight: 600; letter-spacing: 2px; margin-top: 4px; }
    .half-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .end-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .half-t { display: block; }
    .fin-ot { display: none; }
    .osb:has(.isGame5Started[style*="opacity: 1"]) .fin-ot { display: block; }
    .osb:has(.isComplete[style*="opacity: 1"]) .final-dim { opacity: .5; }
    .osb:has(.isComplete[style*="opacity: 1"]) .info > :not(.to) { visibility: hidden; }
    .tor:not(:has(.pip[style*="opacity: 1"])) { visibility: hidden; }
    .win { position: absolute; top: 0; right: 0; bottom: 0; width: 96px; background: #ffb020; }
    .row:has(> .win[style*="opacity: 1"]) .pts { background: transparent; color: #12161c; }
    .row:has(> .win[style*="opacity: 1"]) .nm { color: #fff; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .row.b :is(.nm, .pts), .osb:has(.isBWinner[style*="opacity: 1"]) .row.a :is(.nm, .pts) { color: #9aa3ae; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .row.b .kitw, .osb:has(.isBWinner[style*="opacity: 1"]) .row.a .kitw { opacity: .55; }
    .pips { gap: 0 !important; }
    .pips > [class*="TimeoutLeft"] { margin-right: 4px; }
    .pips > [style*="opacity: 0"] { width: 0 !important; margin: 0 !important; }
    .pips > .pip[style*="opacity: 0"] { display: none !important; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.ev-n.eventName,.ev-r.matchRound,.shot-l,.ot.isGame5Started,.bonus.bonusA,.bonus.bonusB{font-size:16px!important}
.arrow.isAPossession,.arrow.isBPossession{width:12px!important;height:16px!important;min-width:0!important;flex-shrink:0!important}
.pip.isATimeoutLeft1,.pip.isATimeoutLeft2,.pip.isATimeoutLeft3,.pip.isATimeoutLeft4,.pip.isATimeoutLeft5,.pip.isBTimeoutLeft1,.pip.isBTimeoutLeft2,.pip.isBTimeoutLeft3,.pip.isBTimeoutLeft4,.pip.isBTimeoutLeft5{width:14px!important;height:12px!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

  </style>
</head>
<body>
<article class="osb" aria-label="Basketball scorebug">
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="teams">
    <div class="row a"><span class="kitw"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><span class="poss final-dim"><span class="arrow isAPossession" data-osb-component="field" data-osb-field="isAPossession" style="opacity: 0;"></span></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="info"><span class="bslot"><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span></span><span class="tor final-dim"><span class="cap">TO</span><span class="pips"><span class="pip isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity: 0;"></span><span class="pip isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity: 0;"></span><span class="pip isATimeoutLeft3" data-osb-component="field" data-osb-field="isATimeoutLeft3" style="opacity: 0;"></span><span class="pip isATimeoutLeft4" data-osb-component="field" data-osb-field="isATimeoutLeft4" style="opacity: 0;"></span><span class="pip isATimeoutLeft5" data-osb-component="field" data-osb-field="isATimeoutLeft5" style="opacity: 0;"></span></span></span><span class="fl">FOULS <b class="teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</b></span><span class="to isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIMEOUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></span><span class="win isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity: 0;"></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
    <div class="row b"><span class="kitw"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><span class="poss final-dim"><span class="arrow isBPossession" data-osb-component="field" data-osb-field="isBPossession" style="opacity: 0;"></span></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="info"><span class="bslot"><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span></span><span class="tor final-dim"><span class="cap">TO</span><span class="pips"><span class="pip isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity: 0;"></span><span class="pip isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity: 0;"></span><span class="pip isBTimeoutLeft3" data-osb-component="field" data-osb-field="isBTimeoutLeft3" style="opacity: 0;"></span><span class="pip isBTimeoutLeft4" data-osb-component="field" data-osb-field="isBTimeoutLeft4" style="opacity: 0;"></span><span class="pip isBTimeoutLeft5" data-osb-component="field" data-osb-field="isBTimeoutLeft5" style="opacity: 0;"></span></span></span><span class="fl">FOULS <b class="teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</b></span><span class="to isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIMEOUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></span><span class="win isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity: 0;"></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
  </div>
  <div class="tower">
    <div class="live">
      <div class="top"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="shot isShotClockActive" data-osb-component="field" data-osb-field="isShotClockActive" style="opacity: 0;"><span class="shot-l">SHOT</span><span class="shot-v" data-osb-static="true" data-sport-stat="shotClock"></span><span class="run-shot isShotClockRunning" data-osb-component="field" data-osb-field="isShotClockRunning" style="opacity: 0;"></span></span></div>
      <span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span>
      <span class="prog"><span class="q"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span>
      <span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span>
    </div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="end-t st-s">END OF</span><span class="end-t st-b"><span class="periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span></span><span class="half-t st-b">HALFTIME</span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FINAL</span><span class="fin-ot">OVERTIME</span></div>
  </div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span><span class="timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span><span class="possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
