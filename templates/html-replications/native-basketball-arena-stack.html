<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena Stack</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 34px 24px 24px; font-family: "DIN Condensed", "DIN Alternate", "Arial Narrow", Arial, sans-serif; }
    .bug { position: relative; width: 460px; color: #f4f5f7; filter: drop-shadow(0 6px 14px #0008); }
    .bar { display: grid; grid-template-columns: 1fr 136px; background: #111419; border-radius: 6px 6px 0 0; overflow: hidden; }
    .row { position: relative; display: grid; grid-template-columns: 9px minmax(0, 1fr) auto 70px; align-items: center; height: 50px; background: linear-gradient(90deg, #1d222b, #13171d); }
    .row + .row { border-top: 1px solid #2a303a; }
    .kit { align-self: stretch; background-color: #59616e; }
    .nm { padding: 4px 10px 0 12px; font-size: 28px; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
    .tags { display: flex; gap: 5px; padding-right: 8px; align-items: center; }
    .bonus { font-size: 11px; letter-spacing: 1px; background: #ffb020; color: #111; padding: 4px 5px 1px; border-radius: 2px; }
    .bonus:empty { display: none; }
    .tol { font-size: 13px; color: #9aa3af; letter-spacing: 1px; padding-top: 3px; }
    .tol::before { content: "TOL "; }
    .tol-v { color: #f4f5f7; }
    .tol:has(.tol-v:empty) { display: none; }
    .pts { align-self: stretch; display: flex; align-items: center; justify-content: center; padding-top: 5px; font-size: 40px; background: #0a0c10; font-variant-numeric: tabular-nums; }
    .clk { display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; border-left: 3px solid #ffb020; }
    .gc { font-size: 50px; line-height: 1; padding-top: 6px; font-variant-numeric: tabular-nums; }
    .colon { font-weight: 400; color: #ffb020; }
    .sub { display: flex; gap: 6px; margin-top: 5px; }
    .per { font-size: 17px; background: #f4f5f7; color: #111; padding: 4px 8px 1px; border-radius: 2px; }
    .per:empty { display: none; }
    .shot { font-size: 19px; color: #ffb020; border: 1px solid #ffb020; padding: 3px 6px 0; border-radius: 2px; min-width: 32px; text-align: center; }
    .shot:has(.sc-v:empty) { display: none; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #1b2028; padding: 6px 12px 3px; border-radius: 0 0 6px 6px; font-size: 14px; letter-spacing: 1.5px; color: #aab2bd; }
    .fl { color: #fff; margin-left: 5px; }
    .mid { display: flex; align-items: center; gap: 10px; }
    .pips { display: flex; gap: 4px; align-items: center; }
    .pip { position: relative; width: 20px; height: 5px; background: #39404b; border-radius: 1px; }
    .pip-on { position: absolute; inset: 0; background: #ffb020; border-radius: 1px; }
    .pip.pip-ot { width: auto; height: auto; padding: 2px 3px 0; font-size: 10px; background: #ffb020; color: #111; }
    .poss { color: #f4f5f7; }
    .poss::before { content: "POSS "; color: #aab2bd; }
    .poss:has(.poss-v:empty) { display: none; }
    .to-flag { position: absolute; inset: 0; align-items: center; justify-content: center; gap: 10px; background: #ffb020; color: #111; font-size: 24px; letter-spacing: 3px; padding-top: 4px; }
    .brk { position: absolute; left: 0; top: -26px; background: #ffb020; color: #111; font-size: 15px; letter-spacing: 3px; padding: 5px 10px 2px; border-radius: 3px 3px 0 0; }
    .ev { position: absolute; right: 0; top: -24px; display: flex; gap: 8px; font-size: 13px; letter-spacing: 1.5px; color: #f4f5f7; text-shadow: 0 1px 3px #000; text-transform: uppercase; }
    .ev-round { color: #ffb020; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="bug" aria-label="Basketball scorebug">
  <span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
  <div class="bar">
    <div class="teams">
      <div class="row"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="tags"><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span><span class="tol"><span class="tol-v timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span></span></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><div class="to-flag isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
      <div class="row"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="tags"><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span><span class="tol"><span class="tol-v timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span></span></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><div class="to-flag isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
    </div>
    <div class="clk"><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><div class="sub"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="shot"><span class="sc-v" data-osb-static="true" data-sport-stat="shotClock"></span></span></div></div>
  </div>
  <div class="foot"><span>FOULS<span class="fl teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</span></span><span class="mid"><span class="pips"><span class="pip"><span class="pip-on isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="pip"><span class="pip-on isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="pip pip-ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span><span class="poss"><span class="poss-v possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span></span></span><span>FOULS<span class="fl teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</span></span></div>
  <span class="brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">BREAK</span>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><span class="possession" data-osb-component="field" data-osb-field="possession"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
