<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indigo Pearl Namebed basketball 2</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#292f4b}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.board{width:min(60vw,1100px);max-width:100%;border-radius:4px;overflow:hidden;box-shadow:none;font-variant-numeric:tabular-nums}
.header{height:clamp(40px,3vw,55px);display:flex;align-items:center;gap:14px;min-width:0;padding:0 18px;background:#dfe6e8;border-bottom:1px solid #aebdca}
.sport{flex:1 1 auto;min-width:0;margin:0;font-size:clamp(18px,1.45vw,28px);line-height:1;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.utility{display:flex;align-items:center;justify-content:flex-end;gap:11px;min-width:0;white-space:nowrap}
.status{display:flex;align-items:baseline;gap:5px;font-size:clamp(11px,.95vw,18px);line-height:1;color:#292f4b}
.status+.status{border-left:1px solid #aebdca;padding-left:11px}
.status-value{font-size:clamp(16px,1.3vw,24px);font-weight:800}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{height:clamp(100px,7.5vw,144px);min-width:0;display:flex;align-items:stretch;background:#292f4b}
.lane+.lane{border-top:1px solid #aebdca}
.identity-tick{flex:0 0 5px;align-self:stretch;background:#3184a9}
.side-b .identity-tick{background:#c87175}
.namebed{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:7px 20px}
.name{display:block;flex:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f8faf9;font-size:clamp(34px,2.7vw,52px);line-height:1.08;font-weight:700}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support{display:flex;align-items:baseline;gap:8px;min-width:0;color:#f8faf9}
.support-label{font-size:clamp(11px,1vw,18px);line-height:1;font-weight:700;letter-spacing:.04em}
.support-value{font-size:clamp(19px,1.5vw,28px);line-height:1;font-weight:700;white-space:nowrap}
.scorecap{flex:0 0 19%;width:19%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px 3px;background:#dfe6e8;border-left:1px solid #aebdca}
.score{display:block;width:100%;min-width:0;overflow:visible;text-align:center;white-space:nowrap;color:#292f4b;font-size:clamp(58px,4.4vw,82px);line-height:1;font-weight:800;letter-spacing:-.035em}
.score-label{display:block;text-align:center;color:#292f4b;font-size:clamp(11px,.95vw,18px);line-height:1;font-weight:800;letter-spacing:.015em}
.horizontal{width:min(88vw,1580px)}
.horizontal .lanes{flex-direction:row;gap:5px;background:transparent}
.horizontal .lane{flex:1 1 0;min-width:0;border-top:0}
.horizontal .lane+.lane{border-left:0}
.horizontal .scorecap{flex-basis:20%;width:20%}
.retained{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){
.stage{padding:5px}
.board,.horizontal{width:100%}
.header{height:27px;padding:0 8px;gap:4px}
.sport{font-size:10px}
.utility{gap:4px}
.status{font-size:7px;gap:2px}
.status+.status{padding-left:4px}
.status-value{font-size:9px}
.horizontal .lanes{flex-direction:column;gap:1px}
.lane,.horizontal .lane{height:72px}
.namebed{padding:5px 10px;gap:3px}
.name{font-size:22px}
.support-label{font-size:9px}
.support-value{font-size:15px}
.scorecap,.horizontal .scorecap{flex-basis:22%;width:22%}
.score{font-size:32px;letter-spacing:-.045em}
.score-label{font-size:8px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer horizontal basketball" data-osb-component="layout"><header class="header rowContainer" data-osb-component="layout"><h1 class="sport" data-osb-component="text">BASKETBALL</h1><div class="utility rowContainer" data-osb-component="layout"><span class="status" data-osb-component="text"><span>CLOCK</span><strong class="status-value" data-osb-static="true" data-sport-stat="game-clock">00:00</strong></span><span class="status" data-osb-component="text"><span>PERIOD</span><strong class="status-value" data-osb-static="true" data-sport-stat="period">0</strong></span><span class="status" data-osb-component="text"><span>SHOT</span><strong class="status-value" data-osb-static="true" data-sport-stat="shot-clock">00</strong></span></div></header><div class="lanes rowContainer" data-osb-component="layout"><section class="lane side-a rowContainer" data-osb-component="layout"><span class="identity-tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="namebed columnContainer" data-osb-component="layout"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="support rowContainer" data-osb-component="layout"><span class="support-label" data-osb-component="text">FOULS</span><span class="support-value" data-osb-component="text" data-osb-static="true" data-sport-stat="fouls-a">0</span></div></div><div class="scorecap columnContainer" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="score-label" data-osb-component="text">POINTS</span></div></section><section class="lane side-b rowContainer" data-osb-component="layout"><span class="identity-tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="namebed columnContainer" data-osb-component="layout"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="support rowContainer" data-osb-component="layout"><span class="support-label" data-osb-component="text">FOULS</span><span class="support-value" data-osb-component="text" data-osb-static="true" data-sport-stat="fouls-b">0</span></div></div><div class="scorecap columnContainer" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="score-label" data-osb-component="text">POINTS</span></div></section></div><div class="retained" aria-hidden="true"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">Game point</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">Match point</span></div></div></article></main></body></html>
