<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Limestone Inset Subscore 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(96vw,1590px);max-width:100%;aspect-ratio:7.8;overflow:hidden;border:2px solid #aeb9b5;border-radius:8px;background:#ebe9e2;color:#243941;container-type:inline-size}
.pair{display:flex;flex:1 1 0;min-width:0;min-height:0}
.side{display:flex;align-items:stretch;flex:1 1 0;min-width:0}
.side+.side{border-left:2px solid #aeb9b5}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;align-self:stretch;flex:0 0 18px;margin:20px 0 20px 24px;background:#32777e}
.jerseyColorB{background:#32777e}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;padding:0 28px;color:#243941;font-size:clamp(27px,3.7cqw,62px);font-weight:700;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.sets{display:flex;align-items:center;justify-content:center;flex:0 0 13.5%;min-width:0;flex-direction:column;gap:3px;margin:18px 0;background:#365d67;color:#fff;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sets-label{display:block;max-width:100%;overflow:hidden;font-size:clamp(12px,1.4cqw,23px);font-weight:700;line-height:1}
.set-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(32px,3.7cqw,60px);font-weight:800;line-height:1;text-align:center}
.points{display:flex;align-items:center;justify-content:space-evenly;flex:0 0 31%;min-width:0;gap:9px;color:#243941}
.points-label{display:block;min-width:0;overflow:hidden;font-size:clamp(12px,1.55cqw,25px);font-weight:650;text-overflow:ellipsis;white-space:nowrap}
.score{display:block;max-width:50%;overflow:hidden;font-size:clamp(55px,6.8cqw,105px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;text-align:center;white-space:nowrap}
.baseline{display:flex;align-items:center;justify-content:space-between;flex:0 0 26%;min-width:0;padding:0 28px;border-top:2px solid #aeb9b5;color:#243941;font-size:clamp(17px,2.1cqw,33px);font-weight:700;line-height:1;white-space:nowrap}
.sport-tag{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-status{display:flex;align-items:center;gap:.3em}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){
 .stage{padding:6px}
 .board{width:100%;height:112px;aspect-ratio:auto;border-width:1px;border-radius:3px}
 .side+.side,.baseline{border-width:1px}
 .identity{flex-basis:4px;margin:13px 0 13px 5px}
 .name{padding:0 5px;font-size:clamp(12px,3.8cqw,17px)}
 .sets{flex-basis:17%;gap:2px;margin:10px 0}
 .sets-label{font-size:clamp(7px,2cqw,10px)}
 .set-score{font-size:clamp(19px,5.5cqw,27px)}
 .points{flex-basis:34%;gap:1px}
 .points-label{font-size:clamp(7px,1.9cqw,10px)}
 .score{max-width:55%;font-size:clamp(24px,6.6cqw,31px)}
 .baseline{padding:0 8px;font-size:clamp(11px,3.2cqw,14px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Horizontal volleyball scoreboard with generic manual scoring">
  <div class="pair rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <div class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="sets" data-osb-component="layout"><span class="sets-label" data-osb-component="text">SETS</span><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="points" data-osb-component="layout"><span class="points-label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
   <div class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="sets" data-osb-component="layout"><span class="sets-label" data-osb-component="text">SETS</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="points" data-osb-component="layout"><span class="points-label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
  </div>
  <div class="baseline rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
