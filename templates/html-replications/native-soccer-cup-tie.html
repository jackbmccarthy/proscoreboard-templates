<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cup Tie</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 50px 28px; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    .osb { position: relative; width: 1000px; margin: 0 auto; color: #fff; filter: drop-shadow(0 8px 18px #000a); }
    .ev { display: flex; justify-content: center; gap: 14px; width: fit-content; max-width: 760px; margin: 0 auto; padding: 7px 24px 6px; white-space: nowrap; background: #c9a227; color: #14110a; border-radius: 6px 6px 0 0; font-size: 15px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
    .ev .eventName { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .bar { display: grid; grid-template-columns: minmax(0, 1fr) 200px minmax(0, 1fr); height: 76px; background: linear-gradient(#1c2130, #0d1018); border-top: 3px solid #c9a227; }
    .pl { position: relative; display: grid; grid-template-columns: 14px minmax(0, 1fr); align-items: center; min-width: 0; }
    .pl.B { grid-template-columns: minmax(0, 1fr) 14px; }
    .pl.B > .kitw { order: 2; }
    .kitw { align-self: stretch; display: flex; background: #c3cad6; }
    .pl.B > .kitw { background: #5f6b80; }
    .kit { flex: 1; background-color: transparent; }
    .nmw { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 0 24px; min-width: 0; }
    .pl.B .nmw { flex-direction: row-reverse; }
    .nm { min-width: 0; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 30px; font-weight: 700; line-height: 1.02; letter-spacing: .5px; text-transform: uppercase; text-align: right; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: normal; word-break: normal; hyphens: none; text-wrap: balance; }
    .pl.B .nm { text-align: left; }
    .sc { display: flex; align-items: center; justify-content: center; gap: 14px; background: #fff; color: #0d1018; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 50px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sc b { font-size: 30px; color: #8b93a3; }
    .tabw { position: relative; width: 280px; margin: 0 auto; }
    .tab { display: grid; width: 280px; height: 48px; background: #0d1018; border-radius: 0 0 8px 8px; overflow: hidden; }
    .tab > * { grid-area: 1 / 1; }
    .live { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .dot { width: 13px; height: 13px; color: #ff2d48; filter: drop-shadow(0 0 4px #ff2d48); }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .per { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #c9a227; }
    .add { position: absolute; left: 100%; top: 0; display: flex; align-items: center; height: 34px; padding: 0 12px; background: #c9a227; color: #0d1018; border-radius: 0 0 6px 0; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 22px; font-weight: 700; }
    .runbar { position: absolute; left: 30px; right: 30px; bottom: 0; height: 2px; background: #c9a227; }
    .mp { display: flex; gap: 2px; }
    .h { position: relative; width: 12px; height: 4px; background: #3a4152; }
    .h > span { position: absolute; inset: 0; background: #c9a227; }
    .et { width: 6px; height: 4px; background: #fff; }
    .state { z-index: 1; display: flex; align-items: center; justify-content: center; gap: 10px; line-height: 1; background: #c9a227; color: #14110a; }
    .st-b { font-size: 24px; font-weight: 800; letter-spacing: 3px; }
    .b-ht { font-size: 0; } .brk .b-ht::after { content: "HALF TIME"; font-size: 24px !important; letter-spacing: 3px; }
    .b-ft::after { content: " · EXTRA TIME NEXT"; font-size: 15px; letter-spacing: 2px; }
    .pens { z-index: 2; background: #fff; color: #0d1018; }
    .st-s { font-size: 15px; font-weight: 800; letter-spacing: 3px; }
    .st-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 28px; font-weight: 700; }
    .st-v b { padding: 0 4px; }
    .fin { z-index: 3; background: #e3262e; color: #fff; }
    .cards { display: flex; gap: 4px; flex: 0 0 auto; }
    .yc, .rc { display: flex; align-items: center; justify-content: center; width: 18px; height: 24px; border-radius: 2px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 14px; font-weight: 700; line-height: 1; box-shadow: 0 1px 2px #0006; }
    .yc { background: #ffd21f; color: #2a2300; }
    .rc { background: #e3262e; color: #fff; }
    .yc[style*="opacity: 0"], .rc[style*="opacity: 0"] { width: 0; margin-left: -4px; }
    .brk .b-ft, .brk .b-eh, .brk .b-aet { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]) .brk .b-ht { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .b-ft { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .brk .b-eh { display: inline; }
    .osb:has(.isGame4Started[style*="opacity: 1"]) .brk .b-aet { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]) .brk .b-ft { display: none; }
    .add-v:empty::before { content: "+0"; }
    .dot i { display: block; width: 100%; height: 100%; border-radius: 50%; background: currentColor; animation: osb-pulse 1.6s ease-in-out infinite; }
    @keyframes osb-pulse { 50% { opacity: .35; } }
    .osb:has(.isComplete[style*="opacity: 1"]) .dot i { animation: none; }
    .win { position: absolute; left: 14px; right: 14px; bottom: 0; height: 5px; background: #c9a227; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .pl.B .nmw, .osb:has(.isBWinner[style*="opacity: 1"]) .pl.A .nmw { opacity: .45; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.fpens{white-space:nowrap}
.fpens:not([style*="opacity: 1"]){display:none}
.fin:has(.isDecidedOnPenalties[style*="opacity: 1"]) .st-b::after{content:none}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.ev-n.eventName,.ev-r.matchRound,.per.periodLabel,.st-s,.st-b::after,.cn.yellowCardsA,.cn.redCardsA,.cn.yellowCardsB,.cn.redCardsB{font-size:16px!important}
.dot.isMatchStarted>i,.et.isGame3Started,.et.isGame4Started{width:12px!important;height:12px!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

  </style>
</head>
<body>
<article class="osb" aria-label="Soccer lower third">
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="bar">
    <div class="pl A"><span class="kitw"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><span class="win isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity: 0;"></span><span class="nmw"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="cards"><span class="yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span></span></span></div>
    <div class="sc"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b>-</b><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
    <div class="pl B"><span class="kitw"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><span class="win isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity: 0;"></span><span class="nmw"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="cards"><span class="yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span></span></span></div>
  </div>
  <div class="tabw"><div class="tab">
    <div class="live"><span class="dot isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"><i></i></span><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="mp"><span class="h"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="h"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="et isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span><span class="et isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="st-b b-ht">HT</span><span class="st-b b-ft">FT</span><span class="st-b b-eh">ET HT</span><span class="st-b b-aet">AET</span></div>
    <div class="state pens isShootoutActive" data-osb-component="field" data-osb-field="isShootoutActive" style="opacity: 0;"><span class="st-s">PENS</span><span class="st-v"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span><b>-</b><span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span></span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FT<span class="isDecidedOnPenalties fpens" data-osb-component="field" data-osb-field="isDecidedOnPenalties" style="opacity:0"> (<span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span>-<span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span> PENS)</span></span></div>
  </div><span class="add addedTimeVisible" data-osb-component="field" data-osb-field="addedTimeVisible" style="opacity: 0;"><span class="add-v addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="homeSide" data-osb-component="field" data-osb-field="homeSide"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
