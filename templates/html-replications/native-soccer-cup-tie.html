<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cup Tie</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px; font-family: "Optima", "Candara", "Segoe UI", sans-serif; }
    .wrap { position: relative; display: inline-flex; flex-direction: column; align-items: center; filter: drop-shadow(0 8px 18px #000a); }
    .ev { display: flex; gap: 14px; padding: 4px 26px; background: linear-gradient(90deg, #b8913e, #e8c36a, #b8913e); color: #3d0a14; font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 100%, 0 100%); }
    .ev:has(.eventName:empty):has(.matchRound:empty) { display: none; }
    .row { display: flex; align-items: center; height: 64px; background: linear-gradient(180deg, #7a1426, #3d0a14); border-top: 2px solid #e8c36a; border-bottom: 2px solid #e8c36a; color: #fff6e0; }
    .team { display: flex; align-items: center; gap: 12px; width: 330px; padding: 0 18px; }
    .team.a { justify-content: flex-end; }
    .ribbon { position: relative; flex: 0 0 auto; width: 10px; height: 44px; background: #5a1020; }
    .kit { position: absolute; inset: 0; }
    .nm { min-width: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 13px; height: 19px; border-radius: 2px; font-size: 10px; font-weight: 700; }
    .card.red { background: #e5262b; color: #fff; }
    .card.yellow { background: #f7d117; color: #3d0a14; }
    .capsule { display: flex; align-items: center; gap: 16px; height: 78px; padding: 0 26px; margin: -8px 0; background: #fff6e0; color: #3d0a14; border: 3px solid #e8c36a; border-radius: 40px; box-shadow: 0 0 0 3px #3d0a14; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .capsule .dash { width: 10px; height: 4px; background: #b8913e; }
    .clock { position: relative; display: flex; align-items: center; gap: 10px; align-self: stretch; padding: 0 18px; background: #3d0a14; border-left: 2px solid #e8c36a; }
    .gc { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .added { color: #e8c36a; font-size: 18px; font-weight: 700; }
    .added:has(.at:empty) { display: none; }
    .half { min-width: 28px; padding: 1px 6px; text-align: center; border: 1px solid #e8c36a; border-radius: 10px; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #e8c36a; }
    .half:empty { display: none; }
    .live { width: 7px; height: 7px; border-radius: 50%; background: #e8c36a; animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .ht { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #e8c36a; color: #3d0a14; font-size: 22px; font-weight: 700; letter-spacing: 3px; }
    .pens { display: none; align-items: center; gap: 12px; margin-top: 4px; padding: 3px 18px; background: #3d0a14; border: 1px solid #e8c36a; border-radius: 12px; color: #fff6e0; font-size: 18px; font-weight: 700; }
    .pens-l { font-size: 12px; letter-spacing: 3px; color: #e8c36a; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="wrap" aria-label="Soccer lower third">
  <span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
  <div class="row">
    <span class="team a"><span class="card yellow isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="card red isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="ribbon"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span></span>
    <span class="capsule"><span class="sa currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b class="dash"></b><span class="sb currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span>
    <span class="team b"><span class="ribbon"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="card yellow isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="card red isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span></span>
    <span class="clock"><span class="live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="added addedTimeVisible"><span class="at addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="half periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="ht isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">HT</span></span>
  </div>
  <span class="pens shootoutAttempts"><b class="pens-l">PENS</b><span class="pen-a shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore"></span><b class="pens-d">-</b><span class="pen-b shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore"></span></span>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
