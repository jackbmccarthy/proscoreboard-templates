<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volleyball Attack Line</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing{animation:none!important;transition:none!important}}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.02}
.vball{display:block;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 14%,transparent 34%),conic-gradient(from 30deg,#ffd23f 0 120deg,#2a5bd7 0 240deg,#f6f7fb 0);box-shadow:inset 0 0 0 .12rem #0006,0 0 .4rem #0006}
.sslot{align-items:center}.sslot>.st{display:flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap;height:100%}
.pslot>.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hist:not(:has(>[style*="opacity: 1"])){display:none}
.board:has(.isComplete[style*="opacity: 1"]) .srv[style*="opacity: 1"]{opacity:.3!important;filter:grayscale(1)}
.pip{position:relative;display:block}.pip>.lit{position:absolute;inset:0;border-radius:inherit}

.stage{position:fixed;left:3.2rem;top:5.6rem}
.board{position:relative;width:68rem;font-family:"DIN Condensed","Bahnschrift SemiBold Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;color:#fff;filter:drop-shadow(0 .4rem 1rem #0008)}
.bar{display:flex;align-items:stretch;height:6.6rem;background:#1b1d22}
.side{position:relative;flex:1;min-width:0;display:flex;align-items:stretch}
.sB{flex-direction:row-reverse}
.chip{width:1rem;flex:none}
.who{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.45rem;padding:.4rem 1rem 0}
.sB .who{align-items:flex-end;text-align:right}
.nm{font-size:2.4rem;font-weight:700;text-transform:uppercase}
.pips{display:flex;gap:.35rem}.pip{width:1.9rem;height:.6rem;border-radius:.1rem;background:#ffffff2e}.pip>.lit{background:#ffcc00}
.srv{width:2.8rem;flex:none;display:flex;align-items:center;justify-content:center}.vball{width:2.1rem;height:2.1rem}
.sets{width:4rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.4rem;background:#24272e;border-left:.1rem solid #ffffff14;border-right:.1rem solid #ffffff14;color:#ffcc00;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.8rem;font-weight:700}
.pts{width:6.6rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.4rem;background:#2f333b;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4.3rem;font-weight:700}
.mid{width:10rem;flex:none;display:flex;flex-direction:column;align-items:stretch;justify-content:center;background:#ffcc00;color:#1b1d22}
.sslot{height:100%}.sslot>.st{flex-direction:column;gap:0;padding-top:.3rem;font-size:1.8rem;letter-spacing:.06em;line-height:1;text-align:center;white-space:normal;background:#ffcc00}.sslot>.sset .num{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:3.1rem;font-weight:700;display:block}
.sslot>.sdec{background:#ff5a1f;color:#fff;font-size:1.9rem}.sslot>.sbrk{background:#3b3f48;color:#fff}.sslot>.sbrk .num{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.7rem;display:block}.sslot>.sfin{background:#fff;font-size:2.5rem}
.tob{position:absolute;bottom:100%;display:flex;align-items:center;gap:.6rem;height:2.8rem;padding:.3rem 1rem 0;background:#ffcc00;color:#1b1d22;font-size:1.7rem;letter-spacing:.05em;white-space:nowrap}.sA .tob{left:0}.sB .tob{right:0}.tob em{font-style:normal}.tob b{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.1rem}
.under{display:flex;align-items:stretch;justify-content:space-between;height:3rem;background:#111317;font-size:1.6rem}
.ctx{display:flex;align-items:center;gap:.6rem;padding:.3rem 1.1rem 0;color:#a7adb8;white-space:nowrap;overflow:hidden;min-width:0;letter-spacing:.05em;text-transform:uppercase}.ctx .sep{font-style:normal;color:#ffcc00}
.hist{display:flex;align-items:center}
.hc{display:flex;align-items:center;gap:.3rem;padding:.3rem .8rem 0;color:#d9dce2;border-left:.1rem solid #ffffff1c}.hc .hl{font-weight:400;color:#7d8491;margin-right:.3rem}.hc .num{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:1.8rem}.hc .hd{font-style:normal;color:#7d8491}
.hist>.hc[style*="opacity: 1"]:not(:has(~.hc[style*="opacity: 1"])){color:#ffcc00}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .hist>.hc,.board:has(.isComplete[style*="opacity: 1"]) .hist>.hc{color:#fff!important}
.pslot{position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:.5rem}.pt{height:3rem;padding:.3rem 1.3rem 0;font-size:1.9rem;letter-spacing:.08em;background:#ffcc00;color:#1b1d22}.pt.mp{background:#e8202a;color:#fff}
</style>
</head>
<body>
<main class="stage"><section class="board" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="bar" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="side sA" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="who"><span class="nm clamp2 combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="pips"><i class="pip"><b class="lit isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity:0"></b></i></span></span><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="vball"></i></span><span class="sets num setsWonA currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="pts num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="tob isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="tclock num timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</b></span></div><div class="mid" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="slot sslot"><span class="st sset">SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sdec isDecidingSet" data-osb-component="field" data-osb-field="isDecidingSet" style="opacity:0">DECIDING SET</span><span class="st sbrk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">END SET <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sfin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">FINAL</span></span></div><div class="side sB" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="who"><span class="nm clamp2 combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="pips"><i class="pip"><b class="lit isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity:0"></b></i><i class="pip"><b class="lit isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity:0"></b></i></span></span><span class="srv isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"><i class="vball"></i></span><span class="sets num setsWonB currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="pts num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="tob isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="tclock num timeOutTimerB" data-osb-component="field" data-osb-field="timeOutTimerB">0</b></span></div></div>
<div class="under" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="ctx"><span class="eventName" data-osb-component="field" data-osb-field="eventName"></span><i class="sep">&middot;</i><span class="matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><div class="hist" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="hc  isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><b class="hl">S1</b><span class="ha num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span><i class="hd">-</i><span class="hb num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="hc  isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><b class="hl">S2</b><span class="ha num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span><i class="hd">-</i><span class="hb num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="hc  isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><b class="hl">S3</b><span class="ha num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span><i class="hd">-</i><span class="hb num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="hc  isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><b class="hl">S4</b><span class="ha num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span><i class="hd">-</i><span class="hb num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="hc  isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><b class="hl">S5</b><span class="ha num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span><i class="hd">-</i><span class="hb num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></div></div>
<span class="slot pslot"><span class="pt gp isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">SET POINT</span><span class="pt mp isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><span class="osb-core-fields"><span class="num timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA">0</span><span class="num timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB">0</span></span></section></main>
</body>
</html>
