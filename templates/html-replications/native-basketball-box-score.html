<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Box Score</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
    .osb { position: relative; width: 1160px; padding: 40px 48px 44px; border-radius: 14px; background: radial-gradient(ellipse at top, #1d2f50, #0b1424 75%); color: #e8edf5; box-shadow: 0 20px 50px #000c; }
    .head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px; padding-bottom: 16px; border-bottom: 3px solid #f08a24; }
    .ev { display: flex; flex-direction: column; gap: 4px; }
    .ev .eventName { font-size: 44px; font-weight: 700; line-height: 1.02; letter-spacing: .5px; text-transform: uppercase; }
    .ev .matchRound { font-size: 20px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #f08a24; }
    .status { display: grid; min-width: 270px; height: 84px; border-radius: 8px; overflow: hidden; background: #0a1220; border: 1px solid #2a3c5c; }
    .status > * { grid-area: 1 / 1; }
    .live { position: relative; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 0 18px; }
    .per { font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 26px; font-weight: 700; color: #0a1220; background: #f08a24; padding: 2px 10px 1px; border-radius: 4px; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .gc b { color: #f08a24; padding: 0 1px; }
    .runbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #f08a24; }
    .state { z-index: 1; display: flex; align-items: center; justify-content: center; gap: 12px; line-height: 1; background: #f08a24; color: #0a1220; }
    .st-s { font-size: 20px; font-weight: 700; letter-spacing: 3px; }
    .st-b { font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 42px; font-weight: 700; }
    .fin { z-index: 2; background: #e8edf5; }
    .fin-ot { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    table { width: 100%; margin-top: 20px; border-collapse: separate; border-spacing: 0 10px; }
    thead th { padding: 0 0 2px; font-size: 18px; font-weight: 700; letter-spacing: 2px; color: #a9b8d1; text-align: center; }
    thead th.tmh { text-align: left; padding-left: 24px; min-width: 290px; }
    .r { background: #142540; }
    .tm { position: relative; display: grid; grid-template-columns: 14px minmax(0, 1fr) 34px; align-items: center; height: 122px; text-align: left; }
    .tochip { align-items: center; gap: 8px; height: 24px; padding: 0 8px; border-radius: 3px; background: #f08a24; color: #0a1220; font-size: 16px; font-weight: 800; letter-spacing: 1.5px; }
    .tochip .timeoutClock { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
    .kitw { align-self: stretch; display: flex; background: #b9c3d3; border-radius: 6px 0 0 6px; }
    .r.B .kitw { background: #5d6c86; }
    .kit { flex: 1; background-color: transparent; border-radius: 6px 0 0 6px; }
    .nmw { display: flex; flex-direction: column; gap: 8px; padding: 0 18px; min-width: 0; }
    .nm { font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 34px; font-weight: 700; line-height: 1; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; text-wrap: balance; overflow: hidden; overflow-wrap: normal; word-break: normal; hyphens: none; }
    .sub { display: flex; align-items: center; gap: 16px; height: 24px; font-size: 17px; font-weight: 700; letter-spacing: 1.5px; color: #b3c0d6; }
    .tor { display: flex; align-items: center; gap: 7px; }
    .pips { display: flex; gap: 5px; }
    .pip { width: 14px; height: 14px; border-radius: 50%; background: #f08a24; box-shadow: inset 0 0 0 2px #ffb15e; }
    .fl b { color: #fff; margin-left: 4px; }
    .bonus { font-weight: 700; font-size: 12px; letter-spacing: 1.5px; color: #0a1220; background: #f08a24; padding: 2px 6px 1px; border-radius: 2px; }
    .bonus:empty { display: none; }
    .poss { display: flex; justify-content: center; }
    .arrow { width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 14px solid #f08a24; }
    .c { width: 104px; text-align: center; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 46px; font-weight: 700; color: #e8edf5; font-variant-numeric: tabular-nums; border-left: 1px solid #1f3457; }
    .c .v { justify-content: center; }
    .dash { display: none; }
    .c:has(.v[style*="opacity: 1"]) .dash { display: none; }
    .otc { width: 108px; }
    .c.otc:not(:has(.v[style*="opacity: 1"])), th.oth { display: none; }
    .osb:has(.r.A .otc.o5 .v[style*="opacity: 1"]) th.oth.o5, .osb:has(.r.A .otc.o6 .v[style*="opacity: 1"]) th.oth.o6 { display: table-cell; }
    .tot { position: relative; width: 156px; text-align: center; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 66px; font-weight: 700; color: #0a1220; background: #f08a24; border-radius: 0 6px 6px 0; font-variant-numeric: tabular-nums; }
    .foot { display: flex; justify-content: space-between; margin-top: 10px; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #8fa1bf; text-transform: uppercase; }
    .foot .shot { position: relative; display: flex; gap: 8px; }
    .foot .shot-v { color: #fff; }
    .run-shot { position: absolute; left: 0; right: 0; bottom: -4px; height: 2px; background: #f08a24; }
    .prog { display: flex; align-items: center; gap: 4px; }
    .q { position: relative; width: 22px; height: 5px; background: #2a3c5c; }
    .q > span { position: absolute; inset: 0; background: #f08a24; }
    .ot { font-size: 11px; padding: 1px 4px; line-height: 1; background: #f08a24; color: #0a1220; }
    .half-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .end-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .half-t { display: block; }
    .fin-ot { display: none; }
    .osb:has(.isGame5Started[style*="opacity: 1"]) .fin-ot { display: block; }
    .osb:has(.isComplete[style*="opacity: 1"]) .final-dim { opacity: .5; }
    .osb:has(.isComplete[style*="opacity: 1"]) .sub > :not(.win) { display: none; }
    .tor:not(:has(.pip[style*="opacity: 1"])) { display: none; }
    .osb:has(.isComplete[style*="opacity: 1"]) .sub.final-dim { opacity: 1; }
    .win { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 1px 10px 0; border-radius: 3px; background: #f08a24; color: #0a1220; font-size: 17px; font-weight: 700; letter-spacing: 2px; }
    .win[style*="opacity: 0"] { display: none; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .r.B :is(.nm, .c), .osb:has(.isBWinner[style*="opacity: 1"]) .r.A :is(.nm, .c) { color: #95a5c0; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .r.B .kitw, .osb:has(.isBWinner[style*="opacity: 1"]) .r.A .kitw { opacity: .45; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .r.B .tot, .osb:has(.isBWinner[style*="opacity: 1"]) .r.A .tot { background: #33415c; color: #9fadc5; }
    .pips { gap: 0 !important; }
    .pips > [class*="TimeoutLeft"] { margin-right: 4px; }
    .pips > [style*="opacity: 0"] { width: 0 !important; margin: 0 !important; }
    .pips > .pip[style*="opacity: 0"] { display: none !important; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.fl,.teamFoulsA,.teamFoulsB,.ot.isGame5Started,.shot.isShotClockActive,.bonus.bonusA,.bonus.bonusB{font-size:16px!important}
/* end stream-size floor */

  </style>
</head>
<body>
<article class="osb" aria-label="Basketball box score">
  <div class="head">
    <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
    <div class="status">
      <div class="live"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
      <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="end-t st-s">END OF</span><span class="end-t st-b"><span class="periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span></span><span class="half-t st-b">HALFTIME</span></div>
      <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FINAL</span><span class="fin-ot">OVERTIME</span></div>
    </div>
  </div>
  <table>
    <thead><tr><th class="tmh">TEAM</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th class="oth o5">OT1</th><th class="oth o6">OT2</th><th>T</th></tr></thead>
    <tbody><tr class="r A"><th class="tm"><span class="kitw"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><span class="nmw"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="sub final-dim"><span class="tor"><span>TO</span><span class="pips"><span class="pip isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity: 0;"></span><span class="pip isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity: 0;"></span><span class="pip isATimeoutLeft3" data-osb-component="field" data-osb-field="isATimeoutLeft3" style="opacity: 0;"></span><span class="pip isATimeoutLeft4" data-osb-component="field" data-osb-field="isATimeoutLeft4" style="opacity: 0;"></span><span class="pip isATimeoutLeft5" data-osb-component="field" data-osb-field="isATimeoutLeft5" style="opacity: 0;"></span></span></span><span class="fl">FOULS <b class="teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</b></span><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span><span class="win isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity: 0;">WINNER</span><span class="tochip isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></span></span><span class="poss final-dim"><span class="arrow isAPossession" data-osb-component="field" data-osb-field="isAPossession" style="opacity: 0;"></span></span></th><td class="c"><span class="dash">&ndash;</span><span class="v isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"><span class="game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span></td><td class="c"><span class="dash">&ndash;</span><span class="v isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"><span class="game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span></td><td class="c"><span class="dash">&ndash;</span><span class="v isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"><span class="game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span></td><td class="c"><span class="dash">&ndash;</span><span class="v isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"><span class="game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span></td><td class="c otc o5"><span class="v isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;"><span class="game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span></td><td class="c otc o6"><span class="v isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="display: none; opacity: 0;"><span class="game6AScore" data-osb-component="field" data-osb-field="game6AScore">0</span></span></td><td class="tot"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></td></tr><tr class="r B"><th class="tm"><span class="kitw"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><span class="nmw"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="sub final-dim"><span class="tor"><span>TO</span><span class="pips"><span class="pip isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity: 0;"></span><span class="pip isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity: 0;"></span><span class="pip isBTimeoutLeft3" data-osb-component="field" data-osb-field="isBTimeoutLeft3" style="opacity: 0;"></span><span class="pip isBTimeoutLeft4" data-osb-component="field" data-osb-field="isBTimeoutLeft4" style="opacity: 0;"></span><span class="pip isBTimeoutLeft5" data-osb-component="field" data-osb-field="isBTimeoutLeft5" style="opacity: 0;"></span></span></span><span class="fl">FOULS <b class="teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</b></span><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span><span class="win isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity: 0;">WINNER</span><span class="tochip isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></span></span><span class="poss final-dim"><span class="arrow isBPossession" data-osb-component="field" data-osb-field="isBPossession" style="opacity: 0;"></span></span></th><td class="c"><span class="dash">&ndash;</span><span class="v isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"><span class="game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></td><td class="c"><span class="dash">&ndash;</span><span class="v isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"><span class="game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></td><td class="c"><span class="dash">&ndash;</span><span class="v isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"><span class="game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></td><td class="c"><span class="dash">&ndash;</span><span class="v isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"><span class="game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></td><td class="c otc o5"><span class="v isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;"><span class="game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></td><td class="c otc o6"><span class="v isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="display: none; opacity: 0;"><span class="game6BScore" data-osb-component="field" data-osb-field="game6BScore">0</span></span></td><td class="tot"><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></td></tr></tbody>
  </table>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span><span class="timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span><span class="possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
