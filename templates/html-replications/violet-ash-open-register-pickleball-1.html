<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleball — Violet Ash Open Register Scorebug</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--ash:#e7e8ec;--ink:#28323d;--rule:#b4bfc4;display:flex;flex-direction:column;width:min(56.8vw,1105px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:3px;background:var(--ash);color:var(--ink);container-type:inline-size}
.sport-line{position:relative;display:flex;flex:0 0 auto;height:7cqw;align-items:center;padding:0 3.3cqw;border-bottom:1px solid var(--rule);font-size:3.55cqw;line-height:1;font-weight:700;white-space:nowrap}
.rows{display:flex;flex:1 1 auto;min-width:0;flex-direction:column}
.row{display:flex;flex:1 1 50%;min-width:0;min-height:13.5cqw;align-items:stretch}
.row+.row{border-top:1px solid var(--rule)}
.identity-wrap{display:flex;flex:0 0 4.2%;align-items:center;justify-content:center;padding:1.35cqw 0}
.identity{display:block;flex:0 0 1.1cqw;width:1.1cqw;height:100%;min-width:5px;background:#2677a8}
.jerseyColorB{background:#c45f66}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:1cqw;padding:0 .9cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.65cqw;line-height:1.04;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .6cqw;width:.6cqw;height:.6cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--ink)}
.register{display:flex;flex:0 0 18%;width:18%;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:.7cqw;padding:.5cqw .7cqw;background:var(--ash)}
.support,.primary{display:flex;flex:0 0 auto;width:100%;min-width:0;align-items:center;justify-content:space-between}
.caption{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:2.15cqw;line-height:1;font-weight:700}
.support-score,.primary-score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.support-score{font-size:3.05cqw}.primary-score{font-size:6.3cqw}
.point-slot{position:absolute;right:2%;top:0;width:22%;height:100%;font-size:1.2cqw;font-weight:700;text-align:center}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ash)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.sport-line{height:37px;padding:0 9px;font-size:16px}.row{min-height:84px}.identity-wrap{flex-basis:6px;padding:7px 0}.identity{flex-basis:5px;width:5px}.name-lane{gap:3px;padding:0 7px}.name{font-size:19px}.serve{flex-basis:6px;width:6px;height:6px}.register{flex-basis:28%;width:28%;gap:3px;padding:3px}.caption{font-size:8px}.support-score{font-size:13px}.primary-score{font-size:32px}.point-slot{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sport-line"><span>PICKLEBALL</span><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div><div class="rows columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="register"><div class="support"><span class="caption">GAMES</span><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="primary"><span class="caption">POINTS</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="register"><div class="support"><span class="caption">GAMES</span><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="primary"><span class="caption">POINTS</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></div></div></article></main></body></html>
