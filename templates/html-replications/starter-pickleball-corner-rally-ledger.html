de:95%;descent-override:25%;line-gap-override:0%}
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
i,em,b{font-style:normal}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1;position:relative}
[aria-hidden="true"]{visibility:hidden!important}
.isMatchPoint[style*="opacity: 1"],.isAMatchPoint[style*="opacity: 1"],.isBMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.15)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isAGamePoint,.isBGamePoint,.isAMatchPoint,.isBMatchPoint,.isACurrentlyServing,.isBCurrentlyServing{animation:none!important;transition:none!important}}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}

/* ---------- rally ledger: charcoal slab, lime rally accents, every finished game kept in its own column ---------- */
.board{
  --fc:"OSB Barlow Condensed",Arial,sans-serif;--fn:"OSB Barlow",Arial,sans-serif;
  --bg:#15181d;--bg2:#1d2128;--rail:#0b0d10;--lime:#c6f03a;--ink:#101317;--txt:#f3f5f7;--dim:#c2c9d4;--line:#2a2f38;--amber:#ffb020;--red:#ff3b4f;
  --rh:5rem;--hh:3.6rem;--fh:4rem;--cw:2.8rem;--lw:calc(var(--cw) * 2);--gw:3.8rem;--sw:3.2rem;--pw:5rem;
  position:relative;display:flex;flex-direction:column;width:max-content;min-width:34rem;
  font-family:var(--fc);color:var(--txt);background:var(--bg);border-radius:.45rem;overflow:hidden;box-shadow:0 .5rem 1.4rem #000a}
.board:has(.sn.isDoubles[style*="opacity: 1"]){--sw:6.8rem}
.stage{position:fixed;left:3.2rem;top:3.2rem}

/* header */
.head{display:flex;align-items:stretch;height:var(--hh);background:var(--rail);font-size:1.6rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.sslot{flex:none}
.st{display:flex;align-items:center;justify-content:center;gap:0;padding:0 .8rem;white-space:nowrap}
.sslot>.st{background:var(--bg2);color:var(--dim)}
.sslot>.swarm{background:var(--amber);color:var(--ink)}
.sslot>.sgame,.sslot>.scur,.sslot>.sbrk,.sslot>.sfin{background:var(--lime);color:var(--ink)}
.sslot>.scur{gap:.45rem}
.lv{display:inline-flex;align-items:center;height:2.2rem;padding:0 .4rem;border-radius:.3rem;background:var(--ink);color:var(--lime);font-size:1.6rem}
.ctx{flex:1 0 auto;display:flex;align-items:center;padding:0 .9rem;color:var(--dim);font-weight:600}
.cw{display:flex;align-items:center;white-space:nowrap}
.cw>.rd::before{content:"\00b7";margin:0 .45rem;color:var(--lime)}
.cw>.ev:empty+.rd::before{display:none}
.rlab{flex:none;display:flex;align-items:center;color:var(--dim);font-size:1.6rem;letter-spacing:.04em;text-align:center}
.lled{display:flex;width:var(--lw);justify-content:flex-start}
.hcl{width:var(--cw);flex:none}
.lg{width:var(--gw)}.lsv{width:var(--sw)}.lp{width:var(--pw)}

/* rows */
.r{position:relative;display:flex;align-items:stretch;height:var(--rh);background:var(--bg)}
.rB{border-top:.15rem solid var(--line)}
.chip{width:.7rem;flex:none;background:#2a5bd7}
.rB .chip{background:#e3262f}
.who{flex:1 0 auto;display:flex;align-items:center;gap:.5rem;padding:0 1rem 0 1.1rem}
.nm{font-size:2.4rem;font-weight:700;line-height:1;white-space:nowrap;color:#fff}
.cards{position:relative;flex:none;width:2.2rem;height:2.6rem}
.card{position:absolute;top:.18rem;display:block;width:1.6rem;height:2.4rem;border-radius:.2rem;box-shadow:0 0 0 .12rem #0006}
.yc{left:0;background:#ffd200}
.rc{left:0;background:#e3262f}
.cards:has(>.yc[style*="opacity: 1"])>.rc{left:.6rem}
.card:not([style*="opacity: 1"]){display:none}
.cards:not(:has(>.card[style*="opacity: 1"])){visibility:hidden}
/* timeout chips: two short lines, so the reserved slot stays narrow */
.toslot{flex:none;justify-items:start;align-items:center;height:3rem}
.tob,.tou{display:grid;grid-auto-flow:column;align-items:center;gap:.5rem;height:3.2rem;padding:0 .6rem;border-radius:.35rem;font-weight:700;line-height:1;white-space:nowrap}
.tob{grid-auto-flow:column;gap:.45rem;height:3rem;padding:0 .6rem;background:var(--amber);color:var(--ink);font-size:1.6rem;letter-spacing:.04em}
.tob .tclock{font-family:var(--fn);font-size:1.8rem;letter-spacing:0}
.tou{grid-auto-flow:column;gap:.35rem;padding:0 .6rem;height:3rem;background:#e9edf2;color:var(--ink);font-size:1.6rem;letter-spacing:.06em;text-align:center}
.tob:not([style*="opacity: 1"]):not(.tsz),.tou:not([style*="opacity: 1"]){visibility:hidden}

/* ledger: finished games only (the game in play is the points cell) */
.led{flex:none;width:var(--lw);display:flex;align-items:center;justify-content:flex-start}
.hc{width:var(--cw);flex:none;display:grid;place-items:center}
.hc:not([style*="opacity: 1"]){display:none}
.hv{position:relative;display:inline-grid;place-items:center;width:2.5rem;height:2.9rem;border-radius:.3rem;box-shadow:inset 0 0 0 .14rem #4a515c}
.hv>*{grid-area:1/1}
.hv>.w{align-self:stretch;justify-self:stretch;border-radius:.3rem;background:var(--lime)}
.hv>.num{position:relative;font-family:var(--fn);font-size:1.8rem;font-weight:700;color:var(--dim)}
.hv:has(>.w[style*="opacity: 1"]){box-shadow:none}
.hv:has(>.w[style*="opacity: 1"])>.num{color:var(--ink)}

/* score columns */
.setc{flex:none;width:var(--gw);display:flex;align-items:center;justify-content:center;gap:.8rem;background:var(--bg2)}
.sets{font-family:var(--fn);font-size:2.9rem;font-weight:700;color:var(--lime);line-height:1}
.sv{flex:none;width:var(--sw);place-items:center;background:var(--bg2)}
.srv{display:flex;align-items:center;gap:.5rem}
.pball{display:block;width:2.4rem;height:2.4rem;border-radius:50%;background:radial-gradient(circle at 30% 34%,#0005 0 8%,transparent 9%),radial-gradient(circle at 64% 30%,#0005 0 8%,transparent 9%),radial-gradient(circle at 52% 64%,#0005 0 8%,transparent 9%),radial-gradient(circle at 24% 72%,#0004 0 6%,transparent 7%),radial-gradient(circle at 78% 70%,#0004 0 6%,transparent 7%),radial-gradient(circle at 36% 30%,#fbffb4,#d8f22c 60%,#a6c214);box-shadow:0 0 0 .15rem #0b1a12}
.sn{display:inline-grid;place-items:center;min-width:2.6rem;height:2.6rem;padding:0 .4rem;border-radius:.35rem;background:var(--lime);color:var(--ink);font-family:var(--fn);font-size:1.8rem;font-weight:700;line-height:1}
.sn:not([style*="opacity: 1"]){display:none}
.sn>i{grid-area:1/1}
.sn:has(>.isSecondServer[style*="opacity: 1"])>.one,.cn:has(>.isSecondServer[style*="opacity: 1"])>.one{opacity:0}
.pts{flex:none;width:var(--pw);position:relative;display:grid;place-items:center;background:#f4f6f8;color:var(--ink)}
.rB .pts{border-top:.15rem solid #d5dae1}
.pts>*{grid-area:1/1}
.spt{align-self:stretch;justify-self:stretch;display:block}
.sgp{background:var(--amber)}
.smp{background:var(--red)}
.pv{position:relative;font-family:var(--fn);font-size:3.5rem;font-weight:700;line-height:1}
.pts:has(>.smp[style*="opacity: 1"])>.pv{color:#fff}
.pts:has(>.smp[style*="opacity: 1"])>.sgp{opacity:0!important}

/* footer: score call | match format under the score columns */
.foot{display:flex;align-items:stretch;height:var(--fh);font-size:1.8rem;background:var(--rail);border-top:.15rem solid var(--line)}
.fl{flex:1 0 auto;display:flex;align-items:center;padding:0 1.1rem 0 1.8rem}
.cl{display:flex;align-items:center;gap:.6rem;font-size:1.6rem;font-weight:700;letter-spacing:.06em;color:var(--dim)}
.call{display:inline-flex;align-items:center;gap:.15rem;font-family:var(--fn);font-size:2.2rem;letter-spacing:0;color:#fff}
.call .ca{order:1}.call .d1{order:2}.call .cb{order:3}.call .dbl{order:4;display:inline-flex;align-items:center}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .ca{order:3}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .cb{order:1}
.call .dbl:not([style*="opacity: 1"]){display:none}
.d1,.d2{padding:0 .1rem}
.cn{position:relative;display:inline-grid}.cn>i{grid-area:1/1}
.rfoot{flex:none;width:calc(var(--lw) + var(--gw) + var(--sw) + var(--pw));display:flex;align-items:center;justify-content:flex-end;padding-right:1.4rem;color:var(--dim);font-size:1.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}

/* game / match point label: attached to the side holding it (A in the header over its score, B in the footer under its score) */
.board:has(>.tie:not(:has(>.teamAName[style*="display: none"]))){--tieh:4rem}
.pt{justify-content:center;padding:0 .4rem;font-size:1.7rem;font-weight:800;letter-spacing:.03em}
.pt.gp{background:var(--amber);color:var(--ink)}
.pt.mp{background:var(--red);color:#fff}
.pt:not([style*="opacity: 1"]){visibility:hidden}
.pslot:has(>.mp[style*="opacity: 1"])>.gp{opacity:0!important}

/* final (structural): serve and points columns give way to the full ledger and a big GAMES cell; width unchanged */
.board:has(.isAWinner[style*="opacity: 1"]) .rA .setc,.board:has(.isBWinner[style*="opacity: 1"]) .rB .setc{background:var(--lime)}
.board:has(.isAWinner[style*="opacity: 1"]) .rA .sets,.board:has(.isBWinner[style*="opacity: 1"]) .rB .sets{color:var(--ink)}

/* team tie strip */
.tie{display:flex;align-items:center;gap:1rem;height:4rem;padding:0 1.1rem;background:var(--rail);color:#fff;font-size:1.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-bottom:.2rem solid var(--lime)}
.tie:has(>.teamAName[style*="display: none"]){display:none}
.tlogo{display:block;flex:none;width:2.8rem;height:2.8rem;object-fit:contain}
.tlogo:not([src]),.tlogo[src=""]{visibility:hidden}
.tchip{display:block;flex:none;width:.6rem;height:2.4rem}
.tname{flex:1 0 auto;white-space:nowrap}
.tname.tb{text-align:right}
.tsc{display:flex;align-items:center;flex:none;font-family:var(--fn);font-size:2.4rem;color:var(--lime)}
.tdash{color:var(--dim);padding:0 .3rem}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>:not(.tie){display:none!important}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>.tie{height:5rem;font-size:2.2rem;border-bottom:0}
.board:has(.combinedAName:empty):has(.combinedBName:empty) .tsc{font-size:3rem;padding:0 1rem}
:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint,:has(>.isAMatchPoint[style*="opacity: 1"])>.isAGamePoint,:has(>.isBMatchPoint[style*="opacity: 1"])>.isBGamePoint{opacity:0!important}

/* functional rules: bound flags are shown only by their own data; the point values stay visible (dimmed) in every state */
.board:has(.isMatchStarted[style*="opacity: 1"]) .swarm,.board:has(.isComplete[style*="opacity: 1"]) .swarm{opacity:0!important}

/* ---- round 7 ---- */
/* badges: fixed columns right of the name area, aligned between the rows whatever the name length or card presence */
.who>.nm{flex:1 0 auto}
/* point banner: the shared GAME POINT / MATCH POINT pair lives in the header's context cell (never over the column headers) */
.ctx{display:grid!important;align-items:stretch;padding:0!important}
.ctx>*{grid-area:1/1}
.ctx>.cw{align-self:center;padding:0 1.2rem}
.pslot{position:relative!important;inset:auto!important;width:auto!important;height:auto!important;display:grid!important;z-index:4}
.pslot>.pt{position:relative!important;inset:auto!important;top:auto!important;bottom:auto!important;height:auto!important;grid-area:1/1;align-self:stretch}
.psz{visibility:hidden}
/* co-location: the game in play draws once (its ledger cell sits under the live points); at final the last game sits under the points, labelled LAST GAME */
.pts{z-index:2}
.ctx>.cw{padding:0 .9rem}
/* the ledger: two finished-game columns with quiet placeholders until each game is played */
.led,.lled{position:relative;display:grid!important;grid-template-columns:repeat(2,var(--cw));align-items:center;justify-items:center}
.led>*,.lled>*{grid-row:1}
.led>.h1,.lled>.h1{grid-column:1}.led>.h2,.lled>.h2{grid-column:2}
.led>.h3,.lled>.h3,.led>.h4,.lled>.h4,.led>.h5,.lled>.h5{grid-column:2}
.led>.hc,.lled>.hcl{position:relative;z-index:1;background:var(--bg)}
.lled>.hcl{background:var(--rail)}
.hv{box-shadow:inset 0 0 0 .14rem #6b7380}
.hv>.num{color:#e3e7ee}
/* the game in play sits under its row's live points; at final the last game sits under the points, labelled GAME n */
.pts{z-index:2}
.rlab{position:relative}
.led>.hc:not([style*="display: none"]){display:grid!important}
.cl{font-size:1.8rem!important}.call{font-size:2.5rem}
.rfoot{font-size:1.8rem!important}
.board:not(:has(.isMatchStarted[style*="opacity: 1"])) .call,.board:has(.isInBetweenGames[style*="opacity: 1"]) .call{color:#aeb6c2}

.board{--lw:calc(var(--cw) * 2 + .4rem)}
.toslot>.tob:not(.tsz){justify-self:stretch;justify-content:center}

/* ---- round 8: one copy of every score ---- */
/* the game in play shows only as the live points; the history lists completed games */
.board:has(.isGame1Current[style*="opacity: 1"]) :is(.hist,.led,.lled)>.h1{display:none!important}
.board:has(.isGame2Current[style*="opacity: 1"]) :is(.hist,.led,.lled)>.h2{display:none!important}
.board:has(.isGame3Current[style*="opacity: 1"]) :is(.hist,.led,.lled)>.h3{display:none!important}
.board:has(.isGame4Current[style*="opacity: 1"]) :is(.hist,.led,.lled)>.h4{display:none!important}
.board:has(.isGame5Current[style*="opacity: 1"]) :is(.hist,.led,.lled)>.h5{display:none!important}
/* final: the points give way to the result (WIN in the winner's points cell); the history keeps every game */
.board:has(.isComplete[style*="opacity: 1"]) .pv{display:none}
.board:has(.isComplete[style*="opacity: 1"]) .rlab>:is(.lsv,.lp){visibility:hidden}
.pts>.win{grid-area:1/1;align-self:center;justify-self:center;display:flex;align-items:center;justify-content:center;height:3.2rem;padding:0 .4rem;border-radius:.35rem;font-size:1.8rem;max-width:calc(var(--pw) - .6rem);font-weight:800;letter-spacing:.04em;position:relative;z-index:1}
.pts>.win:not([style*="opacity: 1"]){visibility:hidden}
.toslot>.win{display:none}
.board:has(.isComplete[style*="opacity: 1"]) .toslot{visibility:visible}
.pts>.win{background:var(--lime);color:var(--ink)}
:is(.board:not(:has(.isMatchStarted[style*="opacity: 1"])),.board:has(.isInBetweenGames[style*="opacity: 1"]),.board:has(.isComplete[style*="opacity: 1"])) .rfoot>.cl:not(.clsz){display:none}
/* final: the serve column gives way to a third history column (structural; width unchanged) */
.board:has(.isComplete[style*="opacity: 1"]) .sv,.board:has(.isComplete[style*="opacity: 1"]) .rlab>.lsv{display:none}
.board:has(.isComplete[style*="opacity: 1"]) :is(.led,.lled){width:calc(var(--lw) + var(--sw));grid-template-columns:repeat(3,var(--cw))}
.led>.h3,.lled>.h3{grid-column:3}
/* T/O USED gives way to the running timeout (contract: used marker hidden while a timeout runs) */
.toslot:has(>.tob[style*="opacity: 1"]:not(.tsz))>.tou:not(.tsz){display:none!important}

/* ---- round 9 ---- */
/* point tag: its own place in the status tab (a state), never over the event line or the column labels */
.sslot>.pslot{grid-area:1/1;position:relative!important;display:grid!important;align-self:stretch;justify-self:stretch;z-index:4;margin:0!important}
.sslot>.pslot>.pt{grid-area:1/1;align-self:stretch;justify-self:stretch;padding:0 .6rem;letter-spacing:.02em}
.ctx{display:flex!important;align-items:center;padding:0 .8rem!important}
/* final: one result cell spanning both rows in the points column (the winner's WIN, no empty loser cell) */
.board:has(.isComplete[style*="opacity: 1"]) .pts{border-top:0!important}
.board:has(.isAWinner[style*="opacity: 1"]) .rA .pts{height:calc(200% + .15rem);align-self:flex-start;z-index:3}
.board:has(.isBWinner[style*="opacity: 1"]) .rB .pts{height:calc(200% + .15rem);margin-top:calc(-1 * (var(--rh) + .15rem));align-self:flex-start;z-index:3}
.board:has(.isComplete[style*="opacity: 1"]) .pts>.win{font-size:2rem;height:3.6rem}
/* footer: the format and the finished games on the left, the score call under the score columns */
.rfoot{display:grid!important;place-items:center}
.rfoot>*{grid-area:1/1}
.clsz{visibility:hidden}
.fmt{font-size:1.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.fl .fmt,.flive .fmt,.fsz .fmt{padding-right:1.4rem;margin-right:.2rem;border-right:.15rem solid currentColor}
.fl .fmt{color:var(--dim)}
.hv{width:2.3rem}
.rfoot{justify-content:center!important;padding-right:0!important}
.cl{font-size:1.8rem!important}
/* the WIN mark sits centred in the one result cell */
</style>
