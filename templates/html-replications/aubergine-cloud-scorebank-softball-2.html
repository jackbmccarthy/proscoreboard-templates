<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Aubergine Cloud Scorebank horizontal</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#f8f7f5}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(98vw,1900px);max-width:100%;min-width:0;overflow:hidden;border-radius:4px;background:#35313b;container-type:inline-size}
.header{display:flex;align-items:center;justify-content:space-between;flex:none;height:3.4cqw;min-width:0;padding:0 1.6cqw;background:#e2e4e7;color:#25313b}
.sport-tag{display:block;flex:none;color:#25313b;font-size:2.2cqw;font-weight:800;line-height:1;white-space:nowrap}
.stats{display:flex;align-items:center;justify-content:flex-end;min-width:0}
.stat{display:flex;align-items:baseline;gap:.5cqw;min-width:0;padding:0 1.5cqw;color:#25313b;font-size:1.5cqw;font-weight:700;line-height:1;white-space:nowrap}
.stat+.stat{border-left:1px solid #aeb7bb}.stat strong{font-variant-numeric:tabular-nums}
.competitors{display:flex;align-items:stretch;min-width:0}
.competitor{display:flex;align-items:stretch;flex:1 1 50%;min-width:0;height:8cqw;background:#35313b}
.competitor+.competitor{border-left:1px solid #899098}
.identity{display:block;flex:none;width:3.6%;height:100%;background:#3194e4}
.jerseyColorB{background:#f37668}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1.7cqw;color:#f8f7f5;font-size:3.3cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.scorebank{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 19%;min-width:0;background:#c9d0d9;color:#25313b}
.score{display:block;max-width:100%;overflow:hidden;color:#25313b;font-size:4.4cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.score-label{display:block;color:#25313b;font-size:1.5cqw;font-weight:700;line-height:1;white-space:nowrap}
.hits-track{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 21%;min-width:0;background:#35313b;color:#f8f7f5}
.hit-value{display:block;max-width:100%;overflow:hidden;color:#f8f7f5;font-size:3cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.hits-label{display:block;color:#f8f7f5;font-size:1.5cqw;font-weight:700;line-height:1;white-space:nowrap}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%}.header{height:48px;padding:0 6px;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}.sport-tag{font-size:10px}.stats{justify-content:space-between}.stat{font-size:9px;gap:2px;padding:0 3px}.competitor{height:74px}.identity{width:3px}.name{font-size:clamp(13px,3.5vw,20px);padding:0 4px}.scorebank{flex-basis:34%}.score{font-size:clamp(20px,5.5vw,27px)}.score-label{font-size:8px}.hits-track{flex-basis:27%}.hit-value{font-size:16px}.hits-label{font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Softball scoreboard">
<div class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">SOFTBALL</span><div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static softball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="scorebank columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong><span class="score-label" data-osb-component="text">RUNS</span></div><div class="hits-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="hit-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong><span class="hits-label" data-osb-component="text">HITS</span></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="scorebank columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong><span class="score-label" data-osb-component="text">RUNS</span></div><div class="hits-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><strong class="hit-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong><span class="hits-label" data-osb-component="text">HITS</span></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
<div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div></article></main></body></html>
