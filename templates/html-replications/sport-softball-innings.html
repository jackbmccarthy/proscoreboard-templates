<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Softball Innings Scoreboard</title>
  <style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font-family:Impact,"Arial Narrow",Arial,sans-serif;color:#f6f7f7}.stage{padding:24px;min-height:500px;display:flex;align-items:center;justify-content:center}.softball{--amber:#ffbf16;--cyan:#00ccd7;--line:#727976;width:100%;max-width:1100px;display:flex;flex-direction:column;filter:drop-shadow(0 7px 10px #0005)}.sport-header{align-self:center;width:87%;display:flex;align-items:center;gap:20px;background:linear-gradient(#252a28,#101514);border:1px solid var(--line);padding:8px 25px;font-size:30px;letter-spacing:.17em;clip-path:polygon(3% 0,97% 0,100% 100%,0 100%)}.sport-header::before,.sport-header::after{content:"";height:3px;background:var(--amber);flex:1}.score-table{display:flex;flex-direction:column;background:#0c1110;border:2px solid var(--line)}.heading,.team{display:flex;align-items:stretch}.heading{background:linear-gradient(#292e2c,#1a201e);border-bottom:2px solid var(--line);min-height:44px;color:#c9cecc}.heading .name-cell{padding:0}.heading .number{font-size:29px;line-height:1;align-items:center}.name-cell{flex:1 1 49%;min-width:0;display:flex;align-items:center;gap:8px;padding:4px 16px 4px 0}.jersey{align-self:stretch;flex:0 0 10px;background:var(--amber)}.jerseyColorB{background:var(--cyan)}.name{display:block;flex:1 1 auto;min-width:0;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;font-size:clamp(28px,4vw,57px);padding:14px 24px;background:linear-gradient(110deg,#704e0c,#171912 72%);clip-path:polygon(0 0,95% 0,100% 50%,95% 100%,0 100%);border-top:1px solid var(--amber);border-bottom:1px solid var(--amber)}.combinedBName{background:linear-gradient(110deg,#055560,#101a1b 72%);border-color:var(--cyan)}.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}.team+.team{border-top:2px solid var(--line)}.number{display:flex;align-items:center;justify-content:center;flex:0 0 17%;min-width:0;border-left:1px solid var(--line);font-size:64px;font-variant-numeric:tabular-nums}.currentAGameScore{color:var(--amber);font-size:80px}.currentBGameScore{color:var(--cyan);font-size:80px}.status-strip{position:relative;display:flex;align-items:stretch;margin-top:8px;padding:15px 22px;background:linear-gradient(115deg,#171c1a,#0d1211);border:2px solid var(--line);clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%)}.status-strip::before,.status-strip::after{position:absolute;content:"";top:8px;bottom:8px;width:4px;left:14px;background:var(--amber)}.status-strip::after{left:auto;right:14px;background:var(--cyan)}.stat{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0 14px}.stat+.stat{border-left:1px solid var(--line)}.label{font-size:23px;color:#c7cecb;white-space:nowrap}.counter{display:block;width:100%;max-width:135px;border:1px solid var(--line);border-radius:9px;text-align:center;font-size:52px;line-height:1.2;font-variant-numeric:tabular-nums}.base-zone{flex:0 0 18%;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);min-width:0}.diamond{position:relative;width:62px;height:62px;border:2px solid #9ba3a0;transform:rotate(45deg)}.base{position:absolute;width:13px;height:13px;background:#acb3b0}.first{right:1px;top:1px}.second{left:1px;top:1px}.third{left:1px;bottom:1px}.home{right:1px;bottom:1px;clip-path:polygon(0 0,100% 0,100% 55%,55% 100%,0 100%)}.runtime-reserve{display:none}.point-slot{position:relative;display:none}.point-slot>span{position:absolute;inset:0}.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint{opacity:0!important}
@media(max-width:650px){.stage{padding:14px;min-height:360px}.sport-header{font-size:22px;padding:8px 13px;gap:9px}.heading{min-height:33px}.heading .number{font-size:22px}.name-cell{padding-right:5px;gap:5px}.jersey{flex-basis:6px}.name{font-size:28px;padding:16px 8px}.number{font-size:34px}.currentAGameScore,.currentBGameScore{font-size:48px}.status-strip{padding:14px 14px;flex-wrap:wrap;clip-path:polygon(2% 0,98% 0,100% 50%,98% 100%,2% 100%,0 50%)}.status-strip::before{left:5px;width:3px}.status-strip::after{right:5px;width:3px}.stat{flex:1 1 25%;padding:0 6px}.label{font-size:15px}.counter{font-size:32px}.base-zone{flex:1 1 100%;border-left:0;padding-top:18px;padding-bottom:5px}.diamond{width:34px;height:34px}.base{width:8px;height:8px}}
@media(max-width:650px){.currentAGameScore,.currentBGameScore{font-size:clamp(22px,7vw,38px)}}
  </style>
</head>
<body>
  <main class="stage">
    <article class="softball columnContainer" aria-label="Softball scoreboard" data-osb-component="layout" data-osb-component-type="osb-column-container">
      <header class="sport-header">SOFTBALL</header>
      <div class="score-table columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="heading rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="name-cell"></span><span class="number">R</span><span class="number">H</span><span class="number">E</span></div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <div class="name-cell"><span class="jersey jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div>
          <span class="number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="number" data-osb-static="true" data-sport-stat="hitsA">0</span><span class="number" data-osb-static="true" data-sport-stat="errorsA">0</span>
        </div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <div class="name-cell"><span class="jersey jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div>
          <span class="number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="number" data-osb-static="true" data-sport-stat="hitsB">0</span><span class="number" data-osb-static="true" data-sport-stat="errorsB">0</span>
        </div>
      </div>
      <div class="status-strip rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="stat"><span class="label">INNING</span><span class="counter" data-osb-static="true" data-sport-stat="inning">0</span></div>
        <div class="stat"><span class="label">BALLS</span><span class="counter" data-osb-static="true" data-sport-stat="balls">0</span></div>
        <div class="stat"><span class="label">STRIKES</span><span class="counter" data-osb-static="true" data-sport-stat="strikes">0</span></div>
        <div class="stat"><span class="label">OUTS</span><span class="counter" data-osb-static="true" data-sport-stat="outs">0</span></div>
        <div class="base-zone" aria-hidden="true"><div class="diamond"><i class="base first"></i><i class="base second"></i><i class="base third"></i><i class="base home"></i></div></div>
      </div>
      <div class="runtime-reserve"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
