<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Cloud Graphite Combined Bay compact</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#293b44}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(75vw,1460px);max-width:100%;min-width:0;overflow:hidden;border:2px solid #aebbb8;border-radius:4px;background:#e8edeb;container-type:inline-size}
.header{display:flex;align-items:center;justify-content:space-between;flex:none;height:5.7cqw;border-bottom:1px solid #aebbb8;background:#e8edeb}
.sport-tag{display:block;flex:1 1 auto;min-width:0;padding:0 2.5cqw;font-size:2.6cqw;font-weight:800;line-height:1;white-space:nowrap}
.stats{display:flex;align-items:stretch;justify-content:flex-end;flex:none;height:100%;min-width:0}
.stat{display:flex;align-items:center;gap:.5cqw;min-width:0;padding:0 1.4cqw;color:#293b44;font-size:1.75cqw;font-weight:700;line-height:1;white-space:nowrap}
.stat:first-child,.stat+.stat{border-left:1px solid #aebbb8}.stat strong{font-variant-numeric:tabular-nums}
.competitors{display:flex;flex-direction:column;min-width:0}
.competitor{display:flex;align-items:stretch;min-width:0;height:10.3cqw;background:#e8edeb}
.competitor+.competitor{border-top:1px solid #aebbb8}
.identity{display:block;flex:none;width:2.7%;height:100%;background:#2178d8}
.jerseyColorB{background:#f25b60}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2.7cqw;color:#293b44;font-size:4.5cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.score-bay{display:flex;flex-direction:column;flex:0 0 18.8%;min-width:0;background:#293b44;color:#f7faf8}
.small-line,.large-line{display:flex;align-items:center;justify-content:space-between;gap:.8cqw;min-width:0;padding:0 2.2cqw}
.small-line{flex:0 0 42%;border-bottom:1px solid #aebbb8}
.large-line{flex:1 1 auto;padding:0 1cqw}
.small-label,.large-label{display:block;flex:none;color:#f7faf8;font-weight:700;line-height:1;white-space:nowrap}
.small-label{font-size:1.9cqw}.large-label{font-size:2.1cqw}
.hit-value,.score{display:block;max-width:72%;overflow:hidden;color:#f7faf8;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hit-value{font-size:2.9cqw}.score{font-size:5.2cqw}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%;border-width:1px}.header{height:48px;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}.sport-tag{flex:none;padding:0 8px;font-size:11px}.stats{height:auto;justify-content:space-between}.stat{font-size:9px;gap:2px;padding:0 5px}.competitor{height:72px}.name{font-size:clamp(20px,6vw,29px);padding:0 10px}.score-bay{flex-basis:27%}.small-line,.large-line{padding:0 8px}.small-label,.large-label{font-size:9px}.hit-value{font-size:14px}.score{font-size:clamp(26px,8vw,38px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Softball scoreboard">
<div class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">SOFTBALL</span><div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static softball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="competitors columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="score-bay columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="small-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="small-label" data-osb-component="text">HITS</span><strong class="hit-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong></div><div class="large-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="large-label" data-osb-component="text">RUNS</span><strong class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong></div></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="score-bay columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="small-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="small-label" data-osb-component="text">HITS</span><strong class="hit-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong></div><div class="large-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="large-label" data-osb-component="text">RUNS</span><strong class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong></div></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
<div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div></article></main></body></html>
