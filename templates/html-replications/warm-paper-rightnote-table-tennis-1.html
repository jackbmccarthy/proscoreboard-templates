<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warm Paper Rightnote TABLE TENNIS 1</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#293a44}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}.board{--paper:#f2efe9;--ink:#293a44;display:flex;width:min(62vw,1250px);min-width:0;overflow:hidden;border-radius:6px;background:var(--paper)}.lanes{display:flex;flex:1 1 auto;min-width:0;flex-direction:column}.lane{display:flex;flex:1 1 auto;align-items:stretch;min-width:0;min-height:clamp(76px,8vw,164px);background:var(--paper)}.lane+.lane{border-top:1px solid #b9c2bf}.identity{display:block;flex:0 0 22px;align-self:stretch;background:#2f86a7}.jerseyColorB{background:#c77469}.name-lane{display:flex;flex:1 1 0;flex-direction:column;justify-content:center;min-width:0;padding:12px 16px 12px 28px}.name-line{display:flex;align-items:center;min-width:0;gap:8px}.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(28px,3.15vw,64px);font-weight:700;line-height:1.05}.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}.serve{display:block;flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:var(--ink)}.support-track{display:flex;align-items:baseline;gap:8px;min-width:0;margin-top:3px;font-weight:700;line-height:1.05}.support-score{font-size:clamp(16px,1.9vw,38px);font-variant-numeric:tabular-nums}.support-caption{font-size:clamp(10px,1.28vw,26px);letter-spacing:.03em}.primary-track{display:flex;flex:0 0 clamp(92px,10vw,190px);flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:5px 8px;background:var(--paper);color:var(--ink)}.primary-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(46px,5.5vw,112px);font-weight:700;line-height:.93;font-variant-numeric:tabular-nums;letter-spacing:-.05em}.primary-caption{display:block;margin-top:4px;font-size:clamp(10px,1.35vw,28px);font-weight:700;line-height:1;letter-spacing:.02em;white-space:nowrap}.dock{position:relative;display:flex;flex:0 0 25%;align-items:center;justify-content:center;min-width:0;padding:12px;background:#293a44;color:#faf9f5}.dock-title{max-width:100%;font-size:clamp(16px,1.65vw,34px);font-weight:700;line-height:1.05;text-align:center;white-space:nowrap}.point-slot{position:absolute;left:8px;right:8px;bottom:4px;height:14px;text-align:center;font-size:10px;font-weight:700}.point-state{position:absolute;inset:0;white-space:nowrap}.point-slot:has(.isMatchPoint[style*="opacity: 1"]) .isGamePoint{opacity:0!important}@media(max-width:700px){.board{width:96vw}.lane{min-height:76px}.identity{flex-basis:8px}.name-lane{padding:7px 6px 7px 11px}.name{font-size:clamp(18px,5vw,29px)}.support-score{font-size:16px}.support-caption{font-size:10px}.primary-track{flex-basis:54px;padding:4px}.primary-score{font-size:clamp(32px,8vw,48px)}.primary-caption{font-size:9px}.dock{flex-basis:100px;padding:6px}.dock-title{font-size:clamp(10px,2vw,14px);white-space:normal}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style></head>
<body><main class="stage"><article class="board" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><section class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane"><div class="name-line"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="support-track"><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-caption">GAMES</span></div></div><div class="primary-track"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption">POINTS</span></div></section><section class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane"><div class="name-line"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="support-track"><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-caption">GAMES</span></div></div><div class="primary-track"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption">POINTS</span></div></section></div><aside class="dock"><span class="dock-title">TABLE TENNIS</span><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></aside></article></main></body>
