<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Cedar Ivory Namefoot 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(96vw,1696px);max-width:100%;aspect-ratio:6.9;overflow:hidden;border:2px solid #627973;border-radius:10px;background:#253b37;color:#f3f0e8;container-type:inline-size}
.pair{display:flex;flex:1 1 0;min-width:0;min-height:0}
.side{display:flex;align-items:stretch;flex:1 1 0;min-width:0}
.side+.side{border-left:2px solid #627973}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;align-self:stretch;flex:0 0 15px;margin:20px 0 20px 22px;background:#347ff0}
.jerseyColorB{background:#ef706b}
.name-stack{display:flex;flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:4px;padding:0 32px}
.name{display:block;min-width:0;overflow:hidden;color:#f3f0e8;font-size:clamp(28px,4.3cqw,72px);font-weight:700;line-height:1.08;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.sets-line{display:flex;align-items:center;gap:.4em;color:#b8c7c0;font-size:clamp(16px,2.3cqw,38px);font-weight:750;line-height:1;white-space:nowrap}
.set-score{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.scorecap{display:flex;align-items:center;justify-content:center;flex:0 0 23%;min-width:0;flex-direction:column;gap:2px;margin:5px 5px 5px 0;border-radius:5px;background:#f3f0e8;color:#253b37;font-variant-numeric:tabular-nums;white-space:nowrap}
.points-label{display:block;max-width:100%;overflow:hidden;font-size:clamp(14px,1.5cqw,24px);font-weight:800;line-height:1}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(45px,5.4cqw,90px);font-weight:800;line-height:1;text-align:center}
.utility{display:flex;align-items:center;justify-content:space-between;flex:0 0 30%;min-width:0;padding:0 28px;border-top:2px solid #627973;color:#f3f0e8;font-size:clamp(18px,2.6cqw,44px);font-weight:750;line-height:1;white-space:nowrap}
.sport-tag{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-status{display:flex;align-items:center;align-self:stretch;gap:.3em;padding-left:55px;border-left:2px solid #b8c7c0}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){
 .stage{padding:6px}
 .board{width:100%;height:145px;aspect-ratio:auto;border-width:1px;border-radius:4px}
 .side+.side,.utility{border-width:1px}
 .identity{flex-basis:4px;margin:18px 0 18px 5px}
 .name-stack{gap:2px;padding:0 5px}
 .name{font-size:clamp(13px,4cqw,18px)}
 .sets-line{font-size:clamp(9px,2.6cqw,12px)}
 .scorecap{flex-basis:25%;margin:3px 3px 3px 0;border-radius:2px}
 .points-label{font-size:clamp(8px,2cqw,11px)}
 .score{font-size:clamp(23px,6.7cqw,31px)}
 .utility{padding:0 7px;font-size:clamp(11px,3.2cqw,15px)}
 .set-status{padding-left:8px;border-width:1px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Horizontal volleyball scoreboard with generic manual scoring">
  <div class="pair rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <div class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-stack" data-osb-component="layout"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="sets-line" data-osb-component="layout"><span data-osb-component="text">SETS</span><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div></div><div class="scorecap" data-osb-component="layout"><span class="points-label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
   <div class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-stack" data-osb-component="layout"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="sets-line" data-osb-component="layout"><span data-osb-component="text">SETS</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div></div><div class="scorecap" data-osb-component="layout"><span class="points-label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
  </div>
  <div class="utility rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
