<!doctype html>

<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Midnight Teal Capsule TABLE TENNIS 1</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{font-family:Arial,Helvetica,sans-serif;font-weight:700;color:#f7fbfc}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}.board{width:min(var(--view-width),var(--max-width),var(--height-width));position:relative;container-type:inline-size;background:transparent;padding-bottom:20px}.desk{width:100%;min-width:0;border:1px solid #36545e;border-radius:8px;overflow:hidden;background:#102331}.header{background:#b9e2df;color:#102331;min-width:0}.sport-caption{white-space:nowrap;line-height:1.1}.row,.lane,.name-cell,.name-wrap{min-width:0}.name-cell{display:flex;align-items:center;flex:1 1 0}.name-wrap{display:flex;align-items:center;flex:1 1 0;gap:5px;min-width:0}.name{display:block;flex:1 1 0;min-width:0;max-width:100%;font-size:var(--name-font);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.combinedAName:empty:before{content:"Player A"}.combinedBName:empty:before{content:"Player B"}.identity{display:block;flex-shrink:0;background:#147d86;border-radius:1px}.serve{display:block;flex:0 0 12px;width:12px;font-size:8px;line-height:12px;height:12px;text-align:center}.score,.match-score{display:block;width:100%;font-size:var(--score-font);line-height:1.1;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}.match-score{font-size:var(--match-font);color:#b9e2df}.label{font-size:var(--label-font);line-height:1.1;text-align:center;white-space:nowrap}.game-cell{color:#b9e2df}.point-cell{background:#147d86;color:#f7fbfc}.point-slot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:200px;max-width:90%;height:16px;font-size:12px;text-align:center}.point{position:absolute;inset:0;background:#102331;color:#f7fbfc}.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint{opacity:0!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.board{--view-width
