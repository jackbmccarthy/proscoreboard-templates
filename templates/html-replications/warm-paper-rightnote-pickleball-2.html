<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warm Paper Rightnote PICKLEBALL 2</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#293a44}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}.board{--paper:#f2efe9;--ink:#293a44;display:flex;width:min(88vw,1800px);min-width:0;overflow:hidden;border-radius:6px;background:var(--paper)}.lanes{display:flex;flex:1 1 auto;min-width:0;flex-direction:row}.lane{display:flex;flex:1 1 0;align-items:stretch;min-width:0;min-height:clamp(76px,9.5vw,195px);background:var(--paper)}.lane+.lane{border-left:1px solid #b9c2bf}.identity{display:block;flex:0 0 18px;align-self:stretch;background:#2f86a7}.jerseyColorB{background:#c77469}.name-lane{display:flex;flex:1 1 0;flex-direction:column;justify-content:center;min-width:0;padding:10px 12px 10px 20px}.name-line{display:flex;align-items:center;min-width:0;gap:8px}.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(28px,3.15vw,64px);font-weight:700;line-height:1.05}.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}.serve{display:block;flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:var(--ink)}.support-track{display:flex;align-items:baseline;gap:8px;min-width:0;margin-top:3px;font-weight:700;line-height:1.05}.support-score{font-size:clamp(16px,1.9vw,38px);font-variant-numeric:tabular-nums}.support-caption{font-size:clamp(10px,1.28vw,26px);letter-spacing:.03em}.primary-track{display:flex;flex:0 0 clamp(76px,9vw,168px);flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:5px 8px;background:var(--paper);color:var(--ink)}.primary-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(46px,5.5vw,112px);font-weight:700;line-height:.93;font-variant-numeric:tabular-nums;letter-spacing:-.05em}.primary-caption{display:block;margin-top:4px;font-size:clamp(10px,1.35vw,28px);font-weight:700;line-height:1;letter-spacing:.02em;white-space:nowrap}.dock{position:relative;display:flex;flex:0 0 20%;align-items:center;justify-content:center;min-width:0;padding:12px;background:#293a44;color:#faf9f5}.dock-title{max-width:100%;font-size:clamp(16px,1.65vw,34px);font-weight:700;line-height:1.05;text-align:center;white-space:nowrap}.point-slot{position:absolute;left:8px;right:8px;bottom:4px;height:14px;text-align:center;font-size:10px;font-weight:700}.point-state{position:absolute;inset:0;white-space:nowrap}.point-slot:has(.isMatchPoint[style*="opacity: 1"]) .isGamePoint{opacity:0!important}@media(max-width:700px){.board{width:96vw}.lane{min-height:76px}.identity{flex-basis:8px}.name-lane{padding:7px 6px 7px 11px}.name{font-size:clamp(18px,5vw,29px)}.support-score{font-size:16px}.support-caption{font-size:10px}.primary-track{flex-basis:54px;padding:4px}.primary-score{font-size:clamp(32px,8vw,48px)}.primary-caption{font-size:9px}.dock{flex-basis:100px;padding:6px}.dock-title{font-size:clamp(10px,2vw,14px);white-space:normal}.lanes{flex-direction:column}.lane+.lane{border-left:0;border-top:1px solid #b9c2bf}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Reserved conditional match states: all score and name tracks remain fixed. */
.osb-conditional-rail{--osb-rail-bg:#293a44;--osb-rail-fg:#f9fbfa;box-sizing:border-box!important;position:relative!important;inset:auto!important;transform:none!important;grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:28px!important;height:28px!important;margin:0!important;padding:2px 7px!important;gap:5px!important;overflow:hidden!important;background:var(--osb-rail-bg)!important;color:var(--osb-rail-fg)!important;border:0!important;font:700 11px/1 Arial,Helvetica,sans-serif!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-condition-side{all:unset!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;flex:1 1 35%!important;width:35%!important;min-width:0!important;height:22px!important;gap:2px!important;position:relative!important;overflow:hidden!important}
.osb-conditional-rail .osb-condition-side-b{justify-content:flex-end!important}
.osb-conditional-rail .osb-condition-side-label{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 13px!important;width:13px!important;height:18px!important;color:var(--osb-rail-fg)!important;font:800 10px/1 Arial,Helvetica,sans-serif!important}
.osb-conditional-rail .osb-condition-slot{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 21px!important;width:21px!important;height:18px!important;position:relative!important}
.osb-conditional-rail .osb-condition-timeoutused{flex-basis:21px!important;width:21px!important}
.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:17px!important;width:17px!important}
.osb-conditional-rail .osb-condition-badge{box-sizing:border-box!important;align-items:center!important;justify-content:center!important;width:100%!important;height:18px!important;min-width:0!important;margin:0!important;padding:0 2px!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:2px!important;background:rgba(255,255,255,.12)!important;color:var(--osb-rail-fg)!important;font:800 9px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-timeout-icon{position:relative!important;display:flex;align-items:center!important;justify-content:center!important;padding:0!important;color:var(--osb-rail-fg)!important}
.osb-conditional-rail .osb-timeout-icon::before{content:""!important;display:block!important;width:11px!important;height:11px!important;border:1.5px solid currentColor!important;border-radius:50%!important;background:transparent!important}
.osb-conditional-rail .osb-timeout-icon::after{content:""!important;position:absolute!important;left:50%!important;top:3px!important;width:3px!important;height:6px!important;border-left:1.5px solid currentColor!important;border-bottom:1.5px solid currentColor!important;transform:translateX(-25%) rotate(-35deg)!important;transform-origin:bottom left!important}
.osb-conditional-rail .isATimeOutActive,.osb-conditional-rail .isBTimeOutActive{background:#f3d27a!important;color:#253641!important;border-color:#f3d27a!important}
.osb-conditional-rail .isATimeOutUsed,.osb-conditional-rail .isBTimeOutUsed{background:transparent!important;color:#b8c7ca!important;border-color:#b8c7ca!important}
.osb-conditional-rail .isAYellowCarded,.osb-conditional-rail .isBYellowCarded{background:#e5c94e!important;color:#253641!important;border-color:#e5c94e!important}
.osb-conditional-rail .isARedCarded,.osb-conditional-rail .isBRedCarded{background:#c94747!important;color:#fff!important;border-color:#c94747!important}
.osb-conditional-rail .point-slot.osb-shared-point{all:unset!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30%!important;width:30%!important;min-width:78px!important;max-width:130px!important;height:22px!important;min-height:22px!important;inset:auto!important;margin:0!important;padding:0!important;transform:none!important;overflow:hidden!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important}
.osb-conditional-rail .point-slot.osb-shared-point>.isGamePoint,.osb-conditional-rail .point-slot.osb-shared-point>.isMatchPoint{box-sizing:border-box!important;position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;transform:none!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:390px){.osb-conditional-rail{padding:2px 4px!important;gap:3px!important}.osb-conditional-rail .osb-condition-side{gap:1px!important}.osb-conditional-rail .osb-condition-slot{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-timeoutused{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:15px!important;width:15px!important}.osb-conditional-rail .point-slot.osb-shared-point{min-width:76px!important}}
.board:has(>.osb-conditional-rail){flex-wrap:wrap!important}.board>.osb-conditional-rail{order:99!important}
</style></head>
<body><main class="stage"><article class="board" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><section class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane"><div class="name-line"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="support-track"><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-caption">GAMES</span></div></div><div class="primary-track"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption">POINTS</span></div></section><section class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane"><div class="name-line"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="support-track"><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-caption">GAMES</span></div></div><div class="primary-track"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption">POINTS</span></div></section></div><aside class="dock"><span class="dock-title">PICKLEBALL</span></aside><div class="osb-conditional-rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Conditional match states"><div class="osb-condition-side osb-condition-side-a" data-osb-component="layout"><span class="osb-condition-side-label">A</span><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div><span class="point-slot osb-shared-point" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><div class="osb-condition-side osb-condition-side-b" data-osb-component="layout"><span class="osb-condition-side-label">B</span><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div></div></article></main></body>
</html>
