<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touchline Bug</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 28px 40px; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    .osb { position: relative; display: grid; grid-template-columns: 128px auto 62px 62px auto; grid-template-rows: auto 60px; width: max-content; color: #10151d; filter: drop-shadow(0 6px 14px #0008); }
    .ev { grid-column: 1 / -1; justify-self: start; display: flex; gap: 12px; max-width: 100%; padding: 5px 14px 4px; background: #fff; border-radius: 5px 5px 0 0; border-bottom: 1px solid #e3e7ec; font-size: 16px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #4c5666; white-space: nowrap; }
    .ev .eventName { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .ev .matchRound { flex: none; color: #d1102a; }
    .clk { position: relative; grid-row: 2; display: grid; background: #10151d; color: #fff; border-radius: 0 0 0 6px; }
    .osb:not(:has(.ev .eventName:not(:empty))):not(:has(.ev .matchRound:not(:empty))) .clk { border-radius: 6px 0 0 6px; }
    .clk > .live, .clk > .state { grid-area: 1 / 1; }
    .live { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 31px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sub { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
    .per { font-size: 16px; font-weight: 800; letter-spacing: 1px; color: #c4ccd8; }
    .dot { width: 13px; height: 13px; color: #ff2d48; filter: drop-shadow(0 0 3px #ff2d48); }
    .runbar { position: absolute; left: 22px; right: 22px; bottom: 4px; height: 2px; background: #d1102a; }
    .mp { display: flex; gap: 3px; }
    .h { position: relative; width: 14px; height: 4px; background: #39414e; }
    .h > span { position: absolute; inset: 0; background: #fff; }
    .et { width: 8px; height: 4px; background: #ffd21f; }
    .add { position: absolute; top: 100%; left: 18px; display: flex; align-items: center; height: 26px; padding: 0 12px; background: #d1102a; color: #fff; border-radius: 0 0 5px 5px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 20px; font-weight: 700; }
    .add-v:empty::before { content: "+0"; }
    .state { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; line-height: 1; background: #10151d; color: #fff; border-radius: inherit; }
    .st-b { font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 1px; }
    .brk { background: #fff; color: #d1102a; box-shadow: inset 0 0 0 3px #d1102a; }
    .pens { z-index: 2; background: #ffd21f; color: #10151d; }
    .st-s { font-size: 16px; font-weight: 800; letter-spacing: 2px; }
    .st-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 26px; font-weight: 700; margin-top: 2px; }
    .st-v b { padding: 0 2px; }
    .fin { z-index: 3; background: #10151d; }
    .tm { position: relative; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #fff; min-width: 0; }
    .tm.B { border-radius: 0 6px 6px 0; }
    .kitw { flex: none; display: flex; width: 7px; height: 38px; border-radius: 2px; background: #b9c2cf; }
    .tm.B .kitw { background: #59647a; }
    .kit { flex: 1; border-radius: 2px; background-color: transparent; }
    .nm { max-width: 210px; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 21px; font-weight: 700; line-height: 1.02; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: normal; word-break: normal; hyphens: none; text-wrap: balance; }
    .tm.A .nm { text-align: right; }
    .scA, .scB { display: flex; align-items: center; justify-content: center; background: #d1102a; color: #fff; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .scB { border-left: 2px solid #fff; }
    .cards { display: flex; gap: 4px; flex: none; }
    .yc, .rc { display: flex; align-items: center; justify-content: center; width: 18px; height: 25px; border-radius: 2px; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 16px; font-weight: 700; line-height: 1; box-shadow: 0 1px 2px #0005; }
    .yc { background: #ffd21f; color: #2a2300; }
    .rc { background: #e3262e; color: #fff; }
    .yc[style*="opacity: 0"], .rc[style*="opacity: 0"] { width: 0; margin-left: -4px; }
    .cards:not(:has([style*="opacity: 1"])) { margin-left: -10px; }
    .win { position: absolute; left: 14px; right: 14px; bottom: 0; height: 4px; background: #d1102a; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .tm.B :is(.nm, .cards), .osb:has(.isBWinner[style*="opacity: 1"]) .tm.A :is(.nm, .cards) { opacity: .5; }
    .brk .b-ft, .brk .b-eh, .brk .b-aet { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]) .brk .b-ht { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .b-ft { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]):not(:has(.isGame4Started[style*="opacity: 1"])) .brk .b-eh { display: inline; }
    .osb:has(.isGame4Started[style*="opacity: 1"]) .brk .b-aet { display: inline; }
    .osb:has(.isGame3Started[style*="opacity: 1"]) .brk .b-ft { display: none; }
    .dot i { display: block; width: 100%; height: 100%; border-radius: 50%; background: currentColor; animation: osb-pulse 1.6s ease-in-out infinite; }
    @keyframes osb-pulse { 50% { opacity: .4; } }
    .osb:has(.isComplete[style*="opacity: 1"]) .dot i { animation: none; }
    body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted { opacity: 0 !important; }
    .fin .st-b { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; }
    .fpens { display: block; margin-top: 2px; white-space: nowrap; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 16px; letter-spacing: .5px; color: #ffd21f; }
    .fpens:not([style*="opacity: 1"]) { display: none; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="osb" aria-label="Soccer scorebug">
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="clk">
    <div class="live"><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="sub"><span class="dot isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"><i></i></span><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="mp"><span class="h"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="h"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="et isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span><span class="et isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="st-b b-ht">HT</span><span class="st-b b-ft">FT</span><span class="st-b b-eh">ET HT</span><span class="st-b b-aet">AET</span></div>
    <div class="state pens isShootoutActive" data-osb-component="field" data-osb-field="isShootoutActive" style="opacity: 0;"><span class="st-s">PENS</span><span class="st-v"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span><b>-</b><span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span></span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FT<span class="isDecidedOnPenalties fpens" data-osb-component="field" data-osb-field="isDecidedOnPenalties" style="opacity:0"><span class="shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore">0</span>-<span class="shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore">0</span> PENS</span></span></div>
    <span class="add addedTimeVisible" data-osb-component="field" data-osb-field="addedTimeVisible" style="opacity: 0;"><span class="add-v addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span>
  </div>
  <div class="tm A"><span class="kitw"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="cards"><span class="yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span></span><span class="win isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity: 0;"></span></div>
  <div class="scA"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
  <div class="scB"><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
  <div class="tm B"><span class="cards"><span class="yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="kitw"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><span class="win isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity: 0;"></span></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="homeSide" data-osb-component="field" data-osb-field="homeSide"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
