<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touchline Bug</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 24px 44px; font-family: "Avenir Next Condensed", "Arial Narrow", Arial, sans-serif; }
    .bug { position: relative; display: inline-flex; align-items: stretch; height: 46px; color: #fff; filter: drop-shadow(0 4px 10px #0009); }
    .clock { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #c8f560; color: #062b2f; border-radius: 4px 0 0 4px; }
    .gc { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .live { width: 8px; height: 8px; border-radius: 50%; background: #062b2f; animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .main { display: flex; align-items: stretch; background: #062b2f; border-radius: 0 4px 4px 0; }
    .team { display: flex; align-items: center; gap: 8px; padding: 0 12px; }
    .kit { width: 6px; height: 26px; border-radius: 1px; background-color: #3c6b70; }
    .nm { max-width: 150px; font-size: 24px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score { display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #0b3d42; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .score .dash { color: #c8f560; font-size: 22px; }
    .card { display: inline-flex; align-items: center; justify-content: center; width: 12px; height: 17px; border-radius: 2px; font-size: 10px; font-weight: 700; }
    .card.red { background: #e5262b; color: #fff; }
    .card.yellow { background: #f7d117; color: #062b2f; }
    .cn { line-height: 1; }
    .under { position: absolute; left: 0; top: 46px; display: flex; gap: 0; }
    .half { padding: 3px 10px 2px; background: #0b3d42; color: #c8f560; font-size: 14px; font-weight: 700; letter-spacing: 1px; border-radius: 0 0 4px 4px; }
    .half:empty { display: none; }
    .added { padding: 3px 10px 2px; margin-left: 4px; background: #fff; color: #062b2f; font-size: 14px; font-weight: 700; border-radius: 0 0 4px 4px; }
    .added:has(.at:empty) { display: none; }
    .ht { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #c8f560; color: #062b2f; font-size: 24px; font-weight: 700; letter-spacing: 2px; border-radius: 4px 0 0 4px; }
    .pens { display: none; }
    .ev { position: absolute; right: 0; top: 50px; display: flex; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
    .ev-round { color: #c8f560; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<article class="bug" aria-label="Soccer scorebug">
  <div class="clock"><span class="live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity: 0;"></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="ht isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">HT</span></div>
  <div class="main">
    <span class="team"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="card yellow isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity: 0;"><span class="cn yellowCardsA" data-osb-component="field" data-osb-field="yellowCardsA"></span></span><span class="card red isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity: 0;"><span class="cn redCardsA" data-osb-component="field" data-osb-field="redCardsA"></span></span></span>
    <span class="score"><span class="sa currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><b class="dash">-</b><span class="sb currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span>
    <span class="team"><span class="card yellow isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity: 0;"><span class="cn yellowCardsB" data-osb-component="field" data-osb-field="yellowCardsB"></span></span><span class="card red isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity: 0;"><span class="cn redCardsB" data-osb-component="field" data-osb-field="redCardsB"></span></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span>
  </div>
  <div class="under"><span class="half periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="half"></span><span class="added addedTimeVisible"><span class="at addedTime" data-osb-component="field" data-osb-field="addedTime"></span></span><span class="pens shootoutAttempts"><b class="pens-l">PENS</b><span class="pen-a shootoutAScore" data-osb-component="field" data-osb-field="shootoutAScore"></span><b class="pens-d">-</b><span class="pen-b shootoutBScore" data-osb-component="field" data-osb-field="shootoutBScore"></span></span></div>
  <span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</body>
</html>
