<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porcelain Inkline Volleyball — Horizontal Lanes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: transparent; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .stage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
    .board { display: flex; flex-direction: column; width: min(86vw, 1660px); max-width: 100%; overflow: hidden; background: #f0f1ed; color: #202a2e; container-type: inline-size; }
    .header { display: flex; align-items: center; justify-content: center; height: 4cqw; min-height: 25px; border-bottom: .35cqw solid #397a78; background: #202a2e; color: #fff; }
    .sport { overflow: hidden; color: #fff; font-size: 2.7cqw; font-weight: 800; line-height: 1; text-overflow: ellipsis; white-space: nowrap; }
    .teams { display: flex; min-width: 0; }
    .team { display: flex; align-items: center; flex: 1 1 50%; min-width: 0; height: 11.2cqw; min-height: 61px; background: #f0f1ed; }
    .team + .team { border-left: 1px solid #9ea7a5; }
    .tick { display: block; align-self: stretch; flex: 0 0 2.2%; margin: 1cqw 0 1cqw 1.1%; background: #397a78; }
    .jerseyColorB { background: #7da2a1; }
    .name { display: block; flex: 1 1 0; min-width: 0; overflow: hidden; padding: 0 2.1cqw; color: #202a2e; font-size: 5.25cqw; font-weight: 700; line-height: 1; text-overflow: ellipsis; white-space: nowrap; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .number-group { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; min-width: 0; height: 70%; }
    .sets-group { width: 13%; }
    .points-group { width: 22%; margin-right: 1.8%; border-left: 1px solid #c6cbc7; }
    .number-label { color: #687678; font-size: 1.55cqw; font-weight: 700; line-height: 1; white-space: nowrap; }
    .number-value { display: block; color: #202a2e; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sets-score { font-size: 3.6cqw; }
    .points-score { font-size: 6.2cqw; }
    .footer { display: flex; align-items: center; justify-content: center; height: 4.2cqw; min-height: 27px; background: #202a2e; color: #fff; }
    .set-group { display: flex; align-items: center; gap: 1.7cqw; height: 55%; white-space: nowrap; }
    .set-label { color: #c1cfcd; font-size: 1.65cqw; font-weight: 700; line-height: 1; }
    .set-value { display: block; padding-left: 1.7cqw; border-left: .25cqw solid #397a78; color: #fff; font-size: 2.8cqw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint,
    .point-slot:has(> .isMatchPoint[style*="opacity:1"]) > .isGamePoint { opacity: 0 !important; }
    @media (max-width: 600px) {
      .board { width: 100%; }
      .header { height: 25px; border-bottom-width: 2px; }
      .sport { font-size: 15px; }
      .team { height: 69px; }
      .tick { flex-basis: 5px; margin: 8px 0 8px 5px; }
      .name { padding: 0 5px; font-size: clamp(13px, 3.65vw, 17px); }
      .sets-group { width: 16%; }
      .points-group { width: 22%; margin-right: 2%; }
      .number-label { font-size: 8px; }
      .sets-score { font-size: 22px; }
      .points-score { font-size: 27px; }
      .footer { height: 30px; }
      .set-group { gap: 8px; }
      .set-label { font-size: 11px; }
      .set-value { padding-left: 8px; border-left-width: 2px; font-size: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="stage" data-osb-component="layout">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport" data-osb-component="text">VOLLEYBALL</span></header>
      <div class="teams rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
          <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
          <div class="number-group sets-group columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="number-label" data-osb-component="text">SETS</span><span class="number-value sets-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
          <div class="number-group points-group columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="number-label" data-osb-component="text">POINTS</span><span class="number-value points-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
        </div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
          <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
          <div class="number-group sets-group columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="number-label" data-osb-component="text">SETS</span><span class="number-value sets-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
          <div class="number-group points-group columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="number-label" data-osb-component="text">POINTS</span><span class="number-value points-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
        </div>
      </div>
      <footer class="footer rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="set-group rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="set-label" data-osb-component="text">SET</span><span class="set-value" data-osb-component="text" data-osb-static="true" data-sport-stat="set">0</span></div></footer>
      <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
