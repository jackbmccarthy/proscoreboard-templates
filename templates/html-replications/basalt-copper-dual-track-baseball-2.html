<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Basalt Copper Dual Track horizontal</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#fff}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(96vw,1900px);max-width:100%;min-width:0;container-type:inline-size}
.sport-tag{display:block;align-self:flex-start;flex:none;margin:0 0 .5cqw;color:#fff;font-size:1.45cqw;font-weight:800;line-height:1;letter-spacing:.05em;white-space:nowrap}
.surface{display:flex;flex-direction:column;overflow:hidden;width:100%;min-width:0;border:2px solid #88a2a3;border-radius:8px;background:#26333a}
.competitors{display:flex;min-width:0}
.competitor{display:flex;align-items:stretch;flex:1 1 50%;min-width:0;height:7.3cqw}
.competitor+.competitor{border-left:2px solid #88a2a3}
.name-lane{display:flex;align-items:center;flex:1 1 auto;min-width:0;background:#26333a}
.identity{display:block;flex:none;width:.8cqw;height:63%;margin:0 1.2cqw;background:#91adb0}
.jerseyColorB{background:#91adb0}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .2cqw;color:#fff;font-size:3.55cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.number-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;min-width:0}
.hits-cell{width:14%;background:#dce2df;color:#23343a}
.runs-cell{width:19%;background:#87473a;color:#fff}
.cell-label{display:block;flex:none;color:inherit;font-size:1.45cqw;font-weight:700;line-height:1;white-space:nowrap}
.number{display:block;max-width:100%;overflow:hidden;text-align:center;font-size:4.2cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.utility{display:flex;align-items:center;justify-content:center;flex:none;height:3.3cqw;min-width:0;border-top:2px solid #88a2a3;color:#dce2df}
.stat{display:flex;align-items:baseline;justify-content:center;gap:.9cqw;flex:0 1 auto;min-width:0;padding:0 2.5cqw;font-size:1.4cqw;font-weight:700;line-height:1;white-space:nowrap}
.stat+.stat{border-left:2px solid #9ab0b0}
.stat strong{color:#fff;font-size:1.6cqw;font-variant-numeric:tabular-nums}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%}.sport-tag{margin-bottom:5px;font-size:13px}.surface{border-width:1px;border-radius:4px}.competitor{height:70px}.competitor+.competitor{border-left-width:1px}.identity{width:3px;height:62%;margin:0 4px}.name{font-size:clamp(12px,3.5vw,18px)}.hits-cell{width:22%}.runs-cell{width:27%}.cell-label{font-size:8px}.number{font-size:clamp(18px,5vw,25px)}.utility{height:36px;border-top-width:1px}.stat{font-size:clamp(8px,2.2vw,10px);gap:2px;padding:0 4px}.stat+.stat{border-left-width:1px}.stat strong{font-size:clamp(9px,2.5vw,11px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Baseball scoreboard"><span class="sport-tag" data-osb-component="text">BASEBALL</span><div class="surface columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="number-cell hits-cell columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="cell-label" data-osb-component="text">HITS</span><strong class="number" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong></div><div class="number-cell runs-cell columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="cell-label" data-osb-component="text">RUNS</span><strong class="number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="number-cell hits-cell columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="cell-label" data-osb-component="text">HITS</span><strong class="number" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong></div><div class="number-cell runs-cell columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="cell-label" data-osb-component="text">RUNS</span><strong class="number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
</div><div class="utility rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static baseball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div></article></main></body></html>
