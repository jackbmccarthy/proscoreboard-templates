<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indigo Open Data Lane — Basketball compact</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6px}.board{width:min(74vw,1340px);aspect-ratio:3.72;display:flex;flex-direction:column;overflow:hidden;border:2px solid #7ea6aa;background:#1b2d3b;color:#f0f2ed;container-type:inline-size;font-variant-numeric:tabular-nums}.header{flex:0 0 20%;display:flex;align-items:center;gap:2.3%;padding:0 1.9%;min-height:0;border-bottom:2px solid #82a8ac;white-space:nowrap}.sport-tag{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:2.1cqw;font-weight:700;letter-spacing:.025em}.stat{display:flex;align-items:baseline;gap:.46em;flex:none;font-size:1.55cqw;font-weight:700}.stat-label{color:#92b3b1;letter-spacing:.04em}.stat-value{color:#fff;font-size:1.25em;font-variant-numeric:tabular-nums}.teams{flex:1 1 0;min-height:0;display:flex;flex-direction:column}.team{display:flex;flex:1 1 0;min-height:0}.team+.team{border-top:2px solid #82a8ac}.name-lane{display:flex;align-items:center;gap:3.5%;flex:1 1 0;min-width:0;padding:0 1.8%}.identity{flex:none;width:2%;height:64%;background:#18a8f6}.jerseyColorB{background:#f52d53}.name{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:5.3cqw;font-weight:700;line-height:1.02;letter-spacing:.025em;text-transform:uppercase}.combinedAName:empty:before{content:"Team A"}.combinedBName:empty:before{content:"Team B"}.data-lane{flex:0 0 24%;display:flex;align-items:center;gap:5%;min-width:0;padding:0 3%;border-left:2px solid #82a8ac;background:transparent}.score-label{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap;font-size:1.72cqw;font-weight:700;color:#92b3b1;letter-spacing:.04em}.score{flex:0 0 35%;min-width:0;overflow:hidden;white-space:nowrap;text-align:right;color:#fff;font-size:7.2cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}@media(max-width:520px){.board{width:100%;border-width:1px;aspect-ratio:3.3}.header,.team+.team,.data-lane{border-width:1px}.stat{font-size:1.65cqw}.sport-tag{font-size:2.4cqw}.name{font-size:5cqw}.score-label{font-size:1.8cqw}.score{font-size:8.2cqw}.identity{width:3px}.data-lane{flex-basis:25%;gap:2%;padding:0 2%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.data-lane .score{flex:0 0 60%;font-size:5.9cqw}@media(max-width:520px){.header .stat{font-size:8px}.header .sport-tag{font-size:10px}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Basketball scoreboard">
<div class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">BASKETBALL</span><div class="stat" data-osb-component="layout"><span class="stat-label" data-osb-component="text">CLOCK</span><span class="stat-value" data-osb-component="text" data-sport-stat="clock" data-osb-static="true">00:00</span></div><div class="stat" data-osb-component="layout"><span class="stat-label" data-osb-component="text">PERIOD</span><span class="stat-value" data-osb-component="text" data-sport-stat="period" data-osb-static="true">0</span></div><div class="stat" data-osb-component="layout"><span class="stat-label" data-osb-component="text">SHOT</span><span class="stat-value" data-osb-component="text" data-sport-stat="shot" data-osb-static="true">00</span></div></div>
<div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane" data-osb-component="layout"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="data-lane" data-osb-component="layout"><span class="score-label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane" data-osb-component="layout"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="data-lane" data-osb-component="layout"><span class="score-label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
