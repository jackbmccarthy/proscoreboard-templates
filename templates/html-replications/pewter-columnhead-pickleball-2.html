<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleball — Pewter Columnhead Lower Third</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--line:#809aa1;--ink:#1c2d35;--pale:#dce5e6;--game:#d9e4e6;--point:#bdd2d7;position:relative;width:min(90vw,1955px);min-width:0;padding-left:12%;container-type:inline-size}
.sport-tag{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;width:12.3%;height:4cqw;min-height:42px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:5px;background:var(--ink);color:#edf4f4;font-size:1.43cqw;line-height:1;font-weight:700;white-space:nowrap}
.surface{display:flex;min-width:0;height:6.25cqw;min-height:102px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--pale)}
.side{display:flex;flex:1 1 50%;min-width:0;flex-direction:column}
.side+.side{border-left:2px solid #7d9297}
.side-head{display:flex;flex:0 0 30%;min-height:0}
.head-spacer{flex:1 1 auto;min-width:0}
.head-cell{display:flex;flex:0 0 16%;align-items:center;justify-content:center;border-left:1px solid var(--line);background:var(--ink);color:#edf4f4;font-size:1.35cqw;line-height:1;font-weight:700}
.head-cell.point{flex-basis:21%;border-right:1px solid var(--line)}
.side-body{display:flex;flex:1 1 auto;min-height:0;min-width:0;align-items:stretch;border-top:1px solid var(--line)}
.identity-wrap{display:flex;flex:0 0 4.3%;align-items:center;justify-content:center}
.identity{display:block;width:50%;height:86%;background:#187ad7}
.jerseyColorB{background:#e7323f}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.7cqw;padding:0 1.4cqw;color:var(--ink)}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:3.2cqw;line-height:1;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .42cqw;width:.42cqw;height:.42cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--ink)}
.score-cell{display:flex;flex:0 0 16%;min-width:0;align-items:center;justify-content:center;border-left:1px solid var(--line);background:var(--game)}
.score-cell.point{flex-basis:21%;background:var(--point)}
.score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;color:var(--ink);font-size:3.5cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.score-cell.game .score{font-size:3.2cqw}
.point-slot{position:absolute;right:0;bottom:100%;width:150px;height:18px;color:#fff;text-align:center;font-size:10px;font-weight:700}
.point-state{position:absolute;inset:0;display:block;background:var(--ink);padding:3px 4px}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw;padding-left:0;padding-top:26px}.sport-tag{top:0;transform:none;width:111px;height:26px;font-size:11px}.surface{height:75px;min-height:75px}.head-cell{font-size:7px;flex-basis:17%}.head-cell.point{flex-basis:22%}.identity-wrap{flex-basis:6%}.identity{width:4px;height:70%}.name-lane{gap:2px;padding:0 4px}.name{font-size:14px}.serve{flex-basis:5px;width:5px;height:5px;min-width:5px;min-height:5px}.score-cell{flex-basis:17%}.score-cell.point{flex-basis:22%}.score{font-size:25px}.score-cell.game .score{font-size:21px}.point-slot{height:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sport-tag">PICKLEBALL</div><div class="surface rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><section class="side side-a columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="side-head rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="head-spacer"></span><span class="head-cell game">GAMES</span><span class="head-cell point">POINTS</span></div><div class="side-body rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="score-cell game"><span class="score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="score-cell point"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div></section><section class="side side-b columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="side-head rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="head-spacer"></span><span class="head-cell game">GAMES</span><span class="head-cell point">POINTS</span></div><div class="side-body rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="score-cell game"><span class="score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="score-cell point"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></section></div><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body></html>
