<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spruce Pearl Leadnote Volleyball 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(83vw,1760px);max-width:100%;overflow:hidden;border-radius:5px;background:#28443f;color:#f9fbf8;container-type:inline-size}
.lanes{display:flex;flex-direction:row;min-width:0}
.lane{display:flex;align-items:stretch;flex:1 1 0;width:50%;height:10.15cqw;min-width:0;background:#28443f}
.lane+.lane{border-left:2px solid #a7bcb4}
.tick{flex:0 0 3.5%;min-width:0;background:#3185aa;border-right:4px solid #28443f}
.jerseyColorB{background:#c96d70}
.scorecap{display:flex;align-items:center;justify-content:center;flex:0 0 24%;min-width:0;flex-direction:column;gap:1px;background:#e4e9e3;color:#28443f;font-variant-numeric:tabular-nums}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(36px,5.1cqw,90px);font-weight:800;line-height:1.12;text-align:center}
.score-caption{display:block;max-width:100%;overflow:hidden;font-size:clamp(10px,1.35cqw,23px);font-weight:750;line-height:1;white-space:nowrap}
.name-lane{display:flex;justify-content:center;flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:0 5%;background:#28443f}
.support{display:flex;align-items:baseline;gap:.48em;min-width:0;white-space:nowrap}
.support-label{font-size:clamp(12px,1.65cqw,30px);font-weight:500;line-height:1}
.support-score{display:block;max-width:4ch;overflow:hidden;font-size:clamp(16px,1.9cqw,34px);font-weight:750;line-height:1;font-variant-numeric:tabular-nums}
.name{display:block;min-width:0;overflow:hidden;font-size:clamp(30px,4.1cqw,72px);font-weight:750;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.footer{display:flex;align-items:center;min-width:0;height:4.05cqw;gap:2.7%;padding:0 1.9%;background:#e4e9e3;color:#28443f;white-space:nowrap}
.sport{font-size:clamp(17px,2.25cqw,40px);font-weight:750;line-height:1}
.footer-rule{align-self:center;flex:0 0 2px;height:68%;background:#a7bcb4}
.set-status{display:flex;align-items:baseline;gap:.35em;font-size:clamp(16px,1.95cqw,34px);font-weight:600;line-height:1}
.set-number{font-variant-numeric:tabular-nums}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){
 .stage{padding:6px}
 .board{width:100%}
 .lanes{flex-direction:column}
 .lane{flex:0 0 auto;width:100%;height:66px}
 .lane+.lane{border-left:0;border-top:1px solid #a7bcb4}
 .tick{flex-basis:9px;border-right-width:2px}
 .scorecap{flex-basis:74px}
 .score{font-size:43px}
 .score-caption{font-size:11px}
 .name-lane{gap:2px;padding:0 12px}
 .support-label{font-size:11px}.support-score{font-size:16px}
 .name{font-size:clamp(19px,6.4vw,27px)}
 .footer{height:36px;gap:14px;padding:0 12px}
 .sport{font-size:15px}.set-status{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout" data-osb-component-type="osb-column-container">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="scorecap" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="score-caption" data-osb-component="text">POINTS</span></div><div class="name-lane" data-osb-component="layout"><div class="support" data-osb-component="layout"><span class="support-label" data-osb-component="text">SETS</span><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div></div>
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="scorecap" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="score-caption" data-osb-component="text">POINTS</span></div><div class="name-lane" data-osb-component="layout"><div class="support" data-osb-component="layout"><span class="support-label" data-osb-component="text">SETS</span><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div></div>
  </div>
  <div class="footer rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport" data-osb-component="text">VOLLEYBALL</span><span class="footer-rule" aria-hidden="true"></span><span class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="set-number" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></span></div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
