<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PICKLEBALL · Oat Graphite Eyebrow</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#293238}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent}
.board{width:60vw;max-width:1180px;min-width:0;overflow:hidden;border:1px solid #8a9291;border-radius:5px;background:#e8e2d7;container-type:inline-size}
.board.horizontal{width:86vw;max-width:1780px}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{height:12cqw;min-height:78px;display:flex;align-items:stretch;min-width:0;flex:0 0 auto;background:#e8e2d7}
.lane+.lane{border-top:1px solid #8a9291}
.identity{display:block;flex:0 0 1.8cqw;min-width:6px;background:#2888c8}
.jerseyColorB{background:#ed6963}
.namebed{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.45cqw;padding:0 3cqw;overflow:hidden}
.eyebrow{display:flex;align-items:baseline;gap:1.1cqw;min-width:0;white-space:nowrap;color:#293238;line-height:1.05}
.eyebrow-label{font-size:2.1cqw;font-weight:700;letter-spacing:.015em}
.support-number{font-size:2.6cqw;font-weight:700;font-variant-numeric:tabular-nums}
.name-line{display:flex;align-items:center;gap:1cqw;min-width:0}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.2cqw;font-weight:700;line-height:1.1}
.combinedAName:empty::before{content:"Player A"}
.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 1.7cqw;width:1.7cqw;text-align:center;color:#293238;font-size:1.55cqw;line-height:1}
.primary-track{flex:0 0 24%;width:24%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#293238;color:#fff}
.primary-number{display:block;max-width:100%;font-size:6.5cqw;font-weight:700;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.primary-caption{display:block;margin-top:.35cqw;font-size:1.8cqw;font-weight:700;line-height:1.1;letter-spacing:.012em;white-space:nowrap}
.utility{position:relative;height:5.5cqw;min-height:36px;display:flex;align-items:center;padding:0 2.7cqw;background:#293238;color:#fff;border-top:1px solid #8a9291}
.sport-tag{font-size:2.8cqw;font-weight:700;line-height:1;letter-spacing:.012em;white-space:nowrap}
.point-slot{position:absolute;right:2.5cqw;top:50%;transform:translateY(-50%);width:20cqw;height:2em;text-align:right;pointer-events:none}
.point-state{position:absolute;inset:0;background:#293238;color:#fff;font-size:1.3cqw;font-weight:700;line-height:2em;white-space:nowrap}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.horizontal .lanes{flex-direction:row}
.horizontal .lane{height:9.5cqw;flex:1 1 50%}
.horizontal .lane+.lane{border-top:0;border-left:1px solid #8a9291}
.horizontal .identity{flex-basis:1.7cqw}
.horizontal .namebed{padding:0 2cqw;gap:.15cqw}
.horizontal .eyebrow-label{font-size:1.4cqw}
.horizontal .support-number{font-size:1.8cqw}
.horizontal .name{font-size:3.45cqw}
.horizontal .serve{flex-basis:1.2cqw;width:1.2cqw;font-size:1.1cqw}
.horizontal .primary-track{flex-basis:23%;width:23%}
.horizontal .primary-number{font-size:4.6cqw}
.horizontal .primary-caption{font-size:1.35cqw}
.horizontal .utility{height:3.5cqw}
.horizontal .sport-tag{font-size:1.9cqw}
.horizontal .point-state{font-size:.9cqw}
@media(max-width:650px){
 .board,.board.horizontal{width:94vw}
 .lanes,.horizontal .lanes{flex-direction:column}
 .lane,.horizontal .lane{height:21cqw;min-height:76px;flex:0 0 auto}
 .lane+.lane,.horizontal .lane+.lane{border-left:0;border-top:1px solid #8a9291}
 .identity,.horizontal .identity{flex-basis:2cqw}
 .namebed,.horizontal .namebed{padding:0 3cqw;gap:.2cqw}
 .eyebrow-label,.horizontal .eyebrow-label{font-size:3cqw}
 .support-number,.horizontal .support-number{font-size:3.5cqw}
 .name,.horizontal .name{font-size:6.1cqw}
 .serve,.horizontal .serve{flex-basis:2.1cqw;width:2.1cqw;font-size:2cqw}
 .primary-track,.horizontal .primary-track{flex-basis:25%;width:25%}
 .primary-number,.horizontal .primary-number{font-size:10.5cqw}
 .primary-caption,.horizontal .primary-caption{font-size:2.65cqw;margin-top:.1cqw}
 .utility,.horizontal .utility{height:10cqw;min-height:36px;padding:0 3cqw}
 .sport-tag,.horizontal .sport-tag{font-size:4.2cqw}
 .point-slot{right:3cqw;width:25cqw}
 .point-state,.horizontal .point-state{font-size:2cqw}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage"><article class="board columnContainer paired" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
    <div class="lane rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA" aria-hidden="true"></span>
      <div class="namebed">
        <div class="eyebrow"><span class="eyebrow-label">GAMES</span><span class="support-number currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
        <div class="name-line"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true" aria-label="Serving">●</span></div>
      </div>
      <div class="primary-track"><span class="primary-number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption">POINTS</span></div>
    </div>
    <div class="lane rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB" aria-hidden="true"></span>
      <div class="namebed">
        <div class="eyebrow"><span class="eyebrow-label">GAMES</span><span class="support-number currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
        <div class="name-line"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;" aria-label="Serving">●</span></div>
      </div>
      <div class="primary-track"><span class="primary-number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption">POINTS</span></div>
    </div>
  </div>
  <footer class="utility"><div class="sport-tag">PICKLEBALL</div><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></footer>
</article></main>
</body>
</html>
