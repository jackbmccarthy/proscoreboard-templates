<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleball — Cedar Ivory Namefoot Scorebug</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--cedar:#253b37;--ivory:#e8e3d8;--white:#f3f0e8;--muted:#b8c7c0;--rule:#627973;display:flex;flex-direction:column;width:min(58.5vw,1160px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:3px;background:var(--cedar);color:var(--white);container-type:inline-size}
.rows{display:flex;flex:1 1 auto;min-width:0;flex-direction:column}
.row{display:flex;flex:1 1 50%;min-width:0;min-height:13.4cqw;align-items:stretch}
.row+.row{border-top:1px solid var(--rule)}
.identity-wrap{display:flex;flex:0 0 5%;align-items:center;justify-content:center;padding:2cqw 0}
.identity{display:block;flex:0 0 1.5cqw;width:1.5cqw;height:100%;min-width:5px;background:#2378a9}
.jerseyColorB{background:#ca6060}
.namefoot{display:flex;flex:1 1 auto;min-width:0;flex-direction:column;justify-content:center;gap:.45cqw;padding:0 1.5cqw}
.name-row{display:flex;min-width:0;align-items:center;gap:.8cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.3cqw;line-height:1.05;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .65cqw;width:.65cqw;height:.65cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--white)}
.support{display:flex;min-width:0;align-items:baseline;gap:.55cqw;color:var(--muted);line-height:1}
.support-label{font-size:2.4cqw;font-weight:700;letter-spacing:.02em}.support-score{font-size:2.5cqw;font-weight:700;font-variant-numeric:tabular-nums}
.scorecap{display:flex;flex:0 0 16.2%;width:16.2%;min-width:0;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--rule);background:var(--ivory);color:var(--cedar)}
.score-label{display:block;max-width:100%;overflow:hidden;font-size:2.3cqw;line-height:1;font-weight:700}
.score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:7.4cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.sport-line{position:relative;display:flex;flex:0 0 auto;height:4.8cqw;align-items:center;padding:0 1.8cqw;border-top:1px solid var(--rule);font-size:2.6cqw;line-height:1;font-weight:700;white-space:nowrap}
.point-slot{position:absolute;right:2%;top:0;width:22%;height:100%;font-size:1.15cqw;color:var(--white);font-weight:700;text-align:center}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--cedar)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.row{min-height:86px}.identity-wrap{flex-basis:6px;padding:8px 0}.identity{flex-basis:5px;width:5px}.namefoot{gap:4px;padding:0 7px}.name-row{gap:3px}.name{font-size:20px}.serve{flex-basis:6px;width:6px;height:6px}.support{gap:4px}.support-label{font-size:12px}.support-score{font-size:13px}.scorecap{flex-basis:22%;width:22%}.score-label{font-size:10px}.score{font-size:38px}.sport-line{height:30px;padding:0 10px;font-size:14px}.point-slot{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="rows columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><div class="namefoot"><div class="name-row"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="support"><span class="support-label">GAMES</span><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div><div class="scorecap"><span class="score-label">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><div class="namefoot"><div class="name-row"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="support"><span class="support-label">GAMES</span><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div><div class="scorecap"><span class="score-label">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></div><div class="sport-line"><span>PICKLEBALL</span><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div></article></main></body></html>
