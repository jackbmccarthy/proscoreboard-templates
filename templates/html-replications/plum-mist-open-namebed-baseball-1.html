<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASEBALL · Plum Mist Open Namebed</title><style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f9f7f7}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px;background:transparent}
.board{width:min(62vw,1200px);min-width:0;overflow:hidden;border:1px solid #6d6672;border-radius:4px;background:#403943;container-type:inline-size;font-variant-numeric:tabular-nums}
.board.horizontal{width:min(80vw,1600px)}
.utility{display:flex;align-items:center;justify-content:space-between;gap:1.5cqw;height:5.6cqw;min-height:0;padding:0 1.2cqw;border-bottom:1px solid #aba3ad;background:#403943;white-space:nowrap}
.sport-tab{display:flex;align-items:center;justify-content:center;flex:0 0 21%;min-width:0;height:78%;padding:0 1cqw;border-radius:3px;background:#e7e5e6;color:#403943;font-size:2.25cqw;font-weight:700;line-height:1}
.status{display:flex;align-items:center;justify-content:flex-end;min-width:0;flex:1 1 0}
.status-item{display:flex;align-items:baseline;justify-content:center;gap:.65cqw;min-width:0;padding:0 1.45cqw;border-left:1px solid #aba3ad;font-size:1.55cqw;font-weight:700;line-height:1}
.status-item:first-child{border-left:0}
.status-item:last-child{padding-right:0}
.status-value{font-size:1.2em;font-weight:700;font-variant-numeric:tabular-nums}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{display:flex;align-items:stretch;min-width:0;height:10.8cqw;background:#403943}
.lane+.lane{border-top:1px solid #aba3ad}
.identity{display:block;flex:0 0 1.55cqw;min-width:6px;margin:.3cqw 0;background:#3186a8;border-radius:2px}
.jerseyColorB{background:#c96b71}
.namebed{display:flex;flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:.8cqw;overflow:hidden;padding:0 2.35cqw}
.name{display:block;flex:0 0 auto;width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:4.8cqw;font-weight:700;line-height:1.08}
.combinedAName:empty::before{content:'Team A'}
.combinedBName:empty::before{content:'Team B'}
.support{display:flex;align-items:baseline;gap:1cqw;min-width:0;color:#f9f7f7;font-size:2cqw;font-weight:700;line-height:1}
.support-number{font-size:1.15em;font-weight:700;font-variant-numeric:tabular-nums}
.primary-track{display:flex;align-items:center;justify-content:center;flex:0 0 14%;width:14%;min-width:0;flex-direction:column;overflow:hidden;margin:.65cqw 1.2cqw .65cqw 0;color:#f9f7f7;text-align:center;background:#403943}
.with-divider .primary-track{border-left:1px solid #aba3ad}
.primary-number{display:block;max-width:100%;font-size:6.4cqw;font-weight:700;line-height:.9;white-space:nowrap;font-variant-numeric:tabular-nums}
.primary-caption{display:block;margin-top:.55cqw;font-size:1.85cqw;font-weight:700;line-height:1;white-space:nowrap}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*='opacity: 1'])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*='opacity:1'])>.isGamePoint{opacity:0!important}
.horizontal .utility{height:3.65cqw;padding:0 .8cqw}
.horizontal .sport-tab{flex-basis:15%;font-size:1.65cqw}
.horizontal .status{justify-content:flex-start}
.horizontal .status-item{font-size:1.25cqw;padding:0 1.35cqw}
.horizontal .lanes{flex-direction:row}
.horizontal .lane{height:9cqw;flex:1 1 50%}
.horizontal .lane+.lane{border-top:0;border-left:1px solid #aba3ad}
.horizontal .identity{flex-basis:1.1cqw;margin:.55cqw 0 .55cqw .55cqw}
.horizontal .namebed{gap:.65cqw;padding:0 2cqw}
.horizontal .name{font-size:3.5cqw}
.horizontal .support{font-size:1.55cqw;gap:.7cqw}
.horizontal .primary-track{flex-basis:19%;width:19%;margin:.55cqw .85cqw .55cqw 0}
.horizontal .primary-number{font-size:5.25cqw}
.horizontal .primary-caption{font-size:1.45cqw;margin-top:.35cqw}
@media(max-width:650px){
 .board,.board.horizontal{width:94vw;container-type:normal}
 .utility,.horizontal .utility{height:55px;gap:4px;padding:4px 5px}
 .sport-tab,.horizontal .sport-tab{flex:0 0 88px;height:33px;padding:0 2px;font-size:12px}
 .status,.horizontal .status{justify-content:space-around;flex:1 1 0}
 .status-item,.horizontal .status-item{flex:0 1 auto;gap:2px;padding:0 3px;font-size:10px}
 .status-item:first-child{padding-left:0}
 .status-item:last-child{padding-right:0}
 .status-value{font-size:10px}
 .lanes,.horizontal .lanes{flex-direction:column}
 .lane,.horizontal .lane{height:96px;flex:0 0 auto}
 .lane+.lane,.horizontal .lane+.lane{border-left:0;border-top:1px solid #aba3ad}
 .identity,.horizontal .identity{flex-basis:7px;min-width:7px;margin:3px 0}
 .namebed,.horizontal .namebed{gap:8px;padding:0 12px}
 .name,.horizontal .name{font-size:clamp(21px,6.7vw,27px)}
 .support,.horizontal .support{font-size:11px;gap:5px}
 .primary-track,.horizontal .primary-track{flex-basis:27%;width:27%;margin:6px 5px 6px 0}
 .primary-number,.horizontal .primary-number{font-size:45px}
 .primary-caption,.horizontal .primary-caption{font-size:11px;margin-top:3px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer with-divider" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="baseball scoreboard">
 <header class="utility rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tab" data-osb-component="text">BASEBALL</span><div class="status" data-osb-component="layout"><span class="status-item" data-osb-component="layout"><span data-osb-component="text">INNING</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="status-item" data-osb-component="layout"><span data-osb-component="text">BALLS</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span></span><span class="status-item" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span><span class="status-item" data-osb-component="layout"><span data-osb-component="text">OUTS</span><span class="status-value" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span></span></div></header>
 <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="lane rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container">

  <div class="namebed" data-osb-component="layout"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="support" data-osb-component="layout"><span data-osb-component="text">HITS</span><span class="support-number" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span></div></div>

 </div><div class="lane rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
  <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB" aria-hidden="true"></span>
  <div class="namebed" data-osb-component="layout"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="support" data-osb-component="layout"><span data-osb-component="text">HITS</span><span class="support-number" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span></div></div>
  <div class="primary-track" data-osb-component="layout"><span class="primary-number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption" data-osb-component="text">RUNS</span></div>
  <span class="hidden-match currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore" hidden>0</span>
 </div></div>
 <div class="point-slot" data-osb-component="layout" hidden><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
 </article></main></body></html>
