<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staircase Stencil PICKLEBALL 2</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{font-family:Arial,Helvetica,sans-serif;font-weight:700;color:#f4efe4}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}.board{width:min(var(--view-width),1500px,var(--height-width));position:relative;container-type:inline-size;display:flex;flex-direction:column;background:transparent;padding-bottom:3.5cqw}.header{font-size:var(--header-font);letter-spacing:var(--header-tracking);text-align:center;line-height:1;margin:0 0 var(--header-gap);white-space:nowrap}.steps,.rows,.row,.step,.name-lane,.primary{min-width:0}.steps,.rows{width:100%;display:flex;flex-direction:column}.name-lane{position:relative}.name-color{min-width:0;max-width:100%;width:100%;background-color:#cc6440;background-clip:text;-webkit-background-clip:text}.name{display:block;width:100%;max-width:100%;min-width:0;font-size:var(--name-font);line-height:1.08;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:transparent;-webkit-text-fill-color:transparent;letter-spacing:-.035em}.combinedAName:empty:before{content:"Player A"}.combinedBName:empty:before{content:"Player B"}.serve{position:absolute;right:.2cqw;top:-1.3cqw;width:1.2cqw;height:1.2cqw;font-size:1.2cqw}.primary{display:flex;flex-direction:column;align-items:stretch;width:100%;flex-shrink:0}.score{display:block;width:100%;min-width:0;font-family:"Arial Black",Arial,Helvetica,sans-serif;font-size:var(--score-font);font-weight:900;line-height:.8;letter-spacing:-.065em;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;mask-image:linear-gradient(to bottom,#000 0 34%,transparent 34% 39%,#000 39% 66%,transparent 66% 71%,#000 71% 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0 34%,transparent 34% 39%,#000 39% 66%,transparent 66% 71%,#000 71% 100%)}.footer{position:relative;width:100%;margin-top:var(--footer-gap);height:var(--footer-height)}.label{font-size:var(--label-font);line-height:1.1;text-align:center;white-space:nowrap}.secondary{position:absolute;right:calc(50% + 10cqw);bottom:0;width:15cqw;display:flex;align-items:center;justify-content:center;gap:.6cqw;font-size:var(--games-font);line-height:1.1;white-space:nowrap}.match-score{display:block;min-width:1.5ch;text-align:center;font-variant-numeric:tabular-nums}.point-slot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34cqw;height:2.5cqw;font-size:1.9cqw;text-align:center}.point{position:absolute;inset:0}.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint{opacity:0!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.board{--view-width:82vw;--height-width:113vh;--header-font:4cqw;--header-tracking:.8cqw;--header-gap:5.7cqw;--name-font:12.1cqw;--score-font:33.8cqw;--footer-gap:2.4cqw;--footer-height:3.5cqw;--label-font:3.4cqw;--games-font:2.8cqw}.rows{gap:7cqw;padding:0 4cqw}.row{display:flex;width:100%;align-items:center;gap:4cqw}.row:last-child{flex-direction:row-reverse}.row .name-lane{flex:1 1 0;text-align:center}.row .primary{flex:0 0 44cqw;width:44cqw}.row .secondary{right:calc(50% + 9cqw);width:15cqw}@media(max-width:600px){.board{--view-width:94vw}.point-slot{font-size:2.2cqw}}
.board{--height-width:108vh}
.board{--name-font:10.4cqw}

/* Reserved conditional match states: all score and name tracks remain fixed. */
.osb-conditional-rail{--osb-rail-bg:#d96d4a;--osb-rail-fg:#f9fbfa;box-sizing:border-box!important;position:relative!important;inset:auto!important;transform:none!important;grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:28px!important;height:28px!important;margin:0!important;padding:2px 7px!important;gap:5px!important;overflow:hidden!important;background:var(--osb-rail-bg)!important;color:var(--osb-rail-fg)!important;border:0!important;font:700 11px/1 Arial,Helvetica,sans-serif!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-condition-side{all:unset!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;flex:1 1 35%!important;width:35%!important;min-width:0!important;height:22px!important;gap:2px!important;position:relative!important;overflow:hidden!important}
.osb-conditional-rail .osb-condition-side-b{justify-content:flex-end!important}
.osb-conditional-rail .osb-condition-slot{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 21px!important;width:21px!important;height:18px!important;position:relative!important}
.osb-conditional-rail .osb-condition-timeoutused{flex-basis:21px!important;width:21px!important}
.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:17px!important;width:17px!important}
.osb-conditional-rail .osb-condition-badge{box-sizing:border-box!important;align-items:center!important;justify-content:center!important;width:100%!important;height:18px!important;min-width:0!important;margin:0!important;padding:0 2px!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:2px!important;background:rgba(255,255,255,.12)!important;color:var(--osb-rail-fg)!important;font:800 9px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-timeout-icon{position:relative!important;display:flex;align-items:center!important;justify-content:center!important;padding:0!important;color:var(--osb-rail-fg)!important}
.osb-conditional-rail .osb-timeout-icon::before{content:""!important;display:block!important;width:11px!important;height:11px!important;border:1.5px solid currentColor!important;border-radius:50%!important;background:transparent!important}
.osb-conditional-rail .osb-timeout-icon::after{content:""!important;position:absolute!important;left:50%!important;top:3px!important;width:3px!important;height:6px!important;border-left:1.5px solid currentColor!important;border-bottom:1.5px solid currentColor!important;transform:translateX(-25%) rotate(-35deg)!important;transform-origin:bottom left!important}
.osb-conditional-rail .isATimeOutActive,.osb-conditional-rail .isBTimeOutActive{background:#f3d27a!important;color:#253641!important;border-color:#f3d27a!important}
.osb-conditional-rail .isATimeOutUsed,.osb-conditional-rail .isBTimeOutUsed{background:transparent!important;color:#b8c7ca!important;border-color:#b8c7ca!important}
.osb-conditional-rail .isAYellowCarded,.osb-conditional-rail .isBYellowCarded{background:#e5c94e!important;color:#253641!important;border-color:#e5c94e!important}
.osb-conditional-rail .isARedCarded,.osb-conditional-rail .isBRedCarded{background:#c94747!important;color:#fff!important;border-color:#c94747!important}
.osb-conditional-rail .point-slot.osb-shared-point{all:unset!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30%!important;width:30%!important;min-width:78px!important;max-width:130px!important;height:22px!important;min-height:22px!important;inset:auto!important;margin:0!important;padding:0!important;transform:none!important;overflow:hidden!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important}
.osb-conditional-rail .point-slot.osb-shared-point>.isGamePoint,.osb-conditional-rail .point-slot.osb-shared-point>.isMatchPoint{box-sizing:border-box!important;position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;transform:none!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:390px){.osb-conditional-rail{padding:2px 4px!important;gap:3px!important}.osb-conditional-rail .osb-condition-side{gap:1px!important}.osb-conditional-rail .osb-condition-slot{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-timeoutused{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:15px!important;width:15px!important}.osb-conditional-rail .point-slot.osb-shared-point{min-width:76px!important}}

</style></head>
<body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><h1 class="header">PICKLEBALL</h1><div class="rows columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane"><div class="name-color jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true">●</span></div><div class="primary"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><div class="footer"><div class="label">POINTS</div><div class="secondary"><span>GAMES</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane"><div class="name-color jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;">●</span></div><div class="primary"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><div class="footer"><div class="label">POINTS</div><div class="secondary"><span>GAMES</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div></div></div></div><div class="osb-conditional-rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Conditional match states"><div class="osb-condition-side osb-condition-side-a" data-osb-component="layout"><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div><span class="point-slot osb-shared-point" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><div class="osb-condition-side osb-condition-side-b" data-osb-component="layout"><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-ba
