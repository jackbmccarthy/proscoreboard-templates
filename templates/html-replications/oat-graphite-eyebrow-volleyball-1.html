<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Oat Graphite Eyebrow 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(96vw,1088px);height:390px;max-width:100%;overflow:hidden;border-radius:5px;background:#e8e2d7;color:#293238;container-type:inline-size}
.lanes{display:flex;flex:1 1 auto;min-height:0;flex-direction:column}
.lane{display:flex;align-items:stretch;flex:1 1 0;min-width:0;min-height:0}
.lane+.lane{border-top:2px solid #8c9696}
.identity{display:block;align-self:stretch;flex:0 0 3.3%;background:#2f88a8}
.jerseyColorB{background:#c46e6b}
.name-lane{display:flex;justify-content:center;flex:1 1 auto;min-width:0;flex-direction:column;gap:5px;padding:4px 4%;background:#e8e2d7}
.support{display:flex;align-items:baseline;gap:.38em;min-width:0;white-space:nowrap}
.support-label{font-size:clamp(12px,2.75cqw,30px);font-weight:500;line-height:1}
.support-score{display:block;max-width:4ch;overflow:hidden;font-size:clamp(17px,3.5cqw,38px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.name{display:block;min-width:0;overflow:hidden;font-size:clamp(27px,6.1cqw,68px);font-weight:750;line-height:1.03;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.scorecap{display:flex;align-items:center;justify-content:center;flex:0 0 22.8%;min-width:0;flex-direction:column;gap:4px;background:#293238;color:#f8f7f2;font-variant-numeric:tabular-nums}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(46px,9.6cqw,106px);font-weight:800;line-height:.94;text-align:center}
.score-caption{display:block;max-width:100%;overflow:hidden;font-size:clamp(11px,2.55cqw,28px);font-weight:750;line-height:1;white-space:nowrap}
.footer{display:flex;align-items:center;flex:0 0 19.3%;min-width:0;gap:3.3%;padding:0 3.7%;background:#293238;color:#f8f7f2;white-space:nowrap}
.sport{font-size:clamp(17px,3.5cqw,39px);font-weight:750;line-height:1}
.footer-rule{align-self:center;width:1px;height:52%;background:#abb7b3}
.set-status{display:flex;align-items:baseline;gap:.35em;font-size:clamp(16px,2.9cqw,32px);line-height:1}
.set-number{font-variant-numeric:tabular-nums}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:6px}
 .board{width:100%;height:182px}
 .lane+.lane{border-top-width:1px}
 .identity{flex-basis:10px}
 .name-lane{gap:3px;padding:3px 12px}
 .support-label{font-size:11px}.support-score{font-size:17px}
 .name{font-size:clamp(19px,6.2vw,27px)}
 .scorecap{flex-basis:25%;gap:2px}
 .score{font-size:clamp(32px,10vw,45px)}
 .score-caption{font-size:clamp(9px,2.7vw,12px)}
 .footer{flex-basis:29px;gap:14px;padding:0 13px}
 .sport{font-size:14px}.set-status{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane" data-osb-component="layout"><div class="support" data-osb-component="layout"><span class="support-label" data-osb-component="text">SETS</span><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="scorecap" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="score-caption" data-osb-component="text">POINTS</span></div></div>
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane" data-osb-component="layout"><div class="support" data-osb-component="layout"><span class="support-label" data-osb-component="text">SETS</span><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="scorecap" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="score-caption" data-osb-component="text">POINTS</span></div></div>
  </div>
  <div class="footer rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport" data-osb-component="text">VOLLEYBALL</span><span class="footer-rule" aria-hidden="true"></span><span class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="set-number" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></span></div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
