<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Indigo Pearl Namebed 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(96vw,1190px);max-width:100%;aspect-ratio:2.9;overflow:hidden;border:1px solid #aebdca;border-radius:4px;background:#292f4b;color:#f8faf9;container-type:inline-size}
.header{display:flex;align-items:center;flex:0 0 18%;min-width:0;gap:3%;padding:0 2%;border-bottom:2px solid #677b92;background:#dfe6e8;color:#292f4b;white-space:nowrap}
.sport-tag{display:block;min-width:0;overflow:hidden;font-size:clamp(14px,3.3cqw,40px);font-weight:750;line-height:1;text-overflow:ellipsis;white-space:nowrap}
.status{display:flex;align-items:center;flex:none;gap:.35em;padding-left:3%;border-left:1px solid #677b92;font-size:clamp(12px,2.9cqw,34px);font-weight:500;line-height:1}
.current-set{font-variant-numeric:tabular-nums}
.lanes{display:flex;flex:1 1 0;min-height:0;flex-direction:column}
.lane{display:flex;align-items:stretch;flex:1 1 0;min-width:0;min-height:0}
.lane+.lane{border-top:2px solid #677b92}
.identity{display:block;align-self:stretch;flex:0 0 2.7%;background:#3184a9}
.jerseyColorB{background:#c87175}
.namebed{display:flex;justify-content:center;flex:1 1 0;min-width:0;flex-direction:column;gap:4%;padding:0 2.5%;background:#292f4b}
.name{display:block;min-width:0;overflow:hidden;font-size:clamp(24px,5.4cqw,64px);font-weight:700;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support{display:flex;align-items:baseline;gap:.35em;min-width:0;line-height:1;white-space:nowrap}
.support-label{color:#f8faf9;font-size:clamp(12px,2.5cqw,30px);font-weight:500;letter-spacing:.08em}
.support-score{display:block;max-width:4ch;overflow:hidden;font-size:clamp(18px,3.5cqw,42px);font-weight:700;font-variant-numeric:tabular-nums}
.scorecap{display:flex;align-items:center;justify-content:center;flex:0 0 19%;min-width:0;flex-direction:column;gap:3%;border-left:2px solid #677b92;background:#dfe6e8;color:#292f4b;font-variant-numeric:tabular-nums}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(45px,8.4cqw,100px);font-weight:800;line-height:1;text-align:center}
.score-label{display:block;max-width:100%;overflow:hidden;font-size:clamp(12px,2.4cqw,29px);font-weight:800;line-height:1;white-space:nowrap}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:6px}
 .board{width:100%;height:166px;aspect-ratio:auto}
 .header{gap:10px;padding:0 9px;border-bottom-width:1px}
 .sport-tag{font-size:clamp(13px,4vw,18px)}
 .status{padding-left:10px;font-size:clamp(11px,3.2vw,15px)}
 .lane+.lane,.scorecap{border-width:1px}
 .identity{flex-basis:6px}
 .namebed{gap:2px;padding:0 9px}
 .name{font-size:clamp(17px,5.2vw,24px)}
 .support-label{font-size:clamp(9px,2.6vw,12px)}
 .support-score{font-size:clamp(14px,4vw,19px)}
 .scorecap{flex-basis:25%;gap:2px}
 .score{font-size:clamp(27px,8vw,37px)}
 .score-label{font-size:clamp(9px,2.5vw,12px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="namebed" data-osb-component="layout"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="support" data-osb-component="layout"><span class="support-label" data-osb-component="text">SETS</span><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div><div class="scorecap" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="score-label" data-osb-component="text">POINTS</span></div></div>
   <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="namebed" data-osb-component="layout"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="support" data-osb-component="layout"><span class="support-label" data-osb-component="text">SETS</span><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div><div class="scorecap" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="score-label" data-osb-component="text">POINTS</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
