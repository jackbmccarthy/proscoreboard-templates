<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Courtside — Daylight</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.flag:not([src]),.tlogo:not([src]){display:none}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isComplete[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isComplete[style*="opacity: 1"])>.isMatchPoint{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.won{position:absolute;z-index:0}
.gs{position:relative;z-index:1}
.gtag .nx{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .now{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{height:100%;overflow:hidden}
.osb-core-fields{display:none!important}
.end[data-osb-resolved-court-side="A"] .isBWinner,.end[data-osb-resolved-court-side="B"] .isAWinner,.end:not([data-osb-resolved-court-side]) :is(.isAWinner,.isBWinner){display:none!important}
.hg:not(:has(.won[style*="opacity: 1"])){position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;padding:0!important;margin:0!important;border:0!important}
.hg .won{display:none}
.name{overflow-wrap:normal;word-break:normal;hyphens:none}
/* status chips flow: an empty chip takes no room, so both ends keep the same packed order */
.to-slot:not(:has(>[style*="opacity: 1"])),.card:not([style*="opacity: 1"]){display:none}
.board:has(.isComplete[style*="opacity: 1"]) .big{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important}

.board{position:fixed;inset:0;display:flex;flex-direction:column;gap:1.6vh;padding:3vh 2vw 1.6vh;font-family:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#17202e;background:#e9e5da;-webkit-font-smoothing:antialiased;overflow:hidden}
.row{display:flex;flex:1 1 auto;min-height:0}
.end{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 9vh minmax(0,1fr) 6.4vh 6.4vh;grid-template-areas:"band band" "who who" "pts pts" "gw hist" "gw marks";column-gap:1.2vw;row-gap:1vh;flex:1 1 0;min-width:0;padding:3.4vh 2.2vw 2.4vh;border-radius:1.6vh;background:#fff;box-shadow:0 .6vh 2.4vh rgba(40,30,10,.18)}
.kit{position:absolute;left:0;right:0;top:0;height:1.6vh;border-radius:1.6vh 1.6vh 0 0;background:#8a93a3}
.tband{grid-area:band;display:none;align-items:center;gap:1.2vw;margin-bottom:1.4vh;padding:0 1.2vw;min-height:7vh;border-radius:.8vh;background:#17202e;color:#fff;font-size:3.4vh;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.board:has(.tname:not(:empty)) .tband{display:flex}
.tband .tlogo{width:5vh;height:5vh;object-fit:contain;flex:0 0 auto}
.tband .tname{flex:1 1 auto;min-width:0;line-height:1.05;overflow-wrap:normal;hyphens:none}
.tband .tie{display:inline-flex;align-items:center;gap:1vw;flex:0 0 auto;height:5.2vh;padding:0 1.2vw;border-radius:.6vh;background:#ffcc00;color:#17202e}
.tband .tie i{font-style:normal;font-size:2.8vh;letter-spacing:.14em}
.tband .tscore{font-size:4.2vh;font-variant-numeric:tabular-nums}
.who{grid-area:who;display:grid;grid-template-columns:auto minmax(0,1fr) 8vh;align-items:center;gap:1.4vw;min-width:0}
.flag{width:7vh;height:4.7vh;object-fit:cover;border-radius:.4vh;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.flag:not([src]){display:block;width:0;margin-right:-1.4vw;box-shadow:none}
.nm{min-width:0}
.name{display:block;font-size:5.2vh;line-height:1.02;font-weight:800;text-transform:uppercase}
.ss{width:8vh;height:8vh}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff8a1c 46%,#d65f00 100%);box-shadow:0 0 0 .5vh rgba(0,0,0,.12),0 .6vh 1.6vh rgba(214,95,0,.45)}
.win{border-radius:50%;background:#1aa260;font-size:0}
.win::after{content:"";width:2vh;height:3.8vh;margin-top:-.8vh;border:solid #fff;border-width:0 1vh 1vh 0;transform:rotate(45deg)}
.pts{grid-area:pts;display:flex;align-items:center;justify-content:center;min-height:0}
.big{font-size:56vh;line-height:.76;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:#17202e}
.gw{grid-area:gw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;width:15vh;border-radius:1.2vh;background:#17202e;color:#fff;font-weight:900;text-transform:uppercase}
.gw i{font-style:normal;font-size:2.4vh;letter-spacing:.2em;line-height:1;color:#c9d0dc}
.gn{font-size:8.4vh;line-height:.9;font-variant-numeric:tabular-nums}
.hist{grid-area:hist;position:relative;display:flex;align-items:center;gap:.6vw;min-width:0}
.hg{display:flex;align-items:center;gap:.5vw;height:6.4vh;padding:0 .9vw;border-radius:.8vh;font-weight:800;font-variant-numeric:tabular-nums;background:#eeeae0;color:#4e586a}
.hl{font-style:normal;font-size:2.6vh;letter-spacing:.08em}
.gs{font-size:4.2vh}
.hist:has(>.hg:nth-child(5):has(.won[style*="opacity: 1"])) .hl{display:none}
.hist:has(>.hg:nth-child(5):has(.won[style*="opacity: 1"])) .hg{padding:0 .7vw}
.hist:has(>.hg:nth-child(5):has(.won[style*="opacity: 1"])) .gs{font-size:3.8vh}
.end[data-osb-resolved-court-side="A"] .hg:has(.wA[style*="opacity: 1"]),.end[data-osb-resolved-court-side="B"] .hg:has(.wB[style*="opacity: 1"]){background:#17202e;color:#fff}
.marks{grid-area:marks;display:flex;align-items:center;gap:.7vw;min-width:0}
.to-slot{width:14vh;height:6vh}
.to-on,.to-used{border-radius:.6vh;font-size:2.6vh;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.to-on{background:#ffcc00;color:#111}
.to-used{background:#e3dfd3;color:#3b4456}
.card{display:inline-flex;align-items:center;gap:.7vw;height:6vh;padding:0 1.3vw 0 .9vw;border-radius:.6vh;font-size:2.6vh;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:#eeeae0;color:#17202e;white-space:nowrap}
.card b{flex:0 0 auto;width:2.9vh;height:4vh;border-radius:.4vh;box-shadow:0 0 0 .2vh rgba(0,0,0,.25)}
.yc b{background:#ffd400}.rc b{background:#e3262f}
/* the spine: a net line between the cards, the game tile on top, the state banner mid-height, the format at its foot */
.spine{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;flex:0 0 14vw;padding:0 0 0}
.spine::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:.5vw;margin-left:-.25vw;background:repeating-linear-gradient(0deg,#17202e 0 .5vh,#bdb6a5 .5vh 1vh);opacity:.55}
.spine>*{position:relative}
.tagslot{width:12vw;height:15vh}
.tagslot>*{flex-direction:column;gap:.6vh;border-radius:1.2vh;font-weight:900;text-transform:uppercase;line-height:1}
.tagslot i{font-style:normal;font-size:3vh;letter-spacing:.16em}
.now,.nx{display:flex;flex-direction:column;align-items:center;gap:.6vh}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:flex}
.cg,.ng,.tagslot b{font-size:7.4vh;letter-spacing:.02em}
.gtag{background:#17202e;color:#fff}
.gtag i{color:#b9c2d3}
.fin{background:#1aa260;color:#fff}
.pre{background:#e9e5da;font-size:6vh;color:#8a8475;letter-spacing:.06em}
.tagslot:has(>.gtag[style*="opacity: 1"]) .pre,.tagslot:has(>.fin[style*="opacity: 1"]) .pre{opacity:0}
.banner{width:13vw;height:13vh}
.bn{border-radius:1.2vh;font-size:3.6vh;font-weight:900;letter-spacing:.1em;text-transform:uppercase;white-space:normal!important;text-align:center;line-height:1.05;padding:0 1vw}
.bn-warm,.bn-break{background:#fff;color:#17202e;box-shadow:inset 0 0 0 .4vh #17202e}
.bn-gp{background:#ff8a1c;color:#111}
.bn-mp{background:#e3262f;color:#fff}
.fmt{display:flex;align-items:center;justify-content:center;width:12vw;min-height:9vh;padding:1vh .8vw;border-radius:1.2vh;background:#e9e5da;box-shadow:inset 0 0 0 .4vh #c9c2b1;font-size:3.2vh;font-weight:900;letter-spacing:.1em;line-height:1.1;text-align:center;text-transform:uppercase;color:#3b4456}
.fmt:has(.bo:empty){visibility:hidden}
.bar{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 7vh;padding:0 26vh}
.info{display:flex;align-items:center;min-width:0;font-size:3.8vh;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.info>*{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.info .rd{flex-shrink:0}
.info .sep{flex:0 0 auto;font-style:normal;padding:0 .6em;color:#8a93a3}
.info .ev:empty+.sep,.info .sep:has(+.rd:empty){display:none}
.teamlbl{display:none}
.info:not(:has(.ev:not(:empty))):not(:has(.rd:not(:empty))) .teamlbl{display:inline}
.board:not(:has(.tname:not(:empty))) .teamlbl{display:none!important}
.chips{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.chip{width:24vh;height:5.6vh}
.fl{border-radius:.6vh;font-size:3vh;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#17202e;color:#fff}
/* team tie */
.board:has(.tname:not(:empty)) .big{font-size:44vh}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) :is(.who,.pts,.gw,.hist,.marks,.spine,.bar){display:none}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .row{gap:2vw}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband{grid-row:1 / -1;grid-column:1 / -1;flex-direction:column;justify-content:center;gap:5vh;margin:0;background:none;color:#17202e;font-size:7vh;text-align:center}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tlogo{width:14vh;height:14vh}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tname{flex:0 0 auto}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tie{height:auto;padding:2vh 4vw;border-radius:1.6vh}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tscore{font-size:22vh;line-height:.9}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tband .tie i{font-size:4vh}
/* final: games won takes the points' place, MATCH .board:has(.isComplete[style*="opacity: 1"]) fills the top of the spine */
.board:has(.isComplete[style*="opacity: 1"]) .end{grid-template-areas:"band band" "who who" "pts pts" "hist hist" "marks marks"}
.board:has(.isComplete[style*="opacity: 1"]) .gw{grid-area:pts;align-self:center;justify-self:center;width:auto;flex-direction:column-reverse;gap:2vh;background:none;color:#17202e}
.board:has(.isComplete[style*="opacity: 1"]) .gn{font-size:44vh;line-height:.78}
.board:has(.isComplete[style*="opacity: 1"]) .gw i{font-size:3.8vh;letter-spacing:.2em;color:#5b6577}
.board:has(.isComplete[style*="opacity: 1"]) .tagslot{height:26vh}
.board:has(.isComplete[style*="opacity: 1"]) .fin b{font-size:7.4vh}
.board:has(.isComplete[style*="opacity: 1"]) .fin i{font-size:3.6vh}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"]){box-shadow:0 0 0 .8vh #1aa260,0 .6vh 2.4vh rgba(40,30,10,.18)}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"]) .gn{color:#1aa260}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"]){background:#f4f2ec}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"]) :is(.name,.gn){color:#5b6577}
:is(.board:has(.isAWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="B"],.board:has(.isBWinner[style*="opacity: 1"]) .end[data-osb-resolved-court-side="A"]) .flag{opacity:.55}
</style>
