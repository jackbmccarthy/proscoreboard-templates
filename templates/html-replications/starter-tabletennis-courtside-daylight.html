<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Courtside — Daylight</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
html,body{height:100%;overflow:hidden}
.board{position:fixed;inset:0;display:flex;flex-direction:column;font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
.bar{display:grid;grid-template-columns:1fr 40vw 1fr;align-items:center;gap:2vw;flex:0 0 12vh;padding:0 2vw;color:var(--muted);background:var(--barbg)}
.info{display:flex;flex-direction:column;justify-content:center;gap:.5vh;min-width:0;text-transform:uppercase;white-space:nowrap}
.info>*{overflow:hidden;text-overflow:ellipsis}
.info .ev{font-size:3vh;font-weight:800;letter-spacing:.08em;color:var(--ink)}
.info .l2{display:flex;align-items:center;font-size:2.4vh;font-weight:700;letter-spacing:.12em}
.info .sep{font-style:normal;padding:0 .6em;opacity:.6}
.info .rd:empty+.sep,.info .sep:has(+.bo:empty){display:none}
.banner{height:8.4vh}
.chips{display:flex;justify-content:flex-end;gap:1vw}
.chip-s,.chip-f{height:5.2vh;width:13vw}
.fl{border-radius:.5vh;font-size:2.2vh;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--chipbg);color:var(--chipink)}
.ends{display:flex;flex:1 1 auto;min-height:0;gap:var(--gap,0)}
.end{position:relative;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:18vh 1fr auto 15vh;grid-template-areas:"who who who" "pts pts pts" "hist hist hist" "gw marks srv";min-width:0;flex:1 1 0;background:var(--end);overflow:hidden}
.kit{position:absolute;left:0;right:0;top:0;height:1.4vh;background:var(--chip-default,#8a96a3)}
.who{grid-area:who;display:flex;align-items:center;justify-content:center;gap:1.6vw;padding:3vh 3vw 0;min-width:0}
.flag{flex:0 0 auto;width:7.2vh;height:4.8vh;object-fit:cover;border-radius:.4vh;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.flag:not([src]),.tlogo:not([src]){display:none}
.nm{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:6.4vh;line-height:1.02;font-weight:800;text-transform:uppercase;overflow-wrap:break-word;color:var(--name)}
.tname{font-size:2.6vh;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.end:has(.tscore:not([style*="display: none"])) .who{padding-left:16vh;padding-right:16vh}
.nm:has(.name:empty) .tname{font-size:6vh;letter-spacing:.02em;color:var(--name);white-space:normal}
.pts{grid-area:pts;display:flex;align-items:center;justify-content:center;min-height:0}
.big{font-size:50vh;line-height:.8;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--pts)}
.gw{grid-area:gw;display:flex;align-items:center;gap:1.2vw;padding:0 0 2.4vh 2.6vw}
.marks{grid-area:marks;display:flex;align-items:center;justify-content:center;gap:.8vw;padding-bottom:2.4vh}
.srv{grid-area:srv;display:flex;align-items:center;padding:0 2.6vw 2.4vh 0}
.hist{grid-area:hist;display:flex;justify-content:center;gap:.6vw;padding-bottom:1vh}
.hg{display:flex;align-items:center;justify-content:center;min-width:7vh;height:6.4vh;padding:0 1vh;border-radius:.6vh;font-size:4.4vh;font-weight:800;font-variant-numeric:tabular-nums;background:var(--hbg,rgba(255,255,255,.08));color:var(--hink,inherit)}
.gl{font-size:2.8vh;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.gn{display:flex;align-items:center;justify-content:center;min-width:11vh;height:11vh;border-radius:1vh;font-size:8.4vh;font-weight:900;font-variant-numeric:tabular-nums;background:var(--gbg);color:var(--gink)}
.cs{width:4.4vh;height:6.2vh}
.card{border-radius:.6vh;box-shadow:0 0 0 .3vh rgba(0,0,0,.35)}
.yc{background:#ffd400}.rc{background:#e3262f}
.ts{width:16vh;height:6vh}
.tob{border-radius:.6vh;font-size:2.6vh;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:#ffd23f;color:#111}
.ss{width:9vh;height:9vh}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff8a1c 46%,#d65f00 100%);box-shadow:0 0 0 .5vh rgba(0,0,0,.25),0 0 3vh rgba(255,138,28,.55)}
.tm{position:absolute;top:3vh;right:2vw;display:flex;align-items:center;gap:.8vw}
.tlogo{width:6vh;height:6vh;object-fit:contain}
.tscore{display:flex;align-items:center;justify-content:center;min-width:6vh;height:6vh;padding:0 1vh;border-radius:.6vh;font-size:4vh;font-weight:900;background:var(--gbg);color:var(--gink)}
.bn{border-radius:1vh;font-size:4.8vh;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.bn-break{background:var(--chipbg);color:var(--chipink)}
.bn-gp{background:#ff8a1c;color:#111}
.bn-mp{background:#e3262f;color:#fff}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
.flag:not([src]),.tlogo:not([src]){display:none}
.team:not(:has(.tname:not(:empty))){display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.osb-core-fields{display:none!important}
.board:not(:has(.isInBetweenGames[style*="opacity: 1"])) .hg:not([style*="display: none"]):not([style*="display:none"]):not(:has(~ .hg:not([style*="display: none"]):not([style*="display:none"])))>*{opacity:.45}
.t-day{--font:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;--bg:#d9dde5;--end:#fff;--ink:#0b0b0f;--name:#0b0b0f;--pts:#0b0b0f;--muted:#4b5263;--gbg:#1652d8;--gink:#fff;--chipbg:#fff;--chipink:#0b0b0f;--barbg:#0b0b0f;--gap:.6vw}
.t-day .end{grid-template-columns:auto 1fr auto;grid-template-rows:13vh 1fr 19vh;grid-template-areas:"marks marks srv" "pts pts pts" "who who gw"}
.t-day .kit{top:auto;bottom:0;height:1.6vh}
.t-day .who{justify-content:flex-start;padding:0 1vw 2.4vh 2.6vw;border-top:.3vh solid #e3e6ec}
.t-day .nm{align-items:flex-start;text-align:left}
.t-day .name{font-size:6vh}
.t-day .gw{padding:0 2.6vw 2.4vh 0;border-top:.3vh solid #e3e6ec}
.t-day .marks{justify-content:flex-start;padding:2.4vh 0 0 2.6vw}
.t-day .srv{padding:2.4vh 2.6vw 0 0}
.t-day .big{font-size:54vh;font-weight:900}
.t-day .bar{color:#c9cfdb}
.t-day .ball{box-shadow:0 0 0 .5vh rgba(0,0,0,.12)}
.t-day .tm{top:auto;bottom:19.5vh}
.t-day .bn-break{background:#fff;color:#0b0b0f}
.t-day .info .ev{color:#fff}
.t-day .end:has(.tscore:not([style*="display: none"])) .who{padding:0 1vw 2.4vh 2.6vw}
</style>
</head>
<body>
<main class="board t-day" data-osb-component="layout">
<div class="ends" data-osb-component="layout"><div class="courtSideAView end eA" data-osb-component="layout">
<span class="jerseyColorA kit" data-osb-component="field" data-osb-field="jerseyColorA"></span>
<div class="who" data-osb-component="layout"><img class="countryA flag" data-osb-component="field" data-osb-field="countryA" alt=""><span class="nm"><span class="teamAName tname" data-osb-component="field" data-osb-field="teamAName"></span><span class="courtSideCombinedAName name" data-osb-component="field" data-osb-field="courtSideCombinedAName"></span></span></div>
<div class="pts" data-osb-component="layout"><span class="courtSideAGameScore big" data-osb-component="field" data-osb-field="courtSideAGameScore">0</span></div>
<div class="gw" data-osb-component="layout"><span class="gl">Games</span><span class="courtSideAMatchScore gn" data-osb-component="field" data-osb-field="courtSideAMatchScore">0</span></div>
<div class="marks" data-osb-component="layout"><span class="slot cs"><span class="isAYellowCarded card yc" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0"></span></span><span class="slot cs"><span class="isARedCarded card rc" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0"></span></span><span class="slot ts"><span class="isATimeOutActive tob" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0">Time-out</span></span></div>
<div class="srv" data-osb-component="layout"><span class="slot ss"><span class="courtSideIsACurrentlyServing ball" data-osb-component="field" data-osb-field="courtSideIsACurrentlyServing" style="opacity:0"></span></span></div>

<div class="tm" data-osb-component="layout"><img class="teamLogoURLA tlogo" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><span class="teamAScore tscore" data-osb-component="field" data-osb-field="teamAScore">0</span></div></div><div class="courtSideBView end eB" data-osb-component="layout">
<span class="jerseyColorB kit" data-osb-component="field" data-osb-field="jerseyColorB"></span>
<div class="who" data-osb-component="layout"><img class="countryB flag" data-osb-component="field" data-osb-field="countryB" alt=""><span class="nm"><span class="teamBName tname" data-osb-component="field" data-osb-field="teamBName"></span><span class="courtSideCombinedBName name" data-osb-component="field" data-osb-field="courtSideCombinedBName"></span></span></div>
<div class="pts" data-osb-component="layout"><span class="courtSideBGameScore big" data-osb-component="field" data-osb-field="courtSideBGameScore">0</span></div>
<div class="gw" data-osb-component="layout"><span class="gl">Games</span><span class="courtSideBMatchScore gn" data-osb-component="field" data-osb-field="courtSideBMatchScore">0</span></div>
<div class="marks" data-osb-component="layout"><span class="slot cs"><span class="isBYellowCarded card yc" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0"></span></span><span class="slot cs"><span class="isBRedCarded card rc" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0"></span></span><span class="slot ts"><span class="isBTimeOutActive tob" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0">Time-out</span></span></div>
<div class="srv" data-osb-component="layout"><span class="slot ss"><span class="courtSideIsBCurrentlyServing ball" data-osb-component="field" data-osb-field="courtSideIsBCurrentlyServing" style="opacity:0"></span></span></div>

<div class="tm" data-osb-component="layout"><img class="teamLogoURLB tlogo" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""><span class="teamBScore tscore" data-osb-component="field" data-osb-field="teamBScore">0</span></div></div></div>
<div class="bar" data-osb-component="layout"><span class="info"><span class="eventName ev" data-osb-component="field" data-osb-field="eventName"></span><span class="l2"><span class="matchRound rd" data-osb-component="field" data-osb-field="matchRound"></span><i class="sep">·</i><span class="matchFormatLabel bestOf bo" data-osb-component="field" data-osb-field="matchFormatLabel"></span></span></span><span class="slot banner"><span class="isInBetweenGames bn bn-break" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">Between games</span><span class="isGamePoint bn bn-gp" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">Game point</span><span class="isMatchPoint bn bn-mp" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">Match point</span></span><span class="chips"><span class="slot chip-s"><span class="isSwitched fl" data-osb-component="field" data-osb-field="isSwitched" style="opacity:0">Ends switched</span></span><span class="slot chip-f"><span class="isCourtSideScoreboardFlipped fl" data-osb-component="field" data-osb-field="isCourtSideScoreboardFlipped" style="opacity:0">View flipped</span></span></span></div>
<div class="osb-core-fields" aria-hidden="true"><span class="combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
</main>
</body>
</html>
