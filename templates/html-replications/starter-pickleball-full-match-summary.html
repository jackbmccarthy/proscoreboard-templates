<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Match Summary</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing{animation:none!important;transition:none!important}}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.02}

.sslot{align-items:center}.sslot>.st{display:flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap;height:100%}
.board:has(.isMatchStarted[style*="opacity: 1"]) .swarm{opacity:0!important}
.board:has(.isGamePoint[style*="opacity: 1"]) .sbrk,.board:has(.isMatchPoint[style*="opacity: 1"]) .sbrk{opacity:0!important}
.pslot>.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hist:not(:has(>[style*="opacity: 1"])){display:none}
.srv{display:flex;align-items:center;gap:.35rem}
.sn{position:relative;display:inline-grid;place-items:center}.sn>i{grid-area:1/1;font-style:normal}
.sn:has(>.isSecondServer[style*="opacity: 1"])>.one,.cn:has(>.isSecondServer[style*="opacity: 1"])>.one{opacity:0}
.cn{display:inline-grid}.cn>i{grid-area:1/1;font-style:normal;text-align:center}
.call{display:inline-flex;align-items:baseline}.call>i,.dbl>i{font-style:normal}.call .ca{order:1}.call .d1{order:2}.call .cb{order:3}.call .dbl{order:4;display:inline-flex;align-items:baseline}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .ca{order:3}.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .cb{order:1}
.call .dbl:not([style*="opacity: 1"]){display:none}
.cards{display:flex;gap:.3rem;align-items:center}.card{display:block;border-radius:.15rem;box-shadow:0 0 0 .1rem #0004}.yc{background:#ffd200}.rc{background:#e3262f}
.cards:not(:has(>[style*="opacity: 1"])){display:none}
.tie{display:flex;align-items:center}.tie:has(>.teamAName[style*="display: none"]){display:none}
.tlogo{display:block;object-fit:contain}.tlogo:not([src]),.tlogo[src=""]{visibility:hidden}
.tie>.tdash{font-style:normal}
.tname{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.05}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>:not(.tie){display:none}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>.tie{height:auto;min-height:5.2rem;padding-top:.6rem;padding-bottom:.4rem;margin:0}

.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#f1f5ee,#dbe5d4)}
.board{position:relative;width:108rem;font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;color:#17221a;background:#fff;box-shadow:0 2rem 4rem #1c38244d;border-top:1rem solid #2e7d4f}
.head{display:flex;align-items:center;justify-content:space-between;height:8rem;padding:0 3.6rem;border-bottom:.2rem solid #e5ebe3}
.ctx{display:flex;align-items:center;gap:1rem;font-size:2.4rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#56665a;min-width:0;white-space:nowrap;overflow:hidden}.ctx .sep{font-style:normal;color:#2e7d4f}
.sslot{min-width:24rem;height:4.8rem}.sslot>.st{padding:0 2rem;font-size:2.4rem;font-weight:800;letter-spacing:.14em;background:#eef3ec;color:#56665a}.sslot>.sgame{background:#17221a;color:#d4f02b}.sslot>.sbrk{background:#2e7d4f;color:#fff}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:2.4rem;padding:4.4rem 3.6rem 3.6rem}
.team{display:flex;align-items:center;gap:2rem;min-width:0}.tB{flex-direction:row-reverse;text-align:right}
.chip{display:block;width:1.4rem;height:9rem;flex:none;border-radius:.3rem;background:#9aa69c}
.nm{font-size:4.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.big{display:flex;align-items:center;gap:2rem;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:14rem;font-weight:700;line-height:1}
.big .dash{font-style:normal;color:#c5cfc6;font-size:8rem}
.games{min-width:9rem;text-align:center}
.score .pslot{display:grid;justify-content:center;margin-top:1.2rem;min-height:4rem}.score .pt{padding:0 1.8rem;font-size:2rem;font-weight:800;letter-spacing:.14em;background:#17221a;color:#d4f02b}.score .pt.mp{background:#d7263d;color:#fff}
.lbl{display:block;text-align:center;font-size:2rem;font-weight:700;letter-spacing:.2em;color:#8a978c;margin-top:-1.4rem}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:1.6rem;padding:0 3.6rem 4.4rem}
.sc{display:flex;flex-direction:column;align-items:center;min-width:15rem;padding:1.6rem 2rem;background:#f1f5ef;border-radius:.6rem}
.sc .sl{font-size:2rem;font-weight:700;letter-spacing:.16em;color:#8a978c}
.sc .sv{display:flex;align-items:center;gap:.8rem;margin-top:.6rem;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:5.4rem;font-weight:700}.sc .sv i{font-style:normal;color:#b8c3ba;font-size:3rem}
.tie{justify-content:center;gap:1.6rem;min-height:6.4rem;padding:.6rem 3.6rem .4rem;background:#17221a;color:#fff;font-size:2.4rem;font-weight:800}.tlogo{width:4.4rem;height:4.4rem}.tchip{width:.8rem;height:3.6rem;border-radius:.2rem}.tname:last-of-type{text-align:right}.tscore{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4rem;color:#d4f02b}.tie>.tdash{color:#8a978c}
</style>
</head>
<body>
<main class="stage"><section class="board" data-osb-component="layout" data-osb-component-type="osb-column-container">
<span class="tie"><img class="tlogo teamLogoURLA" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><i class="tchip teamJerseyColorA" data-osb-component="field" data-osb-field="teamJerseyColorA"></i><span class="tname teamAName" data-osb-component="field" data-osb-field="teamAName"></span><span class="tscore num teamAScore" data-osb-component="field" data-osb-field="teamAScore">0</span><i class="tdash">-</i><span class="tscore num teamBScore" data-osb-component="field" data-osb-field="teamBScore">0</span><span class="tname teamBName" data-osb-component="field" data-osb-field="teamBName"></span><i class="tchip teamJerseyColorB" data-osb-component="field" data-osb-field="teamJerseyColorB"></i><img class="tlogo teamLogoURLB" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""></span>
<header class="head" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="ctx"><span class="eventName" data-osb-component="field" data-osb-field="eventName"></span><i class="sep">&middot;</i><span class="matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span><span class="slot sslot"><span class="st sfmt"><span class="matchFormatLabel" data-osb-component="field" data-osb-field="matchFormatLabel"></span></span><span class="st sgame isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0">GAME <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="st sbrk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">END OF GAME <span class="num currentGame" data-osb-component="field" data-osb-field="currentGame"></span></span></span></header>
<div class="score"><span class="team tA"><i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="nm clamp2 combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></span><span><span class="big"><span class="games num currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><i class="dash">&ndash;</i><span class="games num currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span><b class="lbl">GAMES</b><span class="slot pslot"><span class="pt gp isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="pt mp isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span></span><span class="team tB"><i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="nm clamp2 combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></span></div>
<div class="strip" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><b class="sl">GAME 1</b><span class="sv"><span class="num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span><i>&ndash;</i><span class="num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></span><span class="sc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><b class="sl">GAME 2</b><span class="sv"><span class="num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span><i>&ndash;</i><span class="num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></span><span class="sc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><b class="sl">GAME 3</b><span class="sv"><span class="num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span><i>&ndash;</i><span class="num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></span><span class="sc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><b class="sl">GAME 4</b><span class="sv"><span class="num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span><i>&ndash;</i><span class="num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></span><span class="sc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><b class="sl">GAME 5</b><span class="sv"><span class="num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span><i>&ndash;</i><span class="num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></span><span class="sc isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity:0"><b class="sl">GAME 6</b><span class="sv"><span class="num game6AScore" data-osb-component="field" data-osb-field="game6AScore">0</span><i>&ndash;</i><span class="num game6BScore" data-osb-component="field" data-osb-field="game6BScore">0</span></span></span><span class="sc isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity:0"><b class="sl">GAME 7</b><span class="sv"><span class="num game7AScore" data-osb-component="field" data-osb-field="game7AScore">0</span><i>&ndash;</i><span class="num game7BScore" data-osb-component="field" data-osb-field="game7BScore">0</span></span></span><span class="sc isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity:0"><b class="sl">GAME 8</b><span class="sv"><span class="num game8AScore" data-osb-component="field" data-osb-field="game8AScore">0</span><i>&ndash;</i><span class="num game8BScore" data-osb-component="field" data-osb-field="game8BScore">0</span></span></span><span class="sc isGame9Started" data-osb-component="field" data-osb-field="isGame9Started" style="opacity:0"><b class="sl">GAME 9</b><span class="sv"><span class="num game9AScore" data-osb-component="field" data-osb-field="game9AScore">0</span><i>&ndash;</i><span class="num game9BScore" data-osb-component="field" data-osb-field="game9BScore">0</span></span></span></div><span class="osb-core-fields"><span class="num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="playerA2" data-osb-component="field" data-osb-field="playerA2"></span></span></section></main>
</body>
</html>
