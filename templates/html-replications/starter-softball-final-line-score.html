<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Final Line Score</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}

.board{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Avenir Next Condensed","Bahnschrift SemiCondensed","Roboto Condensed","Arial Narrow",sans-serif;color:#1d1638;background:transparent;--live:#e5262d;--optic:#d4f53c;--violet:#2b1d63;--ink:#1d1638;--mute:#5d5878;--paper:#fbfaf5;--line:rgba(29,22,56,.12)}

.ev-e:empty,.ev-r:empty{display:none}
.badge{flex:none;display:grid;align-items:center;justify-items:end;min-width:11rem}

.badge .st-pre{padding:.55rem 1.1rem;border-radius:2rem;box-shadow:inset 0 0 0 .12rem rgba(255,255,255,.45);color:#e6e1fa}
.badge .st-live{padding:.55rem 1.2rem;border-radius:2rem;background:#fff;color:var(--ink)}
.badge .isComplete{padding:.6rem 1.6rem;border-radius:2rem;background:var(--optic);color:var(--ink);font:700 2rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;letter-spacing:.18em}
.main{display:flex;flex-direction:column;gap:1.3rem;padding:1.6rem 2.2rem 2.2rem}

.names{flex:1;min-width:0;display:flex;flex-direction:column}

{}.inn{display:flex;align-items:center;gap:.3rem;font:700 3rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);--half-on:var(--violet);--half-off:rgba(29,22,56,.16);--half-h:3.2rem;--half-size:1.4rem}
