<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Violet Ash Open Register 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(94vw,1142px);max-width:100%;aspect-ratio:2.52;overflow:hidden;border:2px solid #b4bfc4;border-radius:7px;background:#e7e8ec;color:#28323d;container-type:inline-size}
.head{display:flex;align-items:center;justify-content:space-between;flex:0 0 15%;min-width:0;padding:0 28px;border-bottom:2px solid #b4bfc4}
.sport-tag,.set-status{display:block;overflow:hidden;font-size:clamp(19px,2.9cqw,36px);font-weight:800;line-height:1;text-overflow:ellipsis;white-space:nowrap}
.set-status{display:flex;align-items:center;gap:.35em}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.teams{display:flex;flex:1 1 0;min-height:0;flex-direction:column}
.team{display:flex;align-items:stretch;flex:1 1 0;min-height:0;min-width:0}
.team+.team{border-top:2px solid #b4bfc4}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;flex:0 0 20px;align-self:stretch;margin:24px 0 24px 24px;background:#4381e5}
.jerseyColorB{background:#ef666d}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;padding:0 36px;color:#28323d;font-size:clamp(29px,6cqw,72px);font-weight:700;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.register{display:flex;align-items:center;justify-content:center;flex:0 0 16%;min-width:0;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.label{display:block;max-width:100%;overflow:hidden;font-size:clamp(12px,1.7cqw,22px);font-weight:750;line-height:1}
.set-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(22px,3cqw,39px);font-weight:750;line-height:1;text-align:center}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(39px,5.9cqw,76px);font-weight:800;line-height:1;text-align:center}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:7px}
 .board{width:100%;height:180px;aspect-ratio:auto;border-width:1px;border-radius:3px}
 .head{flex-basis:17%;padding:0 8px;border-width:1px}
 .sport-tag,.set-status{font-size:clamp(10px,3cqw,14px)}
 .team+.team{border-width:1px}
 .identity{flex-basis:5px;margin:13px 0 13px 6px}
 .name{padding:0 8px;font-size:clamp(17px,5.3cqw,24px)}
 .register{flex-basis:22%;gap:1px}
 .label{font-size:clamp(8px,2.4cqw,11px)}
 .set-score{font-size:clamp(13px,4cqw,18px)}
 .score{font-size:clamp(23px,7cqw,32px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="head rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
  <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="register columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label" data-osb-component="text">SETS</span><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="register columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label" data-osb-component="text">SETS</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
