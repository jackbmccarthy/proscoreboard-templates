<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charcoal Ivory Open Score Volleyball — Paired Rows</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: transparent; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .stage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
    .board { display: flex; flex-direction: column; width: min(50vw, 950px); max-width: 100%; overflow: hidden; border: 2px solid #53615c; border-radius: 8px; background: #232c2b; color: #f6f7f2; container-type: inline-size; }
    .header { display: flex; align-items: center; height: 6.5cqw; min-height: 34px; border-bottom: .6cqw solid #718779; background: #e9e6da; color: #232c2b; }
    .sport { flex: 1 1 0; min-width: 0; overflow: hidden; padding-left: 2.7cqw; font-size: 4.15cqw; font-weight: 800; line-height: 1; text-overflow: ellipsis; white-space: nowrap; }
    .header-label { display: flex; align-items: center; justify-content: center; flex: none; font-size: 2.85cqw; font-weight: 700; line-height: 1; white-space: nowrap; }
    .header-points { width: 18%; }
    .header-sets { width: 15.5%; }
    .teams { display: flex; flex-direction: column; min-width: 0; }
    .team { display: flex; align-items: center; height: 13.7cqw; min-height: 65px; min-width: 0; background: #232c2b; }
    .team + .team { border-top: 1px solid #ab9470; }
    .points-score { display: flex; flex: 0 0 16%; align-items: center; justify-content: center; width: 16%; color: #f6f7f2; font-size: 9.4cqw; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
    .tick { display: block; flex: 0 0 2.1%; align-self: center; height: 63%; background: #718779; }
    .jerseyColorB { background: #ab9470; }
    .name { display: block; flex: 1 1 0; min-width: 0; overflow: hidden; padding: 0 2.9cqw; color: #f6f7f2; font-size: 5.8cqw; font-weight: 700; line-height: 1.1; text-overflow: ellipsis; white-space: nowrap; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .sets-score { display: flex; align-items: center; justify-content: center; flex: 0 0 15.5%; align-self: stretch; width: 15.5%; border-left: 1px solid #ab9470; color: #e9e6da; font-size: 5.5cqw; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
    .footer { display: flex; align-items: center; justify-content: center; height: 6.4cqw; min-height: 38px; background: #e9e6da; color: #232c2b; }
    .set-group { display: flex; align-items: center; justify-content: center; gap: 2.8cqw; height: 75%; white-space: nowrap; }
    .set-label { font-size: 2.95cqw; font-weight: 800; line-height: 1; }
    .set-value { display: block; padding-left: 3.7cqw; border-left: .22cqw solid #718779; font-size: 4.4cqw; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint,
    .point-slot:has(> .isMatchPoint[style*="opacity:1"]) > .isGamePoint { opacity: 0 !important; }
    @media (max-width: 600px) {
      .board { width: 100%; }
      .header { height: 36px; border-bottom-width: 2px; }
      .sport { padding-left: 10px; font-size: 17px; }
      .header-label { font-size: 10px; }
      .header-points { width: 19%; }
      .header-sets { width: 16%; }
      .team { height: 72px; }
      .points-score { flex-basis: 19%; width: 19%; font-size: 42px; }
      .tick { flex-basis: 5px; height: 46px; }
      .name { padding: 0 10px; font-size: clamp(18px, 5.5vw, 24px); }
      .sets-score { flex-basis: 16%; width: 16%; font-size: 27px; }
      .footer { height: 41px; }
      .set-group { gap: 12px; }
      .set-label { font-size: 15px; }
      .set-value { padding-left: 15px; border-left-width: 2px; font-size: 23px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="stage" data-osb-component="layout">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="sport" data-osb-component="text">VOLLEYBALL</span>
        <span class="header-label header-points" data-osb-component="text">POINTS</span>
        <span class="header-label header-sets" data-osb-component="text">SETS</span>
      </header>
      <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <span class="points-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span>
          <span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
          <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
          <span class="sets-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span>
        </div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
          <span class="points-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span>
          <span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
          <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
          <span class="sets-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span>
        </div>
      </div>
      <footer class="footer rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="set-group rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="set-label" data-osb-component="text">SET</span><span class="set-value" data-osb-component="text" data-osb-static="true" data-sport-stat="set">0</span></div>
      </footer>
      <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
