<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleball — Copper Cream Keyline Stat Scorebug</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--cream:#f2efe8;--copper:#78544a;--ink:#263540;--rule:#aeb9b0;--white:#fbfaf6;display:flex;flex-direction:column;width:min(53.7vw,1045px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:3px;background:var(--cream);color:var(--ink);container-type:inline-size}
.topline{position:relative;display:flex;flex:0 0 auto;height:7.1cqw;align-items:center;padding:0 3.3cqw;background:var(--copper);color:var(--white);font-size:4cqw;line-height:1;font-weight:700;white-space:nowrap}
.rows{display:flex;flex:1 1 auto;min-width:0;flex-direction:column}
.row{display:flex;flex:1 1 50%;min-width:0;min-height:15.55cqw;align-items:stretch}
.row+.row{border-top:1px solid var(--rule)}
.identity{display:block;flex:0 0 3.6%;width:3.6%;background:#2685a2}
.jerseyColorB{background:#c76863}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.7cqw;padding:0 3.3cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.5cqw;line-height:1.04;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .5cqw;width:.5cqw;height:.5cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--ink)}
.support-track,.scorecap{display:flex;min-width:0;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap}
.support-track{flex:0 0 16.3%;width:16.3%;align-self:stretch;margin:1cqw 0;border:1px solid var(--rule);border-radius:3px;background:var(--cream)}
.scorecap{flex:0 0 19.5%;width:19.5%;align-self:stretch;margin:.4cqw .4cqw .4cqw 1cqw;border-radius:4px;background:var(--ink);color:var(--white)}
.support-score,.primary-score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.support-score{font-size:5.7cqw}.primary-score{font-size:8.6cqw}
.support-label,.primary-label{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:2.3cqw;line-height:1;font-weight:700}
.point-slot{position:absolute;right:1%;top:0;width:19%;height:100%;font-size:1cqw;font-weight:700;text-align:center}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--copper)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.topline{height:32px;padding:0 8px;font-size:14px}.row{min-height:87px}.identity{flex-basis:5px;width:5px}.name-lane{gap:2px;padding:0 5px}.name{font-size:17px}.serve{flex-basis:5px;width:5px;height:5px}.support-track{flex-basis:24%;width:24%;margin:6px 0}.scorecap{flex-basis:27%;width:27%;margin:3px 2px 3px 3px}.support-score{font-size:27px}.primary-score{font-size:37px}.support-label,.primary-label{font-size:8px}.point-slot{font-size:7px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Reserved conditional match states: all score and name tracks remain fixed. */
.osb-conditional-rail{--osb-rail-bg:#263540;--osb-rail-fg:#f9fbfa;box-sizing:border-box!important;position:relative!important;inset:auto!important;transform:none!important;grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:28px!important;height:28px!important;margin:0!important;padding:2px 7px!important;gap:5px!important;overflow:hidden!important;background:var(--osb-rail-bg)!important;color:var(--osb-rail-fg)!important;border:0!important;font:700 11px/1 Arial,Helvetica,sans-serif!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-condition-side{all:unset!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;flex:1 1 35%!important;width:35%!important;min-width:0!important;height:22px!important;gap:2px!important;position:relative!important;overflow:hidden!important}
.osb-conditional-rail .osb-condition-side-b{justify-content:flex-end!important}
.osb-conditional-rail .osb-condition-side-label{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 13px!important;width:13px!important;height:18px!important;color:var(--osb-rail-fg)!important;font:800 10px/1 Arial,Helvetica,sans-serif!important}
.osb-conditional-rail .osb-condition-slot{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 21px!important;width:21px!important;height:18px!important;position:relative!important}
.osb-conditional-rail .osb-condition-timeoutused{flex-basis:21px!important;width:21px!important}
.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:17px!important;width:17px!important}
.osb-conditional-rail .osb-condition-badge{box-sizing:border-box!important;align-items:center!important;justify-content:center!important;width:100%!important;height:18px!important;min-width:0!important;margin:0!important;padding:0 2px!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:2px!important;background:rgba(255,255,255,.12)!important;color:var(--osb-rail-fg)!important;font:800 9px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-timeout-icon{position:relative!important;display:flex;align-items:center!important;justify-content:center!important;padding:0!important;color:var(--osb-rail-fg)!important}
.osb-conditional-rail .osb-timeout-icon::before{content:""!important;display:block!important;width:11px!important;height:11px!important;border:1.5px solid currentColor!important;border-radius:50%!important;background:transparent!important}
.osb-conditional-rail .osb-timeout-icon::after{content:""!important;position:absolute!important;left:50%!important;top:3px!important;width:3px!important;height:6px!important;border-left:1.5px solid currentColor!important;border-bottom:1.5px solid currentColor!important;transform:translateX(-25%) rotate(-35deg)!important;transform-origin:bottom left!important}
.osb-conditional-rail .isATimeOutActive,.osb-conditional-rail .isBTimeOutActive{background:#f3d27a!important;color:#253641!important;border-color:#f3d27a!important}
.osb-conditional-rail .isATimeOutUsed,.osb-conditional-rail .isBTimeOutUsed{background:transparent!important;color:#b8c7ca!important;border-color:#b8c7ca!important}
.osb-conditional-rail .isAYellowCarded,.osb-conditional-rail .isBYellowCarded{background:#e5c94e!important;color:#253641!important;border-color:#e5c94e!important}
.osb-conditional-rail .isARedCarded,.osb-conditional-rail .isBRedCarded{background:#c94747!important;color:#fff!important;border-color:#c94747!important}
.osb-conditional-rail .point-slot.osb-shared-point{all:unset!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30%!important;width:30%!important;min-width:78px!important;max-width:130px!important;height:22px!important;min-height:22px!important;inset:auto!important;margin:0!important;padding:0!important;transform:none!important;overflow:hidden!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important}
.osb-conditional-rail .point-slot.osb-shared-point>.isGamePoint,.osb-conditional-rail .point-slot.osb-shared-point>.isMatchPoint{box-sizing:border-box!important;position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;transform:none!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:390px){.osb-conditional-rail{padding:2px 4px!important;gap:3px!important}.osb-conditional-rail .osb-condition-side{gap:1px!important}.osb-conditional-rail .osb-condition-slot{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-timeoutused{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:15px!important;width:15px!important}.osb-conditional-rail .point-slot.osb-shared-point{min-width:76px!important}}

</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="topline"><span>PICKLEBALL</span></div><div class="rows columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="support-track"><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-label">GAMES</span></div><div class="scorecap"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-label">POINTS</span></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="support-track"><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-label">GAMES</span></div><div class="scorecap"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-label">POINTS</span></div></div></div><div class="osb-conditional-rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Conditional match states"><div class="osb-condition-side osb-condition-side-a" data-osb-component="layout"><span class="osb-condition-side-label">A</span><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div><span class="point-slot osb-shared-point" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><div class="osb-condition-side osb-condition-side-b" data-osb-component="layout"><span class="osb-condition-side-label">B</span><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div></div></article></main></body></html>
