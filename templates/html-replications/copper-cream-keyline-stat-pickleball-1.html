<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleball — Copper Cream Keyline Stat Scorebug</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--cream:#f2efe8;--copper:#78544a;--ink:#263540;--rule:#aeb9b0;--white:#fbfaf6;display:flex;flex-direction:column;width:min(53.7vw,1045px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:3px;background:var(--cream);color:var(--ink);container-type:inline-size}
.topline{position:relative;display:flex;flex:0 0 auto;height:7.1cqw;align-items:center;padding:0 3.3cqw;background:var(--copper);color:var(--white);font-size:4cqw;line-height:1;font-weight:700;white-space:nowrap}
.rows{display:flex;flex:1 1 auto;min-width:0;flex-direction:column}
.row{display:flex;flex:1 1 50%;min-width:0;min-height:15.55cqw;align-items:stretch}
.row+.row{border-top:1px solid var(--rule)}
.identity{display:block;flex:0 0 3.6%;width:3.6%;background:#2685a2}
.jerseyColorB{background:#c76863}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.7cqw;padding:0 3.3cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.5cqw;line-height:1.04;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .5cqw;width:.5cqw;height:.5cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--ink)}
.support-track,.scorecap{display:flex;min-width:0;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap}
.support-track{flex:0 0 16.3%;width:16.3%;align-self:stretch;margin:1cqw 0;border:1px solid var(--rule);border-radius:3px;background:var(--cream)}
.scorecap{flex:0 0 19.5%;width:19.5%;align-self:stretch;margin:.4cqw .4cqw .4cqw 1cqw;border-radius:4px;background:var(--ink);color:var(--white)}
.support-score,.primary-score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.support-score{font-size:5.7cqw}.primary-score{font-size:8.6cqw}
.support-label,.primary-label{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:2.3cqw;line-height:1;font-weight:700}
.point-slot{position:absolute;right:1%;top:0;width:19%;height:100%;font-size:1cqw;font-weight:700;text-align:center}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--copper)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.topline{height:32px;padding:0 8px;font-size:14px}.row{min-height:87px}.identity{flex-basis:5px;width:5px}.name-lane{gap:2px;padding:0 5px}.name{font-size:17px}.serve{flex-basis:5px;width:5px;height:5px}.support-track{flex-basis:24%;width:24%;margin:6px 0}.scorecap{flex-basis:27%;width:27%;margin:3px 2px 3px 3px}.support-score{font-size:27px}.primary-score{font-size:37px}.support-label,.primary-label{font-size:8px}.point-slot{font-size:7px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="topline"><span>PICKLEBALL</span><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div><div class="rows columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="support-track"><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-label">GAMES</span></div><div class="scorecap"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-label">POINTS</span></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="support-track"><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-label">GAMES</span></div><div class="scorecap"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-label">POINTS</span></div></div></div></article></main></body></html>
