<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot Matrix Sentence Volleyball — Duel</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { color: white; font-family: Arial, Helvetica, sans-serif; }
.stage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.board { width: 100%; max-width: 1040px; display: flex; flex-direction: column; background: transparent; }
.title { font-size: 84px; font-weight: 800; line-height: 1; text-align: center; margin-bottom: 30px; }
.sentence { display: flex; }
.team { display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: 0; }
.primary-score { display: block; width: 100%; height: 300px; font-family: "Arial Black", Arial, sans-serif; font-size: 360px; font-weight: 900; line-height: .84; text-align: center; letter-spacing: -.07em; font-variant-numeric: tabular-nums; color: transparent; background-image: radial-gradient(ellipse 9px 7.83px at center, #ffc13a 98%, transparent 100%); background-size: 22px 19.13px; background-clip: text; -webkit-background-clip: text; transform: scaleY(1.15); transform-origin: center; }
.colon { flex: 0 0 120px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 35px; height: 160px; font-size: 0; line-height: 1; margin-top: 75px; }
.colon::before, .colon::after { content: ""; display: block; width: 34px; height: 34px; flex: none; border-radius: 50%; background: #f5f5ef; }
.label { font-size: 44px; font-weight: 700; line-height: 1; }
.points-label { margin-top: 35px; }
.name-color { display: block; width: 100%; min-width: 0; background-color: #fff; background-clip: text; -webkit-background-clip: text; margin-top: 25px; }
.name { display: block; width: 100%; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 74px; font-weight: 700; line-height: 1.1; text-align: center; color: transparent; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.sets-label { font-size: 38px; margin-top: 20px; }
.match-score { display: block; width: 100%; height: 64px; font-size: 64px; font-weight: 700; line-height: 1; text-align: center; margin-top: 6px; font-variant-numeric: tabular-nums; }
.set-footer { display: flex; align-items: center; justify-content: center; gap: 17px; margin-top: 30px; font-size: 58px; line-height: 1; font-weight: 700; }
.set-value { width: 66px; display: block; text-align: center; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 1080px) {
  .title { font-size: clamp(28px, 7.8vw, 84px); }
  .primary-score { font-size: clamp(90px, 32vw, 360px); }
  .name { font-size: clamp(26px, 6.7vw, 74px); }
  .colon { flex-basis: 11%; }
}
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .title { font-size: 30px; margin-bottom: 30px; }
  .primary-score { height: 133px; font-size: 128px; background-image: radial-gradient(ellipse 2.8px 2.43px at center, #ffc13a 98%, transparent 100%); background-size: 7px 6.087px; }
  .colon { flex-basis: 40px; height: 65px; gap: 14px; margin-top: 32px; }
  .colon::before, .colon::after { width: 13px; height: 13px; }
  .label { font-size: 19px; }
  .points-label { margin-top: 12px; }
  .name-color { margin-top: 24px; }
  .name { font-size: 28px; }
  .sets-label { font-size: 17px; margin-top: 19px; }
  .match-score { font-size: 33px; height: 35px; margin-top: 7px; }
  .set-footer { font-size: 29px; margin-top: 27px; gap: 8px; }
  .set-value { width: 33px; }
}
@media(min-width:601px) and (max-height:900px){.stage{height:100vh;min-height:0;overflow:hidden}.board{transform:scale(.82);transform-origin:center}}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="sentence rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="team columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="label points-label">POINTS</span><div class="name-color jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><span class="label sets-label">SETS</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
        <span class="colon" aria-hidden="true">:</span>
        <div class="team columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="label points-label">POINTS</span><div class="name-color jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><span class="label sets-label">SETS</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
