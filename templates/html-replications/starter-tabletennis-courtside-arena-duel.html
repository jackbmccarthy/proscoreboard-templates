<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Courtside — Arena Duel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
.stage{position:fixed;inset:0;container-type:size;display:grid;place-items:center}
.board{--u:calc(min(100cqw,177.7778cqh)/1920);position:relative;overflow:hidden;width:min(100cqw,177.7778cqh);height:min(56.25cqw,100cqh);font-family:"Helvetica Neue",Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums}
.name,.team{display:flex;align-items:safe center;justify-content:center;text-align:center;overflow:hidden;overflow-wrap:anywhere;line-height:1.05}
.game,.games,.teamScore{white-space:nowrap;line-height:1;text-align:center}
img:not([src]),img[src=""]{display:none}
.isGamePoint,.isMatchPoint,.isInBetweenGames,.isSwitched,.isCourtSideScoreboardFlipped,.courtSideIsACurrentlyServing,.courtSideIsBCurrentlyServing,.isAYellowCarded,.isBYellowCarded,.isARedCarded,.isBRedCarded,.isATimeOutActive,.isBTimeOutActive{opacity:0}
.pointSlot{position:absolute}
.ban{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:900}
.pointSlot:has(.isMatchPoint[style*="opacity: 1"]) .isGamePoint,.pointSlot:has(.isInBetweenGames[style*="opacity: 1"]) :is(.isGamePoint,.isMatchPoint){opacity:0!important}
.chip{position:absolute;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:800}
.serve{position:absolute}

.board{background:#0c1015;color:#fff}
.hdr{position:absolute;left:0;right:0;top:0;height:calc(80*var(--u));display:flex;align-items:center;justify-content:center;gap:calc(34*var(--u));font-size:calc(42*var(--u));letter-spacing:.1em;text-transform:uppercase;color:#9aa6b2;z-index:3}
.hdr .matchRound{color:#fff;font-weight:800}
.panel{position:absolute;top:calc(80*var(--u));bottom:0;width:calc(1080*var(--u))}
.pA{left:0;background:linear-gradient(160deg,#2a7bf0,#0f4aa8);clip-path:polygon(0 0,100% 0,calc(100% - calc(150*var(--u))) 100%,0 100%)}
.pB{right:0;background:linear-gradient(200deg,#e5505a,#9e2530);clip-path:polygon(calc(150*var(--u)) 0,100% 0,100% 100%,0 100%)}
.name{position:absolute;top:calc(20*var(--u));height:calc(190*var(--u));width:calc(620*var(--u));font-size:calc(80*var(--u));font-weight:900;text-transform:uppercase;justify-content:flex-start;text-align:left}
.pA .name{left:calc(80*var(--u))}.pB .name{right:calc(80*var(--u));left:auto;justify-content:flex-end;text-align:right}
.card{position:absolute;width:calc(40*var(--u));height:calc(58*var(--u));border-radius:calc(5*var(--u))}.yc{background:#e5c94e}.rc{background:#c94747}
.card{top:calc(48*var(--u))}.pA .yc{left:calc(720*var(--u))}.pA .rc{left:calc(776*var(--u))}.pB .yc{right:calc(720*var(--u))}.pB .rc{right:calc(776*var(--u))}
.game{position:absolute;top:calc(190*var(--u));height:calc(640*var(--u));width:calc(760*var(--u));font-size:calc(640*var(--u));line-height:calc(640*var(--u));font-weight:900;text-shadow:0 calc(10*var(--u)) 0 rgba(0,0,0,.25)}
.pA .game{left:calc(60*var(--u))}.pB .game{right:calc(60*var(--u))}
.lbl{position:absolute;bottom:calc(62*var(--u));font-size:calc(40*var(--u));font-weight:800;letter-spacing:.12em;color:rgba(255,255,255,.75)}
.pA .lbl{left:calc(80*var(--u))}.pB .lbl{right:calc(80*var(--u))}
.games{position:absolute;bottom:calc(34*var(--u));width:calc(150*var(--u));height:calc(130*var(--u));font-size:calc(130*var(--u));line-height:calc(130*var(--u));font-weight:900}
.pA .games{left:calc(270*var(--u))}.pB .games{right:calc(270*var(--u))}
.serve{bottom:calc(60*var(--u));width:calc(62*var(--u));height:calc(62*var(--u));border-radius:50%;background:#fff;box-shadow:0 0 0 calc(8*var(--u)) rgba(255,255,255,.35)}
.pA .serve{left:calc(470*var(--u))}.pB .serve{right:calc(470*var(--u))}
.to{position:absolute;top:calc(212*var(--u));width:calc(360*var(--u));height:calc(64*var(--u));display:flex;align-items:center;justify-content:center;background:#0c1015;border-radius:calc(32*var(--u));color:#fff;font-size:calc(36*var(--u));font-weight:800;letter-spacing:.08em}
.pA .to{left:calc(80*var(--u))}.pB .to{right:calc(80*var(--u))}
.pointSlot{left:calc(640*var(--u));width:calc(640*var(--u));top:calc(930*var(--u));height:calc(120*var(--u));z-index:4}
.ban{font-size:calc(72*var(--u));border-radius:calc(12*var(--u));letter-spacing:.04em;transform:skewX(-8deg)}
.gp{background:#ffd23f;color:#0c1015}.mp{background:#fff;color:#c4202c}.bt{background:#0c1015;color:#fff;border:calc(4*var(--u)) solid #fff;font-size:calc(56*var(--u))}
.chip{top:calc(18*var(--u));height:calc(44*var(--u));padding:0 calc(20*var(--u));border-radius:calc(22*var(--u));background:rgba(255,255,255,.1);color:#9aa6b2;font-size:calc(24*var(--u));letter-spacing:.08em;z-index:4}
.chipS{left:calc(24*var(--u))}.chipF{right:calc(24*var(--u))}

.osb-core-fields{display:none!important}
</style>
</head>
<body>
<div class="stage"><div class="board">
  <div class="hdr"><span class="eventName"></span><span class="matchRound"></span></div>
  <section class="courtSideAView panel pA ">
    <div class="courtSideCombinedAName name"></div>
    <div class="isAYellowCarded card yc"></div>
    <div class="isARedCarded card rc"></div>
    <div class="isATimeOutActive to">TIME-OUT</div>
    <div class="courtSideAGameScore game">0</div>
    <div class="lbl">GAMES</div>
    <div class="courtSideAMatchScore games">0</div>
    <div class="courtSideIsACurrentlyServing serve"></div>
  </section>
  <section class="courtSideBView panel pB ">
    <div class="courtSideCombinedBName name"></div>
    <div class="isBYellowCarded card yc"></div>
    <div class="isBRedCarded card rc"></div>
    <div class="isBTimeOutActive to">TIME-OUT</div>
    <div class="courtSideBGameScore game">0</div>
    <div class="lbl">GAMES</div>
    <div class="courtSideBMatchScore games">0</div>
    <div class="courtSideIsBCurrentlyServing serve"></div>
  </section>
  <div class="pointSlot ">
    <div class="isInBetweenGames ban bt">BETWEEN GAMES</div>
    <div class="isMatchPoint ban mp" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</div>
    <div class="isGamePoint ban gp" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</div>
  </div>
  <div class="isSwitched chip chipS">ENDS SWITCHED</div>
  <div class="isCourtSideScoreboardFlipped chip chipF">BOARD FLIPPED</div>
</div></div>
<div class="osb-core-fields" aria-hidden="true"><span class="combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
</body>
</html>
