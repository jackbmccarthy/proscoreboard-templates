<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Live — Ticket</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:var(--font);-webkit-font-smoothing:antialiased}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--font:"Helvetica Neue",Arial,Helvetica,sans-serif;--rh:6.2cqw;--head:3cqw;--rail:2.7cqw;
 width:min(94vw,1500px);min-width:0;container-type:inline-size;overflow:hidden;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius,3px);font-family:var(--font)}
.in{font-size:1cqw;display:flex;flex-direction:column;min-width:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:1.2em;height:var(--head);padding:0 1.4em;background:var(--head-bg);color:var(--head-ink);font-size:1.3em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.banner .sport{flex:0 0 auto}
.states{display:flex;align-items:center;gap:.8em;min-width:0}
.slot{position:relative;display:block;flex:0 0 auto;height:1.5em;min-width:7.4em}
.slot>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 .7em;border-radius:.3em;font-size:.82em;font-weight:800;letter-spacing:.12em;line-height:1;white-space:nowrap}
.isMatchStarted{background:var(--live);color:#fff}
.isWarmUpStarted{background:var(--soft);color:var(--head-ink);border:1px solid currentColor}
.isGamePoint{background:var(--hot);color:#fff}
.isMatchPoint{background:var(--hot2);color:#1a1200}
.isInBetweenGames{background:var(--soft);color:var(--head-ink);border:1px solid currentColor}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isMatchStarted[style*="opacity: 1"])>.isWarmUpStarted{opacity:0!important}
.main{display:flex;align-items:stretch;min-width:0;background:var(--panel)}
.players{display:grid;grid-template-rows:var(--rh) var(--rh);flex:1 1 auto;min-width:0}
.row{display:flex;align-items:center;gap:1em;min-width:0;height:var(--rh);padding:0 1.2em 0 0;background:var(--row);color:var(--row-ink)}
.row+.row{border-top:1px solid var(--line);background:var(--row2,var(--row))}
.chip{flex:0 0 .9cqw;width:.9cqw;align-self:stretch;font-size:0;color:transparent;overflow:hidden;background:#888}
.flag{flex:0 0 auto;width:3.1em;height:2.1em;object-fit:cover;border-radius:.2em;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.flag:not([src]),.logo:not([src]){display:none}
.who{display:flex;flex-direction:column;justify-content:center;gap:.45em;flex:1 1 auto;min-width:0}
.name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:3.1em;line-height:1.08;font-weight:800;letter-spacing:-.005em}
.name:empty::before{content:"Player"}
.sub{display:flex;align-items:center;gap:.6em;min-width:0;font-size:1.3em;line-height:1;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--row-muted)}
.sub:has(.tname:empty){display:none}
.logo{flex:0 0 auto;width:1.7em;height:1.7em;object-fit:contain}
.tname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tscore{flex:0 0 auto;min-width:1.7em;padding:.25em .5em;border-radius:.3em;background:var(--tile2);color:var(--tile2-ink);text-align:center}
.tscore:empty{display:none}
.serve{flex:0 0 1.5em;width:1.5em;display:flex;align-items:center;justify-content:center}
.serve .dot{display:block;width:1.1em;height:1.1em;border-radius:50%;background:var(--serve);box-shadow:0 0 0 .22em rgba(128,128,128,.25)}
.scores{display:flex;align-items:stretch;flex:0 0 auto;min-width:0}
.col{display:grid;grid-template-rows:var(--rh) var(--rh);flex:0 0 auto;min-width:0}
.col>.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;height:var(--rh);overflow:hidden;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.col>.cell+.cell{border-top:1px solid var(--line)}
.gcol{width:4.4em;background:var(--gcell);color:var(--gcell-ink);border-left:1px solid var(--line)}
.gcol .cell{font-size:2.5em}
.sets{width:7em;background:var(--tile2);color:var(--tile2-ink);border-left:1px solid var(--line)}
.sets .cell{font-size:3.4em;padding-top:.5cqw}
.pts{width:9.6em;background:var(--tile);color:var(--tile-ink)}
.pts .cell{font-size:4.2em;padding-top:.5cqw}
.cap{position:absolute;top:.45cqw;left:0;right:0;text-align:center;font-size:.72cqw;letter-spacing:.16em;font-weight:800;opacity:.8;text-transform:uppercase;line-height:1}
.num{display:block;line-height:1}
.rail{display:flex;align-items:center;justify-content:space-between;gap:1em;height:var(--rail);padding:0 1.2em;background:var(--rail-bg);color:var(--rail-ink);border-top:1px solid var(--line)}
.cluster{display:flex;align-items:center;gap:.6em;flex:0 0 17em;min-width:0}
.cluster.b{justify-content:flex-end}
.cluster .slot{min-width:0;height:1.9em}
.slot.sq{width:2.6em}
.badge{font-size:1.1em!important;font-weight:800;letter-spacing:.04em}
.slot>.tmo{border:1px solid currentColor}
.isATimeOutActive,.isBTimeOutActive{background:#f3c94c;color:#26323a;border-color:#f3c94c!important}
.isATimeOutUsed,.isBTimeOutUsed{background:transparent;color:var(--rail-muted)}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
.isAYellowCarded,.isBYellowCarded{background:#f0cd2e;color:#222}
.isARedCarded,.isBRedCarded{background:#d63a3a;color:#fff}
.aux{display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.9em;padding:0 .5em;border:1px solid currentColor;border-radius:.3em;font-size:1.1em;font-weight:800;color:var(--rail-muted)}
.aux:empty{display:none}
.info{display:flex;align-items:center;justify-content:center;gap:.9em;min-width:0;flex:1 1 auto;font-size:1.25em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.info>*{min-width:0;overflow:hidden;text-overflow:ellipsis}
.info .eventName{font-weight:800}
.info .matchRound,.info .bestOfLabel{color:var(--rail-muted)}
.info .sep{opacity:.45}
.info .matchRound:empty,.info .matchRound:empty+.sep{display:none}
.bestOfLabel:empty,.sep:has(+.bestOfLabel:empty){display:none}
.eventName:empty,.eventName:empty+.sep{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.t-ticket{--font:Georgia,"Times New Roman",serif;--panel:#f0ebe0;--ink:#111;--line:#111;--row:#f0ebe0;--row2:#f0ebe0;--row-ink:#111;--row-muted:#555;--head-bg:#f0ebe0;--head-ink:#111;--tile:#f0ebe0;--tile-ink:#111;--tile2:#f0ebe0;--tile2-ink:#111;--gcell:#f0ebe0;--gcell-ink:#333;--rail-bg:#111;--rail-ink:#f0ebe0;--rail-muted:#c9c2b2;--live:#111;--hot:#a3262a;--hot2:#a3262a;--soft:transparent;--serve:#a3262a;--radius:14px;}
.board{border:2px solid #111}.banner{border-bottom:2px solid #111;font-weight:700;letter-spacing:.3em}.row+.row{border-top:2px solid #111}.col>.cell+.cell{border-top:2px solid #111}.gcol,.sets{border-left:1px dashed #111}.pts{border-left:2px solid #111}.name{font-weight:700}.tscore{border:1px solid #111;background:transparent}.rail{border-top:2px solid #111}
</style>
</head>
<body>
<main class="stage"><article class="board t-ticket" data-osb-component="layout"><div class="in">
<div class="banner" data-osb-component="layout"><span class="sport">Table Tennis</span><div class="states"><span class="slot"><span class="isWarmUpStarted" data-osb-component="field" data-osb-field="isWarmUpStarted" style="opacity:0">Warm up</span><span class="isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0">Live</span></span><span class="slot" style="min-width:11em"><span class="isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">Between games</span><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">Game point</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">Match point</span></span></div></div>
<div class="main" data-osb-component="layout">
<div class="players" data-osb-component="layout">
<div class="row sideA" data-osb-component="layout">
<span class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
<img class="flag countryA" data-osb-component="field" data-osb-field="countryA" alt="">
<div class="who"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
<span class="sub"><img class="logo teamLogoURLA" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><span class="tname teamAName" data-osb-component="field" data-osb-field="teamAName"></span><span class="tscore teamAScore" data-osb-component="field" data-osb-field="teamAScore">0</span></span></div>
<span class="serve"><span class="isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity:0;display:block" isa="true"><span class="dot servingA" data-osb-component="field" data-osb-field="servingA" style="opacity:0"></span></span></span>
</div>
<div class="row sideB" data-osb-component="layout">
<span class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
<img class="flag countryB" data-osb-component="field" data-osb-field="countryB" alt="">
<div class="who"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
<span class="sub"><img class="logo teamLogoURLB" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""><span class="tname teamBName" data-osb-component="field" data-osb-field="teamBName"></span><span class="tscore teamBScore" data-osb-component="field" data-osb-field="teamBScore">0</span></span></div>
<span class="serve"><span class="isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0;display:block"><span class="dot servingB" data-osb-component="field" data-osb-field="servingB" style="opacity:0"></span></span></span>
</div>
</div>
<div class="scores" data-osb-component="layout">
<div class="col gcol isGame1Started" data-osb-component="layout" data-osb-field="isGame1Started"><span class="cell"><span class="num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span><span class="cell"><span class="num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></div>
<div class="col gcol isGame2Started" data-osb-component="layout" data-osb-field="isGame2Started"><span class="cell"><span class="num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span><span class="cell"><span class="num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></div>
<div class="col gcol isGame3Started" data-osb-component="layout" data-osb-field="isGame3Started"><span class="cell"><span class="num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span><span class="cell"><span class="num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></div>
<div class="col gcol isGame4Started" data-osb-component="layout" data-osb-field="isGame4Started"><span class="cell"><span class="num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span><span class="cell"><span class="num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></div>
<div class="col gcol isGame5Started" data-osb-component="layout" data-osb-field="isGame5Started"><span class="cell"><span class="num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span><span class="cell"><span class="num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></div>
<div class="col sets" data-osb-component="layout"><span class="cell"><span class="cap">Games</span><span class="num currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span><span class="cell"><span class="cap">Games</span><span class="num currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span></div>
<div class="col pts" data-osb-component="layout"><span class="cell"><span class="cap">Points</span><span class="num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><span class="cell"><span class="cap">Points</span><span class="num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span></div>
</div></div>
<div class="rail" data-osb-component="layout"><div class="cluster a" data-osb-component="layout">
<span class="slot sq"><span class="tmo badge isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0" title="Timeout active">T/O</span><span class="tmo badge isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="opacity:0" title="Timeout used">T/O</span></span>
<span class="slot sq"><span class="badge isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0" title="Yellow card">Y</span></span>
<span class="slot sq"><span class="badge isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0" title="Red card">R</span></span>
<span class="aux AScore" data-osb-component="field" data-osb-field="AScore" title="Result"></span>
</div>
<div class="info"><span class="eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="sep">/</span><span class="matchRound" data-osb-component="field" data-osb-field="matchRound"></span><span class="sep">/</span><span class="bestOfLabel matchFormatLabel bestOf" data-osb-component="field" data-osb-field="matchFormatLabel"></span></div>
<div class="cluster b" data-osb-component="layout">
<span class="slot sq"><span class="tmo badge isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0" title="Timeout active">T/O</span><span class="tmo badge isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="opacity:0" title="Timeout used">T/O</span></span>
<span class="slot sq"><span class="badge isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0" title="Yellow card">Y</span></span>
<span class="slot sq"><span class="badge isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0" title="Red card">R</span></span>
<span class="aux BScore" data-osb-component="field" data-osb-field="BScore" title="Result"></span>
</div></div>
</div></article></main>
</body>
</html>
