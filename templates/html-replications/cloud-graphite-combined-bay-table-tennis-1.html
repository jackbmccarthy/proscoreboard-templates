<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Tennis — Cloud Graphite Combined Bay Scorebug</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--cloud:#e8edeb;--graphite:#293b44;--light:#f7faf8;--rule:#aebbb8;position:relative;display:flex;flex-direction:column;width:min(55vw,1060px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:3px;background:var(--cloud);container-type:inline-size}
.sport-line{position:relative;display:flex;flex:0 0 auto;min-width:0;height:6.8cqw;align-items:center;padding:0 3.3cqw;border-bottom:1px solid var(--rule);color:var(--graphite);font-size:3.3cqw;line-height:1;font-weight:700;letter-spacing:.015em;white-space:nowrap}
.rows{display:flex;flex-direction:column;min-width:0}
.row{display:flex;min-width:0;min-height:18.6cqw;align-items:stretch}
.row+.row{border-top:2px solid var(--rule)}
.identity-wrap{display:flex;flex:0 0 2.8%;align-items:center;justify-content:flex-start;padding:3px 0}
.identity{display:block;width:84%;height:100%;border-radius:3px;background:#2178a8}
.jerseyColorB{background:#c95c5b}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:1cqw;padding:0 3.6cqw;color:#1d3038}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:7.4cqw;line-height:1.05;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .72cqw;width:.72cqw;height:.72cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--graphite)}
.numeric-bay{display:flex;flex:0 0 23%;min-width:0;flex-direction:column;align-items:center;justify-content:center;padding:1.25cqw 1.5cqw;background:var(--graphite);color:var(--light)}
.support{display:flex;flex:0 0 auto;align-items:baseline;justify-content:center;gap:.7cqw;width:100%;min-width:0;line-height:1}
.support-label{font-size:2.05cqw;font-weight:700;white-space:nowrap}.support-score{font-size:2.9cqw;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bay-rule{display:block;flex:0 0 1px;width:90%;margin:.9cqw 0;background:#aebbb8}
.primary{display:flex;flex:1 1 auto;min-width:0;min-height:0;width:100%;flex-direction:column;align-items:center;justify-content:center}
.primary-label{display:block;font-size:2.05cqw;line-height:1;font-weight:700;white-space:nowrap}
.primary-score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:7cqw;line-height:1.04;font-weight:700;font-variant-numeric:tabular-nums}
.point-slot{position:absolute;right:1.5%;top:0;width:22%;height:6.8cqw;color:var(--graphite);text-align:center;font-size:1.2cqw;font-weight:700}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--cloud)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.sport-line{height:35px;padding:0 12px;font-size:16px}.row{min-height:82px}.identity-wrap{flex-basis:6px;padding:2px 0}.identity{width:5px}.name-lane{gap:3px;padding:0 8px}.name{font-size:20px}.serve{flex-basis:6px;width:6px;height:6px}.numeric-bay{flex-basis:29%;padding:5px 5px}.support{gap:4px}.support-label{font-size:10px}.support-score{font-size:14px}.bay-rule{margin:4px 0}.primary-label{font-size:9px}.primary-score{font-size:31px}.point-slot{height:35px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sport-line"><span>TABLE TENNIS</span></div><div class="rows columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="numeric-bay columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="support"><span class="support-label">GAMES</span><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="bay-rule"></span><div class="primary"><span class="primary-label">POINTS</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="numeric-bay columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="support"><span class="support-label">GAMES</span><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><span class="bay-rule"></span><div class="primary"><span class="primary-label">POINTS</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></div></div><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body></html>
