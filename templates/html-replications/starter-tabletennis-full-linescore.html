<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Full Screen — Linescore</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.board{font-size:calc(100vw / 80);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
.flag{flex:0 0 auto;object-fit:cover;border-radius:.12em;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.chip{background:var(--chip-default,#8a96a3)}
.name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-weight:800;text-transform:uppercase;overflow-wrap:break-word;line-height:1;text-wrap:balance}
.team{display:flex;align-items:center;gap:.4em;min-width:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.tlogo{width:1.3em;height:1.3em;object-fit:contain}
.tname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:has(>.name:empty)>.team .tname{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.05}
.tscore{padding:0 .4em;border-radius:.2em;background:rgba(127,127,127,.28);font-variant-numeric:tabular-nums}
.gtag{display:inline-flex;align-items:center;gap:.3em;height:1.8em;padding:0 .8em;border-radius:.2em;font-size:1em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.state{width:10.5em;height:1.8em}
.st{border-radius:.2em;font-size:1em;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.srv-ball{display:block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ff8a1c 46%,#d65f00 100%);box-shadow:0 0 0 .14em rgba(0,0,0,.25)}
.meta{display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.meta>*{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta .sep{flex:0 0 auto;font-style:normal;padding:0 .5em;opacity:.55}
.meta .rd,.meta .bo{flex-shrink:0}
.meta .ev:empty+.s1,.meta .rd:empty+.s2,.meta .s1:has(+.rd:empty),.meta .s2:has(+.bo:empty){display:none}
.meta .ev:empty+.s1+.rd:empty+.s2{display:none}
.head:not(:has(.meta>:not(.sep):not(:empty))),.band:not(:has(.meta>:not(.sep):not(:empty))),.top:not(:has(.meta>:not(.sep):not(:empty))){display:none}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
.flag:not([src]),.tlogo:not([src]){display:none}
.team:not(:has(.tname:not(:empty))){display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.osb-core-fields{display:none!important}
.title:has(.big-ev:empty):has(.rd:empty):has(.bo:empty){display:none}
.board{display:flex;flex-direction:column;align-items:stretch;width:62em;max-width:94vw}
.card{display:flex;flex-direction:column}
.title{display:flex;flex-direction:column;align-items:center;gap:.35em;padding:1.1em 1.5em 1em;text-align:center}
.big-ev{font-size:2.3em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:flex;align-items:center;gap:.6em;font-size:1.2em;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sub .dot{width:.35em;height:.35em;border-radius:50%;background:currentColor;opacity:.6}
.sub .rd:empty+.dot,.sub .dot:has(+.bo:empty){display:none}
.title:has(.big-ev:empty){padding-top:.8em}
.table{display:flex;align-items:stretch}
.names{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
.lab{display:flex;align-items:center;justify-content:center;height:2.2em;font-size:.95em;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.names>.lab{justify-content:flex-start;padding-left:1.6em}
.who{display:flex;align-items:center;gap:.8em;height:5em;padding:0 1em 0 0;min-width:0}
.who .chip{flex:0 0 .6em;align-self:stretch}
.who .flag{width:3em;height:2em}
.nm{display:flex;flex-direction:column;justify-content:center;gap:.2em;min-width:0}
.who .name{font-size:2em}
.who .team{font-size:1.05em}
.nm:has(.name:empty) .team{font-size:1.6em;opacity:1}
.cols{display:flex;flex:0 0 auto}
.gc{display:flex;flex-direction:column;width:4.1em;flex:0 0 4.1em}
.v{display:flex;align-items:center;justify-content:center;height:5em;font-weight:800;font-variant-numeric:tabular-nums}
.gc .v>*{font-size:2.2em}
.won{display:flex;flex-direction:column;flex:0 0 7em}
.won .v>*{font-size:3.6em;font-weight:900}
.foot{display:flex;align-items:center;justify-content:center;gap:.6em;height:3.4em}
.board:not(:has(.isInBetweenGames[style*="opacity: 1"])) .gc:not([style*="display: none"]):not([style*="display:none"]):not(:has(~ .gc:not([style*="display: none"]):not([style*="display:none"])))>*>*{opacity:.4}
.t-ls{--font:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;--ink:#fff}
.t-ls .card{border-radius:.5em;overflow:hidden;box-shadow:0 1em 3em rgba(0,0,0,.5);background:#0b1626}
.t-ls .title{background:linear-gradient(180deg,#14284a,#0f1f3a);color:#fff}
.t-ls .sub{color:#8fb4ec}
.t-ls .table{background:#0f1f3a;border-top:.2em solid #3d8bff}
.t-ls .lab{background:#0b1626;color:#7f9cc7}
.t-ls .who+.who,.t-ls .v+.v{border-top:1px solid #23395f}
.t-ls .gc{border-left:1px solid #23395f;color:#dfe8f7}
.t-ls .won{background:#3d8bff;color:#fff}
.t-ls .won .lab{background:#2f73d9;color:#e6f0ff}
.t-ls .won .v+.v{border-top:1px solid #74abff}
.t-ls .gtag{background:#14284a;color:#fff;box-shadow:inset 0 0 0 .1em #3d8bff}
.t-ls .st-warm,.t-ls .st-break{background:#0b1626;color:#e6eefb;box-shadow:inset 0 0 0 .12em #3d5b8a}
.t-ls .st-gp{background:#ff8a1c;color:#111}
.t-ls .st-mp{background:#e3262f;color:#fff}
.t-ls .st-final{background:#fff;color:#0b1626}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.lab{font-size:1.25vw!important}
.dot{width:1.016vw!important;height:1.016vw!important;min-width:0!important;flex-shrink:0!important}
/* end stream-size floor */

</style>
</head>
<body>
<main class="stage"><article class="board t-ls" data-osb-component="layout"><div class="card" data-osb-component="layout"><div class="title" data-osb-component="layout"><span class="eventName big-ev" data-osb-component="field" data-osb-field="eventName"></span><span class="sub"><span class="matchRound rd" data-osb-component="field" data-osb-field="matchRound"></span><i class="dot"></i><span class="matchFormatLabel bestOf bo" data-osb-component="field" data-osb-field="matchFormatLabel"></span></span></div><div class="table" data-osb-component="layout"><div class="names" data-osb-component="layout"><span class="lab">Game</span><div class="who wA" data-osb-component="layout"><span class="jerseyColorA chip" data-osb-component="field" data-osb-field="jerseyColorA"></span><img class="countryA flag" data-osb-component="field" data-osb-field="countryA" alt=""><span class="nm"><span class="combinedAName name" data-osb-component="field" data-osb-field="combinedAName"></span><span class="team"><img class="teamLogoURLA tlogo" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><span class="teamAName tname" data-osb-component="field" data-osb-field="teamAName"></span><span class="teamAScore tscore" data-osb-component="field" data-osb-field="teamAScore">0</span></span></span></div><div class="who wB" data-osb-component="layout"><span class="jerseyColorB chip" data-osb-component="field" data-osb-field="jerseyColorB"></span><img class="countryB flag" data-osb-component="field" data-osb-field="countryB" alt=""><span class="nm"><span class="combinedBName name" data-osb-component="field" data-osb-field="combinedBName"></span><span class="team"><img class="teamLogoURLB tlogo" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""><span class="teamBName tname" data-osb-component="field" data-osb-field="teamBName"></span><span class="teamBScore tscore" data-osb-component="field" data-osb-field="teamBScore">0</span></span></span></div></div><div class="cols" data-osb-component="layout"><div class="gc isGame1Started" data-osb-component="layout" data-osb-field="isGame1Started" style="display:none"><span class="lab">1</span><span class="v"><span class="game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span><span class="v"><span class="game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></div><div class="gc isGame2Started" data-osb-component="layout" data-osb-field="isGame2Started" style="display:none"><span class="lab">2</span><span class="v"><span class="game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span><span class="v"><span class="game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></div><div class="gc isGame3Started" data-osb-component="layout" data-osb-field="isGame3Started" style="display:none"><span class="lab">3</span><span class="v"><span class="game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span><span class="v"><span class="game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></div><div class="gc isGame4Started" data-osb-component="layout" data-osb-field="isGame4Started" style="display:none"><span class="lab">4</span><span class="v"><span class="game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span><span class="v"><span class="game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></div><div class="gc isGame5Started" data-osb-component="layout" data-osb-field="isGame5Started" style="display:none"><span class="lab">5</span><span class="v"><span class="game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span><span class="v"><span class="game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></div><div class="gc isGame6Started" data-osb-component="layout" data-osb-field="isGame6Started" style="display:none"><span class="lab">6</span><span class="v"><span class="game6AScore" data-osb-component="field" data-osb-field="game6AScore">0</span></span><span class="v"><span class="game6BScore" data-osb-component="field" data-osb-field="game6BScore">0</span></span></div><div class="gc isGame7Started" data-osb-component="layout" data-osb-field="isGame7Started" style="display:none"><span class="lab">7</span><span class="v"><span class="game7AScore" data-osb-component="field" data-osb-field="game7AScore">0</span></span><span class="v"><span class="game7BScore" data-osb-component="field" data-osb-field="game7BScore">0</span></span></div><div class="gc isGame8Started" data-osb-component="layout" data-osb-field="isGame8Started" style="display:none"><span class="lab">8</span><span class="v"><span class="game8AScore" data-osb-component="field" data-osb-field="game8AScore">0</span></span><span class="v"><span class="game8BScore" data-osb-component="field" data-osb-field="game8BScore">0</span></span></div><div class="gc isGame9Started" data-osb-component="layout" data-osb-field="isGame9Started" style="display:none"><span class="lab">9</span><span class="v"><span class="game9AScore" data-osb-component="field" data-osb-field="game9AScore">0</span></span><span class="v"><span class="game9BScore" data-osb-component="field" data-osb-field="game9BScore">0</span></span></div></div><div class="won" data-osb-component="layout"><span class="lab">Games</span><span class="v"><span class="currentAMatchScore AScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span><span class="v"><span class="currentBMatchScore BScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span></div></div></div><div class="foot" data-osb-component="layout"><span class="isMatchStarted gtag" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0">Game <span class="currentGame cg" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="slot state"><span class="isWarmUpStarted st st-warm" data-osb-component="field" data-osb-field="isWarmUpStarted" style="opacity:0">Warm-up</span><span class="isInBetweenGames st st-break" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0">Between games</span><span class="isComplete st st-final" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">Final</span><span class="isGamePoint st st-gp" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">Game point</span><span class="isMatchPoint st st-mp" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">Match point</span></span></div></article><div class="osb-core-fields" aria-hidden="true"><span class="currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></main>
</body>
</html>
