ont-weight:500;font-display:block;src:url("/fonts/scoreboard/barlow-500-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;ascent-override:95%;descent-override:25%;line-gap-override:0%}@font-face{font-family:"OSB Barlow";font-style:normal;font-weight:600;font-display:block;src:url("/fonts/scoreboard/barlow-600-latin.woff2") format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;ascent-override:95%;descent-override:25%;line-gap-override:0%}@font-face{font-family:"OSB Barlow";font-style:normal;font-weight:600;font-display:block;src:url("/fonts/scoreboard/barlow-600-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;ascent-override:95%;descent-override:25%;line-gap-override:0%}@font-face{font-family:"OSB Barlow";font-style:normal;font-weight:700;font-display:block;src:url("/fonts/scoreboard/barlow-700-latin.woff2") format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;ascent-override:95%;descent-override:25%;line-gap-override:0%}@font-face{font-family:"OSB Barlow";font-style:normal;font-weight:700;font-display:block;src:url("/fonts/scoreboard/barlow-700-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;ascent-override:95%;descent-override:25%;line-gap-override:0%}

*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.flag:not([src]),.tlogo:not([src]){display:none}
/* runtime flags: warm-up stays on after the start; the used marker gives way to a running timeout; match point outranks game point */
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.board:has(.isComplete[style*="opacity: 1"]) :is(.isGamePoint,.isMatchPoint,.isInBetweenGames){opacity:0!important}
.won{position:absolute;z-index:0}
.gs{position:relative;z-index:1}
/* the history lists completed games only; the game in play is the live points */
.hcol:not(:has(.won[style*="opacity: 1"])){display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== full-screen line score (round 8): the live points are the biggest thing on the screen; completed games only in the ledger ===== */
:root{--gold:#ffd23f;--navy:#0d1830;--panel:#132244;--line:#26396a;--mute:#b9c6e0;--blue:#3d63b8;--red:#e8323c}
.board{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;font-size:1.12vw;font-family:"OSB Barlow Condensed","Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.sheet{display:flex;flex-direction:column;gap:1.2em;width:max-content;min-width:79.2em;padding:1.6em 1.8em 1.8em;border-radius:.6em;background:linear-gradient(180deg,#172a52 0%,#0b1429 100%);box-shadow:inset 0 .3em 0 var(--gold),0 1em 3em rgba(0,0,0,.45)}
.top{display:flex;align-items:center;justify-content:space-between;gap:2em}
.title{display:flex;flex-direction:column;gap:.5em;flex:0 0 auto;text-transform:uppercase;white-space:nowrap}
.ev{font-size:2.9em;font-weight:800;line-height:1;letter-spacing:.02em}
.sub{display:flex;align-items:center;gap:.5em;font-size:1.7em;font-weight:700;letter-spacing:.08em;color:#d5def0}
.sub .sep{font-style:normal;color:#6f82ad}
.sub .rd:empty+.sep,.sub .sep:has(+.bo:empty){display:none}
.dbl{margin-left:.3em;padding:.1em .5em;border-radius:.2em;background:#dfe7f6;color:var(--navy);letter-spacing:.08em}
.state{width:17em;height:3.3em}
.state>*{left:auto;padding:0 1em;border-radius:.3em;font-size:1.5em;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.plbl{box-shadow:inset 0 0 0 .12em #6f82ad;color:#dfe7f6}
.warm,.gtag{background:#fff;color:var(--navy)}
.gnum::after{content:"\00a0in play"}
/* between games the game tag carries the break label itself (the tag never moves) */
.gtag>.bn{position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;padding:0 1em;border-radius:.3em;background:var(--gold);color:#111;white-space:nowrap}
.gtag:has(>.bn[style*="opacity: 1"])>.gnum{visibility:hidden}
.fin{background:var(--gold);color:#111}
.state:has(>[style*="opacity: 1"]) .plbl{opacity:0}
.tielbl{display:none;font-size:2.6em;font-weight:800;text-transform:uppercase}
.tiebar{display:none;align-items:center;gap:1.2em;min-height:3.2em;padding:.3em 1.2em;border-radius:.35em;background:var(--panel);font-size:1.75em;font-weight:800;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.board:has(.tname:not(:empty)) .tiebar{display:flex}
.tside{display:flex;align-items:center;gap:.5em;flex:1 1 0;min-width:max-content}
.tb{justify-content:flex-end}
.tlogo{width:1.6em;height:1.6em;object-fit:contain}
.tbox{display:flex;align-items:center;gap:.35em;height:1.8em;padding:0 .6em;border-radius:.25em;background:#dfe7f6;color:var(--navy);font-variant-numeric:tabular-nums}
.tbox i{font-style:normal;letter-spacing:.08em;margin-right:.2em}
.tbox .tscore{font-size:1.2em}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) :is(.table,.top){display:none}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tielbl{display:block}
/* the table */
.table{display:flex;align-items:stretch;border-radius:.35em;overflow:hidden;background:var(--panel)}
.hd{display:flex;align-items:center;justify-content:center;height:calc(2.4em / 1.45);background:var(--navy);color:#fff;font-size:1.45em;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.players{display:grid;grid-template-columns:.55em auto auto 3.2em 8.2em 10.9em 1fr 14.4em;align-content:start;flex:1 1 auto;min-width:max-content}
.hdp{grid-column:1 / -1}
.row>.kit{grid-column:1}.row>.flag{grid-column:2}.row>.nm{grid-column:3}.row>.cards{grid-column:4}.row>.to-slot{grid-column:5}.row>.ptag{grid-column:6}
.hdp{justify-content:flex-start;padding-left:1em}
.row{display:grid;grid-column:1 / -1;grid-template-columns:subgrid;align-items:center;column-gap:.9em;height:6.6em;padding-right:1em;border-top:.08em solid var(--line)}
.kit{align-self:stretch;flex:0 0 .55em;width:.55em;background:#5a6f9e}
.flag{flex:0 0 auto;width:2.7em;height:1.8em;object-fit:cover;border-radius:.15em;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.nm{display:flex;align-items:center;gap:.5em;flex:0 0 auto;margin-left:.3em}
.name{font-size:2.45em;line-height:1;font-weight:800;text-transform:uppercase;white-space:nowrap;letter-spacing:.01em;text-box:trim-both cap alphabetic}
.wslot{width:1.9em;height:1.9em}
.win{border-radius:50%;background:var(--gold)}
.win::after{content:"";width:.42em;height:.78em;margin-top:-.16em;border:solid var(--navy);border-width:0 .2em .2em 0;transform:rotate(45deg)}
/* status columns right after the name, the same x in every state */
.cards{display:flex;gap:.25em;width:2.85em}
.card-slot{width:1.45em;height:2.05em}
.card{border-radius:.15em;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.yc{background:#ffd400}.rc{background:#e3262f}
.to-slot{width:8.2em;height:3em}
.to-slot>*{gap:.4em;border-radius:.25em;font-size:1.45em;font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.to-slot .tx{font-style:normal;text-box:trim-both cap alphabetic}
.to-on{background:var(--gold);color:#111}
.to-used{background:#e6edf8;color:var(--navy)}
.tclock{padding:.18em .28em;border-radius:.15em;background:#111;color:var(--gold);font-variant-numeric:tabular-nums;text-box:trim-both cap alphabetic;line-height:1}
/* the point banner: one shared GAME / MATCH POINT band in its own column, on the row of the side that holds it */
.ptag{width:10.4em;height:3em;margin-left:.5em}
.ptag>.pg{border-radius:.25em;font-size:1.4em;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.pg-gp{background:var(--gold);color:#111}
.pg-mp{background:var(--red);color:#fff}
.board:has(.isBGamePoint[style*="opacity: 1"]) .rA .ptag>.isGamePoint,.board:has(.isBMatchPoint[style*="opacity: 1"]) .rA .ptag>.isMatchPoint{transform:translateY(calc(6.6em / 1.4))}
/* ledger: completed games */
/* the ledger lies over the last 11.4em of the player rows (room for three games): before a game is won that space is simply row space */
.hist{position:relative;z-index:1;display:flex;align-items:stretch;justify-content:flex-end;min-width:14.4em;margin-left:-14.4em}
.hcol{background:var(--panel)}
.board:has(.isAWinner[style*="opacity: 1"]) .hcol .hc.a,.board:has(.isBWinner[style*="opacity: 1"]) .hcol .hc.b{background:#1f3770}
.hist::before{content:"";display:none}
.hcol{display:flex;flex-direction:column;flex:0 0 auto;width:3.3em;border-left:.08em solid var(--line)}
.hl{display:flex;align-items:center;justify-content:center;height:calc(2.4em / 1.45);background:var(--navy);color:#fff;font-size:1.45em;font-weight:800;letter-spacing:.06em}
.hc{position:relative;display:flex;align-items:center;justify-content:center;height:calc(6.6em / 2);font-size:2em;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;border-top:calc(.08em / 2) solid var(--line);color:#c3cee4}
.hc .won{inset:.18em .14em;border-radius:.08em;background:var(--blue)}
.hc:has(.won[style*="opacity: 1"]){color:#fff}
.col{display:flex;flex-direction:column;flex:0 0 auto}
.cell{position:relative;display:flex;align-items:center;justify-content:center;height:6.6em;border-top:.08em solid var(--line);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.gcol{width:5em;background:#1b2b55;border-left:.08em solid var(--line)}
.gcol .cell>span{font-size:2.6em}
.gcol .hd{font-size:1.3em;letter-spacing:.02em}
.svcol{width:2.6em}
.svcol .hd{background:var(--navy)}
.srv{width:1.9em;height:1.9em}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff9a3c 45%,#d65f00 100%);box-shadow:0 0 0 .12em rgba(0,0,0,.3)}
/* the game in play: its own wide gold ledger column, the biggest numbers on the screen */
.hist>.hcol:not([style*="display:none"]):not([style*="display: none"]):not(:has(.won[style*="opacity: 1"])){display:flex!important;width:7.8em;background:var(--gold);border-left:0}
.hcol:not(:has(.won[style*="opacity: 1"])) .hl{background:#e8b900;color:#111}
.hcol:not(:has(.won[style*="opacity: 1"])) .hl::before{content:"";width:.45em;height:.45em;margin-right:.35em;border-radius:50%;background:var(--red)}
.hcol:not(:has(.won[style*="opacity: 1"])) .hc{font-size:4.3em;height:calc(6.6em / 4.3);border-top:calc(.08em / 4.3) solid #e8b900;color:#111;letter-spacing:-.01em}
/* the side with the point: its serve cell fills with the point colour */
.svcol .cell{position:relative}
.svcol .srv{position:relative;z-index:1}
/* the side with the point: its live cell gets a ring in the point colour */
.acc{position:absolute;inset:0;z-index:0;pointer-events:none}
.hcol:has(.won[style*="opacity: 1"]) .acc{display:none}
.acc-gp{background:#fff4c2}
.acc-mp{background:var(--red)}
.hc:has(>.acc-mp[style*="opacity: 1"]) .gs{color:#fff}
.row:has(.to-on[style*="opacity: 1"]){background:linear-gradient(90deg,#4a3f10,#132244 70%)}
/* no game in play (pre-match, change of ends, final): GAMES takes the live column's width so the board keeps one width */
.board:has(.isComplete[style*="opacity: 1"]) .svcol{display:none}
.board:has(.isComplete[style*="opacity: 1"]) .hcol{width:4.1em}
.board:has(.isComplete[style*="opacity: 1"]) .hc{font-size:2.4em;height:calc(6.6em / 2.4)}
.board:has(.isComplete[style*="opacity: 1"]) .gcol{width:7.6em}
.board:has(.isComplete[style*="opacity: 1"]) .gcol .cell>span{font-size:3.6em}
.board:has(.isAWinner[style*="opacity: 1"]) .gcol .a,.board:has(.isBWinner[style*="opacity: 1"]) .gcol .b{background:var(--gold);color:#111}
.board:has(.isAWinner[style*="opacity: 1"]) .rA,.board:has(.isBWinner[style*="opacity: 1"]) .rB{background:#1f3770}
.board:has(.isAWinner[style*="opacity: 1"]) .rB,.board:has(.isBWinner[style*="opacity: 1"]) .rA{color:#aebbd6}
.osb-core-fields{display:none!important}
</style>
</head>
<body>
<main class="board t-line" data-osb-component="layout">
<section class="sheet" data-osb-component="layout">
<header class="top"><span class="title"><span class="eventName ev" data-osb-component="field" data-osb-field="eventName"></span><span class="sub"><span class="matchRound rd" data-osb-component="field" data-osb-field="matchRound"></span><i class="sep">·</i><span class="matchFormatLabel bestOf bo" data-osb-component="field" data-osb-field="matchFormatLabel"></span><span class="isDoubles dbl" data-osb-component="field" data-osb-field="isDoubles" style="opacity:0">Doubles</span></span></span><span class="slot state"><span class="plbl">Pre-match</span><span class="isWarmUpStarted warm" data-osb-component="field" data-osb-field="isWarmUpStarted" style="opacity:0">Warm-up</span><span class="isMatchStarted gtag" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0"><span class="gnum">Game <span class="currentGame cg" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="isInBetweenGames bn" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity:0"><span>Change of ends · game <b class="nextGame" data-osb-component="field" data-osb-field="nextGame"></b> next</span></span></span><span class="isComplete fin" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">Final result</span></span></header>
