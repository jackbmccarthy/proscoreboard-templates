<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Full Screen — Linescore</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
html,body{height:100%;overflow:hidden}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.flag:not([src]),.tlogo:not([src]){display:none}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.won{position:absolute;z-index:0}
.gs{position:relative;z-index:1}
.gtag .nx{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .now{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.osb-core-fields{display:none!important}
/* a card centred on a transparent page */
.board{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.25vw;font-family:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#fff;background:transparent;-webkit-font-smoothing:antialiased;--navy:#0d1830;--panel:#132244;--line:#26396a;--gold:#ffd23f;--mute:#a9bbdd}
.card{display:flex;flex-direction:column;gap:1.1em;width:74em;padding:1.5em 1.8em 1.3em;border-radius:.8em;background:linear-gradient(180deg,#172a52 0%,#0b1429 100%);box-shadow:inset 0 .3em 0 var(--gold)}
/* header: event, round and format; the match state on the right */
.top{display:flex;align-items:center;justify-content:space-between;gap:2em;min-width:0}
.title{display:flex;flex-direction:column;gap:.35em;min-width:0;text-transform:uppercase}
.kick{font-size:1.3em;font-weight:800;letter-spacing:.22em;color:var(--gold)}
.ev{font-size:2.5em;font-weight:800;letter-spacing:.03em;line-height:1.04;overflow-wrap:normal;hyphens:none;text-wrap:balance}
.ev:empty{display:none}
.sub{display:flex;align-items:center;gap:.7em;font-size:1.55em;font-weight:700;letter-spacing:.12em;color:var(--mute)}
.sub .sep{font-style:normal;opacity:.75}
.sub .rd:empty+.sep,.sub .sep:has(+.bo:empty){display:none}
.state{width:15em;height:3.2em}
.state>*{border-radius:.3em;font-size:1.45em;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.plbl{box-shadow:inset 0 0 0 .1em #3b5285;color:var(--mute)}
.state:has(>.gtag[style*="opacity: 1"]) .plbl,.state:has(>.fin[style*="opacity: 1"]) .plbl,.board:not(:has(.isMatchStarted[style*="opacity: 1"])) .state:has(>.warm[style*="opacity: 1"]) .plbl{opacity:0}
.dbl{opacity:0;padding:.1em .5em;border-radius:.2em;background:#dfe7f6;color:var(--navy);letter-spacing:.1em}
.gtag{background:#fff;color:var(--navy)}
.fin{background:var(--gold);color:#111}
.warm{background:#2a6df4;color:#fff}
/* team tie strip */
.tielbl{display:none;font-size:2.5em;font-weight:800;letter-spacing:.03em;line-height:1.04;text-transform:uppercase}
.tiebar{display:none;align-items:center;gap:1em;min-height:3.6em;padding:.3em 1.2em;border-radius:.4em;background:var(--panel);box-shadow:inset 0 0 0 .08em var(--line);font-size:1.6em;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.board:has(.tname:not(:empty)) .tiebar{display:flex}
.tside{display:flex;align-items:center;gap:.6em;flex:1 1 0;min-width:0}
.tb{justify-content:flex-end;text-align:right}
.tlogo{width:1.8em;height:1.8em;object-fit:contain;flex:0 0 auto}
.tname{min-width:0;line-height:1.05;overflow-wrap:normal;hyphens:none}
.tbox{display:flex;align-items:center;gap:.4em;flex:0 0 auto;height:2em;padding:0 .7em;border-radius:.25em;background:var(--gold);color:#111;font-variant-numeric:tabular-nums}
.tbox i{font-style:normal;letter-spacing:.12em;margin-right:.2em}
.tbox .tscore{font-size:1.3em}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) :is(.table,.foot,.state){display:none}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tiebar{font-size:2em;min-height:3.6em}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tielbl{display:block}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .title{display:none}
/* the line score: players, every game in order (G1-G3 always framed), the game in play lit, games won */
.table{display:flex;align-items:stretch;border-radius:.5em;overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 .08em var(--line)}
.hd{display:flex;align-items:center;justify-content:center;height:2.5em;background:var(--navy);color:#d6e0f2;font-size:1.35em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.players{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
.players>.hd{justify-content:flex-start;padding:0 1.1em}
.row{display:flex;align-items:center;gap:.7em;height:5.4em;padding-right:0;min-width:0}
.row+.row,.hc+.hc,.cell+.cell{border-top:.08em solid var(--line)}
.kit{flex:0 0 .55em;align-self:stretch;background:#55647e}
.flag{flex:0 0 auto;width:2.6em;height:1.75em;object-fit:cover;border-radius:.15em;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.nmw{display:flex;align-items:center;gap:.6em;flex:1 1 auto;min-width:0}
.name{min-width:0;font-size:1.9em;line-height:1.02;font-weight:800;text-transform:uppercase;overflow-wrap:normal;word-break:normal;hyphens:none}
.wslot{width:2em;height:2em}
.wslot:not(:has(>[style*="opacity: 1"])){display:none}
/* state column (time-out, cards) and serve column: fixed slots of their own, aligned in both rows */
.win{border-radius:50%;background:var(--gold)}
.win::after{content:"";width:.5em;height:.95em;margin-top:-.2em;border:solid #111;border-width:0 .22em .22em 0;transform:rotate(45deg)}
.marks{display:flex;align-items:center;justify-content:flex-end;gap:.55em;flex:0 0 14em;align-self:stretch;padding:0 .4em}
.to-slot{width:9.4em;height:2.6em}

.to-on,.to-used{gap:.4em;border-radius:.25em;font-size:1.3em;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.to-on{background:var(--gold);color:#111}
.to-used{background:#dfe7f6;color:var(--navy)}
.tclock{display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.45em;border-radius:.2em;background:#111;color:var(--gold);font-variant-numeric:tabular-nums}
.card-slot{width:1.7em;height:2.4em}
.cardk{border-radius:.16em;box-shadow:0 0 0 1px rgba(0,0,0,.35);transform:rotate(-8deg)}
.yc{background:#ffd400}.rc{background:#e3262f}
.sv{display:flex;align-items:center;justify-content:center;flex:0 0 4.2em;align-self:stretch}
.s2slot{width:2.9em;height:1.9em}
.ss2{border-radius:.25em;background:#dfe7f6;color:var(--navy);font-size:1.15em;font-weight:900;letter-spacing:.06em}
.srv{width:2.7em;height:2.7em}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff9a3c 45%,#d65f00 100%);box-shadow:0 0 0 .14em rgba(0,0,0,.3),0 0 .6em rgba(255,154,60,.5)}
.hist{position:relative;display:flex}
.hcol{display:flex;flex-direction:column;flex:0 0 auto;width:4.6em;border-left:.08em solid var(--line)}
.hc{position:relative;display:flex;align-items:center;justify-content:center;height:calc(5.4em / 2);font-size:2em;font-family:"DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;color:#8293b3}
.hc .won{inset:.3em .3em;border-radius:.15em;background:#2a3d63}
.hc:has(.won[style*="opacity: 1"]){color:#fff}
/* the game in play: the only started game nobody has won yet */
.hcol:not(:has(.won[style*="opacity: 1"])){width:7.6em;background:var(--gold);border-left:0}
.hcol:not(:has(.won[style*="opacity: 1"])) .hd{background:#e8b900;color:#111}
.hcol:not(:has(.won[style*="opacity: 1"])) .hd::after{content:"\00a0·\00a0live"}
.hcol:not(:has(.won[style*="opacity: 1"])) .hc{font-size:4.2em;height:calc(5.4em / 4.2);color:#111}
.hcol:not(:has(.won[style*="opacity: 1"])) .hc+.hc{border-top-color:#e8b900}
/* frames for G1-G3 before they start */
.ph{display:none;flex-direction:column;flex:0 0 auto;width:4.6em;border-left:.08em solid var(--line)}
.ph .hc{color:#4a5e8c}
.hist:has(>.isGame1Started:is([style*="display:none"],[style*="display: none"]))>.ph1,.hist:has(>.isGame2Started:is([style*="display:none"],[style*="display: none"]))>.ph2,.hist:has(>.isGame3Started:is([style*="display:none"],[style*="display: none"]))>.ph3{display:flex}
.ph1{order:1}.isGame1Started{order:1}.ph2{order:2}.isGame2Started{order:2}.ph3{order:3}.isGame3Started{order:3}.isGame4Started{order:4}.isGame5Started{order:5}.isGame6Started{order:6}.isGame7Started{order:7}.isGame8Started{order:8}.isGame9Started{order:9}
.gcol{display:flex;flex-direction:column;flex:0 0 auto;width:6.4em;background:#1c2f5a;border-left:.3em solid var(--navy)}
.gcol .hd{background:#13203a;color:#fff}
.cell{display:flex;align-items:center;justify-content:center;font-family:"DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;font-size:2.2em;height:calc(5.4em / 2.2);color:#dbe4f5}
/* footer: one match-level banner at a time (warm-up, change of ends, game point, match point) */
.foot{display:flex;justify-content:center;height:3.4em}
.foot:not(:has(:is(.isInBetweenGames,.isGamePoint,.isMatchPoint)[style*="opacity: 1"])),.board:has(.isComplete[style*="opacity: 1"]) .foot{display:none}
.banner{width:20em;height:3.4em}
.bn{border-radius:.35em;font-size:1.5em;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.bn-warm,.bn-break{background:var(--panel);color:#fff;box-shadow:inset 0 0 0 .08em #3b5285}
.bn-gp,.bn-mp{background:#fff;color:var(--navy)}
.bn-mp{box-shadow:inset 0 0 0 .2em var(--gold)}
.board:has(.isMatchStarted[style*="opacity: 1"]) .bn-warm{opacity:0!important}
/* final: games won is the result; winner row lit with its check after the name, loser readable */
.board:has(.isComplete[style*="opacity: 1"]) .gcol{width:7em;background:var(--gold);color:#111;border-left-color:var(--navy)}
.board:has(.isComplete[style*="opacity: 1"]) .gcol .hd{background:#e8b900;color:#111}
.board:has(.isComplete[style*="opacity: 1"]) .gcol .cell{font-size:4em;height:calc(5.4em / 4);color:inherit}
.board:has(.isAWinner[style*="opacity: 1"]) :is(.row.b,.gcol .b),.board:has(.isBWinner[style*="opacity: 1"]) :is(.row.a,.gcol .a){color:#a3b2cf}
.board:has(.isAWinner[style*="opacity: 1"]) .gcol .b,.board:has(.isBWinner[style*="opacity: 1"]) .gcol .a{background:#1c2f5a}
.board:has(.isAWinner[style*="opacity: 1"]) .row.a,.board:has(.isBWinner[style*="opacity: 1"]) .row.b{background:#1c3366}
.board:has(.isComplete[style*="opacity: 1"]) .ph{display:none!important}
</style>
</head>
