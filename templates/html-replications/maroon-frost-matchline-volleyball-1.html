<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Maroon Frost Matchline 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(92vw,911px);max-width:100%;aspect-ratio:2.31;overflow:hidden;border-radius:6px;background:#e9edef;color:#26343b;container-type:inline-size}
.matchline{display:flex;align-items:center;justify-content:space-between;flex:0 0 17%;min-width:0;padding:0 28px;background:#572f3c;color:#f8f6f2}
.sport-tag{display:block;min-width:0;overflow:hidden;font-size:clamp(17px,4.4cqw,44px);font-weight:800;letter-spacing:.08em;line-height:1;text-overflow:ellipsis;white-space:nowrap}
.status{display:flex;align-items:center;align-self:stretch;gap:.35em;padding-left:35px;border-left:2px solid #bec8cb;font-size:clamp(17px,3.3cqw,34px);font-weight:800;line-height:1;white-space:nowrap}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.teams{display:flex;flex:1 1 0;min-height:0;flex-direction:column}
.team{display:flex;align-items:stretch;flex:1 1 0;min-height:0;min-width:0}
.team+.team{border-top:2px solid #bec8cb}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;flex:0 0 26px;align-self:stretch;background:#298bec}
.jerseyColorB{background:#f0505b}
.name-stack{display:flex;flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:1px;padding:0 26px}
.name{display:block;min-width:0;overflow:hidden;color:#26343b;font-size:clamp(30px,7.4cqw,75px);font-weight:700;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.sets-line{display:flex;align-items:center;gap:.4em;color:#26343b;font-size:clamp(17px,3.3cqw,36px);font-weight:750;line-height:1;white-space:nowrap}
.set-score{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.scorecap{display:flex;align-items:center;justify-content:center;flex:0 0 22.5%;min-width:0;flex-direction:column;gap:2px;background:#572f3c;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(50px,10cqw,102px);font-weight:800;line-height:1;text-align:center}
.points-label{display:block;max-width:100%;overflow:hidden;font-size:clamp(13px,2.4cqw,26px);font-weight:750;line-height:1}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:7px}
 .board{width:100%;height:180px;aspect-ratio:auto;border-radius:3px}
 .matchline{flex-basis:18%;padding:0 8px}
 .sport-tag{font-size:clamp(10px,3cqw,14px)}
 .status{padding-left:8px;border-width:1px;font-size:clamp(10px,3cqw,14px)}
 .team+.team{border-width:1px}
 .identity{flex-basis:6px}
 .name-stack{gap:1px;padding:0 8px}
 .name{font-size:clamp(17px,5.2cqw,24px)}
 .sets-line{font-size:clamp(10px,3cqw,14px)}
 .scorecap{flex-basis:23%;gap:1px}
 .score{font-size:clamp(29px,9.3cqw,42px)}
 .points-label{font-size:clamp(8px,2.6cqw,12px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="matchline rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
  <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-stack" data-osb-component="layout"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="sets-line" data-osb-component="layout"><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span data-osb-component="text">SETS</span></div></div></div><div class="scorecap" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="points-label" data-osb-component="text">POINTS</span></div></div>
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-stack" data-osb-component="layout"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="sets-line" data-osb-component="layout"><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span data-osb-component="text">SETS</span></div></div></div><div class="scorecap" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="points-label" data-osb-component="text">POINTS</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
