<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copper Slate Score Rail Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #1e2b35; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px; }
.board { width: min(100%, 990px); display: flex; flex-direction: column; overflow: hidden; border: 2px solid #9babb3; border-radius: 3px; background: #dce4e8; }
.header { height: 80px; flex: 0 0 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 2px solid #b98262; background: #f4f5f2; color: #1e2b35; font-weight: 800; }
.sport { font-size: 47px; line-height: 1; }
.sets-head { font-size: 26px; line-height: 1; }
.team { min-height: 120px; display: flex; align-items: stretch; }
.team + .team { border-top: 2px solid #9babb3; }
.point-cell { flex: 0 0 145px; width: 145px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #252c33; color: #fff; }
.point-label { height: 19px; font-size: 19px; font-weight: 700; line-height: 1; }
.point-label.blank { visibility: hidden; }
.point-value { display: block; min-width: 2.5ch; text-align: center; font-size: 78px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.tick { display: block; flex: 0 0 40px; width: 40px; align-self: stretch; background: #b98262; }
.jerseyColorB { background: #7ea6b5; }
.name { flex: 1 1 0; display: block; align-self: center; overflow: hidden; padding: 0 27px; text-overflow: ellipsis; white-space: nowrap; font-size: 59px; font-weight: 700; line-height: 1; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.sets-score { flex: 0 0 124px; width: 124px; display: flex; align-items: center; justify-content: center; font-size: 55px; font-weight: 700; font-variant-numeric: tabular-nums; }
.footer { min-height: 94px; display: flex; align-items: center; justify-content: center; gap: 30px; border-top: 2px solid #9babb3; background: #252c33; color: #fff; font-weight: 700; }
.footer-label { color: #9babb3; font-size: 37px; }
.set-value { display: block; min-width: 1.4ch; text-align: center; font-size: 65px; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media (max-width: 700px) {
  .stage { padding: 10px; }
  .header { height: 44px; flex-basis: 44px; padding: 0 12px; }
  .sport { font-size: clamp(19px, 5.5vw, 30px); }
  .sets-head { font-size: 15px; }
  .team { min-height: 75px; }
  .point-cell { flex-basis: 75px; width: 75px; }
  .point-label { height: 13px; font-size: 10px; }
  .point-value { font-size: 42px; }
  .tick { flex-basis: 12px; width: 12px; }
  .name { padding: 0 10px; font-size: clamp(18px, 5.7vw, 34px); }
  .sets-score { flex-basis: 51px; width: 51px; font-size: 29px; }
  .footer { min-height: 55px; gap: 12px; }
  .footer-label { font-size: 21px; }
  .set-value { font-size: 34px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport">VOLLEYBALL</span><span class="sets-head">SETS</span></header>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="point-cell"><span class="point-label">POINTS</span><span class="point-value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="sets-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="point-cell"><span class="point-label blank">POINTS</span><span class="point-value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="sets-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
      <div class="footer rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="footer-label">SET</span><span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></div>
    </article>
    <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
  </main>
</body>
</html>
