<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertical Name Spine Volleyball — Duel</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { color: #f8f5ee; font-family: Arial, Helvetica, sans-serif; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { --panel-height: 614px; --spine-width: 132px; width: 100%; max-width: 1116px; display: flex; flex-direction: column; background: transparent; }
.title { font-size: 90px; font-weight: 700; line-height: 1; text-align: center; margin-bottom: 30px; }
.duel { display: flex; gap: 64px; }
.team { display: flex; flex: 1 1 0; min-width: 0; height: var(--panel-height); }
.spine { flex: 0 0 var(--spine-width); width: var(--spine-width); height: var(--panel-height); min-width: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #102a36; }
.name { display: block; flex: 0 0 calc(var(--panel-height) - 96px); width: calc(var(--panel-height) - 96px); height: 104px; line-height: 104px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: 88px; font-weight: 700; transform: rotate(-90deg); }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.score-pane { display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: 0; padding: 30px 20px; background: #f2eee6; color: #102a36; }
.sets-band { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 44px; line-height: 1; font-weight: 700; color: #b85c3a; }
.match-score { display: block; width: 66px; text-align: left; font-variant-numeric: tabular-nums; }
.primary-score { display: block; width: 100%; height: 242px; font-family: "Arial Black", Arial, sans-serif; font-size: 280px; font-weight: 900; line-height: .9; letter-spacing: -.07em; text-align: center; font-variant-numeric: tabular-nums; margin-top: 90px; }
.points-label { display: block; width: 100%; text-align: center; font-size: 52px; line-height: 1; font-weight: 700; margin-top: 22px; }
.set-footer { display: flex; align-items: center; justify-content: center; gap: 17px; margin-top: 28px; font-size: 58px; line-height: 1; font-weight: 700; }
.set-value { display: block; width: 66px; text-align: center; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-height: 800px) and (min-width: 601px) {
  .board { --panel-height: 480px; }
  .title { font-size: 64px; margin-bottom: 24px; }
  .name { height: 90px; line-height: 90px; font-size: 76px; }
  .score-pane { padding-top: 24px; padding-bottom: 24px; }
  .sets-band { font-size: 34px; }
  .primary-score { font-size: 215px; height: 180px; margin-top: 65px; }
  .points-label { font-size: 36px; margin-top: 14px; }
  .set-footer { font-size: 44px; margin-top: 24px; }
}
@media (max-width: 1000px) {
  .board { --spine-width: 90px; }
  .title { font-size: clamp(30px, 8vw, 80px); }
  .duel { gap: 40px; }
  .name { font-size: 64px; height: 78px; line-height: 78px; }
  .primary-score { font-size: clamp(100px, 24vw, 250px); }
  .sets-band { font-size: 32px; gap: 7px; }
  .match-score { width: 48px; }
  .points-label { font-size: 35px; }
}
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .board { --panel-height: 370px; --spine-width: 44px; }
  .title { font-size: 30px; margin-bottom: 24px; }
  .duel { gap: 20px; }
  .name { flex-basis: calc(var(--panel-height) - 40px); width: calc(var(--panel-height) - 40px); font-size: 34px; height: 40px; line-height: 40px; }
  .score-pane { padding: 24px 10px; }
  .sets-band { font-size: 19px; gap: 6px; }
  .match-score { width: 33px; }
  .primary-score { font-size: 85px; height: 82px; margin-top: 70px; }
  .points-label { font-size: 18px; margin-top: 14px; }
  .set-footer { font-size: 32px; gap: 10px; margin-top: 25px; }
  .set-value { width: 36px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="duel rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="spine jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="score-pane columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sets-band rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span>SETS</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="points-label">POINTS</span></div></div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="score-pane columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sets-band rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span>SETS</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="points-label">POINTS</span></div><div class="spine jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div></div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
