<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Violet Ash Open Register compact</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#28323d}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(64vw,1250px);max-width:100%;min-width:0;overflow:hidden;border:1px solid #b4bfc4;border-radius:5px;background:#e7e8ec;container-type:inline-size}
.header{display:flex;align-items:center;justify-content:space-between;flex:none;height:5.7cqw;min-width:0;padding:0 2cqw;border-bottom:1px solid #b4bfc4;background:#e7e8ec}
.sport-tag{display:block;flex:none;color:#28323d;font-size:2.55cqw;font-weight:800;line-height:1;white-space:nowrap}
.stats{display:flex;align-items:center;justify-content:flex-end;gap:2.6cqw;min-width:0}
.stat{display:flex;align-items:baseline;gap:.5cqw;min-width:0;color:#28323d;font-size:1.9cqw;font-weight:700;line-height:1;white-space:nowrap}
.stat strong{font-variant-numeric:tabular-nums}
.competitors{display:flex;flex-direction:column;min-width:0}
.competitor{display:flex;align-items:stretch;min-width:0;height:13cqw;background:#e7e8ec}
.competitor+.competitor{border-top:1px solid #b4bfc4}
.identity{display:block;align-self:center;flex:none;width:1.6%;height:91%;background:#2677e1;border-radius:6px}
.jerseyColorB{background:#fa5b63}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3.4cqw;color:#28323d;font-size:5.3cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.register{display:flex;flex-direction:column;justify-content:center;flex:0 0 16.5%;min-width:0;padding:0 2cqw;background:#e7e8ec}
.support-line{display:flex;align-items:baseline;justify-content:space-between;gap:.4cqw;color:#28323d;font-size:1.9cqw;font-weight:700;line-height:1;white-space:nowrap}
.support-line strong{font-size:1.9cqw;font-variant-numeric:tabular-nums}
.primary-line{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-width:0;margin-top:1cqw}
.primary-label{display:block;color:#28323d;font-size:2.1cqw;font-weight:700;line-height:1;white-space:nowrap}
.score{display:block;max-width:100%;overflow:hidden;color:#28323d;font-size:6.4cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%;border-radius:3px}.header{height:48px;padding:0 6px;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}.sport-tag{font-size:11px}.stats{justify-content:space-between;gap:2px}.stat{font-size:9px;gap:2px}.competitor{height:78px}.identity{width:4px}.name{font-size:clamp(20px,6vw,29px);padding:0 12px}.register{flex-basis:27%;padding:0 7px}.support-line{font-size:9px}.support-line strong{font-size:10px}.primary-line{margin-top:5px}.primary-label{font-size:10px}.score{font-size:clamp(24px,7vw,34px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Baseball scoreboard">
<div class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">BASEBALL</span><div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static baseball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="competitors columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="register columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="support-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">HITS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong></div><div class="primary-line columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-label" data-osb-component="text">RUNS</span><strong class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong></div></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="register columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="support-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">HITS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong></div><div class="primary-line columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-label" data-osb-component="text">RUNS</span><strong class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong></div></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
<div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div></article></main></body></html>
