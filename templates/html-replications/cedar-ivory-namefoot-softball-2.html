<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Cedar Ivory Namefoot horizontal</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#f7f8f4}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(73vw,1450px);max-width:100%;min-width:0;overflow:hidden;border:2px solid #627973;border-radius:5px;background:#253b37;container-type:inline-size}
.competitors{display:flex;align-items:stretch;min-width:0}
.competitor{display:flex;align-items:stretch;flex:1 1 50%;min-width:0;height:8.8cqw;background:#253b37}
.competitor+.competitor{border-left:2px solid #627973}
.identity{display:block;align-self:center;flex:none;width:1.1cqw;height:76%;margin:0 1.8cqw 0 1.1cqw;background:#4ea9e2}
.jerseyColorB{background:#ed7271}
.namefoot{display:flex;flex-direction:column;justify-content:center;flex:1 1 auto;min-width:0;gap:.5cqw}
.name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f7f8f4;font-size:4cqw;font-weight:700;line-height:1.06}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.support{display:flex;align-items:baseline;gap:.6cqw;color:#b8c7c0;font-size:2cqw;font-weight:700;line-height:1;white-space:nowrap}
.support strong{font-variant-numeric:tabular-nums}
.scorecap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 19%;min-width:0;background:#f3f0e8;color:#253b37}
.score-label{display:block;color:#253b37;font-size:2cqw;font-weight:700;line-height:1;white-space:nowrap}
.score{display:block;max-width:100%;overflow:hidden;color:#253b37;font-size:5.2cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.baseline{display:flex;align-items:center;min-width:0;height:3.6cqw;border-top:2px solid #627973;background:#253b37}
.sport-tag{display:block;flex:1 1 auto;min-width:0;padding:0 1.7cqw;color:#f7f8f4;font-size:2.7cqw;font-weight:800;line-height:1;white-space:nowrap}
.stats{display:flex;align-items:center;justify-content:flex-end;flex:none;min-width:0}
.stat{display:flex;align-items:baseline;gap:.5cqw;min-width:0;padding:0 1.2cqw;color:#b8c7c0;font-size:1.6cqw;font-weight:700;line-height:1;white-space:nowrap}
.stat:first-child{border-left:2px solid #627973}.stat strong{font-variant-numeric:tabular-nums}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%;border-width:1px;border-radius:4px}.competitor{height:72px}.competitor+.competitor{border-left-width:1px}.identity{width:3px;height:70%;margin:0 5px}.namefoot{gap:3px}.name{font-size:clamp(14px,3.7vw,21px)}.support{font-size:9px;gap:2px}.scorecap{flex-basis:30%}.score-label{font-size:9px}.score{font-size:clamp(20px,5.8vw,28px)}.baseline{height:46px;border-top-width:1px;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}.sport-tag{flex:none;padding:0 7px;font-size:10px}.stats{justify-content:space-between}.stat{font-size:9px;gap:2px;padding:0 5px}.stat:first-child{border-left:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Softball scoreboard">
<div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="namefoot columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="support rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">HITS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong></div></div><div class="scorecap columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score-label" data-osb-component="text">RUNS</span><strong class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="namefoot columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="support rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">HITS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong></div></div><div class="scorecap columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score-label" data-osb-component="text">RUNS</span><strong class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
<div class="baseline rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">SOFTBALL</span><div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static softball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div></article></main></body></html>
