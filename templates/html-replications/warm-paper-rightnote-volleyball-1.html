<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warm Paper Rightnote Volleyball — Compact</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{display:grid;place-items:center;min-height:100vh;font-family:Arial,Helvetica,sans-serif}
.board{display:flex;width:min(610px,calc(100vw - 20px));height:156px;overflow:hidden;border-radius:6px;background:#f2efe9;color:#293a44}
.lanes{display:flex;flex:1 1 auto;flex-direction:column;min-width:0}
.lane{display:flex;flex:1 1 0;min-width:0;min-height:0;align-items:stretch}
.lane+.lane{border-top:1px solid #d5d1c9}
.identity{display:block;flex:0 0 13px;align-self:stretch;background:#2f86a7}
.jerseyColorB{background:#c77469}
.name-lane{display:flex;flex:1 1 auto;flex-direction:column;justify-content:center;min-width:0;padding:0 10px 0 22px}
.name{display:block;min-width:0;overflow:hidden;color:#293a44;font-size:28px;font-weight:700;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support-track{display:flex;align-items:baseline;gap:8px;margin-top:2px;white-space:nowrap}
.support-score{font-size:16px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.support-caption{font-size:10px;font-weight:700;letter-spacing:.025em;line-height:1}
.primary-track{display:flex;flex:0 0 88px;flex-direction:column;align-items:center;justify-content:center;min-width:0;white-space:nowrap}
.primary-score{display:block;max-width:100%;overflow:hidden;font-size:46px;font-weight:800;line-height:.98;font-variant-numeric:tabular-nums;text-align:center}
.primary-caption{font-size:11px;font-weight:700;line-height:1.1}
.dock{display:flex;flex:0 0 160px;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:12px 15px;background:#293a44;color:#faf9f5;text-align:center}
.dock-title{display:block;align-self:stretch;padding-bottom:16px;border-bottom:1px solid #667a7d;font-size:18px;font-weight:800;line-height:1;letter-spacing:.015em;white-space:nowrap}
.dock-status{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:13px}
.dock-label{font-size:14px;font-weight:700;line-height:1}
.dock-value{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:460px){.board{height:146px}.identity{flex-basis:9px}.name-lane{padding-left:12px;padding-right:4px}.name{font-size:clamp(16px,6.6vw,26px)}.primary-track{flex-basis:64px}.primary-score{font-size:clamp(32px,10vw,43px)}.dock{flex-basis:105px;padding:8px}.dock-title{font-size:12px;padding-bottom:13px}.dock-status{margin-top:13px}.dock-label{font-size:11px}.dock-value{font-size:26px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Volleyball scoreboard with generic manual scoring">
 <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
   <div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="support-track"><span class="support-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-caption">SETS</span></span></div>
   <div class="primary-track"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption">POINTS</span></div>
  </div>
  <div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
   <div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="support-track"><span class="support-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-caption">SETS</span></span></div>
   <div class="primary-track"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption">POINTS</span></div>
  </div>
 </div>
 <aside class="dock"><strong class="dock-title">VOLLEYBALL</strong><span class="dock-status"><span class="dock-label">SET</span><span class="dock-value" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></span></aside>
</article>
<div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</body>
</html>
