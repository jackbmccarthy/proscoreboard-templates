<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midnight Teal Capsule Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #f7fbfc; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { width: 100%; max-width: 440px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #36545e; border-radius: 8px; background: #102331; }
.heading { display: flex; align-items: stretch; min-height: 25px; background: #b9e2df; color: #102331; font-size: 12px; font-weight: 700; line-height: 1; }
.sport-title { display: flex; align-items: center; flex: 1 1 0; padding: 4px 12px; font-size: 16px; white-space: nowrap; }
.sets-heading, .points-heading { display: flex; align-items: center; justify-content: center; text-align: center; }
.sets-heading, .match-score { flex: 0 0 15.3%; }
.points-heading, .primary-score { flex: 0 0 23.2%; }
.team { display: flex; align-items: stretch; min-height: 54px; }
.team + .team { border-top: 1px solid #36545e; }
.identity { display: flex; align-items: center; flex: 1 1 0; gap: 11px; padding: 8px; }
.tick { display: block; flex: 0 0 3px; width: 3px; height: 33px; background: #147d86; border-radius: 1px; }
.name { display: block; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #f7fbfc; font-size: 24px; font-weight: 700; line-height: 1; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.match-score { display: flex; align-items: center; justify-content: center; color: #b9e2df; font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.primary-score { display: flex; align-items: center; justify-content: center; background: #147d86; color: #f7fbfc; font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.set-footer { min-height: 30px; display: flex; align-items: center; justify-content: center; gap: 12px; border-top: 1px solid #36545e; color: #b9e2df; font-size: 14px; font-weight: 700; line-height: 1; }
.set-value { display: block; width: 22px; text-align: center; color: #f7fbfc; font-size: 18px; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 600px) { .stage { padding: 14px; } }
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="heading rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-title">VOLLEYBALL</span><span class="sets-heading">SETS</span><span class="points-heading">POINTS</span></header>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
      <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
