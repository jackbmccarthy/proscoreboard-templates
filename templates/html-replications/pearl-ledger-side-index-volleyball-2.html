<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Pearl Ledger Side Index 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;width:min(96vw,1844px);max-width:100%;aspect-ratio:9.4;overflow:hidden;border:2px solid #a7b7b4;border-radius:8px;background:#e9eeeb;color:#24373c;container-type:inline-size}
.index{display:flex;align-items:center;justify-content:center;flex:0 0 17.8%;min-width:0;flex-direction:column;gap:16px;padding:0 32px;border-right:2px solid #a7b7b4}
.sport-tag{display:block;max-width:100%;overflow:hidden;font-size:clamp(16px,2cqw,42px);font-weight:800;line-height:1;text-overflow:ellipsis;white-space:nowrap}
.index-rule{display:block;width:100%;height:2px;background:#a7b7b4}
.status{display:flex;align-items:center;gap:.3em;font-size:clamp(17px,2cqw,39px);font-weight:800;line-height:1;white-space:nowrap}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.pair{display:flex;flex:1 1 0;min-width:0;min-height:0}
.side{display:flex;align-items:stretch;flex:1 1 0;min-width:0}
.side+.side{border-left:2px solid #a7b7b4}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;flex:0 0 18px;align-self:stretch;margin:47px 0 47px 35px;background:#2889e8}
.jerseyColorB{background:#f4655f}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;padding:0 30px;color:#24373c;font-size:clamp(29px,4.3cqw,79px);font-weight:700;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.sets,.points{display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0;gap:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sets{flex:0 0 15%}
.points{flex:0 0 27%}
.label{display:block;max-width:100%;overflow:hidden;font-size:clamp(13px,1.35cqw,27px);font-weight:750;line-height:1}
.set-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(27px,3.4cqw,68px);font-weight:800;line-height:1;text-align:center}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(48px,5.6cqw,111px);font-weight:800;line-height:1;text-align:center}
.numeric-rule{display:block;flex:0 0 2px;align-self:stretch;margin:36px 0;background:#a7b7b4}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(min-width:701px) and (max-width:1400px){.index{padding:0 16px}.name{font-size:clamp(23px,3.2cqw,46px)}}
@media(max-width:700px){
 .stage{padding:6px}
 .board{width:100%;height:132px;aspect-ratio:auto;border-width:1px;border-radius:4px}
 .index{flex-basis:22%;gap:9px;padding:0 5px;border-width:1px}
 .sport-tag{font-size:clamp(9px,2.6cqw,12px)}
 .index-rule{height:1px}
 .status{font-size:clamp(10px,2.7cqw,13px)}
 .side+.side{border-width:1px}
 .identity{flex-basis:4px;margin:27px 0 27px 5px}
 .name{padding:0 4px;font-size:clamp(12px,3.8cqw,17px)}
 .sets{flex-basis:19%}
 .points{flex-basis:30%}
 .label{font-size:clamp(7px,2cqw,10px)}
 .set-score{font-size:clamp(19px,5.3cqw,25px)}
 .score{font-size:clamp(26px,8cqw,36px)}
 .numeric-rule{flex-basis:1px;margin:25px 0}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Horizontal volleyball scoreboard with generic manual scoring">
  <aside class="index columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><span class="index-rule" data-osb-component="layout"></span><div class="status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></aside>
  <div class="pair rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <div class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="sets" data-osb-component="layout"><span class="label" data-osb-component="text">SETS</span><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="numeric-rule" data-osb-component="layout"></span><div class="points" data-osb-component="layout"><span class="label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
   <div class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="sets" data-osb-component="layout"><span class="label" data-osb-component="text">SETS</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><span class="numeric-rule" data-osb-component="layout"></span><div class="points" data-osb-component="layout"><span class="label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
