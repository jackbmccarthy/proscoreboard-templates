<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Game Ledger</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.rowContainer{display:flex;flex-direction:row}.columnContainer{display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
img.logo:not([src]),img.logo[src=""]{display:none}
.pt-slot{position:relative;display:block}.pt-slot>.pt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.pt-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint,.pt-slot:has(> .isMatchPoint[style*="opacity:1"]) > .isGamePoint{opacity:0!important}
.pt-slot .isMatchPoint{animation:osbPulse 1.8s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.3)}}
@media (prefers-reduced-motion: reduce) {
.pt-slot .isGamePoint,.pt-slot .isMatchPoint{animation:none!important;transition:none!important}
}
.pips{display:inline-flex;gap:.35rem;align-items:center}.pip{position:relative;display:block;width:.7rem;height:.7rem;border-radius:50%;background:currentColor}
.pip-used{position:absolute;inset:-1px;border-radius:50%;background:var(--pip-off,#0009)}
.to-left:empty{display:none}
.isACurrentlyServing,.isBCurrentlyServing{transition:opacity .2s}
.dbl-probe{display:none}
.vball{display:block;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9 0 18%,transparent 40%),conic-gradient(from 20deg,#ffd23f 0 120deg,#1d4fbf 0 240deg,#f4f6fb 0);box-shadow:inset 0 0 0 .12rem #0005}
.pball{display:block;border-radius:50%;background:radial-gradient(circle at 30% 32%,#0003 0 9%,transparent 10%),radial-gradient(circle at 66% 30%,#0003 0 9%,transparent 10%),radial-gradient(circle at 50% 62%,#0003 0 9%,transparent 10%),radial-gradient(circle at 24% 70%,#0002 0 7%,transparent 8%),radial-gradient(circle at 78% 70%,#0002 0 7%,transparent 8%),radial-gradient(circle at 38% 30%,#fbffb0,#d4f02b 60%,#a9c414)}
.sn{position:relative;display:inline-grid}.sn>i,.cn>i{grid-area:1/1;font-style:normal}
.sn:has(> .isSecondServer[style*="opacity: 1"]) > .one,.sn:has(> .isSecondServer[style*="opacity:1"]) > .one{opacity:0}
.cn{position:relative;display:inline-grid}.cn:has(> .isSecondServer[style*="opacity: 1"]) > .one,.cn:has(> .isSecondServer[style*="opacity:1"]) > .one{opacity:0}
.call{display:inline-flex;align-items:baseline}.call>i{font-style:normal}.call .ca{order:1}.call .cd1{order:2}.call .cb{order:3}.call .cd2{order:4}.call .cn{order:5}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .ca,.board:has(.isBCurrentlyServing[style*="opacity:1"]) .call .ca{order:3}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .cb,.board:has(.isBCurrentlyServing[style*="opacity:1"]) .call .cb{order:1}
.board:has(.playerA2:empty) .sn,.board:has(.playerA2:empty) .cn,.board:has(.playerA2:empty) .cd2{display:none}
.gstack{display:inline-grid}.gstack>.gs{grid-area:1/1;white-space:nowrap}.gstack>.gs:has(~ .gs[style*="opacity: 1"]),.gstack>.gs:has(~ .gs[style*="opacity:1"]){visibility:hidden}
.tie{display:none}
.cards{display:inline-flex;gap:.25rem}.card{display:block;width:.8rem;height:1.1rem;border-radius:.15rem;box-shadow:0 0 0 1px #0003}.yc{background:#ffd200}.rc{background:#e3262f}
.live{display:inline-flex;align-items:center;gap:.35rem}.live::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:#ff3b30}
.stage{position:fixed;left:50%;bottom:4rem;transform:translateX(-50%)}
.board{position:relative;width:86rem;color:#16302b;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;font-weight:700;background:#fff;border-radius:.4rem;overflow:hidden;box-shadow:0 .4rem 1.2rem #0006}
.top{height:2.8rem;align-items:center;gap:1rem;padding:0 1.4rem;background:#16302b;color:#fff;font-size:1.15rem;letter-spacing:.1em}
.top .rd{color:#d4f02b}.top .pt-slot{flex:1;height:100%}.top .pt{justify-content:flex-end!important;color:#d4f02b}
.top .call{font-size:1.6rem;gap:.15rem;padding:.1rem .8rem;border-radius:.3rem;background:#2fa36b}.call>i{opacity:.75}
.grid{display:grid;grid-template-columns:.8rem minmax(0,1fr) 4.4rem 6rem repeat(5,4.6rem) 5rem 7rem;align-items:stretch}
.grid>*{display:flex;align-items:center;justify-content:center;border-bottom:1px solid #e6ece9}
.grid{grid-template-columns:.8rem minmax(0,1fr) 5rem 7rem repeat(5,4.6rem) 5rem 7rem}
.th{height:2.2rem;background:#f1f5f3;font-size:.95rem;letter-spacing:.12em;color:#5f7a72}.th.tl{justify-content:flex-start;padding-left:1rem}
.chip{background:#3d7bff;height:4.4rem}.chip.jerseyColorB{background:#ff6b5a}
.nm{display:block!important;line-height:4.4rem;padding:0 1rem;font-size:2.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid>.srv{border-bottom:0;gap:.3rem}.pball{width:1.6rem;height:1.6rem}.sn{min-width:1.5rem;height:1.5rem;place-items:center;border-radius:.3rem;background:#16302b;color:#d4f02b;font-size:1rem}
.st{flex-direction:column;gap:.2rem}.st .to-used{font-size:.75rem;color:#2fa36b}
.hc{font-size:1.9rem;color:#5f7a72}
.hc:has(> .hcv:is([style*="opacity: 1"],[style*="opacity:1"])):has(+ .hc > .hcv:not([style*="opacity: 1"]):not([style*="opacity:1"])),.hc:has(+ .won):has(> .hcv:is([style*="opacity: 1"],[style*="opacity:1"])){color:#16302b;background:#d4f02b55}
.won{font-size:2.4rem;background:#16302b;color:#fff}
.pts{font-size:3.4rem;background:#2fa36b;color:#fff}
.foot{height:2rem;align-items:center;justify-content:flex-end;gap:1rem;padding:0 1.4rem;background:#f1f5f3;font-size:.95rem;color:#5f7a72;letter-spacing:.1em}
.tolive{position:absolute;right:0;bottom:100%;display:flex;gap:.4rem}.to-live,.to-any{gap:.4rem;padding:.4rem 1rem;background:#2fa36b;color:#fff;font-size:1.2rem}.to-any{display:none!important}
.board{overflow:visible}
</style>
</head>
<body>
<main class="stage"><section class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<header class="top rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="ev eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="rd matchRound" data-osb-component="field" data-osb-field="matchRound"></span><span class="live isMatchStarted" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0">LIVE</span><span class="pt-slot"><span class="pt isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="pt isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><span class="call"><span class="ca num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><i class="cd1">-</i><span class="cb num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><i class="cd2">-</i><b class="cn"><i class="one">1</i><i class="two isSecondServer" isA="true" data-osb-component="field" style="opacity:0">2</i><i class="two isSecondServer" data-osb-component="field" style="opacity:0">2</i></b></span></header>
<div class="grid">
<span class="th"></span><span class="th tl">TEAM</span><span class="th">SERVE</span><span class="th">STATUS</span><span class="th">G1</span><span class="th">G2</span><span class="th">G3</span><span class="th">G4</span><span class="th">G5</span><span class="th">GAMES</span><span class="th">PTS</span>
<i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="pball"></i><b class="sn"><i class="one">1</i><i class="two isSecondServer" isA="true" data-osb-component="field" style="opacity:0">2</i></b></span><span class="st"><span class="to-used isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0">T/O USED</span><span class="cards"><span class="card yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0"></span><span class="card rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0"></span></span></span><span class="hc"><span class="hcv isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display:none;opacity:0"><span class="hv num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span></span><span class="hc"><span class="hcv isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display:none;opacity:0"><span class="hv num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span></span><span class="hc"><span class="hcv isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display:none;opacity:0"><span class="hv num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span></span><span class="hc"><span class="hcv isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display:none;opacity:0"><span class="hv num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span></span><span class="hc"><span class="hcv isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display:none;opacity:0"><span class="hv num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span></span><span class="won num currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="pts num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span>
<i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="srv isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"><i class="pball"></i><b class="sn"><i class="one">1</i><i class="two isSecondServer" data-osb-component="field" style="opacity:0">2</i></b></span><span class="st"><span class="to-used isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none;opacity:0">T/O USED</span><span class="cards"><span class="card yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0"></span><span class="card rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0"></span></span></span><span class="hc"><span class="hcv isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display:none;opacity:0"><span class="hv num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></span><span class="hc"><span class="hcv isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display:none;opacity:0"><span class="hv num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></span><span class="hc"><span class="hcv isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display:none;opacity:0"><span class="hv num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></span><span class="hc"><span class="hcv isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display:none;opacity:0"><span class="hv num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></span><span class="hc"><span class="hcv isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display:none;opacity:0"><span class="hv num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></span><span class="won num currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="pts num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span>
</div>
<footer class="foot rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="gstack"><span class="gs isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display:none;opacity:0">GAME 1</span><span class="gs isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display:none;opacity:0">GAME 2</span><span class="gs isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display:none;opacity:0">GAME 3</span><span class="gs isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display:none;opacity:0">GAME 4</span><span class="gs isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display:none;opacity:0">GAME 5</span></span></footer>
<div class="tolive"><span class="to-live isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0">TIMEOUT <span class="to-clock num timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</span></span><span class="to-any isTimeOutActive" data-osb-component="field" data-osb-field="isTimeOutActive" style="display:none;opacity:0">TIMEOUT</span><span class="to-live isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0">TIMEOUT <span class="to-clock num timeOutTimerB" data-osb-component="field" data-osb-field="timeOutTimerB">0</span></span></div><span class="dbl-probe playerA2" data-osb-component="field" data-osb-field="playerA2"></span><span class="tie"><img class="logo teamLogoURLA" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><i class="tchip teamJerseyColorA" data-osb-component="field" data-osb-field="teamJerseyColorA"></i><span class="tn teamAName" data-osb-component="field" data-osb-field="teamAName"></span><span class="ts num teamAScore" data-osb-component="field" data-osb-field="teamAScore">0</span><i class="tdash">-</i><span class="ts num teamBScore" data-osb-component="field" data-osb-field="teamBScore">0</span><span class="tn teamBName" data-osb-component="field" data-osb-field="teamBName"></span><i class="tchip teamJerseyColorB" data-osb-component="field" data-osb-field="teamJerseyColorB"></i><img class="logo teamLogoURLB" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""></span></section></main>
</body>
</html>
