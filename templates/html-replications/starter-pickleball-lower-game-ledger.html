<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Game Ledger</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.osb-core-fields{display:none!important}
.slot{position:relative;display:grid}.slot>*{grid-area:1/1}
.pslot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.pslot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.isMatchPoint[style*="opacity: 1"]{animation:osbPulse 1.6s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion: reduce){.isGamePoint,.isMatchPoint,.isACurrentlyServing,.isBCurrentlyServing{animation:none!important;transition:none!important}}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.02}
.pball{display:block;border-radius:50%;background:radial-gradient(circle at 30% 34%,#0004 0 8%,transparent 9%),radial-gradient(circle at 64% 30%,#0004 0 8%,transparent 9%),radial-gradient(circle at 52% 64%,#0004 0 8%,transparent 9%),radial-gradient(circle at 24% 72%,#0003 0 6%,transparent 7%),radial-gradient(circle at 78% 70%,#0003 0 6%,transparent 7%),radial-gradient(circle at 36% 30%,#fbffb4,#d8f22c 60%,#a6c214);box-shadow:0 0 .4rem #0007}
.sslot{align-items:center}.sslot>.st{display:flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap;height:100%}
.board:has(.isMatchStarted[style*="opacity: 1"]) .swarm{opacity:0!important}
.board:has(.isGamePoint[style*="opacity: 1"]) .sbrk,.board:has(.isMatchPoint[style*="opacity: 1"]) .sbrk{opacity:0!important}
.pslot>.pt{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.hist:not(:has(>[style*="opacity: 1"])){display:none}
.srv{display:flex;align-items:center;gap:.35rem}
.sn{position:relative;display:inline-grid;place-items:center}.sn>i{grid-area:1/1;font-style:normal}
.sn:has(>.isSecondServer[style*="opacity: 1"])>.one,.cn:has(>.isSecondServer[style*="opacity: 1"])>.one{opacity:0}
.cn{display:inline-grid}.cn>i{grid-area:1/1;font-style:normal;text-align:center}
.call{display:inline-flex;align-items:baseline}.call>i,.dbl>i{font-style:normal}.call .ca{order:1}.call .d1{order:2}.call .cb{order:3}.call .dbl{order:4;display:inline-flex;align-items:baseline}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .ca{order:3}.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .cb{order:1}
.call .dbl:not([style*="opacity: 1"]){display:none}
.cards{display:flex;gap:.3rem;align-items:center}.card{display:block;border-radius:.15rem;box-shadow:0 0 0 .1rem #0004}.yc{background:#ffd200}.rc{background:#e3262f}
.cards:not(:has(>[style*="opacity: 1"])){display:none}
.tie{display:flex;align-items:center}.tie:has(>.teamAName[style*="display: none"]){display:none}
.tlogo{display:block;object-fit:contain}.tlogo:not([src]),.tlogo[src=""]{visibility:hidden}
.tie>.tdash{font-style:normal}
.tname{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.05}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>:not(.tie){display:none}
.board:has(.combinedAName:empty):has(.combinedBName:empty)>.tie{height:auto;min-height:5.2rem;padding-top:.6rem;padding-bottom:.4rem;margin:0}

.stage{position:fixed;left:4rem;bottom:4rem}
.board{position:relative;width:80rem;font-family:"DIN Condensed","Bahnschrift SemiBold Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;color:#fff;filter:drop-shadow(0 .5rem 1.2rem #0009)}
.tie{gap:1rem;height:3.8rem;padding:.3rem 1.2rem 0;background:#0a3b40;color:#fff;font-size:1.9rem;font-weight:700;text-transform:uppercase}.tlogo{width:2.8rem;height:2.8rem}.tchip{width:.6rem;height:2.4rem}.tname:last-of-type{text-align:right}.tscore{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.6rem;color:#7ef0c8}.tie>.tdash{color:#6fa9a6}
.top{display:flex;align-items:stretch;justify-content:space-between;height:3.2rem;background:#082c30;font-size:1.7rem;letter-spacing:.08em;text-transform:uppercase}
.ctx{display:flex;align-items:center;gap:.6rem;padding:.35rem 1.2rem 0;color:#a8d4d0;white-space:nowrap;overflow:hidden;min-width:0}.ctx .sep{font-style:normal;color:#7ef0c8}
.cl{display:flex;align-items:center;gap:.8rem;padding:.3rem 1.2rem 0;background:#7ef0c8;color:#082c30;font-size:1.5rem;letter-spacing:.14em}.call{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.4rem;font-weight:700;letter-spacing:.02em;gap:.2rem}
.lhead,.lrow{display:flex;align-items:stretch}
.lhead{height:3rem;background:#0d454a;color:#8ec5c0;font-size:1.5rem;letter-spacing:.1em}
.lh{display:flex;align-items:center;justify-content:center;padding-top:.3rem}.lh.lead{flex:1;justify-content:flex-start;padding:0}
.sslot{min-width:14rem;height:100%}.sslot>.st{padding:.3rem 1.2rem 0;font-size:1.6rem;background:#0d454a;color:#8ec5c0}.sslot>.sgame{background:#14b8a6;color:#04211f}.sslot>.swarm{background:#ffb03a;color:#2a1a00}.sslot>.sbrk{background:#fff;color:#082c30}
.lc{width:4.8rem;flex:none;display:flex;align-items:center;justify-content:center}.lg{width:6rem;flex:none}.lp{width:7.4rem;flex:none}
.lrow{position:relative;height:5.6rem;background:#0f5257;border-top:.15rem solid #082c30}
.chip{width:.9rem;flex:none}
.lname{flex:1;min-width:0;display:flex;align-items:center;gap:.8rem;padding:0 1rem}
.nm{flex:1;min-width:0;padding-top:.4rem;font-size:2.6rem;font-weight:700;text-transform:uppercase}
.stat{display:flex;align-items:center;gap:.5rem;flex:none}.card{width:1.2rem;height:1.7rem}
.tou{display:flex;align-items:center;height:2rem;padding:.25rem .6rem 0;border-radius:.25rem;background:#ffffff1f;color:#7ef0c8;font-size:1.5rem;letter-spacing:.06em}
.srv{flex:none;width:5.2rem;justify-content:flex-start}.pball{width:2.1rem;height:2.1rem}
.sn{min-width:2rem;height:2rem;border-radius:.3rem;background:#7ef0c8;color:#082c30;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:1.6rem;font-weight:700}
.lrow .lc{padding-top:.4rem;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.4rem;font-weight:700;color:#b9dcd9;border-left:.1rem solid #ffffff14}
.lrow>.lc[style*="opacity: 1"]:not(:has(~.lc[style*="opacity: 1"])){color:#7ef0c8;background:#7ef0c814}
.games{width:6rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.4rem;background:#0b4246;color:#7ef0c8;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:3rem;font-weight:700}
.pts{width:7.4rem;flex:none;display:flex;align-items:center;justify-content:center;padding-top:.4rem;background:#fff;color:#082c30;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:4rem;font-weight:700}
.tob{position:absolute;left:100%;top:0;bottom:0;display:flex;align-items:center;gap:.6rem;padding:.35rem 1.1rem 0;background:#7ef0c8;color:#082c30;font-size:1.8rem;letter-spacing:.06em;white-space:nowrap}.tob em{font-style:normal}.tob b{font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-size:2.2rem}
.pslot{position:absolute;right:0;bottom:100%;margin-bottom:.5rem}.pt{height:3.2rem;padding:.35rem 1.4rem 0;font-size:2rem;letter-spacing:.1em;background:#7ef0c8;color:#082c30}.pt.mp{background:#e8202a;color:#fff}
</style>
</head>
<body>

<span class="tie"><img class="tlogo teamLogoURLA" data-osb-component="field" data-osb-field="teamLogoURLA" alt=""><i class="tchip teamJerseyColorA" data-osb-component="field" data-osb-field="teamJerseyColorA"></i><span class="tname teamAName" data-osb-component="field" data-osb-field="teamAName"></span><span class="tscore num teamAScore" data-osb-component="field" data-osb-field="teamAScore">0</span><i class="tdash">-</i><span class="tscore num teamBScore" data-osb-component="field" data-osb-field="teamBScore">0</span><span class="tname teamBName" data-osb-component="field" data-osb-field="teamBName"></span><i class="tchip teamJerseyColorB" data-osb-component="field" data-osb-field="teamJerseyColorB"></i><img class="tlogo teamLogoURLB" data-osb-component="field" data-osb-field="teamLogoURLB" alt=""></span>

<div class="lrow rA" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="lname"><span class="nm clamp2 combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="stat"><span class="cards"><i class="card yc isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0"></i><i class="card rc isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0"></i></span><span class="tou isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="opacity:0">T/O</span></span><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="pball"></i><b class="sn isDoubles" data-osb-component="field" data-osb-field="isDoubles" style="opacity:0"><i class="one">1</i><i class="two isSecondServer" data-osb-component="field" data-osb-field="isSecondServer" isA="true" style="opacity:0">2</i></b></span></span><span class="lc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><span class="num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span></span><span class="lc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><span class="num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span></span><span class="lc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><span class="num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span></span><span class="lc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><span class="num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span></span><span class="lc isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity:0"><span class="num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span></span><span class="games num currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="pts num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="tob isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="opacity:0"><em>TIMEOUT</em><b class="tclock num timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</b></span></div>
<div class="lrow rB" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="lname"><span class="nm clamp2 combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="stat"><span class="cards"><i class="card yc isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0"></i><i class="card rc isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0"></i></span><span class="tou isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="opacity:0">T/O</span></span><span class="srv isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"><i class="pball"></i><b class="sn isDoubles" data-osb-component="field" data-osb-field="isDoubles" style="opacity:0"><i class="one">1</i><i class="two isSecondServer" data-osb-component="field" data-osb-field="isSecondServer" style="opacity:0">2</i></b></span></span><span class="lc isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity:0"><span class="num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="lc isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity:0"><span class="num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="lc isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity:0"><span class="num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="lc isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity:0"><span class="num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="lc isGame5Started" data-osb-component="field" data-os
