<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softball — Teal Line Line Score Strip</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
html{font-size:1.25vw}
body{min-height:100vh;-webkit-font-smoothing:antialiased;font-synthesis:none}
.bb-retained{display:none}
.bb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.diamond{position:relative;display:block;flex:none;width:var(--d,3rem);height:calc(var(--d,3rem)*.8)}
.diamond>.base{position:absolute;width:30%;height:37.5%;transform:rotate(45deg);background:var(--base-off,transparent);border:var(--base-line,.12rem) solid var(--base-edge,currentColor);border-radius:var(--base-r,.06rem)}
.diamond>.base.second{left:35%;top:10%}.diamond>.base.third{left:8%;top:44%}.diamond>.base.first{left:62%;top:44%}
.diamond::before{content:"";position:absolute;left:calc(var(--d,3rem)*.309);top:calc(var(--d,3rem)*.311);width:calc(var(--d,3rem)*.382);height:calc(var(--d,3rem)*.382);transform:rotate(45deg);border:1px solid var(--base-edge,currentColor);opacity:.28}
.bb-plate{display:none}
.bb-bases{position:absolute;left:0;right:0;bottom:-.1rem;text-align:center;font:700 .42rem/1 var(--mono-ui,Menlo,Consolas,monospace);letter-spacing:.04em;color:var(--base-text,currentColor);opacity:.85}
.bb-half{position:relative;display:inline-block;flex:none;vertical-align:middle}
.bb-half-dim{position:absolute;inset:0}
.bb-half-dim::before,.bb-half-dim::after,.inningHalf::before,.inningHalf::after{content:"";background:var(--half-off,rgba(255,255,255,.28))}
.bb-half-dim::before,.bb-half-dim::after{position:absolute;left:0;width:100%;height:100%}
.bb-half-dim::before,.inningHalf::after{clip-path:polygon(50% 4%,96% 40%,4% 40%)}
.bb-half-dim::after,.inningHalf::before{clip-path:polygon(4% 60%,96% 60%,50% 96%)}
.bb-half-win{position:relative;display:block;width:3ch;height:var(--half-h,1.2rem);overflow:hidden;font-family:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:var(--half-size,.62rem);font-weight:400;line-height:var(--half-h,1.2rem);letter-spacing:0;text-transform:none}
.inningHalf{display:flex;width:max-content;height:100%;margin-left:-6ch;color:transparent;white-space:pre}
.inningHalf::before,.inningHalf::after{flex:none;width:3ch;height:100%;background:var(--half-on,#fff)}
.inningHalf::before{order:1}.inningHalf::after{order:2}
.bb-ls-col>.bb-gate{display:flex;flex-direction:column;align-items:stretch}
.bb-tick{position:relative}.bb-tick>.bb-gate{display:block;position:absolute;inset:0;border-radius:inherit;background:var(--tick-on,#fff)}
.bb-ls-extra{display:none!important}.bb-ls-extra:has(>.bb-gate[style*="opacity: 1"]),.bb-ls-extra:has(>.bb-gate[style*="opacity:1"]){display:flex!important}
.bb-live,.bb-break,.bb-final{transition:opacity .25s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.bb-stage{position:fixed;left:50%;bottom:2.4rem;transform:translateX(-50%);font-family:"DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;color:#effaf9}
.ls{display:flex;flex-direction:column;filter:drop-shadow(0 .3rem .8rem rgba(0,0,0,.4))}
.ls-tab{display:flex;align-items:center;gap:.6rem;align-self:flex-start;height:1.2rem;padding:0 .7rem;background:#2ec4b6;color:#0b1d1f;font:700 .6rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.14em;text-transform:uppercase;border-radius:.2rem .2rem 0 0}
.ls-tab .bb-round:not(:empty)::before{content:"|";margin-right:.6rem;opacity:.5}
.ls-body{display:flex;align-items:stretch;background:#0f2427;border-radius:0 .25rem .25rem .25rem;overflow:hidden}
.bb-ls{display:flex;align-items:stretch}
.bb-ls-teams,.bb-ls-col{display:flex;flex-direction:column}
.bb-ls-h{display:flex;align-items:center;justify-content:center;height:1.05rem;background:#173235;color:#93b6b3;font:700 .55rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.06em}
.bb-ls-teams .bb-ls-h{justify-content:flex-start;padding-left:.7rem}
.bb-ls-team{display:flex;align-items:center;gap:.5rem;height:1.75rem;width:12rem;padding-right:.4rem}
.bb-ls-team+.bb-ls-team{border-top:1px solid rgba(255,255,255,.08)}
.bb-ls-chip{align-self:stretch;width:.4rem;background:#2ec4b6}
.bb-ls-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:700 1rem/1 "Avenir Next Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.03em}
.bb-ls-innings{display:flex;border-left:1px solid rgba(255,255,255,.08)}
.bb-ls-col{width:1.65rem}
.bb-ls-v{display:flex;align-items:center;justify-content:center;height:1.75rem;font:600 .95rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;font-variant-numeric:tabular-nums}
.bb-ls-v+.bb-ls-v{border-top:1px solid rgba(255,255,255,.08)}
.bb-ls-col>.bb-gate{flex:1}
.bb-ls-r{width:2.3rem;background:#2ec4b6;color:#071513}.bb-ls-r .bb-ls-h{background:#1fa396;color:#071513}
.bb-ls-r .bb-ls-v{font-weight:800;font-size:1.25rem}
.bb-ls-he{width:1.75rem;background:#142d30}.bb-ls-he .bb-ls-v{color:#93b6b3}
.ls-sit{position:relative;display:grid;grid-template-columns:auto auto;grid-template-rows:1fr 1fr;align-items:center;justify-items:center;column-gap:.6rem;padding:0 .8rem;background:#091719}
.bb-inning{display:flex;align-items:center;gap:.25rem;font:700 1.15rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;--half-on:#2ec4b6;--half-off:rgba(255,255,255,.2);--half-h:1.1rem;--half-size:.48rem}
.ls-sit .diamond{grid-row:1/3;grid-column:2;--d:3.6rem;--base-edge:#effaf9;--base-off:rgba(255,255,255,.06);--base-line:.1rem;--base-text:#93b6b3}
.bb-count{font:700 1rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;font-variant-numeric:tabular-nums}
.ls-cnt{display:flex;align-items:baseline;gap:.4rem}
.bb-outs{display:flex;align-items:baseline;gap:.15rem;font:700 .8rem/1 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif}.bb-outs-label{font-size:.5rem;letter-spacing:.12em;color:#93b6b3}
.bb-live{color:#0b1d1f}
.bb-break{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#091719;font:700 .7rem/1.25 "DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial",sans-serif;letter-spacing:.14em;color:#2ec4b6}
</style></head><body><main class="bb-stage" aria-label="Softball lower-third scoreboard">
<article class="ls columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Softball line score">
<div class="ls-tab"><span class="bb-event eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="bb-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span><span class="bb-live isMatchStarted" data-osb-component="field" style="opacity: 0">LIVE</span></div>
<div class="ls-body"><div class="bb-ls rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="bb-ls-teams"><span class="bb-ls-h">SOFTBALL</span><span class="bb-ls-team"><span class="bb-ls-chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="bb-ls-name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></span><span class="bb-ls-team"><span class="bb-ls-chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="bb-ls-name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></span></span><span class="bb-ls-innings"><span class="bb-ls-col"><span class="bb-ls-h">1</span><span class="bb-gate isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="opacity: 0"><span class="bb-ls-v game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span><span class="bb-ls-v game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></span><span class="bb-ls-col"><span class="bb-ls-h">2</span><span class="bb-gate isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="opacity: 0"><span class="bb-ls-v game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span><span class="bb-ls-v game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></span><span class="bb-ls-col"><span class="bb-ls-h">3</span><span class="bb-gate isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="opacity: 0"><span class="bb-ls-v game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span><span class="bb-ls-v game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></span><span class="bb-ls-col"><span class="bb-ls-h">4</span><span class="bb-gate isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="opacity: 0"><span class="bb-ls-v game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span><span class="bb-ls-v game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></span><span class="bb-ls-col"><span class="bb-ls-h">5</span><span class="bb-gate isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="opacity: 0"><span class="bb-ls-v game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span><span class="bb-ls-v game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></span><span class="bb-ls-col"><span class="bb-ls-h">6</span><span class="bb-gate isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="opacity: 0"><span class="bb-ls-v game6AScore" data-osb-component="field" data-osb-field="game6AScore">0</span><span class="bb-ls-v game6BScore" data-osb-component="field" data-osb-field="game6BScore">0</span></span></span><span class="bb-ls-col"><span class="bb-ls-h">7</span><span class="bb-gate isGame7Started" data-osb-component="field" data-osb-field="isGame7Started" style="opacity: 0"><span class="bb-ls-v game7AScore" data-osb-component="field" data-osb-field="game7AScore">0</span><span class="bb-ls-v game7BScore" data-osb-component="field" data-osb-field="game7BScore">0</span></span></span><span class="bb-ls-col bb-ls-extra"><span class="bb-ls-h">8</span><span class="bb-gate isGame8Started" data-osb-component="field" data-osb-field="isGame8Started" style="opacity: 0"><span class="bb-ls-v game8AScore" data-osb-component="field" data-osb-field="game8AScore">0</span><span class="bb-ls-v game8BScore" data-osb-component="field" data-osb-field="game8BScore">0</span></span></span><span class="bb-ls-col bb-ls-extra"><span class="bb-ls-h">9</span><span class="bb-gate isGame9Started" data-osb-component="field" data-osb-field="isGame9Started" style="opacity: 0"><span class="bb-ls-v game9AScore" data-osb-component="field" data-osb-field="game9AScore">0</span><span class="bb-ls-v game9BScore" data-osb-component="field" data-osb-field="game9BScore">0</span></span></span><span class="bb-ls-col bb-ls-extra"><span class="bb-ls-h">10</span><span class="bb-gate isGame10Started" data-osb-component="field" style="opacity: 0"><span class="bb-ls-v game10AScore" data-osb-component="field">0</span><span class="bb-ls-v game10BScore" data-osb-component="field">0</span></span></span></span><span class="bb-ls-col bb-ls-r"><span class="bb-ls-h">R</span><span class="bb-ls-v bb-ls-runs currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="bb-ls-v bb-ls-runs currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span><span class="bb-ls-col bb-ls-he"><span class="bb-ls-h">H</span><span class="bb-ls-v hitsA" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</span><span class="bb-ls-v hitsB" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</span></span><span class="bb-ls-col bb-ls-he"><span class="bb-ls-h">E</span><span class="bb-ls-v errorsA" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsA">0</span><span class="bb-ls-v errorsB" data-osb-component="text" data-osb-static="true" data-sport-stat="errorsB">0</span></span></div>
<div class="ls-sit"><span class="bb-inning"><span class="bb-half"><span class="bb-half-dim" aria-hidden="true"></span><span class="bb-half-win"><span class="inningHalf" data-osb-component="field"></span></span></span><span class="bb-inning-no inning" data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</span></span><span class="diamond" aria-label="Bases"><span class="base second"></span><span class="base third"></span><span class="base first"></span><span class="bb-plate" aria-hidden="true"></span><span class="bb-bases bases" data-osb-component="field"></span></span><span class="ls-cnt"><span class="bb-count"><span class="bb-b balls" data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</span><span class="bb-dash" aria-hidden="true">-</span><span class="bb-s strikes" data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</span></span><span class="bb-outs"><span class="bb-o outs" data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</span><span class="bb-outs-label">OUT</span></span></span><span class="bb-break isInBetweenGames" data-osb-component="field" style="opacity: 0">INNING<br>BREAK</span></div></div>
</article>
<span class="bb-sr battingSide" data-osb-component="field"></span><span class="bb-retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="bb-retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main></body></html>
