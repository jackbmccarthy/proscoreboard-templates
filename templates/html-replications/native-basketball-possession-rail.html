<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Possession Rail</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 50px 28px; font-family: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
    .osb { position: relative; display: grid; grid-template-columns: 1fr 320px 1fr; width: 1180px; height: 116px; color: #fff; background: #08090b; border-top: 4px solid #e8ff3a; filter: drop-shadow(0 8px 18px #000a); }
    .team { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1fr) 132px; min-width: 0; }
    .team.B { grid-template-columns: 132px minmax(0, 1fr); }
    .team.A > .kitw { order: 2; } .team.A .who { text-align: right; align-items: flex-end; }
    .kitw { position: static; display: flex; background: #3e4a5a; }
    .team.B .kitw { background: #6e7888; }
    .kit { flex: 1; display: flex; align-items: center; justify-content: center; background-color: transparent; }
    .pts { min-width: 108px; padding: 5px 0 0; text-align: center; font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 64px; font-weight: 700; line-height: 1; color: #fff; background: #000c; border-radius: 4px; font-variant-numeric: tabular-nums; }
    .who { position: static; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-width: 0; padding: 0 22px 0 26px; }
    .team.B .who { padding: 0 26px 0 22px; }
    .nm { font-size: 29px; font-weight: 700; line-height: 1; letter-spacing: .5px; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: normal; word-break: normal; hyphens: none; text-wrap: balance; max-width: 100%; }
    .meta { display: flex; align-items: center; gap: 16px; font-size: 16px; font-weight: 700; letter-spacing: 1.5px; color: #c9ced6; }
    .team.A .meta { justify-content: flex-end; }
    .tor { display: flex; align-items: center; gap: 7px; }
        .cap { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; color: #c9ced6; }
    .pips { display: flex; gap: 5px; }
    .pip { width: 16px; height: 12px; background: #e8ff3a; border-radius: 2px; }
    .fl b { color: #fff; margin-left: 4px; }
    .bonus { font-size: 14px; font-weight: 800; letter-spacing: 1.5px; color: #fff; background: #ff6a1f; padding: 2px 8px 1px; border-radius: 2px; }
    .bonus:empty { display: none; }
    .to { position: absolute; left: 16px; right: 148px; bottom: 12px; height: 32px; align-items: center; justify-content: space-between; gap: 14px; padding: 0 4px 0 12px; background: #1d2026; border-left: 4px solid #e8ff3a; color: #e8ff3a; }
    .team.B .to { left: 148px; right: 16px; }
    .to-l { font-size: 18px; font-weight: 700; letter-spacing: 4px; }
    .to-c { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 22px; font-weight: 700; background: transparent; color: #fff; padding: 3px 8px 1px; font-variant-numeric: tabular-nums; }
    .mid { display: grid; background: #15171b; border-left: 1px solid #2c3036; border-right: 1px solid #2c3036; }
    .mid > * { grid-area: 1 / 1; }
    .live { position: relative; display: grid; grid-template-columns: 30px auto 30px; column-gap: 10px; align-items: center; justify-content: center; }
    .pa { position: relative; display: flex; align-items: center; justify-content: center; width: 30px; height: 40px; }
    .pa::after { content: ""; position: absolute; width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; opacity: .9; }
    .pa.A::after { border-right: 12px solid #2c3036; }
    .pa.B::after { border-left: 12px solid #2c3036; }
    .arrow { position: relative; z-index: 1; }
    .arrow { width: 0; height: 0; border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
    .pa.A .arrow { border-right: 22px solid #e8ff3a; }
    .pa.B .arrow { border-left: 22px solid #e8ff3a; }
    .core { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .top { display: flex; align-items: center; gap: 14px; }
    .gc { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 58px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .gc b { color: #e8ff3a; padding: 0 1px; }
    .sub { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; letter-spacing: 1.5px; color: #9aa1ab; }
    .per { font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: 1px; color: #08090b; background: #fff; padding: 3px 12px 1px; border-radius: 2px; }
    .shot { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; width: 50px; height: 54px; padding: 0; background: #e8ff3a; color: #08090b; font-weight: 700; }
    .shot-v { font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-size: 26px; font-weight: 700; color: #e8ff3a; background: #08090b; min-width: 40px; line-height: 26px; text-align: center; }
    .run-shot { position: absolute; left: 0; right: 0; bottom: -4px; height: 2px; background: #e8ff3a; }
    .runbar { position: absolute; left: 60px; right: 60px; bottom: 0; height: 3px; background: #e8ff3a; }
    .prog { display: flex; gap: 3px; align-items: center; }
    .q { position: relative; width: 18px; height: 5px; background: #393d44; }
    .q > span { position: absolute; inset: 0; background: #e8ff3a; }
    .ot { width: 20px; height: 4px; margin-left: 2px; padding: 0; overflow: hidden; font-size: 16px; line-height: 4px; border-radius: 1px; background: #ff6a1f; color: transparent; }
    .state { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; background: #15171b; color: #fff; }
    .st-s { font-size: 17px; font-weight: 700; letter-spacing: 3px; color: #e8ff3a; }
    .st-b { font-size: 46px; font-weight: 700; margin-top: 2px; }
    .brk .half-t { font-size: 44px; }
    .fin { z-index: 2; background: #15171b; color: #fff; }
    .fin-ot { color: #e8ff3a; }
    .fin-ot { font-size: 17px; font-weight: 700; letter-spacing: 3px; margin-top: 3px; }
    .ev { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); display: flex; gap: 12px; padding: 6px 16px 4px; background: #e8ff3a; color: #08090b; font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
    .wrap { padding-top: 30px; }
    .half-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .end-t { display: none; }
    .osb:has(.isGame2Started[style*="opacity: 1"]):not(:has(.isGame3Started[style*="opacity: 1"])) .brk .half-t { display: block; }
    .fin-ot { display: none; }
    .osb:has(.isGame5Started[style*="opacity: 1"]) .fin-ot { display: block; }
    .osb:has(.isComplete[style*="opacity: 1"]) .final-dim { opacity: .5; }
    .osb:has(.isComplete[style*="opacity: 1"]) .meta { display: none; }
    .osb:has(.isComplete[style*="opacity: 1"]) .nm { font-size: 34px; }
    .tor:not(:has(.pip[style*="opacity: 1"])) { visibility: hidden; }
    .win { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 6px; background: #e8ff3a; }
    .kitw:has(> .win[style*="opacity: 1"]) .pts { background: #000; color: #e8ff3a; box-shadow: 0 0 0 2px #e8ff3a; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .team.B .nm, .osb:has(.isBWinner[style*="opacity: 1"]) .team.A .nm { color: #9aa1ab; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .team.B .pts, .osb:has(.isBWinner[style*="opacity: 1"]) .team.A .pts { color: #b4bac3; background: #000; }
    .osb:has(.isAWinner[style*="opacity: 1"]) .team.B .kit, .osb:has(.isBWinner[style*="opacity: 1"]) .team.A .kit { filter: grayscale(1) brightness(.62); }
    .osb:has(.isAWinner[style*="opacity: 1"]) .team.B .kit .pts, .osb:has(.isBWinner[style*="opacity: 1"]) .team.A .kit .pts { filter: brightness(1.6); }
    .pips { gap: 0 !important; }
    .pips > [class*="TimeoutLeft"] { margin-right: 4px; }
    .pips > [style*="opacity: 0"] { width: 0 !important; margin: 0 !important; }
    .pips > .pip[style*="opacity: 0"] { display: none !important; }
    .osb-aux { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    .ev:not(:has(.eventName:not(:empty))):not(:has(.matchRound:not(:empty))) { display: none; }
    .ev-sep { display: none; }
    .ev:has(.eventName:not(:empty)):has(.matchRound:not(:empty)) .ev-sep { display: inline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* stream-size floor: text >= 16px, indicators >= 12px at 1280x720 */
.ev-n.eventName,.ev-r.matchRound,.ot.isGame5Started,.shot.isShotClockActive,.bonus.bonusA,.bonus.bonusB{font-size:16px!important}
/* end stream-size floor */

  </style>
</head>
<body>
<div class="wrap">
<article class="osb" aria-label="Basketball lower third">
  <div class="ev"><span class="ev-n eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-r matchRound" data-osb-component="field" data-osb-field="matchRound"></span></div>
  <div class="team A"><span class="kitw"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span><span class="win isAWinner" data-osb-component="field" data-osb-field="isAWinner" style="opacity: 0;"></span></span><div class="who"><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="meta"><span class="tor final-dim"><span class="cap">TO</span><span class="pips"><span class="pip isATimeoutLeft1" data-osb-component="field" data-osb-field="isATimeoutLeft1" style="opacity: 0;"></span><span class="pip isATimeoutLeft2" data-osb-component="field" data-osb-field="isATimeoutLeft2" style="opacity: 0;"></span><span class="pip isATimeoutLeft3" data-osb-component="field" data-osb-field="isATimeoutLeft3" style="opacity: 0;"></span><span class="pip isATimeoutLeft4" data-osb-component="field" data-osb-field="isATimeoutLeft4" style="opacity: 0;"></span><span class="pip isATimeoutLeft5" data-osb-component="field" data-osb-field="isATimeoutLeft5" style="opacity: 0;"></span></span></span><span class="fl">FOULS <b class="teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</b></span><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span></div><span class="to isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIMEOUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></div></div>
  <div class="mid">
    <div class="live"><span class="pa A final-dim"><span class="arrow isAPossession" data-osb-component="field" data-osb-field="isAPossession" style="opacity: 0;"></span></span><span class="core"><span class="top"><span class="gc"><span class="clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b>:</b><span class="clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="shot isShotClockActive" data-osb-component="field" data-osb-field="isShotClockActive" style="opacity: 0;">SHOT<span class="shot-v" data-osb-static="true" data-sport-stat="shotClock"></span><span class="run-shot isShotClockRunning" data-osb-component="field" data-osb-field="isShotClockRunning" style="opacity: 0;"></span></span></span><span class="sub"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="prog"><span class="q"><span class="isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display: none; opacity: 0;"></span></span><span class="q"><span class="isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display: none; opacity: 0;"></span></span><span class="ot isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;">OT</span></span></span></span><span class="pa B final-dim"><span class="arrow isBPossession" data-osb-component="field" data-osb-field="isBPossession" style="opacity: 0;"></span></span><span class="runbar isGameClockRunning" data-osb-component="field" data-osb-field="isGameClockRunning" style="opacity: 0;"></span></div>
    <div class="state brk isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;"><span class="end-t st-s">END OF</span><span class="end-t st-b"><span class="periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span></span><span class="half-t st-b">HALFTIME</span></div>
    <div class="state fin isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;"><span class="st-b">FINAL</span><span class="fin-ot">OVERTIME</span></div>
  </div>
  <div class="team B"><span class="kitw"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span><span class="win isBWinner" data-osb-component="field" data-osb-field="isBWinner" style="opacity: 0;"></span></span><div class="who"><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="meta"><span class="tor final-dim"><span class="cap">TO</span><span class="pips"><span class="pip isBTimeoutLeft1" data-osb-component="field" data-osb-field="isBTimeoutLeft1" style="opacity: 0;"></span><span class="pip isBTimeoutLeft2" data-osb-component="field" data-osb-field="isBTimeoutLeft2" style="opacity: 0;"></span><span class="pip isBTimeoutLeft3" data-osb-component="field" data-osb-field="isBTimeoutLeft3" style="opacity: 0;"></span><span class="pip isBTimeoutLeft4" data-osb-component="field" data-osb-field="isBTimeoutLeft4" style="opacity: 0;"></span><span class="pip isBTimeoutLeft5" data-osb-component="field" data-osb-field="isBTimeoutLeft5" style="opacity: 0;"></span></span></span><span class="fl">FOULS <b class="teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</b></span><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span></div><span class="to isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;"><span class="to-l">TIMEOUT</span><span class="to-c timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></span></div></div>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span><span class="timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span><span class="possessionSide" data-osb-component="field" data-osb-field="possessionSide"></span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</article>
</div>
</body>
</html>
