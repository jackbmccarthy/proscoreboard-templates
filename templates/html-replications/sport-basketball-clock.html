<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basketball Clock</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 24px 12px; color: #f5f1e7; font-family: Impact, "Arial Narrow", Arial, sans-serif; }
    .basketball-board { --orange: #ff7b20; width: min(100%, 1800px); margin: 0 auto; container-type: inline-size; display: flex; flex-direction: column; filter: drop-shadow(0 5px 5px #0008); }
    .score-ribbon { display: flex; align-items: stretch; width: 100%; border: 2px solid #555c60; border-radius: 12px 12px 0 0; background: linear-gradient(120deg, #202324, #090b0c 48%, #232627); overflow: hidden; }
    .team-panel { position: relative; flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 3cqw; padding: 1.3cqw 1.3cqw 1.3cqw 3.2cqw; }
    .team-panel.side-b { padding: 1.3cqw 3.2cqw 1.3cqw 1.3cqw; }
    .identity { flex: 0 0 1cqw; width: 1cqw; height: 100%; position: absolute; top: 0; left: 0; background: var(--orange); box-shadow: inset 0 0 0 1px #ffd18d66; }
    .side-b .identity { left: auto; right: 0; }
    .team-name { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center; text-transform: uppercase; font-size: 6.3cqw; line-height: 1.05; letter-spacing: -.1cqw; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .team-score { flex: 0 0 10.5cqw; display: flex; align-items: center; justify-content: center; min-height: 10.2cqw; border: 3px solid var(--orange); border-radius: 11px; background: linear-gradient(#151819, #070809); font-size: 9.2cqw; line-height: 1; font-variant-numeric: tabular-nums; }
    .clock-panel { flex: 0 0 29%; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: .6cqw 2cqw .7cqw; border-inline: 3px solid var(--orange); background: linear-gradient(110deg, #313639, #111415 27%, #151819 80%, #343a3d); clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%); }
    .game-clock { display: flex; align-items: center; justify-content: center; gap: .2cqw; white-space: nowrap; border: 1px solid #303639; border-radius: 12px; background: #050707; padding: .1cqw .5cqw; font-size: 7.2cqw; line-height: 1.04; font-variant-numeric: tabular-nums; box-shadow: inset 0 3px 7px #000; }
    .clock-colon { color: var(--orange); }
    .period { display: flex; align-items: center; justify-content: center; gap: 1.6cqw; margin-top: .6cqw; font-size: 1.6cqw; letter-spacing: .25cqw; }
    .period::before, .period::after { content: ""; width: 3.3cqw; height: 3px; background: var(--orange); }
    .stat-value { display: flex; align-items: center; justify-content: center; border: 2px solid var(--orange); border-radius: 6px; padding: .2cqw .6cqw; min-width: 4cqw; font-size: 2.9cqw; line-height: 1; letter-spacing: 0; font-variant-numeric: tabular-nums; background: #080a0b; }
    .support-ribbon { display: flex; align-items: stretch; margin: 3px .5cqw 0; min-height: 5cqw; border: 2px solid #454d51; border-top: 1px solid #73797b; background: linear-gradient(#242829, #0e1112); clip-path: polygon(0 0, 100% 0, 100% 63%, 97.5% 100%, 2.5% 100%, 0 63%); }
    .support-ribbon::before, .support-ribbon::after { content: ""; flex: 0 0 7%; border-right: 3px solid var(--orange); background: radial-gradient(circle, #858e9466 1px, transparent 1.5px) 0 0 / 6px 6px; transform: skewX(20deg); }
    .support-ribbon::after { border-right: 0; border-left: 3px solid var(--orange); transform: skewX(-20deg); }
    .support-stat { flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 2.4cqw; min-width: 0; padding: .5cqw; font-size: 1.9cqw; letter-spacing: .35cqw; }
    .shot-clock { flex: 0 0 30%; border-inline: 1px solid #424b50; }
    .shot-clock::before, .shot-clock::after { content: ""; flex: 1 1 0; height: 3px; background: var(--orange); }
    .runtime-auxiliary, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    @media (max-width: 600px) {
      body { padding: 16px 6px; }
      .score-ribbon { border-width: 1px; border-radius: 5px 5px 0 0; }
      .team-panel { gap: 1.4cqw; padding-left: 2cqw; }
      .team-panel.side-b { padding-right: 2cqw; }
      .team-name { font-size: 5cqw; }
      .team-score { border-width: 1px; border-radius: 4px; }
      .clock-panel { padding-inline: 1.7cqw; border-width: 1px; }
      .game-clock { border-radius: 4px; }
      .period { gap: .7cqw; font-size: 2cqw; letter-spacing: .1cqw; }
      .period::before, .period::after { width: 2cqw; height: 1px; }
      .support-ribbon { border-width: 1px; min-height: 6.5cqw; }
      .support-stat { font-size: 2.5cqw; gap: 1.2cqw; letter-spacing: .15cqw; }
      .stat-value { border-width: 1px; border-radius: 3px; font-size: 3.8cqw; }
      .shot-clock::before, .shot-clock::after { height: 1px; }
    }
    .team-score { min-width: 0; font-size: 7cqw; }
  </style>
</head>
<body>
  <article class="basketball-board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Basketball scoreboard">
    <div class="score-ribbon rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <div class="team-panel side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
        <span class="team-name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
        <span class="team-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span>
      </div>
      <div class="clock-panel columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="game-clock"><span data-osb-static="true" data-sport-stat="clockMinutes">00</span><span class="clock-colon">:</span><span data-osb-static="true" data-sport-stat="clockSeconds">00</span></div>
        <div class="period"><span>PERIOD</span><span class="stat-value" data-osb-static="true" data-sport-stat="period">0</span></div>
      </div>
      <div class="team-panel side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="team-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span>
        <span class="team-name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
        <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
      </div>
    </div>
    <div class="support-ribbon rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <div class="support-stat"><span>FOULS</span><span class="stat-value" data-osb-static="true" data-sport-stat="foulsA">0</span></div>
      <div class="support-stat shot-clock"><span>SHOT</span><span class="stat-value" data-osb-static="true" data-sport-stat="shotClock">00</span></div>
      <div class="support-stat"><span>FOULS</span><span class="stat-value" data-osb-static="true" data-sport-stat="foulsB">0</span></div>
    </div>
    <div class="runtime-auxiliary"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div>
    <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
  </article>
</body>
</html>
