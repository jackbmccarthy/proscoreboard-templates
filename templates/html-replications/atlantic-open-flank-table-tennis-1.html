<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Tennis — Atlantic Open Flank Scorebug</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--marine:#21343c;--white:#f6f8f5;--glass:#a5c5c3;--rule:#5c7379;display:flex;flex-direction:column;width:min(65vw,1410px);min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:3px;background:var(--marine);color:var(--white);container-type:inline-size}
.rows{display:flex;flex:1 1 auto;min-width:0;flex-direction:column}
.row{display:flex;flex:1 1 50%;min-width:0;min-height:11.05cqw;align-items:stretch}
.row+.row{border-top:1px solid var(--rule)}
.identity-wrap{display:flex;flex:0 0 4.4%;align-items:center;justify-content:center;padding:1.2cqw 0}
.identity{display:block;flex:0 0 1.1cqw;width:1.1cqw;height:100%;min-width:5px;background:#2678a9}
.jerseyColorB{background:#c85e66}
.support-track,.primary-track{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;white-space:nowrap}
.support-track{flex:0 0 14%;width:14%;color:var(--glass)}
.primary-track{flex:0 0 16%;width:16%;color:var(--white)}
.caption{display:block;max-width:100%;overflow:hidden;line-height:1;font-weight:700}
.support-track .caption{font-size:2.05cqw}.primary-track .caption{font-size:2.1cqw}
.score{display:block;max-width:100%;overflow:hidden;white-space:nowrap;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.support-track .score{font-size:4.6cqw}.primary-track .score{font-size:6cqw}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.7cqw;padding:0 1.7cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5cqw;line-height:1.04;font-weight:700}
.combinedAName:empty::before{content:"Player A"}.combinedBName:empty::before{content:"Player B"}
.serve{display:block;flex:0 0 .55cqw;width:.55cqw;height:.55cqw;min-width:6px;min-height:6px;border-radius:50%;background:var(--white)}
.sport-line{position:relative;display:flex;flex:0 0 auto;height:5.1cqw;align-items:center;padding:0 2.1cqw;border-top:1px solid var(--rule);font-size:2.5cqw;line-height:1;font-weight:700;white-space:nowrap}
.point-slot{position:absolute;right:1%;top:0;width:20%;height:100%;font-size:1cqw;font-weight:700;text-align:center}
.point-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--marine)}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:94vw}.row{min-height:83px}.identity-wrap{flex-basis:6px;padding:7px 0}.identity{flex-basis:5px;width:5px}.support-track{flex-basis:21%;width:21%}.primary-track{flex-basis:23%;width:23%}.support-track .caption,.primary-track .caption{font-size:8px}.support-track .score{font-size:22px}.primary-track .score{font-size:35px}.name-lane{gap:2px;padding:0 5px}.name{font-size:18px}.serve{flex-basis:5px;width:5px;height:5px}.sport-line{height:28px;padding:0 9px;font-size:13px}.point-slot{font-size:7px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="rows columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></span><div class="support-track"><span class="caption">GAMES</span><span class="score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div><div class="primary-track"><span class="caption">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div><div class="row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity-wrap"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></span><div class="support-track"><span class="caption">GAMES</span><span class="score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div><div class="primary-track"><span class="caption">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div></div><div class="sport-line"><span>TABLE TENNIS</span><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div></article></main></body></html>
