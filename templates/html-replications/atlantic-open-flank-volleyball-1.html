<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Atlantic Open Flank 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(94vw,1335px);max-width:100%;aspect-ratio:3.56;overflow:hidden;border:2px solid #5c7379;border-radius:5px;background:#21343c;color:#f6f8f5;container-type:inline-size}
.teams{display:flex;flex:1 1 0;min-height:0;flex-direction:column}
.team{display:flex;align-items:stretch;flex:1 1 0;min-height:0;min-width:0}
.team+.team{border-top:2px solid #5c7379}
.identity{display:block;flex:0 0 14px;align-self:stretch;margin:19px 0 19px 16px;background:#39a6e4}
.jerseyColorB{background:#ed6c74}
.sets,.points{display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0;gap:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sets{flex:0 0 13%;color:#a5c5c3}
.points{flex:0 0 16%;color:#f6f8f5}
.label{display:block;max-width:100%;overflow:hidden;font-size:clamp(14px,1.8cqw,26px);font-weight:700;line-height:1}
.set-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(32px,5cqw,71px);font-weight:800;line-height:1;text-align:center}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(46px,6.2cqw,90px);font-weight:800;line-height:1;text-align:center}
.name{display:block;align-self:center;flex:1 1 0;min-width:0;overflow:hidden;padding:0 38px;color:#f6f8f5;font-size:clamp(30px,6.3cqw,83px);font-weight:700;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.utility{display:flex;align-items:center;justify-content:space-between;flex:0 0 18%;min-width:0;padding:0 25px;border-top:2px solid #5c7379;font-size:clamp(17px,2.4cqw,31px);font-weight:750;letter-spacing:.04em;line-height:1;white-space:nowrap}
.sport-tag{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-status{display:flex;align-items:center;gap:.3em;color:#a5c5c3}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:7px}
 .board{width:100%;height:168px;aspect-ratio:auto;border-width:1px;border-radius:3px}
 .team+.team,.utility{border-width:1px}
 .identity{flex-basis:5px;margin:11px 0 11px 6px}
 .sets{flex-basis:17%}
 .points{flex-basis:19%}
 .label{font-size:clamp(8px,2.4cqw,11px)}
 .set-score{font-size:clamp(21px,6cqw,28px)}
 .score{font-size:clamp(27px,8cqw,38px)}
 .name{padding:0 8px;font-size:clamp(16px,5cqw,23px)}
 .utility{padding:0 9px;font-size:clamp(11px,3cqw,15px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="sets" data-osb-component="layout"><span class="label" data-osb-component="text">SETS</span><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="points" data-osb-component="layout"><span class="label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="sets" data-osb-component="layout"><span class="label" data-osb-component="text">SETS</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="points" data-osb-component="layout"><span class="label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
  </div>
  <div class="utility rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
