<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis Lower Third — Head to Head</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.slot{position:relative;display:inline-block;flex:0 0 auto}
.slot>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.flag:not([src]),.tlogo:not([src]){display:none}
.board:has(.isMatchStarted[style*="opacity: 1"]) .isWarmUpStarted{opacity:0!important}
.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isMatchPoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isGamePoint[style*="opacity: 1"])>.isInBetweenGames,.slot:has(>.isComplete[style*="opacity: 1"])>.isInBetweenGames{opacity:0!important}
.slot:has(>.isComplete[style*="opacity: 1"])>.isGamePoint,.slot:has(>.isComplete[style*="opacity: 1"])>.isMatchPoint{opacity:0!important}
.slot:has(>.isATimeOutActive[style*="opacity: 1"])>.isATimeOutUsed,.slot:has(>.isBTimeOutActive[style*="opacity: 1"])>.isBTimeOutUsed{opacity:0!important}
body:has(.isComplete[style*="opacity: 1"]) .isMatchStarted{opacity:0!important}
.meta{display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.meta>*{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta .sep{flex:0 0 auto;font-style:normal;padding:0 .45em;opacity:.55}
.meta .rd,.meta .bo{flex-shrink:0}
.meta .ev:empty+.s1,.meta .rd:empty+.s2,.meta .s1:has(+.rd:empty),.meta .s2:has(+.bo:empty){display:none}
.meta .ev:empty+.s1+.rd:empty+.s2{display:none}
.won{position:absolute;z-index:0}
.gs{position:relative;z-index:1}
.gtag .nx{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .now{display:none}
.board:has(.isInBetweenGames[style*="opacity: 1"]) .gtag .nx{display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 0 5vh;pointer-events:none}
.board{font-size:1.3vw;font-family:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#fff;width:max-content;-webkit-font-smoothing:antialiased}
.grid{display:grid;grid-template-columns:19em 4.8em 1em 4.8em 19em;grid-template-rows:auto 1.9em 3.6em 2.2em 2em;filter:drop-shadow(0 .4em 1em rgba(0,0,0,.5))}
/* team tie: its own strip above everything, the player match below it */
.tiebar{grid-column:1 / -1;grid-row:1;justify-self:center;display:none;align-items:center;gap:.7em;width:36em;min-height:2.4em;margin-bottom:.35em;padding:.2em .8em;border-radius:.3em;background:#062a33;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.board:has(.tname:not(:empty)) .tiebar{display:flex}
.tside{display:flex;align-items:center;gap:.45em;flex:1 1 0;min-width:0}
.tb{justify-content:flex-end;text-align:right}
.tlogo{width:1.4em;height:1.4em;object-fit:contain;flex:0 0 auto}
.tname{min-width:0;white-space:normal;overflow-wrap:normal;hyphens:none;line-height:1.05}
.tbox{display:flex;align-items:center;gap:.3em;flex:0 0 auto;height:1.6em;padding:0 .55em;border-radius:.25em;background:#d7ff3a;color:#062a33;font-variant-numeric:tabular-nums}
.tbox i{font-style:normal;letter-spacing:.1em;margin-right:.2em}
.tbox .tscore{font-size:1.2em}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .grid>:not(.tiebar){display:none!important}
.board:has(.tname:not(:empty)):not(:has(.name:not(:empty))) .tiebar{font-size:1.3em;width:36em;min-height:3em;margin:0}
.top{grid-column:1;grid-row:2;justify-self:start;max-width:100%;overflow:hidden;display:flex;align-items:center;height:1.9em;padding:0 1em;border-radius:.3em .3em 0 0;background:#0b3d48;color:#e9f6f8;font-size:1em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.top:not(:has(.meta>:not(.sep):not(:empty))){visibility:hidden}
.top .meta{min-width:0}
.plate{grid-row:3;display:flex;align-items:center;gap:.55em;min-width:0;background:#062a33}
.pA{grid-column:1;padding-right:.7em;border-radius:0 0 0 0}
.pB{grid-column:5;flex-direction:row-reverse;padding-left:.7em;border-radius:.3em .3em 0 0}
.kit{flex:0 0 .45em;align-self:stretch;background:#5d7780}
.flag{flex:0 0 auto;width:1.9em;height:1.27em;object-fit:cover;border-radius:.12em;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.name{flex:0 1 auto;min-width:0;font-size:1.32em;line-height:1.02;font-weight:800;text-transform:uppercase;overflow-wrap:normal;word-break:normal;hyphens:none}
.pA .name{margin-right:auto}.pB .name{margin-left:auto;text-align:right}
.s2slot{width:0;height:1.35em;margin:0 -.275em}
.s2slot>.ss2{left:auto;right:.25em;width:1.2em}
.pB .s2slot>.ss2{right:auto;left:.25em}
.ss2{border-radius:.2em;background:#e9f6f8;color:#062a33;font-size:1em;font-weight:900}
.srv{width:1.45em;height:1.45em}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff9a3c 45%,#d65f00 100%);box-shadow:0 0 0 .12em rgba(0,0,0,.3)}
.win{border-radius:50%;background:#d7ff3a}
.win::after{content:"";width:.36em;height:.66em;margin-top:-.14em;border:solid #062a33;border-width:0 .17em .17em 0;transform:rotate(45deg)}
.pt{grid-row:3;display:flex;align-items:center;justify-content:center;background:#fff;color:#062a33;font-size:2.3em;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.pt.ptA{grid-column:2;border-radius:.13em 0 0 0}.pt.ptB{grid-column:4;border-radius:0 .13em 0 0}
.colon{grid-column:3;grid-row:3;display:flex;align-items:center;justify-content:center;background:#fff;color:#8fb0b8;font-size:1.8em;font-weight:800;padding-bottom:.12em}
.sub{grid-row:4;display:flex;align-items:center;gap:.35em;padding:0 .7em;background:#0b3d48}
.sA{grid-column:1;border-radius:0 0 0 .3em}
.sB{grid-column:5;flex-direction:row-reverse;border-radius:0 0 .3em 0}
.marks{display:flex;align-items:center;gap:.3em}
.sB .marks{flex-direction:row-reverse}
.to-slot{width:2.3em;height:1.45em}
.to-on,.to-used{border-radius:.2em;font-size:1em;font-weight:900;letter-spacing:.03em}
.to-on{background:#ffd23f;color:#111}
.to-used{background:#2f6470;color:#e9f6f8}
.card-slot{width:.9em;height:1.3em}
.card{border-radius:.12em;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.yc{background:#ffd400}.rc{background:#e3262f}
.gw{display:flex;align-items:center;gap:.45em;margin-left:auto;font-weight:800;text-transform:uppercase}
.sB .gw{margin-left:0;margin-right:auto;flex-direction:row-reverse}
.gw i{font-style:normal;font-size:1em;letter-spacing:.1em;color:#a9cbd2}
.gn{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.55em;border-radius:.2em;background:#d7ff3a;color:#062a33;font-size:1.15em;font-variant-numeric:tabular-nums}
.mid{grid-column:2 / span 3;grid-row:4;width:auto;height:2.2em;background:#062a33}
.mid>*{font-size:1em;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.gtag{color:#fff}
.fin{background:#062a33;color:#d7ff3a;letter-spacing:.14em}
/* states sit on the score box, centred on it */
.pstate{grid-column:2 / span 3;grid-row:2;width:100%;height:1.9em;z-index:2}
.pstate>*{border-radius:.3em .3em 0 0;font-size:1em;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.st-warm,.st-break{background:#0b3d48;color:#e9f6f8}
.st-gp{background:#ff9a3c;color:#111}
.st-mp{background:#e3262f;color:#fff}
/* under the score box: the format, then the finished games, in one attached strip */
.strip{grid-column:2 / span 3;grid-row:5;justify-self:center;display:flex;align-items:center;justify-content:center;gap:.9em;min-width:100%;height:2em;padding:0 .8em;border-radius:0 0 .3em .3em;background:#e9f2f4;color:#0b3d48;font-weight:800;text-transform:uppercase;white-space:nowrap}
.strip .bo{letter-spacing:.08em}
.strip:has(.won[style*="opacity: 1"]) .bo{padding-right:.9em;border-right:1px solid #bcd2d7;color:#557f89}
.hist{display:flex;align-items:center;gap:.9em}
.hcol{display:flex;align-items:center;gap:.25em;font-variant-numeric:tabular-nums}
.hl{order:0;color:#557f89;letter-spacing:.06em;margin-right:.2em}
.hc.a{order:1}.hc.b{order:3}
.hcol::after{content:"–";order:2;color:#557f89}
.hc{position:relative;display:flex;align-items:center;justify-content:center;width:1.6em;height:1.4em;border-radius:.2em;box-shadow:inset 0 0 0 1px #bcd2d7;color:#3f6670}
.hc .won{inset:0;border-radius:.2em;background:#062a33}
.hc:has(.won[style*="opacity: 1"]){color:#d7ff3a}
.hcol:not(:has(.won[style*="opacity: 1"])){position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap;padding:0!important;margin:0!important;border:0!important}
/* final: games won take the score box; the loser's side steps back */
.board:has(.isComplete[style*="opacity: 1"]) .pt{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip-path:inset(50%)!important}
.board:has(.isComplete[style*="opacity: 1"]) .gw{grid-row:3;align-self:stretch;justify-content:center;margin:0;background:#fff;color:#062a33}
.board:has(.isComplete[style*="opacity: 1"]) .gw i{display:none}
.board:has(.isComplete[style*="opacity: 1"]) .sub{display:contents}
.board:has(.isComplete[style*="opacity: 1"]) .marks{grid-row:4;align-self:center;padding:0 .7em;height:2.2em;background:#0b3d48}
.board:has(.isComplete[style*="opacity: 1"]) .sA .marks{grid-column:1;border-radius:0 0 0 .3em}
.board:has(.isComplete[style*="opacity: 1"]) .sB .marks{grid-column:5;border-radius:0 0 .3em 0;justify-content:flex-start}
.board:has(.isComplete[style*="opacity: 1"]) .sA .gw{grid-column:2}
.board:has(.isComplete[style*="opacity: 1"]) .sB .gw{grid-column:4}
.board:has(.isComplete[style*="opacity: 1"]) .gn{background:none;font-size:2.3em;min-width:0;height:auto}
.board:has(.isAWinner[style*="opacity: 1"]) .sB .gw .gn,.board:has(.isBWinner[style*="opacity: 1"]) .sA .gw .gn{color:#5a767d}
.board:has(.isAWinner[style*="opacity: 1"]) .sA .gw,.board:has(.isBWinner[style*="opacity: 1"]) .sB .gw{background:#d7ff3a}
.board:has(.isAWinner[style*="opacity: 1"]) .plate.b,.board:has(.isBWinner[style*="opacity: 1"]) .plate.a{background:#0f3138;color:#9db7bd}
.board:has(.isAWinner[style*="opacity: 1"]) .plate.b .flag,.board:has(.isBWinner[style*="opacity: 1"]) .plate.a .flag{opacity:.5}

</style>
</head>
<body>

acity:0">T</span></span><span class="slot card-slot"><span class="isAYellowCarded card yc" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0"></span></span><span class="slot card-slot"><span class="isARedCarded card rc" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0"></span></span></span><span class="gw"><i>Games</i><span class="currentAMatchScore AScore gn" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span></div><span class="slot mid"><span class="isMatchStarted gtag" data-osb-component="field" data-osb-field="isMatchStarted" style="opacity:0"><span class="now">Game <span class="currentGame cg" data-osb-component="field" data-osb-field="currentGame"></span></span><span class="nx">Game <span class="nextGame ng" data-osb-component="field" data-osb-field="nextGame"></span></span></span><span class="isComplete fin" data-osb-component="field" data-osb-field="isComplete" style="opacity:0">Final</span></span><div class="sub sB b" data-osb-component="layout"><span class="marks"><span class="slot to-slot"><span class="isBTimeOutActive to-on" data-osb-component="field" data-osb-field="isBTimeOutActive" style="opacity:0">T/O</span><span class="isBTimeOutUsed to-used" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="opacity:0">T</span></span><span class="slot card-slot"><span class="isBYellowCarded card yc" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0"></span></span><span class="slot card-slot"><span class="isBRedCarded card rc" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0"></span></span></span><span class="gw"><i>Games</i><span class="currentBMatchScore BScore gn" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span></div><div class="strip"><span class="matchFormatLabel bestOf bo" data-osb-component="field" data-osb-field="matchFormatLabel"></span><div class="hist" data-osb-component="layout"><  won" data-osb-component="field" data-osb-field="isGame4AWon" style="opacity:0"></span><span class="game4AScore gs" data-osb-component="field" data-osb-field="game4AScore">0</span></span><span class="hc b"><span class="isGame4BWon won" data-osb-component="field" data-osb-field="isGame4BWon" style="opacity:0"></span><span class="game4BScore gs" data-osb-component="field" data-osb-field="game4BScore">0</span></span></div><div class="hcol isGame5Started" data-osb-component="layout" data-osb-field="isGame5Started" style="display:none"><span class="hl">G5</span><span class="hc a"><span class="isGame5AWon won" data-osb-component="field" data-osb-field="isGame5AWon" style="opacity:0"></span><span class="game5AScore gs" data-osb-component="field" data-osb-field="game5AScore">0</span></span><span class="hc b"><span class="isGame5BWon won" data-osb-component="field" data-osb-field="isGame5BWon" style="opacity:0"></span><span class="game5BScore gs" data-osb-component="field" data-osb-field="game5BScore">0</span></span></div><div class="hcol isGame6Started" data-osb-component="layout" data-osb-field="isGame6Started" style="display:none"><span class="hl">G6</span><span class="hc a"><span class="isGame6AWon won" data-osb-component="field" data-osb-field="isGame6AWon" style="opacity:0"></span><span class="game6AScore gs" data-osb-component="field" data-osb-field="game6AScore">0</span></span><span class="hc b"><span class="isGame6BWon won" data-osb-component="field" data-osb-field="isGame6BWon" style="opacity:0"></span><span class="game6BScore gs" data-osb-component="field" data-osb-field="game6BScore">0</span></span></div><div class="hcol isGame7Started" data-osb-component="layout" data-osb-field="isGame7Started" style="display:none"><span class="hl">G7</span><span class="hc a"><span class="isGame7AWon won" data-osb-component="field" data-osb-field="isGame7AWon" style="opacity:0"></span><span class="game7AScore gs" data-osb-component="field" data-osb-field="game7AScore">0</span></span><span class="hc b"><span class="isGame7BWon won" data-osb-component="field" data-osb-field="isGame7BWon" style="opacity:0"></span><span class="game7BScore gs" data-osb-component="field" data-osb-field="game7BScore">0</span></span></div></div></div></div></article></main>
