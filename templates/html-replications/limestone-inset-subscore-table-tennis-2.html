<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Tennis — Limestone Inset Subscore Lower Third</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--limestone:#ebe9e2;--ink:#243941;--teal:#365d67;--line:#aeb9b5;position:relative;display:flex;flex-direction:column;width:min(81vw,1710px);height:min(8.5vw,180px);min-width:0;min-height:0;overflow:visible;border:2px solid var(--line);border-radius:5px;background:var(--limestone);color:var(--ink);container-type:inline-size}
.competitors{display:flex;flex:1 1 auto;flex-direction:row;min-width:0;min-height:0}
.side{display:flex;flex:1 1 50%;min-width:0;min-height:0;align-items:stretch}
.side+.side{border-left:2px solid var(--line)}
.identity-name{display:flex;flex:1 1 auto;min-width:0;align-items:center}
.identity{display:block;flex:0 0 .85cqw;width:.85cqw;height:75%;margin-left:1.6cqw;background:#497d87}
.jerseyColorB{background:#497d87}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.55cqw;padding:0 1.3cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:2.9cqw;line-height:1;font-weight:700;letter-spacing:-.03em}
.combinedAName:empty::before{content:'Player A'}.combinedBName:empty::before{content:'Player B'}
.serve{display:block;flex:0 0 .55cqw;width:.55cqw;height:.55cqw;min-width:5px;min-height:5px;border-radius:50%;background:var(--teal)}
.game-wrap{display:flex;flex:0 0 13%;min-width:0;align-items:center;justify-content:center}
.game-cell{display:flex;flex:0 0 8.2cqw;width:8.2cqw;height:80%;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;overflow:hidden;border-radius:2px;background:var(--teal);color:#fff}
.games-label,.points-label{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:1.4cqw;line-height:1;font-weight:700;letter-spacing:.015em}
.match-score{display:block;max-width:100%;min-width:0;overflow:hidden;white-space:nowrap;text-align:center;font-size:4.1cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.point-track{display:flex;flex:0 0 28%;min-width:0;align-items:center;justify-content:center;gap:1.1cqw;flex-direction:row;color:var(--ink)}
.points-label{font-size:1.4cqw;font-weight:700}
.primary-score{display:block;max-width:100%;min-width:0;overflow:hidden;white-space:nowrap;text-align:center;font-size:6.3cqw;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.baseline{display:flex;flex:0 0 24%;min-height:0;align-items:center;padding:0 1.6cqw;border-top:2px solid var(--line)}
.sport-tag{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.65cqw;line-height:1;font-weight:700;letter-spacing:.01em}
.point-slot{position:absolute;right:0;bottom:100%;width:150px;height:18px;color:#fff;text-align:center;font-size:10px;font-weight:700}
.point-state{position:absolute;inset:0;display:block;padding:3px 4px;background:var(--teal)}
.point-slot:has(>.isMatchPoint[style*='opacity: 1'])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*='opacity:1'])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:96vw;height:104px;max-height:none}.baseline{flex-basis:26px;padding:0 7px}.sport-tag{font-size:10px}.identity{flex-basis:4px;width:4px;height:65%;margin-left:5px}.name-lane{gap:2px;padding:0 4px}.name{font-size:12px}.serve{flex-basis:5px;width:5px;height:5px}.game-wrap{flex-basis:41px}.game-cell{flex-basis:34px;width:34px;height:76%;gap:2px}.games-label,.points-label{font-size:7px}.match-score{font-size:18px}.point-track{flex-basis:45px;gap:0;flex-direction:column}.primary-score{font-size:27px}.point-slot{height:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><section class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity-name"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div></div><div class="game-wrap"><div class="game-cell"><span class="games-label">GAMES</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div><div class="point-track"><span class="points-label">POINTS</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></section><section class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity-name"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div></div><div class="game-wrap"><div class="game-cell"><span class="games-label">GAMES</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div><div class="point-track"><span class="points-label">POINTS</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></section></div><footer class="baseline rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag">TABLE TENNIS</span></footer><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body></html>
