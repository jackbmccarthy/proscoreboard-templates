<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brace Register Volleyball — Duel</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { color: #f5eedb; font-family: Arial, Helvetica, sans-serif; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { width: 100%; max-width: 1080px; display: flex; flex-direction: column; background: transparent; }
.title { text-align: center; font-size: 42px; font-weight: 600; line-height: 1; letter-spacing: .3em; padding-left: .3em; margin-bottom: 22px; }
.match { display: flex; height: 500px; }
.brace-shell { flex: 0 0 110px; min-width: 0; display: flex; align-items: center; justify-content: center; color: #eee2ba; }
.brace { display: block; font-family: "Times New Roman", Georgia, serif; font-size: 550px; font-weight: 400; line-height: 1; transform: translateY(-24px) scaleX(.62); }
.duel { flex: 1 1 0; min-width: 0; display: flex; gap: 30px; }
.team { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; padding-top: 55px; }
.name-color { display: block; width: 100%; min-width: 0; background-color: #a6e3c5; background-clip: text; -webkit-background-clip: text; }
.name { display: block; width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: 62px; font-weight: 700; line-height: 1.2; color: transparent; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.score-block { display: flex; margin-top: 50px; }
.primary-track { display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: 0; }
.primary-score { display: block; width: calc(100% - 48px); height: 176px; font-family: "Arial Black", Verdana, "DejaVu Sans", Arial, sans-serif; font-size: 205px; font-weight: 900; line-height: 1; text-align: center; letter-spacing: -.07em; font-variant-numeric: tabular-nums; transform: scale(1.15, 1.45); transform-origin: center; }
.label { font-size: 38px; font-weight: 600; line-height: 1; letter-spacing: .05em; }
.points-label { margin-top: 90px; }
.register { display: flex; align-items: center; gap: 10px; flex: 0 0 114px; min-width: 0; margin-left: 4px; margin-top: 10px; align-self: flex-start; }
.register .label { font-size: 30px; }
.match-score { display: block; width: 26px; font-size: 30px; font-weight: 600; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.set-footer { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 38px; font-weight: 600; letter-spacing: .07em; line-height: 1; margin-top: 35px; }
.set-value { display: block; width: 37px; text-align: center; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 1120px) and (min-width: 601px) {
  .brace-shell { flex-basis: 80px; }
  .duel { gap: 20px; }
  .name { font-size: 52px; }
  .primary-score { font-size: clamp(100px, 17vw, 205px); }
  .register { flex-basis: 96px; gap: 5px; }
  .register .label, .match-score { font-size: 24px; }
  .label { font-size: 31px; }
}
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .title { font-size: 22px; letter-spacing: .16em; margin-bottom: 18px; }
  .match { height: 330px; }
  .brace-shell { flex-basis: 35px; }
  .brace { font-size: 330px; transform: translateY(-12px) scaleX(.4); }
  .duel { gap: 12px; }
  .team { padding-top: 30px; }
  .name { font-size: 29px; }
  .score-block { margin-top: 30px; }
  .primary-score { width: calc(100% - 12px); font-size: 68px; height: 90px; transform: scale(1.12, 1.45); }
  .label { font-size: 15px; }
  .points-label { margin-top: 50px; }
  .register { flex-basis: 40px; gap: 2px; margin-left: 4px; margin-top: 5px; }
  .register .label, .match-score { font-size: 11px; }
  .match-score { width: 11px; }
  .set-footer { font-size: 25px; gap: 8px; margin-top: 20px; }
  .set-value { width: 25px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="match rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="brace-shell" aria-hidden="true"><span class="brace">{</span></div><div class="duel rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="team columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="name-color jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="score-block rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="label points-label">POINTS</span></div><div class="register rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="label">SETS</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div></div>
        <div class="team columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="name-color jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="score-block rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="primary-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="label points-label">POINTS</span></div><div class="register rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="label">SETS</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div></div>
      </div><div class="brace-shell" aria-hidden="true"><span class="brace">}</span></div></div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
