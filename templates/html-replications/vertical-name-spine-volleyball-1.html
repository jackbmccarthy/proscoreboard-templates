<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertical Name Spine Volleyball — Rows</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #f8f5ee; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.board { --panel-height: 306px; --spine-width: 132px; width: 100%; max-width: 1266px; display: flex; flex-direction: column; background: transparent; }
.title { text-align: center; font-size: 82px; line-height: 1; font-weight: 700; margin-bottom: 26px; }
.teams { display: flex; flex-direction: column; gap: 32px; }
.team { display: flex; height: var(--panel-height); }
.spine { flex: 0 0 var(--spine-width); width: var(--spine-width); min-width: 0; height: var(--panel-height); display: flex; align-items: center; justify-content: center; overflow: hidden; background: #102a36; }
.name { display: block; flex: 0 0 calc(var(--panel-height) - 48px); width: calc(var(--panel-height) - 48px); height: 72px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: 60px; font-weight: 700; line-height: 72px; transform: rotate(-90deg); }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.score-pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f2eee6; color: #102a36; padding: 16px; }
.sets-band { display: flex; align-items: center; justify-content: center; gap: 13px; color: #b85c3a; font-size: 44px; font-weight: 700; line-height: 1; }
.match-score { display: block; width: 70px; text-align: left; font-variant-numeric: tabular-nums; }
.primary-score { display: block; width: 100%; height: 174px; margin-top: 8px; font-family: "Arial Black", Arial, sans-serif; font-size: 210px; font-weight: 900; line-height: .9; text-align: center; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
.points-label { display: block; text-align: center; margin-top: 13px; font-size: 44px; font-weight: 700; line-height: 1; }
.set-footer { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 32px; font-size: 48px; font-weight: 700; line-height: 1; }
.set-value { display: block; width: 54px; text-align: center; font-variant-numeric: tabular-nums; }
.point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-height: 800px) and (min-width: 701px) {
  .board { --panel-height: 245px; }
  .title { font-size: 60px; margin-bottom: 20px; }
  .teams { gap: 20px; }
  .name { height: 60px; line-height: 60px; font-size: 48px; }
  .score-pane { padding: 10px; }
  .sets-band { font-size: 30px; }
  .primary-score { font-size: 160px; height: 135px; margin-top: 4px; }
  .points-label { font-size: 32px; margin-top: 8px; }
  .set-footer { font-size: 36px; margin-top: 24px; }
}
@media (max-width: 700px) {
  .stage { padding: 14px; }
  .board { --panel-height: 200px; --spine-width: 60px; }
  .title { font-size: 30px; margin-bottom: 22px; }
  .teams { gap: 22px; }
  .name { flex-basis: calc(var(--panel-height) - 24px); width: calc(var(--panel-height) - 24px); height: 42px; line-height: 42px; font-size: 33px; }
  .score-pane { padding: 10px; }
  .sets-band { font-size: 23px; gap: 8px; }
  .match-score { width: 40px; }
  .primary-score { font-size: 136px; height: 115px; margin-top: 5px; }
  .points-label { font-size: 23px; margin-top: 7px; }
  .set-footer { font-size: 29px; margin-top: 25px; gap: 9px; }
  .set-value { width: 33px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title">VOLLEYBALL</header>
      <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="spine jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="score-pane columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sets-band rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span>SETS</span><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="points-label">POINTS</span></div></div>
        <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="spine jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="score-pane columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="sets-band rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span>SETS</span><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="points-label">POINTS</span></div></div>
      </div>
      <footer class="set-footer">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
