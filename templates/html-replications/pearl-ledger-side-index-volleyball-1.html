<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Pearl Ledger Side Index 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;width:min(96vw,1807px);max-width:100%;aspect-ratio:7;overflow:hidden;border:2px solid #a7b7b4;border-radius:9px;background:#e9eeeb;color:#24373c;container-type:inline-size}
.index{display:flex;align-items:center;justify-content:center;flex:0 0 18.5%;min-width:0;flex-direction:column;gap:24px;padding:0 24px;border-right:2px solid #a7b7b4}
.sport-tag{display:block;max-width:100%;overflow:hidden;font-size:clamp(16px,2.1cqw,42px);font-weight:800;line-height:1;text-overflow:ellipsis;white-space:nowrap}
.index-rule{display:block;width:100%;height:2px;background:#a7b7b4}
.status{display:flex;align-items:center;gap:.3em;font-size:clamp(16px,2.2cqw,39px);font-weight:800;line-height:1;white-space:nowrap}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.teams{display:flex;flex:1 1 0;min-width:0;flex-direction:column}
.team{display:flex;align-items:stretch;flex:1 1 0;min-height:0;min-width:0}
.team+.team{border-top:2px solid #a7b7b4}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;flex:0 0 20px;align-self:stretch;margin:18px 0 18px 24px;background:#2889e8}
.jerseyColorB{background:#f4655f}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;padding:0 38px;color:#24373c;font-size:clamp(31px,5.9cqw,75px);font-weight:700;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.sets,.points{display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0;gap:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sets{flex:0 0 10.5%}
.points{flex:0 0 19.5%}
.label{display:block;max-width:100%;overflow:hidden;font-size:clamp(13px,1.5cqw,27px);font-weight:750;line-height:1}
.set-score{display:block;max-width:100%;overflow:hidden;font-size:clamp(33px,4.3cqw,78px);font-weight:800;line-height:1;text-align:center}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(39px,4.8cqw,87px);font-weight:800;line-height:1;text-align:center}
.numeric-rule{display:block;flex:0 0 2px;align-self:stretch;margin:20px 0;background:#a7b7b4}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:6px}
 .board{width:100%;height:150px;aspect-ratio:auto;border-width:1px;border-radius:4px}
 .index{flex-basis:23%;gap:10px;padding:0 5px;border-width:1px}
 .sport-tag{font-size:clamp(9px,2.7cqw,12px)}
 .index-rule{height:1px}
 .status{font-size:clamp(10px,2.8cqw,14px)}
 .team+.team{border-width:1px}
 .identity{flex-basis:5px;margin:11px 0 11px 5px}
 .name{padding:0 6px;font-size:clamp(15px,5cqw,22px)}
 .sets{flex-basis:16%}
 .points{flex-basis:23%}
 .label{font-size:clamp(8px,2.4cqw,11px)}
 .set-score{font-size:clamp(21px,6cqw,28px)}
 .score{font-size:clamp(29px,8.5cqw,40px)}
 .numeric-rule{flex-basis:1px;margin:9px 0}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <aside class="index columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><span class="index-rule" data-osb-component="layout"></span><div class="status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></aside>
  <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div><div class="sets" data-osb-component="layout"><span class="label" data-osb-component="text">SETS</span><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="numeric-rule" data-osb-component="layout"></span><div class="points" data-osb-component="layout"><span class="label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div><div class="sets" data-osb-component="layout"><span class="label" data-osb-component="text">SETS</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><span class="numeric-rule" data-osb-component="layout"></span><div class="points" data-osb-component="layout"><span class="label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
