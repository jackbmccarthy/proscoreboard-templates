<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hinge Rail Volleyball — Stacked</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: #f4efdf; }
.stage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.board { --rail: #222d2e; --ivory: #f1e8d5; --copper: #b47a50; width: 100%; max-width: 1048px; display: flex; flex-direction: column; gap: 10px; }
.rail { background: var(--rail); border-radius: 5px; }
.title { display: flex; align-items: center; justify-content: center; min-height: 70px; font-size: 44px; font-weight: 700; letter-spacing: .22em; padding-left: .22em; }
.team { display: flex; align-items: stretch; min-height: 224px; padding: 21px 30px 23px 52px; }
.name { display: flex; align-items: center; flex: 1 1 auto; min-width: 0; font-size: 88px; font-weight: 700; letter-spacing: .06em; padding-right: 26px; border-right: 1px solid #53605e; }
.name > span { display: block; width: 100%; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.combinedAName:empty::before { content: "Team A"; }
.combinedBName:empty::before { content: "Team B"; }
.score-track { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px; flex: 0 0 240px; min-width: 0; }
.score-track + .score-track { border-left: 1px solid #53605e; }
.label { font-size: 26px; letter-spacing: .12em; font-weight: 700; line-height: 1; }
.module { position: relative; display: flex; align-items: center; width: 156px; height: 140px; border-radius: 8px; background: var(--ivory); color: #080b0b; }
.module::before, .module::after { content: ""; position: absolute; z-index: 2; width: 11px; height: 29px; top: calc(50% - 14px); background: var(--copper); border: 1px solid #755034; }
.module::before { left: -6px; }
.module::after { right: -6px; }
.value { display: block; width: 100%; text-align: center; font-family: Menlo, Consolas, "Liberation Mono", "Courier New", monospace; font-feature-settings: "zero" 1; font-variant-numeric: tabular-nums slashed-zero; font-weight: 900; font-size: 104px; line-height: 1; letter-spacing: -.07em; padding-right: .07em; }
.seam { position: absolute; z-index: 1; height: 1px; background: #72736b; width: 100%; top: 50%; pointer-events: none; }
.set-rail { min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 24px; font-size: 36px; font-weight: 700; letter-spacing: .16em; }
.set-value { width: 52px; text-align: center; font-family: "Liberation Mono", "Courier New", monospace; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.runtime-reserve, .point-slot { display: none; }
.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
@media (max-width: 1100px) {
  .name { font-size: clamp(28px, 7vw, 80px); }
  .team { padding-left: 32px; }
  .score-track { flex-basis: 22%; }
  .module { width: 76%; }
  .value { font-size: clamp(44px, 8.5vw, 92px); }
}
@media (max-width: 600px) {
  .stage { padding: 14px; }
  .board { gap: 7px; }
  .title { min-height: 45px; font-size: 23px; letter-spacing: .17em; }
  .team { min-height: 120px; padding: 14px 13px 14px 16px; }
  .name { font-size: 26px; letter-spacing: .02em; padding-right: 10px; }
  .score-track { flex-basis: 25%; gap: 10px; }
  .label { font-size: 12px; letter-spacing: .07em; }
  .module { width: 75%; height: 67px; border-radius: 4px; }
  .value { font-size: 35px; }
  .module::before, .module::after { width: 6px; height: 16px; top: calc(50% - 8px); }
  .module::before { left: -3px; }
  .module::after { right: -3px; }
  .set-rail { min-height: 43px; font-size: 23px; gap: 10px; }
  .set-value { width: 32px; }
}
  </style>
</head>
<body>
  <main class="stage">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="title rail">VOLLEYBALL</header>
      <div class="team rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="name"><span class="combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span></div>
        <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">SETS</span><div class="module"><span class="value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><i class="seam" aria-hidden="true"></i></div></div>
        <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">POINTS</span><div class="module"><span class="value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><i class="seam" aria-hidden="true"></i></div></div>
      </div>
      <div class="team rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <div class="name"><span class="combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span></div>
        <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">SETS</span><div class="module"><span class="value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><i class="seam" aria-hidden="true"></i></div></div>
        <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="label">POINTS</span><div class="module"><span class="value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><i class="seam" aria-hidden="true"></i></div></div>
      </div>
      <footer class="set-rail rail">SET <span class="set-value" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="runtime-reserve"><span class="jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></div>
      <div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
