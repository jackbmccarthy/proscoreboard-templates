<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Maroon Frost Matchline 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(96vw,1812px);max-width:100%;aspect-ratio:7.22;overflow:hidden;border-radius:5px;background:#e9edef;color:#26343b;container-type:inline-size}
.matchline{display:flex;align-items:center;justify-content:space-between;flex:0 0 28%;min-width:0;padding:0 27px;background:#572f3c;color:#f8f6f2}
.sport-tag{display:block;min-width:0;overflow:hidden;font-size:clamp(19px,2.5cqw,46px);font-weight:800;letter-spacing:.06em;line-height:1;text-overflow:ellipsis;white-space:nowrap}
.status{display:flex;align-items:center;align-self:stretch;gap:.35em;padding-left:37px;border-left:2px solid #bec8cb;font-size:clamp(17px,2.1cqw,39px);font-weight:800;line-height:1;white-space:nowrap}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.pair{display:flex;flex:1 1 0;min-width:0;min-height:0}
.side{display:flex;align-items:stretch;flex:1 1 0;min-width:0}
.side+.side{border-left:2px solid #bec8cb}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;flex:0 0 15px;align-self:stretch;background:#298bec}
.jerseyColorB{background:#f0505b}
.name-stack{display:flex;flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:2px;padding:0 40px}
.name{display:block;min-width:0;overflow:hidden;color:#26343b;font-size:clamp(30px,4.2cqw,78px);font-weight:700;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.sets-line{display:flex;align-items:center;gap:.4em;color:#26343b;font-size:clamp(18px,2.5cqw,45px);font-weight:750;line-height:1;white-space:nowrap}
.set-score{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.scorecap{display:flex;align-items:center;justify-content:center;flex:0 0 25%;min-width:0;flex-direction:column;gap:2px;background:#572f3c;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(52px,5.7cqw,105px);font-weight:800;line-height:1;text-align:center}
.points-label{display:block;max-width:100%;overflow:hidden;font-size:clamp(14px,1.6cqw,29px);font-weight:750;line-height:1}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){
 .stage{padding:6px}
 .board{width:100%;height:130px;aspect-ratio:auto;border-radius:2px}
 .matchline{flex-basis:22%;padding:0 8px}
 .sport-tag{font-size:clamp(10px,2.8cqw,14px)}
 .status{padding-left:8px;border-width:1px;font-size:clamp(10px,2.8cqw,14px)}
 .side+.side{border-width:1px}
 .identity{flex-basis:5px}
 .name-stack{gap:2px;padding:0 6px}
 .name{font-size:clamp(13px,3.8cqw,18px)}
 .sets-line{font-size:clamp(9px,2.7cqw,13px)}
 .scorecap{flex-basis:28%;gap:1px}
 .score{font-size:clamp(25px,7cqw,33px)}
 .points-label{font-size:clamp(8px,2.2cqw,11px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Horizontal volleyball scoreboard with generic manual scoring">
  <div class="matchline rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
  <div class="pair rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
   <div class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-stack" data-osb-component="layout"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="sets-line" data-osb-component="layout"><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span data-osb-component="text">SETS</span></div></div></div><div class="scorecap" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="points-label" data-osb-component="text">POINTS</span></div></div>
   <div class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-stack" data-osb-component="layout"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="sets-line" data-osb-component="layout"><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span data-osb-component="text">SETS</span></div></div></div><div class="scorecap" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="points-label" data-osb-component="text">POINTS</span></div></div>
  </div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
