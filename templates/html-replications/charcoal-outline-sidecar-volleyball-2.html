<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Charcoal Outline Sidecar 2</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.shell{position:relative;width:min(95vw,1690px);max-width:100%;padding-top:32px;container-type:inline-size}
.sport-tag{position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;width:261px;max-width:42%;height:32px;background:#dce3e2;color:#20272c;font-size:25px;font-weight:800;line-height:1;white-space:nowrap}
.board{display:flex;width:100%;height:max(108px,8.7cqw);overflow:hidden;background:#20272c;color:#f2f3ee;border-radius:2px}
.team{display:flex;align-items:center;flex:1 1 0;min-width:0}
.team+.team{border-left:2px solid #a8b8bc}
.identity{display:block;flex:0 0 2.2%;height:100%;background:#0e87eb}
.jerseyColorB{background:#f22e39}
.name{display:block;align-content:center;flex:1 1 0;min-width:0;overflow:hidden;padding:0 4%;font-size:4.3cqw;font-weight:700;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.score-track{display:flex;align-items:center;justify-content:center;flex:0 0 29%;flex-direction:column;height:97%;min-width:0;margin-right:2%;border:1px solid #a8b8bc;background:#20272c}
.score-label{font-size:1.4cqw;font-weight:700;line-height:1;white-space:nowrap;color:#dce3e2}
.score{display:block;color:#fff;font-size:5.3cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.dock{display:flex;align-items:center;justify-content:center;flex:0 0 19.5%;gap:0;min-width:0;padding:1.1%;background:#dce3e2;color:#20272c}
.sets{display:flex;flex:1 1 0;flex-direction:column;min-width:0}
.sets-heading{font-size:1.6cqw;font-weight:800;line-height:1;white-space:nowrap}
.sets-values{display:flex;align-items:center;justify-content:center;flex:1 1 0;min-width:0}
.set-won{display:flex;align-items:center;flex:1 1 0;flex-direction:column;min-width:0;padding:0 1%;border-right:1px solid #7e958f}
.set-score{font-size:3.5cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.set-side{font-size:1.1cqw;font-weight:700;line-height:1.1;white-space:nowrap}
.current-set{display:flex;align-items:center;justify-content:center;flex:0 0 31%;flex-direction:column;gap:.4cqw;min-width:0}
.current-set-label{font-size:1.6cqw;font-weight:800;line-height:1}
.current-set-value{font-size:3.5cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:8px}
 .shell{width:100%;padding-top:24px}
 .sport-tag{width:143px;height:24px;font-size:14px}
 .board{height:auto;flex-wrap:wrap}
 .team{flex:1 1 50%;height:108px}
 .team+.team{border-left-width:1px}
 .identity{flex-basis:4px}
 .name{padding:0 3px;font-size:clamp(11px,3.8cqw,16px)}
 .score-track{flex-basis:31%;height:78%;margin-right:3px}
 .score-label{font-size:8px}
 .score{font-size:clamp(20px,6cqw,26px)}
 .dock{flex:0 0 100%;height:52px;padding:4px 12px;border-top:1px solid #7e958f}
 .sets-heading,.current-set-label{font-size:11px}
 .set-score,.current-set-value{font-size:23px}
 .set-side{font-size:9px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <div class="shell">
  <span class="sport-tag" data-osb-component="text">VOLLEYBALL</span>
  <article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Volleyball scoreboard">
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
    <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
    <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
    <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score-label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
   </div>
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
    <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
    <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
    <div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score-label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
   </div>
   <aside class="dock rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Sets won and editable current set">
    <div class="sets columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
     <span class="sets-heading" data-osb-component="text">SETS</span>
     <div class="sets-values rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <div class="set-won columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="set-side" data-osb-component="text">Team A</span></div>
      <div class="set-won columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="set-side" data-osb-component="text">Team B</span></div>
     </div>
    </div>
    <div class="current-set columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="current-set-label" data-osb-component="text">SET</span><span class="current-set-value" data-osb-component="text" data-osb-static="true" data-sport-stat="set">0</span></div>
   </aside>
   <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
  </article>
 </div>
</main>
</body>
</html>
