<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volleyball Spike Slash</title>
<style>
*{box-sizing:border-box}html{font-size:calc(100vw / 128)}html,body{margin:0;background:transparent}
body{min-height:100vh;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.rowContainer{display:flex;flex-direction:row}.columnContainer{display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
img.logo:not([src]),img.logo[src=""]{display:none}
.pt-slot{position:relative;display:block}.pt-slot>.pt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.pt-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint,.pt-slot:has(> .isMatchPoint[style*="opacity:1"]) > .isGamePoint{opacity:0!important}
.pt-slot .isMatchPoint{animation:osbPulse 1.8s ease-in-out infinite}
@keyframes osbPulse{50%{filter:brightness(1.3)}}
@media (prefers-reduced-motion: reduce) {
.pt-slot .isGamePoint,.pt-slot .isMatchPoint{animation:none!important;transition:none!important}
}
.pips{display:inline-flex;gap:.35rem;align-items:center}.pip{position:relative;display:block;width:.7rem;height:.7rem;border-radius:50%;background:currentColor}
.pip-used{position:absolute;inset:-1px;border-radius:50%;background:var(--pip-off,#0009)}
.to-left:empty{display:none}
.isACurrentlyServing,.isBCurrentlyServing{transition:opacity .2s}
.dbl-probe{display:none}
.vball{display:block;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9 0 18%,transparent 40%),conic-gradient(from 20deg,#ffd23f 0 120deg,#1d4fbf 0 240deg,#f4f6fb 0);box-shadow:inset 0 0 0 .12rem #0005}
.pball{display:block;border-radius:50%;background:radial-gradient(circle at 30% 32%,#0003 0 9%,transparent 10%),radial-gradient(circle at 66% 30%,#0003 0 9%,transparent 10%),radial-gradient(circle at 50% 62%,#0003 0 9%,transparent 10%),radial-gradient(circle at 24% 70%,#0002 0 7%,transparent 8%),radial-gradient(circle at 78% 70%,#0002 0 7%,transparent 8%),radial-gradient(circle at 38% 30%,#fbffb0,#d4f02b 60%,#a9c414)}
.sn{position:relative;display:inline-grid}.sn>i,.cn>i{grid-area:1/1;font-style:normal}
.sn:has(> .isSecondServer[style*="opacity: 1"]) > .one,.sn:has(> .isSecondServer[style*="opacity:1"]) > .one{opacity:0}
.cn{position:relative;display:inline-grid}.cn:has(> .isSecondServer[style*="opacity: 1"]) > .one,.cn:has(> .isSecondServer[style*="opacity:1"]) > .one{opacity:0}
.call{display:inline-flex;align-items:baseline}.call>i{font-style:normal}.call .ca{order:1}.call .cd1{order:2}.call .cb{order:3}.call .cd2{order:4}.call .cn{order:5}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .ca,.board:has(.isBCurrentlyServing[style*="opacity:1"]) .call .ca{order:3}
.board:has(.isBCurrentlyServing[style*="opacity: 1"]) .call .cb,.board:has(.isBCurrentlyServing[style*="opacity:1"]) .call .cb{order:1}
.board:has(.playerA2:empty) .sn,.board:has(.playerA2:empty) .cn,.board:has(.playerA2:empty) .cd2{display:none}
.gstack{display:inline-grid}.gstack>.gs{grid-area:1/1;white-space:nowrap}.gstack>.gs:has(~ .gs[style*="opacity: 1"]),.gstack>.gs:has(~ .gs[style*="opacity:1"]){visibility:hidden}
.tie{display:none}
.cards{display:inline-flex;gap:.25rem}.card{display:block;width:.8rem;height:1.1rem;border-radius:.15rem;box-shadow:0 0 0 1px #0003}.yc{background:#ffd200}.rc{background:#e3262f}
.live{display:inline-flex;align-items:center;gap:.35rem}.live::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:#ff3b30}
.stage{position:fixed;left:50%;bottom:4rem;transform:translateX(-50%)}
.board{position:relative;width:82rem;color:#fff;font-family:Impact,"Arial Narrow",sans-serif;letter-spacing:.02em;filter:drop-shadow(0 .4rem 1rem #000a)}
.lane{height:5.4rem;align-items:stretch;gap:.5rem}
.blade{flex:1;min-width:0;align-items:center;gap:1rem;padding:0 3rem 0 2rem;background:#0d0d12;clip-path:polygon(0 0,100% 0,calc(100% - 2.4rem) 100%,0 100%)}
.blade.b{padding:0 2rem 0 3rem;flex-direction:row-reverse;clip-path:polygon(2.4rem 0,100% 0,100% 100%,0 100%)}
.chip{width:2.2rem;align-self:stretch;margin-left:-2rem;background:#3d7bff;clip-path:polygon(0 0,100% 0,40% 100%,0 100%)}
.blade.b .chip{margin:0 -2rem 0 0;background:#ff2e88;clip-path:polygon(60% 0,100% 0,100% 100%,0 100%)}
.nm{flex:1;min-width:0;font-size:2.8rem;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.blade.b .nm{text-align:right}
.vball{width:2rem;height:2rem}
.pips{color:#ff2e88;--pip-off:#0d0d12e0}
.won{display:flex;align-items:center;justify-content:center;width:3.2rem;height:3.2rem;transform:rotate(45deg);background:#ff2e88;font-size:1.8rem}
.pts{width:8rem;display:flex;align-items:center;justify-content:center;background:#fff;color:#0d0d12;font-size:4.4rem;clip-path:polygon(1.4rem 0,100% 0,calc(100% - 1.4rem) 100%,0 100%)}
.mid{width:9rem;align-items:center;justify-content:center;background:#3b3b4f;clip-path:polygon(1.4rem 0,100% 0,calc(100% - 1.4rem) 100%,0 100%);font-size:1.1rem}
.mid .setno{font-size:2.6rem;line-height:1;color:#ff2e88}
.under{justify-content:center;align-items:center;gap:.5rem;margin-top:.4rem;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:1.15rem}
.hcol{display:flex;gap:.3rem;padding:.25rem .8rem;background:#0d0d12;clip-path:polygon(.5rem 0,100% 0,calc(100% - .5rem) 100%,0 100%)}.hh{color:#ff2e88}.ha::after{content:"-";margin-left:.3rem}
.hcol:is([style*="opacity: 1"],[style*="opacity:1"]):has(+ :not([style*="opacity: 1"]):not([style*="opacity:1"])),.hcol.hlast:is([style*="opacity: 1"],[style*="opacity:1"]){background:#ff2e88}.hcol:is([style*="opacity: 1"],[style*="opacity:1"]):has(+ :not([style*="opacity: 1"]):not([style*="opacity:1"])) .hh,.hcol.hlast:is([style*="opacity: 1"],[style*="opacity:1"]) .hh{color:inherit;opacity:.7}
.pt-slot{width:12rem;height:2rem}.pt{background:#ff2e88;clip-path:polygon(.6rem 0,100% 0,calc(100% - .6rem) 100%,0 100%)}
.dec{padding:.25rem .8rem;background:#fff;color:#0d0d12}
.to-left{font-size:1rem;color:#b9b9cc;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif}
.won{transform:none;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);width:3.6rem;height:3.6rem}
.tolive{position:absolute;left:0;right:0;bottom:100%;margin-bottom:.5rem;display:flex;justify-content:space-between;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:700}.to-live{gap:.5rem;padding:.4rem 1rem;background:#ff2e88;font-size:1.3rem}
</style>
</head>
<body>
<main class="stage"><section class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="blade a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></i><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="to-left num timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span><span class="pips"><i class="pip"></i><i class="pip"><span class="pip-used isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0"></span></i></span><span class="srv isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" isA="true" style="opacity:0"><i class="vball"></i></span><span class="won num currentAMatchScore setsWonA" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><span class="pts num currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><div class="mid columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span>SET</span><span class="setno num" data-osb-static="true" data-sport-stat="set">0</span></div><span class="pts num currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><div class="blade b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><i class="chip jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></i><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="to-left num timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span><span class="pips"><i class="pip"></i><i class="pip"><span class="pip-used isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none;opacity:0"></span></i></span><span class="srv isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity:0"><i class="vball"></i></span><span class="won num currentBMatchScore setsWonB" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
<footer class="under rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="hcol isGame1Started" data-osb-component="field" data-osb-field="isGame1Started" style="display:none;opacity:0"><b class="hh">S1</b><span class="ha num game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span><span class="hb num game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span><span class="hcol isGame2Started" data-osb-component="field" data-osb-field="isGame2Started" style="display:none;opacity:0"><b class="hh">S2</b><span class="ha num game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span><span class="hb num game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span><span class="hcol isGame3Started" data-osb-component="field" data-osb-field="isGame3Started" style="display:none;opacity:0"><b class="hh">S3</b><span class="ha num game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span><span class="hb num game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span><span class="hcol isGame4Started" data-osb-component="field" data-osb-field="isGame4Started" style="display:none;opacity:0"><b class="hh">S4</b><span class="ha num game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span><span class="hb num game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span><span class="hcol hlast isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display:none;opacity:0"><b class="hh">S5</b><span class="ha num game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span><span class="hb num game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span><span class="pt-slot"><span class="pt isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">SET POINT</span><span class="pt isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><span class="dec isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display:none;opacity:0">DECIDING SET</span></footer>
<div class="tolive"><span class="to-live isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0">TIMEOUT <span class="to-clock num timeOutTimerA" data-osb-component="field" data-osb-field="timeOutTimerA">0</span></span><span class="to-live isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0">TIMEOUT <span class="to-clock num timeOutTimerB" data-osb-component="field" data-osb-field="timeOutTimerB">0</span></span></div></section></main>
</body>
</html>
