<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Cedar Ivory Namefoot 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
.board{display:flex;flex-direction:column;width:min(94vw,1278px);max-width:100%;aspect-ratio:3.73;overflow:hidden;border-radius:6px;background:#253b37;color:#f3f0e8;container-type:inline-size}
.teams{display:flex;flex:1 1 0;min-height:0;flex-direction:column}
.team{display:flex;align-items:stretch;flex:1 1 0;min-height:0;min-width:0}
.team+.team{border-top:2px solid #627973}
.name-lane{display:flex;align-items:center;flex:1 1 0;min-width:0}
.identity{display:block;align-self:stretch;flex:0 0 19px;margin:20px 0 20px 20px;background:#5799ee}
.jerseyColorB{background:#ef706b}
.name-stack{display:flex;flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:3px;padding:0 34px}
.name{display:block;min-width:0;overflow:hidden;color:#f3f0e8;font-size:clamp(26px,4.7cqw,62px);font-weight:700;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.sets-line{display:flex;align-items:center;gap:.4em;color:#b8c7c0;font-size:clamp(15px,2.1cqw,28px);font-weight:750;line-height:1;white-space:nowrap}
.set-score{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.scorecap{display:flex;align-items:center;justify-content:center;flex:0 0 13.1%;min-width:0;flex-direction:column;gap:4px;background:#f3f0e8;color:#253b37;font-variant-numeric:tabular-nums;white-space:nowrap}
.points-label{display:block;max-width:100%;overflow:hidden;font-size:clamp(14px,1.7cqw,23px);font-weight:800;letter-spacing:.06em;line-height:1}
.score{display:block;max-width:100%;overflow:hidden;font-size:clamp(42px,6.5cqw,83px);font-weight:800;line-height:1;text-align:center}
.utility{display:flex;align-items:center;justify-content:space-between;flex:0 0 21%;min-width:0;padding:0 35px;border-top:2px solid #627973;color:#f3f0e8;font-size:clamp(18px,2.7cqw,35px);font-weight:750;letter-spacing:.04em;line-height:1;white-space:nowrap}
.sport-tag{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-status{display:flex;align-items:center;gap:.3em}
.current-set{display:inline-block;min-width:1ch;max-width:4ch;overflow:hidden;font-variant-numeric:tabular-nums;text-align:center}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:650px){
 .stage{padding:7px}
 .board{width:100%;height:159px;aspect-ratio:auto;border-radius:3px}
 .team+.team,.utility{border-width:1px}
 .identity{flex-basis:5px;margin:10px 0 10px 6px}
 .name-stack{gap:2px;padding:0 8px}
 .name{font-size:clamp(17px,5cqw,23px)}
 .sets-line{font-size:clamp(9px,2.8cqw,13px)}
 .scorecap{flex-basis:20%;gap:2px}
 .points-label{font-size:clamp(8px,2.4cqw,12px)}
 .score{font-size:clamp(26px,8.5cqw,38px)}
 .utility{padding:0 9px;font-size:clamp(11px,3cqw,15px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard with generic manual scoring">
  <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-stack" data-osb-component="layout"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="sets-line" data-osb-component="layout"><span data-osb-component="text">SETS</span><span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div></div><div class="scorecap" data-osb-component="layout"><span class="points-label" data-osb-component="text">POINTS</span><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></div>
   <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="name-lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-stack" data-osb-component="layout"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="sets-line" data-osb-component="layout"><span data-osb-component="text">SETS</span><span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div></div><div class="scorecap" data-osb-component="layout"><span class="points-label" data-osb-component="text">POINTS</span><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></div>
  </div>
  <div class="utility rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">VOLLEYBALL</span><div class="set-status" data-osb-component="layout"><span data-osb-component="text">SET</span><span class="current-set" data-osb-component="text" data-osb-static="true" data-sport-stat="current-set">0</span></div></div>
 </article>
 <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
</main>
</body>
</html>
