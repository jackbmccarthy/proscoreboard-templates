<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Violet Ash Open Register horizontal</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#28323d}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(98vw,1920px);max-width:100%;min-width:0;overflow:hidden;border:1px solid #b4bfc4;border-radius:4px;background:#e7e8ec;container-type:inline-size}

.sport-tag{display:block;flex:none;color:#28323d;font-size:1.9cqw;font-weight:800;line-height:1;white-space:nowrap}
.stats{display:flex;align-items:center;justify-content:flex-end;min-width:0}
.stat{display:flex;align-items:baseline;gap:.5cqw;min-width:0;padding:0 1.7cqw;color:#28323d;font-size:1.5cqw;font-weight:700;line-height:1;white-space:nowrap}
.stat+.stat{border-left:1px solid #b4bfc4}.stat strong{font-variant-numeric:tabular-nums}
.competitors{display:flex;align-items:stretch;min-width:0}
.competitor{display:flex;align-items:stretch;flex:1 1 50%;min-width:0;height:8.2cqw;background:#e7e8ec}
.competitor+.competitor{border-left:1px solid #b4bfc4}
.identity{display:block;align-self:center;flex:none;width:.8cqw;height:66%;margin:0 1.3cqw;background:#2677e1;border-radius:4px}
.jerseyColorB{background:#fa5b63}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .7cqw;color:#28323d;font-size:3.6cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.register{display:flex;flex-direction:column;justify-content:center;flex:0 0 27.5%;min-width:0;padding:0 .6cqw;background:#e7e8ec}
.support-line,.primary-line{display:flex;align-items:baseline;justify-content:space-between;gap:.7cqw;min-width:0;color:#28323d;white-space:nowrap}
.support-line{font-size:1.55cqw;font-weight:700;line-height:1}
.support-line strong{font-size:1.8cqw;font-variant-numeric:tabular-nums}
.primary-line{margin-top:.6cqw}
.primary-label{display:block;color:#28323d;font-size:1.3cqw;font-weight:700;line-height:1}
.score{display:block;max-width:68%;overflow:hidden;color:#28323d;font-size:4.9cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%;border-radius:3px}.header{height:48px;padding:0 6px;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}.sport-tag{font-size:10px}.stats{justify-content:space-between}.stat{font-size:9px;gap:2px;padding:0 3px}.stat+.stat{border-left-width:1px}.competitor{height:76px}.identity{width:3px;height:70%;margin:0 4px}.name{font-size:clamp(15px,4vw,21px);padding:0 2px}.register{flex-basis:31%;padding:0 2px}.support-line{font-size:8px;gap:2px}.support-line strong{font-size:9px}.primary-line{flex-direction:column;align-items:center;gap:2px;margin-top:4px}.primary-label{font-size:8px}.score{max-width:100%;font-size:clamp(20px,5.5vw,27px);text-align:center}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Baseball scoreboard">
<div class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">BASEBALL</span><div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static baseball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="register columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="support-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">HITS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong></div><div class="primary-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="primary-label" data-osb-component="text">RUNS</span><strong class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong></div></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="register columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="support-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">HITS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong></div><div class="primary-line rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="primary-label" data-osb-component="text">RUNS</span><strong class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong></div></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
