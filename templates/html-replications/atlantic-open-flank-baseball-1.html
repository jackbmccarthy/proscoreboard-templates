<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball — Atlantic Open Flank compact</title><style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#f6f8f5}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.board{display:flex;flex-direction:column;width:min(71vw,1400px);max-width:100%;min-width:0;overflow:hidden;border:1px solid #5c7379;border-radius:3px;background:#21343c;container-type:inline-size}
.competitors{display:flex;flex-direction:column;min-width:0}
.competitor{display:flex;align-items:stretch;min-width:0;height:11.1cqw;background:#21343c}
.competitor+.competitor{border-top:1px solid #5c7379}
.identity{display:block;align-self:stretch;flex:none;width:1.65%;background:#2678e4}
.jerseyColorB{background:#f46863}
.hits-track,.score-track{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;min-width:0;background:#21343c}
.hits-track{width:13%;color:#a5c5c3}
.hits-label{display:block;color:#a5c5c3;font-size:2cqw;font-weight:700;line-height:1;white-space:nowrap}
.hit-value{display:block;max-width:100%;overflow:hidden;color:#a5c5c3;font-size:4.7cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.name{display:block;align-content:center;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2.3cqw;color:#f6f8f5;font-size:6.1cqw;font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}.combinedBName:empty::before{content:"Team B"}
.score-track{width:17%;color:#f6f8f5}
.score-label{display:block;color:#f6f8f5;font-size:2cqw;font-weight:700;line-height:1;white-space:nowrap}
.score{display:block;max-width:100%;overflow:hidden;color:#f6f8f5;font-size:7.1cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.baseline{display:flex;align-items:center;min-width:0;height:5.3cqw;border-top:1px solid #5c7379;background:#21343c}
.sport-tag{display:block;flex:1 1 auto;min-width:0;padding:0 1.7cqw;color:#f6f8f5;font-size:2.5cqw;font-weight:800;line-height:1;white-space:nowrap}
.stats{display:flex;align-items:center;justify-content:flex-end;flex:none;min-width:0}
.stat{display:flex;align-items:baseline;gap:.5cqw;min-width:0;padding:0 1.3cqw;color:#c5d1d0;font-size:1.9cqw;font-weight:700;line-height:1;white-space:nowrap}
.stat:first-child,.stat+.stat{border-left:1px solid #5c7379}.stat strong{font-variant-numeric:tabular-nums}
.retained,.point-slot{display:none}.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:700px){.board{width:100%}.competitor{height:76px}.identity{width:4px}.hits-track{width:18%}.hits-label{font-size:9px}.hit-value{font-size:20px}.name{font-size:clamp(19px,5.3vw,27px);padding:0 7px}.score-track{width:25%}.score-label{font-size:9px}.score{font-size:clamp(27px,7.5vw,36px)}.baseline{height:48px;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}.sport-tag{flex:none;padding:0 6px;font-size:11px}.stats{justify-content:space-between}.stat{font-size:9px;gap:2px;padding:0 4px}.stat:first-child{border-left:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" data-osb-component="layout"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Baseball scoreboard">
<div class="competitors columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="hits-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="hits-label" data-osb-component="text">HITS</span><strong class="hit-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsA">0</strong></div><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score-label" data-osb-component="text">RUNS</span><strong class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</strong></div><span class="retained currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div>
<div class="competitor rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="hits-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="hits-label" data-osb-component="text">HITS</span><strong class="hit-value" data-osb-component="text" data-osb-static="true" data-sport-stat="hitsB">0</strong></div><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="score-track columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="score-label" data-osb-component="text">RUNS</span><strong class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</strong></div><span class="retained currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
<div class="baseline rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag" data-osb-component="text">BASEBALL</span><div class="stats rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Editable static baseball counters"><span class="stat" data-osb-component="layout"><span data-osb-component="text">INNING</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="inning">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">BALLS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="balls">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">STRIKES</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="strikes">0</strong></span><span class="stat" data-osb-component="layout"><span data-osb-component="text">OUTS</span><strong data-osb-component="text" data-osb-static="true" data-sport-stat="outs">0</strong></span></div></div>
<div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div></article></main></body></html>
