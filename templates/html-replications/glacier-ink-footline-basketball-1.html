<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glacier Ink Footline — Basketball 1</title><style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#253c49}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.board{width:min(94vw,760px);container-type:inline-size;overflow:hidden;border-radius:6px;background:#e2eaeb}
.lanes{display:flex;flex-direction:column}
.lane{display:grid;grid-template-columns:2.4% minmax(0,1fr) 16% 18%;height:91px;min-width:0;background:#e2eaeb}
.lane+.lane{border-top:1px solid #a8b9bf}
.tick{display:block;background:#2b88a9}
.jerseyColorB.tick{background:#c66d68}
.name{display:flex;align-items:center;min-width:0;padding:0 4%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:clamp(26px,4.1cqw,39px);font-weight:700;line-height:1.05}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.support-track,.primary-track{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;line-height:1}
.support-track{position:relative;background:#e2eaeb;color:#253c49}
.support-track::before{content:"";position:absolute;left:0;top:17%;bottom:17%;width:1px;background:#526c76}
.support-value{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.support-caption{margin-top:3px;font-size:11px;font-weight:700;letter-spacing:.02em}
.primary-track{background:#253c49;color:#f7faf9}
.primary-value{display:block;max-width:100%;font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.045em}
.primary-caption{margin-top:1px;font-size:12px;font-weight:700;letter-spacing:.015em;white-space:nowrap}
.footline{display:flex;align-items:center;min-height:56px;padding:0 3%;background:#253c49;color:#f7faf9;gap:0}
.sport-tag{flex:none;padding-right:25px;font-size:18px;font-weight:700;white-space:nowrap}
.status{display:flex;align-items:center;min-width:0}
.stat{display:flex;align-items:baseline;gap:7px;padding:0 20px;border-left:1px solid #a8b9bf;white-space:nowrap}
.stat-label{font-size:12px;font-weight:700;color:#a8b9bf}
.stat-value{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.runtime-retained{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
@media(max-width:720px){.board{width:min(94vw,520px)}.lanes{display:flex;flex-direction:column}.lane{height:70px;grid-template-columns:2.4% minmax(0,1fr) 17% 23%}.lane+.lane{border-left:0;border-top:1px solid #a8b9bf}.name{font-size:clamp(22px,6vw,29px)}.support-value{font-size:26px}.primary-value{font-size:39px}.primary-caption{font-size:10px}.support-caption{font-size:10px}.footline{min-height:47px;padding:7px 4%;flex-wrap:wrap;row-gap:6px}.sport-tag{font-size:15px;padding-right:12px}.stat{padding:0 9px;gap:4px}.stat-label{font-size:10px}.stat-value{font-size:14px}}
@media(max-width:420px){.sport-tag{width:100%;padding:0}.status{width:100%}.stat:first-child{border-left:0;padding-left:0}.stat{padding:0 9px}.footline{padding:8px 4%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Basketball scoreboard"><div class="lanes columnContainer" data-osb-component="layout"><div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><div class="support-track" data-osb-component="layout"><span class="support-value" data-osb-component="text" data-osb-static="true" data-sport-stat="fouls-a">0</span><span class="support-caption" data-osb-component="text">FOULS</span></div><div class="primary-track" data-osb-component="layout"><span class="primary-value currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption" data-osb-component="text">POINTS</span></div></div><div class="lane rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><div class="support-track" data-osb-component="layout"><span class="support-value" data-osb-component="text" data-osb-static="true" data-sport-stat="fouls-b">0</span><span class="support-caption" data-osb-component="text">FOULS</span></div><div class="primary-track" data-osb-component="layout"><span class="primary-value currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption" data-osb-component="text">POINTS</span></div></div></div><footer class="footline rowContainer" data-osb-component="layout"><span class="sport-tag" data-osb-component="text">BASKETBALL</span><div class="status rowContainer" data-osb-component="layout"><div class="stat"><span class="stat-label" data-osb-component="text">CLOCK</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="game-clock">00:00</span></div><div class="stat"><span class="stat-label" data-osb-component="text">PERIOD</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="period">0</span></div><div class="stat"><span class="stat-label" data-osb-component="text">SHOT</span><span class="stat-value" data-osb-component="text" data-osb-static="true" data-sport-stat="shot-clock">00</span></div></div></footer><div class="runtime-retained" aria-hidden="true"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">Game point</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">Match point</span></div></div></article></main></body></html>
