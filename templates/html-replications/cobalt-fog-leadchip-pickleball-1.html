<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PICKLEBALL · Cobalt Fog Leadchip</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f7faf9}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent}
.board{--board-width:54vw;--board-max:1092px;width:min(var(--board-width),var(--board-max));min-width:0;container-type:inline-size;border:1px solid #506c75;border-radius:4px;background:#23394b;overflow:hidden}
.header{height:6.2cqw;min-height:30px;display:flex;align-items:center;gap:2cqw;padding:0 2cqw;background:#23394b;border-bottom:1px solid #506c75;position:relative}
.sport-tag{font-size:2.9cqw;font-weight:700;letter-spacing:.025em;line-height:1;white-space:nowrap}
.status{margin-left:auto;display:flex;align-items:center;gap:1.5cqw;color:#c9d7d7;font-size:1.15cqw;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.status b{color:#f7faf9;font-size:1.18em;font-variant-numeric:tabular-nums}
.point-slot{position:absolute;right:2cqw;top:50%;transform:translateY(-50%);min-width:14cqw;height:1.8em;text-align:right;pointer-events:none}
.point-state{position:absolute;inset:0;color:#f7faf9;font-size:1.2cqw;font-weight:700;line-height:1.8em;white-space:nowrap;background:#23394b}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{height:9.8cqw;min-height:64px;display:flex;align-items:center;min-width:0;flex:0 0 auto;background:#23394b}
.lane+.lane{border-top:1px solid #506c75}
.identity{align-self:stretch;display:block;flex:0 0 2.3cqw;min-width:5px;background:#3186a8}
.jerseyColorB{background:#c76c69}
.support-track{flex:0 0 10.8cqw;min-width:0;height:8.3cqw;min-height:50px;margin:0 2cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;background:#c9d7d7;color:#23394b}
.support-number{display:block;font-size:4.3cqw;font-weight:700;line-height:.98;font-variant-numeric:tabular-nums;white-space:nowrap}
.support-caption{font-size:1.65cqw;font-weight:700;line-height:1.1;letter-spacing:.025em;white-space:nowrap}
.name-track{display:flex;align-items:center;gap:1cqw;flex:1 1 0;min-width:0;padding-right:1cqw}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.4cqw;font-weight:700;line-height:1.1}
.combinedAName:empty::before{content:"Player A"}
.combinedBName:empty::before{content:"Player B"}
.serve{flex:0 0 auto;color:#f7faf9;font-size:1.7cqw;line-height:1}
.primary-track{flex:0 0 21cqw;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;gap:.8cqw;flex-direction:row;padding:0 .8cqw 0 0;background:#23394b;color:#f7faf9;overflow:hidden}
.primary-number{display:block;font-size:7.7cqw;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
.primary-caption{display:block;font-size:1.9cqw;font-weight:700;line-height:1.1;letter-spacing:.015em;white-space:nowrap}
@media(max-width:650px){
 .board{width:94vw}
 .header{height:11cqw;padding:0 3cqw}
 .sport-tag{font-size:4.3cqw}
 .status{font-size:1.5cqw}
 .point-slot{right:3cqw}
 .point-state{font-size:1.7cqw}
 .lanes{flex-direction:column}
 .lane{height:19cqw;min-height:65px;flex:0 0 auto}
 .lane+.lane{border-left:0;border-top:1px solid #506c75}
 .identity{flex-basis:2cqw}
 .support-track{flex-basis:12cqw;height:15cqw;min-height:0;margin:0 2.3cqw}
 .support-number{font-size:6cqw}
 .support-caption{font-size:2.1cqw}
 .name{font-size:5.8cqw}
 .serve{font-size:2.2cqw}
 .primary-track{flex-basis:19cqw;flex-direction:column;gap:0;padding:0 1cqw}
 .primary-number{font-size:9cqw}
 .primary-caption{font-size:2.25cqw}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage"><article class="board columnContainer paired" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <header class="header"><div class="sport-tag">PICKLEBALL</div><div class="status"><span>GAME <b>0</b></span><span>MATCH <b>0</b></span></div><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></header>
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
    <div class="lane rowContainer lane-a" data-osb-component="layout" data-osb-component-type="osb-row-container">
  <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA" aria-hidden="true"></span>
  <div class="support-track"><span class="support-number currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="support-caption">GAMES</span></div>
  <div class="name-track"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true" aria-label="Serving">●</span></div>
  <div class="primary-track"><span class="primary-number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption">POINTS</span></div>
</div>
    <div class="lane rowContainer lane-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
  <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB" aria-hidden="true"></span>
  <div class="support-track"><span class="support-number currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="support-caption">GAMES</span></div>
  <div class="name-track"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;" aria-label="Serving">●</span></div>
  <div class="primary-track"><span class="primary-number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption">POINTS</span></div>
</div>
  </div>
</article></main>
</body>
</html>
