<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horizon Courtline / Table Tennis</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;min-height:100%;font-family:"Arial Narrow",Arial,sans-serif;color:#071b38}
body{padding:2rem;display:flex;align-items:center;justify-content:center;min-height:100vh}
.rowContainer{display:flex;flex-direction:row}.columnContainer{display:flex;flex-direction:column}
.board{font-size:14px;inline-size:fit-content;max-inline-size:100%;--teal:#0b8590;--orange:#f04217;--ink:#071b38;--paper:#f9fbfa;--line:#b7c7cd;filter:drop-shadow(0 .4em .8em #071b3820)}
.header{align-self:flex-start;align-items:center;gap:1.5em;background:var(--paper);border:1px solid var(--ink);border-bottom:0;border-radius:1.3em 3em 0 0;padding:.85em 2em 1em 1.2em;min-height:3.5em}
.eventName{font-size:1.5em;font-weight:900;font-style:italic}.matchRound{color:var(--teal);font-size:.9em;font-weight:800}.format{font-size:.8em;white-space:nowrap;font-weight:700}
.logo{width:2.5em;height:2.5em;object-fit:contain}img:not([src]),img[src=""]{visibility:hidden}
.live{align-items:stretch;border:1px solid var(--line);border-radius:.9em;overflow:hidden;background:var(--paper)}
.pair{flex:0 0 auto;min-width:0}.cell{height:7.2em;display:flex;align-items:center;justify-content:center;min-width:0;padding:.55em;border-right:1px solid var(--line)}.cell+.cell{border-top:2px solid #f0421745}
.letters .cell{padding:0}.side-label{font-size:1.6em;font-weight:900;color:white;display:flex;align-items:center;justify-content:center;align-self:stretch;width:1.8em}.jerseyColorA{background:#0b8590}.jerseyColorB{background:#f04217}
.photos .cell{padding:.5em;background:#eaf4f3}.portrait{object-fit:cover;object-position:top;width:5.1em;height:6.1em;border-radius:50%}
.identities{flex:1 1 auto;min-width:8em}.identities .cell{justify-content:flex-start;padding-inline:1em}.identity-line{align-items:center;gap:.8em;min-width:0}.flag{width:2.6em;height:1.8em;object-fit:contain;flex:none}.name{font-size:1.28em;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.matches .cell{background:#e8f3f3;flex-direction:column;padding:0;min-width:4.8em}.score-label{font-size:.75em;color:var(--teal);border-bottom:1px solid var(--line);width:100%;text-align:center;padding:.3em}.match-score{font-size:3em;font-weight:900;color:var(--teal);padding:.2em;font-variant-numeric:tabular-nums}.currentBMatchScore{color:var(--orange)}
.points .cell{min-width:6.5em}.point-score{font-size:4.5em;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.status .cell{flex-direction:column;gap:.4em;min-width:7.5em}.serve-line{align-items:center;gap:.5em;font-size:.7em;font-weight:800}.service{display:block;width:1.2em;height:1.2em;border-radius:50%;background:var(--teal)}.isBCurrentlyServing{background:var(--orange);opacity:0}
.timer-box{border:1px solid var(--teal);border-radius:.5em;padding:.2em .65em;justify-content:center;min-width:5.5em}.timer{font-size:1.4em;font-weight:800;font-variant-numeric:tabular-nums;color:var(--teal)}.side-b .timer-box{border-color:var(--orange)}.side-b .timer{color:var(--orange)}.used{font-size:.6em;font-weight:700;color:var(--teal)}
.cards .cell{flex-direction:column;gap:.6em;padding-inline:.8em}.penalty{width:1.15em;height:1.6em;border-radius:.2em;box-shadow:0 0 0 .25em white,0 0 0 calc(.25em + 1px) #c5cfd2}.yellow{background:#f1c80c}.red{background:#ef1735}
.meta .cell{flex-direction:column;gap:.6em;min-width:4.7em}.meta-field{font-size:1.1em;font-weight:800;border:1px solid var(--teal);border-radius:.25em;padding:.35em;min-width:4ch;text-align:center;color:var(--teal)}.side-b .meta-field{border-color:var(--orange);color:var(--orange)}
.isBTimeOutActive,.isBTimeOutUsed,.isBYellowCarded,.isBRedCarded,.isMatchPoint{opacity:0}
.history-band{align-items:stretch;background:var(--paper);border:1px solid var(--ink);border-radius:0 0 .8em .8em;overflow:hidden;margin-top:.5em}.history{flex:1;min-width:0}.history-game{flex:1;min-width:3em;text-align:center;font-variant-numeric:tabular-nums;border-right:1px solid var(--line)}.game-label{background:var(--ink);color:white;font-size:.7em;font-weight:800;padding:.3em}.history-score{padding:.32em .4em;font-size:1.2em;font-weight:800}.a{color:var(--teal)}.b{color:var(--orange);border-top:1px solid var(--line)}
.point-states{justify-content:center;align-items:center;padding:.6em 1.2em;min-width:9em;border-right:1.2em solid var(--teal)}.point-state{font-size:.75em;font-weight:800;color:var(--teal)}.trajectory{display:flex;flex-wrap:wrap;width:5em;gap:.25em;margin-top:.3em}.trajectory i{background:var(--teal);width:.5em;height:.5em;border-radius:50%}
.footer{background:var(--ink);color:white;margin-top:.5em;border-radius:.7em;justify-content:space-between;align-items:center;padding:.75em 1.3em;font-size:.75em;gap:2em}
@media(max-width:1100px){.board{font-size:11px}.photos{display:none}.meta{display:none}body{padding:1rem}}
@media(max-width:700px){.board{font-size:9px}.cards{display:none}.status .cell{min-width:5.5em}.identities .cell{padding-inline:.6em}.points .cell{min-width:4.5em}.point-score{font-size:3.4em}.matches .cell{min-width:3.5em}.flag{width:1.8em}.point-states{min-width:7em;padding:.5em}.header{gap:.8em;padding:.7em}.eventName{font-size:1.2em}.history-game{min-width:2.6em}}
@media(max-width:450px){body{padding:8px}.board{font-size:8px}.status{display:none}.name{font-size:1.15em}.history-game{min-width:2.4em}.point-states{min-width:6.5em;padding:.4em}.footer{font-size:.8em}}
/* Balanced compact live lanes; optional data does not own a permanent empty column. */
.cell{height:6.2em}.identity-content{position:relative;justify-content:center;min-width:0;width:100%;height:100%;padding-bottom:1.1em}.identity-line{width:100%}.name{flex:1;min-width:0}.service{flex:none;width:.65em;height:.65em}
.photos:not(:has(img[src]:not([src=""]))) {display:none}
.meta:not(:has(.meta-field:not(:empty))){display:none}.meta-field:empty{display:none}
.cards:not(:has(.penalty:not([style*="opacity: 0"]))) {display:none}
.timer-box{position:absolute;bottom:0;left:0;min-width:0;gap:.4em;padding:.2em .45em;border:0;background:#e6f2f2;border-radius:.3em;font-size:.68em;font-weight:800;line-height:1.2}.timer{font-size:1.2em;line-height:1;min-width:2ch;text-align:center}.side-b .timer-box{background:#ffede8}.used{position:absolute;bottom:0;right:0;border:1px solid currentColor;border-radius:.25em;padding:.15em .35em;font-size:.65em}
.history-band{align-self:flex-end;width:fit-content;max-width:100%;background:transparent;border-radius:.4em;margin-top:.35em}.history{flex:0 1 auto}.history-game{flex:0 1 4em;min-width:2.6em}.history-score{font-size:1em;padding:.22em .4em}.game-label{font-size:.62em}
.footer{margin-top:.35em;gap:1em}.footer .point-badges{gap:.7em}.point-state{font-size:1em;color:#bfe9e7}

.point-announcement-frame{display:inline-flex;flex-direction:column;position:relative;width:max-content;max-width:100%;padding-top:28px;box-sizing:border-box}
.point-announcement-frame>.point-announcement{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:14px;height:28px;min-height:28px}
.point-announcement.rowContainer{position:relative;display:flex;flex-direction:row;align-self:center;flex:0 0 2em;width:12em;max-width:100%;height:2em;min-height:2em;padding:0;margin:0;isolation:isolate;pointer-events:none}
.point-announcement-frame>.point-announcement.rowContainer{position:absolute}
.point-announcement.rowContainer>span{box-sizing:border-box;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;padding:.25em .75em;min-width:0;font-family:Arial,sans-serif;font-size:1em;font-weight:800;font-style:normal;line-height:1.2;letter-spacing:0;white-space:nowrap;text-align:center;background:#17212b;color:#f8fafc;border:1px solid #a9b8c5;border-bottom:0;border-radius:5px 5px 0 0;opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity 180ms ease,transform 180ms ease,visibility 0s linear 180ms}
.point-announcement.rowContainer>span:is([style*="opacity:1"],[style*="opacity: 1"]){visibility:visible;transform:translateY(0);transition-delay:0s;pointer-events:auto}
.point-announcement.rowContainer:has(>.isMatchPoint:is([style*="opacity:1"],[style*="opacity: 1"]))>.isGamePoint{opacity:0!important;visibility:hidden;transform:translateY(4px)}
@media(prefers-reduced-motion:reduce){.point-announcement.rowContainer>span{transition:none!important;transform:none!important}}

</style></head><body><div class="point-announcement-frame columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="point-announcement rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Match point status"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></div><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
<header class="header rowContainer"><img class="logo" data-osb-asset-role="event-logo" src="" alt=""><span class="eventName " data-osb-component="field" data-osb-field="eventName" ></span><span class="matchRound " data-osb-component="field" data-osb-field="matchRound" ></span><span class="format matchFormatLabel" data-osb-component="field" data-osb-field="matchFormatLabel"></span></header>
<section class="live rowContainer">
<div class="columnContainer pair letters"><div class="cell side-a"><span class="jerseyColorA side-label" data-osb-component="field" data-osb-field="jerseyColorA" >A</span></div><div class="cell side-b"><span class="jerseyColorB side-label" data-osb-component="field" data-osb-field="jerseyColorB" >B</span></div></div>
<div class="columnContainer pair photos"><div class="cell side-a"><img class="imageURLA portrait" data-osb-component="field" data-osb-field="imageURLA" src="" alt=""></div><div class="cell side-b"><img class="imageURLB portrait" data-osb-component="field" data-osb-field="imageURLB" src="" alt=""></div></div>
<div class="columnContainer pair identities"><div class="cell side-a"><div class="columnContainer identity-content"><div class="rowContainer identity-line"><img class="countryA flag" data-osb-component="field" data-osb-field="countryA" src="/scoreboard-runtime/flags/jp.png" alt=""><span class="combinedAName name" data-osb-component="field" data-osb-field="combinedAName" ></span><span class="isACurrentlyServing service" data-osb-component="field" data-osb-field="isACurrentlyServing" isa="true"></span></div><div class="isATimeOutActive timer-box rowContainer" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none"><span>TIMEOUT</span><span class="timeOutTimerA timer" data-osb-component="field" data-osb-field="timeOutTimerA" >0</span><span>s</span></div><span class="isATimeOutUsed used" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none" title="Timeout used">T</span></div></div><div class="cell side-b"><div class="columnContainer identity-content"><div class="rowContainer identity-line"><img class="countryB flag" data-osb-component="field" data-osb-field="countryB" src="/scoreboard-runtime/flags/de.png" alt=""><span class="combinedBName name" data-osb-component="field" data-osb-field="combinedBName" ></span><span class="isBCurrentlyServing service" data-osb-component="field" data-osb-field="isBCurrentlyServing" ></span></div><div class="isBTimeOutActive timer-box rowContainer" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none"><span>TIMEOUT</span><span class="timeOutTimerB timer" data-osb-component="field" data-osb-field="timeOutTimerB" >0</span><span>s</span></div><span class="isBTimeOutUsed used" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none" title="Timeout used">T</span></div></div></div>
<div class="columnContainer pair matches"><div class="cell side-a"><span class="score-label">MATCH</span><span class="currentAMatchScore match-score" data-osb-component="field" data-osb-field="currentAMatchScore" >0</span></div><div class="cell side-b"><span class="score-label">MATCH</span><span class="currentBMatchScore match-score" data-osb-component="field" data-osb-field="currentBMatchScore" >0</span></div></div>
<div class="columnContainer pair points"><div class="cell side-a"><span class="currentAGameScore point-score" data-osb-component="field" data-osb-field="currentAGameScore" >0</span></div><div class="cell side-b"><span class="currentBGameScore point-score" data-osb-component="field" data-osb-field="currentBGameScore" >0</span></div></div>
<div class="columnContainer pair cards"><div class="cell side-a"><span class="isAYellowCarded penalty yellow" data-osb-component="field" data-osb-field="isAYellowCarded" ></span><span class="isARedCarded penalty red" data-osb-component="field" data-osb-field="isARedCarded" ></span></div><div class="cell side-b"><span class="isBYellowCarded penalty yellow" data-osb-component="field" data-osb-field="isBYellowCarded" ></span><span class="isBRedCarded penalty red" data-osb-component="field" data-osb-field="isBRedCarded" ></span></div></div>
<div class="columnContainer pair meta"><div class="cell side-a"><span class="rankingA meta-field" data-osb-component="field" data-osb-field="rankingA" ></span><span class="ratingA meta-field" data-osb-component="field" data-osb-field="ratingA" ></span></div><div class="cell side-b"><span class="rankingB meta-field" data-osb-component="field" data-osb-field="rankingB" ></span><span class="ratingB meta-field" data-osb-component="field" data-osb-field="ratingB" ></span></div></div>
</section>
<footer class="footer rowContainer"><span class="courtName" data-osb-component="field" data-osb-field="courtName"></span><span>WORLD SERIES</span></footer></article></div></body></html>
