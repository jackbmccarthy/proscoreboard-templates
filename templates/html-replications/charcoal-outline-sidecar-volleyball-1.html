<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball — Charcoal Outline Sidecar 1</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.shell{position:relative;width:min(86vw,1080px);max-width:100%;padding-top:40px;container-type:inline-size}
.sport-tag{position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;width:230px;max-width:58%;height:40px;background:#dce3e2;color:#20272c;font-size:29px;font-weight:800;line-height:1;white-space:nowrap}
.board{display:flex;width:100%;height:max(150px,25.9cqw);overflow:hidden;background:#20272c;color:#f2f3ee;border-radius:2px}
.teams{display:flex;flex:1 1 0;flex-direction:column;min-width:0}
.team{display:flex;align-items:center;flex:1 1 0;min-height:0;min-width:0}
.team+.team{border-top:1px solid #a8b8bc}
.identity{display:block;flex:0 0 2%;height:88%;margin-left:0;background:#0e87eb}
.jerseyColorB{background:#f22e39}
.name{display:block;align-content:center;flex:1 1 0;min-width:0;overflow:hidden;padding:0 4%;font-size:5.9cqw;font-weight:700;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
.combinedAName:empty::before{content:"Team A"}
.combinedBName:empty::before{content:"Team B"}
.score-track{display:flex;align-items:center;justify-content:center;flex:0 0 22%;height:84%;margin-right:2%;min-width:0;border:1px solid #a8b8bc;background:#20272c}
.score{display:block;min-width:0;color:#fff;font-size:7.8cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.dock{display:flex;align-items:center;flex:0 0 15.5%;flex-direction:column;min-width:0;padding:1% 2.1%;background:#dce3e2;color:#20272c}
.dock-heading{display:flex;align-items:center;justify-content:center;flex:0 0 17%;font-size:2.7cqw;font-weight:800;line-height:1;white-space:nowrap}
.sets-list{display:flex;align-items:center;justify-content:space-around;flex:1 1 0;flex-direction:column;min-height:0;width:100%}
.set-score{display:block;font-size:4.8cqw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.set-current{display:flex;align-items:center;justify-content:center;flex:0 0 27%;gap:.6cqw;width:100%;border-top:1px solid #7e958f;font-size:2.5cqw;font-weight:800;line-height:1;white-space:nowrap}
.set-current-value{font-variant-numeric:tabular-nums}
.point-slot{display:none}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:600px){
 .stage{padding:10px}
 .shell{width:100%;padding-top:25px}
 .sport-tag{width:132px;height:25px;font-size:16px}
 .board{height:150px}
 .dock{flex-basis:23%;padding:2px 4px}
 .identity{flex-basis:5px}
 .name{padding:0 8px;font-size:clamp(14px,5.2cqw,21px)}
 .score-track{flex-basis:27%;height:75%;margin-right:5px}
 .score{font-size:clamp(30px,9cqw,38px)}
 .dock-heading{font-size:12px}
 .set-score{font-size:26px}
 .set-current{gap:3px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" data-osb-component="layout">
 <div class="shell">
  <span class="sport-tag" data-osb-component="text">VOLLEYBALL</span>
  <article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Volleyball scoreboard">
   <div class="teams columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
    <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
     <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
     <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
     <div class="score-track" data-osb-component="layout"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div>
    </div>
    <div class="team rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
     <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
     <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
     <div class="score-track" data-osb-component="layout"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div>
    </div>
   </div>
   <aside class="dock columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Sets won and editable current set">
    <span class="dock-heading" data-osb-component="text">SETS</span>
    <div class="sets-list columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
     <span class="set-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span>
     <span class="set-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span>
    </div>
    <div class="set-current rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span data-osb-component="text">SET</span><span class="set-current-value" data-osb-component="text" data-osb-static="true" data-sport-stat="set">0</span></div>
   </aside>
   <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0">MATCH POINT</span></div>
  </article>
 </div>
</main>
</body>
</html>
