<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plum Pearl Outboard Volleyball — Horizontal</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: transparent; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .stage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
    .board { display: flex; flex-direction: column; width: min(91vw, 1800px); max-width: 100%; overflow: hidden; border: 1px solid #bdb5bd; border-radius: 3px; background: #302b38; color: #faf8f7; container-type: inline-size; }
    .header { display: flex; align-items: center; justify-content: center; height: 4.6cqw; min-height: 39px; border-bottom: 1px solid #bdb5bd; background: #ece7e9; color: #272331; font-size: 3.2cqw; font-weight: 800; line-height: 1; white-space: nowrap; }
    .main-row { display: flex; align-items: stretch; height: 7.3cqw; min-height: 68px; min-width: 0; }
    .score { display: flex; align-items: center; justify-content: center; flex: 0 0 10.6%; min-width: 0; background: #ece7e9; color: #272331; font-size: 6cqw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tick { display: block; flex: 0 0 2.35%; background: #836a87; }
    .jerseyColorB { background: #9c807f; }
    .name { display: block; align-content: center; flex: 1 1 0; min-width: 0; overflow: hidden; padding: 0 2.5cqw; color: #faf8f7; font-size: 3cqw; font-weight: 700; line-height: 1; text-overflow: ellipsis; white-space: nowrap; }
    .combinedBName { text-align: right; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .sets { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 0 0 7%; min-width: 0; color: #faf8f7; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sets-label { color: #bdb5bd; font-size: 1.5cqw; font-weight: 700; line-height: 1; }
    .sets-value { font-size: 3cqw; font-weight: 700; line-height: 1.15; }
    .divider { flex: 0 0 1px; align-self: center; height: 68%; background: #786d80; }
    .footer { display: flex; align-items: center; justify-content: center; height: 4.1cqw; min-height: 39px; border-top: 1px solid #bdb5bd; background: #302b38; }
    .set-label { color: #ece7e9; font-size: 2cqw; font-weight: 700; line-height: 1; }
    .set-value { margin-left: 1.8cqw; color: #faf8f7; font-size: 3cqw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint,
    .point-slot:has(> .isMatchPoint[style*="opacity:1"]) > .isGamePoint { opacity: 0 !important; }
    @media (max-width: 600px) {
      .board { width: 100%; }
      .header { height: 39px; font-size: 20px; }
      .main-row { height: 72px; }
      .score { flex-basis: 11%; font-size: 35px; }
      .tick { flex-basis: 2.6%; }
      .name { padding: 0 7px; font-size: 17px; }
      .sets { flex-basis: 9%; }
      .sets-label { font-size: 8px; }
      .sets-value { font-size: 20px; }
      .footer { height: 39px; }
      .set-label { font-size: 13px; }
      .set-value { margin-left: 7px; font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="stage" data-osb-component="layout">
    <article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container" aria-label="Volleyball scoreboard">
      <header class="header rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">VOLLEYBALL</header>
      <div class="main-row rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container">
        <span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span>
        <span class="tick jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span>
        <span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span>
        <span class="sets"><span class="sets-label" data-osb-component="text">SETS</span><span class="sets-value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span>
        <span class="divider" data-osb-component="layout"></span>
        <span class="sets"><span class="sets-label" data-osb-component="text">SETS</span><span class="sets-value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span>
        <span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span>
        <span class="tick jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span>
        <span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span>
      </div>
      <footer class="footer rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="set-label" data-osb-component="text">SET</span><span class="set-value" data-osb-component="text" data-osb-static="true" data-sport-stat="set">0</span></footer>
      <div class="point-slot" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div>
    </article>
  </main>
</body>
</html>
