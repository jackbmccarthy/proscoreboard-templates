<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Tennis — Basalt Copper Dual Track Lower Third</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--basalt:#26333a;--fog:#dce2df;--copper:#87473a;--ink:#f5f5f1;--line:#8fa5a4;position:relative;display:flex;flex-direction:column;width:min(89vw,1930px);min-width:0;container-type:inline-size}
.sport-tag{display:flex;align-self:flex-start;align-items:center;height:2.7cqw;min-height:20px;padding:0 1.0cqw;margin:0 0 .3cqw;color:#f3f3ee;font-size:1.65cqw;font-weight:700;line-height:1;letter-spacing:.02em;white-space:nowrap;background:#455e64;border:1px solid var(--line);border-radius:7px}
.panel{display:flex;flex:0 0 auto;height:min(5.9vw,128px);min-width:0;min-height:0;overflow:hidden;border:2px solid var(--line);border-radius:6px;background:var(--basalt)}
.competitors{display:flex;flex:1 1 auto;flex-direction:row;min-width:0;min-height:0}
.side{display:flex;flex:1 1 50%;align-items:stretch;min-width:0;min-height:0}
.side+.side{border-left:2px solid var(--line)}
.identity-name{display:flex;flex:1 1 auto;min-width:0;align-items:center}
.identity{display:block;align-self:center;flex:0 0 1.0cqw;width:1.0cqw;height:60%;margin-left:1.1cqw;background:#8c5144}
.jerseyColorB{background:#8c5144}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.5cqw;padding:0 1.5cqw;color:var(--ink)}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:3.0cqw;line-height:1;font-weight:700;letter-spacing:-.02em}
.combinedAName:empty::before{content:'Player A'}.combinedBName:empty::before{content:'Player B'}
.serve{display:block;flex:0 0 .6cqw;width:.6cqw;height:.6cqw;min-width:5px;min-height:5px;border-radius:50%;background:var(--fog)}
.game-cell,.point-cell{display:flex;flex:0 0 13%;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;background:var(--fog);color:#23343a}
.point-cell{flex-basis:19%;background:var(--copper);color:#fff}
.cell-label{display:block;max-width:100%;overflow:hidden;white-space:nowrap;font-size:1.3cqw;line-height:1;font-weight:700;letter-spacing:.015em}
.game-number,.point-number{display:block;max-width:100%;min-width:0;overflow:hidden;white-space:nowrap;text-align:center;font-size:3.45cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.point-number{font-size:3.8cqw;color:#fff}
.point-slot{position:absolute;right:0;bottom:100%;width:150px;height:18px;color:#fff;text-align:center;font-size:10px;font-weight:700}
.point-state{position:absolute;inset:0;display:block;padding:3px 4px;background:var(--basalt);border:1px solid var(--line)}
.point-slot:has(>.isMatchPoint[style*='opacity: 1'])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*='opacity:1'])>.isGamePoint{opacity:0!important}
@media(min-width:601px){.board{transform:translateY(-20px)}}
@media(max-width:600px){.board{width:96vw}.sport-tag{height:21px;min-height:21px;padding:0 5px;margin-bottom:3px;font-size:12px}.panel{height:75px;max-height:none}.identity{flex-basis:6px;width:6px;margin-left:4px;}.name-lane{gap:2px;padding:0 4px}.name{font-size:13px}.serve{flex-basis:5px;width:5px;height:5px}.game-cell{flex-basis:36px;gap:3px}.point-cell{flex-basis:41px;gap:3px}.cell-label{font-size:7px}.game-number,.point-number{font-size:25px}.point-slot{height:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><span class="sport-tag">TABLE TENNIS</span><div class="panel"><div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><section class="side side-a rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity-name"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div></div><div class="game-cell"><span class="cell-label">GAMES</span><span class="game-number currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="point-cell"><span class="cell-label">POINTS</span><span class="point-number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></div></section><section class="side side-b rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity-name"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div></div><div class="game-cell"><span class="cell-label">GAMES</span><span class="game-number currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="point-cell"><span class="cell-label">POINTS</span><span class="point-number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></div></section></div></div><div class="point-slot"><span class="point-state isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="point-state isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></article></main></body></html>
