<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleball — Oxblood Ivory In-Row Rail Lower Third</title><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.board{--ivory:#ede9e4;--ink:#252222;--taupe:#8d837d;--line:#928a85;--oxblood:#542633;position:relative;display:flex;flex-direction:row;width:min(80vw,1640px);min-width:0;height:5.9vw;max-height:122px;min-height:0;border:2px solid var(--line);border-radius:3px;background:var(--ivory);color:var(--ink);overflow:visible;container-type:inline-size}
.sport-tag{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-stretch:condensed;font-weight:800;letter-spacing:.07em;line-height:1}
.sport-tag{position:absolute;z-index:1;left:1.3%;top:6%;font-size:1.4cqw}
.competitors{display:flex;flex:1 1 auto;flex-direction:row;min-width:0;min-height:0}
.side{display:flex;flex:1 1 50%;align-items:stretch;min-width:0;min-height:0}
.side+.side{border-left:2px solid var(--line)}
.side{padding-top:1.1cqw}.side-a{padding-left:1.6cqw}.side-b{padding-left:1.3cqw}.identity-name{display:flex;flex:1 1 auto;min-width:0;align-items:center}.identity{display:block;flex:0 0 .7cqw;width:.7cqw;height:45%;background:var(--oxblood)}
.name-lane{display:flex;flex:1 1 auto;min-width:0;align-items:center;gap:.45cqw;padding:0 .9cqw}
.name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;font-family:Impact,'Arial Narrow','Liberation Sans Narrow',Arial,sans-serif;font-stretch:condensed;font-size:3.15cqw;line-height:1;font-weight:900;letter-spacing:.005em}
.combinedAName:empty::before{content:'Player A'}.combinedBName:empty::before{content:'Player B'}
.serve{display:block;flex:0 0 .55cqw;width:.55cqw;height:.55cqw;min-width:5px;min-height:5px;border-radius:50%;background:var(--oxblood)}
.game-track{display:flex;flex:0 0 16%;min-width:0;align-items:center;justify-content:center;gap:.6cqw;color:var(--taupe)}
.game-label,.point-label{display:block;flex:0 0 auto;font-family:'Arial Narrow','Liberation Sans Narrow',Arial,sans-serif;font-stretch:condensed;font-size:1.18cqw;line-height:1;font-weight:800;letter-spacing:-.025em;white-space:nowrap}
.game-value{display:block;min-width:1.3ch;text-align:center;font-size:2.35cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.point-track{display:flex;flex:0 0 31%;min-width:0;align-items:stretch;justify-content:flex-end;}
.point-label{display:flex;align-items:center;justify-content:center;flex:1 1 auto;min-width:0;color:var(--taupe)}

.primary-score{display:flex;flex:0 0 8.4cqw;width:8.4cqw;min-width:0;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;background:var(--oxblood);color:white;text-align:center;font-size:4.3cqw;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.point-slot{position:absolute;left:0;bottom:100%;width:150px;height:18px;color:#fff;text-align:center;font-size:10px;font-weight:700}
.point-state{position:absolute;inset:0;display:block;padding:3px 4px;background:var(--oxblood)}
.point-slot:has(>.isMatchPoint[style*='opacity: 1'])>.isGamePoint,.point-slot:has(>.isMatchPoint[style*='opacity:1'])>.isGamePoint{opacity:0!important}
@media(max-width:600px){.board{width:96vw;height:78px;max-height:none}.sport-tag{font-size:8px;top:5px;left:6px}.side{padding-top:12px}.side-a,.side-b{padding-left:5px}.identity{flex-basis:4px;width:4px;height:50%}.name-lane{gap:2px;padding:0 3px}.name{font-size:13px;letter-spacing:-.04em}.serve{flex-basis:5px;width:5px;height:5px}.game-track{flex-basis:34px;gap:2px;flex-direction:column}.game-label,.point-label{font-size:7px}.game-value{font-size:13px}.point-track{flex-basis:67px}.primary-score{flex-basis:40px;width:40px;font-size:23px}.point-slot{height:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Reserved conditional match states: all score and name tracks remain fixed. */
.osb-conditional-rail{--osb-rail-bg:#2b2a2b;--osb-rail-fg:#f9fbfa;box-sizing:border-box!important;position:relative!important;inset:auto!important;transform:none!important;grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:28px!important;height:28px!important;margin:0!important;padding:2px 7px!important;gap:5px!important;overflow:hidden!important;background:var(--osb-rail-bg)!important;color:var(--osb-rail-fg)!important;border:0!important;font:700 11px/1 Arial,Helvetica,sans-serif!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-condition-side{all:unset!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;flex:1 1 35%!important;width:35%!important;min-width:0!important;height:22px!important;gap:2px!important;position:relative!important;overflow:hidden!important}
.osb-conditional-rail .osb-condition-side-b{justify-content:flex-end!important}
.osb-conditional-rail .osb-condition-slot{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 21px!important;width:21px!important;height:18px!important;position:relative!important}
.osb-conditional-rail .osb-condition-timeoutused{flex-basis:21px!important;width:21px!important}
.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:17px!important;width:17px!important}
.osb-conditional-rail .osb-condition-badge{box-sizing:border-box!important;align-items:center!important;justify-content:center!important;width:100%!important;height:18px!important;min-width:0!important;margin:0!important;padding:0 2px!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:2px!important;background:rgba(255,255,255,.12)!important;color:var(--osb-rail-fg)!important;font:800 9px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-timeout-icon{position:relative!important;display:flex;align-items:center!important;justify-content:center!important;padding:0!important;color:var(--osb-rail-fg)!important}
.osb-conditional-rail .osb-timeout-icon::before{content:""!important;display:block!important;width:11px!important;height:11px!important;border:1.5px solid currentColor!important;border-radius:50%!important;background:transparent!important}
.osb-conditional-rail .osb-timeout-icon::after{content:""!important;position:absolute!important;left:50%!important;top:3px!important;width:3px!important;height:6px!important;border-left:1.5px solid currentColor!important;border-bottom:1.5px solid currentColor!important;transform:translateX(-25%) rotate(-35deg)!important;transform-origin:bottom left!important}
.osb-conditional-rail .isATimeOutActive,.osb-conditional-rail .isBTimeOutActive{background:#f3d27a!important;color:#253641!important;border-color:#f3d27a!important}
.osb-conditional-rail .isATimeOutUsed,.osb-conditional-rail .isBTimeOutUsed{background:transparent!important;color:#b8c7ca!important;border-color:#b8c7ca!important}
.osb-conditional-rail .isAYellowCarded,.osb-conditional-rail .isBYellowCarded{background:#e5c94e!important;color:#253641!important;border-color:#e5c94e!important}
.osb-conditional-rail .isARedCarded,.osb-conditional-rail .isBRedCarded{background:#c94747!important;color:#fff!important;border-color:#c94747!important}
.osb-conditional-rail .point-slot.osb-shared-point{all:unset!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30%!important;width:30%!important;min-width:78px!important;max-width:130px!important;height:22px!important;min-height:22px!important;inset:auto!important;margin:0!important;padding:0!important;transform:none!important;overflow:hidden!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important}
.osb-conditional-rail .point-slot.osb-shared-point>.isGamePoint,.osb-conditional-rail .point-slot.osb-shared-point>.isMatchPoint{box-sizing:border-box!important;position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;transform:none!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:390px){.osb-conditional-rail{padding:2px 4px!important;gap:3px!important}.osb-conditional-rail .osb-condition-side{gap:1px!important}.osb-conditional-rail .osb-condition-slot{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-timeoutused{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:15px!important;width:15px!important}.osb-conditional-rail .point-slot.osb-shared-point{min-width:76px!important}}
.board:has(>.osb-conditional-rail){flex-wrap:wrap!important;height:calc(min(8.4vw, 166px) + 28px)!important;max-height:none!important}.board>.osb-conditional-rail{order:99!important}@media(max-width:600px){.board:has(>.osb-conditional-rail){height:106px!important}}
</style></head><body><main class="stage"><article class="board rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><span class="sport-tag">PICKLEBALL</span><div class="competitors rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><section class="side rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity-name"><span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true"></span></div></div><span class="game-track"><span class="game-label">GAMES</span><span class="game-value currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></span><span class="point-track"><span class="point-label">POINTS</span><span class="primary-score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span></span></section><section class="side rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="identity-name"><span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;"></span></div></div><span class="game-track"><span class="game-label">GAMES</span><span class="game-value currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></span><span class="point-track"><span class="point-label">POINTS</span><span class="primary-score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span></span></section></div><div class="osb-conditional-rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Conditional match states"><div class="osb-condition-side osb-condition-side-a" data-osb-component="layout"><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div><span class="point-slot osb-shared-point" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><div class="osb-condition-side osb-condition-side-b" data-osb-component="layout"><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0" aria-l
