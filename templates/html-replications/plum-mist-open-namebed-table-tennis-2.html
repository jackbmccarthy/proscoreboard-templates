<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TABLE TENNIS · Plum Mist Open Namebed</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f9f7f7}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent}
.board{width:54vw;max-width:1040px;min-width:0;overflow:hidden;border:1px solid #6d6672;border-radius:3px;background:#403943;container-type:inline-size}
.board.horizontal{width:82vw;max-width:1660px}
.utility{height:5.5cqw;min-height:29px;position:relative;display:flex;align-items:center;padding:0 1.5cqw;background:#403943;border-bottom:1px solid #aba3ad}
.sport-tab{display:flex;align-items:center;height:82%;padding:0 2.4cqw;border-radius:3px;background:#e7e5e6;color:#403943;font-size:2.65cqw;font-weight:700;line-height:1;white-space:nowrap}
.point-slot{position:absolute;right:1.6cqw;top:50%;transform:translateY(-50%);width:19cqw;height:1.8em;pointer-events:none;text-align:right}
.point-state{position:absolute;inset:0;color:#f9f7f7;font-size:1.5cqw;font-weight:700;line-height:1.8em;white-space:nowrap;background:#403943}
.point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint{opacity:0!important}
.lanes{display:flex;flex-direction:column;min-width:0}
.lane{height:13.1cqw;min-height:75px;flex:0 0 auto;display:flex;align-items:stretch;min-width:0;background:#403943}
.lane+.lane{border-top:1px solid #aba3ad}
.identity{display:block;flex:0 0 1.55cqw;min-width:5px;margin:1.15cqw 0 1.15cqw 1.5cqw;background:#3186a8;border-radius:2px}
.jerseyColorB{background:#c96b71}
.namebed{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.45cqw;padding:0 3.9cqw;overflow:hidden}
.name-line{display:flex;align-items:center;gap:1cqw;min-width:0;height:6cqw}
.name{display:block;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:5.25cqw;font-weight:700;line-height:1.1}
.combinedAName:empty::before{content:"Player A"}
.combinedBName:empty::before{content:"Player B"}
.serve{flex:0 0 2cqw;text-align:center;font-size:1.9cqw;line-height:1;color:#f9f7f7}
.support-line{display:flex;align-items:baseline;gap:1.7cqw;min-width:0;line-height:1.1}
.support-caption{font-size:2.45cqw;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.support-number{font-size:2.55cqw;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.primary-track{flex:0 0 18%;width:18%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:#403943;color:#f9f7f7;overflow:hidden}
.primary-track::before{content:"";position:absolute;left:0;top:10%;bottom:10%;width:1px;background:#aba3ad}
.primary-number{font-size:7.5cqw;font-weight:700;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.primary-caption{margin-top:.3cqw;font-size:2.25cqw;font-weight:700;line-height:1.05;white-space:nowrap}
.horizontal .utility{height:3.25cqw}
.horizontal .sport-tab{font-size:1.65cqw;padding:0 2cqw}
.horizontal .point-state{font-size:1cqw}
.horizontal .lanes{flex-direction:row}
.horizontal .lane{height:9.1cqw;flex:1 1 50%}
.horizontal .lane+.lane{border-top:0;border-left:1px solid #aba3ad}
.horizontal .identity{flex-basis:.8cqw;margin:.9cqw 0 .9cqw .9cqw}
.horizontal .namebed{padding:0 2.1cqw;gap:.2cqw}
.horizontal .name-line{height:4.5cqw}
.horizontal .name{font-size:3.8cqw}
.horizontal .serve{flex-basis:1.5cqw;font-size:1.25cqw}
.horizontal .support-caption{font-size:1.7cqw}
.horizontal .support-number{font-size:2.1cqw}
.horizontal .primary-track{flex-basis:22%;width:22%}
.horizontal .primary-number{font-size:5.3cqw}
.horizontal .primary-caption{font-size:1.55cqw;margin-top:.1cqw}
@media(max-width:650px){
 .board,.board.horizontal{width:94vw}
 .utility,.horizontal .utility{height:9cqw;padding:0 2cqw}
 .sport-tab,.horizontal .sport-tab{font-size:3.1cqw;padding:0 2.6cqw}
 .point-slot{right:2cqw;width:27cqw}
 .point-state,.horizontal .point-state{font-size:2.2cqw}
 .lanes,.horizontal .lanes{flex-direction:column}
 .lane,.horizontal .lane{height:21cqw;min-height:77px;flex:0 0 auto}
 .lane+.lane,.horizontal .lane+.lane{border-left:0;border-top:1px solid #aba3ad}
 .identity,.horizontal .identity{flex-basis:2.3cqw;margin:2cqw 0 2cqw 2cqw}
 .namebed,.horizontal .namebed{padding:0 3cqw;gap:0}
 .name-line,.horizontal .name-line{height:9.8cqw}
 .name,.horizontal .name{font-size:5.7cqw}
 .serve,.horizontal .serve{flex-basis:2.3cqw;font-size:2.3cqw}
 .support-caption,.horizontal .support-caption{font-size:3cqw}
 .support-number,.horizontal .support-number{font-size:3.2cqw}
 .primary-track,.horizontal .primary-track{flex-basis:23%;width:23%}
 .primary-number,.horizontal .primary-number{font-size:9.5cqw}
 .primary-caption,.horizontal .primary-caption{font-size:2.6cqw;margin-top:.1cqw}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Reserved conditional match states: all score and name tracks remain fixed. */
.osb-conditional-rail{--osb-rail-bg:#403943;--osb-rail-fg:#f9fbfa;box-sizing:border-box!important;position:relative!important;inset:auto!important;transform:none!important;grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:28px!important;height:28px!important;margin:0!important;padding:2px 7px!important;gap:5px!important;overflow:hidden!important;background:var(--osb-rail-bg)!important;color:var(--osb-rail-fg)!important;border:0!important;font:700 11px/1 Arial,Helvetica,sans-serif!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-condition-side{all:unset!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;flex:1 1 35%!important;width:35%!important;min-width:0!important;height:22px!important;gap:2px!important;position:relative!important;overflow:hidden!important}
.osb-conditional-rail .osb-condition-side-b{justify-content:flex-end!important}
.osb-conditional-rail .osb-condition-slot{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 21px!important;width:21px!important;height:18px!important;position:relative!important}
.osb-conditional-rail .osb-condition-timeoutused{flex-basis:21px!important;width:21px!important}
.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:17px!important;width:17px!important}
.osb-conditional-rail .osb-condition-badge{box-sizing:border-box!important;align-items:center!important;justify-content:center!important;width:100%!important;height:18px!important;min-width:0!important;margin:0!important;padding:0 2px!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:2px!important;background:rgba(255,255,255,.12)!important;color:var(--osb-rail-fg)!important;font:800 9px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-timeout-icon{position:relative!important;display:flex;align-items:center!important;justify-content:center!important;padding:0!important;color:var(--osb-rail-fg)!important}
.osb-conditional-rail .osb-timeout-icon::before{content:""!important;display:block!important;width:11px!important;height:11px!important;border:1.5px solid currentColor!important;border-radius:50%!important;background:transparent!important}
.osb-conditional-rail .osb-timeout-icon::after{content:""!important;position:absolute!important;left:50%!important;top:3px!important;width:3px!important;height:6px!important;border-left:1.5px solid currentColor!important;border-bottom:1.5px solid currentColor!important;transform:translateX(-25%) rotate(-35deg)!important;transform-origin:bottom left!important}
.osb-conditional-rail .isATimeOutActive,.osb-conditional-rail .isBTimeOutActive{background:#f3d27a!important;color:#253641!important;border-color:#f3d27a!important}
.osb-conditional-rail .isATimeOutUsed,.osb-conditional-rail .isBTimeOutUsed{background:transparent!important;color:#b8c7ca!important;border-color:#b8c7ca!important}
.osb-conditional-rail .isAYellowCarded,.osb-conditional-rail .isBYellowCarded{background:#e5c94e!important;color:#253641!important;border-color:#e5c94e!important}
.osb-conditional-rail .isARedCarded,.osb-conditional-rail .isBRedCarded{background:#c94747!important;color:#fff!important;border-color:#c94747!important}
.osb-conditional-rail .point-slot.osb-shared-point{all:unset!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30%!important;width:30%!important;min-width:78px!important;max-width:130px!important;height:22px!important;min-height:22px!important;inset:auto!important;margin:0!important;padding:0!important;transform:none!important;overflow:hidden!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important}
.osb-conditional-rail .point-slot.osb-shared-point>.isGamePoint,.osb-conditional-rail .point-slot.osb-shared-point>.isMatchPoint{box-sizing:border-box!important;position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;transform:none!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:390px){.osb-conditional-rail{padding:2px 4px!important;gap:3px!important}.osb-conditional-rail .osb-condition-side{gap:1px!important}.osb-conditional-rail .osb-condition-slot{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-timeoutused{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:15px!important;width:15px!important}.osb-conditional-rail .point-slot.osb-shared-point{min-width:76px!important}}

</style>
</head>
<body>
<main class="stage"><article class="board columnContainer horizontal" data-osb-component="layout" data-osb-component-type="osb-column-container">
  <header class="utility"><div class="sport-tab">TABLE TENNIS</div></header>
  <div class="lanes columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container">
    <div class="lane rowContainer side-a" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA" aria-hidden="true"></span>
      <div class="namebed"><div class="name-line"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true" aria-label="Serving">●</span></div><div class="support-line"><span class="support-caption">GAMES</span><span class="support-number currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div></div>
      <div class="primary-track"><span class="primary-number currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="primary-caption">POINTS</span></div>
    </div>
    <div class="lane rowContainer side-b" data-osb-component="layout" data-osb-component-type="osb-row-container">
      <span class="identity jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB" aria-hidden="true"></span>
      <div class="namebed"><div class="name-line"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;" aria-label="Serving">●</span></div><div class="support-line"><span class="support-caption">GAMES</span><span class="support-number currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div></div>
      <div class="primary-track"><span class="primary-number currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="primary-caption">POINTS</span></div>
    </div>
  </div>
<div class="osb-conditional-rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Conditional match states"><div class="osb-condition-side osb-condition-side-a" data-osb-component="layout"><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div><span class="point-slot osb-shared-point" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><div class="osb-condition-side osb-condition-side-b" data-osb-component="layout"><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div></div></article></main>
</body>
</html>
