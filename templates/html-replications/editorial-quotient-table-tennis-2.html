<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editorial Quotient TABLE TENNIS 2</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#231b17}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center}.board{width:min(var(--width),1500px);background:#fbf5ed;position:relative;container-type:inline-size;display:flex;flex-direction:column}.header{text-align:center;font-size:var(--header-font);letter-spacing:var(--header-tracking);font-weight:700;line-height:1;min-height:var(--header-height);display:flex;align-items:center;justify-content:center;margin:0;white-space:nowrap}.name-lane{position:relative;min-width:0}.name{display:block;width:100%;font-family:"Times New Roman",Times,serif;font-style:italic;font-weight:700;font-size:var(--name-font);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .6cqw}.combinedAName:empty:before{content:"Player A"}.combinedBName:empty:before{content:"Player B"}.serve{position:absolute;right:.6cqw;top:0;width:1.3cqw;height:1.3cqw;font-size:1.3cqw}.scores{min-width:0}.secondary{display:flex;align-items:center;justify-content:space-between;min-height:var(--secondary-height)}.label{font-size:var(--label-font);letter-spacing:var(--label-tracking);font-weight:700;line-height:1.1;white-space:nowrap;text-align:center}.match-score{font-family:"Times New Roman",Times,serif;font-weight:700;font-size:var(--match-font);color:var(--match-color);text-align:center;min-width:2ch;line-height:1.1}.rule{position:relative;height:2px;background:#231b17;flex-shrink:0}.accent{position:absolute;left:0;top:0;width:1.6cqw;height:2px;background:#231b17}.score{display:block;width:100%;font-family:"Times New Roman",Times,serif;font-weight:700;font-size:var(--score-font);line-height:1.08;color:#a74620;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.07em;white-space:nowrap}.primary{display:flex;flex-direction:column;align-items:center}.point-slot{position:absolute;top:calc(100% + .9cqw);left:50%;transform:translateX(-50%);width:30cqw;height:2cqw;text-align:center;font-size:1.7cqw;color:#231b17;background:#fbf5ed}.point{position:absolute;inset:0}.point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint{opacity:0!important}@media(max-width:600px){.board{width:94vw}.rule,.accent{height:1px}.point-slot{font-size:2.2cqw}.label{letter-spacing:.2cqw}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.board{--width:81vw;--header-font:3.35cqw;--header-tracking:.6cqw;--header-height:7cqw;--name-font:8.5cqw;--secondary-height:5.8cqw;--label-font:2.4cqw;--label-tracking:.4cqw;--match-font:5.1cqw;--match-color:#231b17;--score-font:19.6cqw;padding-bottom:2.7cqw}.duel{display:flex;position:relative;padding:0 4.8cqw;gap:9.5cqw}.duel:after{content:"";position:absolute;top:0;bottom:-1cqw;left:50%;width:2px;background:#231b17}.side{flex:1;min-width:0}.name-lane{text-align:center;margin-bottom:1.8cqw}.secondary{justify-content:center;gap:6.4cqw;padding-bottom:1cqw;}.primary .score{padding-top:.8cqw}.primary .label{font-size:2.5cqw;margin-top:.5cqw}.scores .match-score{min-width:2ch}@media(max-width:600px){.duel:after{width:1px}}
.score{line-height:.8}.point-slot{background:transparent}.point{background:#fbf5ed}

/* Reserved conditional match states: all score and name tracks remain fixed. */
.osb-conditional-rail{--osb-rail-bg:#231b17;--osb-rail-fg:#f9fbfa;box-sizing:border-box!important;position:relative!important;inset:auto!important;transform:none!important;grid-column:1/-1!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;min-height:28px!important;height:28px!important;margin:0!important;padding:2px 7px!important;gap:5px!important;overflow:hidden!important;background:var(--osb-rail-bg)!important;color:var(--osb-rail-fg)!important;border:0!important;font:700 11px/1 Arial,Helvetica,sans-serif!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-condition-side{all:unset!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;flex:1 1 35%!important;width:35%!important;min-width:0!important;height:22px!important;gap:2px!important;position:relative!important;overflow:hidden!important}
.osb-conditional-rail .osb-condition-side-b{justify-content:flex-end!important}
.osb-conditional-rail .osb-condition-side-label{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 13px!important;width:13px!important;height:18px!important;color:var(--osb-rail-fg)!important;font:800 10px/1 Arial,Helvetica,sans-serif!important}
.osb-conditional-rail .osb-condition-slot{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 21px!important;width:21px!important;height:18px!important;position:relative!important}
.osb-conditional-rail .osb-condition-timeoutused{flex-basis:21px!important;width:21px!important}
.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:17px!important;width:17px!important}
.osb-conditional-rail .osb-condition-badge{box-sizing:border-box!important;align-items:center!important;justify-content:center!important;width:100%!important;height:18px!important;min-width:0!important;margin:0!important;padding:0 2px!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:2px!important;background:rgba(255,255,255,.12)!important;color:var(--osb-rail-fg)!important;font:800 9px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .osb-timeout-icon{position:relative!important;display:flex;align-items:center!important;justify-content:center!important;padding:0!important;color:var(--osb-rail-fg)!important}
.osb-conditional-rail .osb-timeout-icon::before{content:""!important;display:block!important;width:11px!important;height:11px!important;border:1.5px solid currentColor!important;border-radius:50%!important;background:transparent!important}
.osb-conditional-rail .osb-timeout-icon::after{content:""!important;position:absolute!important;left:50%!important;top:3px!important;width:3px!important;height:6px!important;border-left:1.5px solid currentColor!important;border-bottom:1.5px solid currentColor!important;transform:translateX(-25%) rotate(-35deg)!important;transform-origin:bottom left!important}
.osb-conditional-rail .isATimeOutActive,.osb-conditional-rail .isBTimeOutActive{background:#f3d27a!important;color:#253641!important;border-color:#f3d27a!important}
.osb-conditional-rail .isATimeOutUsed,.osb-conditional-rail .isBTimeOutUsed{background:transparent!important;color:#b8c7ca!important;border-color:#b8c7ca!important}
.osb-conditional-rail .isAYellowCarded,.osb-conditional-rail .isBYellowCarded{background:#e5c94e!important;color:#253641!important;border-color:#e5c94e!important}
.osb-conditional-rail .isARedCarded,.osb-conditional-rail .isBRedCarded{background:#c94747!important;color:#fff!important;border-color:#c94747!important}
.osb-conditional-rail .point-slot.osb-shared-point{all:unset!important;box-sizing:border-box!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30%!important;width:30%!important;min-width:78px!important;max-width:130px!important;height:22px!important;min-height:22px!important;inset:auto!important;margin:0!important;padding:0!important;transform:none!important;overflow:hidden!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important}
.osb-conditional-rail .point-slot.osb-shared-point>.isGamePoint,.osb-conditional-rail .point-slot.osb-shared-point>.isMatchPoint{box-sizing:border-box!important;position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;transform:none!important;background:transparent!important;color:var(--osb-rail-fg)!important;font:800 11px/1 Arial,Helvetica,sans-serif!important;text-align:center!important;white-space:nowrap!important;animation:none!important;transition:none!important}
.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity: 1"])>.isGamePoint,.osb-conditional-rail .point-slot:has(>.isMatchPoint[style*="opacity:1"])>.isGamePoint{opacity:0!important}
@media(max-width:390px){.osb-conditional-rail{padding:2px 4px!important;gap:3px!important}.osb-conditional-rail .osb-condition-side{gap:1px!important}.osb-conditional-rail .osb-condition-slot{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-timeoutused{flex-basis:18px!important;width:18px!important}.osb-conditional-rail .osb-condition-yellowcarded,.osb-conditional-rail .osb-condition-redcarded{flex-basis:15px!important;width:15px!important}.osb-conditional-rail .point-slot.osb-shared-point{min-width:76px!important}}

</style></head>
<body><main class="stage"><article class="board columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><h1 class="header">TABLE TENNIS</h1><div class="duel rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container"><div class="side columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="name-lane"><span class="name combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="serve isACurrentlyServing" data-osb-component="field" data-osb-field="isACurrentlyServing" style="opacity: 0;" isA="true">●</span></div><div class="scores"><div class="secondary"><div class="label">GAMES</div><span class="match-score currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span></div><div class="rule"><span class="accent jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span></div><div class="primary"><span class="score currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><div class="label">POINTS</div></div></div></div><div class="side columnContainer" data-osb-component="layout" data-osb-component-type="osb-column-container"><div class="name-lane"><span class="name combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="serve isBCurrentlyServing" data-osb-component="field" data-osb-field="isBCurrentlyServing" style="opacity: 0;">●</span></div><div class="scores"><div class="secondary"><div class="label">GAMES</div><span class="match-score currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span></div><div class="rule"><span class="accent jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span></div><div class="primary"><span class="score currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><div class="label">POINTS</div></div></div></div></div><div class="osb-conditional-rail rowContainer" data-osb-component="layout" data-osb-component-type="osb-row-container" aria-label="Conditional match states"><div class="osb-condition-side osb-condition-side-a" data-osb-component="layout"><span class="osb-condition-side-label">A</span><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isATimeOutUsed" data-osb-component="field" data-osb-field="isATimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isAYellowCarded" data-osb-component="field" data-osb-field="isAYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isARedCarded" data-osb-component="field" data-osb-field="isARedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div><span class="point-slot osb-shared-point" data-osb-component="layout"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity:0">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity:0">MATCH POINT</span></span><div class="osb-condition-side osb-condition-side-b" data-osb-component="layout"><span class="osb-condition-side-label">B</span><span class="osb-condition-slot osb-condition-timeoutactive"><span class="osb-condition-badge osb-timeout-icon isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display:none;opacity:0" aria-label="Timeout active" title="Timeout active"></span></span><span class="osb-condition-slot osb-condition-timeoutused"><span class="osb-condition-badge osb-timeout-icon isBTimeOutUsed" data-osb-component="field" data-osb-field="isBTimeOutUsed" style="display:none;opacity:0" aria-label="Timeout used" title="Timeout used"></span></span><span class="osb-condition-slot osb-condition-yellowcarded"><span class="osb-condition-badge isBYellowCarded" data-osb-component="field" data-osb-field="isBYellowCarded" style="opacity:0" aria-label="Yellow card" title="Yellow card">Y</span></span><span class="osb-condition-slot osb-condition-redcarded"><span class="osb-condition-badge isBRedCarded" data-osb-component="field" data-osb-field="isBRedCarded" style="opacity:0" aria-label="Red card" title="Red card">R</span></span></div></div></article></main></body>
