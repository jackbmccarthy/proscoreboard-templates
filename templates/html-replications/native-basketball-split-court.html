<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split Court</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { font-family: "Futura", "Avenir Next", "Trebuchet MS", sans-serif; }
    .screen { position: relative; display: grid; grid-template-rows: auto 1fr auto; width: 100vw; height: 100vh; background: #0d0f13; color: #f7f4ec; overflow: hidden; }
    .ev { display: flex; justify-content: center; gap: 18px; padding: 22px 0 14px; font-size: 20px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; }
    .ev-round { color: #e0592a; }
    .halves { position: relative; display: grid; grid-template-columns: 1fr 1fr; }
    .half { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #2a2e36; overflow: hidden; }
    .kit { position: absolute; inset: 0; }
    .half::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #0000 40%, #0007), radial-gradient(circle at 50% 120%, #fff1, transparent 60%); }
    .nm { position: relative; z-index: 1; max-width: 90%; font-size: 52px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pts { position: relative; z-index: 1; font-size: 220px; font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; text-shadow: 0 8px 24px #0006; }
    .stats { position: relative; z-index: 1; display: flex; gap: 22px; font-size: 18px; font-weight: 600; letter-spacing: 2px; }
    .fl, .tol-v { margin-left: 6px; font-weight: 800; }
    .tol::before { content: "TIMEOUTS"; }
    .tol:has(.tol-v:empty) { display: none; }
    .bonus { background: #f7f4ec; color: #0d0f13; padding: 0 8px; }
    .bonus:empty { display: none; }
    .circle { position: absolute; left: 50%; top: 50%; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 210px; height: 210px; margin: -105px 0 0 -105px; border-radius: 50%; background: #0d0f13; border: 6px solid #f7f4ec; box-shadow: 0 0 0 10px #0d0f1388; }
    .per { font-size: 48px; font-weight: 700; color: #e0592a; }
    .per:empty { display: none; }
    .gc { font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .flag { position: absolute; bottom: -18px; padding: 4px 16px; background: #e0592a; font-size: 16px; font-weight: 700; letter-spacing: 3px; border-radius: 3px; }
    .strip { display: flex; justify-content: center; gap: 14px; padding: 22px 0 26px; }
    .chip { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 8px 14px; background: #2a2e36; border-radius: 6px; }
    .chip b { font-size: 14px; letter-spacing: 3px; color: #e0592a; }
    .to-flag { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; align-items: center; justify-content: center; gap: 12px; padding: 10px; background: #e0592a; font-size: 24px; font-weight: 700; letter-spacing: 6px; }
    .chip span.pair { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .osb-aux, .point-slot { display: none; }
    .point-slot:has(> .isMatchPoint[style*="opacity: 1"]) > .isGamePoint { opacity: 0 !important; }
    .combinedAName:empty::before { content: "Team A"; }
    .combinedBName:empty::before { content: "Team B"; }
    .eventName:empty, .matchRound:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<main class="screen" aria-label="Basketball halftime card">
  <span class="ev"><span class="ev-name eventName" data-osb-component="field" data-osb-field="eventName"></span><span class="ev-round matchRound" data-osb-component="field" data-osb-field="matchRound"></span></span>
  <section class="halves">
    <div class="half"><span class="kit jerseyColorA" data-osb-component="field" data-osb-field="jerseyColorA"></span><span class="nm combinedAName" data-osb-component="field" data-osb-field="combinedAName"></span><span class="pts currentAGameScore" data-osb-component="field" data-osb-field="currentAGameScore">0</span><span class="stats"><span>FOULS<span class="fl teamFoulsA" data-osb-component="field" data-osb-field="teamFoulsA" data-osb-static="true" data-sport-stat="foulsA">0</span></span><span class="tol"><span class="tol-v timeoutsRemainingA" data-osb-component="field" data-osb-field="timeoutsRemainingA"></span></span><span class="bonus bonusA" data-osb-component="field" data-osb-field="bonusA"></span></span><div class="to-flag isATimeOutActive" data-osb-component="field" data-osb-field="isATimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
    <div class="half"><span class="kit jerseyColorB" data-osb-component="field" data-osb-field="jerseyColorB"></span><span class="nm combinedBName" data-osb-component="field" data-osb-field="combinedBName"></span><span class="pts currentBGameScore" data-osb-component="field" data-osb-field="currentBGameScore">0</span><span class="stats"><span>FOULS<span class="fl teamFoulsB" data-osb-component="field" data-osb-field="teamFoulsB" data-osb-static="true" data-sport-stat="foulsB">0</span></span><span class="tol"><span class="tol-v timeoutsRemainingB" data-osb-component="field" data-osb-field="timeoutsRemainingB"></span></span><span class="bonus bonusB" data-osb-component="field" data-osb-field="bonusB"></span></span><div class="to-flag isBTimeOutActive" data-osb-component="field" data-osb-field="isBTimeOutActive" style="display: none; opacity: 0;">TIMEOUT <span class="to-clock timeoutClock" data-osb-component="field" data-osb-field="timeoutClock"></span></div></div>
    <div class="circle"><span class="per periodLabel" data-osb-component="field" data-osb-field="periodLabel" data-osb-static="true" data-sport-stat="period"></span><span class="gc"><span class="cm clockMinutes" data-osb-component="field" data-osb-field="clockMinutes" data-osb-static="true" data-sport-stat="clockMinutes">00</span><b class="colon">:</b><span class="cs clockSeconds" data-osb-component="field" data-osb-field="clockSeconds" data-osb-static="true" data-sport-stat="clockSeconds">00</span></span><span class="flag isInBetweenGames" data-osb-component="field" data-osb-field="isInBetweenGames" style="opacity: 0;">BREAK</span><span class="flag isComplete" data-osb-component="field" data-osb-field="isComplete" style="opacity: 0;">FINAL</span></div>
  </section>
  <section class="strip">
    <span class="chip"><b>Q1</b><span class="pair"><span class="ga game1AScore" data-osb-component="field" data-osb-field="game1AScore">0</span> - <span class="gb game1BScore" data-osb-component="field" data-osb-field="game1BScore">0</span></span></span>
    <span class="chip"><b>Q2</b><span class="pair"><span class="ga game2AScore" data-osb-component="field" data-osb-field="game2AScore">0</span> - <span class="gb game2BScore" data-osb-component="field" data-osb-field="game2BScore">0</span></span></span>
    <span class="chip"><b>Q3</b><span class="pair"><span class="ga game3AScore" data-osb-component="field" data-osb-field="game3AScore">0</span> - <span class="gb game3BScore" data-osb-component="field" data-osb-field="game3BScore">0</span></span></span>
    <span class="chip"><b>Q4</b><span class="pair"><span class="ga game4AScore" data-osb-component="field" data-osb-field="game4AScore">0</span> - <span class="gb game4BScore" data-osb-component="field" data-osb-field="game4BScore">0</span></span></span>
    <span class="otwrap isGame5Started" data-osb-component="field" data-osb-field="isGame5Started" style="display: none; opacity: 0;"><span class="chip"><b>OT1</b><span class="pair"><span class="ga game5AScore" data-osb-component="field" data-osb-field="game5AScore">0</span> - <span class="gb game5BScore" data-osb-component="field" data-osb-field="game5BScore">0</span></span></span></span>
    <span class="otwrap isGame6Started" data-osb-component="field" data-osb-field="isGame6Started" style="display: none; opacity: 0;"><span class="chip"><b>OT2</b><span class="pair"><span class="ga game6AScore" data-osb-component="field" data-osb-field="game6AScore">0</span> - <span class="gb game6BScore" data-osb-component="field" data-osb-field="game6BScore">0</span></span></span></span>
  </section>
  <div class="osb-aux"><span class="currentAMatchScore" data-osb-component="field" data-osb-field="currentAMatchScore">0</span><span class="currentBMatchScore" data-osb-component="field" data-osb-field="currentBMatchScore">0</span><span class="shotClockStatus" data-osb-component="field" data-osb-field="shotClockStatus"></span><span class="possession" data-osb-component="field" data-osb-field="possession"></span><div class="point-slot"><span class="isGamePoint" data-osb-component="field" data-osb-field="isGamePoint" style="opacity: 0;">GAME POINT</span><span class="isMatchPoint" data-osb-component="field" data-osb-field="isMatchPoint" style="opacity: 0;">MATCH POINT</span></div></div>
</main>
</body>
</html>
