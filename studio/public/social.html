<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social graphics | ProScoreboard Studio</title>
  <link rel="stylesheet" href="/social.css"><script type="module" src="/social.js"></script>
</head>
<body>
  <header class="app-header"><a class="brand" href="/" data-leave><img src="/brand/icon.webp" alt="">ProScoreboard <span>Studio</span></a><nav aria-label="Studio"><a href="/" data-leave>Scoreboards</a><a href="/social.html" aria-current="page" data-leave>Social graphics</a></nav><span id="connection">Connecting</span></header>
  <div id="notice" role="status" hidden><span id="notice-text"></span><button id="reload">Reload latest</button><button id="dismiss" title="Dismiss notice" aria-label="Dismiss notice">&#215;</button></div>
  <div id="unsaved" role="status" hidden>Unsaved changes: <span id="dirty-detail"></span></div>
  <main class="workspace">
    <aside class="library" aria-label="Template library"><div class="heading"><h2>Templates</h2><span id="template-count">0</span></div><input id="search" type="search" aria-label="Search templates" placeholder="Search templates"><label>Category<select id="category"><option value="">All categories</option></select></label><label>Preset<select id="preset-filter"><option value="">All presets</option></select></label><div id="template-list"></div></aside>
    <section class="editor" aria-label="Social graphic editor">
      <div class="document-heading"><div><h1 id="template-title">Social graphics</h1><div id="template-meta"></div></div><button id="save-source" class="primary" disabled>Save JSON</button></div>
      <div class="toolbar"><div class="tabs" role="tablist" aria-label="Editor views"><button id="design-tab" role="tab" aria-controls="design-panel" aria-selected="true">Design</button><button id="source-tab" role="tab" aria-controls="source-panel" aria-selected="false">Raw JSON</button><button id="review-tab" role="tab" aria-controls="review-panel" aria-selected="false">Review <span id="note-count">0</span></button></div><button id="export-png" disabled>Export PNG</button></div>
      <section id="design-panel" role="tabpanel" aria-labelledby="design-tab"><div class="preview-toolbar"><label class="inline"><input type="checkbox" id="samples-enabled" checked>Sample values</label><output id="canvas-size"></output><span id="render-status" role="status"></span></div><div id="preview-viewport"><div id="canvas-stage"><canvas id="preview" aria-label="Social graphic preview" tabindex="0"></canvas><div id="selection-outline" hidden></div></div></div><details class="samples"><summary>Sample values</summary><div id="sample-fields" class="form-grid"></div></details></section>
      <section id="source-panel" role="tabpanel" aria-labelledby="source-tab" hidden><div class="source-heading"><span id="source-hash"></span><button id="apply-source">Apply JSON to preview</button></div><textarea id="source" aria-label="Raw template JSON" spellcheck="false"></textarea><p id="validation" role="status"></p></section>
      <section id="review-panel" role="tabpanel" aria-labelledby="review-tab" hidden><div class="heading"><h2>Review notes</h2><button id="export-brief" disabled>Export agent brief</button></div><form id="note-form"><div class="form-grid"><label>Kind<select id="note-kind"><option value="add">Add</option><option value="remove">Remove</option><option value="restyle">Restyle</option><option value="binding">Binding</option><option value="general">General</option></select></label><label>Status<select id="note-status"><option value="open">Open</option><option value="resolved">Resolved</option></select></label><label class="wide">Layer<select id="note-target"><option value="">Template-level</option></select></label><label class="wide">Requested change<textarea id="note-text" rows="4" maxlength="8000" required></textarea></label></div><div class="actions"><button id="cancel-note" type="button" hidden>Cancel edit</button><button id="add-note" type="submit" class="primary">Add note</button></div></form><div class="heading"><span id="review-summary">0 open</span><button id="save-notes" disabled>Save notes</button></div><div id="note-list"></div></section>
    </section>
    <aside class="inspector" aria-label="Layer inspector"><div class="heading"><h2>Layers</h2><span id="layer-count">0</span></div><div class="layer-tools"><select id="add-type" aria-label="New layer type"><option value="text">Text</option><option value="boundText">Bound text</option><option value="shape">Shape</option><option value="image">Image</option></select><button id="add-layer" title="Add layer" aria-label="Add layer">+</button><button id="duplicate-layer" title="Duplicate layer" aria-label="Duplicate layer">&#10697;</button><button id="remove-layer" title="Remove layer" aria-label="Remove layer">&#8722;</button><button id="raise-layer" title="Raise layer" aria-label="Raise layer">&#8593;</button><button id="lower-layer" title="Lower layer" aria-label="Lower layer">&#8595;</button></div><div id="layer-list" aria-label="Layers"></div><div class="heading"><h2>Properties</h2><button id="clear-selection" title="Clear selection" aria-label="Clear selection">&#215;</button></div><div id="selected-id">Template</div><form id="properties" class="form-grid"></form><details><summary>Captured properties</summary><pre id="layer-json"></pre></details></aside>
  </main>
</body>
</html>
